[workspace]
resolver = "2"
members = [
    "crates/rue-ast",
    "crates/rue-lexer",
    "crates/rue-parser",
    "crates/rue-semantic",
    "crates/rue-compiler",
    "crates/rue-codegen",
    "crates/rue",
    "crates/rue-lsp",
    "crates/rue-runtime",
    "crates/rue-ir",
    "crates/rue-lowering",
    "crates/rue-optimize",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
rue-ast = { path = "crates/rue-ast" }
rue-lexer = { path = "crates/rue-lexer" }
rue-parser = { path = "crates/rue-parser" }
rue-semantic = { path = "crates/rue-semantic" }
rue-compiler = { path = "crates/rue-compiler" }
rue-codegen = { path = "crates/rue-codegen" }
rue = { path = "crates/rue" }
rue-lsp = { path = "crates/rue-lsp" }
rue-runtime = { path = "crates/rue-runtime" }
rue-ir = { path = "crates/rue-ir" }
rue-lowering = { path = "crates/rue-lowering" }
rue-optimize = { path = "crates/rue-optimize" }
atty = "0.2"
bpaf = "0.9.20"
criterion = "0.5.0"
indexmap = "2.0.0"
object = { version = "0.37.1", features = ["write"] }
regex = "1.0.0"
salsa = "0.22"
serde_json = "1.0.0"
tempfile = "3.8.0"
thiserror = "2.0.12"
tokio = { version = "1.0", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-tree = "0.3"