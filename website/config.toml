# Rue Language Website
base_url = "https://rue-lang.dev"
title = "Rue"
description = "A systems programming language with memory safety and high-level ergonomics"
compile_sass = false
minify_html = true
generate_feeds = true
feed_filenames = ["rss.xml"]
build_search_index = true

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_path = true
include_content = true

[markdown]
highlight_code = true
highlight_theme = "css"
extra_syntaxes_and_themes = ["syntaxes"]
highlight_themes_css = [
  { theme = "gruvbox-dark", filename = "syntax-dark.css" },
  { theme = "gruvbox-light", filename = "syntax-light.css" },
]

[slugify]
paths = "on"

[extra]
github_url = "https://github.com/rue-language/rue"
bluesky_url = "https://bsky.app/profile/rue-lang.dev"
