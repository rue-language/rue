# Definitions of third-party libraries used for buck2 builds of rue
#
# Note: This file is **not** used by a regular Cargo build of rue

[workspace]

[package]
# Pseudo-package whose dependencies are imported and buckified
name = "third-party"
version = "0.0.0"
publish = false
edition = "2024"

# Do-nothing target to keep Cargo happy
[[bin]]
name = "top"
path = "top/main.rs"

# BEGIN: DEPENDENCIES

[workspace.package]
edition = "2024"
version = "0.1.0"

[dependencies]
atty = "0.2"
bpaf = "0.9.20"
criterion = "0.5.0"
indexmap = { version = "2.0.0", features = ["serde"] }
object = { version = "0.37.1", features = ["write"] }
regex = "1.0.0"
salsa = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.0"
tempfile = "3.8.0"
thiserror = "2.0.12"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-tree = "0.3"
rustc-hash = "2.0"
anyhow = "1.0.99"
camino = "1.1"
bstr = "1.6"
similar = "2.2"
walkdir = "2.4"
clap = { version = "4.4", features = ["derive"] }
once_cell = "1.19"
proptest = "1.5"
# END: DEPENDENCIES
