[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
publish = false
edition = "2024"

# Fake binary to satisfy Cargo
[[bin]]
name = "fake"
path = "/dev/null"

[dependencies]
ahash = "0.8"
annotate-snippets = "0.11"
anyhow = "1.0"
libc = "0.2"
libtest2-mimic = "0.0.4"
logos = "0.14"
once_cell = "1.19"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
lasso = { version = "0.7", features = ["multi-threaded"] }
tempfile = "3"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rayon = "1.10"
fixedbitset = "0.5"
itoa = "1.0"
proptest = "1.5"
smallvec = "1.15"
sha2 = { version = "0.10.9", default-features = false }
