[section]
id = "appendices.grammar"
spec_chapter = "A"
name = "Grammar"
description = "Tests for the parsing requirements of Appendix A: every grammar decision point is settled by its follower token in one committed pass (RUE-1107)."

# =============================================================================
# Committed parsing (A.2)
# =============================================================================

[[case]]
name = "each_decision_point_is_settled_by_its_follower"
spec = ["A.2:1", "A.2:4"]
description = "The A.2:4 program: every decision point of A.2:2 in one committed pass, each settled by the token that follows"
source = """
fn f(c: bool) -> i32 {
    if c { 1 } else { 2 }
    let a = [1; 3];
    let b = [1, 2, 3];
    loop { if c { break } break }
    if c { return a[0] }
    b[2]
}

fn main() -> i32 {
    f(false) * 10 + f(true)
}
"""
exit_code = 31

