[section]
id = "expressions.for"
spec_chapter = "4.8"
name = "For Loop Expressions"
description = """
Built-in `for` loops (RUE-220, ADR-0037) iterate in read mode over an array, a
StrBuf's bytes, or a StrBuf's `.chars()` scalar view.
"""

# =============================================================================
# Arrays
# =============================================================================

[[case]]
name = "for_array_sum"
spec = ["4.8:23", "4.8:24", "4.8:25", "4.8:26"]
source = """
fn main() -> i32 {
    let a: [i32; 3] = [10, 20, 30];
    let mut sum = 0;
    for x in a {
        sum = sum + x;
    }
    sum
}
"""
exit_code = 60

# =============================================================================
# Struct Literal Ambiguity
# =============================================================================

[[case]]
name = "empty_for_body_after_identifier_iterable"
spec = ["4.8:31"]
source = """
fn main() -> i32 {
    let a: [i32; 3] = [10, 20, 30];
    for x in a {}
    42
}
"""
exit_code = 42

[[case]]
name = "bare_struct_literal_for_iterable_requires_parens"
spec = ["4.8:31"]
source = """
struct Point { x: i32 }
fn main() -> i32 {
    for x in Point { x: 1 } {}
    0
}
"""
compile_fail = true
error_contains = "bare for iterable"

# Iteration is a shared read (4.8:26): a non-Copy element type is bound by
# shared borrow, NOT moved out of the array, so the loop compiles and reads
# fields fine (RUE-259 — previously wrongly rejected E0904 "cannot move out of
# indexed position").
[[case]]
name = "for_array_non_copy_element"
spec = ["4.8:25", "4.8:26"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let a = [Point { x: 1, y: 2 }, Point { x: 3, y: 4 }];
    let mut sum = 0;
    for p in a {
        sum = sum + p.x;
    }
    sum
}
"""
exit_code = 4

# Because the element is borrowed (not moved out), the ARRAY still owns each
# element and drops it exactly once at scope exit — the per-element destructor
# runs once per element, driven by the array, not the loop binder (RUE-259).
[[case]]
name = "for_array_non_copy_destructor_once"
spec = ["4.8:26"]
source = """
struct Res { tag: i32 }
drop fn Res(self) { @dbg(self.tag); }
fn main() -> i32 {
    let a = [Res { tag: 11 }, Res { tag: 22 }];
    let mut total = 0;
    for r in a {
        total = total + r.tag;
    }
    total
}
"""
exit_code = 33
expected_stdout = "11\n22\n"

# The element binding is a shared borrow: it may be read but not moved out of
# the collection (that would double-drop — the new owner and the array would
# both drop it). Moving the whole binder is rejected (RUE-259).
[[case]]
name = "for_move_element_out_error"
spec = ["4.8:26"]
source = """
struct Res { tag: i32 }
drop fn Res(self) { @dbg(self.tag); }
fn eat(r: Res) -> i32 { r.tag }
fn main() -> i32 {
    let a = [Res { tag: 1 }, Res { tag: 2 }];
    let mut s = 0;
    for r in a {
        s = s + eat(r);
    }
    s
}
"""
compile_fail = true
error_contains = "cannot move out of borrowed value"

# Iteration holds a shared borrow of the collection for the loop's duration, so
# mutating it in the body — here via an `inout self` StrBuf method — is a
# compile-time exclusivity error, not a runtime miscompile (RUE-257).
[[case]]
name = "for_mutate_collection_in_body_error"
spec = ["4.8:26"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut s: StrBuf = "abc";
    for c in s.chars() {
        s.clear();
        @dbg(c);
    }
    0
}
"""
compile_fail = true
error_contains = "cannot mutate borrowed value"

# The collection is borrowed for the loop, not consumed: a StrBuf iterated in a
# `for` stays usable afterward (a second loop would be a use-after-move if the
# first had moved it).
[[case]]
name = "for_string_borrows_not_consumes"
spec = ["4.8:26"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "abcd";
    let mut count = 0;
    for _b in s {
        count = count + 1;
    }
    for _b in s {
        count = count + 1;
    }
    count
}
"""
exit_code = 8

# =============================================================================
# StrBuf byte view
# =============================================================================

[[case]]
name = "for_string_bytes_count"
spec = ["4.8:25"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "abc";
    let mut count = 0;
    for _b in s {
        count = count + 1;
    }
    count
}
"""
exit_code = 3

# "café" is 5 bytes (é is 2 UTF-8 bytes), so the byte view yields 5 elements.
[[case]]
name = "for_string_bytes_multibyte"
spec = ["4.8:25"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "café";
    let mut count = 0;
    for _b in s {
        count = count + 1;
    }
    count
}
"""
exit_code = 5

# =============================================================================
# StrBuf char (Unicode scalar) view
# =============================================================================

[[case]]
name = "for_chars_scalars"
spec = ["4.8:25", "3.7:31"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "café";
    let mut count = 0;
    for c in s.chars() {
        @dbg(c);
        count = count + 1;
    }
    count
}
"""
exit_code = 4
expected_stdout = "99\n97\n102\n233\n"

# =============================================================================
# break / continue
# =============================================================================

[[case]]
name = "for_break_continue"
spec = ["4.8:27"]
source = """
fn main() -> i32 {
    let a: [i32; 5] = [1, 2, 3, 4, 5];
    let mut sum = 0;
    for x in a {
        if x == 4 {
            break;
        }
        if x == 2 {
            continue;
        }
        sum = sum + x;
    }
    sum
}
"""
exit_code = 4

[[case]]
name = "for_nested"
spec = ["4.8:23"]
source = """
fn main() -> i32 {
    let a: [i32; 2] = [1, 2];
    let b: [i32; 3] = [10, 20, 30];
    let mut sum = 0;
    for x in a {
        for y in b {
            sum = sum + x + y;
        }
    }
    sum
}
"""
exit_code = 129

# =============================================================================
# Invalid UTF-8 during char decoding traps (ADR-0035)
# =============================================================================

# substring(0, 4) of "café" keeps the lead byte of `é` (0xC3) without its
# continuation, so decoding the 4th character traps.
[[case]]
name = "for_chars_invalid_utf8_traps"
spec = ["4.8:28", "3.7:32"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let full: StrBuf = "café";
    let s = full.substring(0, 4);
    for c in s.chars() {
        @dbg(c);
    }
    0
}
"""
exit_code = 101
expected_stdout = "99\n97\n102\n"

# =============================================================================
# Lossy char iteration: `.chars_lossy()` substitutes U+FFFD, never traps
# (ADR-0035, RUE-17 Phase 3)
# =============================================================================

# Over well-formed UTF-8, the lossy view decodes identically to `.chars()`.
[[case]]
name = "for_chars_lossy_valid"
spec = ["3.7:34"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "café";
    let mut count = 0;
    for c in s.chars_lossy() {
        @dbg(c);
        count = count + 1;
    }
    count
}
"""
exit_code = 4
expected_stdout = "99\n97\n102\n233\n"

# substring(0, 4) of "café" keeps the lead byte of `é` (0xC3) without its
# continuation. The strict view traps here; the lossy view substitutes one
# U+FFFD (65533) for the truncated sequence and finishes without trapping.
[[case]]
name = "for_chars_lossy_replaces_invalid"
spec = ["3.7:34"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let full: StrBuf = "café";
    let s = full.substring(0, 4);
    let mut count = 0;
    for c in s.chars_lossy() {
        @dbg(c);
        count = count + 1;
    }
    count
}
"""
exit_code = 4
expected_stdout = "99\n97\n102\n65533\n"

# A non-iterable operand is rejected.
[[case]]
name = "for_non_iterable_rejected"
spec = ["4.8:25"]
source = """
fn main() -> i32 {
    let n = 5;
    for x in n {
        let _y = x;
    }
    0
}
"""
compile_fail = true
error_contains = "array or a StrBuf"

# =============================================================================
# By-reference iterables (RUE-2052)
#
# Iteration is a shared read (4.8:26), so the iterable never has to be owned by
# the iterating function: a `borrow` or an `inout` parameter is read through its
# loan exactly as a local is.
# =============================================================================

# The reported program: a `borrow StrBuf` parameter is iterable, because reading
# it for the bound and for each byte is a loan rather than a move out of the
# borrow (previously rejected E0429).
[[case]]
name = "for_borrow_strbuf_parameter"
spec = ["4.8:25", "4.8:26"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn count_spaces(borrow s: StrBuf) -> u64 {
    let mut n: u64 = 0;
    for b in s {
        if b == 32 { n += 1; }
    }
    n
}

fn main() -> i32 {
    let s: StrBuf = "a b c";
    @intCast(count_spaces(borrow s))
}
"""
exit_code = 2

# The `.chars()` scalar view of a `borrow` parameter is the same shared read.
[[case]]
name = "for_chars_of_borrow_strbuf_parameter"
spec = ["4.8:25", "4.8:26"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn count_chars(borrow s: StrBuf) -> u64 {
    let mut n: u64 = 0;
    for _c in s.chars() {
        n += 1;
    }
    n
}

fn main() -> i32 {
    let s: StrBuf = "café";
    @intCast(count_chars(borrow s))
}
"""
exit_code = 4

# Reading an `inout` parameter in a `for` is a shared read, not a write: it is
# accepted, and the parameter is still a mutable place afterward, so the
# caller's variable sees the later mutation.
[[case]]
name = "for_inout_strbuf_parameter_reads"
spec = ["4.8:26"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn count_then_push(inout s: StrBuf) -> u64 {
    let mut n: u64 = 0;
    for b in s {
        if b == 32 { n += 1; }
    }
    s.push(33);
    n
}

fn main() -> i32 {
    let mut s: StrBuf = "a b c";
    let n = count_then_push(inout s);
    @intCast(n + s.len())
}
"""
exit_code = 8

# A local StrBuf iterated by a `for` is borrowed, not moved: it is still usable
# after the loop.
[[case]]
name = "for_local_strbuf_usable_after_loop"
spec = ["4.8:26"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn main() -> i32 {
    let s: StrBuf = "a b c";
    let mut n: u64 = 0;
    for b in s {
        if b == 32 { n += 1; }
    }
    @intCast(n + s.len())
}
"""
exit_code = 7

# An array with non-Copy elements passed `borrow` is iterable for the same
# reason: the loop reads the elements through the parameter's loan and moves
# nothing out of it.
[[case]]
name = "for_borrow_array_of_non_copy_elements"
spec = ["4.8:25", "4.8:26"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn total_len(borrow a: [StrBuf; 2]) -> u64 {
    let mut t: u64 = 0;
    for s in a {
        t += s.len();
    }
    t
}

fn main() -> i32 {
    let a: [StrBuf; 2] = ["ab", "cde"];
    let n = total_len(borrow a);
    @intCast(n + a[0].len())
}
"""
exit_code = 7

# A by-value temporary iterable has no owner outside the loop, so the `for`
# binds it once and its destructor still runs exactly once, after the loop.
[[case]]
name = "for_temporary_iterable_dropped_once_after_loop"
spec = ["4.8:26"]
source = """
struct Res { tag: i32 }
drop fn Res(self) { @dbg(self.tag); }
fn make() -> [Res; 2] { [Res { tag: 7 }, Res { tag: 8 }] }
fn main() -> i32 {
    let mut total = 0;
    for r in make() {
        total = total + r.tag;
    }
    @dbg(99);
    total
}
"""
exit_code = 15
expected_stdout = "7\n8\n99\n"
