[section]
id = "expressions.call"
spec_chapter = "4.10"
name = "Call Expressions"
description = "Function call expressions invoke functions with arguments."

# =============================================================================
# Basic Function Calls
# =============================================================================

[[case]]
name = "call_no_args"
spec = ["4.10:2", "4.10:3"]
source = """
fn foo() -> i32 { 42 }
fn main() -> i32 { foo() }
"""
exit_code = 42

[[case]]
name = "call_one_arg"
spec = ["4.10:3", "4.10:4"]
source = """
fn double(x: i32) -> i32 { x * 2 }
fn main() -> i32 { double(21) }
"""
exit_code = 42

[[case]]
name = "call_multiple_args"
spec = ["4.10:3", "4.10:4"]
source = """
fn add(x: i32, y: i32) -> i32 { x + y }
fn main() -> i32 { add(20, 22) }
"""
exit_code = 42

# =============================================================================
# Argument Count Must Match
# =============================================================================

[[case]]
name = "too_few_arguments"
error_contains = "[E0207]"
expected_error_code = "E0207"
spec = ["4.10:3"]
source = """
fn add(x: i32, y: i32) -> i32 { x + y }
fn main() -> i32 { add(42) }
"""
compile_fail = true

[[case]]
name = "too_many_arguments"
error_contains = "[E0207]"
spec = ["4.10:3"]
source = """
fn foo(x: i32) -> i32 { x }
fn main() -> i32 { foo(1, 2) }
"""
compile_fail = true

# =============================================================================
# Argument Types Must Match
# =============================================================================

[[case]]
name = "argument_type_mismatch"
error_contains = "[E0206]"
expected_error_code = "E0206"
spec = ["4.10:4"]
source = """
fn foo(x: i32) -> i32 { x }
fn main() -> i32 { foo(true) }
"""
compile_fail = true

# =============================================================================
# Exact source-level argument modes (RUE-634)
# =============================================================================

[[case]]
name = "call_argument_mode_mismatch_{mismatch}"
spec = ["4.10:3"]
description = "Every explicit call argument must exactly match its parameter's source mode; the non-place and duplicate-root instances also pin mode checking before place/exclusivity diagnostics."
source = "{source}"
compile_fail = true
error_contains = "[{error}]"
params = [
  { mismatch = "normal_from_inout_before_exclusivity", error = "E0209", source = "fn take(a: i32, b: i32) {}\nfn main() {\n    let mut x = 1;\n    take(inout x, inout x);\n}" },
  { mismatch = "normal_from_borrow_before_place", error = "E0209", source = "fn take(x: i32) {}\nfn main() { take(borrow 7); }" },
  { mismatch = "inout_from_normal", error = "E0431", source = "fn take(inout x: i32) {}\nfn main() { take(7); }" },
  { mismatch = "inout_from_borrow_before_place", error = "E0431", source = "fn take(inout x: i32) {}\nfn main() { take(borrow 7); }" },
  { mismatch = "borrow_from_normal", error = "E0432", source = "fn take(borrow x: i32) {}\nfn main() { take(7); }" },
  { mismatch = "borrow_from_inout_before_place", error = "E0432", source = "fn take(borrow x: i32) {}\nfn main() { take(inout 7); }" },
]

[[case]]
name = "unmarked_call_surface_rejects_borrow_{surface}"
spec = ["4.10:3"]
description = "Every call-like surface rejects an explicit borrow on an unmarked parameter or payload slot."
source = "{source}"
real_std = true
compile_fail = true
error_contains = "[E0209]"
params = [
  { surface = "function_alias", source = "fn take(x: i32) {}\nconst alias = take;\nfn main() { let x = 1; alias(borrow x); }" },
  { surface = "generic_runtime_param", source = "fn take(comptime T: type, x: T) -> T { x }\nfn main() -> i32 { let x = 1; take(i32, borrow x) }" },
  { surface = "user_method", source = "struct S {\n    value: i32,\n    fn take(self, x: i32) -> i32 { self.value + x }\n}\nfn main() -> i32 { let s = S { value: 40 }; let x = 2; s.take(borrow x) }" },
  { surface = "user_associated_function", source = "struct S {\n    value: i32,\n    fn take(x: i32) -> i32 { x }\n}\nfn main() -> i32 { let x = 42; S.take(borrow x) }" },
  { surface = "print_builtin", source = "const std = @import(\"std\");\nconst StrBuf = std.strbuf.StrBuf;\nfn main() { let s: StrBuf = \"x\"; print(borrow s); }" },
  { surface = "builtin_method", source = "const std = @import(\"std\");\nconst StrBuf = std.strbuf.StrBuf;\nfn main() { let mut s = StrBuf.new(); let byte: u8 = 65; s.push(borrow byte); }" },
  { surface = "builtin_associated_function", source = "const std = @import(\"std\");\nconst StrBuf = std.strbuf.StrBuf;\nfn main() { let cap: u64 = 8; let _s = StrBuf.with_capacity(borrow cap); }" },
  { surface = "enum_tuple_payload", source = "enum E { V(i32) }\nfn main() -> i32 { let x = 42; let _e = E.V(borrow x); 0 }" },
]

[[case]]
name = "module_member_unmarked_param_rejects_borrow"
spec = ["4.10:3"]
description = "A module-qualified function call enforces the same exact source-mode contract as an unqualified call."
source = """
const m = @import("mode_helper.rue");

fn main() -> i32 {
    let x = 42;
    m.take(borrow x)
}
"""
aux_files = { "mode_helper.rue" = "pub fn take(x: i32) -> i32 { x }" }
compile_fail = true
error_contains = "[E0209]"

# =============================================================================
# Return Type
# =============================================================================

[[case]]
name = "call_return_type"
spec = ["4.10:5"]
source = """
fn returns_i32() -> i32 { 42 }
fn main() -> i32 {
    let x: i32 = returns_i32();
    x
}
"""
exit_code = 42

# =============================================================================
# Argument Evaluation Order
# =============================================================================

[[case]]
name = "args_left_to_right"
spec = ["4.10:7"]
source = """
fn sub(x: i32, y: i32) -> i32 { x - y }
fn main() -> i32 { sub(50, 8) }
"""
exit_code = 42

# =============================================================================
# Value Denotation (RUE-298)
# A call expression denotes the value returned by invoking the function.
# =============================================================================

[[case]]
name = "call_denotes_return_value"
spec = ["4.10:9"]
source = """
fn answer() -> i32 { 42 }
fn main() -> i32 {
    answer()
}
"""
exit_code = 42

[[case]]
name = "call_denotes_computed_return_value"
spec = ["4.10:9"]
source = """
fn add(x: i32, y: i32) -> i32 { x + y }
fn main() -> i32 {
    // The call expression denotes the value produced by the body: 40 + 2.
    add(40, 2)
}
"""
exit_code = 42

[[case]]
name = "callable_const_alias_invokes_function"
spec = ["4.10:12", "6.5:15"]
description = "A function-valued const is a callable alias, and calling it is equivalent to calling the aliased function."
source = """
const f = answer;

fn answer() -> i32 { 42 }

fn main() -> i32 { f() }
"""
exit_code = 42

[[case]]
name = "callable_const_alias_not_runtime_value"
spec = ["6.5:15"]
description = "A function-valued const is not a first-class runtime value."
source = """
const f = answer;

fn answer() -> i32 { 42 }

fn main() -> i32 {
    let x = f;
    0
}
"""
compile_fail = true
error_contains = "[E0434]"
