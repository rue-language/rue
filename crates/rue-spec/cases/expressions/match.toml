[[case]]
name = "nested_variant_pattern_droppable_beside_nested_position"
spec = ["4.7:38", "4.7:40"]
description = "A droppable payload bound at one position and a nested pattern at the other are each accounted for once, at the end of the arm."
source = """
struct Res { id: i32 }
drop fn Res(self) { @dbg(self.id); }
enum Inner { Full(Res), Nothing }
enum Outer { Pair(Inner, Inner), Empty }

fn take(o: Outer) -> i32 {
    match o {
        Outer.Pair(Inner.Full(r), Inner.Nothing) => r.id,
        Outer.Pair(first, Inner.Full(s)) => match first {
            Inner.Full(t) => s.id + t.id,
            Inner.Nothing => s.id,
        },
        Outer.Pair(Inner.Nothing, Inner.Nothing) => 1,
        Outer.Empty => 2,
    }
}

fn main() -> i32 {
    let a = take(Outer.Pair(Inner.Full(Res { id: 3 }), Inner.Nothing));
    @dbg(-1);
    let b = take(Outer.Pair(Inner.Nothing, Inner.Full(Res { id: 4 })));
    @dbg(-2);
    let c = take(Outer.Empty);
    a + b + c
}
"""
