# =============================================================================
# Patterns with Payload Bindings (RUE-221, ADR-0038)
# =============================================================================

# A tuple-variant pattern binds the payload; the arity must match (4.7:30).
[[case]]
name = "match_payload_binding_extracts"
spec = ["4.7:2", "4.7:30"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    match Shape.Rect(3, 4) {
        Shape.Circle(r) => r,
        Shape.Rect(w, h,) => w + h,
        Shape.Empty => 0,
    }
}
"""
exit_code = 7

# A `_` binding position discards a payload field without binding it, and may
# repeat (`Rect(_, _)`) since it introduces no name (4.7:30, RUE-601).
[[case]]
name = "match_payload_wildcard_discard"
spec = ["4.7:2", "4.7:30"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    let a = match Shape.Rect(40, 2) { Shape.Rect(w, _) => w, Shape.Circle(r) => r, Shape.Empty => 0 };
    let b = match Shape.Rect(40, 2) { Shape.Rect(_, h) => h, Shape.Circle(r) => r, Shape.Empty => 0 };
    let c = match Shape.Rect(1, 1)  { Shape.Rect(_, _) => 0, Shape.Circle(r) => r, Shape.Empty => 9 };
    a + b + c
}
"""
exit_code = 42

# The bare-path carve-out (4.7:30, RUE-1592): a payload-carrying variant
# written with no binding list IS the all-wildcard form, so it is exempt from
# the arity rule that rejects `Shape.Rect(w)` above with E0207.
[[case]]
name = "match_bare_variant_pattern_is_all_wildcard_form"
spec = ["4.7:2", "4.7:30", "4.7:34"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    let a = match Shape.Rect(3, 4) { Shape.Rect => 40, Shape.Circle(r) => r, Shape.Empty => 0 };
    let b = match Shape.Circle(9)  { Shape.Rect(_, _) => 0, Shape.Circle => 2, Shape.Empty => 0 };
    a + b
}
"""
exit_code = 42

# A discarded payload field is a fresh unnameable binding, so a LINEAR one can
# never discharge its must-consume obligation and is rejected (4.7:30, 3.8:50;
# RUE-1592 ruling of 2026-08-22 — this previously compiled silently).
[[case]]
name = "match_payload_wildcard_over_linear_rejected"
spec = ["4.7:30", "3.8:50"]
source = """
linear struct L { v: i32 }
enum E { A(L), B }
fn main() -> i32 {
    let e = E.A(L { v: 5 });
    match e {
        E.A(_) => 1,
        E.B => 2,
    }
}
"""
compile_fail = true
error_contains = "[E0486]"

# The bare form is the all-wildcard form, so it is rejected identically
# (4.7:30 bare-path carve-out, RUE-1592).
[[case]]
name = "match_bare_variant_over_linear_payload_rejected"
spec = ["4.7:30", "3.8:50"]
source = """
linear struct L { v: i32 }
enum E { A(L), B }
fn main() -> i32 {
    let e = E.A(L { v: 5 });
    match e {
        E.A => 1,
        E.B => 2,
    }
}
"""
compile_fail = true
error_contains = "[E0486]"

# Control: the same shapes over a NON-linear payload keep compiling (4.7:30).
[[case]]
name = "match_payload_wildcard_over_affine_payload_is_legal"
spec = ["4.7:30"]
source = """
struct P { v: i32 }
enum E { A(P), B }
fn main() -> i32 {
    let e = E.A(P { v: 5 });
    let a = match e { E.A(_) => 20, E.B => 0 };
    let f = E.A(P { v: 5 });
    let b = match f { E.A => 22, E.B => 0 };
    a + b
}
"""
exit_code = 42

# A NAMED payload binding is an ordinary local living in its arm's scope, so
# a linear one carries the usual must-consume obligation there (4.7:31,
# 3.8:32). This compiled silently before RUE-1603: the arm scope was popped
# without the linear leak check that block exit runs.
[[case]]
name = "match_named_linear_payload_binding_unconsumed_rejected"
spec = ["4.7:31", "3.8:32", "3.8:35"]
source = """
