# =============================================================================
# Patterns with Payload Bindings (RUE-221, ADR-0038)
# =============================================================================

# A tuple-variant pattern binds the payload; the arity must match (4.7:30).
[[case]]
name = "match_payload_binding_extracts"
spec = ["4.7:30"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    match Shape.Rect(3, 4) {
        Shape.Circle(r) => r,
        Shape.Rect(w, h) => w + h,
        Shape.Empty => 0,
    }
}
"""
exit_code = 7

# A `_` binding position discards a payload field without binding it, and may
# repeat (`Rect(_, _)`) since it introduces no name (4.7:30, RUE-601).
[[case]]
name = "match_payload_wildcard_discard"
spec = ["4.7:30"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    let a = match Shape.Rect(40, 2) { Shape.Rect(w, _) => w, Shape.Circle(r) => r, Shape.Empty => 0 };
    let b = match Shape.Rect(40, 2) { Shape.Rect(_, h) => h, Shape.Circle(r) => r, Shape.Empty => 0 };
    let c = match Shape.Rect(1, 1)  { Shape.Rect(_, _) => 0, Shape.Circle(r) => r, Shape.Empty => 9 };
    a + b + c
}
"""
exit_code = 42

# Bindings move the payload out in value context and are usable in the arm
# body (4.7:31).
[[case]]
name = "match_payload_binding_move_mode"
spec = ["4.7:31"]
source = """
enum Wrap { One(i32) }
fn main() -> i32 {
    let w = Wrap.One(10);
    match w {
        Wrap.One(x) => x + x,
    }
}
"""
exit_code = 20

# Wrong number of bindings for a variant's payload arity is rejected (4.7:30).
[[case]]
name = "match_payload_binding_wrong_arity"
error_contains = "[E0207]"
spec = ["4.7:30"]
source = """
enum Shape { Rect(i32, i32) }
fn main() -> i32 {
    match Shape.Rect(3, 4) {
        Shape.Rect(w) => w,
    }
}
"""
compile_fail = true

# Each payload binding must be a fresh name (4.7:30). Reusing an identifier —
# `Rect(w, w)` — silently shadowed the earlier binding and lost its value;
# it is now an E0484 error (RUE-269, analogous to Rust E0416).
[[case]]
name = "match_payload_binding_duplicate_name"
spec = ["4.7:30"]
source = """
enum Shape { Rect(i32, i32) }
fn main() -> i32 {
    match Shape.Rect(3, 4) {
        Shape.Rect(w, w) => w,
    }
}
"""
compile_fail = true
error_contains = "bound more than once"

# =============================================================================
# Scrutinee access mode (RUE-299): a match uses its scrutinee in value context.
# =============================================================================

# A Copy scrutinee is copied by the match and remains valid afterward (4.7:33).
[[case]]
name = "match_copy_scrutinee_remains_valid"
spec = ["4.7:33"]
source = """
enum E { A(i32), B }
fn use_again(e: E) -> i32 { 2 }
fn main() -> i32 {
    let e = E.A(40);
    let r = match e {
        E.A(x) => x,
        E.B => 0,
    };
    r + use_again(e)
}
"""
exit_code = 42

# A move-type scrutinee is consumed by the match; using it afterward is a
# use-after-move error (4.7:33).
[[case]]
name = "match_move_scrutinee_consumed"
spec = ["4.7:33"]
source = """
struct Big { value: i32 }
enum E { A(Big), B }
fn use_again(e: E) -> i32 { 0 }
fn main() -> i32 {
    let e = E.A(Big { value: 7 });
    let r = match e {
        E.A(s) => s.value,
        E.B => 0,
    };
    r + use_again(e)
}
"""
compile_fail = true
error_contains = "use of moved value 'e'"

# A move-type scrutinee is consumed even when the matched arm binds no payload
# (4.7:34).
[[case]]
name = "match_move_scrutinee_consumed_without_binding"
spec = ["4.7:34"]
source = """
struct Big { value: i32 }
enum E { A(Big), B }
fn use_again(e: E) -> i32 { 0 }
fn main() -> i32 {
    let e = E.A(Big { value: 7 });
    let r = match e {
        E.A => 1,
        E.B => 2,
    };
    r + use_again(e)
}
"""
compile_fail = true
error_contains = "use of moved value 'e'"

[[case]]
# RUE-563: 4.7:12's same-type rule now carries its 4.14:19 exception in the
# text — a comptime-known scrutinee analyzes only the selected arm, so a
# differently-typed dead arm is legal (RUE-268 shipped this).
name = "comptime_match_dead_arm_different_type_ok"
spec = ["4.7:12", "4.14:19"]
description = "Unselected arms of a comptime match are exempt from the same-type rule; the match's type is the selected arm's type"
source = """
fn pick(comptime n: i32) -> i32 {
    match n {
        0 => true,
        _ => 42,
    }
}

fn main() -> i32 {
    pick(1)
}
"""
exit_code = 42
