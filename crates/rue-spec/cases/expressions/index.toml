[section]
id = "expressions.index"
spec_chapter = "4.11"
name = "Index Expressions"
description = "Index expressions access elements of arrays."

# =============================================================================
# Basic Array Indexing
# =============================================================================

[[case]]
name = "index_first_element"
spec = ["4.11:1", "4.11:2", "4.11:3"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[0]
}
"""
exit_code = 10

[[case]]
name = "index_last_element"
spec = ["4.11:1", "4.11:3"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 42];
    arr[2]
}
"""
exit_code = 42

# =============================================================================
# Index Type Must Be An Integer (Signed or Unsigned)
# =============================================================================

[[case]]
name = "index_with_unsigned_variable"
spec = ["4.11:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 1;
    arr[i]
}
"""
exit_code = 20

[[case]]
name = "index_type_bool_error"
spec = ["4.11:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[true]
}
"""
compile_fail = true
error_contains = "integer"

# A signed index type is accepted (spec 4.11:4 / 7.1:7). A negative value is
# not a type error; it traps at runtime via the bounds check (RUE-81).
[[case]]
name = "index_with_signed_i32_variable"
spec = ["4.11:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: i32 = 1;
    arr[i]
}
"""
exit_code = 20

[[case]]
name = "index_with_signed_i64_variable"
spec = ["4.11:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: i64 = 2;
    arr[i]
}
"""
exit_code = 30

# =============================================================================
# Result Type is Element Type
# =============================================================================

[[case]]
name = "index_result_type"
spec = ["4.11:5"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let x: i32 = arr[1];
    x
}
"""
exit_code = 20

# =============================================================================
# Compile-Time Bounds Checking
# =============================================================================

[[case]]
name = "constant_index_out_of_bounds"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[5]
}
"""
compile_fail = true

# A constant index is bounds-checked wherever it appears in a place chain, not
# only as the whole expression: `xs[5].a` names the same out-of-range element
# `xs[5]` does. Reading the field in a place context — a comparison operand
# (4.3:3f), a `borrow` argument, an `@dbg` operand — traces the chain through
# the same projection machinery as a value-context read, so all four spellings
# report E0902 at the index (RUE-2006).

[[case]]
name = "constant_index_out_of_bounds_in_field_chain"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
description = "A constant out-of-bounds index is rejected when a field is read through it"
source = """
struct P { a: i32, b: i32 }

fn main() -> i32 {
    let xs: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    xs[5].a
}
"""
compile_fail = true

[[case]]
name = "constant_index_out_of_bounds_in_field_chain_comparison_operand"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7", "4.3:3f"]
description = "The comparison operand's borrowing read of a field chain is bounds-checked too"
source = """
struct P { a: i32, b: i32 }

fn main() -> i32 {
    let xs: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    let ys: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    if xs[5].a == ys[0].a { 1 } else { 0 }
}
"""
compile_fail = true

[[case]]
name = "constant_index_out_of_bounds_in_field_chain_borrow_argument"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
description = "A `borrow` argument reading a field through an out-of-range element is rejected"
source = """
struct P { a: i32, b: i32 }

fn peek(borrow v: i32) -> i32 { v }

fn main() -> i32 {
    let xs: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    peek(borrow xs[5].a)
}
"""
compile_fail = true

[[case]]
name = "constant_index_out_of_bounds_in_field_chain_dbg_operand"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
description = "An `@dbg` operand reading a field through an out-of-range element is rejected"
source = """
struct P { a: i32, b: i32 }

fn main() -> i32 {
    let xs: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    @dbg(xs[5].a);
    0
}
"""
compile_fail = true

[[case]]
name = "constant_index_in_bounds_in_field_chain_runs"
spec = ["4.11:7", "4.3:3f"]
description = "The in-bounds forms of those same reads compile and run"
source = """
struct P { a: i32, b: i32 }

fn peek(borrow v: i32) -> i32 { v }

fn main() -> i32 {
    let xs: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    let ys: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    let equal = xs[1].a == ys[1].a;
    let borrowed = peek(borrow xs[0].a);
    @dbg(xs[1].b);
    if equal { borrowed + xs[1].a } else { 0 }
}
"""
exit_code = 4

# A write names an element the same way a read does. An assignment target is a
# place context and its base chain is not a use (3.8:76), but the element it
# names must still exist, so every traced write path applies the same
# constant-index check the reads above do: a field assignment through the
# element, a nested field or element assignment under it, an `inout` argument,
# a compound assignment, and an accessor receiver. Each reports E0902 at the
# index, with the span `xs[5].a` reports as a read (RUE-2008).

[[case]]
name = "constant_index_out_of_bounds_in_field_assignment"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
description = "Assigning a field through an out-of-range constant element is rejected"
source = """
struct P { a: i32, b: i32 }

fn main() -> i32 {
    let mut xs: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    xs[5].a = 7;
    xs[0].a
}
"""
compile_fail = true

[[case]]
name = "constant_index_out_of_bounds_in_nested_field_assignment"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
description = "The out-of-range element is found however deep the assigned field chain is"
source = """
struct Inner { b: i32 }
struct P { a: i32, inner: Inner }

fn main() -> i32 {
    let mut xs: [P; 2] = [
        P { a: 1, inner: Inner { b: 2 } },
        P { a: 3, inner: Inner { b: 4 } },
    ];
    xs[5].inner.b = 1;
    xs[0].a
}
"""
compile_fail = true

[[case]]
name = "constant_index_out_of_bounds_in_nested_element_assignment"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
description = "An element assignment reports the out-of-range index in its base, not only its own"
source = """
struct P { a: i32, arr: [i32; 2] }

fn main() -> i32 {
    let mut xs: [P; 2] = [P { a: 1, arr: [1, 2] }, P { a: 3, arr: [3, 4] }];
    xs[5].arr[0] = 1;
    xs[0].a
}
"""
compile_fail = true

[[case]]
name = "constant_index_out_of_bounds_in_inout_argument"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
description = "An `inout` argument naming a field of an out-of-range element is rejected"
source = """
struct P { a: i32, b: i32 }

fn bump(inout v: i32) { v = v + 1; }

fn main() -> i32 {
    let mut xs: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    bump(inout xs[5].a);
    xs[0].a
}
"""
compile_fail = true

[[case]]
name = "constant_index_out_of_bounds_in_compound_assignment"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7", "5.2:16"]
description = "A compound assignment through an out-of-range element is rejected"
source = """
struct P { a: i32, b: i32 }

fn main() -> i32 {
    let mut xs: [P; 2] = [P { a: 1, b: 2 }, P { a: 3, b: 4 }];
    xs[5].a += 1;
    xs[0].a
}
"""
compile_fail = true

[[case]]
name = "constant_index_out_of_bounds_in_accessor_receiver"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7", "6.6:15"]
description = "An accessor receiver written through an out-of-range element is rejected"
source = """
struct Cell { value: i64 }
struct P {
    cell: Cell,
    fn cell_mut(inout self) -> inout Cell { yield self.cell; }
}

fn main() -> i32 {
    let mut xs: [P; 2] = [P { cell: Cell { value: 1 } }, P { cell: Cell { value: 2 } }];
    xs[5].cell_mut().value = 7;
    0
}
"""
compile_fail = true

[[case]]
name = "constant_index_in_bounds_in_write_chain_runs"
spec = ["4.11:7", "4.11:12", "5.2:16", "6.6:15"]
description = "The in-bounds forms of those same writes compile and run"
source = """
struct Inner { b: i32 }
struct Cell { value: i32 }
struct P {
    a: i32,
    inner: Inner,
    arr: [i32; 2],
    cell: Cell,

    fn cell_mut(inout self) -> inout Cell { yield self.cell; }
}

fn bump(inout v: i32) { v = v + 1; }

fn main() -> i32 {
    let mut xs: [P; 2] = [
        P { a: 1, inner: Inner { b: 2 }, arr: [3, 4], cell: Cell { value: 5 } },
        P { a: 6, inner: Inner { b: 7 }, arr: [8, 9], cell: Cell { value: 10 } },
    ];
    xs[1].a = 7;
    xs[0].inner.b = 1;
    xs[1].arr[0] = 1;
    bump(inout xs[0].a);
    xs[1].inner.b += 1;
    xs[0].cell_mut().value = 3;
    xs[1].a + xs[0].inner.b + xs[1].arr[0] + xs[0].a + xs[1].inner.b + xs[0].cell.value
}
"""
exit_code = 22

# =============================================================================
# Runtime Bounds Checking
# =============================================================================

[[case]]
name = "runtime_index_out_of_bounds"
spec = ["4.11:8", "4.11:9"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 5;
    arr[i]
}
"""
runtime_error = "index out of bounds"

# =============================================================================
# Mutable Array Element Assignment
# =============================================================================

[[case]]
name = "mutable_array_assignment"
spec = ["4.11:12"]
source = """
fn main() -> i32 {
    let mut arr: [i32; 3] = [10, 20, 30];
    arr[1] = 42;
    arr[1]
}
"""
exit_code = 42

# =============================================================================
# Value Denotation (RUE-298)
# An index expression denotes the element stored at the given position.
# =============================================================================

[[case]]
name = "index_denotes_element_value"
spec = ["4.11:14"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 42, 100];
    // arr[1] denotes the element stored at position 1.
    arr[1]
}
"""
exit_code = 42

[[case]]
name = "index_denotes_element_after_store"
spec = ["4.11:14"]
source = """
fn main() -> i32 {
    let mut arr: [i32; 2] = [0, 0];
    arr[0] = 42;
    // The index expression reads back the value currently stored.
    arr[0]
}
"""
exit_code = 42

# =============================================================================
# Whole-Element Reads in a Place Context (RUE-1997)
# =============================================================================
#
# In a place context (3.8:76) -- an equality operand, a `borrow`/`inout`
# argument, the base of a further projection -- `a[i]` names the element in the
# array rather than producing a copy of it. Copying the array into a temporary
# and projecting that temporary would give every non-Copy element a second
# owner whose scope ends with the expression, destroying resources the array
# still holds.

[[case]]
name = "whole_element_place_read_leaves_the_array_live"
spec = ["4.11:14", "3.8:76"]
description = "A whole non-Copy element read as an equality operand reads through the array; the same element is still live afterwards and drops exactly once"
source = """
struct D { v: i32 }

drop fn D(self) { @dbg(self.v); }

fn main() -> i32 {
    let a = [D { v: 7 }, D { v: 8 }];
    let b = [D { v: 7 }, D { v: 8 }];
    let equal = a[1] == b[1];
    @dbg(a[1].v);
    if equal { 0 } else { 9 }
}
"""
expected_stdout = "8\n7\n8\n7\n8\n"
exit_code = 0

[[case]]
name = "whole_element_place_read_with_runtime_index"
spec = ["4.11:8", "4.11:14", "3.8:76"]
description = "A runtime-indexed whole-element read in a place context keeps its bounds check and does not consume the array"
source = """
struct D { v: i32 }

drop fn D(self) { @dbg(self.v); }

fn pick() -> u64 { 1 }

fn main() -> i32 {
    let a = [D { v: 4 }, D { v: 5 }];
    let i = pick();
    let j = pick();
    let same = a[i] == a[j];
    @dbg(a[1].v);
    if same { 0 } else { 9 }
}
"""
expected_stdout = "5\n4\n5\n"
exit_code = 0

[[case]]
name = "whole_element_place_read_out_of_bounds_traps"
spec = ["4.11:8", "4.11:9", "4.11:14"]
description = "The bounds check on a whole-element place read still traps for an out-of-range runtime index"
source = """
struct D { v: i32 }

fn pick() -> u64 { 5 }

fn main() -> i32 {
    let a = [D { v: 4 }, D { v: 5 }];
    let i = pick();
    if a[i] == a[0] { 0 } else { 9 }
}
"""
exit_code = 101
