[section]
id = "expressions.index"
spec_chapter = "4.11"
name = "Index Expressions"
description = "Index expressions access elements of arrays."

# =============================================================================
# Basic Array Indexing
# =============================================================================

[[case]]
name = "index_first_element"
spec = ["4.11:1", "4.11:2", "4.11:3"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[0]
}
"""
exit_code = 10

[[case]]
name = "index_last_element"
spec = ["4.11:1", "4.11:3"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 42];
    arr[2]
}
"""
exit_code = 42

# =============================================================================
# Index Type Must Be An Integer (Signed or Unsigned)
# =============================================================================

[[case]]
name = "index_with_unsigned_variable"
spec = ["4.11:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 1;
    arr[i]
}
"""
exit_code = 20

[[case]]
name = "index_type_bool_error"
spec = ["4.11:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[true]
}
"""
compile_fail = true
error_contains = "integer"

# A signed index type is accepted (spec 4.11:4 / 7.1:7). A negative value is
# not a type error; it traps at runtime via the bounds check (RUE-81).
[[case]]
name = "index_with_signed_i32_variable"
spec = ["4.11:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: i32 = 1;
    arr[i]
}
"""
exit_code = 20

[[case]]
name = "index_with_signed_i64_variable"
spec = ["4.11:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: i64 = 2;
    arr[i]
}
"""
exit_code = 30

# =============================================================================
# Result Type is Element Type
# =============================================================================

[[case]]
name = "index_result_type"
spec = ["4.11:5"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let x: i32 = arr[1];
    x
}
"""
exit_code = 20

# =============================================================================
# Compile-Time Bounds Checking
# =============================================================================

[[case]]
name = "constant_index_out_of_bounds"
error_contains = "[E0902]"
expected_error_code = "E0902"
spec = ["4.11:7"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[5]
}
"""
compile_fail = true

# =============================================================================
# Runtime Bounds Checking
# =============================================================================

[[case]]
name = "runtime_index_out_of_bounds"
spec = ["4.11:8", "4.11:9"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 5;
    arr[i]
}
"""
runtime_error = "index out of bounds"

# =============================================================================
# Mutable Array Element Assignment
# =============================================================================

[[case]]
name = "mutable_array_assignment"
spec = ["4.11:12"]
source = """
fn main() -> i32 {
    let mut arr: [i32; 3] = [10, 20, 30];
    arr[1] = 42;
    arr[1]
}
"""
exit_code = 42

# =============================================================================
# Value Denotation (RUE-298)
# An index expression denotes the element stored at the given position.
# =============================================================================

[[case]]
name = "index_denotes_element_value"
spec = ["4.11:14"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 42, 100];
    // arr[1] denotes the element stored at position 1.
    arr[1]
}
"""
exit_code = 42

[[case]]
name = "index_denotes_element_after_store"
spec = ["4.11:14"]
source = """
fn main() -> i32 {
    let mut arr: [i32; 2] = [0, 0];
    arr[0] = 42;
    // The index expression reads back the value currently stored.
    arr[0]
}
"""
exit_code = 42

# =============================================================================
# Whole-Element Reads in a Place Context (RUE-1997)
# =============================================================================
#
# In a place context (3.8:76) -- an equality operand, a `borrow`/`inout`
# argument, the base of a further projection -- `a[i]` names the element in the
# array rather than producing a copy of it. Copying the array into a temporary
# and projecting that temporary would give every non-Copy element a second
# owner whose scope ends with the expression, destroying resources the array
# still holds.

[[case]]
name = "whole_element_place_read_leaves_the_array_live"
spec = ["4.11:14", "3.8:76"]
description = "A whole non-Copy element read as an equality operand reads through the array; the same element is still live afterwards and drops exactly once"
source = """
struct D { v: i32 }

drop fn D(self) { @dbg(self.v); }

fn main() -> i32 {
    let a = [D { v: 7 }, D { v: 8 }];
    let b = [D { v: 7 }, D { v: 8 }];
    let equal = a[1] == b[1];
    @dbg(a[1].v);
    if equal { 0 } else { 9 }
}
"""
expected_stdout = "8\n7\n8\n7\n8\n"
exit_code = 0

[[case]]
name = "whole_element_place_read_with_runtime_index"
spec = ["4.11:8", "4.11:14", "3.8:76"]
description = "A runtime-indexed whole-element read in a place context keeps its bounds check and does not consume the array"
source = """
struct D { v: i32 }

drop fn D(self) { @dbg(self.v); }

fn pick() -> u64 { 1 }

fn main() -> i32 {
    let a = [D { v: 4 }, D { v: 5 }];
    let i = pick();
    let j = pick();
    let same = a[i] == a[j];
    @dbg(a[1].v);
    if same { 0 } else { 9 }
}
"""
expected_stdout = "5\n4\n5\n"
exit_code = 0

[[case]]
name = "whole_element_place_read_out_of_bounds_traps"
spec = ["4.11:8", "4.11:9", "4.11:14"]
description = "The bounds check on a whole-element place read still traps for an out-of-range runtime index"
source = """
struct D { v: i32 }

fn pick() -> u64 { 5 }

fn main() -> i32 {
    let a = [D { v: 4 }, D { v: 5 }];
    let i = pick();
    if a[i] == a[0] { 0 } else { 9 }
}
"""
exit_code = 101
