[section]
id = "expressions.blocks"
spec_chapter = "4.5"
name = "Block Expressions"
description = "Block expressions contain statements and optionally a final expression."

# =============================================================================
# Block Type is Final Expression Type
# =============================================================================

[[case]]
name = "block_returns_final_expr"
spec = ["4.5:2", "4.5:3"]
source = """
fn main() -> i32 {
    let x = { 42 };
    x
}
"""
exit_code = 42

[[case]]
name = "block_with_statements_and_expr"
spec = ["4.5:3"]
source = """
fn main() -> i32 {
    let x = {
        let a = 10;
        let b = 20;
        a + b
    };
    x
}
"""
exit_code = 30

[[case]]
name = "block_empty_is_unit"
spec = ["4.5:7"]
source = """
fn do_nothing() {
    {}
}
fn main() -> i32 {
    do_nothing();
    42
}
"""
exit_code = 42

# =============================================================================
# Block Scope
# =============================================================================

[[case]]
name = "variable_scope_block"
spec = ["4.5:4"]
source = """
fn main() -> i32 {
    let x = 10;
    {
        let y = 20;
        x + y
    }
}
"""
exit_code = 30

[[case]]
name = "variable_not_visible_outside_block"
error_contains = "[E0201]"
spec = ["4.5:4", "4.5:6"]
source = """
fn main() -> i32 {
    {
        let x = 10;
    }
    x
}
"""
compile_fail = true

[[case]]
name = "nested_blocks_scope"
spec = ["4.5:4"]
source = """
fn main() -> i32 {
    let a = 1;
    {
        let b = 2;
        {
            let c = 3;
            a + b + c
        }
    }
}
"""
exit_code = 6

[[case]]
name = "block_local_binding_not_visible_after_block"
spec = ["4.5:4"]
description = "A block-local binding — even one redeclared several times in the block — is gone after the block ends (RUE-522: forward scope unwinding leaked the first inner binding)"
source = """
fn main() -> i32 {
    {
        let d = 5;
        let d = 6;
        d;
    }
    d
}
"""
compile_fail = true
error_contains = ["[E0201]", "undefined variable"]

[[case]]
name = "comptime_type_alias_not_visible_after_block"
spec = ["4.5:4"]
description = "A let-bound comptime type alias obeys block scope like any other binding (RUE-530: the flat alias map let it escape its block)"
source = """
fn Point() -> type { struct { x: i32 } }

fn main() -> i32 {
    {
        let P = Point();
        let inside: P = P { x: 1 };
        inside.x;
    }
    let outside: P = P { x: 42 };
    outside.x
}
"""
compile_fail = true
error_contains = "[E0204]"

[[case]]
name = "comptime_type_aliases_in_disjoint_branches"
spec = ["4.5:4"]
description = "Same-named comptime type aliases in sibling branch blocks are disjoint bindings (RUE-530: the flat alias map made the second overwrite the first function-wide, E0206)"
source = """
fn A() -> type { struct { x: i32 } }
fn B() -> type { struct { x: bool } }

fn main() -> i32 {
    if true {
        let T = A();
        let a: T = T { x: 42 };
        a.x
    } else {
        let T = B();
        let b: T = T { x: false };
        7
    }
}
"""
exit_code = 42

[[case]]
name = "comptime_type_alias_shadow_restored_after_block"
spec = ["4.5:4"]
description = "An inner comptime type alias shadows an outer same-named one for its block only; the outer alias is restored afterwards (RUE-530)"
source = """
fn A() -> type { struct { x: i32 } }
fn B() -> type { struct { x: i64 } }

fn main() -> i32 {
    let T = A();
    {
        let T = B();
        let inner: T = T { x: 100 };
        inner.x;
    }
    let outer: T = T { x: 42 };
    outer.x
}
"""
exit_code = 42

# =============================================================================
# Float array literals in a block whose value is an enum, a call, or a type
# =============================================================================
# A float array literal bound inside a block whose value is an enum variant, an
# enum payload, a call result, or a type name has no other type context, so an
# unannotated one takes the `f64` default of 3.12:8. The literal's element type
# does not change what the block evaluates to (RUE-2348).

[[case]]
name = "float_array_let_in_enum_valued_block"
spec = ["4.5:3", "4.5:6", "3.12:7"]
description = "An annotated float array bound in a block whose value is an enum variant is dropped at the block's end (RUE-2348)"
source = """
enum E0 { K0, K1(i16) }
fn main() -> i32 { let e: E0 = { let a: [f64; 1] = [1.1]; E0.K0 }; 0 }
"""
exit_code = 0

[[case]]
name = "f32_array_in_enum_payload_valued_block"
spec = ["4.5:3", "3.12:7"]
description = "An f32 array literal in a block whose value is an enum payload keeps its annotated width (RUE-2348)"
source = """
enum Shape { Empty, Count(i16) }
fn main() -> i32 {
    let s: Shape = {
        let a: [f32; 2] = [1.1, 2.2];
        @dbg(a[1]);
        Shape.Count(2)
    };
    match s { Shape.Empty => 1, Shape.Count(n) => @intCast(n) }
}
"""
expected_stdout = """
2.2
"""
exit_code = 2

[[case]]
name = "nested_repeat_and_discarded_float_arrays_in_enum_valued_block"
spec = ["4.5:3", "4.5:7", "3.12:7", "3.12:8"]
description = "A nested float array, a float repeat form, and a discarded float array literal in an enum-valued block (RUE-2348)"
source = """
enum Shape { Empty, Count(i16) }
fn main() -> i32 {
    let s: Shape = {
        let grid: [[f64; 2]; 1] = [[1.5, 2.5]];
        let pair: [f64; 2] = [0.25; 2];
        [9.5];
        @dbg(grid[0][1] + pair[1]);
        Shape.Empty
    };
    match s { Shape.Empty => 0, Shape.Count(n) => @intCast(n) }
}
"""
expected_stdout = """
2.75
"""
exit_code = 0

[[case]]
name = "unannotated_float_array_selects_the_enum_variant"
spec = ["4.5:3", "3.12:8"]
description = "An unannotated float array literal in an untyped enum-valued block: its elements decide the variant at run time (RUE-2348)"
source = """
enum Shape { Empty, Count(i16) }
fn main() -> i32 {
    let s = {
        let a = [1.5, 2.5];
        if a[1] > 2.0 { Shape.Count(7) } else { Shape.Empty }
    };
    match s { Shape.Empty => 1, Shape.Count(n) => @intCast(n) }
}
"""
exit_code = 7

[[case]]
name = "float_array_in_enum_valued_match_arm_and_call_tail"
spec = ["4.5:3", "3.12:8"]
description = "Float arrays in a match arm block and in a block ending in a call, both enum-valued (RUE-2348)"
source = """
enum Shape { Empty, Count(i16) }
fn make() -> Shape { Shape.Count(3) }
fn main() -> i32 {
    let a: Shape = match 1 {
        1 => { let xs = [1.1]; Shape.Empty },
        _ => Shape.Count(2),
    };
    let b: Shape = { let ys: [f32; 1] = [0.5]; make() };
    let left: i32 = match a { Shape.Empty => 10, Shape.Count(n) => @intCast(n) };
    let right: i32 = match b { Shape.Empty => 0, Shape.Count(n) => @intCast(n) };
    left + right
}
"""
exit_code = 13

[[case]]
name = "float_array_in_type_valued_block"
spec = ["4.5:3", "3.12:8"]
description = "A block that binds a float array and ends in a type name still names that type (RUE-2348)"
source = """
fn main() -> i32 {
    let T = {
        let a = [1.5];
        i32
    };
    let x: T = 5;
    x
}
"""
exit_code = 5

[[case]]
name = "annotated_f32_array_decides_a_type_valued_block"
spec = ["4.5:3", "3.12:1", "3.12:7"]
description = "An f32 array element compares at f32 width when it chooses a block's type: 16777217.0 rounds to 16777216.0 (RUE-2348)"
source = """
fn main() -> i32 {
    let T = {
        let a: [f32; 1] = [16777217.0];
        if a[0] == 16777216.0 { i32 } else { i64 }
    };
    @dbg(@size_of(T));
    0
}
"""
expected_stdout = """
4
"""
exit_code = 0

[[case]]
name = "type_array_in_enum_valued_block_rejected"
spec = ["4.14:6"]
description = "An array of type values in an enum-valued block is rejected as a run-time type value, not an internal error (RUE-2348)"
source = """
enum Shape { Empty, Count(i16) }
fn main() -> i32 {
    let s: Shape = {
        let kinds = [i32, i64];
        Shape.Empty
    };
    0
}
"""
compile_fail = true
error_contains = "type values cannot exist at runtime"
