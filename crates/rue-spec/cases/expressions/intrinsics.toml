[section]
id = "expressions.intrinsics"
spec_chapter = "4.13"
name = "Intrinsic Expressions"
description = "Compiler-provided intrinsic operations."

# =============================================================================
# Basic Intrinsic Syntax
# =============================================================================

[[case]]
name = "intrinsic_syntax"
spec = ["4.13:1", "4.13:2", "4.13:3"]
source = """
fn main() -> i32 {
    @dbg(42);
    0
}
"""
exit_code = 0

[[case]]
name = "intrinsic_type_argument"
spec = ["4.13:2a"]
source = """
fn main() -> i32 {
    // Intrinsics can take type arguments
    @size_of(i32)
}
"""
exit_code = 4

[[case]]
name = "unknown_intrinsic"
spec = ["4.13:5"]
source = """
fn main() -> i32 {
    @unknown(42);
    0
}
"""
compile_fail = true
error_contains = "unknown intrinsic"

# An unknown intrinsic is E0700 in every expression position. In a context with
# an expected type (a function tail, an annotated let), inference used to
# default the unknown call to `()` and mask the legality error behind an E0206
# type mismatch pointing at the return type (RUE-1281).
[[case]]
name = "unknown_intrinsic_tail_position"
spec = ["4.13:5"]
error_contains = ["[E0700]", "unknown intrinsic"]
source = """
fn main() -> i32 {
    @unknown(42)
}
"""
compile_fail = true

[[case]]
name = "unknown_intrinsic_annotated_let"
spec = ["4.13:5"]
error_contains = ["[E0700]", "unknown intrinsic"]
source = """
fn main() -> i32 {
    let x: i32 = @unknown(42);
    x
}
"""
compile_fail = true

# =============================================================================
# Reserved-but-unspecified intrinsics: @panic / @assert / @cast (4.13:5b, RUE-319)
#
# @panic and @assert are not in the normative inventory yet, but they are no
# longer silent no-ops: they abort the process (message to stderr, exit 101),
# the same abort discipline as the @intCast overflow trap. @cast is rejected
# at compile time in favor of @intCast.
# =============================================================================

[[case]]
name = "panic_with_message_aborts"
spec = ["4.13:5b"]
source = """
fn main() -> i32 {
    @panic("boom");
    0
}
"""
exit_code = 101
stderr_contains = "panic: boom"

[[case]]
name = "panic_no_message_aborts"
spec = ["4.13:5b"]
source = """
fn main() -> i32 {
    @panic();
    0
}
"""
exit_code = 101
stderr_contains = "panic"

[[case]]
name = "assert_false_aborts"
spec = ["4.13:5b"]
source = """
fn main() -> i32 {
    @assert(false);
    0
}
"""
exit_code = 101
stderr_contains = "assertion failed"

[[case]]
name = "assert_true_passes"
spec = ["4.13:5b"]
source = """
fn main() -> i32 {
    @assert(true);
    42
}
"""
exit_code = 42

[[case]]
name = "assert_false_with_message_aborts"
spec = ["4.13:5b"]
source = """
fn main() -> i32 {
    @assert(1 == 2, "one is not two");
    0
}
"""
exit_code = 101
stderr_contains = "panic: one is not two"

# @panic is `!`-typed (RUE-512): it diverges, so it participates in never
# coercion (3.4:2) and may appear wherever a value of any type is expected — a
# typed `if`/`else` or `match` arm, a typed `let` initializer, or a bare
# function tail. These cases pin both the type-checking (they compile) and the
# runtime behavior on the taken/untaken paths.

# @panic in the taken `else` arm of a typed `if`: coerces to i32, then aborts.
[[case]]
name = "panic_in_if_else_arm_taken_aborts"
spec = ["3.4:2", "4.13:5b"]
source = """
fn main() -> i32 {
    let x: i32 = if false { 1 } else { @panic("boom") };
    x
}
"""
exit_code = 101
stderr_contains = "panic: boom"

# The same expression when the panic arm is NOT taken: the value path yields 7.
# This proves the never-coercion type-checks and leaves the value path intact.
[[case]]
name = "panic_in_if_else_arm_untaken_yields_value"
spec = ["3.4:2", "4.13:5b"]
source = """
fn main() -> i32 {
    let x: i32 = if true { 7 } else { @panic("unreached") };
    x
}
"""
exit_code = 7

# @panic in a typed `match` arm: the non-panic arm still produces a value.
[[case]]
name = "panic_in_match_arm_yields_value"
spec = ["3.4:2", "4.13:5b"]
source = """
fn classify(n: i32) -> i32 {
    let r: i32 = match n {
        0 => 100,
        _ => @panic("nonzero"),
    };
    r
}
fn main() -> i32 { classify(0) }
"""
exit_code = 100

# @panic as a typed `let` initializer: coerces to i32, then aborts.
[[case]]
name = "panic_in_let_initializer_aborts"
spec = ["3.4:2", "4.13:5b"]
source = """
fn main() -> i32 {
    let x: i32 = @panic("init");
    x
}
"""
exit_code = 101
stderr_contains = "panic: init"

# @panic as the bare tail of an i32-returning function: no explicit `return`
# needed, because `!` coerces to the declared return type.
[[case]]
name = "panic_as_function_tail_aborts"
spec = ["3.4:2", "4.13:5b"]
source = """
fn dead() -> i32 { @panic("tail") }
fn main() -> i32 { dead() }
"""
exit_code = 101
stderr_contains = "panic: tail"

[[case]]
name = "cast_rejected_use_intcast"
spec = ["4.13:5b"]
source = """
