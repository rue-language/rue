exit_code = 4

# Each type observes its natural compact alignment (4.13:22): i8 and bool are
# one byte, i64 is eight, and a struct's alignment is its widest field's (Point
# is four, from its i32 fields).
[[case]]
name = "align_of_natural_alignments"
spec = ["4.13:22"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    if @align_of(i8) != 1 { return 1; }
    if @align_of(i64) != 8 { return 2; }
    if @align_of(bool) != 1 { return 3; }
    if @align_of(Point) != 4 { return 4; }
    0
}
"""
exit_code = 0

# =============================================================================
# @offset_of Intrinsic (RUE-301)
# =============================================================================

[[case]]
name = "offset_of_first_field_is_zero"
spec = ["4.13:91", "4.13:92"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let off: u64 = @offset_of(Point, x);
    @intCast(off)
}
"""
exit_code = 0

[[case]]
name = "offset_of_second_field"
spec = ["4.13:91", "4.13:94"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let off: u64 = @offset_of(Point, y);
    @intCast(off)
}
"""
exit_code = 4

[[case]]
name = "offset_of_returns_u64"
spec = ["4.13:93"]
source = """
fn takes_u64(x: u64) -> u64 { x }
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let off: u64 = takes_u64(@offset_of(Point, y));
    @intCast(off)
}
"""
exit_code = 4

[[case]]
name = "offset_of_accounts_for_multislot_fields"
spec = ["4.13:94"]
source = """
struct Inner { x: i32, y: i32 }
struct Outer { flag: bool, arr: [i32; 3], inner: Inner, last: i64 }
fn main() -> i32 {
    // flag: bool@0 -> arr (align 4) at byte 4
    // arr: [i32;3] size 12 -> inner (align 4) at byte 16
    // inner: Inner size 8 -> last (i64, align 8) at byte 24
    if @offset_of(Outer, flag) != 0 { return 1; }
    if @offset_of(Outer, arr) != 4 { return 2; }
    if @offset_of(Outer, inner) != 16 { return 3; }
    if @offset_of(Outer, last) != 24 { return 4; }
    0
}
"""
exit_code = 0

[[case]]
name = "offset_of_compile_time_const_context"
spec = ["4.13:94"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    // @offset_of folds to a compile-time constant, like @size_of.
    let off: u64 = @offset_of(Point, y);
    @intCast(off)
}
"""
exit_code = 4

# RUE-969: `@offset_of` folds at compile time and so composes with ordinary
# constant arithmetic and constant-folded control flow inside a function body,
# not just as a bare initializer.
[[case]]
name = "offset_of_folds_inside_a_larger_constant_expression"
spec = ["4.13:94"]
source = """
struct Point { x: i32, y: i32 }
struct Pair { head: Point, tail: Point }
fn main() -> i32 {
    // A nested field's byte displacement is the sum of the two hops, computed
    // entirely from folded @offset_of values.
    let nested: u64 = @offset_of(Pair, tail) + @offset_of(Point, y);
    if nested == 12 { @intCast(nested) } else { 0 }
}
"""
exit_code = 12

# RUE-969: `@offset_of` reports a field's displacement in the type's compact
# memory image, and `@field_ptr` addresses that field's storage. For a
# slot-identical struct — every field exactly one eight-byte slot — the frame's
# slot-shaped storage and the compact image coincide, so the two agree exactly.
# (They deliberately do not agree for a non-slot-identical struct held in a
# frame: §3.6 stores such a value slot-shaped while @offset_of describes the
# compact image.)
[[case]]
name = "offset_of_agrees_with_field_ptr_when_storage_is_slot_identical"
spec = ["4.13:94", "9.2:18"]
source = """
struct Cell { first: i64, second: i64, third: i64 }
fn main() -> i32 {
    let mut c = Cell { first: 1, second: 2, third: 3 };
    let agree: bool = checked {
        let p0: u64 = @ptr_to_int(@field_ptr(c.first));
        let p1: u64 = @ptr_to_int(@field_ptr(c.second));
        let p2: u64 = @ptr_to_int(@field_ptr(c.third));
        p1 - p0 == @offset_of(Cell, second) && p2 - p0 == @offset_of(Cell, third)
    };
    if agree { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "offset_of_non_struct_type_errors"
