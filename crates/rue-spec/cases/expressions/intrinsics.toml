[[case]]
name = "dbg_string_borrows_not_consumed"
spec = ["4.13:6", "4.13:7"]
description = "@dbg borrows a StrBuf; the value stays usable after the call (RUE-21)"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut s = StrBuf.new();
    s.push_str("hello");
    @dbg(s);
    let n: u64 = s.len();
    @dbg(s);
    if n == 5 { 0 } else { 1 }
}
"""
expected_stdout = """
hello
hello
"""
exit_code = 0

[[case]]
name = "dbg_string_dropped_exactly_once"
spec = ["4.13:6"]
description = "A @dbg'd StrBuf is dropped exactly once by its owner, not consumed by @dbg (RUE-21)"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
struct Holder { s: StrBuf }
drop fn Holder(self) {
    @dbg(self.s);
}
fn main() -> i32 {
    let mut tmp = StrBuf.new();
    tmp.push_str("world");
    let h = Holder { s: tmp };
    @dbg(h.s);
    0
}
"""
expected_stdout = """
world
world
"""
exit_code = 0

