description = "`~` truncates to the operand width in a const initializer too: ~0 as u8 is 255, matching body position"
source = """
fn flip(comptime n: u8) -> u8 { comptime { ~n } }
const X: u8 = flip(0);
fn main() -> i32 {
    let body: u8 = flip(0);
    if X == 255 && body == X { 42 } else { 1 }
}
"""
exit_code = 42

