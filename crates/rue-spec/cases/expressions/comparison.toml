[section]
id = "expressions.comparison"
spec_chapter = "4.3"
name = "Comparison Operators"
description = "Comparison operators compare values and produce bool results."

# =============================================================================
# Comparison Produces Bool
# =============================================================================

[[case]]
name = "comparison_{op}"
spec = ["4.3:1"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
params = [
  { op = "eq_true", expr = "5 == 5", exit_code = 1 },
  { op = "eq_false", expr = "5 == 6", exit_code = 0 },
  { op = "ne_true", expr = "5 != 6", exit_code = 1 },
]

# =============================================================================
# Equality Works on Integers and Booleans
# =============================================================================

[[case]]
name = "equality_{type}"
spec = ["4.3:2"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
params = [
  { type = "integers", expr = "42 == 42", exit_code = 1 },
  { type = "booleans_eq", expr = "true == true", exit_code = 1 },
  { type = "booleans_ne", expr = "true != false", exit_code = 1 },
]

# =============================================================================
# Ordering Works Only on Integers
# =============================================================================

[[case]]
name = "ordering_{op}_integers"
spec = ["4.3:5"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
params = [
  { op = "lt", expr = "5 < 10", exit_code = 1 },
  { op = "gt", expr = "10 > 5", exit_code = 1 },
  { op = "le", expr = "5 <= 5", exit_code = 1 },
  { op = "ge", expr = "5 >= 5", exit_code = 1 },
]

# =============================================================================
# Ordering on Booleans is Compile Error
# =============================================================================

[[case]]
name = "ordering_{op}_on_bool"
error_contains = "[E0206]"
spec = ["4.3:5"]
source = """
fn main() -> i32 {
    if true {op} false { 1 } else { 0 }
}
"""
compile_fail = true
params = [
  { op = "<" },
  { op = ">" },
  { op = "<=" },
  { op = ">=" },
]

# =============================================================================
# Comparison Precedence Lower Than Arithmetic
# =============================================================================

[[case]]
name = "precedence_comparison_{variant}"
spec = ["4.3:8"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
exit_code = 1
params = [
  { variant = "after_add", expr = "2 + 3 == 5" },
  { variant = "both_sides", expr = "2 + 3 < 10 - 3" },
  { variant = "after_bitand", expr = "6 & 3 == 2" },   # (6 & 3) == 2
  { variant = "after_bitor", expr = "1 | 2 == 3" },    # (1 | 2) == 3
  { variant = "after_shift", expr = "1 << 3 == 8" },   # (1 << 3) == 8
]

# =============================================================================
# Both Operands Must Have Same Type
# =============================================================================

[[case]]
name = "type_mismatch_{types}"
error_contains = "[E0206]"
spec = ["4.3:10"]
source = """
fn main() -> i32 {
    let x: {from} = 10;
    let y: {to} = 10;
    if x == y { 1 } else { 0 }
}
"""
compile_fail = true
params = [
  { types = "i32_i64", from = "i32", to = "i64" },
  { types = "i32_u32", from = "i32", to = "u32" },
]

# =============================================================================
# Type Inference from One Operand
# =============================================================================

[[case]]
name = "infer_type_from_left_operand"
spec = ["4.3:11"]
source = """
fn main() -> i32 {
    let x: i64 = 100;
    if x == 100 { 1 } else { 0 }
}
"""
exit_code = 1

# NOTE: Right-operand inference not yet implemented, see integers.toml for tests

# =============================================================================
# Chained Comparisons Are Rejected
# =============================================================================

[[case]]
name = "chained_{variant}_error"
spec = ["4.3:12"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
compile_fail = true
error_contains = "comparison operators cannot be chained"
params = [
  { variant = "lt", expr = "1 < 2 < 3" },
  { variant = "eq", expr = "1 == 1 == true" },
  { variant = "mixed", expr = "1 < 2 == true" },
]

[[case]]
# RUE-528: explicit parentheses BREAK a chain (the restriction is syntactic).
# `(1 < 2) < 3` is not a chain — it is an ordered comparison with a bool left
# operand, rejected by ordinary operand typing, not E0802.
name = "parenthesized_comparison_operand_is_not_a_chain_typing_still_applies"
spec = ["4.3:12"]
source = """
fn main() -> i32 {
    if (1 < 2) < 3 { 1 } else { 0 }
}
"""
compile_fail = true
error_contains = "[E0206]"

[[case]]
# RUE-528: a parenthesized comparison is a legal boolean operand of equality,
# in either position. The old RIR-level chain check (parens erased) rejected
# the left-operand form while accepting the right-operand form.
name = "parenthesized_comparison_equality_{variant}"
spec = ["4.3:12"]
source = """
fn main() -> i32 {
    if {expr} { 7 } else { 9 }
}
"""
exit_code = 7
params = [
  { variant = "left", expr = "(1 < 2) == true" },
  { variant = "right", expr = "true == (1 < 2)" },
  { variant = "both", expr = "(1 < 2) == (3 > 2)" },
  { variant = "ne", expr = "(1 < 2) != false" },
]

[[case]]
name = "separate_comparisons_with_and"
spec = ["4.3:5", "4.3:8", "4.3:13"]
source = """
fn main() -> i32 {
    if 1 < 2 && 2 < 3 { 1 } else { 0 }
}
"""
exit_code = 1

# =============================================================================
# Unit Type Equality
# =============================================================================

[[case]]
name = "unit_{op}"
spec = ["4.3:2", "4.3:3a"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
params = [
  { op = "equality", expr = "() == ()", exit_code = 1 },
  { op = "inequality", expr = "() != ()", exit_code = 0 },
]

[[case]]
name = "unit_ordering_disallowed"
error_contains = "[E0206]"
spec = ["4.3:6"]
source = """
fn main() -> i32 {
    if () < () { 1 } else { 0 }
}
"""
compile_fail = true

# =============================================================================
# Struct Equality
# =============================================================================

[[case]]
name = "struct_equality_{variant}"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Point { x: i32, y: i32 }

fn main() -> i32 {
    let p1 = Point { x: {x1}, y: {y1} };
    let p2 = Point { x: {x2}, y: {y2} };
    if p1 {op} p2 { 1 } else { 0 }
}
"""
params = [
  { variant = "same_values", x1 = "1", y1 = "2", x2 = "1", y2 = "2", op = "==", exit_code = 1 },
  { variant = "different_values", x1 = "1", y1 = "2", x2 = "1", y2 = "3", op = "==", exit_code = 0 },
  { variant = "inequality", x1 = "1", y1 = "2", x2 = "1", y2 = "3", op = "!=", exit_code = 1 },
]

[[case]]
name = "struct_equality_single_field"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Wrapper { value: i32 }

fn main() -> i32 {
    let a = Wrapper { value: 42 };
    let b = Wrapper { value: 42 };
    if a == b { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "struct_equality_many_fields"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Record { a: i32, b: i32, c: i32, d: i32 }

fn main() -> i32 {
    let r1 = Record { a: 1, b: 2, c: 3, d: 4 };
    let r2 = Record { a: 1, b: 2, c: 3, d: 4 };
    let r3 = Record { a: 1, b: 2, c: 3, d: 5 };
    if r1 == r2 && r1 != r3 { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "struct_ordering_disallowed"
error_contains = "[E0206]"
spec = ["4.3:6"]
source = """
struct Point { x: i32, y: i32 }

fn main() -> i32 {
    let p1 = Point { x: 1, y: 2 };
    let p2 = Point { x: 1, y: 3 };
    if p1 < p2 { 1 } else { 0 }
}
"""
compile_fail = true

[[case]]
name = "struct_with_bool_field_equality"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Config { enabled: bool, count: i32 }

fn main() -> i32 {
    let c1 = Config { enabled: true, count: 5 };
    let c2 = Config { enabled: true, count: 5 };
    let c3 = Config { enabled: false, count: 5 };
    if c1 == c2 && c1 != c3 { 1 } else { 0 }
}
"""
exit_code = 1

# =============================================================================
# Array Equality (RUE-285): structural, element-by-element
# =============================================================================

[[case]]
name = "array_equality_{variant}"
spec = ["4.3:2", "4.3:3c"]
source = """
fn main() -> i32 {
    let a = [{a0}, {a1}, {a2}];
    let b = [{b0}, {b1}, {b2}];
    if a {op} b { 1 } else { 0 }
}
"""
params = [
  { variant = "equal", a0 = "1", a1 = "2", a2 = "3", b0 = "1", b1 = "2", b2 = "3", op = "==", exit_code = 1 },
  { variant = "different", a0 = "1", a1 = "2", a2 = "3", b0 = "1", b1 = "2", b2 = "9", op = "==", exit_code = 0 },
  { variant = "inequality", a0 = "1", a1 = "2", a2 = "3", b0 = "1", b1 = "2", b2 = "9", op = "!=", exit_code = 1 },
]

# Nested aggregates recurse: array-of-struct and struct-of-array.
[[case]]
name = "array_of_struct_equality"
spec = ["4.3:2", "4.3:3c", "4.3:3b"]
source = """
struct P { x: i32, y: i32 }

fn main() -> i32 {
    let a = [P { x: 1, y: 2 }, P { x: 3, y: 4 }];
    let b = [P { x: 1, y: 2 }, P { x: 3, y: 4 }];
    let c = [P { x: 1, y: 2 }, P { x: 3, y: 5 }];
    if a == b && a != c { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "struct_of_array_equality"
spec = ["4.3:2", "4.3:3b", "4.3:3c"]
source = """
struct S { v: [i32; 3] }

fn main() -> i32 {
    let a = S { v: [1, 2, 3] };
    let b = S { v: [1, 2, 3] };
    let c = S { v: [1, 2, 4] };
    if a == b && a != c { 1 } else { 0 }
}
"""
exit_code = 1

# Nested struct: a difference in a non-first slot of a nested field must be seen
# (regression guard for the old slot-0-only struct-equality bug, RUE-285).
[[case]]
name = "nested_struct_equality_deep_field"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Inner { a: i32, b: i32 }
struct Outer { p: Inner, q: i32 }

fn main() -> i32 {
    let x = Outer { p: Inner { a: 1, b: 2 }, q: 5 };
    let y = Outer { p: Inner { a: 1, b: 2 }, q: 5 };
    let z = Outer { p: Inner { a: 1, b: 99 }, q: 5 };
    if x == y && x != z { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "array_ordering_disallowed"
error_contains = "[E0206]"
spec = ["4.3:6"]
source = """
fn main() -> i32 {
    let a = [1, 2];
    let b = [1, 2];
    if a < b { 1 } else { 0 }
}
"""
compile_fail = true

# Equality borrows its operands: both arrays remain usable after `==`.
[[case]]
name = "array_equality_borrows_operands"
spec = ["4.3:3f"]
source = """
fn main() -> i32 {
    let a = [1, 2, 3];
    let b = [1, 2, 3];
    let equal = a == b;
    if equal { a[0] + b[2] } else { 0 }
}
"""
exit_code = 4

# A raw-pointer leaf compares by ADDRESS (identity): two structs holding the
# address of the same local are equal; one holding a different local is not.
[[case]]
name = "struct_raw_pointer_field_equality_by_address"
spec = ["4.3:2", "4.3:3b", "4.3:3e"]
source = """
struct Pw { p: ptr const i32 }

fn main() -> i32 {
    let x: i32 = 42;
    let y: i32 = 42;
    let a = checked { Pw { p: @raw(x) } };
    let b = checked { Pw { p: @raw(x) } };
    let c = checked { Pw { p: @raw(y) } };
    if a == b && a != c { 1 } else { 0 }
}
"""
exit_code = 1

# =============================================================================
# Enum Equality (RUE-285): same variant and equal payload
# =============================================================================

# Discriminant-only (C-like) enums: equal iff the same variant.
[[case]]
name = "enum_clike_equality_{variant}"
spec = ["4.3:2", "4.3:3d"]
source = """
enum Color { Red, Green, Blue }

fn main() -> i32 {
    let a = Color.{a};
    let b = Color.{b};
    if a {op} b { 1 } else { 0 }
}
"""
params = [
  { variant = "same", a = "Red", b = "Red", op = "==", exit_code = 1 },
  { variant = "different", a = "Red", b = "Green", op = "==", exit_code = 0 },
  { variant = "inequality", a = "Red", b = "Green", op = "!=", exit_code = 1 },
]

[[case]]
name = "enum_clike_ordering_disallowed"
error_contains = "[E0206]"
spec = ["4.3:6"]
source = """
enum Color { Red, Green }

fn main() -> i32 {
    let a = Color.Red;
    let b = Color.Green;
    if a < b { 1 } else { 0 }
}
"""
compile_fail = true

# Payload-carrying enums: same variant AND equal payload; different variants
# are never equal (RUE-221).
[[case]]
name = "enum_payload_equality_{variant}"
spec = ["4.3:2", "4.3:3d"]
source = """
enum Shape { Circle(i32), Square(i32) }

fn main() -> i32 {
    let a = Shape.{a};
    let b = Shape.{b};
    if a {op} b { 1 } else { 0 }
}
"""
params = [
  { variant = "same", a = "Circle(5)", b = "Circle(5)", op = "==", exit_code = 1 },
  { variant = "same_variant_diff_payload", a = "Circle(5)", b = "Circle(6)", op = "==", exit_code = 0 },
  { variant = "different_variant", a = "Circle(5)", b = "Square(5)", op = "==", exit_code = 0 },
  { variant = "inequality", a = "Circle(5)", b = "Square(5)", op = "!=", exit_code = 1 },
]
