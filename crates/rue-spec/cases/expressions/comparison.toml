[section]
id = "expressions.comparison"
spec_chapter = "4.3"
name = "Comparison Operators"
description = "Comparison operators compare values and produce bool results."

# =============================================================================
# Comparison Produces Bool
# =============================================================================

[[case]]
name = "comparison_{op}"
spec = ["4.3:1"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
params = [
  { op = "eq_true", expr = "5 == 5", exit_code = 1 },
  { op = "eq_false", expr = "5 == 6", exit_code = 0 },
  { op = "ne_true", expr = "5 != 6", exit_code = 1 },
]

# =============================================================================
# Equality Works on Integers and Booleans
# =============================================================================

[[case]]
name = "equality_{type}"
spec = ["4.3:2"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
params = [
  { type = "integers", expr = "42 == 42", exit_code = 1 },
  { type = "booleans_eq", expr = "true == true", exit_code = 1 },
  { type = "booleans_ne", expr = "true != false", exit_code = 1 },
]

# =============================================================================
# Ordering Works Only on Integers
# =============================================================================

[[case]]
name = "ordering_{op}_integers"
spec = ["4.3:5"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
params = [
  { op = "lt", expr = "5 < 10", exit_code = 1 },
  { op = "gt", expr = "10 > 5", exit_code = 1 },
  { op = "le", expr = "5 <= 5", exit_code = 1 },
  { op = "ge", expr = "5 >= 5", exit_code = 1 },
]

# =============================================================================
# Ordering on Booleans is Compile Error
# =============================================================================

[[case]]
name = "ordering_{op}_on_bool"
error_contains = "[E0206]"
spec = ["4.3:5"]
source = """
fn main() -> i32 {
    if true {op} false { 1 } else { 0 }
}
"""
compile_fail = true
params = [
  { op = "<" },
  { op = ">" },
  { op = "<=" },
  { op = ">=" },
]

# =============================================================================
# Comparison Precedence Lower Than Arithmetic
# =============================================================================

[[case]]
name = "precedence_comparison_{variant}"
spec = ["4.3:8"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
exit_code = 1
params = [
  { variant = "after_add", expr = "2 + 3 == 5" },
  { variant = "both_sides", expr = "2 + 3 < 10 - 3" },
  { variant = "after_bitand", expr = "6 & 3 == 2" },   # (6 & 3) == 2
  { variant = "after_bitor", expr = "1 | 2 == 3" },    # (1 | 2) == 3
  { variant = "after_shift", expr = "1 << 3 == 8" },   # (1 << 3) == 8
]

# =============================================================================
# Both Operands Must Have Same Type
# =============================================================================

[[case]]
name = "type_mismatch_{types}"
error_contains = "[E0206]"
spec = ["4.3:10"]
source = """
fn main() -> i32 {
    let x: {from} = 10;
    let y: {to} = 10;
    if x == y { 1 } else { 0 }
}
"""
compile_fail = true
params = [
  { types = "i32_i64", from = "i32", to = "i64" },
  { types = "i32_u32", from = "i32", to = "u32" },
]

# =============================================================================
# Type Inference from One Operand
# =============================================================================

[[case]]
name = "infer_type_from_left_operand"
spec = ["4.3:11"]
source = """
fn main() -> i32 {
    let x: i64 = 100;
    if x == 100 { 1 } else { 0 }
}
"""
exit_code = 1

# NOTE: Right-operand inference not yet implemented, see integers.toml for tests

# =============================================================================
# Chained Comparisons Are Rejected
# =============================================================================

[[case]]
name = "chained_{variant}_error"
spec = ["4.3:12"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
compile_fail = true
error_contains = "comparison operators cannot be chained"
params = [
  { variant = "lt", expr = "1 < 2 < 3" },
  { variant = "eq", expr = "1 == 1 == true" },
  { variant = "mixed", expr = "1 < 2 == true" },
]

[[case]]
# RUE-528: explicit parentheses BREAK a chain (the restriction is syntactic).
# `(1 < 2) < 3` is not a chain — it is an ordered comparison with a bool left
# operand, rejected by ordinary operand typing, not E0802.
name = "parenthesized_comparison_operand_is_not_a_chain_typing_still_applies"
spec = ["4.3:12"]
source = """
fn main() -> i32 {
    if (1 < 2) < 3 { 1 } else { 0 }
}
"""
compile_fail = true
error_contains = "[E0206]"

[[case]]
# RUE-528: a parenthesized comparison is a legal boolean operand of equality,
# in either position. The old RIR-level chain check (parens erased) rejected
# the left-operand form while accepting the right-operand form.
name = "parenthesized_comparison_equality_{variant}"
spec = ["4.3:12"]
source = """
fn main() -> i32 {
    if {expr} { 7 } else { 9 }
}
"""
exit_code = 7
params = [
  { variant = "left", expr = "(1 < 2) == true" },
  { variant = "right", expr = "true == (1 < 2)" },
  { variant = "both", expr = "(1 < 2) == (3 > 2)" },
  { variant = "ne", expr = "(1 < 2) != false" },
]

[[case]]
name = "separate_comparisons_with_and"
spec = ["4.3:5", "4.3:8", "4.3:13"]
source = """
fn main() -> i32 {
    if 1 < 2 && 2 < 3 { 1 } else { 0 }
}
"""
exit_code = 1

# =============================================================================
# Unit Type Equality
# =============================================================================

[[case]]
name = "unit_{op}"
spec = ["4.3:2", "4.3:3a"]
source = """
fn main() -> i32 {
    if {expr} { 1 } else { 0 }
}
"""
params = [
  { op = "equality", expr = "() == ()", exit_code = 1 },
  { op = "inequality", expr = "() != ()", exit_code = 0 },
]

[[case]]
name = "unit_ordering_disallowed"
error_contains = "[E0206]"
spec = ["4.3:6"]
source = """
fn main() -> i32 {
    if () < () { 1 } else { 0 }
}
"""
