# =============================================================================
# Struct Equality
# =============================================================================

[[case]]
name = "struct_equality_{variant}"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Point { x: i32, y: i32 }

fn main() -> i32 {
    let p1 = Point { x: {x1}, y: {y1} };
    let p2 = Point { x: {x2}, y: {y2} };
    if p1 {op} p2 { 1 } else { 0 }
}
"""
params = [
  { variant = "same_values", x1 = "1", y1 = "2", x2 = "1", y2 = "2", op = "==", exit_code = 1 },
  { variant = "different_values", x1 = "1", y1 = "2", x2 = "1", y2 = "3", op = "==", exit_code = 0 },
  { variant = "inequality", x1 = "1", y1 = "2", x2 = "1", y2 = "3", op = "!=", exit_code = 1 },
]

[[case]]
name = "struct_equality_single_field"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Wrapper { value: i32 }

fn main() -> i32 {
    let a = Wrapper { value: 42 };
    let b = Wrapper { value: 42 };
    if a == b { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "struct_equality_many_fields"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Record { a: i32, b: i32, c: i32, d: i32 }

fn main() -> i32 {
    let r1 = Record { a: 1, b: 2, c: 3, d: 4 };
    let r2 = Record { a: 1, b: 2, c: 3, d: 4 };
    let r3 = Record { a: 1, b: 2, c: 3, d: 5 };
    if r1 == r2 && r1 != r3 { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "struct_ordering_disallowed"
error_contains = "[E0206]"
spec = ["4.3:6"]
source = """
struct Point { x: i32, y: i32 }

fn main() -> i32 {
    let p1 = Point { x: 1, y: 2 };
    let p2 = Point { x: 1, y: 3 };
    if p1 < p2 { 1 } else { 0 }
}
"""
compile_fail = true

[[case]]
name = "struct_with_bool_field_equality"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Config { enabled: bool, count: i32 }

fn main() -> i32 {
    let c1 = Config { enabled: true, count: 5 };
    let c2 = Config { enabled: true, count: 5 };
    let c3 = Config { enabled: false, count: 5 };
    if c1 == c2 && c1 != c3 { 1 } else { 0 }
}
"""
exit_code = 1

# =============================================================================
# Array Equality (RUE-285): structural, element-by-element
# =============================================================================

[[case]]
name = "array_equality_{variant}"
spec = ["4.3:2", "4.3:3c"]
source = """
fn main() -> i32 {
    let a = [{a0}, {a1}, {a2}];
    let b = [{b0}, {b1}, {b2}];
    if a {op} b { 1 } else { 0 }
}
"""
params = [
  { variant = "equal", a0 = "1", a1 = "2", a2 = "3", b0 = "1", b1 = "2", b2 = "3", op = "==", exit_code = 1 },
  { variant = "different", a0 = "1", a1 = "2", a2 = "3", b0 = "1", b1 = "2", b2 = "9", op = "==", exit_code = 0 },
  { variant = "inequality", a0 = "1", a1 = "2", a2 = "3", b0 = "1", b1 = "2", b2 = "9", op = "!=", exit_code = 1 },
]

# Nested aggregates recurse: array-of-struct and struct-of-array.
[[case]]
name = "array_of_struct_equality"
spec = ["4.3:2", "4.3:3c", "4.3:3b"]
source = """
struct P { x: i32, y: i32 }

fn main() -> i32 {
    let a = [P { x: 1, y: 2 }, P { x: 3, y: 4 }];
    let b = [P { x: 1, y: 2 }, P { x: 3, y: 4 }];
    let c = [P { x: 1, y: 2 }, P { x: 3, y: 5 }];
    if a == b && a != c { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "struct_of_array_equality"
spec = ["4.3:2", "4.3:3b", "4.3:3c"]
source = """
struct S { v: [i32; 3] }

fn main() -> i32 {
    let a = S { v: [1, 2, 3] };
    let b = S { v: [1, 2, 3] };
    let c = S { v: [1, 2, 4] };
    if a == b && a != c { 1 } else { 0 }
}
"""
exit_code = 1

# Nested struct: a difference in a non-first slot of a nested field must be seen
# (regression guard for the old slot-0-only struct-equality bug, RUE-285).
[[case]]
name = "nested_struct_equality_deep_field"
spec = ["4.3:2", "4.3:3b"]
source = """
struct Inner { a: i32, b: i32 }
struct Outer { p: Inner, q: i32 }

fn main() -> i32 {
    let x = Outer { p: Inner { a: 1, b: 2 }, q: 5 };
    let y = Outer { p: Inner { a: 1, b: 2 }, q: 5 };
    let z = Outer { p: Inner { a: 1, b: 99 }, q: 5 };
    if x == y && x != z { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "array_ordering_disallowed"
error_contains = "[E0206]"
spec = ["4.3:6"]
source = """
fn main() -> i32 {
    let a = [1, 2];
    let b = [1, 2];
    if a < b { 1 } else { 0 }
}
"""
compile_fail = true

# Equality borrows its operands: both arrays remain usable after `==`.
[[case]]
name = "array_equality_borrows_operands"
spec = ["4.3:3f"]
source = """
fn main() -> i32 {
    let a = [1, 2, 3];
    let b = [1, 2, 3];
    let equal = a == b;
    if equal { a[0] + b[2] } else { 0 }
}
"""
exit_code = 4

# A raw-pointer leaf compares by ADDRESS (identity): two structs holding the
# address of the same local are equal; one holding a different local is not.
[[case]]
name = "struct_raw_pointer_field_equality_by_address"
spec = ["4.3:2", "4.3:3b", "4.3:3e"]
source = """
struct Pw { p: ptr const i32 }

fn main() -> i32 {
    let x: i32 = 42;
    let y: i32 = 42;
    let a = checked { Pw { p: @raw(x) } };
    let b = checked { Pw { p: @raw(x) } };
    let c = checked { Pw { p: @raw(y) } };
    if a == b && a != c { 1 } else { 0 }
}
"""
exit_code = 1

# =============================================================================
# Enum Equality (RUE-285): same variant and equal payload
# =============================================================================

# Discriminant-only (C-like) enums: equal iff the same variant.
[[case]]
name = "enum_clike_equality_{variant}"
spec = ["4.3:2", "4.3:3d"]
source = """
enum Color { Red, Green, Blue }

fn main() -> i32 {
    let a = Color.{a};
    let b = Color.{b};
    if a {op} b { 1 } else { 0 }
}
"""
params = [
  { variant = "same", a = "Red", b = "Red", op = "==", exit_code = 1 },
  { variant = "different", a = "Red", b = "Green", op = "==", exit_code = 0 },
  { variant = "inequality", a = "Red", b = "Green", op = "!=", exit_code = 1 },
]

[[case]]
name = "enum_clike_ordering_disallowed"
error_contains = "[E0206]"
spec = ["4.3:6"]
source = """
enum Color { Red, Green }

fn main() -> i32 {
    let a = Color.Red;
    let b = Color.Green;
    if a < b { 1 } else { 0 }
}
"""
compile_fail = true

# Payload-carrying enums: same variant AND equal payload; different variants
# are never equal (RUE-221).
[[case]]
name = "enum_payload_equality_{variant}"
spec = ["4.3:2", "4.3:3d"]
source = """
enum Shape { Circle(i32), Square(i32) }

fn main() -> i32 {
    let a = Shape.{a};
    let b = Shape.{b};
    if a {op} b { 1 } else { 0 }
}
"""
params = [
  { variant = "same", a = "Circle(5)", b = "Circle(5)", op = "==", exit_code = 1 },
  { variant = "same_variant_diff_payload", a = "Circle(5)", b = "Circle(6)", op = "==", exit_code = 0 },
  { variant = "different_variant", a = "Circle(5)", b = "Square(5)", op = "==", exit_code = 0 },
  { variant = "inequality", a = "Circle(5)", b = "Square(5)", op = "!=", exit_code = 1 },
]

# =============================================================================
# Aggregates carrying a string (RUE-1992)
#
# A `StrBuf` is a synthetic struct, so a naive structural walk reaches its `ptr`
# field and 4.3:3e answers with an address compare. A `StrBuf` is a string, so
# the recursion stops there instead and 4.3:3 compares its bytes — wherever the
# walk reaches one: a struct field, an array element, an enum payload field, at
# any depth. The other leaves keep their own rules, so a raw pointer beside a
# string still compares by address.
# =============================================================================

[[case]]
name = "struct_strbuf_field_equality_{variant}"
spec = ["4.3:2", "4.3:3", "4.3:3b"]
real_std = true
description = "A StrBuf field compares by byte content, not by its header."
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

struct Pair { name: StrBuf }

fn mk(s: str) -> StrBuf { StrBuf.from_str(borrow s) }

fn main() -> i32 {
    let a = Pair { name: mk("{left}") };
    let b = Pair { name: mk("{right}") };
    if a {op} b { 1 } else { 0 }
}
"""
params = [
  { variant = "equal_bytes", left = "abc", right = "abc", op = "==", exit_code = 1 },
  { variant = "different_bytes", left = "abc", right = "abd", op = "==", exit_code = 0 },
  { variant = "different_lengths", left = "abc", right = "abcd", op = "==", exit_code = 0 },
  { variant = "inequality", left = "abc", right = "abd", op = "!=", exit_code = 1 },
]

[[case]]
name = "array_of_strbuf_equality_is_element_content"
spec = ["4.3:2", "4.3:3", "4.3:3c"]
real_std = true
description = "Array elements that are strings compare index-by-index on content."
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn mk(s: str) -> StrBuf { StrBuf.from_str(borrow s) }

fn main() -> i32 {
    let a = [mk("ab"), mk("cd")];
    let b = [mk("ab"), mk("cd")];
    let c = [mk("ab"), mk("ce")];
    if a == b && a != c { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "enum_strbuf_payload_equality_is_content"
spec = ["4.3:2", "4.3:3", "4.3:3d"]
real_std = true
description = "A string payload field compares on content; a different variant is never equal."
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

enum Tagged { Empty, Named(StrBuf) }

fn mk(s: str) -> StrBuf { StrBuf.from_str(borrow s) }

fn main() -> i32 {
    let a = Tagged.Named(mk("hi"));
    let b = Tagged.Named(mk("hi"));
    let c = Tagged.Named(mk("ho"));
    let d = Tagged.Empty;
    if a == b && a != c && a != d { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "nested_struct_strbuf_equality_reaches_every_depth"
spec = ["4.3:2", "4.3:3", "4.3:3b"]
real_std = true
description = "A string two aggregates deep still compares on content, beside a scalar leaf."
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

struct Inner { name: StrBuf }
struct Outer { inner: Inner, n: i32 }

fn mk(s: str) -> StrBuf { StrBuf.from_str(borrow s) }

fn main() -> i32 {
    let a = Outer { inner: Inner { name: mk("zz") }, n: 7 };
    let b = Outer { inner: Inner { name: mk("zz") }, n: 7 };
    let c = Outer { inner: Inner { name: mk("zz") }, n: 8 };
    let d = Outer { inner: Inner { name: mk("zy") }, n: 7 };
    if a == b && a != c && a != d { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "struct_strbuf_and_raw_pointer_fields_keep_their_own_rules"
spec = ["4.3:2", "4.3:3", "4.3:3b", "4.3:3e"]
real_std = true
description = "Beside a string field, a raw-pointer leaf still compares by address."
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

struct Marked { name: StrBuf, at: ptr const i32 }

fn mk(s: str) -> StrBuf { StrBuf.from_str(borrow s) }

fn main() -> i32 {
    let x: i32 = 42;
    let y: i32 = 42;
    let a = checked { Marked { name: mk("q"), at: @raw(x) } };
    let b = checked { Marked { name: mk("q"), at: @raw(x) } };
    let c = checked { Marked { name: mk("q"), at: @raw(y) } };
    let d = checked { Marked { name: mk("r"), at: @raw(x) } };
    if a == b && a != c && a != d { 1 } else { 0 }
}
"""
exit_code = 1

# A string *view* is a string too. These cases put the two literals in
# different modules on purpose: identical spellings compiled into one module
# can share a single run, so a same-file test cannot tell a content comparison
# from an address comparison, while separate runs make the difference visible.

[[case]]
name = "struct_str_view_field_equality_is_content"
spec = ["4.3:2", "4.3:3", "4.3:3b"]
description = "A `str` field compares by byte content, not by the run its view points at."
source = """
const view = @import("view.rue");

fn main() -> i32 {
    let mine = view.W { s: "hello" };
    let theirs = view.make();
    let mut r: i32 = 0;
    if mine.s == theirs.s { r = r + 1; }
    if mine == theirs { r = r + 2; }
    if mine != theirs { r = r + 4; }
    r
}
"""
aux_files = { "view.rue" = """
pub struct W { s: str }
pub fn make() -> W { W { s: "hello" } }
""" }
exit_code = 3

[[case]]
name = "struct_str_fixed_field_equality_is_content"
spec = ["4.3:2", "4.3:3", "4.3:3b"]
description = "A `Str(N)` field compares by byte content on the same terms as a `str` one."
source = """
const fixed = @import("fixed.rue");

fn main() -> i32 {
    let mine = fixed.F { s: "hello" };
    let theirs = fixed.make();
    let other = fixed.F { s: "world" };
    let mut r: i32 = 0;
    if mine == theirs { r = r + 1; }
    if mine == other { r = r + 2; }
    if mine != other { r = r + 4; }
    r
}
"""
aux_files = { "fixed.rue" = """
pub struct F { s: Str(8) }
pub fn make() -> F { F { s: "hello" } }
""" }
exit_code = 5

# =============================================================================
# Aggregates carrying a float (`floats` preview, RUE-2001)
#
# A float is an ordinary scalar leaf of the structural recursion, so a float
# field, element, or payload compares exactly the way a top-level `f64 == f64`
# compares: the IEEE-754 equality predicate, not a comparison of the stored
# bits. The two places that distinguishes are signed zero, where `-0.0 == 0.0`
# holds although the bit patterns differ, and `NaN`, where a value is not equal
# to itself although the bit patterns agree.
# =============================================================================

[[case]]
name = "struct_float_field_equality_{variant}"
spec = ["4.3:2", "4.3:3b"]
preview = "floats"
preview_should_pass = true
description = "Float fields compare field-by-field under IEEE equality, at both widths."
source = """
struct Sample { wide: f64, small: f32 }

fn main() -> i32 {
    let a = Sample { wide: {aw}, small: {as} };
    let b = Sample { wide: {bw}, small: {bs} };
    if a {op} b { 1 } else { 0 }
}
"""
params = [
  { variant = "equal", aw = "1.5", as = "2.5", bw = "1.5", bs = "2.5", op = "==", exit_code = 1 },
  { variant = "different_f64_field", aw = "1.5", as = "2.5", bw = "1.25", bs = "2.5", op = "==", exit_code = 0 },
  { variant = "different_f32_field", aw = "1.5", as = "2.5", bw = "1.5", bs = "2.25", op = "==", exit_code = 0 },
  { variant = "inequality", aw = "1.5", as = "2.5", bw = "1.25", bs = "2.5", op = "!=", exit_code = 1 },
]

# The wrapper is one storage slot, so it travels through the primary register
# rather than the per-slot walk. That is the shape that used to lose the float
# register class and reach the float compare with a general-purpose operand
# (RUE-2001).
[[case]]
name = "struct_single_float_field_equality_{width}"
spec = ["4.3:2", "4.3:3b"]
preview = "floats"
preview_should_pass = true
description = "A struct whose only field is a float compares on that field's value."
source = """
struct Wrapper { value: {width} }

fn main() -> i32 {
    let a = Wrapper { value: 1.5 };
    let b = Wrapper { value: 1.5 };
    let c = Wrapper { value: 2.5 };
    if a == b && a != c { 1 } else { 0 }
}
"""
params = [
  { width = "f64", exit_code = 1 },
  { width = "f32", exit_code = 1 },
]

[[case]]
name = "struct_float_field_negative_zero_equals_positive_zero"
spec = ["4.3:2", "4.3:3b"]
preview = "floats"
preview_should_pass = true
description = "`-0.0 == 0.0` inside an aggregate, as it is for a bare float: IEEE equality, not a bit comparison."
source = """
struct Sample { wide: f64, small: f32 }

fn main() -> i32 {
