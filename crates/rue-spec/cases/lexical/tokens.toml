[[case]]
name = "integer_literal_underscores_anywhere"
spec = ["2.1:19"]
source = """
fn main() -> i32 {
    let trailing = 4_2_;
    let after_prefix = 0x_2A;
    let trailing_hex = 0x2A_;
    let doubled = 4__2;
    if trailing == 42 && after_prefix == 42 && trailing_hex == 42 && doubled == 42 {
        42
    } else {
        0
    }
}
"""
