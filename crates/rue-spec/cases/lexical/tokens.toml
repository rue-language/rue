[[case]]
name = "identifier_underscore_start"
spec = ["2.1:11"]
source = """
fn main() -> i32 {
    let _x = 42;
    _x
}
"""
exit_code = 42

[[case]]
name = "identifier_with_digits"
spec = ["2.1:11"]
source = """
fn main() -> i32 {
    let x1 = 42;
    x1
}
"""
exit_code = 42

[[case]]
