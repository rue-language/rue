[[case]]
name = "integer_literal_uppercase_prefix_error"
spec = ["2.1:22"]
source = "fn main() -> i32 { 0XFF }"
compile_fail = true
error_contains = "base prefixes are lowercase"

[[case]]
name = "integer_literal_uppercase_binary_prefix_error"
spec = ["2.1:22"]
source = "fn main() -> i32 { 0B101 }"
compile_fail = true
error_contains = "base prefixes are lowercase"

