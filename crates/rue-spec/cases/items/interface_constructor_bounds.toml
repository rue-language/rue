[[case]]
name = "assertion_subject_can_rely_on_another_program_assertion"
spec = ["6.8:9", "6.8:15", "6.8:24"]
preview = "interfaces"
preview_should_pass = true
source = """
interface Show { fn show(borrow self) -> i64; }
interface Mark { fn mark(borrow self) -> i64; }
struct Value { fn show(borrow self) -> i64 { 1 } }
fn Marked(comptime T: Show) -> type { struct { fn mark(borrow self) -> i64 { 3 } } }
Marked(Value) is Mark;
Value is Show;
fn read(comptime T: Mark, borrow value: T) -> i64 { value.mark() }
fn main() -> i32 { let M = Marked(Value); @intCast(read(M, borrow M {})) }
"""
exit_code = 3

