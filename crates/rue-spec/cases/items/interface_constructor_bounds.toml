[section]
id = "items.interface_constructor_bounds"
name = "Interface bounds in type constructor applications"
description = "Concrete bounds apply uniformly to value calls, declaration types, and assertion subjects."

[[case]]
name = "field_type_checks_constructor_bound"
spec = ["6.8:15", "6.8:24"]
preview = "interfaces"
preview_should_pass = true
source = """
interface Show { fn show(borrow self) -> i64; }
fn Wrapper(comptime T: Show) -> type { struct { value: T } }
struct Container { wrapped: Wrapper(i64) }
fn main() {}
"""
compile_fail = true
error_contains = ["E0305"]

