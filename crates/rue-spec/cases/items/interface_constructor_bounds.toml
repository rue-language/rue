[[case]]
name = "bounded_signature_application_is_checked_after_substitution"
spec = ["6.8:15", "6.8:19", "6.8:24"]
preview = "interfaces"
preview_should_pass = true
source = """
interface Show { fn show(borrow self) -> i64; }
struct Value is Show { fn show(borrow self) -> i64 { 4 } }
fn Wrapper(comptime T: Show) -> type { struct { value: T } }
fn read(comptime T: Show, borrow wrapped: Wrapper(T)) -> i64 { wrapped.value.show() }
fn main() -> i32 {
    let W = Wrapper(Value);
    let wrapped = W { value: Value {} };
    @intCast(read(Value, borrow wrapped))
}
"""
exit_code = 4

[[case]]
name = "anonymous_constructor_argument_uses_program_conformance"
spec = ["6.8:9", "6.8:15", "6.8:24"]
preview = "interfaces"
preview_should_pass = true
source = """
interface Show { fn show(borrow self) -> i64; }
fn Value() -> type { struct { fn show(borrow self) -> i64 { 9 } } }
fn Wrapper(comptime T: Show) -> type { struct { value: T } }
Value() is Show;
struct Container { wrapped: Wrapper(Value()) }
fn main() -> i32 {
    let V = Value();
    let W = Wrapper(V);
    let wrapped = W { value: V {} };
    @intCast(wrapped.value.show())
}
"""
exit_code = 9

[[case]]
name = "recursive_requirement_constructor_is_rejected_without_crashing"
spec = ["6.8:15", "6.8:24"]
preview = "interfaces"
preview_should_pass = true
source = """
interface I { fn wrap(borrow self) -> Wrapped(Self); }
fn Wrapped(comptime T: I) -> type { struct { value: T } }
struct S is I { fn wrap(borrow self) -> Wrapped(S) { @panic("unused") } }
fn main() {}
"""
compile_fail = true
error_contains = ["E1200", "recursive interface-bound verification"]

[[case]]
name = "constructor_value_helper_checks_bound"
