[section]
id = "items.impl-blocks"
spec_chapter = "6.4"
name = "Methods"
description = "Methods defined inline in struct blocks."

# =============================================================================
# Basic Method Syntax
# =============================================================================

[[case]]
name = "impl_block_basic"
spec = ["6.4:1", "6.4:2", "6.4:3", "6.4:4", "6.4:5"]
source = """
struct Point {
    x: i32,
    y: i32,

    fn get_x(self) -> i32 {
        self.x
    }
}

fn main() -> i32 {
    let p = Point { x: 42, y: 10 };
    p.get_x()
}
"""
exit_code = 42

# =============================================================================
# Method Calls
# =============================================================================

[[case]]
name = "method_call_with_args"
spec = ["6.4:6", "6.4:7", "6.4:8", "6.4:9"]
source = """
struct Point {
    x: i32,
    y: i32,

    fn add(self, dx: i32, dy: i32) -> Point {
        Point { x: self.x + dx, y: self.y + dy }
    }
}

fn main() -> i32 {
    let p = Point { x: 10, y: 20 };
    let p2 = p.add(32, 0);
    p2.x
}
"""
exit_code = 42

# =============================================================================
# Method Chaining
# =============================================================================

[[case]]
name = "method_call_chain"
spec = ["6.4:10", "6.4:11"]
source = """
struct Counter {
    value: i32,

    fn inc(self) -> Counter {
        Counter { value: self.value + 1 }
    }
}

fn main() -> i32 {
    let c = Counter { value: 39 };
    c.inc().inc().inc().value
}
"""
exit_code = 42

