# =============================================================================
# Error Cases
# =============================================================================

[[case]]
name = "method_on_non_struct_error"
spec = ["6.4:20"]
source = """
fn main() -> i32 {
    let x: i32 = 42;
    x.foo()
}
"""
compile_fail = true
error_contains = "no method named"

[[case]]
