# Unchecked Code and Raw Pointers
#
# This tests the syntax support for:
# - `unchecked fn` modifier
# - `checked { }` block expressions
# - `ptr const T` and `ptr mut T` type syntax
#
# These features are now part of the language and do not require a preview feature.
# The reason clause on a `checked` block (9.1:14) is behind `--preview checked_reasons`.

[section]
id = "items.unchecked"
spec_chapter = "9.1"
name = "Unchecked Code"
description = "Unchecked functions, checked blocks, and raw pointer types for low-level memory access."

# =============================================================================
# Unchecked function modifier
# =============================================================================

[[case]]
name = "unchecked_fn_basic"
spec = ["9.1:1", "9.1:2"]
source = """
unchecked fn dangerous_op() -> i32 { 42 }
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "unchecked_fn_with_params"
spec = ["9.1:1"]
source = """
unchecked fn read_memory(addr: i32) -> i32 { addr }
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "pub_unchecked_fn"
spec = ["9.1:1"]
source = """
pub unchecked fn public_dangerous() -> i32 { 0 }
fn main() -> i32 { 0 }
"""
exit_code = 0

# =============================================================================
# Checked block expressions
# =============================================================================

[[case]]
name = "checked_block_basic"
spec = ["9.1:4", "9.1:5", "9.1:6"]
source = """
fn main() -> i32 {
    let x = checked { 42 };
    x
}
"""
exit_code = 42

[[case]]
name = "checked_block_nested"
spec = ["9.1:4"]
source = """
fn main() -> i32 {
    checked {
        let x = 10;
        let y = 32;
        x + y
    }
}
"""
exit_code = 42

[[case]]
name = "checked_block_with_statements"
spec = ["9.1:4"]
source = """
fn main() -> i32 {
    let result = checked {
        let a = 20;
        let b = 22;
        a + b
    };
    result
}
"""
exit_code = 42

# =============================================================================
# Pointer type syntax and type checking
# =============================================================================

# These tests verify pointer types are recognized and type-checked
# (PtrConst, PtrMut are fully analyzed; see spec 9.1:8-9.1:12).

[[case]]
name = "ptr_const_type_in_param"
spec = ["9.1:8", "9.1:9"]
source = """
fn takes_ptr(p: ptr const i32) -> i32 { 0 }
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "ptr_mut_type_in_param"
spec = ["9.1:8"]
source = """
fn takes_mut_ptr(p: ptr mut i32) -> i32 { 0 }
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "ptr_const_return_type"
spec = ["9.1:8"]
source = """
// Test that ptr const T can be used as a return type
// Pass the pointer through to verify the return type is recognized
fn identity_ptr(p: ptr const i32) -> ptr const i32 { p }
fn main() -> i32 { if false { identity_ptr(loop {}); } 0 }
"""
exit_code = 0

[[case]]
name = "ptr_to_struct_type"
spec = ["9.1:8"]
source = """
struct Point { x: i32, y: i32 }
fn takes_point_ptr(p: ptr const Point) -> i32 { 0 }
fn main() -> i32 { 0 }
"""
exit_code = 0

# =============================================================================
# Raw pointer type checking (spec 9.1:10)
# =============================================================================

# A pointer type is legal as a struct field (self-referential struct here).
[[case]]
name = "ptr_type_as_struct_field"
spec = ["9.1:10"]
source = """
struct Node { next: ptr const Node, value: i32 }
fn takes_node(n: Node) -> i32 { n.value }
fn main() -> i32 { 0 }
"""
exit_code = 0

# `ptr const T` and `ptr mut T` are distinct types: passing a const pointer
# where a mut pointer is expected is a type error, and the diagnostic names the
# pointee type on both sides.
[[case]]
name = "ptr_const_not_mut_mismatch"
spec = ["9.1:10"]
source = """
fn wants_mut(p: ptr mut i32) -> i32 { 0 }
fn main() -> i32 {
    let x: i32 = 7;
    let p: ptr const i32 = checked { @raw(x) };
    wants_mut(p)
}
"""
compile_fail = true
error_contains = "expected ptr mut i32, found ptr const i32"

# Two pointer types with different pointees are unequal; the message shows the
# distinct pointee types rather than a bare `<ptr const>` placeholder.
[[case]]
name = "ptr_pointee_mismatch_names_pointee"
spec = ["9.1:10"]
source = """
fn wants(p: ptr const i64) -> i32 { 0 }
fn main() -> i32 {
    let x: i32 = 7;
    let p: ptr const i32 = checked { @raw(x) };
    wants(p)
}
"""
compile_fail = true
error_contains = "expected ptr const i64, found ptr const i32"

# =============================================================================
# Unchecked-context enforcement (spec 9.1:1, 9.1:12)
# =============================================================================

# Calling an `unchecked fn` outside a `checked` block is a compile error.
[[case]]
name = "unchecked_fn_call_requires_checked"
spec = ["9.1:1"]
source = """
unchecked fn danger() -> i32 { 42 }
fn main() -> i32 {
    danger()
}
"""
compile_fail = true
error_contains = "requires a `checked` block"

# Calling an `unchecked fn` inside a `checked` block is legal.
[[case]]
name = "unchecked_fn_call_in_checked"
spec = ["9.1:1"]
source = """
unchecked fn danger() -> i32 { 42 }
fn main() -> i32 {
    checked { danger() }
}
"""
exit_code = 42

# A raw-pointer intrinsic used outside a `checked` block is a compile error.
[[case]]
name = "ptr_read_outside_checked_rejected"
spec = ["9.1:12"]
source = """
fn main() -> i32 {
    let x: i32 = 5;
    let p: ptr const i32 = checked { @raw(x) };
    @ptr_read(p)
}
"""
compile_fail = true
error_contains = "requires a `checked` block"

# `@raw` itself is an unchecked operation and is rejected outside `checked`.
[[case]]
name = "raw_outside_checked_rejected"
spec = ["9.1:12"]
source = """
fn main() -> i32 {
    let x: i32 = 5;
    let p: ptr const i32 = @raw(x);
    0
}
"""
compile_fail = true
error_contains = "requires a `checked` block"

# The same pointer operations are accepted inside a `checked` block and run.
[[case]]
name = "ptr_ops_in_checked_ok"
spec = ["9.1:12"]
source = """
fn main() -> i32 {
    let mut x: i32 = 10;
    checked {
        let p: ptr mut i32 = @raw_mut(x);
        @ptr_write(p, 42);
    };
    x
}
"""
exit_code = 42

# =============================================================================
# Checked block reasons (9.1:14-9.1:15, preview feature `checked_reasons`, RUE-1887)
# =============================================================================

[[case]]
name = "checked_reason_accepted_under_preview"
spec = ["9.1:5", "9.1:14", "9.1:15"]
preview = "checked_reasons"
preview_should_pass = true
source = """
fn first(base: ptr const i32, len: u64) -> i32 {
    if len == 0 { return 0; }
    checked "len > 0 was established by the guard above, so index 0 is in bounds" {
        @ptr_read(base)
    }
}

fn main() -> i32 {
    let value: i32 = 42;
    let p: ptr const i32 = checked "value is a live local for the whole call" { @raw(value) };
    first(p, 1)
}
"""
exit_code = 42

[[case]]
name = "checked_reason_does_not_change_the_block_value"
spec = ["9.1:6", "9.1:14"]
preview = "checked_reasons"
preview_should_pass = true
source = """
fn main() -> i32 {
    let x = checked "no unchecked operation; the reason is inert" {
        let a = 10;
        let b = 32;
        a + b
    };
    x
}
"""
exit_code = 42

[[case]]
name = "checked_reason_missing_under_preview_rejected"
spec = ["9.1:14"]
preview = "checked_reasons"
preview_should_pass = true
source = """
fn main() -> i32 {
    let value: i32 = 42;
    let p: ptr const i32 = checked { @raw(value) };
    checked "p points at value, which outlives this read" { @ptr_read(p) }
}
"""
compile_fail = true
error_contains = ["[E1301]", "`checked` block must state the invariant it relies on"]

[[case]]
name = "checked_reason_empty_under_preview_rejected"
spec = ["9.1:14"]
preview = "checked_reasons"
preview_should_pass = true
source = """
fn main() -> i32 {
    checked "" { 42 }
}
"""
compile_fail = true
error_contains = ["[E1301]", "reason must not be empty"]

[[case]]
name = "checked_reason_without_preview_rejected"
spec = ["9.1:14", "8.4:1"]
source = """
fn main() -> i32 {
    checked "a reason without the preview" { 42 }
}
"""
compile_fail = true
error_contains = ["[E1100]", "checked block reasons requires preview feature `checked_reasons`"]

[[case]]
name = "checked_block_without_reason_still_accepted_without_preview"
spec = ["9.1:5", "9.1:14"]
description = "Without the preview, today's reason-less checked blocks compile unchanged"
source = """
fn main() -> i32 {
    let value: i32 = 42;
    let p: ptr const i32 = checked { @raw(value) };
    checked { @ptr_read(p) }
}
"""
exit_code = 42
