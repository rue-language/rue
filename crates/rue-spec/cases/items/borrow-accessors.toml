# ---------------------------------------------------------------------------
# Call-site semantics are enforced through the canonical semantic-body and CFG
# query path; these cases are required provider-path coverage.
# ---------------------------------------------------------------------------

[[case]]
name = "accessor_read_executes_in_place"
spec = ["6.6:8", "6.6:12"]
description = "A guarded accessor call reads the projected element in place; guards run at the call site."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct Grid {
    cells: [i64; 4],

    fn at(borrow self, i: u64) -> borrow i64 {
        if i >= 4 {
            @panic("index out of bounds");
        }
        yield self.cells[i];
    }
}
fn main() -> i32 {
    let g = Grid { cells: [10, 20, 30, 40] };
    let sum = g.at(0) + g.at(3);
    @dbg(sum);
    if sum == 50 { 0 } else { 1 }
}
"""
expected_stdout = "50\n"
exit_code = 0

