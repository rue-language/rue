# Borrow accessors (ADR-0062 phases 0-3, RUE-662/RUE-1017), behind the
# `borrow_accessors` preview.
#
# Shared and exclusive accessor calls survive semantic analysis as marked
# place-producing calls.
# The optimized-CFG query observes the exact accessor CFG dependencies and
# mandatorily splices their guards and yielded place before code generation.

[section]
id = "items.borrow-accessors"
spec_chapter = "6.6"
name = "Borrow Accessors"
description = "Place-returning shared and exclusive accessors with trailing-yield bodies and trusted standard-library collection adoption (ADR-0062 phases 0-3)."

[[case]]
name = "accessor_declaration_parses_and_compiles"
spec = ["6.6:1", "6.6:2"]
description = "The S2 surface: an ordinary fn with `-> borrow T` and a trailing-yield body is accepted under the preview."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct Grid {
    cells: [i64; 4],

    @allow(unused_function)
    fn at(borrow self, i: u64) -> borrow i64 {
        if i >= 4 {
            @panic("index out of bounds");
        }
        yield self.cells[i];
    }
}
fn main() -> i32 {
    let g = Grid { cells: [1, 2, 3, 4] };
    if g.cells[0] == 1 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "mutable_accessor_assignment_rejects_accessor_rhs"
spec = ["5.2:14", "6.6:16"]
description = "A plain assignment retains accessor loans from its RHS while evaluating the target."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,
    fn xr(inout self) -> inout i64 { yield self.x; }
    fn rr(borrow self) -> borrow i64 { yield self.x; }
}
fn main() -> i32 {
    let mut p = P { x: 1 };
    p.xr() = p.rr() + 1;
    0
}
"""
compile_fail = true
error_contains = ["E0259", "another accessor result"]

[[case]]
name = "mutable_accessor_projected_field_assignment_order"
spec = ["5.2:14", "5.2:17", "5.2:18", "6.6:15"]
description = "A projected exclusive accessor place evaluates a receiver-using RHS first and compounds once."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct Cell { value: i64 }
struct P {
    cell: Cell,
    y: i64,
    fn cell_mut(inout self) -> inout Cell { yield self.cell; }
}
fn bump(inout x: i64) -> i64 { x = x + 1; x }
fn main() -> i32 {
    let mut p = P { cell: Cell { value: 1 }, y: 1 };
    p.cell_mut().value = bump(inout p.y);
    p.cell_mut().value += 3;
    if p.cell.value == 5 && p.y == 2 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "nested_accessor_splices_are_repeatable"
spec = ["6.6:8"]
description = "Nested accessor calls form a callee-first splice graph and repeated/diamond-shaped uses do not look recursive."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn inner(borrow self) -> borrow i64 { yield self.x; }
    fn outer(borrow self) -> borrow i64 { yield self.inner(); }
}
fn main() -> i32 {
    let p = P { x: 21 };
    if p.outer() + p.outer() == 42 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "indirect_accessor_recursion_is_rejected"
spec = ["6.6:8"]
description = "An indirect accessor cycle is diagnosed as E0261 before mandatory splicing."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn a(borrow self) -> borrow i64 { yield self.b(); }
    fn b(borrow self) -> borrow i64 { yield self.a(); }
}
fn main() -> i32 {
    let p = P { x: 1 };
    if p.a() == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0261", "directly or through other accessors"]

# 6.6:14 is a legality rule on the declarations alone (RUE-1282): a cycle
# whose every link is a `self`-receiver accessor call is rejected with no call
# site anywhere in the program, exactly like the other accessor shape rules.
[[case]]
name = "uncalled_direct_accessor_recursion_is_rejected"
spec = ["6.6:14"]
description = "A directly self-recursive accessor is E0261 at its declaration, with no call site."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 {
        yield self.xr();
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0261", "an accessor may not invoke itself"]

[[case]]
name = "uncalled_indirect_accessor_recursion_is_rejected"
spec = ["6.6:14"]
description = "A mutual accessor cycle over `self`-receiver calls is E0261 at the declarations, with no call site."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn a(borrow self) -> borrow i64 { yield self.b(); }
    @allow(unused_function)
    fn b(borrow self) -> borrow i64 { yield self.a(); }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0261", "directly or through other accessors"]

# The declaration seam sees only `self`-receiver links; a cycle routed through
# a by-value guard's receiver is the demanded path's to reject, once a call
# site demands analysis and expansion.
[[case]]
name = "guard_receiver_accessor_cycle_is_rejected"
spec = ["6.6:14"]
description = "An accessor cycle whose re-entrant link runs through a by-value guard receiver is still E0261 when demanded."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn a(borrow self, other: P) -> borrow i64 {
        let _ = other.b();
        yield self.x;
    }

    fn b(borrow self) -> borrow i64 {
        yield self.a(P { x: 3 });
    }
}
fn main() -> i32 {
    let p = P { x: 1 };
    if p.a(P { x: 2 }) == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0261"]

[[case]]
name = "projected_receiver_accessor_executes_in_place"
spec = ["6.6:8"]
description = "A projected receiver remains a place when its accessor CFG is spliced."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct Inner {
    x: i64,
    fn value(borrow self) -> borrow i64 { yield self.x; }
}
struct Outer { inner: Inner }
fn main() -> i32 {
    let outer = Outer { inner: Inner { x: 7 } };
    if outer.inner.value() == 7 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "callee_only_nominal_relocates_into_caller_domain"
spec = ["6.6:8"]
description = "Types used only by an accessor body are rematerialized in the caller domain before splicing."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct Marker { value: i64 }
struct P {
    x: i64,
    fn value(borrow self) -> borrow i64 {
        let marker = Marker { value: 1 };
        if marker.value != 1 { @panic("bad marker"); }
        yield self.x;
    }
}
fn main() -> i32 {
    let p = P { x: 9 };
    if p.value() == 9 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "accessor_requires_preview_gate"
spec = ["6.6:3"]
description = "Using the accessor form without --preview borrow_accessors is E1100."
source = """
struct P {
    x: i64,

    fn xr(borrow self) -> borrow i64 {
        yield self.x;
    }
}
fn main() -> i32 {
    let p = P { x: 1 };
    if p.xr() == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E1100", "borrow_accessors"]

[[case]]
name = "accessor_result_position_requires_preview_gate"
spec = ["6.6:3"]
description = "The `-> borrow` result position alone is E1100 without the preview, with no `yield` anywhere in the body."
source = """
fn make() -> borrow i64 {
    5
}
fn main() -> i32 {
    if make() == 5 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E1100", "borrow_accessors"]

[[case]]
name = "accessor_requires_borrow_self"
spec = ["6.6:4"]
description = "An `inout self` accessor is rejected: phase 1 accessors are shared projections (E0257)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn xr(inout self) -> borrow i64 {
        yield self.x;
    }
}
fn main() -> i32 {
    let mut p = P { x: 1 };
    if p.xr() == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0257", "requires a `borrow self` receiver"]

[[case]]
name = "free_function_accessor_is_rejected"
spec = ["6.6:4"]
description = "A `-> borrow` result on a free function is rejected (E0257); the accessor identity is the declared result, not a trailing `yield`."
preview = "borrow_accessors"
preview_should_pass = true
source = """
fn make() -> borrow i64 {
    5
}
fn main() -> i32 {
    if make() == 5 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0257", "this is a free function"]

[[case]]
name = "generic_free_function_accessor_is_rejected"
spec = ["6.6:4"]
description = "A generic free function, which is analyzed only through its specializations, is rejected on the same rule (E0257)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
fn make(comptime T: type, v: T) -> borrow T {
    v
}
fn main() -> i32 {
    if make(i64, 5) == 5 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0257", "this is a free function"]

[[case]]
name = "accessor_params_are_by_value"
spec = ["6.6:5"]
description = "A `borrow`-mode accessor parameter is rejected (E0260)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn xr(borrow self, borrow k: i64) -> borrow i64 {
        yield self.x;
    }
}
fn main() -> i32 {
    let p = P { x: 1 };
    let k = 2;
    if p.xr(borrow k) == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0260", "must be by-value"]

[[case]]
name = "accessor_body_requires_trailing_yield"
spec = ["6.6:6"]
description = "An accessor body whose final statement is not a yield is rejected (E0254)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn xr(borrow self) -> borrow i64 {
        self.x
    }
}
fn main() -> i32 {
    let p = P { x: 1 };
    if p.xr() == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0254", "single trailing `yield`"]

[[case]]
name = "yield_outside_accessor_rejected"
spec = ["6.6:6"]
description = "A `yield` outside an accessor body is rejected (E0256)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
fn main() -> i32 {
    yield 1;
}
"""
compile_fail = true
error_contains = ["E0256", "only valid inside the body of a `-> borrow` or `-> inout` accessor"]

[[case]]
name = "accessor_yield_must_root_at_receiver"
spec = ["6.6:7"]
description = "Yielding a place not rooted at `self` is rejected (E0255)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn xr(borrow self, other: i64) -> borrow i64 {
        yield other;
    }
}
fn main() -> i32 {
    let p = P { x: 1 };
    if p.xr(2) == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0255", "place rooted at `self`"]

# ---------------------------------------------------------------------------
# Declared but never called (RUE-1212). 6.6:3-6.6:7 are legality rules on the
# declaration, so they hold with no call site anywhere in the program: the
# signature, the body's exits, and the yielded projection's root are all
# decidable from the declaration's own syntax.
#
# Two parts of 6.6 remain demand-driven, both because they need resolved
# types. A projection chain through a nested method call is legal only when
# that method is itself an accessor, which the declaration cannot tell from a
# plain method (covered with a call site by
# `accessor_yield_through_plain_method_is_rejected`); and a `yield` in a body
# that is not an accessor's is E0256 from the body analysis, since an ordinary
# declaration retains no body to inspect.
# ---------------------------------------------------------------------------

[[case]]
name = "uncalled_accessor_requires_preview_gate"
spec = ["6.6:3"]
description = "An accessor nothing calls is still accessor surface: E1100 without the preview."
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 {
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E1100", "borrow_accessors"]

[[case]]
name = "uncalled_accessor_requires_borrow_self"
spec = ["6.6:4"]
description = "The receiver rule holds on a declaration nothing calls (E0257)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(inout self) -> borrow i64 {
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0257", "requires a `borrow self` receiver"]

[[case]]
name = "uncalled_associated_function_accessor_is_rejected"
spec = ["6.6:4"]
description = "An associated function has no receiver to project from, called or not (E0257)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(k: i64) -> borrow i64 {
        yield k;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0257", "an associated function with no receiver"]

[[case]]
name = "uncalled_accessor_params_are_by_value"
spec = ["6.6:5"]
description = "The parameter-mode rule holds on a declaration nothing calls (E0260)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self, borrow k: i64) -> borrow i64 {
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0260", "must be by-value"]

[[case]]
name = "uncalled_accessor_body_requires_trailing_yield"
spec = ["6.6:6"]
description = "An accessor body with no trailing `yield` is rejected with no call site (E0254)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 {
        self.x
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0254", "single trailing `yield`"]

[[case]]
name = "uncalled_accessor_body_rejects_a_second_yield"
spec = ["6.6:6"]
description = "A second `yield` bypasses the trailing exit, with no call site (E0254)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 {
        yield self.x;
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0254", "single trailing `yield`", "a second `yield`"]

[[case]]
name = "uncalled_accessor_body_rejects_return"
spec = ["6.6:6"]
description = "An accessor body may not contain `return`, with no call site (E0254)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self, k: i64) -> borrow i64 {
        if k == 0 {
            return 1;
        }
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0254", "single trailing `yield`", "a `return`"]

[[case]]
name = "uncalled_accessor_body_rejects_try"
spec = ["6.6:6"]
description = "An accessor body may not contain `?`, with no call site (E0254)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 {
        let parsed = @parse_i64("1")?;
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0254", "single trailing `yield`", "a `?`"]

[[case]]
name = "uncalled_accessor_yield_must_root_at_receiver"
spec = ["6.6:7"]
description = "Yielding a parameter other than the receiver is rejected with no call site (E0255)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self, other: i64) -> borrow i64 {
        yield other;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0255", "place rooted at `self`", "`other`"]

[[case]]
name = "uncalled_accessor_yield_of_a_computed_value_is_rejected"
spec = ["6.6:7"]
description = "Yielding a computed value, not a place, is rejected with no call site (E0255)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 {
        yield self.x + 1;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0255", "place rooted at `self`", "a value expression"]

[[case]]
name = "uncalled_nested_accessor_yield_compiles"
spec = ["6.6:7"]
description = "Control: a nested accessor call is a legal projection link, so an uncalled accessor chain compiles."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,
    cells: [i64; 4],

    @allow(unused_function)
    fn inner(borrow self) -> borrow i64 { yield self.x; }

    @allow(unused_function)
    fn outer(borrow self) -> borrow i64 { yield self.inner(); }

    @allow(unused_function)
    fn at(borrow self, i: u64) -> borrow i64 {
        if i >= 4 {
            @panic("index out of bounds");
        }
        yield self.cells[i];
    }
}
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "accessor_yield_through_plain_method_is_rejected"
spec = ["6.6:7"]
description = "A projection link through a non-accessor method of the receiver is rejected (E0255) with nothing calling the accessor: whether a `self.m()` link names an accessor is a parsed fact of the owner's other declarations."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn plain(borrow self) -> i64 { self.x }

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 { yield self.plain(); }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0255", "not an accessor projection"]

[[case]]
name = "called_accessor_yield_through_plain_method_is_rejected"
spec = ["6.6:7"]
description = "The same link is rejected from the call site, where the demanded body walk decides every link from the receiver's resolved type."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn plain(borrow self) -> i64 { self.x }
    fn xr(borrow self) -> borrow i64 { yield self.plain(); }
}
fn main() -> i32 {
    let p = P { x: 1 };
    if p.xr() == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0255", "not an accessor projection"]

[[case]]
name = "accessor_yield_through_a_chained_type_s_accessor_compiles"
spec = ["6.6:7"]
description = "A link whose receiver is not the accessor's own `self` names a method of another type, which the declaration cannot resolve; it stays permissive there and the demanded path decides it."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct Inner {
    v: i64,

    fn get(borrow self) -> borrow i64 { yield self.v; }
}
struct P {
    inner: Inner,

    fn a(borrow self) -> borrow Inner { yield self.inner; }
    fn chained(borrow self) -> borrow i64 { yield self.a().get(); }
}
fn main() -> i32 {
    let p = P { inner: Inner { v: 0 } };
    @intCast(p.chained())
}
"""
exit_code = 0

[[case]]
name = "uncalled_legal_accessor_compiles"
spec = ["6.6:1", "6.6:2"]
description = "Control: a well-formed accessor nothing calls compiles, so the unconditional declaration rules reject only ill-formed ones."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 {
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "accessor_may_not_call_itself"
spec = ["6.6:14"]
description = "A directly self-recursive accessor has no finite inline expansion (E0261)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

    fn xr(borrow self) -> borrow i64 {
        yield self.xr();
    }
}
fn main() -> i32 {
    let p = P { x: 1 };
    if p.xr() == 1 { 0 } else { 1 }
}
"""
compile_fail = true
error_contains = ["E0261", "an accessor may not invoke itself"]

# ---------------------------------------------------------------------------
# Call-site semantics are enforced through the canonical semantic-body and CFG
# query path; these cases are required provider-path coverage.
# ---------------------------------------------------------------------------

[[case]]
name = "accessor_read_executes_in_place"
spec = ["6.6:8", "6.6:12"]
description = "A guarded accessor call reads the projected element in place; guards run at the call site."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct Grid {
    cells: [i64; 4],

    fn at(borrow self, i: u64) -> borrow i64 {
        if i >= 4 {
            @panic("index out of bounds");
        }
        yield self.cells[i];
    }
}
fn main() -> i32 {
    let g = Grid { cells: [10, 20, 30, 40] };
    let sum = g.at(0) + g.at(3);
    @dbg(sum);
    if sum == 50 { 0 } else { 1 }
}
"""
expected_stdout = "50\n"
exit_code = 0

[[case]]
name = "accessor_guard_traps_out_of_bounds"
spec = ["6.6:12"]
description = "The accessor's guard panics at the call site for an out-of-bounds index."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct Grid {
    cells: [i64; 4],

    fn at(borrow self, i: u64) -> borrow i64 {
        if i >= 4 {
            @panic("index out of bounds");
        }
        yield self.cells[i];
    }
}
fn main() -> i32 {
    let g = Grid { cells: [10, 20, 30, 40] };
    if g.at(9) == 0 { 0 } else { 1 }
}
"""
exit_code = 101
stderr_contains = "panic: index out of bounds"

[[case]]
name = "accessor_result_cannot_be_returned"
spec = ["6.6:9"]
description = "Returning an accessor result escapes its full expression (E0250)."
preview = "borrow_accessors"
preview_should_pass = true
source = """
struct P {
    x: i64,

