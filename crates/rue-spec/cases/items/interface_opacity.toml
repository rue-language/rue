[[case]]
name = "bounded_arraybuf_borrowing_needs_no_element_layout"
spec = ["6.8:17", "6.8:19", "6.8:20", "6.8:22"]
preview = "interfaces"
preview_should_pass = true
real_std = true
source = """
const std = @import("std");
const Equatable = std.interfaces.Equatable;
const ArrayBuf = std.arraybuf.ArrayBuf;
fn contains(comptime T: Equatable, borrow xs: ArrayBuf(T), borrow x: T) -> bool {
    let mut i: u64 = 0;
    while i < xs.len() {
        if xs.get_ref(i).equals(borrow x) { return true; }
        i += 1;
    }
    false
}
struct Id is Equatable {
    n: i64,
    fn equals(borrow self, borrow other: Id) -> bool { self.n == other.n }
}
fn main() -> i32 { 0 }
"""
exit_code = 0
