[section]
id = "items.interface_opacity"
name = "Opaque types in interface definition checks"
description = "Definition checking does not expose synthetic layout or ownership properties."

[[case]]
name = "uncalled_size_query_is_rejected"
spec = ["6.8:19", "6.8:20", "6.8:22"]
preview = "interfaces"
preview_should_pass = true
source = """
interface Show { fn show(borrow self) -> i64; }
fn size(comptime T: Show) -> i32 { @size_of(T) }
fn main() {}
"""
compile_fail = true
error_contains = ["opaque bounded type"]

[[case]]
name = "uncalled_alignment_query_is_rejected"
spec = ["6.8:19", "6.8:20", "6.8:22"]
preview = "interfaces"
preview_should_pass = true
source = """
interface Show { fn show(borrow self) -> i64; }
fn align(comptime T: Show) -> i32 { @align_of(T) }
