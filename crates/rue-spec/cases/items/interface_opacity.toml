[[case]]
name = "nested_aggregate_layout_query_is_rejected"
spec = ["6.8:19", "6.8:20", "6.8:22"]
preview = "interfaces"
preview_should_pass = true
source = """
interface Show { fn show(borrow self) -> i64; }
fn Box(comptime T: type) -> type { struct { inner: T } }
fn size(comptime T: Show) -> i32 { @size_of(Box(Box(T))) }
fn main() {}
"""
compile_fail = true
error_contains = ["opaque bounded type"]

[[case]]
name = "associated_type_layout_query_is_rejected"
spec = ["6.8:19", "6.8:20", "6.8:22"]
preview = "interfaces"
preview_should_pass = true
source = """
fn Box(comptime U: type) -> type {
    struct { value: U, fn size(borrow self) -> i32 { @size_of(U) } }
}
interface Items { const Element: type; fn item(borrow self) -> Box(Element); }
fn size(comptime T: Items, borrow xs: T) -> i32 {
    let item = xs.item();
    item.size()
}
fn main() {}
"""
compile_fail = true
error_contains = ["opaque bounded type"]

