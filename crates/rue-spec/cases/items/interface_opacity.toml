[[case]]
name = "independently_nonowning_types_pass_trivial_drop_gates"
spec = ["6.8:20"]
preview = "interfaces"
preview_should_pass = true
source = """
interface Show { fn show(borrow self) -> i64; }
fn check(comptime T: Show) {
    @require_trivially_droppable(ptr const T);
    @require_trivially_droppable(ptr mut T);
    @require_trivially_droppable([T; 0]);
}
fn main() -> i32 { 0 }
"""
exit_code = 0

