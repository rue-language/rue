[section]
id = "items.functions"
spec_chapter = "6.1"
name = "Functions"
description = "Function declarations with the fn keyword, including parameters and function calls. The entry point must be named 'main'."

# =============================================================================
# Basic function declarations (no parameters)
# =============================================================================

[[case]]
name = "simple_main"
spec = ["6.1:1", "6.1:7", "6.1:8"]
source = "fn main() -> i32 { 0 }"
exit_code = 0

[[case]]
name = "main_unit_return"
spec = ["6.1:8"]
source = "fn main() {}"
exit_code = 0

[[case]]
name = "main_runtime_parameter_rejected"
spec = ["6.1:8"]
source = "fn main(value: i32) -> i32 { value }"
compile_fail = true
error_contains = ["E0211", "`main` must not declare parameters"]

[[case]]
name = "main_comptime_parameter_rejected"
spec = ["6.1:8"]
