# =============================================================================
# Struct parameters
# =============================================================================

[[case]]
name = "struct_param_simple"
spec = ["6.1:3"]
description = "Function taking a struct parameter"
source = """
struct Point { x: i32, y: i32 }
fn get_x(p: Point) -> i32 { p.x }
fn main() -> i32 {
    let p = Point { x: 42, y: 10 };
    get_x(p)
}
"""
exit_code = 42

[[case]]
name = "struct_param_nested_{variant}"
spec = ["6.1:3"]
description = "Struct parameter with nested field access"
source = """
struct Inner { a: i32, b: i32 }
struct Outer { inner: Inner, other: i32 }
fn {fn_name}(o: Outer) -> i32 { {body} }
fn main() -> i32 {
    let o = Outer { inner: Inner { a: {a}, b: {b} }, other: {other} };
    {fn_name}(o)
}
"""
params = [
  { variant = "sum", fn_name = "get_inner_sum", body = "o.inner.a + o.inner.b", a = "10", b = "20", other = "100", exit_code = 30 },
  { variant = "all_slots", fn_name = "sum_all", body = "o.inner.a + o.inner.b + o.other", a = "1", b = "2", other = "42", exit_code = 45 },
  { variant = "later_field", fn_name = "get_other", body = "o.other", a = "10", b = "20", other = "42", exit_code = 42 },
]

[[case]]
name = "struct_return_nested"
spec = ["6.1:3"]
description = "Returning a struct with nested structs uses correct slot count"
source = """
struct Inner { a: i32, b: i32 }
struct Outer { inner: Inner, other: i32 }
fn make_outer() -> Outer {
    Outer { inner: Inner { a: 1, b: 2 }, other: 42 }
}
fn main() -> i32 {
    let o = make_outer();
    o.inner.a + o.inner.b + o.other
}
"""
exit_code = 45

[[case]]
name = "struct_nested_three_levels"
spec = ["6.1:3"]
description = "Passing deeply nested structs computes correct slot counts"
source = """
struct Level0 { value: i32 }
struct Level1 { inner: Level0, x: i32 }
struct Level2 { inner: Level1, y: i32 }
fn sum_deep(l: Level2) -> i32 { l.inner.inner.value + l.inner.x + l.y }
fn main() -> i32 {
    let l = Level2 { inner: Level1 { inner: Level0 { value: 10 }, x: 20 }, y: 12 };
    sum_deep(l)
}
"""
exit_code = 42

