spec = ["6.1:12"]
description = "Functions can have mutual forward references"
source = """
fn first(x: i32) -> i32 {
    if x <= 0 { 0 }
    else { second(x - 1) + 1 }
}
fn second(x: i32) -> i32 { first(x) }
fn main() -> i32 { first(5) }
"""
exit_code = 5

