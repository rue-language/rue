[section]
id = "items.constants"
spec_chapter = "6.5"
name = "Constant Items"
description = "Constant declarations: comptime-evaluated initializers, required type annotations, dependency-ordered evaluation (spec chapter 6.5)."

# =============================================================================
# Declaration form (6.5:1)
# =============================================================================

[[case]]
name = "const_declaration_forms"
spec = ["6.5:1"]
description = "pub and non-pub annotated const items declare usable constants"
source = """
pub const A: i32 = 30;
const B: i32 = 12;

fn main() -> i32 { A + B }
"""
exit_code = 42

# =============================================================================
# Comptime-evaluable initializers (6.5:2)
# =============================================================================

[[case]]
name = "negated_literal_initializer"
spec = ["6.5:2", "6.5:3"]
description = "A negated literal is a legal const initializer (RUE-171)"
source = """
const NEG: i32 = -5;

fn main() -> i32 { NEG + 47 }
"""
exit_code = 42

[[case]]
name = "operator_and_const_ref_initializers"
spec = ["6.5:2", "6.5:3"]
description = "Arithmetic, boolean operators, and references to other constants"
source = """
const AREA: i32 = 6 * 7;
const DOUBLE: i32 = AREA + AREA;
const FLAG: bool = !false;

fn main() -> i32 {
    if FLAG { DOUBLE - AREA } else { 0 }
}
"""
exit_code = 42

[[case]]
name = "comptime_block_initializer"
spec = ["6.5:2"]
description = "A comptime block is a legal const initializer"
source = """
const X: i32 = comptime { 40 + 2 };

fn main() -> i32 { X }
"""
exit_code = 42

[[case]]
name = "non_evaluable_initializer_rejected"
spec = ["6.5:2"]
description = "A runtime function call is not compile-time evaluable (E0434)"
source = """
fn get() -> i32 { 42 }
const X: i32 = get();

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "not supported in const context"

# =============================================================================
# Required type annotations (6.5:4)
# =============================================================================

[[case]]
name = "unannotated_integer_const_rejected"
spec = ["6.5:4", "6.5:11"]
description = "A value constant without a type annotation is E0475"
source = """
const N = 42;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0475", "missing type annotation on constant 'N'"]

[[case]]
name = "unannotated_bool_const_rejected"
spec = ["6.5:4"]
description = "Boolean value constants require an annotation too"
source = """
const FLAG = true;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0475", "missing type annotation on constant 'FLAG'"]

[[case]]
name = "annotated_bool_const"
spec = ["6.5:4"]
description = "An annotated boolean constant has type bool"
source = """
const FLAG: bool = true;

fn main() -> i32 { if FLAG { 7 } else { 1 } }
"""
exit_code = 7

[[case]]
name = "module_binding_needs_no_annotation"
spec = ["6.5:4"]
description = "Module bindings are not value constants: no annotation required"
source = """
const cfg = @import("cfg.rue");
const X: i32 = cfg.LIMIT;

fn main() -> i32 { X }
"""
aux_files = { "cfg.rue" = "pub const LIMIT: i32 = 42;" }
exit_code = 42

# =============================================================================
# Annotated types (6.5:5)
# =============================================================================

[[case]]
name = "annotation_adopted_when_value_fits"
spec = ["6.5:5", "6.5:6"]
description = "An integer value adopts any integer annotation it fits in"
source = """
const SMALL: u8 = 200;

fn takes_u8(x: u8) -> i32 { 1 }

fn main() -> i32 { takes_u8(SMALL) }
"""
exit_code = 1

[[case]]
name = "big_literal_with_i64_annotation"
spec = ["6.5:5", "6.5:6"]
description = "A literal that does not fit i32 works with an i64 annotation"
source = """
const BIG: i64 = 5000000000;

fn main() -> i32 {
    if BIG / 1000000000 == 5 { 5 } else { 1 }
}
"""
exit_code = 5

[[case]]
name = "huge_literal_with_u64_annotation"
spec = ["6.5:5", "6.5:6"]
description = "A literal beyond i64::MAX works with a u64 annotation"
source = """
const HUGE: u64 = 18446744073709551615;

fn main() -> i32 {
    if HUGE > 18446744073709551614 { 3 } else { 1 }
}
"""
exit_code = 3

[[case]]
name = "annotation_out_of_range_rejected_at_declaration"
spec = ["6.5:5"]
description = "An out-of-range value is rejected at the declaration"
source = """
const X: u8 = 300;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "out of range"

[[case]]
name = "negative_value_out_of_unsigned_range"
spec = ["6.5:5"]
description = "A negative value cannot adopt an unsigned annotation"
source = """
const N: u8 = -5;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "out of range"

[[case]]
name = "non_integer_annotation_must_match"
spec = ["6.5:5"]
description = "A non-integer annotation must match the value's type exactly"
source = """
const X: bool = 5;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "type mismatch"

# =============================================================================
# Evaluation order (6.5:7) and cycles (6.5:8)
# =============================================================================

[[case]]
name = "forward_reference_same_file"
spec = ["6.5:7", "6.5:9"]
description = "A const may reference a const declared later in the file"
source = """
const A: i32 = B + 1;
const B: i32 = C * 2;
const C: i32 = 10;

fn main() -> i32 { A }
"""
exit_code = 21

[[case]]
name = "forward_reference_across_files"
spec = ["6.5:7", "6.5:10"]
description = "A const may reference a const declared in another (imported) file"
source = """
const cfg = @import("cfg.rue");
const BASE: i32 = cfg.LIMIT;
const DERIVED: i32 = BASE + 1;

fn main() -> i32 { DERIVED }
"""
aux_files = { "cfg.rue" = "pub const LIMIT: i32 = 41;" }
exit_code = 42

[[case]]
name = "initializer_cycle_is_error"
spec = ["6.5:8", "6.5:9"]
description = "A reference cycle between const initializers is a compile error, not a hang"
source = """
const A: i32 = B;
const B: i32 = A;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "cycle detected in constant initializers"

[[case]]
name = "self_referential_const_is_error"
spec = ["6.5:8"]
description = "A self-referential const is the smallest cycle"
source = """
const SELF: i32 = SELF;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "cycle detected in constant initializers"

# =============================================================================
# Const-evaluation trapping (6.5:12) — RUE-299
# =============================================================================

[[case]]
name = "const_overflow_is_compile_error"
spec = ["6.5:12"]
description = "Integer overflow while evaluating a const initializer is a compile-time error (E1200)"
source = """
const OVF: i32 = 2147483647 + 1;
fn main() -> i32 { OVF }
"""
compile_fail = true
error_contains = ["E1200", "overflow"]

[[case]]
name = "const_division_by_zero_is_compile_error"
spec = ["6.5:12"]
description = "Division by zero while evaluating a const initializer is a compile-time error (E1200)"
source = """
const DIV: i32 = 5 / 0;
fn main() -> i32 { DIV }
"""
compile_fail = true
error_contains = ["E1200", "division by zero"]

[[case]]
name = "const_remainder_by_zero_is_compile_error"
spec = ["6.5:12"]
description = "Remainder by zero while evaluating a const initializer is a compile-time error (E1200)"
source = """
const REM: i32 = 5 % 0;
fn main() -> i32 { REM }
"""
compile_fail = true
error_contains = ["E1200", "remainder by zero"]

[[case]]
name = "const_aggregate_initializer_rejected"
spec = ["6.5:2"]
description = "A struct literal is not compile-time evaluable, so an aggregate value const is rejected (E0434) (RUE-299)"
source = """
struct P { x: i32, y: i32 }
const O: P = P { x: 1, y: 2 };
fn main() -> i32 { O.x }
"""
compile_fail = true
error_contains = ["E0434"]

# =============================================================================
# String constants (6.5:16)
# =============================================================================

[[case]]
name = "string_const_basic"
spec = ["6.5:2", "6.5:16", "6.5:17"]
description = "A string-literal initializer declares a str constant usable like an inline literal (RUE-957)"
source = """
const GREETING: str = "hello";
const EMPTY: str = "";

fn main() -> i32 {
    let g = GREETING;
    @intCast(g.len() + GREETING.len() + EMPTY.len())
}
"""
exit_code = 10

[[case]]
name = "string_const_alias"
spec = ["6.5:16"]
description = "A constant initialized from another string constant denotes the same value"
source = """
const A: str = "rue";
const B: str = A;

fn main() -> i32 {
    @intCast(B.len() + A.len())
}
"""
exit_code = 6

[[case]]
name = "string_const_module_member"
spec = ["6.5:16"]
description = "A pub string constant is usable through module member access"
source = """
const util = @import("util.rue");

fn main() -> i32 {
    let n = util.NAME;
    @intCast(n.len() + util.NAME.len())
}
"""
aux_files = { "util.rue" = "pub const NAME: str = \"rue-util\";" }
exit_code = 16

[[case]]
name = "unannotated_string_const_rejected"
spec = ["6.5:4", "6.5:16"]
description = "String constants require an annotation like every value constant; the help names str"
source = """
const S = "hello";

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0475", "const S: str = ...;"]

[[case]]
name = "string_const_non_str_annotation_rejected"
spec = ["6.5:5", "6.5:16"]
description = "A string constant's annotation must be str; other annotations are a type mismatch"
source = """
const S: i64 = "hello";

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0206", "expected i64, found str"]

[[case]]
name = "string_const_not_comptime_evaluable"
spec = ["6.5:2", "6.5:16"]
description = "String values stay outside comptime blocks"
source = """
const S: str = "hello";

fn main() -> i32 {
    comptime { S }
}
"""
compile_fail = true
error_contains = ["comptime"]
