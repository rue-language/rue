[[case]]
name = "const_comptime_call_returns_nested_aggregate"
spec = ["6.5:1", "6.5:2", "4.14:26", "4.14:27", "3.12:11"]
description = "A comptime-evaluated call's nested aggregate return reduces at its slot's type both in a comptime block and in a constant's initializer: a nested array, a struct with an array field, an enum with an array payload, and integer literals filling a nested float array (RUE-2390)"
source = """
fn f_arr(comptime k: i32) -> [[i32; 2]; 2] { [[1, 2], [3, k]] }
@copy struct S { a: [u8; 2], b: i16 }
fn f_struct(comptime k: u8) -> S { S { a: [200, k], b: -2 } }
enum E { A([u8; 2]), B }
fn f_enum(comptime k: u8) -> E { E.A([200, k]) }
fn f_float(comptime k: u64) -> [[f32; 2]; 1] { [[1, 2]] }
fn g(comptime k: i32) -> [[i32; 2]; 2] { [[1, 2], [3, k]] }
const D: [[i32; 2]; 2] = g(40);
fn main() -> i32 {
    let a = comptime { f_arr(40) };
    let s = comptime { f_struct(40) };
    let e = comptime { f_enum(40) };
    let fl = comptime { f_float(1) };
    let arr_ok = a[1][1] == 40 && a[0][1] == 2;
    let struct_ok = @intCast(s.a[1]) == 40 && @intCast(s.b) == -2;
    let enum_ok = match e { E.A(x) => @intCast(x[1]) == 40, E.B => false };
    let const_ok = D[1][1] == 40 && D[0][1] == 2;
    let float_ok = fl[0][1] == 2.0;
    if arr_ok && struct_ok && enum_ok && const_ok && float_ok { 42 } else { 1 }
}
"""
exit_code = 42

[[case]]
name = "const_array_length_from_nested_const"
spec = ["7.1:41", "6.5:2", "4.14:27"]
description = "An array length call folds a comptime parameter of nested aggregate type, indexing into a nested array constant and a struct constant's array field alike (RUE-2390)"
source = """
const A: [[u64; 2]; 2] = [[1, 2], [3, 3]];
fn n(comptime a: [[u64; 2]; 2]) -> u64 { a[1][1] }
@copy struct S { a: [u64; 2] }
const C: S = S { a: [1, 3] };
fn m(comptime s: S) -> u64 { s.a[1] }
fn main() -> i32 {
    let x: [i32; n(A)] = [7; 3];
    let y: [i32; m(C)] = [9; 3];
    x[2] + y[2] - 5
}
"""
exit_code = 11
