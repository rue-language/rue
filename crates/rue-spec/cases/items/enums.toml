[section]
id = "items.enums"
spec_chapter = "6.3"
name = "Enums"
description = "Enum definitions and enum variants."

# =============================================================================
# Enum Definition
# =============================================================================

[[case]]
name = "enum_basic"
spec = ["6.3:1", "6.3:2"]
source = """
enum Color { Red, Green, Blue }
fn main() -> i32 {
    let c = Color.Red;
    0
}
"""
exit_code = 0

[[case]]
name = "enum_single_variant"
spec = ["6.3:1"]
source = """
enum Single { Only }
fn main() -> i32 {
    let s = Single.Only;
    0
}
"""
exit_code = 0

[[case]]
name = "enum_many_variants"
spec = ["6.3:1"]
source = """
enum Direction { North, East, South, West }
fn main() -> i32 {
    let d = Direction.South;
    0
}
"""
exit_code = 0

[[case]]
name = "enum_zero_variants"
spec = ["6.3:1", "6.3:12"]
source = """
enum Void {}
fn main() -> i32 {
    0
}
"""
exit_code = 0

[[case]]
name = "enum_zero_variants_as_param"
spec = ["6.3:10", "6.3:12"]
source = """
enum Void {}
fn takes_void(v: Void) -> i32 {
    0
}
fn main() -> i32 {
    0
}
"""
exit_code = 0

# =============================================================================
# Unique Variant Names
# =============================================================================

[[case]]
name = "duplicate_variant_names_error"
spec = ["6.3:3"]
source = """
enum Bad { X, X }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "duplicate"

# =============================================================================
# Unknown Enum Type Error
# =============================================================================

[[case]]
name = "unknown_enum_type_error"
spec = ["6.3:4"]
source = """
fn main() -> i32 {
    let c = Unknown.Red;
    0
}
"""
compile_fail = true
# With `.` as the sole member-access spelling (RUE-488), `Unknown.Red` where
# `Unknown` names nothing is an undefined-name reference — the parser cannot
# distinguish it from ordinary field access on a variable.
error_contains = "undefined variable"

# =============================================================================
# Unknown Variant Error
# =============================================================================

[[case]]
name = "unknown_variant_error"
spec = ["6.3:5"]
source = """
enum Color { Red, Green, Blue }
fn main() -> i32 {
    let c = Color.Yellow;
    0
}
"""
compile_fail = true
error_contains = "unknown"

# =============================================================================
# Match on Enum
# =============================================================================

[[case]]
name = "match_enum_exhaustive"
spec = ["4.7:7", "4.7:10", "6.3:7", "6.3:8"]
source = """
enum Color { Red, Green, Blue }
fn main() -> i32 {
    let c = Color.Green;
    match c {
        Color.Red => 1,
        Color.Green => 2,
        Color.Blue => 3,
    }
}
"""
exit_code = 2

[[case]]
name = "match_enum_with_wildcard"
spec = ["4.7:4", "4.7:7", "4.7:10", "6.3:7", "6.3:8"]
source = """
enum Color { Red, Green, Blue }
fn main() -> i32 {
    let c = Color.Blue;
    match c {
        Color.Red => 1,
        _ => 99,
    }
}
"""
exit_code = 99

[[case]]
name = "match_enum_non_exhaustive_error"
spec = ["4.7:9", "4.7:10", "6.3:8"]
source = """
enum Color { Red, Green, Blue }
fn main() -> i32 {
    let c = Color.Red;
    match c {
        Color.Red => 1,
        Color.Green => 2,
    }
}
"""
compile_fail = true
error_contains = "exhaustive"

[[case]]
name = "non_exhaustive_enum_requires_preview"
spec = ["6.3:21"]
source = """
@non_exhaustive pub enum Color { Red, Green }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E1100", "non_exhaustive_enums"]

[[case]]
name = "non_exhaustive_enum_private_rejected"
spec = ["6.3:21"]
preview = "non_exhaustive_enums"
preview_should_pass = true
source = """
@non_exhaustive enum Color { Red, Green }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "public enums"

[[case]]
name = "non_exhaustive_enum_internal_match_remains_exhaustive"
spec = ["6.3:21"]
preview = "non_exhaustive_enums"
preview_should_pass = true
source = """
@non_exhaustive pub enum Color { Red, Green }
fn classify(c: Color) -> i32 {
    match c { Color.Red => 1, Color.Green => 2 }
}
fn main() -> i32 { classify(Color.Red) }
"""
exit_code = 1

[[case]]
name = "non_exhaustive_enum_external_match_keeps_wildcard_reachable"
spec = ["6.3:21", "6.3:22"]
preview = "non_exhaustive_enums"
preview_should_pass = true
source = """
const colors = @import("colors.rue");
fn main() -> i32 {
    match colors.pick() {
        colors.Color.Red => 1,
        colors.Color.Green => 2,
        _ => 3,
    }
}
"""
aux_files = { "colors.rue" = """
@non_exhaustive pub enum Color { Red, Green }
pub fn pick() -> Color { Color.Green }
""" }
exit_code = 2
no_warnings = true

[[case]]
name = "match_enum_first_variant"
spec = ["4.7:7", "4.7:10", "6.3:7"]
source = """
enum Color { Red, Green, Blue }
fn main() -> i32 {
    let c = Color.Red;
    match c {
        Color.Red => 42,
        Color.Green => 0,
        Color.Blue => 0,
    }
}
"""
exit_code = 42

[[case]]
name = "match_enum_last_variant"
spec = ["4.7:7", "4.7:10", "6.3:7"]
source = """
enum Color { Red, Green, Blue }
fn main() -> i32 {
    let c = Color.Blue;
    match c {
        Color.Red => 0,
        Color.Green => 0,
        Color.Blue => 42,
    }
}
"""
exit_code = 42

# =============================================================================
# Enum in Function Parameters and Return Types
# =============================================================================

[[case]]
name = "enum_as_parameter"
spec = ["6.3:10"]
source = """
enum Color { Red, Green, Blue }
fn color_value(c: Color) -> i32 {
    match c {
        Color.Red => 1,
        Color.Green => 2,
        Color.Blue => 3,
    }
}
fn main() -> i32 {
    color_value(Color.Green)
}
"""
exit_code = 2

[[case]]
name = "enum_as_return"
spec = ["6.3:10"]
source = """
enum Color { Red, Green, Blue }
fn get_color() -> Color {
    Color.Blue
}
fn main() -> i32 {
    match get_color() {
        Color.Red => 1,
        Color.Green => 2,
        Color.Blue => 42,
    }
}
"""
exit_code = 42

# =============================================================================
# Enum in Struct Fields
# =============================================================================

[[case]]
name = "enum_in_struct"
spec = ["6.3:10"]
source = """
enum Color { Red, Green, Blue }
struct Pixel { color: Color, x: i32 }
fn main() -> i32 {
    let p = Pixel { color: Color.Red, x: 42 };
    p.x
}
"""
exit_code = 42

# =============================================================================
# Variant Payloads (RUE-221, ADR-0038)
# =============================================================================

# A variant may carry a payload, and an enum may freely mix payload-carrying
# and discriminant-only variants (6.3:14).
[[case]]
name = "enum_payload_mixed_variants_ok"
spec = ["6.3:14"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 { 0 }
"""
exit_code = 0

# Declaring and constructing tuple variants (grammar 6.3:2, payloads 6.3:13).
[[case]]
name = "enum_payload_declare_construct"
spec = ["6.3:2", "6.3:13"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    let a = Shape.Circle(5);
    let b = Shape.Rect(3, 4);
    let c = Shape.Empty;
    0
}
"""
exit_code = 0

# Construction + tagged-union layout + match extraction: Circle(5) -> 5.
[[case]]
name = "enum_payload_match_circle"
spec = ["6.3:15", "6.3:16"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn area(s: Shape) -> i32 {
    match s {
        Shape.Circle(r) => r,
        Shape.Rect(w, h) => w + h,
        Shape.Empty => 0,
    }
}
fn main() -> i32 { area(Shape.Circle(5)) }
"""
exit_code = 5

# Multi-field payload: Rect(3, 4) -> 7 (largest-variant layout).
[[case]]
name = "enum_payload_match_rect"
spec = ["6.3:15", "6.3:16"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn area(s: Shape) -> i32 {
    match s {
        Shape.Circle(r) => r,
        Shape.Rect(w, h) => w + h,
        Shape.Empty => 0,
    }
}
fn main() -> i32 { area(Shape.Rect(3, 4)) }
"""
exit_code = 7

# Discriminant-only variant of a sum type: Empty -> 0.
[[case]]
name = "enum_payload_match_empty"
spec = ["6.3:16"]
source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn area(s: Shape) -> i32 {
    match s {
        Shape.Circle(r) => r,
        Shape.Rect(w, h) => w + h,
        Shape.Empty => 0,
    }
}
fn main() -> i32 { area(Shape.Empty) }
"""
exit_code = 0

# Wrong payload arity is rejected.
[[case]]
name = "enum_payload_wrong_arity"
error_contains = "[E0207]"
spec = ["6.3:16"]
source = """
enum Shape { Rect(i32, i32) }
fn main() -> i32 { let r = Shape.Rect(3); 0 }
"""
compile_fail = true

# A payload-carrying variant used as a bare path is an error.
[[case]]
name = "enum_payload_bare_path_error"
error_contains = "[E0207]"
spec = ["6.3:16"]
source = """
enum Shape { Circle(i32) }
fn main() -> i32 { let c = Shape.Circle; 0 }
"""
compile_fail = true

# A payload with a destructor, moved out by a match binding, is dropped
# exactly once when the binding leaves scope (6.3:17).
[[case]]
name = "enum_payload_drop_once_via_match"
spec = ["6.3:17"]
source = """
struct Res { id: i32 }
drop fn Res(self) { @dbg(self.id); }
enum Holder { Full(Res), Nothing }
fn main() -> i32 {
    let h = Holder.Full(Res { id: 7 });
    match h {
        Holder.Full(r) => r.id,
        Holder.Nothing => 0,
    }
}
"""
exit_code = 7

# Multiplicity infectiousness (6.3:19): a variant carrying a linear payload
# makes the whole enum linear — an unconsumed value is a must-consume error.
[[case]]
name = "enum_linear_infectious_must_consume"
spec = ["6.3:19"]
source = """
linear struct L { v: i32 }
enum E { Has(L), None }
fn main() -> i32 {
    let e = E.Has(L { v: 1 });
    0
}
"""
compile_fail = true
error_contains = "must be consumed"

# Consuming a linear enum via a match that binds and consumes the payload
# discharges the obligation (6.3:19).
[[case]]
name = "enum_linear_consumed_via_match"
spec = ["6.3:19"]
source = """
linear struct L { v: i32 }
enum E { Has(L), None }
fn sink(l: L) -> i32 { l.v }
fn main() -> i32 {
    let e = E.Has(L { v: 5 });
    match e {
        E.Has(l) => sink(l),
        E.None => 0,
    }
}
"""
exit_code = 5

# An all-Copy-payload enum bottoms out at Copy in the multiplicity join and
# stays usable more than once (6.3:19).
[[case]]
name = "enum_copy_payload_stays_copy"
spec = ["6.3:19"]
source = """
enum C { A(i32), B }
fn val(c: C) -> i32 { match c { C.A(x) => x, C.B => 0 } }
fn main() -> i32 {
    let c = C.A(3);
    val(c) + val(c)
}
"""
exit_code = 6

# Active-variant drop glue (6.3:20): an unmatched enum drops its active
# variant's payload exactly once at scope exit. @dbg(-1) prints before the
# scope-exit drop's @dbg(9).
[[case]]
name = "enum_active_variant_drop_glue"
spec = ["6.3:20"]
source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let e = E.Has(D { v: 9 });
    @dbg(-1);
    0
}
"""
expected_stdout = "-1\n9\n"
exit_code = 0

# A discriminant-only active variant has no payload to drop (6.3:20): only -1.
[[case]]
name = "enum_active_variant_none_no_drop"
spec = ["6.3:20"]
source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let e = E.None;
    @dbg(-1);
    0
}
"""
expected_stdout = "-1\n"
exit_code = 0
