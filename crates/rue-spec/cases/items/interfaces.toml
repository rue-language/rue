interface Sized: Named { fn size(borrow self) -> i64; }
struct Box is Sized {
    w: i64,
    fn size(borrow self) -> i64 { self.w }
}
fn total(comptime T: Sized, borrow x: T) -> i64 { x.size() }
fn main() -> i32 { @intCast(total(Box, borrow Box { w: 4 })) }
"""
compile_fail = true
error_contains = ["E0302", "name_len", "Named"]

