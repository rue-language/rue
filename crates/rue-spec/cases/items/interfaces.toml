[[case]]
name = "associated_type_requirement_in_a_skolem_body"
spec = ["6.7:20"]
description = "`next` returns `Option(Element)`; under the skolem it returns `Option(T.Element)`, an opaque type the body can bind, drop, and unwrap with `?`."
preview = "interfaces"
preview_should_pass = true
real_std = true
source = """
const std = @import("std");
interface Sequence {
    const Element: type;
    fn next(inout self) -> std.option.Option(Element);
    fn done(borrow self) -> bool;
}
struct Range is Sequence {
    cur: i64,
    end: i64,
    pub const Element = i64;
    fn next(inout self) -> std.option.Option(i64) {
        let O = std.option.Option(i64);
        if self.cur >= self.end { return O.None; }
        let v = self.cur;
        self.cur += 1;
        O.Some(v)
    }
    fn done(borrow self) -> bool { self.cur >= self.end }
}
fn count(comptime T: Sequence, inout s: T) -> i64 {
    let mut n: i64 = 0;
    while !s.done() {
        let _item = s.next();
        n += 1;
    }
    n
}
fn take_one(comptime T: Sequence, inout s: T) -> std.option.Option(i64) {
    let O = std.option.Option(i64);
    let _item = s.next()?;
    O.Some(1)
}
fn main() -> i32 {
    let mut r = Range { cur: 0, end: 5 };
    let O = std.option.Option(i64);
    let taken = match take_one(Range, inout r) { O.Some(v) => v, O.None => 0 };
    @intCast(count(Range, inout r) + taken)
}
"""
exit_code = 5

