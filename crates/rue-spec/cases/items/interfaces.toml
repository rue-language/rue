[[case]]
name = "associated_type_requirement"
spec = ["6.7:5", "6.7:10"]
description = "A `const Element: type;` requirement is satisfied by `pub const Element = i64;` and substituted into the requirement's signature."
preview = "interfaces"
preview_should_pass = true
source = """
interface Sequence {
    const Element: type;
    fn next(inout self) -> Element;
    fn done(borrow self) -> bool;
}
struct Range is Sequence {
    cur: i64,
    end: i64,
    pub const Element = i64;
    fn next(inout self) -> i64 {
        let v = self.cur;
        self.cur += 1;
        v
    }
    fn done(borrow self) -> bool { self.cur >= self.end }
}
fn drain(comptime T: Sequence, inout s: T) -> i64 {
    let mut count: i64 = 0;
    while !s.done() {
        let _v = s.next();
        count += 1;
    }
    count
}
fn main() -> i32 {
    let mut r = Range { cur: 0, end: 5 };
    @intCast(drain(Range, inout r))
}
"""
exit_code = 5

