[[case]]
name = "interface_declaration_and_header_conformance"
spec = ["6.7:1", "6.7:2", "6.7:4", "6.7:5", "6.7:9", "6.7:10"]
description = "An interface with a method requirement; a struct conforms via its header and is used through a bound."
preview = "interfaces"
preview_should_pass = true
source = """
interface Equatable {
    fn equals(borrow self, borrow other: Self) -> bool;
}
struct Id is Equatable {
    n: i64,
    fn equals(borrow self, borrow other: Id) -> bool { self.n == other.n }
}
fn same(comptime T: Equatable, borrow a: T, borrow b: T) -> bool { a.equals(borrow b) }
fn main() -> i32 {
    let a = Id { n: 7 };
    let b = Id { n: 7 };
    if same(Id, borrow a, borrow b) { 7 } else { 0 }
}
"""
exit_code = 7

[[case]]
name = "associated_type_requirement"
spec = ["6.7:5", "6.7:10"]
description = "A `const Element: type;` requirement is satisfied by `pub const Element = i64;` and substituted into the requirement's signature."
preview = "interfaces"
preview_should_pass = true
source = """
interface Sequence {
    const Element: type;
    fn next(inout self) -> Element;
    fn done(borrow self) -> bool;
}
struct Range is Sequence {
    cur: i64,
    end: i64,
    pub const Element = i64;
    fn next(inout self) -> i64 {
        let v = self.cur;
        self.cur += 1;
        v
    }
    fn done(borrow self) -> bool { self.cur >= self.end }
}
fn drain(comptime T: Sequence, inout s: T) -> i64 {
    let mut count: i64 = 0;
    while !s.done() {
        let _v = s.next();
        count += 1;
    }
    count
}
fn main() -> i32 {
    let mut r = Range { cur: 0, end: 5 };
    @intCast(drain(Range, inout r))
}
"""
exit_code = 5

[[case]]
name = "associated_type_value_is_substituted_into_requirements"
spec = ["6.7:5", "6.7:10"]
description = "The requirement `-> Element` is compared after substituting the type's `Element`; a member returning another type mismatches."
preview = "interfaces"
preview_should_pass = true
source = """
interface Sequence {
    const Element: type;
    fn next(inout self) -> Element;
}
struct Range is Sequence {
    cur: i64,
    pub const Element = i64;
    fn next(inout self) -> i32 { 0 }
}
fn drain(comptime T: Sequence, inout s: T) -> i64 { 0 }
fn main() -> i32 { let mut r = Range { cur: 0 }; @intCast(drain(Range, inout r)) }
"""
compile_fail = true
error_contains = ["E0303", "next", "fn next(inout self) -> i32", "fn next(inout self) -> i64"]

