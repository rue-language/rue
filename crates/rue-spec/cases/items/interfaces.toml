[[case]]
name = "refinement_requires_parent_conformance"
spec = ["6.7:7", "6.7:12"]
description = "Asserting a refining interface asserts and verifies its parents; a bound on the refining interface is satisfied by that assertion."
preview = "interfaces"
preview_should_pass = true
source = """
interface Named { fn name_len(borrow self) -> i64; }
interface Sized: Named { fn size(borrow self) -> i64; }
struct Box is Sized {
    w: i64,
    fn name_len(borrow self) -> i64 { 3 }
    fn size(borrow self) -> i64 { self.w }
}
fn total(comptime T: Sized, borrow x: T) -> i64 { x.name_len() + x.size() }
fn main() -> i32 { @intCast(total(Box, borrow Box { w: 4 })) }
"""
exit_code = 7

[[case]]
name = "refinement_parent_unsatisfied_is_reported"
spec = ["6.7:12", "6.7:10"]
preview = "interfaces"
preview_should_pass = true
source = """
