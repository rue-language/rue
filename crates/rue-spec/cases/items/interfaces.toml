# Interfaces (preview) — specification cases for chapter 6.7.
#
# Every construct in this chapter is behind `--preview interfaces` (6.7:3), so
# each passing case sets `preview = "interfaces"` and `preview_should_pass`.

[section]
id = "items.interfaces"
spec_chapter = "6.7"
name = "Interfaces"
description = "Interface declarations, conformance assertions, and interface bounds on comptime parameters."

# ---------------------------------------------------------------------------
# Preview gate (6.7:3)
# ---------------------------------------------------------------------------

[[case]]
name = "interface_requires_preview"
spec = ["6.7:3"]
source = """
interface Equatable {
    fn equals(borrow self, borrow other: Self) -> bool;
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E1100", "interfaces"]

[[case]]
name = "conformance_requires_preview"
spec = ["6.7:3"]
source = """
struct Id { n: i64, fn equals(borrow self, borrow other: Id) -> bool { self.n == other.n } }
Id is Equatable;
interface Equatable { fn equals(borrow self, borrow other: Self) -> bool; }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E1100", "interfaces"]

[[case]]
name = "bound_requires_preview"
spec = ["6.7:3", "6.7:14"]
source = """
interface Equatable { fn equals(borrow self, borrow other: Self) -> bool; }
fn same(comptime T: Equatable, borrow a: T, borrow b: T) -> bool { a.equals(borrow b) }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E1100", "interfaces"]

# ---------------------------------------------------------------------------
# Declarations (6.7:4 – 6.7:8)
