[section]
id = "items.general"
spec_chapter = "6.0"
name = "Items General"
description = "General rules for items, including type name uniqueness."

# =============================================================================
# Ordinary Standard-Library Type Spellings
# =============================================================================

[[case]]
name = "struct_named_strbuf_is_ordinary"
spec = ["6.0:3"]
description = "A user-defined StrBuf is an ordinary nominal"
source = """
struct StrBuf { data: i32 }
fn main() -> i32 { StrBuf { data: 7 }.data }
"""
exit_code = 7

[[case]]
name = "enum_named_strbuf_is_ordinary"
spec = ["6.0:3"]
description = "A user-defined enum may use the StrBuf spelling"
source = """
enum StrBuf { Empty, Full }
fn main() -> i32 { match StrBuf.Full { StrBuf.Empty => 0, StrBuf.Full => 8 } }
"""
exit_code = 8

# =============================================================================
# Type Name Uniqueness - Duplicate Definitions
# =============================================================================

[[case]]
name = "duplicate_struct_definitions"
spec = ["6.0:2"]
description = "Two structs with the same name are not allowed"
source = """
struct Point { x: i32 }
struct Point { y: i32 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0405", "duplicate type"]

[[case]]
name = "duplicate_enum_definitions"
spec = ["6.0:2"]
description = "Two enums with the same name are not allowed"
source = """
enum Color { Red, Green }
enum Color { Blue, Yellow }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0405", "duplicate type"]

[[case]]
name = "struct_and_enum_same_name"
spec = ["6.0:2"]
description = "A struct and enum cannot have the same name"
source = """
struct Point { x: i32 }
enum Point { Up, Down }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0405", "duplicate type"]

# =============================================================================
# Valid Type Names
# =============================================================================

[[case]]
name = "custom_type_names_allowed"
spec = ["6.0:2", "6.0:3"]
description = "User-defined types with non-reserved names are allowed"
source = """
struct MyString { len: i32 }
enum MyColor { Red, Blue }
fn main() -> i32 {
    let s = MyString { len: 42 };
    s.len
}
"""
exit_code = 42

# =============================================================================
# Reserved Function Names (RUE-84)
# =============================================================================

[[case]]
name = "fn_builtin_method_name_allowed"
spec = ["6.0:5"]
description = "A `Type__method` name is an ordinary identifier: runtime symbols moved under `__rue_` (RUE-125), so it is no longer reserved and is distinct from the built-in method"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn String__len() -> i32 { 7 }
fn main() -> i32 {
    let mut s = StrBuf.new();
    s.push_str("hello");
    let builtin: i32 = @intCast(s.len());
    builtin * 10 + String__len()
}
"""
exit_code = 57

[[case]]
name = "fn_reserved_rue_prefix"
spec = ["6.0:5"]
description = "User-defined function cannot use the __rue_ runtime-helper prefix"
source = """
fn __rue_alloc() -> i32 { 7 }
fn main() -> i32 { __rue_alloc() }
"""
compile_fail = true
error_contains = "cannot define function `__rue_alloc`: name is reserved for a runtime helper"

[[case]]
name = "fn_reserved_entry_point"
spec = ["6.0:5"]
description = "User-defined function cannot use the entry-point name _start"
source = """
fn _start() -> i32 { 1 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "cannot define function `_start`: name is reserved for a runtime helper"

[[case]]
name = "fn_reserved_memcpy"
spec = ["6.0:5"]
description = "User-defined function cannot use a compiler-builtin memory-routine name the runtime exports unmangled (RUE-354)"
source = """
fn memcpy(x: i32) -> i32 { x }
fn main() -> i32 { memcpy(3) }
"""
compile_fail = true
error_contains = "cannot define function `memcpy`: name is reserved for a runtime helper"

[[case]]
name = "fn_reserved_macos_entry_point"
spec = ["6.0:5"]
description = "User-defined function cannot use the macOS entry-point name _main (RUE-354)"
source = """
fn _main() -> i32 { 1 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "cannot define function `_main`: name is reserved for a runtime helper"

[[case]]
name = "fn_lookalike_name_allowed"
spec = ["6.0:5"]
description = "A name resembling but not matching a reserved name is allowed"
source = """
fn foo__bar() -> i32 { 9 }
fn main() -> i32 { foo__bar() }
"""
exit_code = 9
