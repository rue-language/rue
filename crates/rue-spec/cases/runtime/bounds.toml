[section]
id = "runtime.bounds"
spec_chapter = "8.2"
name = "Array Bounds Checking"
description = "Out-of-bounds array access causes a runtime panic with exit code 101."

# =============================================================================
# Out-of-Bounds Causes Panic
# =============================================================================

[[case]]
name = "out_of_bounds_panic"
spec = ["8.2:1", "B.2:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 5;
    arr[i]
}
"""
runtime_error = "index out of bounds"

# =============================================================================
# Exit Code 101 on Out-of-Bounds
# =============================================================================

[[case]]
name = "out_of_bounds_exit_101"
spec = ["8.2:2"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 10;
    arr[i]
}
"""
runtime_error = "index out of bounds"

# =============================================================================
# Compile-Time Bounds Checking
# =============================================================================

[[case]]
name = "constant_index_checked"
error_contains = "[E0902]"
spec = ["8.2:3"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[5]
}
"""
compile_fail = true

# =============================================================================
# Constant Expression Index Checking
# =============================================================================

[[case]]
name = "constant_expression_addition_checked"
error_contains = "[E0902]"
spec = ["8.2:3", "8.2:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[1 + 5]
}
"""
compile_fail = true

[[case]]
name = "constant_expression_multiplication_checked"
error_contains = "[E0902]"
spec = ["8.2:3", "8.2:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[2 * 3]
}
"""
compile_fail = true

[[case]]
name = "constant_expression_subtraction_valid"
spec = ["8.2:3", "8.2:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[5 - 3]
}
"""
exit_code = 30

[[case]]
name = "constant_expression_complex_checked"
error_contains = "[E0902]"
spec = ["8.2:3", "8.2:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[(1 + 2) * 3]
}
"""
compile_fail = true

# A negative constant index is a compile-time out-of-bounds error (the
# constant bounds check catches index < 0), not a type error (RUE-81).
[[case]]
name = "constant_negative_index_out_of_bounds"
spec = ["8.2:3"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[-1]
}
"""
compile_fail = true
error_contains = "out of bounds"

[[case]]
name = "constant_expression_division_valid"
spec = ["8.2:3", "8.2:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[6 / 3]
}
"""
exit_code = 30

[[case]]
name = "constant_expression_division_out_of_bounds"
error_contains = "[E0902]"
spec = ["8.2:3", "8.2:4"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[10 / 2]
}
"""
compile_fail = true

# =============================================================================
# Runtime Bounds Checking
# =============================================================================

[[case]]
name = "variable_index_checked_at_runtime"
spec = ["8.2:5"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 100;
    arr[i]
}
"""
runtime_error = "index out of bounds"

# A negative signed index computed at runtime must trap: the bounds check is
# an unsigned 64-bit comparison, so a negative value (all high bits set)
# exceeds the length and fails (RUE-81 / RUE-87).
[[case]]
name = "negative_signed_index_traps_at_runtime"
spec = ["8.2:5"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: i64 = -1;
    arr[i]
}
"""
runtime_error = "index out of bounds"

# An out-of-range signed index also traps at runtime.
[[case]]
name = "out_of_range_signed_index_traps_at_runtime"
spec = ["8.2:5"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: i32 = 7;
    arr[i]
}
"""
runtime_error = "index out of bounds"

# =============================================================================
# Bounds checks are an observable-behavior obligation (8.2:9)
# =============================================================================
# 8.2:5 requires an out-of-range access to trap *as if* tested at the point of
# navigation; it does not require a distinct test instruction per access. 8.2:9
# bounds what a check-eliding transformation may do. These cases pin the
# clauses that are observable from source: a trap must not appear on a path the
# program does not take, and must not disappear from one it does. The
# no-reorder-across-an-observable-effect clause is enforced by the
# differential-opt harness (RUE-236) rather than here, since the spec corpus
# does not assert on interleaved output.

[[case]]
name = "no_trap_on_untaken_branch"
spec = ["8.2:9", "7.1:10"]
description = "An out-of-range access on a branch that is not taken must not trap: a check may not be speculated onto an unexecuted path"
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 5;
    if i < 3 { arr[i] } else { 7 }
}
"""
exit_code = 7

[[case]]
name = "no_trap_on_zero_trip_loop"
spec = ["8.2:9"]
description = "An out-of-range access in a loop body that never executes must not trap: a hoisted check may not fire for a zero-trip loop"
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let n: u64 = 0;
    let mut i: u64 = 0;
    let mut acc: i32 = 9;
    while i < n {
        acc = arr[i + 5];
        i = i + 1;
    }
    acc
}
"""
exit_code = 9

[[case]]
name = "trap_preserved_on_taken_branch"
spec = ["8.2:9", "8.2:1"]
description = "An out-of-range access on a branch that is taken must still trap: a transformation may not remove a trap the program would take"
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i: u64 = 5;
    if i > 3 { arr[i] } else { 7 }
}
"""
runtime_error = "index out of bounds"
