[section]
id = "runtime.overflow"
spec_chapter = "8.1"
name = "Integer Overflow"
description = "Integer overflow causes a runtime panic with exit code 101."

# =============================================================================
# Overflow Terminates with Exit Code 101
# =============================================================================

[[case]]
name = "overflow_add_exit_101"
spec = ["8.1:2", "B.2:2"]
source = """
fn main() -> i32 {
    let x: i32 = 2147483647;
    x + 1
}
"""
runtime_error = "integer overflow"

[[case]]
name = "overflow_sub_exit_101"
spec = ["8.1:2", "B.2:2"]
source = """
fn main() -> i32 {
    let x: i32 = -2147483648;
    x - 1
}
"""
runtime_error = "integer overflow"

[[case]]
name = "overflow_mul_exit_101"
spec = ["8.1:2", "B.2:2"]
source = """
fn main() -> i32 {
    let x: i32 = 2147483647;
    x * 2
}
"""
runtime_error = "integer overflow"

# =============================================================================
# Operations That Can Overflow
# =============================================================================

[[case]]
name = "overflow_addition"
spec = ["8.1:3"]
source = """
fn main() -> i32 {
    let x: i32 = 2147483647;
    x + 1
}
"""
runtime_error = "integer overflow"

[[case]]
name = "overflow_subtraction"
spec = ["8.1:3"]
source = """
fn main() -> i32 {
    let x: i32 = -2147483648;
    x - 1
}
"""
runtime_error = "integer overflow"

[[case]]
name = "overflow_multiplication"
spec = ["8.1:3"]
source = """
fn main() -> i32 {
    let x: i32 = 1000000;
    x * 10000
}
"""
runtime_error = "integer overflow"

[[case]]
name = "overflow_negation"
spec = ["8.1:3"]
source = """
fn main() -> i32 {
    let x: i32 = -2147483648;
    -x
}
"""
runtime_error = "integer overflow"

# Division and remainder overflow exactly for MIN / -1 (RUE-30): the quotient
# -MIN is unrepresentable. Hardware gives no clean trap (x86 IDIV raises
# SIGFPE, ARM SDIV silently wraps), so the compiler must emit an explicit
# guard.

[[case]]
name = "overflow_division_min_by_neg1"
spec = ["8.1:2", "8.1:3"]
source = """
fn main() -> i32 {
    let x: i32 = -2147483648;
    let y: i32 = -1;
    x / y
}
"""
runtime_error = "integer overflow"

[[case]]
name = "overflow_remainder_min_by_neg1"
spec = ["8.1:2", "8.1:3"]
source = """
fn main() -> i32 {
    let x: i32 = -2147483648;
    let y: i32 = -1;
    x % y
}
"""
runtime_error = "integer overflow"

# Near-miss controls: MIN / 1 and (MIN + 1) / -1 are representable and must
# NOT trap.
[[case]]
name = "division_min_by_one_no_overflow"
spec = ["8.1:3"]
source = """
fn main() -> i32 {
    let x: i32 = -2147483648;
    let y: i32 = 1;
    if x / y == -2147483648 { 42 } else { 7 }
}
"""
exit_code = 42

[[case]]
name = "division_min_plus_one_by_neg1_no_overflow"
spec = ["8.1:3"]
source = """
fn main() -> i32 {
    let x: i32 = -2147483647;
    let y: i32 = -1;
    if x / y == 2147483647 { 42 } else { 7 }
}
"""
exit_code = 42

# A constant multiplier that is a power of two may be lowered as a left shift,
# checked by shifting back. A signed type's minimum has the bit pattern of
# 2^(bits-1) but is negative, so a multiply by it must stay an ordinary
# checked multiply at every optimization level: `MIN * -1` traps and
# `1 * MIN` does not (RUE-2318).
[[case]]
name = "overflow_i64_min_times_neg1_{form}_o{opt_level}"
spec = ["3.1:6", "8.1:3"]
source = """
fn neg_one() -> i64 { 0 - 1 }
fn f0() -> i64 {
    {expr}
}
fn main() -> i32 {
    let result: i64 = f0();
    @dbg(result);
    0
}
"""
runtime_error = "integer overflow"
params = [
  { form = "literals", expr = "((-9223372036854775808) * (-1))", opt_level = 0 },
  { form = "literals", expr = "((-9223372036854775808) * (-1))", opt_level = 2 },
  { form = "literals", expr = "((-9223372036854775808) * (-1))", opt_level = 3 },
  { form = "swapped", expr = "((-1) * (-9223372036854775808))", opt_level = 0 },
  { form = "swapped", expr = "((-1) * (-9223372036854775808))", opt_level = 2 },
  { form = "swapped", expr = "((-1) * (-9223372036854775808))", opt_level = 3 },
  { form = "zero_minus_one", expr = "((-9223372036854775808) * (0 - 1))", opt_level = 0 },
  { form = "zero_minus_one", expr = "((-9223372036854775808) * (0 - 1))", opt_level = 2 },
  { form = "zero_minus_one", expr = "((-9223372036854775808) * (0 - 1))", opt_level = 3 },
  { form = "nested", expr = "(1 + ((-9223372036854775808) * (-1)))", opt_level = 0 },
  { form = "nested", expr = "(1 + ((-9223372036854775808) * (-1)))", opt_level = 2 },
  { form = "nested", expr = "(1 + ((-9223372036854775808) * (-1)))", opt_level = 3 },
  { form = "runtime_neg1", expr = "neg_one() * (-9223372036854775808)", opt_level = 0 },
  { form = "runtime_neg1", expr = "neg_one() * (-9223372036854775808)", opt_level = 2 },
  { form = "runtime_neg1", expr = "neg_one() * (-9223372036854775808)", opt_level = 3 },
]

# Near-miss control: 1 * MIN is MIN, representable, and must not trap.
[[case]]
name = "i64_one_times_min_no_overflow_o{opt_level}"
spec = ["3.1:6", "8.1:3"]
source = """
fn one() -> i64 { 1 }
fn main() -> i32 {
    let product: i64 = one() * (-9223372036854775808);
    if product == -9223372036854775807 - 1 { 42 } else { 7 }
}
"""
exit_code = 42
params = [
  { opt_level = 0 },
  { opt_level = 2 },
  { opt_level = 3 },
]
