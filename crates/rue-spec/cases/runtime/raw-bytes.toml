[[case]]
name = "ptr_unaligned_requires_checked"
spec = ["9.2:14l"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn read(p: ptr mut i32) -> i32 {
    @ptr_read_unaligned(p)
}
fn main() -> i32 {
    checked {
        let p: ptr mut i32 = @alloc(1);
        @ptr_write(p, 0);
        let v: i32 = read(p);
        @free(p, 1);
    };
    0
}
"""
compile_fail = true
error_contains = "[E1300]"
