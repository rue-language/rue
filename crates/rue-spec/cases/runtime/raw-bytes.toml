[[case]]
name = "byte_copy_copies_subrange"
spec = ["9.2:14g"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn main() -> i32 {
    checked {
        let src: ptr mut u8 = @alloc_bytes(4, 1);
        @byte_write(src, 0, 1);
        @byte_write(src, 1, 2);
        @byte_write(src, 2, 3);
        @byte_write(src, 3, 4);
        let dst: ptr mut u8 = @alloc_bytes(2, 1);
        @byte_set(dst, 0, 2);
        let src_mid: ptr mut u8 = @int_to_ptr(@ptr_to_int(src) + 1);
        @byte_copy(dst, src_mid, 2);
        let result: i32 = @intCast(@byte_read(dst, 0)) + @intCast(@byte_read(dst, 1));
        @free_bytes(src, 4, 1);
        @free_bytes(dst, 2, 1);
        result
    }
}
"""
exit_code = 5

