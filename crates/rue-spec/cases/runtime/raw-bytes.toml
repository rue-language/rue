# Preview raw physical-byte allocation and access intrinsics (RUE-879).

[section]
id = "runtime.raw_bytes"
spec_chapter = "9.2"
name = "Raw Byte Intrinsics"
description = "Packed physical-byte allocation, access, and preview gating"

[[case]]
name = "packed_offsets_read_write_exactly_one_byte"
spec = ["9.2:14a", "9.2:14b", "9.2:14d"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn main() -> i32 {
    checked {
        let p: ptr mut u8 = @alloc_bytes(3);
        @byte_write(p, 0, 11);
        @byte_write(p, 1, 22);
        @byte_write(p, 2, 33);
        let result: i32 = @intCast(@byte_read(p, 0))
            + @intCast(@byte_read(p, 1))
            + @intCast(@byte_read(p, 2));
        @free_bytes(p, 3);
        result
    }
}
"""
exit_code = 66

[[case]]
name = "byte_write_preserves_adjacent_bytes"
spec = ["9.2:14d"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn main() -> i32 {
    checked {
        let p = @alloc_bytes(3);
        @byte_write(p, 0, 17);
        @byte_write(p, 1, 34);
        @byte_write(p, 2, 51);
        @byte_write(p, 1, 68);
        let result: i32 = @intCast(@byte_read(p, 0))
            + @intCast(@byte_read(p, 1))
            + @intCast(@byte_read(p, 2));
        @free_bytes(p, 3);
        result
    }
}
"""
exit_code = 136

[[case]]
name = "byte_read_accepts_const_u8_pointer"
spec = ["9.2:14d", "9.2:14e"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn main() -> i32 {
    let value: u8 = 79;
    checked {
        let p: ptr const u8 = @raw(value);
        @intCast(@byte_read(p, 0))
    }
}
"""
exit_code = 79

[[case]]
name = "alloc_bytes_result_type_is_inferred"
spec = ["9.2:14b", "9.2:14f"]
preview = "raw_bytes"
