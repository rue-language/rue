[[case]]
name = "byte_copy_round_trip"
spec = ["9.2:14g", "9.2:14h"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn main() -> i32 {
    checked {
        let src: ptr mut u8 = @alloc_bytes(3, 1);
        @byte_write(src, 0, 10);
        @byte_write(src, 1, 20);
        @byte_write(src, 2, 30);
        let dst: ptr mut u8 = @alloc_bytes(3, 1);
        @byte_copy(dst, src, 3);
        let result: i32 = @intCast(@byte_read(dst, 0))
            + @intCast(@byte_read(dst, 1))
            + @intCast(@byte_read(dst, 2));
        @free_bytes(src, 3, 1);
        @free_bytes(dst, 3, 1);
        result
    }
}
"""
exit_code = 60

