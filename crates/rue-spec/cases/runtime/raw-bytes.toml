[[case]]
name = "realloc_bytes_preserves_packed_prefix"
spec = ["9.2:14b", "9.2:14c", "9.2:14f"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn main() -> i32 {
    checked {
        let p: ptr mut u8 = @alloc_bytes(2);
        @byte_write(p, 0, 40);
        @byte_write(p, 1, 2);
        let q = @realloc_bytes(p, 2, 4);
        @byte_write(q, 2, 3);
        let result: i32 = @intCast(@byte_read(q, 0))
            + @intCast(@byte_read(q, 1))
            + @intCast(@byte_read(q, 2));
        @free_bytes(q, 4);
        result
    }
}
"""
exit_code = 45

[[case]]
name = "raw_byte_allocation_failure_returns_null"
spec = ["9.2:14b", "8.6:4"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn main() -> i32 {
    checked {
        let p: ptr mut u8 = @alloc_bytes(18446744073709551615);
        if @ptr_to_int(p) == 0 { 0 } else { @free_bytes(p, 18446744073709551615); 1 }
    }
}
"""
exit_code = 0

[[case]]
name = "failed_realloc_bytes_preserves_original"
spec = ["9.2:14c", "8.6:4"]
preview = "raw_bytes"
preview_should_pass = true
source = """
fn main() -> i32 {
    checked {
        let p = @alloc_bytes(3);
        @byte_write(p, 0, 11);
        @byte_write(p, 1, 22);
        @byte_write(p, 2, 33);
        let q = @realloc_bytes(p, 3, 18446744073709551615);
        if @ptr_to_int(q) == 0 {
            let result: i32 = @intCast(@byte_read(p, 0))
                + @intCast(@byte_read(p, 1))
                + @intCast(@byte_read(p, 2));
            @free_bytes(p, 3);
            result
        } else {
            @free_bytes(q, 18446744073709551615);
            1
        }
    }
}
"""
exit_code = 66

