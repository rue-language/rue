# Pointer Intrinsic Tests
#
# Tests for pointer intrinsics that operate on raw pointers for low-level memory
# access. These intrinsics must be used within `checked` blocks (9.1:12). The
# pointee-typed access surface is specified by 9.2:6a-9.2:6d: `@ptr_read` and
# `@ptr_write` move exactly `@size_of(T)` physical bytes, and `@ptr_to_int` /
# `@int_to_ptr` are the segregated address conversions (ADR-0059).

[section]
id = "runtime.pointers"
spec_chapter = "9.2"
name = "Pointer Intrinsics"
description = "Tests for pointer intrinsics (@raw, @ptr_read, @ptr_write, etc.)"

# =============================================================================
# @raw with simple local variable
# =============================================================================

[[case]]
name = "raw_simple_local"
spec = ["9.2:6a", "9.2:6b"]
source = """
fn main() -> i32 {
    let x: i32 = 42;
    let p: ptr const i32 = checked { @raw(x) };
    let val: i32 = checked { @ptr_read(p) };
    val
}
"""
exit_code = 42

# =============================================================================
# @raw with array element (the bug fix this was added for)
#
# These use a slot-identical element type (`i64`: one eight-byte slot per
# element, so the compact image and the slot-shaped frame agree). Under the
# default compact layout a raw pointer into a frame-resident NON-slot-identical
# array (e.g. `[i32; 3]`, which packs to 4-byte strides while the frame stores
# 8-byte slots) is refused loudly rather than silently mixing representations
# (RUE-987 / RUE-1035, ADR-0052); that refusal is pinned in the CLI corpora. The `@raw`
# and `@ptr_offset` semantics themselves are width-independent, so a
# slot-identical array demonstrates them faithfully on the frame.
# =============================================================================

[[case]]
name = "raw_array_element"
spec = ["9.2:6a", "9.2:6b"]
source = """
fn main() -> i32 {
    let arr: [i64; 3] = [10, 20, 30];
    let first: i64 = checked {
        let p: ptr const i64 = @raw(arr[0]);
        @ptr_read(p)
    };
    @intCast(first)
}
"""
exit_code = 10

[[case]]
name = "raw_array_second_element"
spec = ["9.2:6a"]
source = """
fn main() -> i32 {
    let arr: [i64; 3] = [10, 20, 30];
    let second: i64 = checked {
        let p: ptr const i64 = @raw(arr[1]);
        @ptr_read(p)
    };
    @intCast(second)
}
"""
exit_code = 20

[[case]]
name = "raw_array_last_element"
spec = ["9.2:6a"]
source = """
fn main() -> i32 {
    let arr: [i64; 3] = [10, 20, 30];
    let third: i64 = checked {
        let p: ptr const i64 = @raw(arr[2]);
        @ptr_read(p)
    };
    @intCast(third)
}
"""
exit_code = 30

# =============================================================================
# @ptr_to_int converts pointer to u64
# =============================================================================

[[case]]
name = "ptr_to_int_basic"
spec = ["9.2:6c"]
source = """
fn main() -> i32 {
    let x: i32 = 42;
    let p: ptr const i32 = checked { @raw(x) };
    let addr: u64 = checked { @ptr_to_int(p) };
    // Stack addresses are high values, should be > 1000
    let threshold: u64 = 1000;
    if addr > threshold { 42 } else { 1 }
}
"""
exit_code = 42

# =============================================================================
# @ptr_write and @ptr_read work together
# =============================================================================

[[case]]
name = "ptr_write_and_read"
spec = ["9.2:6b", "9.2:6d"]
source = """
fn main() -> i32 {
    let mut x: i32 = 10;
    checked {
        let p: ptr mut i32 = @raw_mut(x);
        @ptr_write(p, 99);
    };
    x
}
"""
exit_code = 99

[[case]]
name = "ptr_write_array_element"
spec = ["9.2:6b"]
source = """
fn main() -> i32 {
    let mut arr: [i64; 3] = [10, 20, 30];
    checked {
        let p: ptr mut i64 = @raw_mut(arr[1]);
        @ptr_write(p, 77);
    };
    @intCast(arr[1])
}
"""
exit_code = 77

# =============================================================================
# @int_to_ptr converts u64 address to pointer with explicit type annotation
# =============================================================================

[[case]]
name = "int_to_ptr_with_type_annotation"
spec = ["9.2:6c", "9.2:6d"]
source = """
fn main() -> i32 {
    let x: i32 = 42;
    let p1: ptr const i32 = checked { @raw(x) };
    let addr: u64 = checked { @ptr_to_int(p1) };
    // Convert address back to pointer with explicit type annotation
    let p2: ptr mut i32 = checked { @int_to_ptr(addr) };
    let val: i32 = checked { @ptr_read(p2) };
    val
}
"""
exit_code = 42

[[case]]
name = "int_to_ptr_mutable_pointer"
spec = ["9.2:6c"]
source = """
fn main() -> i32 {
    let x: i32 = 99;
    let p1: ptr const i32 = checked { @raw(x) };
    let addr: u64 = checked { @ptr_to_int(p1) };
    // Convert to ptr mut (even from a const pointer address)
    // This is allowed because int_to_ptr assumes you know what you're doing
    let p2: ptr mut i32 = checked { @int_to_ptr(addr) };
    let val: i32 = checked { @ptr_read(p2) };
    val
}
"""
exit_code = 99

[[case]]
name = "int_to_ptr_u64_pointer"
spec = ["9.2:6c", "9.2:6d"]
source = """
fn main() -> i32 {
    let x: u64 = 12345;
    let p1: ptr const u64 = checked { @raw(x) };
    let addr: u64 = checked { @ptr_to_int(p1) };
    // Convert to ptr mut u64
    let p2: ptr mut u64 = checked { @int_to_ptr(addr) };
    let val: u64 = checked { @ptr_read(p2) };
    // Return i32 conversion for exit code
    @intCast(val)
}
"""
exit_code = 57  # 12345 % 256 = 57

# The null-pointer idiom (9.2:6c): `@int_to_ptr` takes exactly a `u64`, so null
# is written over a `u64` binding rather than a bare `0` literal, and
# `@ptr_to_int(p) == 0` is the null test. Round-tripping an address through the
# pair addresses the same storage.
[[case]]
name = "int_to_ptr_zero_is_the_null_pointer"
spec = ["9.2:6c", "9.2:6e"]
source = """
fn main() -> i32 {
    let mut x: i32 = 10;
    let zero: u64 = 0;
    checked {
        let p: ptr mut i32 = @raw_mut(x);
        @ptr_write(p, 99);
        let back: ptr mut i32 = @int_to_ptr(@ptr_to_int(p));
        let null: ptr mut u8 = @int_to_ptr(zero);
        if @ptr_to_int(null) == 0 { @ptr_read(back) } else { 0 }
    }
}
"""
exit_code = 99

# @ptr_read/@ptr_write move exactly @size_of(T) physical bytes, never a
# fixed-width slot (9.2:6b). At T = u8 that is one byte: writing through a
# `ptr mut u8` leaves both neighbours untouched.
[[case]]
name = "ptr_write_u8_touches_exactly_one_byte"
spec = ["9.2:6b"]
source = """
fn main() -> i32 {
    checked {
        let p: ptr mut u8 = @alloc(4, 1);
        @byte_set(p, 0, 4);
        let zero: u8 = 0;
        let want: u8 = 200;
        @ptr_write(@ptr_offset(p, 1), want);
        let ok: bool = @ptr_read(@ptr_offset(p, 0)) == zero
            && @ptr_read(@ptr_offset(p, 1)) == want
            && @ptr_read(@ptr_offset(p, 2)) == zero
            && @ptr_read(@ptr_offset(p, 3)) == zero;
        @free(p, 4, 1);
        if ok { 41 } else { 0 }
    }
}
"""
exit_code = 41

# At T = i32 the same rule gives a four-byte access: a write to element 0 of a
# two-element block leaves element 1's bytes untouched (9.2:6b). Checked by
# byte inspection rather than by a byte pattern, so the case is endianness-neutral.
[[case]]
name = "ptr_write_i32_touches_exactly_size_of_bytes"
spec = ["9.2:6b"]
source = """
fn main() -> i32 {
    checked {
        let unit: u64 = @intCast(@size_of(i32));
        let align: u64 = @intCast(@align_of(i32));
        let raw: ptr mut u8 = @alloc(2 * unit, align);
        @byte_set(raw, 0, 2 * unit);
        let p: ptr mut i32 = @int_to_ptr(@ptr_to_int(raw));
        @ptr_write(p, 123456789);
        let zero: u8 = 0;
        let untouched: bool = @ptr_read(@ptr_offset(raw, 4)) == zero
            && @ptr_read(@ptr_offset(raw, 5)) == zero
            && @ptr_read(@ptr_offset(raw, 6)) == zero
            && @ptr_read(@ptr_offset(raw, 7)) == zero;
        let same: bool = @ptr_read(p) == 123456789;
        @free(raw, 2 * unit, align);
        if untouched && same { 42 } else { 0 }
    }
}
"""
exit_code = 42

# @ptr_offset is standard pointer arithmetic: p + n*size_of(pointee), a plain
# add, forward for positive n (ADR-0040 / RUE-243). arr[0]+1 lands on element
# 1, and arr[0]+2 on element 2 — indexing and pointer arithmetic agree because
# array elements are laid out ascending (spec 3.5:4).
[[case]]
name = "ptr_offset_add_forward"
spec = ["9.2:7"]
source = """
fn main() -> i32 {
    let arr: [i64; 3] = [10, 20, 30];
    let sum: i64 = checked {
        let base: ptr const i64 = @raw(arr[0]);
        let a: i64 = @ptr_read(@ptr_offset(base, 1));
        let b: i64 = @ptr_read(@ptr_offset(base, 2));
        a + b
    };
    @intCast(sum)
}
"""
exit_code = 50  # 20 + 30

# A negative @ptr_offset moves toward lower addresses: from element 2, offset
# -1 lands on element 1 (spec 9.2:7).
[[case]]
name = "ptr_offset_add_backward"
spec = ["9.2:7"]
source = """
fn main() -> i32 {
    let arr: [i64; 3] = [10, 20, 30];
    let v: i64 = checked {
        let base: ptr const i64 = @raw(arr[2]);
        @ptr_read(@ptr_offset(base, -1))
    };
    @intCast(v)
}
"""
exit_code = 20

# =============================================================================
# @field_ptr — compiler-mediated field pointer (RUE-301)
# =============================================================================

# @field_ptr(s.field) yields a mutable raw pointer to the field; reading it
# observes the same value as the direct field access (spec 9.2:15, 9.2:18).
[[case]]
name = "field_ptr_read_matches_direct"
spec = ["9.2:15", "9.2:16", "9.2:18"]
source = """
struct Mixed { a: i32, b: i64, c: bool }
fn main() -> i32 {
    let m = Mixed { a: 11, b: 22, c: true };
    let got: i64 = checked {
        let p: ptr mut i64 = @field_ptr(m.b);
        @ptr_read(p)
    };
    @intCast(got)
}
"""
exit_code = 22

# @field_ptr addresses the first field (offset 0) correctly too.
[[case]]
name = "field_ptr_first_field"
spec = ["9.2:15", "9.2:18"]
source = """
struct Pair { a: i32, b: i32 }
fn main() -> i32 {
    let p = Pair { a: 7, b: 9 };
    checked {
        let fp: ptr mut i32 = @field_ptr(p.a);
        @ptr_read(fp)
    }
}
"""
exit_code = 7

# The pointer from @field_ptr is mutable: @ptr_write through it updates the
# field in place (spec 9.2:18).
[[case]]
name = "field_ptr_write_updates_field"
spec = ["9.2:18"]
source = """
struct Pair { a: i32, b: i32 }
fn main() -> i32 {
    let mut p = Pair { a: 7, b: 9 };
    checked {
        let fp: ptr mut i32 = @field_ptr(p.b);
        @ptr_write(fp, 100);
    };
    p.b
}
"""
exit_code = 100

# @field_ptr requires a field-access expression; a bare variable is rejected
# (spec 9.2:17).
[[case]]
name = "field_ptr_requires_field_access"
spec = ["9.2:17"]
source = """
struct Pair { a: i32, b: i32 }
fn main() -> i32 {
    let p = Pair { a: 7, b: 9 };
    let v: u64 = checked {
        let fp = @field_ptr(p);
        @ptr_to_int(fp)
    };
    @intCast(v)
}
"""
compile_fail = true
error_contains = "field access"

# @field_ptr may only appear inside a checked block (spec 9.2:15, cross-ref
# 9.1).
[[case]]
name = "field_ptr_requires_checked_block"
spec = ["9.2:15"]
source = """
struct Pair { a: i32, b: i32 }
fn main() -> i32 {
    let p = Pair { a: 7, b: 9 };
    let fp: ptr mut i32 = @field_ptr(p.a);
    0
}
"""
compile_fail = true
error_contains = "checked"
