        @ptr_write(@ptr_offset(p, 2), 10);
        let result: i64 = @syscall(64, 1, @ptr_to_int(p), 3);
        @free(p, 3, 1);
        if result == 3 { 42 } else { 1 }
    }
}
"""
expected_stdout = "HI\n"
exit_code = 42

[[case]]
name = "syscall_write_stdout_aarch64_macos"
spec = ["9.2:3", "9.2:4"]
only_on = ["aarch64-macos"]
source = """
fn main() -> i32 {
    checked {
        let p: ptr mut u8 = @alloc(3, 1);
