# Test that @syscall works (x86-64 Linux)
# Note: only_on restricts this test to run only on matching host platforms
[[case]]
name = "syscall_basic_x86_64"
spec = ["9.2:1", "9.2:2", "9.2:4"]
only_on = ["x86-64-linux"]
source = """
fn main() -> i32 {
    // exit_group syscall (231 on Linux x86-64)
    // This will immediately terminate the program with exit code 42
    let syscall_num: u64 = 231;
    let exit_code: u64 = 42;
    checked {
        @syscall(syscall_num, exit_code);
    };
    // Unreachable - the syscall terminates the process
    0
}
"""
exit_code = 42

# Test that @syscall works with the preview feature enabled (aarch64 Linux)
[[case]]
name = "syscall_basic_aarch64"
spec = ["9.2:1", "9.2:4"]
only_on = ["aarch64-linux"]
source = """
fn main() -> i32 {
    // exit_group syscall (94 on Linux aarch64)
    // This will immediately terminate the program with exit code 42
    let syscall_num: u64 = 94;
    let exit_code: u64 = 42;
    checked {
        @syscall(syscall_num, exit_code);
    };
    // Unreachable - the syscall terminates the process
    0
}
"""
exit_code = 42

# Darwin reports a positive errno in x0 with carry set. @syscall normalizes
# that ABI-specific representation to the negative error convention used on
# every supported target.
[[case]]
name = "syscall_error_is_negative_aarch64_macos"
spec = ["9.2:4"]
only_on = ["aarch64-macos"]
source = """
fn main() -> i32 {
    // close(-1) is guaranteed to fail with EBADF. Darwin syscall arguments
    // are u64, so u64::MAX supplies the all-ones file descriptor value.
    let close_num: u64 = 6;
    let invalid_fd: u64 = 18446744073709551615;
    let result: i64 = checked {
        @syscall(close_num, invalid_fd)
    };
    let zero: i64 = 0;
    if result < zero {
        42
    } else {
        1
    }
}
"""
exit_code = 42

# Test that @syscall requires at least one argument (the syscall number)
[[case]]
name = "syscall_requires_syscall_number"
spec = ["9.2:3"]
source = """
fn main() -> i32 {
    checked {
        @syscall();
    };
    0
}
"""
compile_fail = true
error_contains = "expects 7 arguments"

# @syscall outside a `checked` block is a compile error (RUE-1369): the
# intrinsic was excluded from the shared checked-block gate and compiled
# anywhere, even though 9.2 has always described it as unchecked.
[[case]]
name = "syscall_outside_checked_rejected"
spec = ["9.2:3a"]
source = """
fn main() -> i32 {
    let syscall_num: u64 = 39;
    @syscall(syscall_num);
    0
}
"""
compile_fail = true
error_contains = "requires a `checked` block"

# The same call inside a `checked` block is legal. Compile-only: the point is
# the gate, and every executable syscall number is platform-specific.
[[case]]
name = "syscall_in_checked_accepted"
spec = ["9.2:3a"]
compile_only = true
source = """
fn main() -> i32 {
    let syscall_num: u64 = 39;
    checked {
        @syscall(syscall_num);
    };
    0
}
"""

# Test that @syscall accepts up to 7 arguments
[[case]]
name = "syscall_max_args"
spec = ["9.2:3"]
only_on = ["x86-64-linux"]
source = """
fn main() -> i32 {
    // Test that we can pass 7 arguments (syscall number + 6 args)
    // We use exit_group syscall which terminates the process with exit code 0
    let syscall_num: u64 = 231;
    let a0: u64 = 0;
    let a1: u64 = 0;
    let a2: u64 = 0;
    let a3: u64 = 0;
    let a4: u64 = 0;
    let a5: u64 = 0;
    checked {
        @syscall(syscall_num, a0, a1, a2, a3, a4, a5);
    };
    // Unreachable - the syscall terminates the process with exit code 0
    42
}
"""
exit_code = 0

# Test that @syscall rejects too many arguments
[[case]]
name = "syscall_too_many_args"
spec = ["9.2:3"]
source = """
fn main() -> i32 {
    let n: u64 = 60;
    let a0: u64 = 0;
    let a1: u64 = 0;
    let a2: u64 = 0;
    let a3: u64 = 0;
    let a4: u64 = 0;
    let a5: u64 = 0;
    let a6: u64 = 0;
    checked {
        @syscall(n, a0, a1, a2, a3, a4, a5, a6);
    };
    0
}
"""
compile_fail = true
error_contains = "expects 7 arguments"

# Test that @syscall requires u64 arguments
[[case]]
name = "syscall_requires_u64_args"
spec = ["9.2:3"]
source = """
fn main() -> i32 {
    let syscall_num: i32 = 60;  // i32 instead of u64
    let arg: i32 = 0;           // i32 instead of u64
    checked {
        @syscall(syscall_num, arg);
    };
    0
}
"""
compile_fail = true
error_contains = "expects u64"

# Test that @syscall returns i64 (using assignment inside block)
[[case]]
name = "syscall_returns_i64"
spec = ["9.2:4"]
only_on = ["x86-64-linux"]
source = """
fn main() -> i32 {
    // getpid syscall (39 on Linux x86-64) returns the process ID
    let syscall_num: u64 = 39;
    let mut result: i64 = 0;
    checked {
        result = @syscall(syscall_num);
    };
    // PID should be positive
    let zero: i64 = 0;
    if result > zero {
        42
    } else {
        1
    }
}
"""
exit_code = 42

# Test checked block as expression returning syscall result
[[case]]
name = "syscall_checked_block_expression"
spec = ["9.2:4"]
only_on = ["x86-64-linux"]
source = """
fn main() -> i32 {
    // getpid syscall (39 on Linux x86-64) returns the process ID
    let syscall_num: u64 = 39;
    // Test checked block as expression (type inference must work correctly)
    let result: i64 = checked {
        @syscall(syscall_num)
    };
    // PID should be positive
    let zero: i64 = 0;
    if result > zero {
        42
    } else {
        1
    }
}
"""
exit_code = 42

# aarch64 mirror of syscall_returns_i64. The two result-READING tests above
# were x86-only, which is exactly how the aarch64 scheduler bug that hoisted
# the x0 result capture above `svc #0` shipped undetected (RUE-129 item 4):
# every used @syscall result on aarch64 read garbage, and no test noticed.
[[case]]
name = "syscall_returns_i64_aarch64"
spec = ["9.2:4"]
only_on = ["aarch64-linux"]
source = """
fn main() -> i32 {
    // getpid syscall (172 on Linux aarch64) returns the process ID
    let syscall_num: u64 = 172;
    let mut result: i64 = 0;
    checked {
        result = @syscall(syscall_num);
    };
    // PID should be positive
    let zero: i64 = 0;
    if result > zero {
        42
    } else {
        1
    }
}
"""
exit_code = 42

