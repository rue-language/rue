# 6.1:5 binds a call folded into an array length (7.1:41) as it binds the same
# call in a body: the callee's body must evaluate to a value of its declared
# return type. The length was taken from the call's value without checking it,
# so `1 << s` with `s: u8`, computed at u8 where the amount 8 masks to 0, gave
# the length 1 where run time reports E0206 (RUE-2381).

[[case]]
name = "array_length_call_u8_shift_in_u64_function_rejected_in_struct_field"
spec = ["7.1:41", "6.1:5"]
description = "`1 << s` with `s: u8` is a u8, so returning it from a u64 function is E0206 in a struct field's array length, not the length 1 - RUE-2381"
source = """
fn n(comptime s: u8) -> u64 { 1 << s }
struct S { a: [u8; n(8)] }
fn main() -> i32 {
    let s = S { a: [0; 1] };
    @intCast(s.a[0])
}
"""
compile_fail = true
error_contains = ["E0206", "expected u64, found u8"]

