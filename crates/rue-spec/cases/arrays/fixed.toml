# =============================================================================
# Compile-Time Array Lengths (RUE-16)
# =============================================================================

[[case]]
name = "array_length_from_const"
spec = ["7.1:14", "7.1:32"]
source = """
const K: i32 = 4;
fn main() -> i32 {
    let a: [i32; K] = [10, 20, 30, 40];
    a[0] + a[3]
}
"""
exit_code = 50

[[case]]
name = "array_length_from_comptime_param"
spec = ["7.1:32", "7.1:34"]
