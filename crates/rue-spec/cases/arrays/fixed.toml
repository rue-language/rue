# =============================================================================

[[case]]
name = "array_param_access_first"
spec = ["7.1:22", "7.1:23"]
source = """
fn get_first(arr: [i32; 4]) -> i32 {
    arr[0]
}

fn main() -> i32 {
    let data = [10, 20, 30, 40];
    get_first(data)
}
"""
exit_code = 10

[[case]]
name = "array_param_access_index"
spec = ["7.1:22", "7.1:23"]
source = """
fn get_element(arr: [i32; 4], idx: u64) -> i32 {
    arr[idx]
}

fn main() -> i32 {
    let data = [10, 20, 30, 40];
    get_element(data, 2)
}
"""
exit_code = 30

[[case]]
name = "array_param_with_scalar"
spec = ["7.1:22", "7.1:23"]
source = """
fn test(arr: [i32; 4], x: i32) -> i32 {
    x
}

fn main() -> i32 {
    let data = [10, 20, 30, 40];
    test(data, 99)
}
"""
exit_code = 99

[[case]]
name = "array_param_sum"
spec = ["7.1:22", "7.1:23"]
source = """
fn sum(arr: [i32; 3]) -> i32 {
    arr[0] + arr[1] + arr[2]
}

fn main() -> i32 {
    let data = [10, 20, 12];
    sum(data)
}
"""
exit_code = 42

[[case]]
name = "array_param_pass_through"
spec = ["7.1:22", "7.1:23"]
source = """
fn inner(arr: [i32; 3]) -> i32 {
    arr[1]
}

fn outer(arr: [i32; 3]) -> i32 {
    inner(arr)
}

fn main() -> i32 {
    let data = [10, 42, 30];
    outer(data)
}
"""
exit_code = 42

# By value does not mean "copied": what the by-value argument does to the
# caller's array follows the element type's value category (7.1:23, 3.8:2).
# A Copy element type makes `[T; N]` Copy, so the caller's array survives the
# call and can be passed again. RUE-1597.
[[case]]
name = "array_param_copy_element_type_is_copied"
spec = ["7.1:23"]
description = "An array of a Copy element type is copied to the callee; the caller's array stays valid and may be passed again"
source = """
fn sum(arr: [i32; 3]) -> i32 { arr[0] + arr[1] + arr[2] }

fn main() -> i32 {
    let data: [i32; 3] = [10, 5, 6];
    sum(data) + sum(data)
}
"""
exit_code = 42

# A move-type element type makes `[T; N]` a move type, so the by-value argument
# MOVES the whole array and a second use is E0205 (7.1:23, 3.8:7). RUE-1597.
[[case]]
name = "array_param_move_element_type_is_moved"
spec = ["7.1:23"]
description = "An array of a move-type element is moved by a by-value argument; using the caller's array afterwards is E0205"
source = """
struct Big { value: i32 }

fn total(xs: [Big; 2]) -> i32 { xs[0].value + xs[1].value }

fn main() -> i32 {
    let xs = [Big { value: 1 }, Big { value: 2 }];
    let a = total(xs);
    let b = total(xs);
    a + b
}
"""
compile_fail = true
error_contains = ["[E0205]", "use of moved value 'xs'"]

