# Index Must Be Integer
# =============================================================================

[[case]]
name = "array_index_integer"
spec = ["7.1:7"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i = 1;
    arr[i]
}
"""
exit_code = 20

[[case]]
name = "array_index_bool_error"
error_contains = "[E0206]"
spec = ["7.1:7"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[true]
}
"""
compile_fail = true

[[case]]
name = "generic_index_type_error_is_diagnostic"
spec = ["7.1:7"]
description = "A comptime type parameter cannot be used as an array index; generic analysis must report a type error before building AIR."
source = """
fn f(comptime T: type, x: T) -> i32 {
    let y: [T; 2] = [x, x];
    y[T] + y[1]
}
fn main() -> i32 { f(i32, 5) }
"""
compile_fail = true
error_contains = ["E0206", "integer type", "type"]

[[case]]
name = "unresolved_generic_array_literal_is_diagnostic"
spec = ["7.1:7"]
description = "An unresolved array literal in a malformed generic construction reports the annotation diagnostic instead of an internal compiler error."
source = """
const K: i32 = 3;
fn Matrix(comptime T: type, comptime N: i32) -> type { struct { row: [T; N] } }
fn sum(m: Matrix(i32, K)) -> i32 {
    m.row[0] + m.row[1] + m.row[2]
}
fn main() -> i32 {
    let M = Matrix(i32, K);
    sum(M { row: [40, 1, 1] }) { row: [T; N] }
}
"""
compile_fail = true
error_contains = ["E0903"]

# =============================================================================
# Compile-Time Bounds Checking
# =============================================================================

[[case]]
name = "constant_index_valid"
spec = ["7.1:9"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[2]
}
"""
exit_code = 30

[[case]]
name = "constant_index_out_of_bounds"
error_contains = "[E0902]"
spec = ["7.1:9"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[5]
}
"""
compile_fail = true

[[case]]
name = "constant_u64_index_above_i64_max_out_of_bounds"
error_contains = ["[E0902]", "18446744073709551615"]
spec = ["7.1:9"]
description = "A constant u64 index above i64::MAX is still a compile-time bounds error naming the exact index (RUE-532: i64 narrowing made it look non-constant and defer to a runtime trap)"
source = """
const MAX: u64 = 18446744073709551615;

fn main() -> i32 {
    let a: [i32; 1] = [42];
    a[MAX]
}
"""
compile_fail = true

[[case]]
name = "constant_u64_index_in_bounds_ok"
spec = ["7.1:9"]
description = "A constant u64 index within bounds still compiles and reads the element (control for RUE-532)"
source = """
const I: u64 = 2;

fn main() -> i32 {
    let a: [i32; 3] = [1, 2, 42];
    a[I]
}
"""
exit_code = 42

# A constant index is checked wherever it appears, including in the operand of
# an accessor's trailing `yield`. That operand is analysed as a place for
# call-site splicing rather than through the expression index path, so it used
# to reach code generation and trap at run time instead (RUE-2263).

[[case]]
name = "constant_index_out_of_bounds_in_a_shared_accessor_yield"
spec = ["7.1:9", "6.6:7"]
description = "RUE-2263: a constant out-of-range index in a `-> borrow` accessor's yield place is a compile-time error, not a runtime trap."
source = """
struct W {
    xs: [i64; 2],

    fn f(borrow self) -> borrow i64 {
        yield self.xs[2];
    }
}
fn main() -> i32 {
    let w = W { xs: [1, 2] };
    @intCast(w.f())
}
"""
compile_fail = true
error_contains = ["[E0902]", "the length is 2 but the index is 2"]

[[case]]
name = "constant_index_out_of_bounds_in_an_exclusive_accessor_yield"
spec = ["7.1:9", "6.6:7"]
description = "RUE-2263: the `inout` pairing is checked identically."
source = """
struct W {
    xs: [i64; 2],

    fn f(inout self) -> inout i64 {
        yield self.xs[7];
    }
}
fn main() -> i32 {
    let mut w = W { xs: [1, 2] };
    w.f() = 5;
    @intCast(w.xs[0])
}
"""
compile_fail = true
error_contains = ["[E0902]", "the length is 2 but the index is 7"]

[[case]]
name = "constant_index_out_of_bounds_in_a_nested_accessor_yield"
spec = ["7.1:9", "6.6:7"]
description = "RUE-2263: every Index projection of the yield place is checked, not only the outermost one."
source = """
struct W {
    xs: [[i64; 2]; 2],

    fn f(borrow self) -> borrow i64 {
        yield self.xs[1][5];
    }
}
fn main() -> i32 {
    let w = W { xs: [[1, 2], [3, 4]] };
    @intCast(w.f())
}
"""
compile_fail = true
error_contains = ["[E0902]", "the length is 2 but the index is 5"]

[[case]]
name = "constant_index_in_bounds_in_an_accessor_yield_still_runs"
spec = ["7.1:9", "6.6:7"]
description = "Control for RUE-2263: an in-range constant index in a yield place still compiles and reads the element."
source = """
struct W {
    xs: [i64; 3],

    fn f(borrow self) -> borrow i64 {
        yield self.xs[1];
    }
}
fn main() -> i32 {
    let w = W { xs: [1, 2, 3] };
    @intCast(w.f())
}
"""
exit_code = 2

# =============================================================================
# Runtime Bounds Checking
# =============================================================================

[[case]]
name = "runtime_index_in_bounds"
spec = ["7.1:10"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 42, 30];
    let i = 1;
    arr[i]
}
"""
exit_code = 42

[[case]]
name = "runtime_index_out_of_bounds"
spec = ["7.1:10", "7.1:11"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let i = 5;
    arr[i]
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_local_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "Control: a dynamic read from a zero-length array binding traps at run time, since every index is out of range for `[T; 0]`."
source = """
fn main() -> i32 {
    let a: [i64; 0] = [];
    let i: i32 = 0;
    let t: i64 = a[i];
    @intCast(t)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_field_read_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: a dynamic read from a zero-length array reached through a struct field compiles and traps before any element address is formed."
source = """
struct H { x: i8, arr: [i64; 0] }
fn main() -> i32 {
    let h: H = H { x: 8, arr: [] };
    let i: i32 = 0;
    let t: i64 = h.arr[i];
    @intCast(t)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_field_write_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: a dynamic write into a zero-length array field traps before the store."
source = """
struct H { x: i8, arr: [i64; 0] }
fn main() -> i32 {
    let mut h: H = H { x: 8, arr: [] };
    let i: i32 = 0;
    h.arr[i] = 5;
    @intCast(h.x)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_field_compound_assign_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: a compound assignment through a dynamic index into a zero-length array field traps."
source = """
struct H { x: i8, arr: [i64; 0] }
fn main() -> i32 {
    let mut h: H = H { x: 8, arr: [] };
    let i: i32 = 0;
    h.arr[i] += 1;
    @intCast(h.x)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_field_copy_drop_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: `@drop` of a Copy element read through a dynamic index into a zero-length array field evaluates the index and traps."
source = """
struct H { x: i8, arr: [i64; 0] }
fn main() -> i32 {
    let h: H = H { x: 8, arr: [] };
    let i: i32 = 0;
    @drop(h.arr[i]);
    @intCast(h.x)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_inner_dimension_field_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: an in-range outer index followed by a dynamic index into a zero-length inner dimension of a field traps at the inner level."
source = """
struct H { x: i8, arr: [[i64; 0]; 2] }
fn main() -> i32 {
    let h: H = H { x: 8, arr: [[], []] };
    let i: i32 = 1;
    let j: i32 = 0;
    let t: i64 = h.arr[i][j];
    @intCast(t)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_inner_dimension_static_outer_field_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: a constant outer index followed by a dynamic index into a zero-length inner dimension of a field traps."
source = """
struct H { x: i8, arr: [[i64; 0]; 2] }
fn main() -> i32 {
    let h: H = H { x: 8, arr: [[], []] };
    let i: i32 = 0;
    let t: i64 = h.arr[0][i];
    @intCast(t)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_outer_dimension_field_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: a dynamic index into a zero-length outer dimension of a field traps before the inner element is reached."
source = """
struct H { x: i8, arr: [[i64; 2]; 0] }
fn main() -> i32 {
    let h: H = H { x: 8, arr: [] };
    let i: i32 = 0;
    let t: i64 = h.arr[i][1];
    @intCast(t)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_nested_field_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: a dynamic index into a zero-length array two fields deep traps."
source = """
struct G { y: i64, arr: [i64; 0] }
struct H { x: i8, g: G }
fn main() -> i32 {
    let h: H = H { x: 8, g: G { y: 3, arr: [] } };
    let i: i32 = 0;
    let t: i64 = h.g.arr[i];
    @intCast(t)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_param_field_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: a dynamic index into a zero-length array field of a by-value parameter traps."
source = """
struct H { x: i8, arr: [i64; 0] }
fn get(h: H, i: i32) -> i64 { h.arr[i] }
fn main() -> i32 {
    let t: i64 = get(H { x: 8, arr: [] }, 0);
    @intCast(t)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_sized_element_field"
spec = ["7.1:10", "7.1:11", "7.1:12", "8.2:1"]
description = "RUE-2345: an in-range dynamic index into a field array of zero-sized elements reads and writes without disturbing the sized fields around it."
source = """
@copy struct S {}
struct H { x: i8, arr: [S; 3], y: i64 }
fn main() -> i32 {
    let mut h: H = H { x: 8, arr: [S {}, S {}, S {}], y: 34 };
    let i: i32 = 2;
    let s: S = h.arr[i];
    h.arr[i] = s;
    @intCast(h.x) + @intCast(h.y)
}
"""
exit_code = 42

[[case]]
name = "runtime_index_zero_sized_element_field_out_of_bounds"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: an out-of-range dynamic index into a field array of zero-sized elements still traps."
source = """
@copy struct S {}
struct H { x: i8, arr: [S; 3] }
fn main() -> i32 {
    let h: H = H { x: 8, arr: [S {}, S {}, S {}] };
    let i: i32 = 3;
    let s: S = h.arr[i];
    @intCast(h.x)
}
"""
runtime_error = "index out of bounds"

# =============================================================================
# Mutable Array Element Assignment
# =============================================================================


[[case]]
name = "runtime_index_zero_length_field_multi_slot_element_traps"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: a dynamic read of a field of a multi-slot element from a zero-length array field traps; the element's own slot count must not decide the diversion."
source = """
struct P { a: i64, b: i64 }
struct H { x: i8, z: [P; 0] }
fn main() -> i32 {
    let h: H = H { x: 8, z: [] };
    let i: i32 = 0;
    let t: i64 = h.z[i].a;
    @intCast(t)
}
"""
runtime_error = "index out of bounds"

[[case]]
name = "runtime_index_zero_length_borrow_field_traps_when_inlined"
spec = ["7.1:10", "7.1:11", "8.2:1"]
description = "RUE-2345: at -O2 a `borrow` parameter's zero-length array field is inlined into a local place, which must be diverted too; the read traps."
source = """
struct H { x: i8, arr: [i64; 0] }
fn get(borrow h: H, i: i32) -> i64 { h.arr[i] }
fn main() -> i32 {
    let h: H = H { x: 8, arr: [] };
    let i: i32 = 0;
    let t: i64 = get(borrow h, i);
    @intCast(t)
}
"""
runtime_error = "index out of bounds"
opt_level = 2
[[case]]
name = "mutable_array_assign"
spec = ["7.1:12"]
source = """
fn main() -> i32 {
    let mut arr: [i32; 3] = [10, 20, 30];
    arr[1] = 42;
    arr[1]
}
"""
exit_code = 42

[[case]]
name = "mutable_array_assign_all"
spec = ["7.1:12"]
source = """
fn main() -> i32 {
    let mut arr: [i32; 3] = [0, 0, 0];
    arr[0] = 10;
    arr[1] = 20;
    arr[2] = 12;
    arr[0] + arr[1] + arr[2]
}
"""
exit_code = 42

[[case]]
name = "immutable_array_assign_error"
error_contains = "[E0203]"
spec = ["7.1:12"]
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    arr[1] = 42;
    arr[1]
}
"""
compile_fail = true

