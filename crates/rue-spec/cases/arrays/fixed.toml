[[case]]
name = "array_length_call_matching_return_types_accepted"
spec = ["7.1:41", "6.1:5"]
description = "Values of the declared return type fold to array lengths: a u64 shift in a u64 function, an untyped literal at u64, arithmetic at usize and i32, and a nested call of the same type"
source = """
fn sh(comptime s: u64) -> u64 { 1 << s }
fn lit(comptime s: u64) -> u64 { 4 }
fn twice(comptime k: usize) -> usize { k * 2 }
fn inc(comptime k: i32) -> i32 { k + 1 }
fn nested(comptime s: u64) -> u64 { sh(s) + 1 }
struct S { a: [u8; sh(3)], b: [u8; lit(0)], c: [u8; nested(2)] }
fn sum(a: [u8; twice(3)], b: [u8; inc(3)]) -> u8 { a[5] + b[3] }
fn main() -> i32 {
    let s = S { a: [1; 8], b: [2; 4], c: [3; 5] };
    let t: u8 = s.a[7] + s.b[3] + s.c[4] + sum([4; 6], [5; 4]);
    @intCast(t)
}
"""
exit_code = 15

