# =============================================================================
# Array Projection Semantics
# =============================================================================

[[case]]
name = "array_index_projection_basic"
spec = ["7.1:25"]
description = "Array indexing is a projection - reading does not move the array"
source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let x = arr[0];
    let y = arr[1];
    let z = arr[2];
    x + y + z
}
"""
exit_code = 60

[[case]]
name = "array_copy_element_read_multiple"
spec = ["7.1:25", "7.1:26"]
description = "Copy elements can be read multiple times from same index"
source = """
fn main() -> i32 {
    let arr: [i32; 2] = [21, 10];
    let x = arr[0];
    let y = arr[0];
    x + y
}
"""
exit_code = 42

[[case]]
name = "array_projection_after_read"
spec = ["7.1:25", "7.1:26"]
description = "Array can still be used after reading elements"
source = """
fn sum(arr: [i32; 3]) -> i32 { arr[0] + arr[1] + arr[2] }

fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 12];
    let first = arr[0];
    sum(arr)
}
"""
exit_code = 42

[[case]]
name = "array_non_copy_element_move_error"
spec = ["7.1:28"]
description = "Cannot move non-Copy element out with a non-constant index (RUE-186 keeps dynamic indices conservative)"
source = """
struct BigThing { value: i32 }

fn first_index() -> u64 { 0 }

fn main() -> i32 {
    let arr: [BigThing; 2] = [BigThing { value: 1 }, BigThing { value: 2 }];
    let i = first_index();
    let x = arr[i];
    x.value
}
"""
compile_fail = true
error_contains = "cannot move out of"

[[case]]
name = "array_non_copy_rvalue_element_move_error"
spec = ["7.1:28"]
description = "Cannot move a non-Copy element out of a computed (non-variable) array, even with a constant index"
source = """
struct BigThing { value: i32 }

fn make() -> [BigThing; 2] {
    [BigThing { value: 1 }, BigThing { value: 2 }]
}

fn main() -> i32 {
    let x = make()[0];
    x.value
}
"""
compile_fail = true
error_contains = "cannot move out of"

[[case]]
name = "array_non_copy_constant_index_move_ok"
spec = ["7.1:28", "3.8:68"]
description = "A constant index into an array variable moves the element out (per-element tracking)"
source = """
struct BigThing { value: i32 }

fn main() -> i32 {
    let arr: [BigThing; 2] = [BigThing { value: 40 }, BigThing { value: 2 }];
    let x = arr[0];
    let y = arr[1];
    x.value + y.value
}
"""
exit_code = 42

[[case]]
name = "array_non_copy_field_access_ok"
spec = ["7.1:25", "7.1:28"]
description = "Accessing Copy field of non-Copy element is OK (projection chain)"
source = """
struct BigThing { value: i32 }

fn main() -> i32 {
    let arr: [BigThing; 2] = [BigThing { value: 10 }, BigThing { value: 32 }];
    arr[0].value + arr[1].value
}
"""
exit_code = 42

[[case]]
name = "array_mutable_element_assign"
spec = ["7.1:30"]
description = "Mutable array element assignment is in-place mutation"
source = """
fn main() -> i32 {
    let mut arr: [i32; 3] = [0, 0, 0];
    arr[0] = 10;
    arr[1] = 20;
    arr[2] = 12;
    arr[0] + arr[1] + arr[2]
}
"""
exit_code = 42

