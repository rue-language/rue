cfg main (return_type: i32) {
  bb0:
    v0 : () = storage_live $0
    v1 : i32 = const 42
    v2 : () = alloc $0 = v1
    v3 : () = storage_live $1
    v4 : bool = const true
    v5 : () = alloc $1 = v4
