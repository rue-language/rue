[[case]]
name = "loop_inner_partial_move_then_outer_exit"
spec = ["3.9:2", "3.9:18", "3.8:55"]
description = "A local of an outer loop body, partly moved and reinitialized in an inner loop, is dropped exactly once when a `break` or `return` leaves the outer loop (RUE-2356)"
source = """
struct S { v: i64 }
drop fn S(self) { @dbg(self.v); }
struct H { a: S, w: S }

fn leave_by_break(n: i64) {
    let mut i: i64 = 0;
    while i < n {
        let mut g = H { a: S { v: 100 + i }, w: S { v: 200 + i } };
        let mut j: i64 = 0;
        loop {
            g.w = S { v: 300 + j };
            let x: S = g.w;
            @drop(x);
            j = j + 1;
            if j == 2 { break; }
        }
        if i == 1 { break; }
        i = i + 1;
    }
    @dbg(0);
}

fn leave_by_return(n: i64) {
    let h0 = S { v: 1 };
    let mut i: i64 = 0;
    while i < n {
        let mut g = H { a: S { v: 100 + i }, w: S { v: 200 + i } };
        let mut j: i64 = 0;
        loop {
            g.w = S { v: 300 + j };
            let x: S = g.w;
            @drop(x);
            j = j + 1;
            if i == 1 { @dbg(-1); return; }
            if j == 2 { break; }
        }
        i = i + 1;
    }
    @dbg(0);
}

fn main() -> i32 {
    leave_by_break(5);
    leave_by_return(5);
    0
}
"""
exit_code = 0
expected_stdout = "200\n300\n301\n100\n201\n300\n301\n101\n0\n200\n300\n301\n100\n201\n300\n-1\n101\n1\n"

