# =============================================================================
# Drop Placement
# =============================================================================

[[case]]
name = "drop_at_block_scope_end"
spec = ["3.9:18"]
description = "Values are dropped at end of block scope"
source = """
struct Data { value: i32 }

fn main() -> i32 {
    let result = {
        let d = Data { value: 42 };
        d.value
    };  // d dropped here, at end of block
    result
}
"""
exit_code = 42

[[case]]
name = "drop_before_early_return"
spec = ["3.9:18", "3.9:20"]
description = "Values are dropped before early return; expected_stdout pins that the destructor actually runs on the early-return path"
source = """
struct Data { value: i32 }

drop fn Data(self) {
    @dbg(self.value);
}

fn example(condition: bool) -> i32 {
    let a = Data { value: 1 };
    if condition {
        return 42;  // a dropped before return
    }
    a.value
}

fn main() -> i32 {
    example(true)
}
"""
exit_code = 42
expected_stdout = "1\n"

[[case]]
name = "panic_does_not_run_scope_drop_glue"
spec = ["3.4:2", "3.8:51", "3.9:28"]
description = "An explicit panic aborts without running the destructor of a live binding"
source = """
struct Guard { value: i32 }

drop fn Guard(self) {
    @dbg(self.value);
}

fn main() -> i32 {
    let guard = Guard { value: 7 };
    @panic("no drop");
}
"""
exit_code = 101
stderr_contains = "panic: no drop"
expected_stdout = ""

[[case]]
name = "drop_in_each_branch"
spec = ["3.9:19", "3.9:20"]
description = "Each branch independently drops its bindings; expected_stdout pins LIFO order (b before a) on the taken branch"
source = """
struct Data { value: i32 }

drop fn Data(self) {
    @dbg(self.value);
}

fn example(condition: bool) -> i32 {
    let a = Data { value: 1 };
    if condition {
        let b = Data { value: 2 };
        return a.value + b.value;  // b dropped, then a dropped, then return
    }
    let c = Data { value: 3 };
    a.value + c.value  // c dropped, then a dropped
}

fn main() -> i32 {
    example(true)
}
"""
exit_code = 3
expected_stdout = "2\n1\n"

# =============================================================================
# Types with Destructors (StrBuf)
# =============================================================================

# These tests verify destructor behavior using StrBuf, which has a destructor
# that frees heap-allocated buffers when capacity > 0.

[[case]]
name = "type_with_destructor"
spec = ["3.9:11", "3.10:29"]
description = "A type has a destructor if dropping requires cleanup (StrBuf drops heap buffer)"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut s = StrBuf.new();
    s.push_str("hello");
    // s has heap allocation
    0
}  // StrBuf destructor frees heap buffer
"""
exit_code = 0

[[case]]
name = "type_with_destructor_literal_promoted"
spec = ["3.9:11", "3.10:29", "3.10:21"]
description = "StrBuf promoted from literal has destructor that frees heap"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut s: StrBuf = "hello";
    s.push_str("!");  // promotes to heap
    // s now has capacity > 0
    0
}  // destructor frees the heap buffer
"""
exit_code = 0

[[case]]
name = "type_with_destructor_literal_no_heap"
spec = ["3.9:11", "3.10:29"]
description = "StrBuf literal (cap=0) has no cleanup action"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "hello";
    // s is a literal with cap=0, no heap allocation
    0
}  // no heap to free
"""
exit_code = 0

[[case]]
name = "struct_with_destructor_field"
spec = ["3.9:12"]
description = "Struct has destructor if any field has destructor"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
struct Container {
    name: StrBuf,
    value: i32,
}

fn main() -> i32 {
    let mut s = StrBuf.new();
    s.push_str("test");
    let c = Container { name: s, value: 42 };
    c.value
}  // Container dropped: name field (StrBuf) is dropped, freeing heap
"""
exit_code = 42

[[case]]
name = "field_drop_order"
spec = ["3.9:13"]
description = "Fields dropped in declaration order; the field destructors' @dbg output pins the ORDER (first, then second), so inverted field-drop order fails"
source = """
struct Member { id: i32 }

drop fn Member(self) {
    @dbg(self.id);
}

struct Pair {
    first: Member,
    second: Member,
}

fn main() -> i32 {
    let p = Pair { first: Member { id: 1 }, second: Member { id: 2 } };
    p.first.id - 1
}  // Pair dropped: first field dropped (prints 1), then second field (prints 2)
"""
exit_code = 0
expected_stdout = "1\n2\n"

[[case]]
name = "struct_with_string_fields_dropped"
spec = ["3.9:13"]
description = "Struct whose StrBuf fields require cleanup drops each field (heap buffers freed)"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
struct TwoStrings {
    first: StrBuf,
    second: StrBuf,
}

fn main() -> i32 {
    let mut a = StrBuf.new();
    a.push_str("first");
    let mut b = StrBuf.new();
    b.push_str("second");
    let ts = TwoStrings { first: a, second: b };
    0
}  // TwoStrings dropped: first field dropped, then second field dropped
"""
exit_code = 0

# =============================================================================
# Golden Tests: CFG Storage Liveness
# =============================================================================

# These tests verify that StorageLive/StorageDead instructions are emitted
# correctly in the CFG for drop elaboration.

[[case]]
name = "cfg_simple_scope_storage"
description = "CFG shows StorageLive at let binding, StorageDead at scope exit"
source = """
fn main() -> i32 {
    let x = 42;
    x
}
"""
expected_cfg = """
cfg main (return_type: i32) {
  bb0:
    v0 : () = storage_live $0
    v1 : i32 = const 42
    v2 : () = alloc $0 = v1
    v3 : i32 = load $0
    v4 : () = storage_dead $0
    return v3

}
"""

[[case]]
name = "cfg_multiple_variables_drop_order"
# This case combines a golden assertion with exit_code on purpose: the runner
# must verify BOTH (regression test for the silent execution-skip, RUE-132).
description = "CFG shows StorageDead in reverse declaration order (LIFO), and the program runs with the expected result"
source = """
fn main() -> i32 {
    let a = 1;
    let b = 2;
    a + b
}
"""
exit_code = 3
expected_cfg = """
cfg main (return_type: i32) {
  bb0:
    v0 : () = storage_live $0
    v1 : i32 = const 1
    v2 : () = alloc $0 = v1
    v3 : () = storage_live $1
    v4 : i32 = const 2
    v5 : () = alloc $1 = v4
    v6 : i32 = load $0
    v7 : i32 = load $1
    v8 : i32 = add v6, v7
    v9 : () = storage_dead $1
    v10 : () = storage_dead $0
    return v8

}
"""

[[case]]
name = "cfg_break_drops"
description = "CFG shows exactly one StorageDead before break, not duplicate"
source = """
fn main() -> i32 {
    while true {
        let x = 1;
        break;
    }
    0
}
"""
expected_cfg = """
cfg main (return_type: i32) {
  bb0:
    goto bb1

  bb1:
    ; preds: bb0
    v0 : bool = const true
    branch v0, bb2, bb3

  bb2:
    ; preds: bb1
    v1 : () = storage_live $0
    v2 : i32 = const 1
    v3 : () = alloc $0 = v2
    v4 : () = storage_dead $0
    goto bb3

  bb3:
    ; preds: bb1, bb2
    v5 : () = const 0
    v6 : i32 = const 0
    return v6

}
"""

[[case]]
name = "cfg_continue_drops"
description = "CFG shows exactly one StorageDead before continue, not duplicate"
source = """
fn main() -> i32 {
    let mut i = 0;
    while i < 3 {
        let x = 1;
        i = i + 1;
        continue;
    }
    i
}
"""
expected_cfg = """
cfg main (return_type: i32) {
  bb0:
    v0 : () = storage_live $0
    v1 : i32 = const 0
    v2 : () = alloc $0 = v1
    goto bb1

  bb1:
    ; preds: bb0, bb2
    v3 : i32 = load $0
    v4 : i32 = const 3
    v5 : bool = lt v3, v4
    branch v5, bb2, bb3

  bb2:
    ; preds: bb1
    v6 : () = storage_live $1
    v7 : i32 = const 1
    v8 : () = alloc $1 = v7
    v9 : i32 = load $0
    v10 : i32 = const 1
    v11 : i32 = add v9, v10
    v12 : () = store $0 = v11
    v13 : () = storage_dead $1
    goto bb1

  bb3:
    ; preds: bb1
    v14 : () = const 0
    v15 : i32 = load $0
    v16 : () = storage_dead $0
    return v15

}
"""

[[case]]
name = "cfg_early_return_drops"
description = "CFG shows StorageDead before early return"
source = """
fn main() -> i32 {
    let a = 1;
    if true {
        return 42;
    }
    a
}
"""
expected_cfg = """
cfg main (return_type: i32) {
  bb0:
    v0 : () = storage_live $0
    v1 : i32 = const 1
    v2 : () = alloc $0 = v1
    v3 : bool = const true
    branch v3, bb1, bb2

  bb1:
    ; preds: bb0
    v4 : i32 = const 42
    goto bb5(v4)

  bb2:
    ; preds: bb0
    v8 : () = const 0
    goto bb3

  bb3:
    ; preds: bb2
    v9 : i32 = load $0
    v10 : () = storage_dead $0
    return v9

  bb4:(v5: i32)
    ; preds: bb5
    return v5

  bb5:(v6: i32)
    ; preds: bb1
    v7 : () = storage_dead $0
    goto bb4(v6)

}
"""

