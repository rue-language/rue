    let mut w = S { v: 2 };
    let mut i: i64 = 0;
    while i < n {
        w = S { v: 10 + i };
        let x: S = w;
        @drop(x);
        i = i + 1;
    }
    @dbg(0);
}

fn move_then_reinit(n: i64) {
    let mut h = H { a: S { v: 1 }, w: S { v: 3 } };
    let mut i: i64 = 0;
    while i < n {
        let x: S = h.w;
        @drop(x);
        h.w = S { v: 20 + i };
        i = i + 1;
    }
    @dbg(0);
}

fn move_in_condition() {
    let mut h = H { a: S { v: 1 }, w: S { v: 4 } };
    let mut w = S { v: 5 };
    let mut k: i64 = 30;
    while val(h.w) < 32 { h.w = S { v: k }; k = k + 1; }
    while val(w) < 42 { w = S { v: k + 9 }; k = k + 1; }
    @dbg(0);
}

fn untouched(n: i64) {
    let mut h = H { a: S { v: 1 }, w: S { v: 6 } };
    let x: S = h.w;
    @drop(x);
    let mut i: i64 = 0;
    while i < n { i = i + 1; }
    @dbg(0);
}

fn main() -> i32 {
    variable(2);
    move_then_reinit(2);
    move_in_condition();
    untouched(2);
    0
}
"""
exit_code = 0
expected_stdout = "2\n10\n11\n0\n3\n20\n0\n1\n21\n4\n30\n31\n32\n5\n42\n0\n1\n6\n0\n1\n"
opt_level = 3

