# -----------------------------------------------------------------------------
# Loop-head move states (RUE-2356). A loop head is reached from the loop's
# entry and from its back edges, so a place moved or reinitialized inside the
# loop may be owned on one incoming path and moved out on another. Each drop
# of such a place (overwrite, scope exit, break) must follow what the executed
# path did, so every value is dropped exactly once (3.9:2): a value moved by
# the previous iteration is not dropped again when the place is reassigned,
# and one reassigned in the loop after a move before it is not leaked.
# -----------------------------------------------------------------------------

[[case]]
name = "loop_reinit_then_move_field_each_depth"
spec = ["3.9:2", "3.9:18", "3.8:55"]
description = "A field reinitialized and then moved on every loop iteration, at depths 1 to 3, is dropped exactly once; a zero-iteration loop drops the original value at scope exit (RUE-2356)"
source = """
struct S { v: i64 }
drop fn S(self) { @dbg(self.v); }
struct Q { w: S }
struct R { q: Q }
struct H { a: S, w: S, q: Q, r: R }

fn run(n: i64) {
    let mut h = H { a: S { v: 1 }, w: S { v: 2 }, q: Q { w: S { v: 3 } }, r: R { q: Q { w: S { v: 4 } } } };
    let mut i: i64 = 0;
    while i < n {
        h.w = S { v: 10 + i };         // drops 2 on the first iteration only
        let x: S = h.w;
        @drop(x);                      // 10, then 11
        h.q.w = S { v: 20 + i };
        let y: S = h.q.w;
        @drop(y);
        h.r.q.w = S { v: 30 + i };
        let z: S = h.r.q.w;
        @drop(z);
        i = i + 1;
    }
    @dbg(0);
}   // 1, plus 2 3 4 when the loop never ran

fn main() -> i32 {
    run(2);
    run(0);
    0
}
"""
exit_code = 0
expected_stdout = "2\n10\n3\n20\n4\n30\n11\n21\n31\n0\n1\n0\n1\n2\n3\n4\n"

