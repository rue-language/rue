drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { f: Inner }

fn take(i: Inner) -> i32 {
    i.v
}

drop fn Outer(self) {
    @dbg(take(self.f));
}

fn main() -> i32 {
