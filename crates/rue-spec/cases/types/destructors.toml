[[case]]
name = "loop_condition_break_and_continue_target_outer_loop"
spec = ["3.9:2", "3.9:18", "3.8:55"]
description = "A `break` or `continue` in an inner `while` condition that leaves for the outer loop keeps each moved or reinitialized value dropped exactly once (RUE-2356)"
source = """
struct S { v: i64 }
drop fn S(self) { @dbg(self.v); }
struct H { a: S, w: S }
struct D { x: i64 }
drop fn D(self) { @dbg(self.x); }
fn mk(s: i64) -> D { @dbg(0 - s); D { x: s } }
fn eat(d: D) -> i64 { d.x }

fn break_in_condition(n: i64) {
    let mut h = H { a: S { v: 1 }, w: S { v: 2 } };
    let mut i: i64 = 0;
    while i < n {
        let mut j: i64 = 0;
        while (if i == 1 && j == 1 { break; } else { j < 2 }) {
            h.w = S { v: 100 + 10 * i + j };
            let x: S = h.w;
            @drop(x);
            j = j + 1;
        }
        i = i + 1;
    }
    @dbg(0);
}

fn continue_in_condition() {
    let mut v = mk(1);
    eat(v);
    let mut i: i64 = 0;
    while i < 3 {
        i = i + 1;
        let mut j: i64 = 0;
        while (if i == 2 && j == 1 { continue; } else { j < 2 }) {
            v = mk(100 + 10 * (i - 1) + j);
            j = j + 1;
            if i < 3 || j < 2 { eat(v); }
        }
    }
    @dbg(0);
}

fn main() -> i32 {
    break_in_condition(3);
    continue_in_condition();
    0
}
"""
exit_code = 0
expected_stdout = "2\n100\n101\n110\n0\n1\n-1\n1\n-100\n100\n-101\n101\n-110\n110\n-120\n120\n-121\n0\n121\n"

