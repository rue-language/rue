# =============================================================================
# The `@drop` intrinsic (RUE-187, ADR-0039)
# =============================================================================

[[case]]
name = "drop_intrinsic_runs_glue_early"
spec = ["3.9:37", "3.9:38"]
description = "@drop(x) runs the destructor at the call site, not at scope exit; expected_stdout pins the ORDER (42 before 2)"
source = """
struct Guard { v: i32 }

drop fn Guard(self) { @dbg(self.v); }

fn main() -> i32 {
    let g = Guard { v: 42 };
    @dbg(1);
    @drop(g);   // destructor runs HERE: prints 42
    @dbg(2);
    0           // g already consumed — no second drop at scope exit
}
"""
exit_code = 0
expected_stdout = "1\n42\n2\n"

[[case]]
name = "drop_intrinsic_drops_partial_residue"
spec = ["3.9:37", "3.9:38"]
description = "@drop of a partially moved place destroys only its owned residue at the explicit site."
source = """
struct Leaf { v: i32 }

drop fn Leaf(self) { @dbg(self.v); }

struct Pair { left: Leaf, right: Leaf }

fn take(leaf: Leaf) -> i32 {
    @dbg(800);
    0
}

fn main() -> i32 {
    let pair = Pair { left: Leaf { v: 1 }, right: Leaf { v: 2 } };
    take(pair.left);
    @dbg(777);
    @drop(pair);
    @dbg(888);
    0
}
"""
exit_code = 0
expected_stdout = "800\n1\n777\n2\n888\n"

[[case]]
name = "drop_intrinsic_dropped_exactly_once"
spec = ["3.9:38"]
description = "The scope-exit drop is suppressed after @drop, so the destructor runs exactly once (42 prints once)"
source = """
struct Guard { v: i32 }

drop fn Guard(self) { @dbg(self.v); }

fn main() -> i32 {
    let g = Guard { v: 42 };
    @drop(g);
    @dbg(99);
    0
}
"""
exit_code = 0
expected_stdout = "42\n99\n"

[[case]]
name = "drop_intrinsic_use_after_is_error"
spec = ["3.9:38"]
description = "Using a value after @drop is a use-after-move error (E0205)"
source = """
struct Guard { v: i32 }

drop fn Guard(self) { @dbg(self.v); }

fn take(g: Guard) -> i32 { g.v }

fn main() -> i32 {
    let g = Guard { v: 1 };
    @drop(g);
