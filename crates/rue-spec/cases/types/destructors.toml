drop fn Data(self) {}

drop fn Data(self) {}

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "duplicate destructor"

[[case]]
name = "destructor_unknown_type_error"
spec = ["3.9:27"]
description = "Destructor for unknown type produces an error"
source = """
