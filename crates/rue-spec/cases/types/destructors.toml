    let mut g = G { k: S { v: 3 }, a: [mk(4), mk(5)] };
    let mut i: i64 = 0;
    while i < n {
        g.a = [mk(10 * i + 40), mk(10 * i + 41)];
        let x: S = g.a[0].s;
        @drop(x);
        i = i + 1;
    }
    @dbg(0);
}

fn main() -> i32 {
    whole_struct(2);
    whole_struct(0);
    array_field(2);
    array_field(0);
    0
}
