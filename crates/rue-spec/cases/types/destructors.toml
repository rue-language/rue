    let mut h = H { a: S { v: 1 }, w: S { v: 2 } };
    let mut i: i64 = 0;
    while i < n {
        h = H { a: S { v: 10 * i + 10 }, w: S { v: 10 * i + 11 } };
        let x: S = h.w;
        @drop(x);
        i = i + 1;
    }
    @dbg(0);
}

