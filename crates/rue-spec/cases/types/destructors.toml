[section]
id = "types.destructors"
spec_chapter = "3.9"
name = "Destructors"
description = "Drop semantics and destructor behavior."

# =============================================================================
# Drop Semantics
# =============================================================================

[[case]]
name = "value_dropped_at_scope_exit"
spec = ["3.9:1", "3.9:2"]
description = "Values are dropped when their binding goes out of scope"
source = """
struct Data { value: i32 }

fn main() -> i32 {
    let d = Data { value: 42 };
    d.value
}  // d is dropped here
"""
exit_code = 42

[[case]]
name = "moved_value_not_dropped_at_original_site"
spec = ["3.9:2", "3.9:3"]
description = "Moved values are not dropped at their original binding"
source = """
struct Data { value: i32 }

fn consume(d: Data) -> i32 { d.value }

fn main() -> i32 {
    let d = Data { value: 42 };
    consume(d)  // d is moved, dropped inside consume()
}  // d is NOT dropped here (was moved)
"""
exit_code = 42

[[case]]
name = "moved_value_dropped_exactly_once_in_callee"
spec = ["3.9:1", "3.9:2", "3.9:3"]
description = "A value moved into a call is dropped exactly once, by the callee (RUE-61)"
source = """
struct Data { value: i32 }

drop fn Data(self) {
    @dbg(self.value);
}

fn consume(d: Data) -> i32 { d.value }

fn main() -> i32 {
    let d = Data { value: 7 };
    consume(d);   // destructor runs in consume, at its exit
    @dbg(100);    // ...so 7 prints before 100, and never again
    0
}
"""
exit_code = 0
expected_stdout = "7\n100\n"

[[case]]
name = "moved_to_local_dropped_exactly_once"
spec = ["3.9:1", "3.9:2"]
description = "A value moved into another binding is dropped exactly once, at its destination (RUE-61)"
source = """
struct Data { value: i32 }

drop fn Data(self) {
    @dbg(self.value);
}

fn main() -> i32 {
    let a = Data { value: 7 };
    let b = a;    // a's slot must not be dropped again
    @dbg(100);
    0
}
"""
exit_code = 0
expected_stdout = "100\n7\n"

[[case]]
name = "returned_value_not_dropped_in_returning_function"
spec = ["3.9:1", "3.9:2"]
description = "A returned value moves to the caller and is not dropped by the returning function (RUE-61)"
source = """
struct Data { value: i32 }

drop fn Data(self) {
    @dbg(self.value);
}

fn make() -> Data {
    let d = Data { value: 5 };
    d
}

fn main() -> i32 {
    let m = make();
    @dbg(100);
    0
}
"""
exit_code = 0
expected_stdout = "100\n5\n"

[[case]]
name = "partially_moved_struct_drops_remaining_fields_once"
spec = ["3.9:1", "3.9:2"]
description = "Moving one field out of a struct: the field drops at its destination (the callee), and the struct's scope-exit drop covers only the remaining fields (RUE-62)"
source = """
struct Inner { v: i32 }

drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { a: Inner, b: Inner }

fn eat(i: Inner) -> i32 {
    @dbg(800);
    0
}

fn main() -> i32 {
    let o = Outer { a: Inner { v: 1 }, b: Inner { v: 2 } };
    eat(o.a);     // a drops inside eat (800, then 1)...
    @dbg(777);
    0             // ...and only b (2) drops at main's exit
}
"""
exit_code = 0
expected_stdout = "800\n1\n777\n2\n"

# =============================================================================
# Drop Order
# =============================================================================

[[case]]
name = "drop_order_reverse_declaration"
spec = ["3.9:4", "3.9:5", "3.9:6"]
description = "Multiple values dropped in reverse declaration order (LIFO); expected_stdout pins the ORDER, not just that drops happen"
source = """
struct Data { value: i32 }

drop fn Data(self) {
    @dbg(self.value);
}

fn main() -> i32 {
    let a = Data { value: 1 };  // declared first
    let b = Data { value: 2 };  // declared second
    a.value + b.value
}  // b dropped first, then a dropped
"""
exit_code = 3
expected_stdout = "2\n1\n"

