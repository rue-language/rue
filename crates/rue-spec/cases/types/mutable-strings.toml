source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "hi";
    let O = std.option.Option(u8);
    match s.byte_at(0) {
        O.Some(b) => @intCast(b),  // 'h' = 104
