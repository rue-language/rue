[section]
id = "types.mutable_strings"
spec_chapter = "3.10"
name = "Mutable Strings"
description = "Mutable string capabilities building on the core StrBuf type."

# =============================================================================
# StrBuf Representation (3.10:1 - 3.10:3)
# =============================================================================

# Note: The three-field representation (ptr, len, cap) is tested indirectly
# through the query methods len() and capacity(). The ptr field is internal.

[[case]]
name = "string_representation_len_cap"
spec = ["3.10:1", "3.10:2"]
description = "StrBuf has length and capacity (proving three-field representation)"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "hello";
    // len and capacity are separately queryable, proving ptr/len/cap structure
    let l = s.len();
    let c = s.capacity();
    // Literal has cap=0, len=5
    let five: u64 = 5;
    let zero: u64 = 0;
    if l == five && c == zero { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "string_literal_read_only"
spec = ["3.10:2"]
description = "Literal has capacity zero (pointing to read-only memory)"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "hello world";
    // capacity == 0 means read-only memory (literal)
    let zero: u64 = 0;
    if s.capacity() == zero { 0 } else { 1 }
}
"""
exit_code = 0

