[section]
id = "types.never"
spec_chapter = "3.4"
name = "Never Type"
description = "The never type ! is the type of expressions that never produce a value."

# =============================================================================
# Never Type Definition
# =============================================================================

[[case]]
name = "never_return_expression"
spec = ["3.4:1", "3.4:2"]
source = """
fn test(x: i32) -> i32 {
    if x > 0 { return 42 }
    0
}
fn main() -> i32 { test(1) }
"""
exit_code = 42

[[case]]
name = "never_break_expression"
spec = ["3.4:1", "3.4:2"]
source = """
fn main() -> i32 {
    let mut i = 0;
    while true {
        i = i + 1;
        if i == 5 { break }
    }
    i
}
"""
exit_code = 5

[[case]]
name = "never_continue_expression"
spec = ["3.4:1", "3.4:2"]
source = """
fn main() -> i32 {
    let mut sum = 0;
    let mut i = 0;
    while i < 5 {
        i = i + 1;
        if i == 3 { continue }
        sum = sum + i;
    }
    sum
}
"""
exit_code = 12

# =============================================================================
# Type Coercion (3.4:3, 3.4:4)
# =============================================================================

[[case]]
name = "never_coerces_to_i32"
spec = ["3.4:3", "3.4:4"]
source = """
fn main() -> i32 {
    let x: i32 = if false { return 0 } else { 42 };
    x
}
"""
exit_code = 42

[[case]]
name = "never_coerces_in_match_arm"
spec = ["3.4:3", "3.4:4"]
source = """
fn main() -> i32 {
    let x = 2;
    match x {
        1 => 10,
        2 => 20,
        _ => return 0,
    }
}
"""
exit_code = 20

[[case]]
name = "never_empty_match_coerces_with_int_literal"
spec = ["3.4:3", "3.4:4"]
description = "A never-typed empty match (`match n {}` over an uninhabited enum) coerces to the integer type demanded by an arithmetic context: `1 + match n {}` must type-check, not be rejected as a literal out of range for '!' (RUE-270). A dead runtime branch references `absurd` so its uncallable body is still analyzed."
source = """
enum Never {}
fn absurd(n: Never) -> i32 { 1 + match n {} }
fn main() -> i32 { if false { absurd(loop {}); } 0 }
"""
exit_code = 0

[[case]]
name = "never_empty_match_coerces_in_let"
spec = ["3.4:3", "3.4:4"]
description = "A never-typed empty match coerces to an annotated let type (RUE-270)."
source = """
enum Never {}
fn absurd(n: Never) -> i32 { let x: i32 = match n {}; x }
fn main() -> i32 { if false { absurd(loop {}); } 0 }
"""
exit_code = 0

[[case]]
name = "never_in_if_branch"
spec = ["3.4:3", "3.4:4"]
source = """
fn test(x: i32) -> i32 {
    let y = if x > 5 { return 100 } else { x };
    y * 2
}
fn main() -> i32 { test(3) }
"""
exit_code = 6

# =============================================================================
# Both Branches Diverge (3.4:6)
# =============================================================================

[[case]]
name = "both_if_branches_diverge"
spec = ["3.4:6"]
source = """
fn diverges(x: i32) -> i32 {
    if x > 0 { return 1 } else { return 0 }
}
fn main() -> i32 { diverges(5) }
"""
exit_code = 1

[[case]]
name = "both_if_branches_diverge_negative"
spec = ["3.4:6"]
source = """
fn diverges(x: i32) -> i32 {
    if x > 0 { return 1 } else { return 0 }
}
fn main() -> i32 { diverges(-5) }
"""
exit_code = 0

[[case]]
name = "all_match_arms_diverge"
spec = ["3.4:6"]
source = """
fn main() -> i32 {
    let x = 2;
    match x {
        1 => return 10,
        2 => return 20,
        _ => return 0,
    }
}
"""
exit_code = 20

[[case]]
name = "block_tail_diverges_has_never_type"
spec = ["3.4:6a"]
description = "A block whose tail expression diverges has type ! and coerces (RUE-299)"
source = """
fn test(x: i32) -> i32 {
    let y = { return 100 };
    y * 2
}
fn main() -> i32 { test(3) }
"""
exit_code = 100

[[case]]
name = "block_inner_statement_diverges_has_never_type"
spec = ["3.4:6a"]
description = "A block with a diverging statement (making its end unreachable) has type ! (RUE-299)"
source = """
fn test() -> i32 {
    let y = {
        return 7;
        0
    };
    y * 2
}
fn main() -> i32 { test() }
"""
exit_code = 7

[[case]]
name = "panic_statement_diverges_has_never_type"
spec = ["3.4:2", "3.4:6a", "4.13:5c"]
description = "A semicolon-terminated diverging statement leaves no reachable block tail and gives the block type !"
source = """
fn main() -> i32 {
    @panic("statement");
}
"""
exit_code = 101
stderr_contains = "panic: statement"

[[case]]
name = "return_statement_diverges_has_never_type"
spec = ["3.4:2", "3.4:6a"]
description = "A semicolon-terminated return leaves no reachable block tail"
source = """
fn answer() -> i32 {
    return 7;
}
fn main() -> i32 { answer() }
"""
exit_code = 7

[[case]]
name = "reachable_unit_statement_keeps_reachable_tail"
spec = ["3.4:6a"]
description = "An ordinary unit-valued statement does not make the following tail unreachable"
source = """
fn touch() {}
fn main() -> i32 {
    touch();
    42
}
"""
exit_code = 42

[[case]]
name = "short_circuited_panic_keeps_reachable_tail"
spec = ["3.4:6a", "4.4:5"]
description = "A panic in a skipped short-circuit operand does not make the logical statement diverge"
source = """
fn main() -> i32 {
    false && @panic("skipped");
    42
}
"""
exit_code = 42

[[case]]
name = "nested_panic_statement_diverges_has_never_type"
spec = ["3.4:2", "3.4:6a", "4.13:5c"]
description = "A nested block preserves bottom propagation from a diverging statement"
source = """
fn main() -> i32 {
    let value: i32 = {
        @panic();
    };
}
"""
exit_code = 101
stderr_contains = "panic"

[[case]]
name = "panic_in_let_statement_propagates_bottom"
spec = ["3.4:2", "3.4:6a", "4.13:5c"]
description = "A diverging initializer makes its unit-valued let statement non-continuing"
source = """
fn main() -> i32 {
    let value: i32 = @panic("initializer");
}
"""
exit_code = 101
stderr_contains = "panic: initializer"

[[case]]
name = "panic_in_call_argument_propagates_bottom"
spec = ["3.4:2", "3.4:6a", "4.13:5c"]
description = "A diverging call argument prevents the call statement from reaching its end"
source = """
fn sink(value: i32) {}
fn main() -> i32 {
    sink(@panic("argument"));
}
"""
exit_code = 101
stderr_contains = "panic: argument"

[[case]]
name = "panic_in_pointer_intrinsic_operand_propagates_bottom"
spec = ["3.4:2", "3.4:6a", "4.13:5c"]
description = "A diverging strict intrinsic operand prevents the unit-valued statement from continuing"
source = """
fn main() -> i32 {
    checked {
        @free(@panic("pointer operand"), 0, 1);
    }
}
"""
exit_code = 101
stderr_contains = "panic: pointer operand"

[[case]]
name = "assert_false_remains_unit"
spec = ["3.4:6a", "4.13:5d"]
description = "@assert(false) remains unit-typed rather than becoming Never"
source = """
fn main() -> i32 {
    @assert(false);
}
"""
compile_fail = true
error_contains = ["[E0206]", "expected i32", "found ()"]

[[case]]
name = "dead_string_reference_after_panic"
spec = ["3.4:2", "3.4:6a"]
description = "Unreachable string literals retain their semantic backing after a panic"
source = """
fn main() -> i32 {
    @panic("live");
    println("dead");
    0
}
"""
exit_code = 101
stderr_contains = "panic: live"

[[case]]
name = "panic_in_assignment_propagates_bottom"
spec = ["3.4:2", "3.4:6a"]
description = "A diverging assignment RHS makes the statement non-continuing without changing unit value typing"
source = """
fn main() -> i32 {
    let mut x = 0;
    x = @panic("assign");
}
"""
exit_code = 101
stderr_contains = "panic: assign"

[[case]]
name = "infinite_loop_value_coerces"
spec = ["3.4:6a"]
description = "An infinite loop with no reachable break has type ! and coerces into a binding (RUE-299)"
source = """
fn pick(x: i32) -> i32 {
    let y: i32 = if x > 0 { 42 } else { loop { } };
    y
}
fn main() -> i32 { pick(1) }
"""
exit_code = 42

# =============================================================================
# Diverging Functions (3.4:8)
# =============================================================================

[[case]]
name = "never_returning_function"
spec = ["3.4:8"]
source = """
fn diverge(x: i32) -> i32 {
    if x < 10 { return x }
    return 10
}
fn main() -> i32 { diverge(5) }
"""
exit_code = 5

# =============================================================================
# Memory Representation (3.4:9)
# =============================================================================

[[case]]
name = "never_size_zero"
spec = ["3.4:9", "3.0:2", "3.0:3"]
source = """
fn main() -> i32 {
    @size_of(!)
}
"""
exit_code = 0

[[case]]
name = "never_alignment_one"
spec = ["3.4:9", "3.0:4"]
source = """
fn main() -> i32 {
    @align_of(!)
}
"""
exit_code = 1

# =============================================================================
# Never Coercion at Operand Positions (RUE-2375)
# =============================================================================
# An operand position that asks for a class of types (an integer index, an
# integer cast operand, a matchable scrutinee) accepts `!` by the one coercion
# (3.4:3-4) before checking the class, as `(return 1) + 2` always did.

[[case]]
name = "never_coerces_at_array_index"
spec = ["3.4:3", "3.4:4", "7.1:7"]
description = "A diverging index is accepted where an integer index is required"
source = """
fn main() -> i32 {
    let a: [i32; 2] = [1, 2];
    a[return 8]
}
"""
exit_code = 8

[[case]]
name = "never_coerces_at_array_index_assignment"
spec = ["3.4:3", "3.4:4", "7.1:7"]
description = "A diverging index on the left of an assignment is accepted"
source = """
fn main() -> i32 {
    let mut a: [i32; 2] = [1, 2];
    a[return 17] = 3;
    a[0]
}
"""
exit_code = 17

[[case]]
name = "never_coerces_at_int_cast_operand"
spec = ["3.4:3", "3.4:4", "4.13:25"]
description = "A diverging @intCast operand is accepted where an integer is required"
source = """
fn main() -> i32 {
    let narrow: u8 = @intCast(return 27);
    let wide: i32 = @intCast(narrow);
    wide
}
"""
exit_code = 27

[[case]]
name = "never_coerces_at_bit_cast_operand"
spec = ["3.4:3", "3.4:4", "4.13:119", "4.13:120"]
description = "A diverging @bitCast operand is accepted; it has no width to compare with the target's"
source = """
fn main() -> i32 {
    let bits: u32 = @bitCast(return 39);
    let back: i32 = @bitCast(bits);
    back
}
"""
exit_code = 39

[[case]]
name = "annotated_let_keeps_its_type_over_a_diverging_initializer"
spec = ["3.4:3", "3.4:4"]
description = "A let's annotation types the binding when its initializer diverges, so later uses see i64, not !"
source = """
fn f() -> i32 {
    let t: i64 = return 5;
    let r: i32 = @intCast(t);
    r
}
fn main() -> i32 { f() }
"""
exit_code = 5

[[case]]
name = "annotated_let_of_struct_type_over_a_diverging_initializer"
spec = ["3.4:3", "3.4:4"]
description = "Field access and method calls on a struct-annotated binding with a diverging initializer are typed at the struct"
source = """
struct P {
    x: i32,
    fn get(self) -> i32 { self.x }
}
fn main() -> i32 {
    let p: P = return 10;
    p.x + p.get()
}
"""
exit_code = 10

[[case]]
name = "integer_literal_beside_a_diverging_operand_is_not_typed_never"
spec = ["3.4:3", "3.4:4", "3.11:9"]
description = "An integer literal compared with, listed beside, or passed beside a diverging operand takes its own type, not !"
source = """
fn main() -> i32 {
    if (return 18) < 3 { 1 } else { 2 }
}
"""
exit_code = 18

[[case]]
name = "integer_literal_beside_a_diverging_operand_in_called_helpers"
spec = ["3.4:3", "3.4:4", "3.11:9"]
description = "The same, as the right operand of a comparison, beside an array element and beside a wrapping intrinsic's operand; main calls each so every body is analyzed"
source = """
fn cmp_rhs() -> i32 { if 3 == (return 1) { 1 } else { 2 } }
fn elems() -> i32 { let a: [i32; 2] = [return 15, 1]; a[1] }
fn wrapping() -> i32 { @wrapping_add(return 41, 1) }
fn main() -> i32 {
    cmp_rhs() + elems() + wrapping()
}
"""
exit_code = 57

[[case]]
name = "float_literal_beside_a_diverging_operand_is_not_typed_never"
spec = ["3.4:3", "3.4:4", "3.11:9"]
description = "A float literal compared with a diverging operand takes its own type, not !"
source = """
fn main() -> i32 {
    if (return 52) < 2.5 { 1 } else { 2 }
}
"""
exit_code = 52

[[case]]
name = "never_coerces_at_match_scrutinee"
spec = ["3.4:3", "3.4:4", "4.7:13"]
description = "A diverging scrutinee is typed at the type its patterns ask for: integer, bool, or enum"
source = """
enum E { A, B }
fn by_bool() -> i32 { match return 29 { true => 1, false => 2 } }
fn by_enum() -> i32 { match return 48 { E.A => 1, E.B => 2 } }
fn by_int() -> i32 { match return 6 { 0 => 1, _ => 2 } }
fn main() -> i32 {
    by_bool() + by_enum() + by_int()
}
"""
exit_code = 83

[[case]]
name = "integer_literal_at_a_declared_never_parameter_rejected"
spec = ["3.4:3", "3.1:17"]
description = "The coercion runs from ! only: a literal passed where a parameter declares ! is still rejected"
source = """
fn g(x: !) -> i32 { 0 }
fn main() -> i32 { g(5) }
"""
compile_fail = true
error_contains = "out of range for type '!'"

[[case]]
name = "wrapping_arithmetic_with_both_operands_diverging_is_never_typed"
spec = ["3.4:3", "3.4:4", "4.13:98"]
description = "A wrapping-arithmetic intrinsic whose operands both diverge has type !, in value and statement position"
source = """
fn d() -> ! { @panic("unreachable") }
fn sub_let() -> i32 { let x = @wrapping_sub(return 13, return 8); 0 }
fn mul_stmt() -> i32 { @wrapping_mul(return 14, return 8); 0 }
fn to_u8() -> u8 { @wrapping_add(return 18, d()) }
fn value() -> i32 { @wrapping_add(return 7, return 8) }
fn main() -> i32 {
    let narrow: i32 = @intCast(to_u8());
    sub_let() + mul_stmt() + narrow + value()
}
"""
exit_code = 52

[[case]]
name = "float_rounding_intrinsic_of_a_diverging_operand_is_never_typed"
spec = ["3.4:3", "3.4:4", "4.13:143"]
description = "A rounding intrinsic whose only operand diverges has type !, which coerces to a non-float context"
source = """
fn as_let() -> i32 { let x: i32 = @sqrt(return 4); x }
fn as_bool() -> bool { @floor(return true) }
fn as_value() -> i32 { @sqrt(return 3) }
fn main() -> i32 {
    if as_bool() { as_let() + as_value() } else { 0 }
}
"""
exit_code = 7
