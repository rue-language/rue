[section]
id = "types.never"
spec_chapter = "3.4"
name = "Never Type"
description = "The never type ! is the type of expressions that never produce a value."

# =============================================================================
# Never Type Definition
# =============================================================================

[[case]]
name = "never_return_expression"
spec = ["3.4:1", "3.4:2"]
source = """
fn test(x: i32) -> i32 {
    if x > 0 { return 42 }
    0
}
fn main() -> i32 { test(1) }
"""
exit_code = 42

[[case]]
name = "never_break_expression"
spec = ["3.4:1", "3.4:2"]
source = """
fn main() -> i32 {
    let mut i = 0;
    while true {
        i = i + 1;
        if i == 5 { break }
    }
    i
}
"""
exit_code = 5

[[case]]
name = "never_continue_expression"
spec = ["3.4:1", "3.4:2"]
source = """
fn main() -> i32 {
    let mut sum = 0;
    let mut i = 0;
    while i < 5 {
        i = i + 1;
        if i == 3 { continue }
        sum = sum + i;
    }
    sum
}
"""
exit_code = 12

# =============================================================================
# Type Coercion (3.4:3, 3.4:4)
# =============================================================================

[[case]]
name = "never_coerces_to_i32"
spec = ["3.4:3", "3.4:4"]
source = """
fn main() -> i32 {
    let x: i32 = if false { return 0 } else { 42 };
    x
}
"""
exit_code = 42

[[case]]
name = "never_coerces_in_match_arm"
spec = ["3.4:3", "3.4:4"]
source = """
fn main() -> i32 {
    let x = 2;
    match x {
        1 => 10,
        2 => 20,
        _ => return 0,
    }
}
"""
exit_code = 20

[[case]]
name = "never_empty_match_coerces_with_int_literal"
spec = ["3.4:3", "3.4:4"]
description = "A never-typed empty match (`match n {}` over an uninhabited enum) coerces to the integer type demanded by an arithmetic context: `1 + match n {}` must type-check, not be rejected as a literal out of range for '!' (RUE-270). A dead runtime branch references `absurd` so its uncallable body is still analyzed."
source = """
enum Never {}
fn absurd(n: Never) -> i32 { 1 + match n {} }
fn main() -> i32 { if false { absurd(loop {}); } 0 }
"""
exit_code = 0

[[case]]
name = "never_empty_match_coerces_in_let"
spec = ["3.4:3", "3.4:4"]
description = "A never-typed empty match coerces to an annotated let type (RUE-270)."
source = """
enum Never {}
fn absurd(n: Never) -> i32 { let x: i32 = match n {}; x }
fn main() -> i32 { if false { absurd(loop {}); } 0 }
"""
exit_code = 0

[[case]]
name = "never_in_if_branch"
spec = ["3.4:3", "3.4:4"]
source = """
fn test(x: i32) -> i32 {
    let y = if x > 5 { return 100 } else { x };
    y * 2
}
fn main() -> i32 { test(3) }
"""
exit_code = 6

# =============================================================================
# Both Branches Diverge (3.4:6)
# =============================================================================

[[case]]
name = "both_if_branches_diverge"
spec = ["3.4:6"]
source = """
fn diverges(x: i32) -> i32 {
    if x > 0 { return 1 } else { return 0 }
}
fn main() -> i32 { diverges(5) }
"""
exit_code = 1

[[case]]
name = "both_if_branches_diverge_negative"
spec = ["3.4:6"]
source = """
fn diverges(x: i32) -> i32 {
    if x > 0 { return 1 } else { return 0 }
}
fn main() -> i32 { diverges(-5) }
"""
exit_code = 0

[[case]]
name = "all_match_arms_diverge"
spec = ["3.4:6"]
source = """
fn main() -> i32 {
    let x = 2;
    match x {
        1 => return 10,
        2 => return 20,
        _ => return 0,
    }
}
"""
exit_code = 20

[[case]]
name = "block_tail_diverges_has_never_type"
spec = ["3.4:6a"]
description = "A block whose tail expression diverges has type ! and coerces (RUE-299)"
source = """
fn test(x: i32) -> i32 {
    let y = { return 100 };
    y * 2
}
fn main() -> i32 { test(3) }
"""
exit_code = 100

[[case]]
name = "block_inner_statement_diverges_has_never_type"
spec = ["3.4:6a"]
description = "A block with a diverging statement (making its end unreachable) has type ! (RUE-299)"
source = """
fn test() -> i32 {
    let y = {
        return 7;
        0
    };
    y * 2
}
fn main() -> i32 { test() }
"""
exit_code = 7

[[case]]
name = "panic_statement_diverges_has_never_type"
spec = ["3.4:2", "3.4:6a", "4.13:5b"]
description = "A semicolon-terminated diverging statement leaves no reachable block tail and gives the block type !"
source = """
fn main() -> i32 {
    @panic("statement");
}
"""
exit_code = 101
stderr_contains = "panic: statement"

[[case]]
name = "return_statement_diverges_has_never_type"
spec = ["3.4:2", "3.4:6a"]
description = "A semicolon-terminated return leaves no reachable block tail"
source = """
fn answer() -> i32 {
    return 7;
}
fn main() -> i32 { answer() }
"""
exit_code = 7

[[case]]
name = "reachable_unit_statement_keeps_reachable_tail"
spec = ["3.4:6a"]
description = "An ordinary unit-valued statement does not make the following tail unreachable"
source = """
fn touch() {}
fn main() -> i32 {
    touch();
    42
}
"""
exit_code = 42

[[case]]
name = "short_circuited_panic_keeps_reachable_tail"
spec = ["3.4:6a", "4.4:5"]
description = "A panic in a skipped short-circuit operand does not make the logical statement diverge"
source = """
fn main() -> i32 {
    false && @panic("skipped");
    42
}
"""
exit_code = 42

[[case]]
name = "nested_panic_statement_diverges_has_never_type"
spec = ["3.4:2", "3.4:6a", "4.13:5b"]
description = "A nested block preserves bottom propagation from a diverging statement"
source = """
fn main() -> i32 {
    let value: i32 = {
        @panic();
    };
}
"""
exit_code = 101
stderr_contains = "panic"

[[case]]
name = "panic_in_let_statement_propagates_bottom"
spec = ["3.4:2", "3.4:6a", "4.13:5b"]
description = "A diverging initializer makes its unit-valued let statement non-continuing"
source = """
fn main() -> i32 {
    let value: i32 = @panic("initializer");
}
"""
exit_code = 101
stderr_contains = "panic: initializer"

[[case]]
name = "panic_in_call_argument_propagates_bottom"
spec = ["3.4:2", "3.4:6a", "4.13:5b"]
description = "A diverging call argument prevents the call statement from reaching its end"
source = """
fn sink(value: i32) {}
fn main() -> i32 {
    sink(@panic("argument"));
}
"""
exit_code = 101
stderr_contains = "panic: argument"

[[case]]
name = "panic_in_pointer_intrinsic_operand_propagates_bottom"
spec = ["3.4:2", "3.4:6a", "4.13:5b"]
description = "A diverging strict intrinsic operand prevents the unit-valued statement from continuing"
source = """
fn main() -> i32 {
    checked {
        @free(@panic("pointer operand"), 0, 1);
    }
}
"""
exit_code = 101
stderr_contains = "panic: pointer operand"

[[case]]
name = "assert_false_remains_unit"
spec = ["3.4:6a", "4.13:5b"]
description = "@assert(false) remains unit-typed rather than becoming Never"
source = """
fn main() -> i32 {
    @assert(false);
}
"""
compile_fail = true
error_contains = ["[E0206]", "expected i32", "found ()"]

[[case]]
name = "dead_string_reference_after_panic"
spec = ["3.4:2", "3.4:6a"]
description = "Unreachable string literals retain their semantic backing after a panic"
source = """
fn main() -> i32 {
    @panic("live");
    println("dead");
    0
}
"""
exit_code = 101
stderr_contains = "panic: live"

[[case]]
name = "panic_in_assignment_propagates_bottom"
spec = ["3.4:2", "3.4:6a"]
description = "A diverging assignment RHS makes the statement non-continuing without changing unit value typing"
source = """
fn main() -> i32 {
    let mut x = 0;
    x = @panic("assign");
}
"""
exit_code = 101
stderr_contains = "panic: assign"

[[case]]
name = "infinite_loop_value_coerces"
spec = ["3.4:6a"]
description = "An infinite loop with no reachable break has type ! and coerces into a binding (RUE-299)"
source = """
fn pick(x: i32) -> i32 {
    let y: i32 = if x > 0 { 42 } else { loop { } };
    y
}
fn main() -> i32 { pick(1) }
"""
exit_code = 42

# =============================================================================
# Diverging Functions (3.4:8)
# =============================================================================

[[case]]
name = "never_returning_function"
spec = ["3.4:8"]
source = """
fn diverge(x: i32) -> i32 {
    if x < 10 { return x }
    return 10
}
fn main() -> i32 { diverge(5) }
"""
exit_code = 5

# =============================================================================
# Memory Representation (3.4:9)
# =============================================================================

[[case]]
name = "never_size_zero"
spec = ["3.4:9", "3.0:2", "3.0:3"]
source = """
fn main() -> i32 {
    @size_of(!)
}
"""
exit_code = 0

[[case]]
name = "never_alignment_one"
spec = ["3.4:9", "3.0:4"]
source = """
fn main() -> i32 {
    @align_of(!)
}
"""
exit_code = 1
