# =============================================================================
# String Debugging with @dbg
# =============================================================================

[[case]]
name = "string_dbg_literal"
spec = ["3.7:12"]
source = """
fn main() -> i32 {
    @dbg("hello");
    0
}
"""
exit_code = 0
expected_stdout = "hello\n"

[[case]]
name = "string_dbg_variable"
spec = ["3.7:12"]
source = """
