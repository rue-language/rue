# =============================================================================
# String Copy Semantics (ADR-019)
# =============================================================================

[[case]]
name = "string_copy_semantics_basic"
spec = ["3.7:14", "3.7:15"]
source = """
fn main() -> i32 {
    let a = "hello";
    let b = a;
    if a == b { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "string_copy_semantics_independent"
spec = ["3.7:14", "3.7:15"]
source = """
fn main() -> i32 {
    let mut a = "hello";
    let b = a;
    a = "world";
    // b should still be "hello" (independent copy)
    if b == "hello" { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "string_copy_semantics_both_mutable"
spec = ["3.7:14", "3.7:15"]
source = """
fn main() -> i32 {
    let mut a = "one";
    let mut b = a;
    a = "two";
    b = "three";
    // a and b are independent
    if a == "two" && b == "three" { 1 } else { 0 }
}
"""
exit_code = 1

