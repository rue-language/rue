# =============================================================================
# Byte Access (RUE-17 Phase 2, ADR-0035)
# =============================================================================

[[case]]
name = "string_index_ascii_byte"
spec = ["3.7:15", "3.7:16"]
source = """
fn main() -> i32 {
    let t = "abc";
    @dbg(t[1]);
    0
}
"""
exit_code = 0
expected_stdout = "98\n"

[[case]]
name = "string_index_utf8_bytes"
spec = ["3.7:15", "3.7:16"]
source = """
fn main() -> i32 {
    let s = "café";
    @dbg(s[0]);
    @dbg(s[3]);
    @dbg(s[4]);
    0
}
"""
exit_code = 0
expected_stdout = "99\n195\n169\n"

[[case]]
name = "string_index_does_not_consume"
spec = ["3.7:16"]
source = """
fn main() -> i32 {
    let s = "hello";
    @dbg(s[0]);
    @dbg(s.len());
    @dbg(s[1]);
    0
}
"""
exit_code = 0
expected_stdout = "104\n5\n101\n"

[[case]]
name = "string_index_out_of_bounds_traps"
spec = ["3.7:17"]
source = """
fn main() -> i32 {
    let s = "café";
    @dbg(s[5]);
    0
}
"""
exit_code = 101

[[case]]
name = "string_substring_len"
spec = ["3.7:19"]
source = """
fn main() -> i32 {
    let s = "café";
    let tail = s.substring(3, 2);
    @dbg(tail.len());
    0
}
"""
exit_code = 0
expected_stdout = "2\n"

[[case]]
name = "string_substring_bytes"
spec = ["3.7:15", "3.7:19"]
source = """
fn main() -> i32 {
    let s = "café";
    let tail = s.substring(3, 2);
    @dbg(tail[0]);
    @dbg(tail[1]);
    0
}
"""
exit_code = 0
expected_stdout = "195\n169\n"

[[case]]
name = "string_substring_empty"
spec = ["3.7:19"]
source = """
fn main() -> i32 {
    let s = "café";
    let e = s.substring(2, 0);
    @dbg(e.len());
    0
}
"""
exit_code = 0
expected_stdout = "0\n"

[[case]]
name = "string_substring_does_not_consume"
spec = ["3.7:19"]
source = """
fn main() -> i32 {
    let s = "hello";
    let mid = s.substring(1, 3);
    @dbg(mid.len());
    @dbg(s.len());
    0
}
"""
exit_code = 0
expected_stdout = "3\n5\n"

[[case]]
name = "string_substring_out_of_bounds_traps"
spec = ["3.7:20"]
source = """
fn main() -> i32 {
    let s = "café";
    let bad = s.substring(3, 3);
    @dbg(bad.len());
    0
}
"""
exit_code = 101

# ---------------------------------------------------------------------------
# Integer formatting, concatenation, and search (RUE-17 Phase 1, ADR-0035)
# ---------------------------------------------------------------------------

[[case]]
name = "to_string_positive"
spec = ["3.7:22"]
source = """
fn main() -> i32 {
    @dbg(@to_string(42));
    0
}
"""
exit_code = 0
expected_stdout = "42\n"

[[case]]
name = "to_string_negative_and_zero"
spec = ["3.7:23"]
source = """
fn main() -> i32 {
    @dbg(@to_string(-5));
    @dbg(@to_string(0));
    0
}
"""
exit_code = 0
expected_stdout = "-5\n0\n"

[[case]]
name = "to_string_i64_extremes"
spec = ["3.7:23"]
source = """
fn main() -> i32 {
    let lo: i64 = -9223372036854775808;
    let hi: i64 = 9223372036854775807;
    @dbg(@to_string(lo));
    @dbg(@to_string(hi));
    0
}
"""
exit_code = 0
expected_stdout = "-9223372036854775808\n9223372036854775807\n"

[[case]]
name = "string_concat_literals"
spec = ["3.7:25"]
source = """
fn main() -> i32 {
    let g = "Hello, " + "world!";
    @dbg(g);
    0
}
"""
exit_code = 0
expected_stdout = "Hello, world!\n"

[[case]]
name = "string_concat_borrows_operands"
spec = ["3.7:25"]
source = """
fn main() -> i32 {
    let a = "foo";
    let b = "bar";
    let c = a + b;
    @dbg(c);
    @dbg(a);
    @dbg(b);
    0
}
"""
exit_code = 0
expected_stdout = "foobar\nfoo\nbar\n"

[[case]]
name = "string_concat_is_not_integer_add"
spec = ["3.7:25"]
source = """
fn main() -> i32 {
    let n = @to_string(7) + @to_string(8);
    @dbg(n);
    0
}
"""
exit_code = 0
expected_stdout = "78\n"

[[case]]
name = "string_plus_integer_is_type_error"
spec = ["3.7:26"]
compile_fail = true
error_contains = "E0206"
source = """
fn main() -> i32 {
    let a = "foo";
    let c = a + 5;
    @dbg(c);
    0
}
"""

[[case]]
name = "string_contains_byte_level"
spec = ["3.7:28"]
source = """
fn main() -> i32 {
    let h = "hello";
    @dbg(h.contains("ell"));
    @dbg(h.contains("xyz"));
    @dbg(h.contains(""));
    0
}
"""
exit_code = 0
expected_stdout = "true\nfalse\ntrue\n"

[[case]]
name = "string_starts_with_byte_level"
spec = ["3.7:29"]
source = """
fn main() -> i32 {
    let h = "hello";
    @dbg(h.starts_with("he"));
    @dbg(h.starts_with("lo"));
    @dbg(h.starts_with(""));
    0
}
"""
exit_code = 0
expected_stdout = "true\nfalse\ntrue\n"

[[case]]
name = "string_search_does_not_consume"
spec = ["3.7:28", "3.7:29"]
source = """
fn main() -> i32 {
    let h = "hello";
    @dbg(h.contains("ell"));
    @dbg(h.starts_with("he"));
    @dbg(h.len());
    0
}
"""
exit_code = 0
expected_stdout = "true\ntrue\n5\n"

# --- Output: print / println (RUE-1) ---

[[case]]
