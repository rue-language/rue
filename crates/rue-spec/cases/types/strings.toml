# =============================================================================
# Scope-Based Cleanup (ADR-019)
# =============================================================================

[[case]]
name = "string_scope_cleanup_basic"
spec = ["3.7:20", "3.7:21"]
source = """
fn test_scope() -> i32 {
    let s = "hello" + " world";
    @dbg(s);
    0
}

fn main() -> i32 {
    test_scope()
}
"""
exit_code = 0
stdout = "hello world\n"

[[case]]
name = "string_scope_cleanup_nested"
spec = ["3.7:20"]
source = """
fn inner(a: String) -> i32 {
    let b = a + " inner";
    @dbg(b);
    0
}

fn outer() -> i32 {
    let a = "outer";
    inner(a);
    @dbg(a);
    0
}

fn main() -> i32 {
    outer()
}
"""
exit_code = 0
stdout = "outer inner\nouter\n"

[[case]]
name = "string_scope_cleanup_early_return"
spec = ["3.7:20"]
source = """
fn helper() -> i32 {
    let s = "test" + " string";
    return 42;
    // s should be cleaned up on return
}

fn main() -> i32 {
    helper()
}
"""
exit_code = 42

[[case]]
name = "string_scope_cleanup_nested_early_return"
spec = ["3.7:20"]
source = """
fn main() -> i32 {
    {
        let outer = "a" + "b";
        {
            let inner = "c" + "d";
            return 0;
            // Both inner and outer should be dropped
        }
    }
}
"""
exit_code = 0

[[case]]
name = "string_scope_cleanup_loop_break"
spec = ["3.7:20"]
source = """
fn main() -> i32 {
    let mut count = 0;
    while count < 3 {
        let s = "loop" + " iteration";
        count = count + 1;
        if count == 2 {
            break;
        }
    }
    count
}
"""
exit_code = 2

[[case]]
name = "string_scope_cleanup_nested_loop_break"
spec = ["3.7:20"]
source = """
fn main() -> i32 {
    let mut count = 0;
    while count < 3 {
        let outer = "a" + "b";
        {
            let inner = "c" + "d";
            count = count + 1;
            if count == 2 {
                break;
                // Both inner and outer should be dropped
            }
        }
    }
    count
}
"""
exit_code = 2

[[case]]
name = "string_scope_cleanup_loop_continue"
spec = ["3.7:20"]
source = """
fn main() -> i32 {
    let mut count = 0;
    let mut total = 0;
    while count < 3 {
        count = count + 1;
        let s = "iteration";
        if count == 2 {
            continue;
        }
        total = total + 1;
    }
    total
}
"""
exit_code = 2

[[case]]
name = "string_scope_cleanup_nested_loop_continue"
spec = ["3.7:20"]
source = """
fn main() -> i32 {
    let mut count = 0;
    let mut total = 0;
    while count < 3 {
        count = count + 1;
        let outer = "x" + "y";
        if count == 2 {
            let inner = "a" + "b";
            continue;
            // Both inner and outer should be dropped
        }
        total = total + 1;
    }
    total
}
"""
exit_code = 2

