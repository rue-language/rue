    0
}
"""
exit_code = 0
expected_stdout = "\nend"

[[case]]
name = "print_borrows_argument_string"
spec = ["3.7:35"]
source = """
fn main() -> i32 {
    let s = "reused";
    print(s);
    print(s);
    @dbg(s.len());
    0
}
"""
exit_code = 0
expected_stdout = "reusedreused6\n"
