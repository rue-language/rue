# =============================================================================
# String Edge Cases
# =============================================================================

[[case]]
name = "string_long_concat"
spec = ["3.7:17", "3.7:18"]
source = """
fn main() -> i32 {
    let a = "This is a longer string ";
    let b = "that we are concatenating ";
    let c = "to test capacity growth.";
    let result = a + b + c;
    if result == "This is a longer string that we are concatenating to test capacity growth." {
        1
    } else {
        0
    }
}
"""
exit_code = 1

[[case]]
name = "string_concat_in_loop"
spec = ["3.7:17", "3.7:20"]
source = """
fn main() -> i32 {
    let mut count = 0;
    while count < 5 {
        let s = "x" + "y";
        // Each iteration creates and drops a string
        count = count + 1;
    }
    count
}
"""
exit_code = 5

[[case]]
name = "string_conditional_concat"
spec = ["3.7:17"]
source = """
fn main() -> i32 {
    let cond = true;
    let result = if cond {
        "yes" + "!"
    } else {
        "no" + "..."
    };
    if result == "yes!" { 1 } else { 0 }
}
"""
exit_code = 1
