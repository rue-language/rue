[section]
id = "types.structs"
spec_chapter = "3.6"
name = "Struct Types"
description = "Struct types are composite types with named fields."

# =============================================================================
# Struct Type Definition
# =============================================================================

[[case]]
name = "struct_type_definition"
spec = ["3.6:1", "3.6:2"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let p = Point { x: 10, y: 20 };
    p.x + p.y
}
"""
exit_code = 30

# =============================================================================
# Field Access with Dot Notation
# =============================================================================

[[case]]
name = "struct_field_access"
spec = ["3.6:4"]
source = """
struct Data { value: i32 }
fn main() -> i32 {
    let d = Data { value: 42 };
    d.value
}
"""
exit_code = 42

# =============================================================================
# All Fields Must Be Initialized
# =============================================================================

[[case]]
name = "struct_all_fields_init"
spec = ["3.6:5"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let p = Point { x: 20, y: 22 };
    p.x + p.y
}
"""
exit_code = 42

[[case]]
name = "struct_missing_field_error"
error_contains = "[E0400]"
spec = ["3.6:5"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let p = Point { x: 10 };
    p.x
}
"""
compile_fail = true

# =============================================================================
# Unique Field Names
# =============================================================================

[[case]]
name = "struct_unique_fields"
spec = ["3.6:6"]
source = """
struct Data { a: i32, b: i32, c: i32 }
fn main() -> i32 {
    let d = Data { a: 10, b: 20, c: 12 };
    d.a + d.b + d.c
}
"""
exit_code = 42

# =============================================================================
# Recursive Value Types
# =============================================================================

[[case]]
name = "recursive_value_type_requires_indirection"
spec = ["3.0:5"]
source = """
struct Node { next: [Node; 1], value: i32 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0483", "infinite size"]

[[case]]
name = "recursive_pointer_type_has_finite_layout"
spec = ["3.0:5"]
source = """
struct Node { next: ptr const Node, value: i32 }
fn main() -> i32 { 42 }
"""
exit_code = 42

[[case]]
name = "zero_length_array_remains_recursive_type_edge"
spec = ["3.0:5"]
source = """
struct Node { next: [Node; 0] }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0483", "infinite size"]

# =============================================================================
# Memory Layout
#
# Layout is implementation-defined (3.6:7): @size_of/@align_of report the layout
# the current implementation chose, they do not guarantee a value. The guarantee
# tested here is that @size_of/@align_of are well-defined observations (3.6:8);
# the specific numbers (natural scalar widths, declaration order, natural
# alignment with padding) are documented observations of the current compact
# layout (3.6:9/10/12), not language guarantees.
# =============================================================================

# @size_of is a well-defined observation (3.6:8); the concrete natural scalar
# width is this implementation's documented choice (3.6:9).
[[case]]
name = "scalar_size_i32"
spec = ["3.6:8", "3.6:9"]
source = """
fn main() -> i32 {
    @size_of(i32)
}
"""
exit_code = 4

[[case]]
name = "bool_size_one_byte"
spec = ["3.6:8", "3.6:9"]
source = """
fn main() -> i32 {
    @size_of(bool)
}
"""
exit_code = 1

[[case]]
name = "unit_size_zero"
spec = ["3.0:2", "3.0:3", "3.3:4"]
source = """
fn main() -> i32 {
    @size_of(())
}
"""
exit_code = 0

# Declaration-order compact layout is this implementation's documented
# observation (3.6:9), not a language guarantee.
[[case]]
name = "struct_fields_declaration_order"
spec = ["3.6:8", "3.6:9"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    // Current implementation: two i32 fields at their natural width = 8 bytes.
    @size_of(Point)
}
"""
exit_code = 8

# Size packs fields at their natural alignment (here all i32, so no padding) is a
# documented observation of the current layout (3.6:10), not guaranteed.
[[case]]
name = "struct_size_sum_of_fields"
spec = ["3.6:8", "3.6:10"]
source = """
struct Triple { a: i32, b: i32, c: i32 }
fn main() -> i32 {
    // Current implementation: three i32 fields = 12 bytes.
    @size_of(Triple)
}
"""
exit_code = 12

[[case]]
name = "nested_struct_size"
spec = ["3.6:8", "3.6:10"]
source = """
struct Point { x: i32, y: i32 }
struct Line { start: Point, end: Point }
fn main() -> i32 {
    // Current implementation: two Points, each 8 bytes = 16 bytes.
    @size_of(Line)
}
"""
exit_code = 16

# @align_of is a well-defined observation (3.6:8); a struct's concrete alignment
# is its widest field's, this implementation's documented choice (3.6:12).
[[case]]
name = "struct_alignment_natural"
spec = ["3.6:8", "3.6:12"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    @align_of(Point)
}
"""
exit_code = 4

[[case]]
name = "scalar_alignment_8_bytes"
spec = ["3.6:8", "3.6:12"]
source = """
fn main() -> i32 {
    @align_of(i64)
}
"""
exit_code = 8

# =============================================================================
# Empty Struct (Zero-Sized Type)
# =============================================================================

[[case]]
name = "empty_struct_definition"
spec = ["3.6:13", "3.0:2"]
source = """
struct Empty {}
fn main() -> i32 {
    let e = Empty {};
    42
}
"""
exit_code = 42

[[case]]
name = "empty_struct_size_zero"
spec = ["3.6:13", "3.0:2"]
source = """
struct Empty {}
fn main() -> i32 {
    @size_of(Empty)
}
"""
exit_code = 0

[[case]]
name = "empty_struct_alignment_one"
spec = ["3.6:12", "3.0:4"]
source = """
struct Empty {}
fn main() -> i32 {
    @align_of(Empty)
}
"""
exit_code = 1

[[case]]
name = "empty_struct_pass_by_value"
spec = ["3.6:13", "3.0:2"]
source = """
struct Empty {}
fn take_empty(e: Empty) -> i32 { 42 }
fn main() -> i32 {
    let e = Empty {};
    take_empty(e)
}
"""
exit_code = 42

[[case]]
name = "empty_struct_return_by_value"
spec = ["3.6:13", "3.0:2"]
source = """
struct Empty {}
fn make_empty() -> Empty { Empty {} }
fn main() -> i32 {
    let e = make_empty();
    42
}
"""
exit_code = 42

[[case]]
name = "struct_with_empty_field"
spec = ["3.6:10", "3.6:13"]
source = """
struct Empty {}
struct Container { value: i32, marker: Empty }
fn main() -> i32 {
    // Empty field contributes 0 bytes, so size is just value's 4 bytes
    @size_of(Container)
}
"""
exit_code = 4

[[case]]
name = "nested_empty_structs"
spec = ["3.6:10", "3.6:13"]
source = """
struct Empty {}
struct AlsoEmpty { e: Empty }
fn main() -> i32 {
    @size_of(AlsoEmpty)
}
"""
exit_code = 0


# =============================================================================
# Struct Literals: field order independence (RUE-9)
# =============================================================================

[[case]]
name = "struct_init_any_order"
spec = ["3.6:15"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    // Fields written out of declaration order, matched by name.
    // x stored in slot 0 (10), y in slot 1 (20): 10 - 20 + 42 = 32.
    let p = Point { y: 20, x: 10 };
    p.x - p.y + 42
}
"""
exit_code = 32

[[case]]
name = "struct_init_any_order_three_fields"
spec = ["3.6:15"]
source = """
struct Rec { a: i32, b: i32, c: i32 }
fn main() -> i32 {
    let r = Rec { c: 3, a: 1, b: 2 };
    r.a * 100 + r.b * 10 + r.c  // 123
}
"""
exit_code = 123

[[case]]
name = "struct_init_out_of_order_duplicate_error"
spec = ["3.6:15"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let p = Point { y: 2, y: 3, x: 1 };
    p.x
}
"""
compile_fail = true
error_contains = "duplicate field"

[[case]]
name = "struct_init_out_of_order_unknown_error"
spec = ["3.6:15"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let p = Point { y: 2, z: 9 };
    p.x
}
"""
compile_fail = true
error_contains = "unknown field"

[[case]]
name = "struct_init_out_of_order_missing_error"
spec = ["3.6:15"]
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let p = Point { y: 2 };
    p.y
}
"""
compile_fail = true
error_contains = "missing field"

[[case]]
name = "struct_init_source_order_stored_by_name"
spec = ["3.6:16"]
source = """
fn side_effect(val: i32) -> i32 {
    @dbg(val);
    val
}

struct Point { x: i32, y: i32 }

fn main() -> i32 {
    // Written y first, then x: evaluated in SOURCE order (prints 2 then 1),
    // but stored by name (x in slot 0, y in slot 1).
    let p = Point { y: side_effect(2), x: side_effect(1) };
    p.x * 100 + p.y  // 102
}
"""
exit_code = 102
expected_stdout = """
2
1
"""

# =============================================================================
# Field-Init Shorthand (RUE-613, stabilized RUE-628)
# =============================================================================

[[case]]
name = "field_init_shorthand_basic"
spec = ["3.6:18"]
description = "`P { x }` is shorthand for `P { x: x }`, taking the value from the in-scope `x`"
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let x = 10;
    let y = 20;
    let p = Point { x, y };
    p.x + p.y  // 30
}
"""
exit_code = 30

[[case]]
name = "field_init_shorthand_mixed_with_explicit"
spec = ["3.6:18"]
description = "Shorthand and explicit initializers may be mixed within one literal"
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let x = 10;
    let p = Point { x, y: 20 };
    p.x + p.y  // 30
}
"""
exit_code = 30

[[case]]
name = "field_init_shorthand_uses_innermost_binding"
spec = ["3.6:18"]
description = "A `let` shadowing an outer `x` supplies the shorthand's value (innermost binding)"
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let x = 1;
    let x = 40;
    let p = Point { x, y: 2 };
    p.x + p.y  // 42
}
"""
exit_code = 42

[[case]]
name = "field_init_shorthand_self_in_method"
spec = ["3.6:18"]
description = "Shorthand is available under a `Self { .. }` head inside a method"
source = """
struct Point {
    x: i32,
    y: i32,
    fn make(x: i32, y: i32) -> Self { Self { x, y } }
}
fn main() -> i32 {
    let p = Point.make(40, 2);
    p.x + p.y  // 42
}
"""
exit_code = 42

[[case]]
name = "field_init_shorthand_no_preview_needed"
spec = ["3.6:18"]
description = "Shorthand is stabilized: it compiles and runs with no preview flag"
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let x = 10;
    let y = 20;
    let p = Point { x, y };
    p.x + p.y  // 30
}
"""
exit_code = 30

[[case]]
name = "field_init_shorthand_undefined_name"
spec = ["3.6:18"]
description = "A shorthand naming a binding not in scope is the normal undefined-name error"
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let y = 20;
    let p = Point { x, y };
    p.x + p.y
}
"""
compile_fail = true
error_contains = ["E0201", "x"]
