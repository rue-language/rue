[section]
id = "types.integers"
spec_chapter = "3.1"
name = "Integer Types"
description = "Signed and unsigned integer types: i8, i16, i32, i64, u8, u16, u32, u64"

# =============================================================================
# Basic Integer Type Tests (Parameterized)
# =============================================================================
# These tests verify that each integer type can hold and return values.

[[case]]
name = "{type}_return"
spec = ["3.1:1"]
source = "fn main() -> {type} { {value} }"
params = [
  { type = "i8", value = "42", exit_code = 42, spec_extra = ["3.1:2"] },
  { type = "i16", value = "100", exit_code = 100, spec_extra = ["3.1:3"] },
  { type = "i32", value = "42", exit_code = 42, spec_extra = ["3.1:4"] },
  { type = "i64", value = "42", exit_code = 42, spec_extra = ["3.1:5"] },
  { type = "u8", value = "42", exit_code = 42, spec_extra = ["3.1:8", "3.1:9"] },
  { type = "u16", value = "100", exit_code = 100, spec_extra = ["3.1:8", "3.1:10"] },
  { type = "u32", value = "42", exit_code = 42, spec_extra = ["3.1:8", "3.1:11"] },
  { type = "u64", value = "42", exit_code = 42, spec_extra = ["3.1:8", "3.1:12"] },
]

[[case]]
name = "{type}_zero"
spec = ["3.1:1"]
source = "fn main() -> {type} { 0 }"
exit_code = 0
params = [
  { type = "i8", spec_extra = ["3.1:2"] },
  { type = "i16", spec_extra = ["3.1:3"] },
  { type = "i32", spec_extra = ["3.1:4"] },
  { type = "i64", spec_extra = ["3.1:5"] },
  { type = "u8", spec_extra = ["3.1:8", "3.1:9"] },
  { type = "u16", spec_extra = ["3.1:8", "3.1:10"] },
  { type = "u32", spec_extra = ["3.1:8", "3.1:11"] },
  { type = "u64", spec_extra = ["3.1:8", "3.1:12"] },
]

[[case]]
name = "{type}_variable"
spec = ["3.1:1"]
source = """
fn main() -> {type} {
    let x: {type} = {value};
    x
}
"""
params = [
  { type = "i8", value = "50", exit_code = 50, spec_extra = ["3.1:2"] },
  { type = "i16", value = "200", exit_code = 200, spec_extra = ["3.1:3"] },
  { type = "i64", value = "123", exit_code = 123, spec_extra = ["3.1:5"] },
]

[[case]]
name = "i8_max_positive"
spec = ["3.1:2"]
source = "fn main() -> i8 { 127 }"
exit_code = 127

[[case]]
name = "i8_arithmetic"
spec = ["3.1:1", "3.1:2"]
source = """
fn main() -> i8 {
    let a: i8 = 10;
    let b: i8 = 5;
    a + b
}
"""
exit_code = 15

[[case]]
name = "u8_max"
spec = ["3.1:9"]
source = "fn main() -> u8 { 255 }"
exit_code = 255

# =============================================================================
# Integer Literal Type Inference
# =============================================================================

[[case]]
name = "i32_default_type"
spec = ["3.1:14"]
source = """
fn main() -> i32 {
    let x = 42;
    x
}
"""
exit_code = 42

[[case]]
name = "i32_infer_from_context"
spec = ["3.1:15"]
source = """
fn takes_i32(x: i32) -> i32 { x }
fn main() -> i32 { takes_i32(42) }
"""
exit_code = 42

# Unify-then-default (HM / ADR-0007, RUE-218): an un-annotated literal gets an
# integer inference variable that unifies with every use in the function body.
# A single non-i32 use fixes the value to that type (ergonomic; matches Rust).
[[case]]
name = "int_literal_unifies_single_i64_use"
spec = ["3.1:14"]
source = """
fn takes_i64(v: i64) -> i64 { v }
fn main() -> i32 {
    let x = 5;
    let a = takes_i64(x);
    if a == 5 { 42 } else { 0 }
}
"""
exit_code = 42

# Two uses that require different integer types conflict, and the conflict is
# order-INDEPENDENT: both textual orders are rejected (E0206 type mismatch).
[[case]]
name = "int_literal_conflict_i32_then_i64"
spec = ["3.1:14"]
compile_fail = true
error_contains = ["E0206", "type mismatch"]
source = """
fn takes_i32(v: i32) -> i32 { v }
fn takes_i64(v: i64) -> i64 { v }
fn main() -> i32 {
    let x = 5;
    takes_i32(x);
    takes_i64(x);
    0
}
"""

[[case]]
name = "int_literal_conflict_i64_then_i32"
spec = ["3.1:14"]
compile_fail = true
error_contains = ["E0206", "type mismatch"]
source = """
fn takes_i32(v: i32) -> i32 { v }
fn takes_i64(v: i64) -> i64 { v }
fn main() -> i32 {
    let x = 5;
    takes_i64(x);
    takes_i32(x);
    0
}
"""

# No constraining use: the inference variable is still unbound at the defaulting
# point (end of the function body) and defaults to i32.
[[case]]
name = "int_literal_defaults_i32_when_unconstrained"
spec = ["3.1:15"]
source = """
fn main() -> i32 {
    let x = 5;
    x
}
"""
exit_code = 5

# =============================================================================
# Type Mismatch Errors
# =============================================================================

[[case]]
name = "type_mismatch_{from}_{to}"
error_contains = "[E0206]"
spec = ["3.1:1"]
compile_fail = true
source = """
fn main() -> {to} {
    let x: {from} = 42;
    x
}
"""
params = [
  { from = "i8", to = "i32" },
  { from = "i32", to = "u32", spec_extra = ["3.1:8"] },
]

# =============================================================================
# Signed Integer Overflow (Runtime Panic - Exit 101)
# =============================================================================

[[case]]
name = "{type}_overflow_addition"
spec = ["3.1:6"]
runtime_error = "integer overflow"
source = """
fn main() -> {type} {
    let x: {type} = {max};
    x + 1
}
"""
params = [
  { type = "i8", max = "127" },
  { type = "i16", max = "32767" },
]

[[case]]
name = "{type}_overflow_subtraction"
spec = ["3.1:6"]
runtime_error = "integer overflow"
source = """
fn main() -> {type} {
    let x: {type} = {min};
    x - 1
}
"""
params = [
  { type = "i8", min = "-128" },
  { type = "i16", min = "-32768" },
]

[[case]]
name = "i8_overflow_multiplication"
spec = ["3.1:6"]
source = """
