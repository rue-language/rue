}
"""
exit_code = 100

[[case]]
name = "literal_left_complex_expr"
spec = ["3.1:15"]
source = """
fn main() -> i32 {
    let x: i64 = 50;
    let y: i64 = 50;
    if 100 == x + y { 1 } else { 0 }
}
"""
exit_code = 1

[[case]]
name = "literal_left_function_call"
spec = ["3.1:15"]
source = """
