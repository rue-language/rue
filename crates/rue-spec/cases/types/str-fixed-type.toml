# The `Str(N)` fixed-capacity string type (ADR-0043 Phase 5, RUE-326).
#
# `Str(N)` is the FIXED string rung — `[u8; N]` + the UTF-8 byte-string
# convention — the string analogue of the fixed array `[T; N]`: an inline value
# type parameterized by a comptime capacity `N`, storing up to `N` bytes plus a
# current byte length, with no heap. It is constructed from a string literal
# that FITS (a literal exceeding `N` is a clean compile error, E0492), supports
# `.len()` (current byte length) and byte-indexing `s[i]` (bounds-checked
# against the length; an out-of-range index traps, exit 101), and coerces to a
# `str` view (§3.7:43) so it reads through the universal `str` interface.
#
# Stable with `str`. Deferred to later
# phases: mutation/append to `Str(N)`, ordering comparison, and methods beyond
# `.len()`/index/borrow.

[section]
id = "types.str_fixed_type"
spec_chapter = "3.7"
name = "The Str(N) Type"
description = "Str(N) is the fixed-capacity [u8; N] string rung: literal-constructed, len/index, coercible to str."

# 3.7:49 — `Str(N)` is a resolvable type.
[[case]]
name = "str_fixed_is_stable"
spec = ["3.7:49"]
source = """
fn main() -> i32 {
    let s: Str(8) = "hello";
    0
}
"""
exit_code = 0

# 3.7:49 / 3.7:50 — a fitting string literal has type `Str(N)` where a `Str(N)`
# is expected, and is storable in a binding.
[[case]]
name = "str_fixed_literal_binding"
spec = ["3.7:49", "3.7:50"]
source = """
fn main() -> i32 {
    let s: Str(8) = "hello";
    0
}
"""
exit_code = 0

# 3.7:50 — a `Str(N)` value is storable in a struct field (first-class).
[[case]]
name = "str_fixed_in_struct_field"
spec = ["3.7:50"]
source = """
struct Holder { s: Str(8) }
fn main() -> i32 {
    let h = Holder { s: "hi" };
    @intCast(h.s.len())
}
"""
exit_code = 2

# 3.7:50 — a `Str(N)` value is returnable from a function.
[[case]]
name = "str_fixed_returnable"
spec = ["3.7:50"]
source = """
fn make() -> Str(8) {
    "hi there"
}
fn main() -> i32 {
    let s: Str(8) = make();
    @intCast(s.len())
}
"""
exit_code = 8

# 3.7:51 — a literal whose byte length exceeds N is a compile-time error (E0492).
[[case]]
name = "str_fixed_over_capacity_is_error"
spec = ["3.7:51"]
source = """
fn main() -> i32 {
    let s: Str(3) = "hello";
    0
}
"""
compile_fail = true
error_contains = "E0492"

# 3.7:51 — a literal exactly at capacity is accepted (boundary).
[[case]]
name = "str_fixed_exact_capacity_ok"
spec = ["3.7:51"]
source = """
fn main() -> i32 {
    let s: Str(5) = "hello";
    @intCast(s.len())
}
"""
exit_code = 5

# 3.7:52 — `.len()` is the current byte length (≤ N), not the capacity.
[[case]]
name = "str_fixed_len_is_current_not_capacity"
spec = ["3.7:52"]
source = """
fn main() -> i32 {
    let s: Str(64) = "hello";
    @intCast(s.len())   // 5, not 64
}
"""
exit_code = 5

# 3.7:52 — the result type is `u64` and is ordinarily type-checked: annotating
# the call with another integer type is a type mismatch at the binding. Like
# `str`, a `Str(N)` has no declared `len`, so until inference published the
# `u64` result the call typed as the error type, unified with the annotation,
# and reached CFG verification as a u64 value in an i32 slot (RUE-1679).
[[case]]
name = "str_fixed_len_result_is_u64_and_is_type_checked"
spec = ["3.7:52"]
compile_fail = true
error_contains = "expected i32, found u64"
source = """
fn main() -> i32 {
    let s: Str(16) = "hello";
    let n: i32 = s.len();
    n
}
"""

# 3.7:52 — the control: the exact `u64` annotation of the same call is accepted.
[[case]]
name = "str_fixed_len_binds_to_u64"
spec = ["3.7:52"]
source = """
fn main() -> i32 {
    let s: Str(16) = "hello";
    let n: u64 = s.len();
    @intCast(n)
}
"""
exit_code = 5

# 3.7:53 — `s[i]` is the i-th byte as `u8`; packed bytes, not char boundaries.
[[case]]
name = "str_fixed_byte_index"
spec = ["3.7:53"]
source = """
fn main() -> i32 {
    let s: Str(8) = "hello";
    @intCast(s[0])   // 104 ('h')
}
"""
exit_code = 104

# 3.7:53 — byte indexing sees raw UTF-8 bytes of a multibyte char.
[[case]]
name = "str_fixed_byte_index_multibyte"
spec = ["3.7:53"]
source = """
fn main() -> i32 {
    let s: Str(8) = "café";   // 5 bytes: c a f 0xC3 0xA9
    @intCast(s[3])            // 195 (0xC3)
}
"""
exit_code = 195

# 3.7:54 — an out-of-range byte index traps (exit 101).
[[case]]
name = "str_fixed_index_out_of_bounds_traps"
spec = ["3.7:54"]
source = """
fn main() -> i32 {
    let s: Str(8) = "hi";
    let b: u8 = s[5];       // 5 >= len 2
    @intCast(b)
}
"""
runtime_error = "index out of bounds"

# 3.7:55 — a `Str(N)` coerces to a `borrow str` view and is read through it
# (ADR-0043 two-types model, RUE-386). It does NOT coerce to a first-class `str`
# (that would let the buffer's bytes escape); the read interface is `borrow str`.
[[case]]
name = "str_fixed_coerces_to_borrow_str_param"
spec = ["3.7:55"]
source = """
fn len_of(borrow s: str) -> u64 {
    s.len()
}
fn first(borrow s: str) -> u8 {
    s[0]
}
fn main() -> i32 {
    let s: Str(8) = "hello";
    if len_of(borrow s) == 5 && first(borrow s) == 104 { 0 } else { 1 }
}
"""
exit_code = 0

# 3.7:59 — a `Str(N)` buffer passed to a bare first-class `str` parameter is
# rejected (E0495): the buffer's bytes would escape. Use `borrow str` instead.
[[case]]
name = "str_fixed_to_first_class_str_param_rejected"
spec = ["3.7:59"]
source = """
fn len_of(s: str) -> u64 {
    s.len()
}
fn main() -> i32 {
    let s: Str(8) = "hello";
    @intCast(len_of(s))
}
"""
compile_fail = true
error_contains = "first-class `str`"

# 3.7:10 / 4.3:3 — fixed string equality is byte-content equality, not
# structural equality over the compiler's representation.
[[case]]
name = "str_fixed_equality_compares_byte_content"
spec = ["3.7:10", "4.3:3"]
source = """
fn choose(c: bool) -> Str(8) {
    if c { "hello" } else { "world" }
}
fn main() -> i32 {
    let s: Str(8) = "hello";
    if s == choose(true) { 0 } else { 1 }
}
"""
exit_code = 0

# 3.7:60 — a `Str(N)` value converts only to a `borrow str` / `inout str` view,
# never to the other buffer type. A `StrBuf` parameter has a different layout
# (a three-word growable header against the two-word fixed view), so accepting
# the argument let the callee read and write through the wrong offsets and a
# `push` wrote into the literal's read-only bytes (RUE-2211). The mismatch is
# E0206 in every parameter mode, exactly as a struct-field initializer reports.
[[case]]
name = "str_fixed_to_strbuf_inout_param_rejected"
spec = ["3.7:60"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn grow(inout x: StrBuf) { x.push(65); }
fn main() -> i32 {
    let mut c: Str(8) = "hello!!";
    grow(inout c);
    @intCast(c.len())
}
"""
compile_fail = true
error_contains = ["E0206", "expected StrBuf, found Str(8)"]

[[case]]
name = "str_fixed_to_strbuf_borrow_param_rejected"
spec = ["3.7:60"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn length(borrow x: StrBuf) -> u64 { x.len() }
fn main() -> i32 {
    let c: Str(8) = "hello!!";
    @intCast(length(borrow c))
}
"""
compile_fail = true
error_contains = ["E0206", "expected StrBuf, found Str(8)"]

[[case]]
name = "str_fixed_to_strbuf_value_param_rejected"
spec = ["3.7:60"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn length(x: StrBuf) -> u64 { x.len() }
fn main() -> i32 {
    let c: Str(8) = "abcdefgh";
    @intCast(length(c))
}
"""
compile_fail = true
error_contains = ["E0206", "expected StrBuf, found Str(8)"]

# 3.7:60 — the reverse direction: a `StrBuf` is not a `Str(N)`, in a
# by-reference mode as well as by value.
[[case]]
name = "strbuf_to_str_fixed_borrow_param_rejected"
spec = ["3.7:60"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn length(borrow x: Str(8)) -> u64 { x.len() }
fn main() -> i32 {
    let b: StrBuf = "xyz";
    @intCast(length(borrow b))
}
"""
compile_fail = true
error_contains = ["E0206", "expected Str(8), found StrBuf"]

# 3.7:50 — a `Str(N)` annotation is contextual only for a string literal. An
# already-typed initializer (a `str` constant here) must have that exact type;
# the annotation is not dropped in favor of the initializer's type (RUE-2178).
[[case]]
name = "str_fixed_annotation_rejects_typed_str_initializer"
spec = ["3.7:50"]
source = """
const WORD: str = "hello";
fn main() -> i32 {
    let s: Str(1) = WORD;
    @intCast(s.len())
}
"""
compile_fail = true
error_contains = ["E0206", "expected Str(1), found str"]

# 3.7:50 — nor does one fixed capacity stand in for another (RUE-636).
[[case]]
name = "str_fixed_annotation_rejects_other_capacity"
spec = ["3.7:50"]
source = """
fn main() -> i32 {
    let c: Str(8) = "hi";
    let q: Str(4) = c;
    @intCast(q.len())
}
"""
compile_fail = true
error_contains = ["E0206", "expected Str(4), found Str(8)"]

# 3.7:50 — a fixed-string binding keeps its declared type through a runtime
# assignment and a later call, so the contextual literal path is unchanged.
[[case]]
name = "str_fixed_binding_is_the_annotated_type"
spec = ["3.7:50"]
source = """
fn length(borrow x: Str(8)) -> u64 { x.len() }
fn main() -> i32 {
    let mut c: Str(8) = "hi";
    c = "hello";
    @intCast(length(borrow c))
}
"""
exit_code = 5

# 3.7:50 — the annotation is contextual through array nesting too: each
# element literal takes the element capacity, and the elements are the
# annotated type afterwards.
[[case]]
name = "str_fixed_array_annotation_types_each_element"
spec = ["3.7:50"]
source = """
fn length(borrow x: Str(8)) -> u64 { x.len() }
fn main() -> i32 {
    let a: [Str(8); 2] = ["ab", "cde"];
    @intCast(length(borrow a[1]) + a[0].len())
}
"""
exit_code = 5

# =============================================================================
# `Str(N)` as a comptime type argument (RUE-2266)
# =============================================================================
#
# `Str(N)` names a type wherever a type value is admitted, not only in an
# annotation. 3.7:49 makes it a type parameterized by a comptime capacity, and
# 4.14:22 admits any type value as a type-constructor argument, so the
# expression `Str(4)` is a type argument exactly as `str` or `[i32; 4]` is.

# 3.7:49 / 4.14:22 — `Str(N)` is a comptime `type` argument to a plain
# comptime function.
[[case]]
name = "str_fixed_is_a_comptime_type_argument"
spec = ["3.7:49", "4.14:22"]
description = "A Str(N) spelling in expression position reduces to the fixed-string type, so it can be passed to a `comptime T: type` parameter."
source = """
fn identity(comptime T: type, x: T) -> T { x }
fn main() -> i32 {
    let s = identity(Str(4), "hi");
    @intCast(s.len())
}
"""
exit_code = 2

# 4.14:23 — the reduced `Str(N)` is an ordinary compile-time type value in
# value position, so a `let` binds it as a type alias usable as an annotation.
[[case]]
name = "str_fixed_binds_as_a_let_type_alias"
spec = ["3.7:49", "4.14:23"]
description = "`let T = Str(4);` binds a type alias, exactly as `let O = Option(i64);` does."
source = """
fn main() -> i32 {
    let T = Str(4);
    let s: T = "hi";
    @intCast(s.len())
}
"""
exit_code = 2

# 4.14:22 — a user type constructor instantiated over `Str(N)`.
[[case]]
name = "str_fixed_instantiates_a_user_constructor"
spec = ["3.7:49", "4.14:22"]
description = "A user `-> type` constructor reduces over a Str(N) argument and its field holds a fixed string."
source = """
fn Box(comptime T: type) -> type { struct { v: T } }
fn main() -> i32 {
    let b = Box(Str(4)) { v: "hi" };
    @intCast(b.v.len())
}
"""
exit_code = 2

# 4.14:22 — the standard library's generics accept `Str(N)` like any other
# type argument: construct and match an `Option(Str(4))`.
[[case]]
name = "str_fixed_instantiates_std_option"
spec = ["3.7:49", "4.14:22"]
description = "std.option.Option(Str(4)) constructs and matches, carrying the fixed string as its payload."
real_std = true
source = """
const std = @import("std");
fn main() -> i32 {
    let O = std.option.Option(Str(4));
    let v: O = O.Some("hi");
    match v { O.Some(x) => @intCast(x.len()), O.None => 0 }
}
"""
exit_code = 2

# 4.14:22 — an owning container over `Str(N)`: push values and read them back.
[[case]]
name = "str_fixed_instantiates_std_arraybuf"
spec = ["3.7:49", "4.14:22"]
description = "std.arraybuf.ArrayBuf(Str(4)) accepts pushes of fixed strings and reads their lengths back."
real_std = true
source = """
const std = @import("std");
fn main() -> i32 {
    let mut buf = std.arraybuf.ArrayBuf(Str(4)).new();
    buf.push("hi");
    buf.push("abc");
    let total = buf.get_ref(0).len() + buf.get_ref(1).len();
    buf.free();
    @intCast(total)
}
"""
exit_code = 5

# 4.14:22 — two type arguments, one of them `Str(N)`.
[[case]]
name = "str_fixed_instantiates_std_result"
spec = ["3.7:49", "4.14:22"]
description = "std.result.Result(Str(4), i32) reduces with the fixed string in the Ok position."
real_std = true
source = """
const std = @import("std");
fn main() -> i32 {
    let R = std.result.Result(Str(4), i32);
    let r: R = R.Ok("hey");
    match r { R.Ok(v) => @intCast(v.len()), R.Err(e) => -e }
}
"""
exit_code = 3
