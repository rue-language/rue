[[case]]
name = "runtime_nan_sign_is_implementation_defined_but_definite"
spec = ["3.12:44"]
description = "A produced NaN has some sign on every target — @total_cmp against a number is never zero — and formatting and equality ignore it"
source = """
fn f(v: f64) -> f64 { v }

fn main() -> i32 {
    let zero: f64 = f(0.0);
    let n: f64 = zero / zero;
    let side: i32 = @total_cmp(n, zero);
    @dbg(side < 0 || side > 0);
    @dbg(n);
    @dbg(-n);
    @dbg(n == n);
    0
}
"""
expected_stdout = """
true
NaN
NaN
false
"""
exit_code = 0

