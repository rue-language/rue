[[case]]
name = "comptime_float_arithmetic_evaluates_at_the_operation_width"
spec = ["3.12:46"]
description = "The same written expression evaluates at f32 in one const and at f64 in the other; a literal-only comptime block is f64"
source = """
const THIRD_32: f32 = 1.0 / 3.0;
const THIRD_64: f64 = 1.0 / 3.0;
const ORDERED: bool = 1.0 < 2.0;

fn main() -> i32 {
    @dbg(THIRD_32);
    @dbg(THIRD_64);
    @dbg(ORDERED);
    @dbg(comptime { 0.1 + 0.2 });
    0
}
"""
expected_stdout = """
0.33333334
0.3333333333333333
true
0.30000000000000004
"""
exit_code = 0

[[case]]
name = "comptime_float_result_matches_the_runtime_result"
spec = ["3.12:47"]
description = "A const and the same computation at run time agree bit for bit, infinities and zero signs included"
source = """
const SUM: f64 = 0.1 + 0.2;
const OVER: f64 = 1e308 * 10.0;
const NEG_ZERO: f64 = -0.0;

fn f(v: f64) -> f64 { v }

fn main() -> i32 {
    @dbg(SUM == f(0.1) + 0.2);
    @dbg(OVER == f(1e308) * 10.0);
    @dbg(@total_cmp(NEG_ZERO, -f(0.0)));
    @dbg(OVER);
    0
}
"""
expected_stdout = """
true
true
0
inf
"""
exit_code = 0

