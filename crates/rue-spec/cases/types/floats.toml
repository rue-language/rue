# =============================================================================
# The rules survive optimization
#
# Constant folding compares constants as raw stored bits and rewrites
# `x * 0` to zero, both of which answer float questions backwards: a NaN is
# bitwise equal to itself, `-0.0` and `+0.0` differ bitwise, and `inf * 0.0`
# is a NaN. These cases run at -O1 so the folds are enabled.
# =============================================================================

[[case]]
name = "nan_and_zero_comparisons_survive_constant_folding"
spec = ["3.12:27", "3.12:28"]
opt_level = 1
description = "With both operands compile-time constants and the optimizer on, NaN is still unequal to itself and -0.0 is still equal to 0.0"
source = """
const NAN: f64 = 0.0 / 0.0;
const NEG_ZERO: f64 = -0.0;
const POS_ZERO: f64 = 0.0;

fn main() -> i32 {
    let a: f64 = NAN;
    let b: f64 = NAN;
    @dbg(a == b);
    @dbg(a != b);
    let c: f64 = NEG_ZERO;
    let d: f64 = POS_ZERO;
    @dbg(c == d);
    @dbg(c != d);
    0
}
"""
expected_stdout = """
false
true
true
false
"""
exit_code = 0

[[case]]
name = "float_multiplication_by_zero_survives_constant_folding"
spec = ["3.12:21"]
opt_level = 1
description = "With the optimizer on, `inf * 0.0` is still a NaN and a negative operand times zero is still a negative zero"
source = """
const INF: f64 = 1.0 / 0.0;

fn main() -> i32 {
    let a: f64 = INF;
    @dbg(a * 0.0);
    let neg: f64 = -1.0;
    @dbg(neg * 0.0);
    0
}
"""
expected_stdout = """
NaN
-0.0
"""
exit_code = 0
