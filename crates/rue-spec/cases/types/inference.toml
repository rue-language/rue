[section]
id = "types.inference"
spec_chapter = "3.11"
name = "Type Inference"
description = "Local constraint-based type inference: locality, the constraint model, expected-type propagation, compatibility, and comptime interaction"

# =============================================================================
# 3.11:2 — Locality: annotations required at function/const boundaries
# =============================================================================
# Inference runs per function body; nothing crosses a boundary, so parameters,
# return types, and value constants must be annotated. A `let` may be inferred.

[[case]]
name = "let_may_omit_annotation"
spec = ["3.11:2"]
source = """
fn main() -> i32 {
    let a = 1;
    let b = a + 2;
    b
}
"""
exit_code = 3

[[case]]
name = "param_requires_annotation"
spec = ["3.11:2"]
compile_fail = true
error_contains = ["E0100"]
source = """
fn f(x) -> i32 { x }
fn main() -> i32 { f(1) }
"""

[[case]]
name = "value_const_requires_annotation"
spec = ["3.11:2"]
compile_fail = true
error_contains = ["E0475"]
source = """
const K = 5;
fn main() -> i32 { K }
"""

# =============================================================================
# 3.11:4 — Constraint model: whole-body solve, order-independent
# =============================================================================
# An unannotated literal unifies with every use; a single non-i32 use fixes it,
# and conflicting uses are rejected regardless of textual order.

[[case]]
name = "constraint_solve_use_before_source"
spec = ["3.11:4"]
source = """
fn takes_i64(v: i64) -> i64 { v }
fn main() -> i32 {
    let c = 7;
    let d = takes_i64(c);
    if d == 7 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "constraint_conflict_order_independent"
spec = ["3.11:4"]
compile_fail = true
error_contains = ["E0206", "type mismatch"]
source = """
fn takes_i32(v: i32) -> i32 { v }
fn takes_i64(v: i64) -> i64 { v }
fn main() -> i32 {
    let c = 7;
    takes_i64(c);
    takes_i32(c);
    0
}
"""

# =============================================================================
# 3.11:6 — Expected-type (bidirectional) propagation
# =============================================================================
# An expected type flows inward; a literal in that position takes it rather than
# defaulting. Element values that only fit i64 prove the annotation reached them.

[[case]]
name = "expected_type_array_element"
spec = ["3.11:6"]
source = """
fn main() -> i32 {
    let a: [i64; 3] = [1, 2, 3000000000];
    if a[2] == 3000000000 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "expected_type_return_position"
spec = ["3.11:6"]
source = """
fn big() -> i64 { 5000000000 }
fn main() -> i32 {
    let x: i64 = big();
    if x == 5000000000 { 0 } else { 1 }
}
"""
exit_code = 0

# =============================================================================
# 3.11:8 — Compatibility: no implicit conversion between concrete int types
# =============================================================================

[[case]]
name = "no_implicit_int_widening"
spec = ["3.11:8"]
compile_fail = true
error_contains = ["E0206", "type mismatch"]
source = """
fn takes_i64(v: i64) -> i64 { v }
fn main() -> i32 {
    let x: i32 = 5;
    takes_i64(x);
    0
}
"""

# =============================================================================
# 3.11:9 — The never type is the only coercion applied during inference
# =============================================================================

[[case]]
name = "never_coerces_in_expected_position"
spec = ["3.11:9"]
source = """
fn diverge() -> ! { loop {} }
fn main() -> i32 {
    let x: i32 = if true { 0 } else { diverge() };
    x
}
"""
exit_code = 0

# =============================================================================
# 3.11:11 — Comptime type-parameter substitution feeds argument inference
# =============================================================================
# T is substituted with i64 before the argument is inferred, so a literal that
# does not fit i32 is accepted at the type-parameterized position.

[[case]]
name = "comptime_type_param_arg_inference"
spec = ["3.11:11"]
source = """
fn identity(comptime T: type, x: T) -> T { x }
fn main() -> i32 {
    let r: i64 = identity(i64, 3000000000);
    if r == 3000000000 { 0 } else { 1 }
}
"""
exit_code = 0

# Local annotations resolved by semantic analysis (RUE-2209).

[[case]]
name = "local_annotation_generic_move_mismatch"
spec = ["3.11:8", "4.14:16"]
compile_fail = true
error_contains = ["E0206", "expected Val, found Other"]
source = """
struct Val { n: i64 }
struct Other { m: i32 }

fn f(comptime T: type, y: Other) -> i32 { let z: T = y; 0 }
fn main() -> i32 { f(Val, Other { m: 2 }) }
"""

[[case]]
name = "local_annotation_generic_temporary_mismatch"
spec = ["3.11:8", "4.14:16"]
compile_fail = true
error_contains = ["E0206", "expected i64, found Other"]
source = """
struct Val { n: i64 }
struct Other { m: i32 }

fn f(comptime T: type) -> i32 { let z: T = Other { m: 2 }; 0 }
fn main() -> i32 { f(i64) }
"""

[[case]]
name = "local_annotation_generic_mut_call_mismatch"
spec = ["3.11:8", "4.14:16"]
compile_fail = true
error_contains = ["E0206", "expected Val, found Other"]
source = """
struct Val { n: i64 }
struct Other { m: i32 }

fn make() -> Other { Other { m: 2 } }
fn f(comptime T: type) -> i32 { let mut z: T = make(); 0 }
fn main() -> i32 { f(Val) }
"""

[[case]]
name = "local_annotation_generic_array_mismatch"
spec = ["3.11:8", "4.14:16"]
compile_fail = true
error_contains = ["E0206"]
source = """
struct Val { n: i64 }
struct Other { m: i32 }

fn f(comptime T: type, y: [Other; 1]) -> i32 { let z: [T; 1] = y; 0 }
fn main() -> i32 { f(Val, [Other { m: 2 }]) }
"""

[[case]]
name = "local_annotation_wildcard_mismatch"
spec = ["3.11:8", "4.14:16"]
compile_fail = true
error_contains = ["E0206", "expected Val, found Other"]
source = """
struct Val { n: i64 }
struct Other { m: i32 }

fn f(comptime T: type, y: Other) -> i32 { let _: T = y; 0 }
fn main() -> i32 { f(Val, Other { m: 2 }) }
"""

[[case]]
name = "local_annotation_constructor_enum_mismatch"
spec = ["3.11:8", "4.14:21"]
compile_fail = true
error_contains = ["E0206"]
source = """
fn E1(comptime T: type) -> type { enum { A(T), B } }
fn E2(comptime T: type) -> type { enum { A(T), B } }
fn main() -> i32 {
    let x = E1(i32).A(42);
    let y: E2(i32) = x;
    0
}
"""

[[case]]
name = "local_annotation_constructor_struct_mismatch"
spec = ["3.11:8", "4.14:16"]
compile_fail = true
error_contains = ["E0206"]
source = """
fn S(comptime T: type) -> type { struct { v: T } }
fn main() -> i32 {
    let S32 = S(i32);
    let x = S32 { v: 1 };
    let y: S(i64) = x;
    0
}
"""

[[case]]
name = "local_annotation_distinct_bounded_parameters"
spec = ["3.11:8", "6.8:19"]
preview = "interfaces"
preview_should_pass = true
compile_fail = true
error_contains = ["E0206", "expected T, found U"]
source = """
interface Show { fn show(borrow self) -> i64; }
struct Val is Show { n: i64, fn show(borrow self) -> i64 { self.n } }
fn f(comptime T: Show, comptime U: Show, x: T, y: U) -> i64 {
    let z: T = y;
    z.show()
}
fn main() -> i32 { @intCast(f(Val, Val, Val { n: 1 }, Val { n: 2 })) }
"""

[[case]]
name = "local_annotation_generic_literals_and_nested_scope"
spec = ["3.11:6", "4.14:16"]
expected_stdout = "3000000001\n"
exit_code = 0
source = """
fn f(comptime T: type) -> i32 {
    let result = {
        let x: T = 3000000000 + 1;
        @dbg(x);
        0
    };
    result
}
fn main() -> i32 { f(i64) }
"""

[[case]]
name = "local_annotation_constructor_diverging_initializer"
spec = ["3.11:9", "4.14:16"]
exit_code = 0
source = """
fn Box(comptime T: type) -> type { struct { value: T } }
fn main() -> i32 {
    let boxed: Box(i32) = { return 0; };
    1
}
"""

[[case]]
name = "local_annotation_specialized_array_length_mismatch"
spec = ["3.11:8", "4.14:16"]
compile_fail = true
error_contains = ["E0901", "expected array of 2 elements, found 3 elements"]
source = """
fn head(comptime N: i32) -> i32 {
    let y: [i32; N] = [7, 7, 7];
    y[0]
}
fn main() -> i32 { head(2) }
"""

[[case]]
name = "local_annotation_alias_scope_is_restored"
spec = ["3.11:6", "4.14:16"]
source = """
fn Box(comptime T: type) -> type { struct { value: T } }
fn main() -> i32 {
    let U = i64;
    let ignored = {
        let U = i32;
        let inner: U = 7;
        @dbg(inner);
        0
    };
    let outer: U = 3000000000;
    let boxed = Box(U) { value: 3000000000 };
    @dbg(outer);
    @dbg(boxed.value);
    ignored
}
"""
expected_stdout = "7\n3000000000\n3000000000\n"
exit_code = 0
