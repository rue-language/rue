linear struct MustUse { value: i64 }

fn consume(m: MustUse) -> i64 { m.value }

fn parse_two(s: str) -> std.option.Option(i64) {
    let O = std.option.Option(i64);
    let m = MustUse { value: 5 };
    let n = @parse_i64(s)?;
    let v = consume(m);
    O.Some(n + v)
}

fn main() -> i32 {
    let O = std.option.Option(i64);
    match parse_two("37") {
        O.Some(n) => @intCast(n),
        O.None => 1,
    }
}
"""
