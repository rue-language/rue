# The `str` string type (ADR-0043 Phase 3, RUE-324).
#
# `str` is `[u8]` + the UTF-8 byte-string convention: a read-only two-word view
# `{ptr, len}`. StrBuf literals have type `str` where a `str` is expected, are
# static-backed (bytes in .rodata), and are first-class (Copy, storable,
# reassignable, returnable). `.len()` is the byte length; `s[i]` is the i-th
# byte as `u8`, bounds-checked (an out-of-range index traps, exit 101).
#
# Stable. Deferred to later phases: `str`
# concatenation, ordering comparison, `str`<->`StrBuf` interop, methods beyond
# `.len()`/index, and char iteration.

[section]
id = "types.str_type"
spec_chapter = "3.7"
name = "The str Type"
description = "str is the read-only [u8] byte-string slice with static-backed first-class literals."

# 3.7:43 — `str` is a resolvable type.
[[case]]
name = "str_type_is_stable"
spec = ["3.7:43"]
source = """
fn main() -> i32 {
    let s: str = "hello";
    0
}
"""
exit_code = 0

# 3.7:43 / 3.7:44 — a string literal has type `str` where a `str` is expected,
# static-backed and storable in a binding.
[[case]]
name = "str_literal_binding"
spec = ["3.7:43", "3.7:44"]
source = """
fn main() -> i32 {
    let s: str = "hello";
    0
}
"""
exit_code = 0

# 3.7:44 — without an expected buffer type, a literal defaults to first-class
# `str`; its Copy value remains reusable after assignment.
[[case]]
name = "str_literal_unconstrained_default_is_copy_str"
spec = ["3.7:44"]
source = """
fn main() -> i32 {
    let s = if true { "hello" } else { "goodbye" };
    let first = s;
    let second = s;
    @intCast(first.len() + second.len())
}
"""
exit_code = 10

# 3.7:44 — an explicit legacy growable-buffer expectation still
# contextualizes the literal as StrBuf.
[[case]]
name = "str_literal_explicit_strbuf_context"
spec = ["3.7:44"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "hello";
    @intCast(s.len())
}
"""
exit_code = 5

# 3.7:45 — `.len()` is the byte length.
[[case]]
name = "str_len_bytes"
spec = ["3.7:45"]
source = """
fn main() -> i32 {
    let s: str = "hello";
    @intCast(s.len())
}
"""
exit_code = 5

# 3.7:45 — `.len()` counts bytes, not scalars (a multibyte char).
[[case]]
name = "str_len_multibyte"
spec = ["3.7:45"]
source = """
fn main() -> i32 {
    let s: str = "café";   // 5 bytes ('é' is 2 bytes)
    @intCast(s.len())
}
"""
exit_code = 5

# 3.7:45 — the result type is `u64`, and it takes part in ordinary type
# checking: an annotation of another integer type is a plain type mismatch at
# the binding, not a value that flows on unchecked. `str` has no *declared*
# `len` (the call reads the view's `len` word), so until inference published
# the `u64` result the call typed as the error type, unified with any
# annotation, and reached CFG verification as a u64 value in an i32 slot —
# reported as an internal error (RUE-1679, the RUE-1611 class on `str`).
[[case]]
name = "str_len_result_is_u64_and_is_type_checked"
spec = ["3.7:45"]
compile_fail = true
error_contains = "expected i32, found u64"
source = """
fn main() -> i32 {
    let s: str = "hello";
    let n: i32 = s.len();
    n
}
"""

# 3.7:45 — the same rule holds for a literal receiver, whose text type is still
# contextual when the method is looked up: `.len()` is `u64` on every text type
# the literal could settle on.
[[case]]
name = "str_literal_len_result_is_u64_and_is_type_checked"
spec = ["3.7:45"]
compile_fail = true
error_contains = "expected i32, found u64"
source = """
fn main() -> i32 {
    let n: i32 = "hello".len();
    n
}
"""

# 3.7:45 — the control: a `u64` binding of the same call is exact, and an
# explicit conversion is how the length reaches a narrower type.
[[case]]
name = "str_len_binds_to_u64_and_converts_explicitly"
spec = ["3.7:45"]
source = """
fn main() -> i32 {
    let s: str = "hello";
    let n: u64 = s.len();
    @intCast(n)
}
"""
exit_code = 5

# 3.7:46 — `s[i]` is the i-th byte as `u8`.
[[case]]
name = "str_byte_index"
spec = ["3.7:46"]
source = """
fn main() -> i32 {
    let s: str = "hello";
    @dbg(s[0]);   // 104 'h'
    @dbg(s[1]);   // 101 'e'
    @dbg(s[4]);   // 111 'o'
    0
}
"""
exit_code = 0
expected_stdout = "104\n101\n111\n"

# 3.7:46 — byte indexing sees raw bytes, not char boundaries.
[[case]]
name = "str_byte_index_multibyte"
spec = ["3.7:46"]
source = """
fn main() -> i32 {
    let s: str = "café";   // 'c' 'a' 'f' 0xC3 0xA9
    @dbg(s[3]);   // 195 (0xC3)
    @dbg(s[4]);   // 169 (0xA9)
    0
}
"""
exit_code = 0
expected_stdout = "195\n169\n"

# 3.7:47 — an out-of-bounds byte index traps (exit 101).
[[case]]
name = "str_byte_index_oob_traps"
spec = ["3.7:47"]
source = """
fn main() -> i32 {
    let s: str = "hi";
    let b: u8 = s[9];
    @intCast(b)
}
"""
runtime_error = "index out of bounds"

# 3.7:44 — a literal `str` is first-class: passable as a `str` argument.
[[case]]
name = "str_first_class_param"
spec = ["3.7:44"]
source = """
fn first(s: str) -> u8 {
    s[0]
}
fn main() -> i32 {
    @intCast(first("hello"))
}
"""
exit_code = 104

# 3.7:44 — a literal `str` is first-class: returnable from a function.
[[case]]
name = "str_first_class_return"
spec = ["3.7:44"]
source = """
fn greeting() -> str {
    "hello"
}
fn main() -> i32 {
    let s: str = greeting();
    @intCast(s.len())
}
"""
exit_code = 5

# 3.7:44 — a literal `str` is first-class: storable in a struct field.
[[case]]
name = "str_first_class_struct_field"
spec = ["3.7:44"]
source = """
struct Named { label: str }
fn main() -> i32 {
    let n: Named = Named { label: "hey" };
    @intCast(n.label.len())
}
"""
exit_code = 3

# 3.7:44 — a `str` is `@copy` and reassignable.
[[case]]
name = "str_first_class_reassign"
spec = ["3.7:44"]
source = """
fn main() -> i32 {
    let mut s: str = "hello";
    s = "hi";
    @intCast(s.len())
}
"""
exit_code = 2

# 3.7:10 / 4.3:3 — `str` equality is byte-content equality, not pointer+len
# structural equality. The returned literal may occupy a distinct rodata slot.
[[case]]
name = "str_equality_compares_byte_content"
spec = ["3.7:10", "4.3:3"]
source = """
fn choose(c: bool) -> str {
    if c { "hello" } else { "world" }
}
fn main() -> i32 {
    let s: str = "hello";
    if s == choose(true) { 0 } else { 1 }
}
"""
exit_code = 0

# 3.7:10 / 4.3:3 — `str != str` is the inverse of byte-content equality.
[[case]]
name = "str_inequality_compares_byte_content"
spec = ["3.7:10", "4.3:3"]
source = """
fn choose(c: bool) -> str {
    if c { "hello" } else { "world" }
}
fn main() -> i32 {
    let s: str = "hello";
    if s != choose(false) { 0 } else { 1 }
}
"""
exit_code = 0

# ============================================================================
# Two-types string model (ADR-0043, RUE-386): first-class `str` vs. views.
# ============================================================================

# 3.7:58 — a `borrow str` view reads a buffer's bytes through the `str`
# interface (`.len()`, indexing) and may be re-borrowed. A `Str(N)` source is
# used because it shares the static-backed 2-word representation of `str`.
[[case]]
name = "borrow_str_view_reads_and_reborrows"
spec = ["3.7:58"]
source = """
fn inner(borrow s: str) -> u64 {
    s.len()
}
fn outer(borrow s: str) -> u64 {
    inner(borrow s)          // re-borrow is allowed
}
fn main() -> i32 {
    let s: Str(8) = "hello";
    @intCast(outer(borrow s))
}
"""
exit_code = 5

# 3.7:58 — the same view semantics with a heap `StrBuf` source: the call-site
# coercion narrows the 3-word `{ptr, len, cap}` buffer header to the 2-word
# `{ptr, len}` view, so `.len()` reads the length (not the capacity) and byte
# indexing reads the data (RUE-559: the raw header used to be passed through,
# so `.len()` returned the capacity and indexing dereferenced the length).
# The buffer is borrowed, not moved: it remains usable after the call.
[[case]]
name = "borrow_str_view_of_strbuf_reads_values"
spec = ["3.7:58"]
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn view_len(borrow s: str) -> u64 {
    s.len()
}
fn first_byte(borrow s: str) -> u8 {
    s[0]
}
fn main() -> i32 {
    let left: StrBuf = "xx";
    let right: StrBuf = "yy";
    let b = left + right;                         // heap-backed StrBuf, len 4
    let len_ok = view_len(borrow b) == 4;       // len, not cap
    let byte_ok = first_byte(borrow b) == 120;  // 'x'
    let still_usable = b.len() == 4;            // borrowed, not moved
    if len_ok && byte_ok && still_usable { 42 } else { 0 }
}
"""
exit_code = 42

# 3.7:59 — a borrowed `str` view laundered into a first-class `str` (returned)
# is rejected (E0497): the view is second-class and cannot escape the call.
[[case]]
name = "borrow_str_view_return_rejected"
spec = ["3.7:59"]
source = """
fn bad(borrow s: str) -> str {
    s
}
fn main() -> i32 {
    let b: Str(2) = "xy";
    let _s = bad(borrow b);
    0
}
"""
compile_fail = true
error_contains = "E0497"

# 3.7:59 — a borrowed `str` view stored in a struct field is rejected (E0497).
[[case]]
name = "borrow_str_view_struct_field_rejected"
spec = ["3.7:59"]
source = """
struct Keep { s: str }
fn bad(borrow s: str) -> Keep {
    Keep { s: s }
}
fn main() -> i32 {
    let b: Str(2) = "xy";
    let _keep = bad(borrow b);
    0
}
"""
compile_fail = true
error_contains = "E0497"

# 3.7:60 — a `StrBuf` buffer coerces to an `inout str` view (exclusive) when the
# operand is a local buffer; the view reads through the `str` interface.
[[case]]
name = "inout_str_accepts_local_buffer"
spec = ["3.7:60"]
source = """
fn take(inout s: str) -> u64 {
    s.len()
}
fn main() -> i32 {
    let mut b: Str(8) = "hello";
    @intCast(take(inout b))
}
"""
exit_code = 5

# 6.1:35 — an inout parameter may be forwarded to another inout parameter.
# An `inout str` parameter is already an exclusive view of caller-owned local
# storage, not a first-class/static `str` that should trigger E0496.
[[case]]
name = "inout_str_view_can_be_forwarded"
spec = ["3.7:58", "3.7:60", "6.1:35"]
source = """
fn inner(inout s: str) -> u64 {
    s.len()
}
fn outer(inout s: str) -> u64 {
    inner(inout s)
}
fn main() -> i32 {
    let mut s: Str(8) = "hello";
    @intCast(outer(inout s))
}
"""
exit_code = 5

# 3.7:60 — a local that shadows an `inout str` parameter is a new first-class
# binding, not the existing exclusive view. It must not inherit the parameter's
# local provenance and bypass E0496 for static-backed `str`.
[[case]]
name = "shadowed_local_str_is_not_an_inout_view"
spec = ["3.7:60"]
source = """
fn inner(inout s: str) {}
fn outer(inout s: str) {
    let mut s: str = "static";
    inner(inout s);
}
fn main() {
    let mut buffer: Str(8) = "local";
    outer(inout buffer);
}
"""
compile_fail = true
error_contains = "E0496"

# 4.10:4 — contextual string handling is an enumerated compatibility rule,
# not permission to pass an arbitrary same-width (or unrelated) value through
# a string parameter's physical ABI. Borrow-str already rejects unrelated
# places in its view materializer; these are the three formerly open paths.
[[case]]
name = "string_param_rejects_unrelated_type_{contract}"
spec = ["4.10:4"]
description = "A string or string-view parameter rejects an unrelated value before emitting an ABI-invalid call"
source = "{source}"
compile_fail = true
error_contains = "E0206"
params = [
  { contract = "first_class_str", source = "fn take(s: str) {}\nfn main() { take(42); }" },
  { contract = "fixed_string", source = "fn take(s: Str(8)) {}\nfn main() { take(42); }" },
  { contract = "inout_str", source = "fn take(inout s: str) {}\nfn main() { let mut value = 42; take(inout value); }" },
]

# 3.7:58 — `inout str` is a second-class exclusive view. Its bytes may be
# accessed through the view, but the view binding itself cannot be rebound as
# a whole value. This also prevents a default 3-word StrBuf literal from being
# dropped/stored through a 2-word Str(N) caller allocation (RUE-641).
[[case]]
name = "inout_str_view_whole_reassignment_rejected"
spec = ["3.7:58"]
source = """
fn replace(inout s: str) {
    s = "hi";
}
fn main() -> i32 {
    let mut s: Str(8) = "hello";
    replace(inout s);
    @intCast(s.len())
}
"""
compile_fail = true
error_contains = "E0210"

# 3.7:60 — a first-class / static `str` value is NOT a legal `inout str` operand
# (E0496): an exclusive view requires local buffer provenance.
[[case]]
name = "inout_str_static_operand_rejected"
spec = ["3.7:60"]
source = """
fn take(inout s: str) {
    let _length = s.len();
}
fn main() -> i32 {
    let mut s: str = "hello";
    take(inout s);
    0
}
"""
compile_fail = true
error_contains = "E0496"
