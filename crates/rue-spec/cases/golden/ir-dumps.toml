# =============================================================================
# Backend emit stages
# =============================================================================

[[case]]
name = "simple_return_lowering"
spec = ["2.1:1"]
source = "fn main() -> i32 { 42 }"
target = "x86-64-linux"
expected_lowering = """
bb0:

  CFG: v0 = const 42 : i32
    -> mov v0, 42
    Decision: 32-bit immediate (zero-extends to 64-bit)

  Terminator: return exit
    -> mov rdi, v0
    -> call sym0
    Decision: Main function: return value becomes exit code
"""

[[case]]
name = "simple_return_stackframe"
spec = ["2.1:1"]
description = "The constant dies before the exit call, so it lives in a caller-saved register and the frame saves nothing (RUE-1146). The prologue is still emitted, because a calling function needs it to keep RSP 16-byte aligned at the call site (RUE-1195)."
source = "fn main() -> i32 { 42 }"
target = "x86-64-linux"
expected_stackframe = """
Frame size: 0 bytes
Alignment: 16 bytes

Layout (rbp-relative):

Return: rax (Type::I32)
"""

# =============================================================================
# Projected-place lowering (RUE-604)
# =============================================================================

[[case]]
name = "projected_place_mir_x86_64"
spec = ["7.1:19", "7.1:25"]
description = "Nested index+field projection pins bounds-before-address ordering, element scaling, root anchoring, and the final x86 indexed load."
source = """
struct P { a: i32, b: i32 }
fn main() -> i32 {
    let xs = [P { a: 1, b: 42 }];
    let i = 0;
    xs[i].b
}
"""
target = "x86-64-linux"
expected_mir = """
function main:
    mov v0, 1
    mov v1, 42
    mov v2, v0
    mov v3, 0
    mov [rbp-16], v0
    mov [rbp-8], v1
    mov v4, 0
    mov [rbp-24], v4
    mov v5, [rbp-24]
    mov v7, 1
    cmpq v5, v7
    jb .L0
    call __rue_bounds_check
    .L0:
    mov v9, v5
    mov v10, 16
    imulq v9, v10
    lea v11, [rbp-8]
    addq v11, v9
    mov v6, [v11]
    mov rdi, v6
    call __rue_exit
"""

[[case]]
