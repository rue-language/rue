[section]
id = "golden.ir-dumps"
spec_chapter = "A.1"
name = "IR Dumps"
description = "Golden tests for intermediate representation dumps."

# =============================================================================
# Tokens
# =============================================================================

[[case]]
name = "simple_return_tokens"
spec = ["2.1:1"]
source = "fn main() -> i32 { 42 }"
expected_tokens = """
   0..2    FN
   3..7    IDENT(sym:0)
   7..8    LPAREN
   8..9    RPAREN
  10..12   ARROW
  13..16   TYPE(i32)
  17..18   LBRACE
  19..21   INT(42)
  22..23   RBRACE
  23..23   EOF
"""

[[case]]
name = "binary_expr_tokens"
spec = ["2.1:1"]
source = "fn main() -> i32 { 1 + 2 }"
expected_tokens = """
   0..2    FN
   3..7    IDENT(sym:0)
   7..8    LPAREN
   8..9    RPAREN
  10..12   ARROW
  13..16   TYPE(i32)
  17..18   LBRACE
  19..20   INT(1)
  21..22   PLUS
  23..24   INT(2)
  25..26   RBRACE
  26..26   EOF
"""

