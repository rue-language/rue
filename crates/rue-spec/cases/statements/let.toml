[section]
id = "statements.let"
spec_chapter = "5.1"
name = "Let Statements"
description = "Local variable bindings with let. Variables are immutable by default; use 'let mut' for mutable bindings."

# =============================================================================
# Basic Let Bindings
# =============================================================================

[[case]]
name = "let_simple"
spec = ["5.1:1", "5.1:7"]
source = """
fn main() -> i32 {
    let x = 42;
    x
}
"""
exit_code = 42

[[case]]
name = "let_{variant}"
spec = ["5.1:1"]
source = """
fn main() -> i32 {
    {body}
}
"""
params = [
  { variant = "with_expression", body = "let x = 1 + 2; x", exit_code = 3 },
  { variant = "multiple", body = "let x = 10; let y = 20; x + y", exit_code = 30 },
  { variant = "chained", body = "let x = 10; let y = x + 5; let z = y * 2; z", exit_code = 30 },
  { variant = "negation", body = "let x = -5; let y = -x; y", exit_code = 5 },
]

[[case]]
name = "let_complex_expression"
spec = ["5.1:1"]
source = """
fn main() -> i32 {
    let result = (1 + 2) * (3 + 4);
    result
}
"""
exit_code = 21

# =============================================================================
# Shadowing
# =============================================================================

[[case]]
name = "let_shadow_{variant}"
spec = ["5.1:2", "5.1:10"]
source = """
fn main() -> i32 {
    {body}
}
"""
params = [
  { variant = "basic", body = "let x = 1; let x = 2; x", exit_code = 2 },
  { variant = "uses_previous", body = "let x = 10; let x = x + 5; x", exit_code = 15, spec_extra = ["5.1:12"] },
  { variant = "multiple_refs", body = "let x = 5; let x = x + x; x", exit_code = 10, spec_extra = ["5.1:12"] },
  { variant = "chained", body = "let x = 1; let x = x + 1; let x = x + 1; let x = x + 1; x", exit_code = 4, spec_extra = ["5.1:12"] },
]

[[case]]
name = "let_shadow_complex_init_expr"
spec = ["5.1:12"]
source = """
fn main() -> i32 {
    let x = 3;
    let x = x * (x + 1);
    x
}
"""
exit_code = 12

[[case]]
name = "let_shadow_different_type"
spec = ["5.1:10", "5.1:11"]
source = """
fn main() -> i32 {
    let x = true;
    let x: i32 = 42;
    x
}
"""
exit_code = 42

[[case]]
name = "let_shadow_in_fn_call"
spec = ["5.1:12"]
source = """
fn add(a: i32, b: i32) -> i32 {
    a + b
}
fn main() -> i32 {
    let x = 10;
    let x = add(x, 5);
    x
}
"""
exit_code = 15

# =============================================================================
# Type Annotations
# =============================================================================

[[case]]
name = "let_with_type_{variant}"
spec = ["5.1:3", "5.1:8"]
source = """
fn main() -> i32 {
    {body}
}
"""
params = [
  { variant = "simple", body = "let x: i32 = 42; x", exit_code = 42 },
  { variant = "expression", body = "let x: i32 = 10 + 20; x", exit_code = 30 },
  { variant = "multiple", body = "let a: i32 = 5; let b: i32 = 7; a + b", exit_code = 12 },
]

# =============================================================================
# Mutable Variables
# =============================================================================

[[case]]
name = "let_mut_{variant}"
spec = ["5.1:4", "5.1:5"]
source = """
fn main() -> i32 {
    {body}
}
"""
params = [
  { variant = "simple", body = "let mut x = 10; x = 20; x", exit_code = 20 },
  { variant = "increment", body = "let mut x = 5; x = x + 1; x", exit_code = 6 },
  { variant = "multiple_assigns", body = "let mut x = 1; x = 2; x = 3; x = 4; x", exit_code = 4 },
  { variant = "with_type", body = "let mut x: i32 = 10; x = 20; x", exit_code = 20, spec_extra = ["5.1:3"] },
]

[[case]]
name = "let_mut_complex"
spec = ["5.1:4"]
source = """
fn main() -> i32 {
    let mut sum = 0;
    let a = 10;
    let b = 20;
    sum = sum + a;
    sum = sum + b;
    sum
}
"""
exit_code = 30

[[case]]
name = "let_mut_and_immutable"
spec = ["5.1:1", "5.1:4"]
source = """
fn main() -> i32 {
    let x = 10;
    let mut y = 5;
    y = y + x;
    y
}
"""
exit_code = 15

[[case]]
name = "let_mut_shadow_{variant}"
spec = ["5.1:2", "5.1:4"]
source = """
fn main() -> i32 {
    {body}
}
"""
params = [
  { variant = "mut_to_mut", body = "let mut x = 1; let mut x = 2; x = 3; x", exit_code = 3 },
  { variant = "mut_to_immut", body = "let mut x = 1; x = 10; let x = 42; x", exit_code = 42 },
  { variant = "immut_to_mut", body = "let x = 10; let mut x = x; x = x + 5; x", exit_code = 15 },
]

# =============================================================================
# Statements and Final Expression
# =============================================================================

[[case]]
name = "assignment_is_statement"
spec = ["5.2:1"]
source = """
fn main() -> i32 {
    let mut x = 5;
    x = 10;
    x
}
"""
exit_code = 10

# =============================================================================
# Whitespace and Formatting
# =============================================================================

[[case]]
name = "let_formatting_{variant}"
spec = ["5.1:1"]
source = "{source}"
params = [
  { variant = "single_line", source = "fn main() -> i32 { let x = 42; x }", exit_code = 42 },
  { variant = "compact", source = "fn main() -> i32 { let x=1+2; x }", exit_code = 3 },
]

[[case]]
name = "let_extra_whitespace"
spec = ["5.1:1"]
source = """
fn main() -> i32 {
    let    x   =   10   ;
    x
}
"""
exit_code = 10

[[case]]
name = "let_with_comments"
spec = ["5.1:1"]
source = """
fn main() -> i32 {
    // declare x
    let x = 42;  // the answer
    x  // return it
}
"""
exit_code = 42

# =============================================================================
# Edge Cases
# =============================================================================

[[case]]
name = "let_edge_{variant}"
spec = ["5.1:1"]
source = """
fn main() -> i32 {
    let x = {value};
    {expr}
}
"""
params = [
  { variant = "zero", value = "0", expr = "x", exit_code = 0 },
  { variant = "negative", value = "-1", expr = "x", exit_code = 255 },
  { variant = "max_i32", value = "2147483647", expr = "x", exit_code = 255 },
  { variant = "unused", value = "42", expr = "0", exit_code = 0 },
]

[[case]]
name = "many_variables"
spec = ["5.1:1"]
source = """
fn main() -> i32 {
    let a = 1;
    let b = 2;
    let c = 3;
    let d = 4;
    let e = 5;
    a + b + c + d + e
}
"""
exit_code = 15

# =============================================================================
# Variable Names
# =============================================================================

[[case]]
name = "variable_name_{variant}"
spec = ["5.1:1"]
source = """
fn main() -> i32 {
    {body}
}
"""
params = [
  { variant = "underscore_prefix", body = "let _x = 42; _x", exit_code = 42 },
  { variant = "underscore_only", body = "let _ = 42; 0", exit_code = 0, spec_extra = ["2.1:12"] },
  { variant = "long", body = "let my_very_long_variable_name = 42; my_very_long_variable_name", exit_code = 42 },
  { variant = "with_numbers", body = "let x1 = 10; let x2 = 20; x1 + x2", exit_code = 30 },
  { variant = "mixed_case", body = "let myVar = 42; myVar", exit_code = 42 },
]

# =============================================================================
# Block Scoping
# =============================================================================

[[case]]
name = "nested_block_{variant}"
spec = ["4.5:1"]
source = """
fn main() -> i32 {
    {body}
}
"""
params = [
  { variant = "simple", body = "let x = 10; { 20 }", exit_code = 20 },
  { variant = "uses_outer", body = "let x = 10; { x + 5 }", exit_code = 15 },
  { variant = "as_expression", body = "{ 42 }", exit_code = 42 },
  { variant = "with_arithmetic", body = "{ 10 + 20 + 12 }", exit_code = 42 },
  { variant = "in_expression", body = "1 + { 2 } + 3", exit_code = 6 },
]

[[case]]
name = "block_scoped_variable"
spec = ["4.5:1", "5.1:2"]
source = """
fn main() -> i32 {
    let x = 1;
    let y = {
        let x = 10;
        x + 5
    };
    x + y
}
"""
exit_code = 16

[[case]]
name = "block_scoped_shadow_restored"
spec = ["4.5:1", "5.1:2"]
source = """
fn main() -> i32 {
    let x = 42;
    let _unused = {
        let x = 100;
        x
    };
    x
}
"""
exit_code = 42

[[case]]
name = "nested_block_with_statements"
spec = ["4.5:1"]
source = """
fn main() -> i32 {
    let outer = 10;
    let result = {
        let inner = 20;
        outer + inner
    };
    result
}
"""
exit_code = 30

[[case]]
name = "deeply_nested_blocks"
spec = ["4.5:1"]
source = """
fn main() -> i32 {
    let a = 1;
    {
        let b = 2;
        {
            let c = 3;
            a + b + c
        }
    }
}
"""
exit_code = 6

[[case]]
name = "sequential_blocks"
spec = ["4.5:1"]
source = """
fn main() -> i32 {
    let a = { 10 };
    let b = { 20 };
    a + b
}
"""
exit_code = 30

[[case]]
name = "block_with_mutable_outer"
spec = ["4.5:1", "5.1:4"]
source = """
fn main() -> i32 {
    let mut x = 0;
    x = {
        let inner = 42;
        inner
    };
    x
}
"""
exit_code = 42

# =============================================================================
# Parameter shadowing (5.1:14) — RUE-299
# =============================================================================

[[case]]
name = "let_shadows_parameter"
spec = ["5.1:14"]
description = "A let binding may shadow a parameter; the initializer reads the parameter (RUE-299)"
source = """
fn f(x: i32) -> i32 {
    let x = x + 100;
    x
}
fn main() -> i32 { f(5) }
"""
exit_code = 105

# =============================================================================
# Wildcard bindings (5.1:16) — RUE-299
# =============================================================================

[[case]]
name = "wildcard_let_discards_value"
spec = ["5.1:16"]
description = "let _ evaluates and discards its initializer, introducing no binding (RUE-299)"
source = """
fn main() -> i32 {
    let _ = 5 + 5;
    let _ = 99;
    3
}
"""
exit_code = 3

[[case]]
name = "wildcard_let_moves_affine_value"
spec = ["5.1:16"]
description = "let _ = affine_value moves out of the place, which is then no longer usable (RUE-299)"
real_std = true
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "hello";
    let _ = s;
    @intCast(s.len())
}
"""
compile_fail = true
error_contains = ["E0205"]

[[case]]
name = "wildcard_let_does_not_consume_linear"
spec = ["5.1:16"]
description = "Discarding a linear value with let _ is a compile-time error; it is not consumed (RUE-299)"
source = """
linear struct R { fd: i32 }
fn main() -> i32 {
    let _ = R { fd: 3 };
    0
}
"""
compile_fail = true
error_contains = ["E0478"]

# =============================================================================
# Struct Patterns (5.1:18-5.1:21, preview feature `struct_patterns`, RUE-1884)
# =============================================================================

[[case]]
name = "struct_pattern_binds_every_field"
spec = ["5.1:18", "5.1:21"]
preview = "struct_patterns"
preview_should_pass = true
description = "Shorthand, renamed, mutable, and discarded field patterns bind a struct's fields"
source = """
struct Point { x: i32, y: i32, z: i32 }

fn main() -> i32 {
    let Point { x, y: py, mut z } = Point { x: 40, y: 2, z: 100 };
    z = z / 100;
    let Point { x: _, y: _, z: tail } = Point { x: 1, y: 2, z: 0 };
    x + py + z + tail - 1
}
"""
exit_code = 42

[[case]]
name = "struct_pattern_head_forms"
spec = ["5.1:18"]
preview = "struct_patterns"
preview_should_pass = true
description = "The head takes every form a let annotation does: a struct name and a type-constructor call"
source = """
fn Pair(comptime T: type) -> type { struct { a: T, b: T } }
struct Wrap { inner: i32 }

fn main() -> i32 {
    let Pair(i32) { a, b } = Pair(i32) { a: 40, b: 2 };
    let Wrap { inner } = Wrap { inner: a + b };
    inner
}
"""
exit_code = 42

[[case]]
name = "struct_pattern_requires_preview"
spec = ["5.1:18", "8.4:1"]
description = "A struct pattern without --preview struct_patterns is the preview-gate error naming the feature"
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let Point { x, y } = Point { x: 40, y: 2 };
    x + y
}
"""
compile_fail = true
error_contains = ["E1100", "--preview struct_patterns"]

[[case]]
name = "struct_pattern_head_must_be_a_struct"
spec = ["5.1:19"]
preview = "struct_patterns"
preview_should_pass = true
source = """
const N = i32;
fn main() -> i32 {
    let N { value } = 5;
    value
}
"""
compile_fail = true
error_contains = "E0213"

[[case]]
name = "struct_pattern_head_must_match_initializer"
spec = ["5.1:19"]
preview = "struct_patterns"
preview_should_pass = true
source = """
struct Point { x: i32, y: i32 }
struct Other { x: i32, y: i32 }
fn main() -> i32 {
    let Point { x, y } = Other { x: 40, y: 2 };
    x + y
}
"""
compile_fail = true
error_contains = ["E0206", "expected Point, found Other"]

[[case]]
name = "struct_pattern_annotation_is_checked_like_any_let"
spec = ["5.1:19"]
preview = "struct_patterns"
preview_should_pass = true
description = "An explicit annotation on a struct-pattern let names the same type as the head"
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let Point { x, y }: Point = Point { x: 40, y: 2 };
    x + y
}
"""
exit_code = 42

[[case]]
name = "struct_pattern_mut_belongs_inside"
spec = ["5.1:19"]
preview = "struct_patterns"
preview_should_pass = true
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let mut Point { x, y } = Point { x: 40, y: 2 };
    x + y
}
"""
compile_fail = true
error_contains = "`mut` applies to one binding"

[[case]]
name = "struct_pattern_missing_field_rejected"
spec = ["5.1:20"]
preview = "struct_patterns"
preview_should_pass = true
description = "A pattern that omits fields is rejected naming every missing field: there is no rest form"
source = """
struct Point { x: i32, y: i32, z: i32 }
fn main() -> i32 {
    let Point { x } = Point { x: 1, y: 2, z: 3 };
    x
}
"""
compile_fail = true
error_contains = ["E0400", "missing fields 'y', 'z' in struct 'Point'"]

[[case]]
name = "struct_pattern_unknown_field_rejected"
spec = ["5.1:20"]
preview = "struct_patterns"
preview_should_pass = true
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let Point { x, y, w } = Point { x: 1, y: 2 };
    x + y + w
}
"""
compile_fail = true
error_contains = ["E0401", "unknown field 'w'"]

[[case]]
name = "struct_pattern_duplicate_field_rejected"
spec = ["5.1:20"]
preview = "struct_patterns"
preview_should_pass = true
source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let Point { x, y, x: again } = Point { x: 1, y: 2 };
    x + y + again
}
"""
compile_fail = true
error_contains = ["E0402", "duplicate field 'x'"]

[[case]]
name = "struct_pattern_bindings_follow_let_rules"
spec = ["5.1:21", "5.1:10", "5.1:12"]
preview = "struct_patterns"
preview_should_pass = true
description = "Bindings are introduced after the initializer, shadow outer names, and a parameter destructures like any value"
source = """
struct Point { x: i32, y: i32 }

fn sum(p: Point) -> i32 {
    let Point { x, y } = p;
    x + y
}

fn main() -> i32 {
    let x: i32 = 40;
    let Point { x, y } = Point { x: x + 2, y: 0 };
    x + y + sum(Point { x: 0, y: 0 })
}
"""
exit_code = 42

[[case]]
name = "struct_pattern_moves_a_move_field_and_drops_the_rest"
spec = ["5.1:21", "3.9:4"]
preview = "struct_patterns"
preview_should_pass = true
description = "A move field leaves the temporary; the temporary's remaining fields drop when the block ends"
source = """
struct Tag { id: i32 }
drop fn Tag(self) { @dbg(self.id); }
struct Pair { a: Tag, b: Tag }

fn main() -> i32 {
    {
        let Pair { a, b: _ } = Pair { a: Tag { id: 1 }, b: Tag { id: 2 } };
        @dbg(a.id + 10);
    }
    @dbg(3);
    0
}
"""
expected_stdout = """
2
11
1
3
"""
exit_code = 0

[[case]]
name = "struct_pattern_cannot_discard_a_linear_field"
spec = ["5.1:21", "5.1:16"]
preview = "struct_patterns"
preview_should_pass = true
source = """
linear struct Token { id: i32 }
struct Holder { t: Token, n: i32 }
fn main() -> i32 {
    let Holder { t: _, n } = Holder { t: Token { id: 1 }, n: 2 };
    n
}
"""
compile_fail = true
error_contains = "E0478"

[[case]]
name = "struct_pattern_consumes_a_linear_field_by_name"
spec = ["5.1:21"]
preview = "struct_patterns"
preview_should_pass = true
source = """
linear struct Token { id: i32 }
struct Holder { t: Token, n: i32 }
fn consume(t: Token) -> i32 { t.id }
fn main() -> i32 {
    let Holder { t, n } = Holder { t: Token { id: 40 }, n: 2 };
    consume(t) + n
}
"""
exit_code = 42

[[case]]
name = "struct_pattern_cannot_move_out_of_a_destructor_struct"
spec = ["5.1:21"]
preview = "struct_patterns"
preview_should_pass = true
description = "A move field of a struct with a destructor cannot leave it; a Copy field of such a struct is copied and the destructor still runs"
source = """
struct Handle { fd: i32 }
drop fn Handle(self) { @dbg(self.fd); }
struct Guard { handle: Handle, id: i32 }
drop fn Guard(self) { @dbg(self.id); }
fn main() -> i32 {
    let Guard { handle, id } = Guard { handle: Handle { fd: 3 }, id: 7 };
    handle.fd + id
}
"""
compile_fail = true
error_contains = "E0456"

[[case]]
name = "struct_pattern_copies_a_copy_field_of_a_destructor_struct"
spec = ["5.1:21"]
preview = "struct_patterns"
preview_should_pass = true
source = """
struct Guard { id: i32 }
drop fn Guard(self) { @dbg(self.id); }
fn main() -> i32 {
    let Guard { id } = Guard { id: 7 };
    @dbg(id + 1);
    0
}
"""
expected_stdout = """
8
7
"""
exit_code = 0
