[section]
id = "statements.assignment"
spec_chapter = "5.2"
name = "Assignment Statements"
description = "Assignment modifies the value of a mutable variable, array element, or struct field."

# =============================================================================
# Variable Assignment
# =============================================================================

[[case]]
name = "assign_simple"
spec = ["5.2:1", "5.2:2", "5.2:3"]
source = """
fn main() -> i32 {
    let mut x = 10;
    x = 42;
    x
}
"""
exit_code = 42

[[case]]
name = "assign_expression"
spec = ["5.2:1", "5.2:4"]
source = """
fn main() -> i32 {
    let mut x = 10;
    x = 20 + 22;
    x
}
"""
exit_code = 42

# =============================================================================
# Must Be Mutable
# =============================================================================

[[case]]
name = "assign_immutable_error"
error_contains = "[E0203]"
spec = ["5.2:3"]
source = """
fn main() -> i32 {
    let x = 10;
    x = 20;
    x
}
"""
compile_fail = true

# =============================================================================
# Type Must Be Compatible
# =============================================================================

[[case]]
name = "assign_type_mismatch"
error_contains = "[E0206]"
spec = ["5.2:4"]
source = """
fn main() -> i32 {
    let mut x: i32 = 10;
    x = true;
    x
}
"""
compile_fail = true

