# =============================================================================
# Nested Struct Field Assignment
# =============================================================================

[[case]]
name = "assign_nested_struct_field"
spec = ["5.2:11", "5.2:12"]
source = """
struct Inner { value: i32 }
struct Outer { inner: Inner }
fn main() -> i32 {
    let mut o = Outer { inner: Inner { value: 0 } };
    o.inner.value = 42;
    o.inner.value
}
"""
exit_code = 42

[[case]]
name = "assign_nested_struct_field_multiple"
spec = ["5.2:11", "5.2:12"]
source = """
struct Inner { value: i32 }
struct Outer { inner: Inner, other: i32 }
fn main() -> i32 {
    let mut o = Outer { inner: Inner { value: 10 }, other: 5 };
    o.inner.value = 30;
    o.other = 12;
    o.inner.value + o.other
}
"""
exit_code = 42

[[case]]
name = "assign_deeply_nested_struct_field"
spec = ["5.2:11", "5.2:12"]
source = """
struct A { x: i32 }
struct B { a: A }
struct C { b: B }
fn main() -> i32 {
    let mut c = C { b: B { a: A { x: 0 } } };
    c.b.a.x = 42;
    c.b.a.x
}
"""
exit_code = 42

[[case]]
name = "assign_nested_immutable_error"
error_contains = "[E0203]"
spec = ["5.2:12"]
source = """
struct Inner { value: i32 }
struct Outer { inner: Inner }
fn main() -> i32 {
    let o = Outer { inner: Inner { value: 0 } };
    o.inner.value = 42;
    o.inner.value
}
"""
compile_fail = true

[[case]]
name = "assign_multi_slot_nested_struct_field"
spec = ["5.2:11", "5.2:12"]
description = "Assigning to a field after a multi-slot nested struct computes the correct slot offset"
source = """
struct Inner { a: i32, b: i32 }
struct Outer { inner: Inner, other: i32 }
fn main() -> i32 {
    let mut o = Outer { inner: Inner { a: 1, b: 2 }, other: 100 };
    o.other = 42;
    o.inner.a + o.inner.b + o.other
}
"""
exit_code = 45

# =============================================================================
# Assignment Is Statement, Not Expression
# =============================================================================

[[case]]
name = "assignment_not_expression"
error_contains = "[E0100]"
spec = ["5.2:10"]
source = """
fn main() -> i32 {
    let mut x = 10;
    let y = (x = 20);
    x
}
"""
compile_fail = true

# =============================================================================
# Evaluation Order (RUE-298)
# The right-hand side is evaluated before the target place's index.
# =============================================================================

[[case]]
name = "assignment_rhs_before_place_index_observable"
spec = ["5.2:14"]
source = """
fn tap(n: i32) -> i32 { @dbg(n); n }
fn main() -> i32 {
    let mut arr: [i32; 4] = [0, 0, 0, 0];
    // RHS (tap(2)) is evaluated before the place index (tap(1)):
    // prints 2 then 1.
    arr[tap(1)] = tap(2);
    arr[1]
}
"""
exit_code = 2
expected_stdout = """
2
1
"""

[[case]]
name = "assignment_stores_rhs_value"
spec = ["5.2:14"]
source = """
fn main() -> i32 {
    let mut arr: [i32; 2] = [0, 0];
    arr[1] = 42;
    arr[1]
}
"""
exit_code = 42

# =============================================================================
# Compound Assignment (RUE-1043)
# `place op= value` means `place = place op value`, with the place evaluated
# exactly once.
# =============================================================================

[[case]]
name = "compound_assign_arithmetic_operators"
spec = ["5.2:16", "5.2:17"]
source = """
fn main() -> i32 {
    let mut x = 10;
    x += 5;
    x -= 3;
    x *= 4;
    x /= 6;
    x %= 5;
    x
}
"""
exit_code = 3

[[case]]
name = "compound_assign_bitwise_and_shift_operators"
spec = ["5.2:16", "5.2:17"]
source = """
fn main() -> i32 {
    let mut x = 1;
    x <<= 6;
    x >>= 1;
    x |= 5;
    x &= 61;
    x ^= 2;
    x
}
"""
exit_code = 39

[[case]]
name = "compound_assign_matches_expanded_form"
spec = ["5.2:17"]
source = """
fn main() -> i32 {
    let mut compound = 3;
    let mut expanded = 3;
    compound *= 7;
    expanded = expanded * 7;
    if compound == expanded { 42 } else { 0 }
}
"""
exit_code = 42

[[case]]
name = "compound_assign_array_element"
spec = ["5.2:16", "5.2:17"]
source = """
fn main() -> i32 {
    let mut arr: [i32; 2] = [40, 1];
    arr[0] += 2;
    arr[1] <<= 3;
    arr[0] - arr[1]
}
"""
exit_code = 34

[[case]]
name = "compound_assign_nested_field"
spec = ["5.2:16", "5.2:17"]
source = """
struct Inner { value: i32 }
struct Outer { inner: Inner }

fn main() -> i32 {
    let mut o = Outer { inner: Inner { value: 5 } };
    o.inner.value += 37;
    o.inner.value
}
"""
exit_code = 42

[[case]]
name = "compound_assign_through_self_receiver"
spec = ["5.2:17"]
source = """
struct Counter {
    n: i32,

    fn bump(inout self, by: i32) {
        self.n += by;
    }
}

fn main() -> i32 {
    let mut c = Counter { n: 40 };
    c.bump(2);
    c.n
}
"""
exit_code = 42

[[case]]
name = "compound_assign_target_must_be_mutable"
spec = ["5.2:17"]
error_contains = "[E0203]"
source = """
fn main() -> i32 {
    let x = 10;
    x += 1;
    x
}
"""
compile_fail = true

[[case]]
name = "compound_assign_operand_types_must_match"
spec = ["5.2:17"]
error_contains = "[E0206]"
source = """
fn main() -> i32 {
    let mut x = 10;
    x += true;
    x
}
"""
compile_fail = true

[[case]]
name = "compound_assign_constant_index_is_bounds_checked"
spec = ["5.2:17"]
error_contains = "[E0902]"
source = """
fn main() -> i32 {
    let mut arr: [i32; 3] = [1, 2, 3];
    arr[9] += 1;
    arr[0]
}
"""
compile_fail = true

[[case]]
name = "compound_assign_constant_index_survives_inner_mutable_shadow"
spec = ["5.2:18"]
description = "A mutable shadow in an inner block does not hide a named constant index"
error_contains = "[E0902]"
source = """
const I: u64 = 3;

fn main() -> i32 {
    let mut arr: [i32; 2] = [1, 2];
    {
        let mut I: u64 = 0;
        I += 1;
    };
    arr[I] += 1;
    arr[0]
}
"""
compile_fail = true

[[case]]
name = "compound_assign_constant_index_survives_own_initializer"
spec = ["5.2:18"]
description = "A mutable binding does not shadow a named constant in its initializer"
error_contains = "[E0902]"
source = """
const I: u64 = 3;

fn main() -> i32 {
    let mut arr: [i32; 2] = [1, 2];
    let mut I: u64 = { arr[I] += 1; 0 };
    arr[0]
}
"""
compile_fail = true

[[case]]
name = "compound_assign_is_not_an_expression"
spec = ["5.2:10"]
error_contains = "[E0100]"
source = """
fn main() -> i32 {
    let mut x = 1;
    let y = (x += 1);
    y
}
"""
compile_fail = true

[[case]]
name = "compound_assign_evaluates_the_place_once"
spec = ["5.2:18"]
source = """
fn tap_index(n: u64) -> u64 { @dbg(n); n }
fn tap_value(n: i32) -> i32 { @dbg(n); n }
fn main() -> i32 {
    let mut arr: [i32; 4] = [0, 0, 0, 40];
    // The index runs once, before the right-hand side: prints 3 then 9.
    arr[tap_index(3)] += tap_value(9);
    arr[3]
}
"""
exit_code = 49
expected_stdout = """
3
9
"""

[[case]]
name = "compound_assign_evaluates_each_place_index_once"
spec = ["5.2:18"]
source = """
struct Row { cells: [i32; 2] }
fn tap(n: u64) -> u64 { @dbg(n); n }
fn main() -> i32 {
    let mut rows: [Row; 2] = [Row { cells: [0, 0] }, Row { cells: [0, 0] }];
    // Each index subexpression of the place runs exactly once, left to right.
    rows[tap(1)].cells[tap(0)] += 42;
    rows[1].cells[0]
}
"""
exit_code = 42
expected_stdout = """
1
0
"""

[[case]]
name = "compound_assign_place_once_example"
spec = ["5.2:17", "5.2:18", "5.2:19"]
source = """
fn tap(n: u64) -> u64 { @dbg(n); n }

fn main() -> i32 {
    let mut arr: [i32; 4] = [0, 0, 0, 40];
    arr[tap(3)] += 2;
    arr[3]
}
"""
exit_code = 42
expected_stdout = """
3
"""

[[case]]
name = "compound_assign_snapshots_mutable_index_before_rhs"
spec = ["5.2:18"]
description = "A mutable direct index is fixed before the right-hand side runs"
source = """
fn bump(inout i: u64) -> i32 {
    i = 1;
    2
}

fn main() -> i32 {
    let mut a: [i32; 2] = [10, 20];
    let mut i: u64 = 0;
    a[i] += bump(inout i);
    a[0] * 10 + a[1]
}
"""
exit_code = 140

[[case]]
name = "compound_assign_snapshots_mutable_arithmetic_index"
spec = ["5.2:18"]
description = "A mutable arithmetic index is fixed before the right-hand side runs"
source = """
fn bump(inout i: u64) -> i32 {
    i = 2;
    2
}

fn main() -> i32 {
    let mut a: [i32; 3] = [10, 20, 30];
    let mut i: u64 = 0;
    a[i + 1] += bump(inout i);
    if a[0] == 10 && a[1] == 22 && a[2] == 30 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "compound_assign_snapshots_nested_mutable_indices"
spec = ["5.2:18"]
description = "Nested projected target indices are fixed before the right-hand side runs"
source = """
struct Row { cells: [i32; 2] }

fn bump(inout i: u64) -> i32 {
    i = 1;
    2
}

fn main() -> i32 {
    let mut rows: [Row; 2] = [
        Row { cells: [10, 20] },
        Row { cells: [30, 40] },
    ];
    let mut i: u64 = 0;
    let mut j: u64 = 0;
    rows[i].cells[j] += bump(inout i);
    if rows[0].cells[0] == 12
        && rows[0].cells[1] == 20
        && rows[1].cells[0] == 30
        && rows[1].cells[1] == 40 { 0 } else { 1 }
}
"""
exit_code = 0

[[case]]
name = "compound_assign_snapshots_mutable_method_index"
spec = ["5.2:18"]
description = "A method receiver and parameter index are fixed before the RHS"
source = """
struct Holder {
    values: [i32; 2],
    fn update(inout self, inout i: u64) {
        self.values[i] += bump(inout i);
    }
}

fn bump(inout i: u64) -> i32 {
    i = 1;
    2
}

fn main() -> i32 {
    let mut h = Holder { values: [10, 20] };
    let mut i: u64 = 0;
    h.update(inout i);
    h.values[0] * 10 + h.values[1]
}
"""
exit_code = 140

[[case]]
name = "compound_assign_snapshots_mutable_receiver_index"
spec = ["5.2:18"]
description = "A mutable receiver field used as an index is fixed before the RHS"
source = """
struct Holder {
    index: u64,
    values: [i32; 2],
    fn update(mut self) -> i32 {
        self.values[self.index] += { self.index = 1; 2 };
        self.values[0] * 10 + self.values[1]
    }
}

fn main() -> i32 {
    let h = Holder { index: 0, values: [10, 20] };
    h.update()
}
"""
exit_code = 140

[[case]]
name = "compound_assign_places_example"
spec = ["5.2:17", "5.2:20"]
source = """
struct Counter { hits: i32 }

fn main() -> i32 {
    let mut c = Counter { hits: 16 };
    let mut arr: [i32; 2] = [1, 2];
    c.hits += 1;
    c.hits *= 2;
    arr[0] <<= 3;
    arr[1] -= 2;
    c.hits + arr[0] + arr[1]
}
"""
exit_code = 42
