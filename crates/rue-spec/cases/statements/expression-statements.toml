[section]
id = "statements.expression"
spec_chapter = "5.3"
name = "Expression Statements"
description = "An expression followed by a semicolon becomes an expression statement."

# =============================================================================
# Expression Followed by Semicolon
# =============================================================================

[[case]]
name = "expression_statement_simple"
spec = ["5.3:1", "5.3:2"]
source = """
fn returns_int() -> i32 { 42 }
fn main() -> i32 {
    returns_int();
    10
}
"""
exit_code = 10

[[case]]
name = "expression_statement_call"
spec = ["5.3:1"]
source = """
fn do_something() {}
fn main() -> i32 {
    do_something();
    42
}
"""
exit_code = 42

# =============================================================================
# Value Is Discarded
# =============================================================================

[[case]]
name = "value_discarded"
spec = ["5.3:3"]
source = """
fn main() -> i32 {
    42;
    10
}
"""
exit_code = 10

[[case]]
name = "side_effect_statement"
spec = ["5.3:3"]
source = """
fn main() -> i32 {
    let mut x = 0;
    x = 42;
    x
}
"""
exit_code = 42

[[case]]
name = "multiple_expression_statements"
spec = ["5.3:1", "5.3:3"]
source = """
fn main() -> i32 {
    let mut sum = 0;
    sum = sum + 10;
    sum = sum + 20;
    sum = sum + 12;
    sum
}
"""
exit_code = 42

# =============================================================================
# Block-like Expression Statements (5.3:6, 5.3:7, 5.3:9)
# =============================================================================

# A block-like expression in statement position is a complete statement without
# a trailing semicolon.
[[case]]
name = "block_like_if_statement_no_semicolon"
spec = ["5.3:6"]
source = """
fn main() -> i32 {
    let mut x = 0;
    if true { x = 42; } else { x = 0; }
    x
}
"""
exit_code = 42

[[case]]
name = "block_like_match_statement_no_semicolon"
spec = ["5.3:6"]
source = """
fn main() -> i32 {
    let mut x = 0;
    match 1 { 1 => { x = 7; }, _ => { x = 0; } }
    x
}
"""
exit_code = 7

# A block-like expression in statement position does not continue into a
# surrounding infix binary expression: a following infix binary operator (here
# `+`) is a syntax error at the operator, not an addition (5.3:7).
[[case]]
name = "block_like_then_plus_is_syntax_error"
spec = ["5.3:7"]
error_contains = "[E0102]"
source = """
fn main() -> i32 {
    if true { 10 } else { 20 } + 5
}
"""
compile_fail = true

# Parentheses place the block-like expression in operand position, where the
# operator applies as usual (10 + 5 = 15) (5.3:7).
[[case]]
name = "parenthesized_block_like_then_plus_is_addition"
spec = ["5.3:7"]
source = """
fn main() -> i32 {
    (if true { 10 } else { 20 }) + 5
}
"""
exit_code = 15

# The `-` operator is the exception: a leading unary `-` on the line after a
# block-like statement begins a NEW statement; it does not extend the block-like
# expression into a subtraction. The `if` value is discarded and `-1` is the
# block's tail (returns 255) (5.3:9).
[[case]]
name = "block_like_if_then_unary_minus_is_new_statement"
spec = ["5.3:9"]
source = """
fn main() -> i32 {
    if true { 999 } else { 888 }
    -1
}
"""
exit_code = 255

[[case]]
name = "block_like_match_then_unary_minus_is_new_statement"
spec = ["5.3:9"]
source = """
fn main() -> i32 {
    match 1 { 1 => 999, _ => 888 }
    -1
}
"""
exit_code = 255

# Both rules are statement-position only: a block-like expression used as an
# operand (here, a let right-hand side) still binds the ambiguous `-` as
# subtraction as usual (10 - 5 = 5) (5.3:9).
[[case]]
name = "block_like_minus_as_operand_still_binds"
spec = ["5.3:9"]
source = """
fn main() -> i32 {
    let x = if true { 10 } else { 20 } - 5;
    x
}
"""
exit_code = 5
