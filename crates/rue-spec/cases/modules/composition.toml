[section]
id = "modules.composition"
spec_chapter = "10.5"
name = "Program Composition"
description = "Module-scoped top-level names and extent of analysis (spec chapter 10.5)."

[[case]]
name = "same_named_functions_across_imported_files_ok"
spec = ["10.5:2"]
description = "Two loaded files may define the same top-level function name when each is accessed through its own module"
source = """
fn main() -> i32 {
    let a = @import("a.rue");
    let _b = @import("b.rue");
    a.shared()
}
"""
aux_files = { "a.rue" = "pub fn shared() -> i32 { 1 }", "b.rue" = "pub fn shared() -> i32 { 2 }" }
exit_code = 1

[[case]]
name = "same_named_consts_across_imported_files_ok"
spec = ["10.5:2"]
description = "Top-level value constants may share a source name across imported files when accessed through their modules"
source = """
fn main() -> i32 {
    let left = @import("left.rue");
    let _right = @import("right.rue");
    left.go()
}
"""
aux_files = { "left.rue" = """
pub const LIMIT: i32 = 1;
pub fn go() -> i32 { LIMIT }
""", "right.rue" = """
pub const LIMIT: i32 = 2;
pub fn go2() -> i32 { LIMIT }
""" }
exit_code = 1

[[case]]
name = "imported_module_main_is_ordinary_and_callable"
spec = ["10.5:2", "6.1:38"]
description = "A top-level `main` in a non-root (imported) module is an ordinary namespaced function: it does not conflict with the root's entry point and is callable through its module path, returning its own value"
source = """
fn main() -> i32 {
    let m = @import("m.rue");
    m.main()
}
"""
aux_files = { "m.rue" = "pub fn main() -> i32 { 42 }" }
exit_code = 42

[[case]]
name = "root_main_is_entry_point_over_imported_main"
spec = ["10.5:2", "6.1:38"]
description = "When both the root and an imported module define `main`, the root module's `main` is the program entry point"
source = """
fn main() -> i32 {
    let m = @import("m.rue");
    m.value() + 3
}
"""
aux_files = { "m.rue" = "pub fn main() -> i32 { 99 }\npub fn value() -> i32 { 2 }" }
exit_code = 5

[[case]]
name = "same_file_duplicate_function_error"
spec = ["10.5:1"]
description = "Two top-level items with one name in ONE file are a duplicate-definition error; the check is per-file"
source = """
fn shared() -> i32 { 1 }
fn shared() -> i32 { 2 }
fn main() -> i32 { shared() }
"""
compile_fail = true
error_contains = "E0436"

[[case]]
name = "same_file_cross_kind_collision_error"
spec = ["10.5:1"]
description = "A const and a fn sharing one name in ONE file collide across kinds (E0436)"
source = """
const X: i32 = 1;
fn X() -> i32 { 2 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0436", "different kind"]

[[case]]
name = "same_file_duplicate_constant_error"
spec = ["10.5:1"]
description = "Two top-level const declarations with one name in ONE file produce E0418"
source = """
const LIMIT: i32 = 1;
const LIMIT: i32 = 2;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0418", "duplicate constant"]

[[case]]
name = "same_file_duplicate_type_error"
spec = ["10.5:1"]
description = "Two top-level type declarations with one name in ONE file produce E0405"
source = """
struct Point { x: i32 }
struct Point { y: i32 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0405", "duplicate type"]

[[case]]
name = "same_file_type_function_collision_error"
spec = ["10.5:1"]
description = "A type and a function sharing one name in ONE file collide across kinds (E0436)"
source = """
struct Point { x: i32 }
fn Point() -> i32 { 2 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0436", "Point", "different kind"]

[[case]]
name = "same_file_type_constant_collision_error"
spec = ["10.5:1"]
description = "A type and a constant sharing one name in ONE file collide across categories (E0436)"
source = """
enum Color { Red, Green }
const Color: i32 = 1;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0436", "Color", "different kind"]

[[case]]
name = "same_file_struct_constant_collision_error"
spec = ["10.5:1"]
description = "A struct and a constant sharing one name use the kind-neutral E0436 diagnostic"
source = """
struct Thing { value: i32 }
const Thing: i32 = 1;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0436", "Thing", "different kind"]

[[case]]
name = "same_file_constant_struct_collision_error"
spec = ["10.5:1"]
description = "A constant and a struct sharing one name use the kind-neutral E0436 diagnostic"
source = """
const Thing: i32 = 1;
struct Thing { value: i32 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0436", "Thing", "different kind"]

[[case]]
name = "same_named_functions_qualified_calls_sum"
spec = ["10.5:3"]
description = "The 10.5:3 example: same-named functions in two modules, each call resolving in its own module"
source = """
fn main() -> i32 {
    let a = @import("a.rue");
    let b = @import("b.rue");
    a.shared() + b.shared()
}
"""
aux_files = { "a.rue" = "pub fn shared() -> i32 { 1 }", "b.rue" = "pub fn shared() -> i32 { 2 }" }
exit_code = 3

[[case]]
name = "reachable_broken_imported_item_always_errors"
spec = ["10.5:4"]
description = "The guaranteed half of demand-driven analysis: an error in imported code the program reaches is always reported (the lazy half — unreferenced items possibly unanalyzed — is exercised by the real driver in CLI tests)"
source = """
fn main() -> i32 {
    let m = @import("m.rue");
    m.broken()
}
"""
aux_files = { "m.rue" = """
pub fn broken() -> i32 { true }
""" }
compile_fail = true
error_contains = "E0206"

[[case]]
name = "single_file_skips_unreferenced_invalid_body"
spec = ["10.5:4"]
description = "An invalid ordinary function body is not analyzed when main does not reach it"
source = """
fn answer() -> i32 { 42 }

fn broken() -> i32 { true }

fn main() -> i32 { answer() }
"""
exit_code = 42

[[case]]
name = "import_graph_skips_unreferenced_invalid_body"
spec = ["10.5:4"]
description = "Adding a harmless import to the same root program does not change the body-analysis frontier"
source = """
const harmless = @import("helper.rue");

fn answer() -> i32 { 42 }

fn broken() -> i32 { true }

fn main() -> i32 { answer() }
"""
aux_files = { "helper.rue" = "pub fn unused() -> i32 { 0 }" }
exit_code = 42

[[case]]
name = "single_file_skips_unreferenced_invalid_method_body"
spec = ["10.5:4"]
description = "An invalid ordinary method body is not analyzed when main does not reach it"
source = """
struct Wrap {
    value: i32,
    fn broken(self) -> i32 { true }
}

fn main() -> i32 { 42 }
"""
exit_code = 42
