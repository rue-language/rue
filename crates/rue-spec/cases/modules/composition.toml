[section]
id = "modules.composition"
spec_chapter = "10.5"
name = "Program Composition"
description = "Cross-file name collisions among modules loaded through the root import graph (spec chapter 10.5)."

[[case]]
name = "same_named_functions_across_imported_files_ok"
spec = ["10.5:1"]
description = "Two loaded files may define the same top-level function name when each is accessed through its own module"
source = """
fn main() -> i32 {
    let a = @import("a");
    let _b = @import("b");
    a.shared()
}
"""
aux_files = { "a.rue" = "pub fn shared() -> i32 { 1 }", "b.rue" = "pub fn shared() -> i32 { 2 }" }
exit_code = 1

[[case]]
name = "duplicate_const_across_imported_files_error"
spec = ["10.5:1"]
description = "Top-level value constants also collide across files (module bindings are exempt — see 10.4:8)"
source = """
fn main() -> i32 {
    let left = @import("left");
    let _right = @import("right");
    left.go()
}
"""
aux_files = { "left.rue" = """
pub const LIMIT: i32 = 1;
pub fn go() -> i32 { LIMIT }
""", "right.rue" = """
pub const LIMIT: i32 = 2;
pub fn go2() -> i32 { LIMIT }
""" }
compile_fail = true
error_contains = "duplicate"
