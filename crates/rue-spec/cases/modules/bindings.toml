[section]
id = "modules.bindings"
spec_chapter = "10.4"
name = "Module Bindings and Re-exports"
description = "Binding forms for @import, const re-exports, and modules not being runtime values (spec chapter 10.4)."

# =============================================================================
# Binding forms (10.4:1): top-level const and local let are equivalent
# =============================================================================

[[case]]
name = "const_and_let_bindings_equivalent"
spec = ["10.4:1"]
description = "A module bound by top-level const and by local let supports the same member access"
source = """
const math = @import("math");

fn main() -> i32 {
    let m = @import("math");
    math.add(40, m.add(1, 1))
}
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
exit_code = 42

# =============================================================================
# Re-exports (10.4:3, 10.4:4)
# =============================================================================

[[case]]
name = "reexport_chain_two_levels"
spec = ["10.4:3"]
description = "Member access chains through two levels of pub const re-export (directory facades)"
source = """
fn main() -> i32 {
    let a = @import("a");
    a.b.value()
}
"""
aux_files = { "a/_a.rue" = """
pub const b = @import("a/b");
""", "a/b/_b.rue" = """
pub fn value() -> i32 { 42 }
""" }
exit_code = 42

[[case]]
name = "private_reexport_visible_within_directory"
spec = ["10.4:4"]
description = "A non-pub const re-export is accessible from a file in the same directory as its definer"
source = """
fn main() -> i32 {
    let m = @import("mod");
    m.helper.h()
}
"""
aux_files = { "mod.rue" = """
const helper = @import("sub/helper");
""", "sub/helper.rue" = """
pub fn h() -> i32 { 42 }
""" }
exit_code = 42

# =============================================================================
# Modules are not runtime values (10.4:6)
# =============================================================================

[[case]]
name = "module_as_function_argument_error"
spec = ["10.4:6"]
description = "Passing a module binding as a function argument is a compile error"
source = """
fn takes(m: i32) -> i32 { m }
fn main() -> i32 {
    let math = @import("math");
    takes(math)
}
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
compile_fail = true
error_contains = "type mismatch"

[[case]]
name = "module_as_struct_field_error"
spec = ["10.4:6"]
description = "Using a module binding as a struct field value is a compile error"
source = """
struct Holder { m: i32 }
fn main() -> i32 {
    let math = @import("math");
    let h = Holder { m: math };
    0
}
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
compile_fail = true
error_contains = "type mismatch"

[[case]]
name = "module_comparison_error"
spec = ["10.4:6"]
description = "Comparing module bindings with == is a compile error"
source = """
fn main() -> i32 {
    let a = @import("math");
    let b = @import("math");
    if a == b { 1 } else { 0 }
}
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
compile_fail = true
error_contains = "type mismatch"

# A module is not the unit value either: where `()` is the expected type, a
# module expression is a type mismatch like any other (10.4:6).

[[case]]
name = "module_as_unit_tail_expression_error"
spec = ["10.4:6"]
description = "A module as the tail expression of a unit-typed block is E0206, not the unit value"
source = """
fn sink() {
    let math = @import("math");
    math
}
fn main() -> i32 { sink(); 0 }
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
compile_fail = true
error_contains = ["E0206", "expected ()", "found <module>"]

[[case]]
name = "module_as_unit_argument_error"
spec = ["10.4:6"]
description = "Passing a module where a `()` parameter is expected is E0206"
source = """
fn sink(x: ()) -> i32 { 0 }
fn main() -> i32 {
    let math = @import("math");
    sink(math)
}
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
compile_fail = true
error_contains = ["E0206", "expected ()", "found <module>"]

# =============================================================================
# Module expressions in statement position (10.4:7)
# =============================================================================
# No type is expected in statement position, so the module is discarded without
# being materialized. This is not a module *value* — see 10.4:6.

[[case]]
name = "module_expression_statement_discarded"
spec = ["10.4:7"]
description = "A bare module expression statement is accepted and discarded"
source = """
fn main() -> i32 {
    let math = @import("math");
    math;
    math.add(1, 2)
}
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
exit_code = 3

[[case]]
name = "module_block_statement_discarded"
spec = ["10.4:7"]
description = "A block statement whose tail is a module expression is accepted and discarded"
source = """
fn main() -> i32 {
    let math = @import("math");
    { math };
    math.add(2, 3)
}
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
exit_code = 5

# =============================================================================
# Per-file scoping of module bindings (10.4:8) — RUE-113
# =============================================================================

[[case]]
name = "same_binding_name_in_two_files"
spec = ["10.4:8"]
description = "Two files each bind `const utils = @import(...)` to the same module without conflict"
source = """
const a = @import("a");
const b = @import("b");

fn main() -> i32 {
    a.from_a() + b.from_b()
}
"""
aux_files = { "a.rue" = """
const utils = @import("utils");
pub fn from_a() -> i32 { utils.one() }
""", "b.rue" = """
const utils = @import("utils");
pub fn from_b() -> i32 { utils.one() + 1 }
""", "utils.rue" = """
pub fn one() -> i32 { 1 }
""" }
exit_code = 3

[[case]]
name = "same_binding_name_different_modules"
spec = ["10.4:8"]
description = "Two files bind the same name to different modules; each file sees its own binding"
source = """
const a = @import("a");
const b = @import("b");

fn main() -> i32 {
    a.from_a() + b.from_b()
}
"""
aux_files = { "a.rue" = """
const helper = @import("m1");
pub fn from_a() -> i32 { helper.ten() }
""", "b.rue" = """
const helper = @import("m2");
pub fn from_b() -> i32 { helper.twenty() }
""", "m1.rue" = """
pub fn ten() -> i32 { 10 }
""", "m2.rue" = """
pub fn twenty() -> i32 { 20 }
""" }
exit_code = 30

[[case]]
name = "duplicate_binding_in_one_file_error"
spec = ["10.4:8"]
description = "Two module bindings with the same name in a single file are a duplicate-constant error"
source = """
const m = @import("m1");
const m = @import("m2");

fn main() -> i32 {
    m.ten()
}
"""
aux_files = { "m1.rue" = """
pub fn ten() -> i32 { 10 }
""", "m2.rue" = """
pub fn twenty() -> i32 { 20 }
""" }
compile_fail = true
error_contains = "duplicate constant 'm'"

# =============================================================================
# Module aliases (10.4:10) — RUE-160
# =============================================================================

[[case]]
name = "alias_of_module_binding"
spec = ["10.4:10"]
description = "A const initialized from another module binding aliases the same module"
source = """
const m = @import("math");
const m2 = m;

fn main() -> i32 {
    m2.add(m.add(20, 20), 2)
}
"""
aux_files = { "math.rue" = "pub fn add(a: i32, b: i32) -> i32 { a + b }" }
exit_code = 42

[[case]]
name = "alias_of_nested_reexport"
spec = ["10.4:10", "10.4:11"]
description = "A const initialized from a member-access chain ending at a re-export aliases the inner module"
source = """
const outer = @import("outer");
const inner = outer.inner;

fn main() -> i32 {
    inner.value()
}
"""
aux_files = { "outer/_outer.rue" = """
pub const inner = @import("inner");
""", "outer/inner.rue" = """
pub fn value() -> i32 { 42 }
""" }
exit_code = 42

# =============================================================================
# Value constants as module members (10.4:12, 10.4:13) — RUE-160
# =============================================================================

[[case]]
name = "value_const_member_at_use_site"
spec = ["10.4:12"]
description = "m.CONST yields the member constant's value with its declared type"
source = """
const math = @import("math");

fn main() -> i32 {
    math.ANSWER
}
"""
aux_files = { "math.rue" = "pub const ANSWER: i32 = 42;" }
exit_code = 42

[[case]]
name = "value_const_member_keeps_declared_width"
spec = ["10.4:12"]
description = "An i64 member constant keeps its width through the member access"
source = """
const cfg = @import("cfg");

fn main() -> i32 {
    if cfg.BIG / 1000000000 == 5 { 9 } else { 1 }
}
"""
aux_files = { "cfg.rue" = "pub const BIG: i64 = 5000000000;" }
exit_code = 9

[[case]]
name = "value_const_member_in_const_initializer"
spec = ["10.4:12", "10.4:14"]
description = "Member access to a value const is itself compile-time evaluable"
source = """
const math = @import("math");
const COPY: i32 = math.ANSWER;

fn main() -> i32 {
    math.ANSWER + COPY
}
"""
aux_files = { "math.rue" = "pub const ANSWER: i32 = 21;" }
exit_code = 42

[[case]]
name = "pub_const_member_visible_across_directories"
spec = ["10.4:13"]
description = "A pub const member is accessible from any directory"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    lib.LIMIT
}
"""
aux_files = { "sub/lib.rue" = "pub const LIMIT: i32 = 17;" }
exit_code = 17

[[case]]
name = "private_const_member_rejected_across_directories"
spec = ["10.4:13"]
description = "A non-pub const member is private outside its directory (E0706)"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    lib.SECRET
}
"""
aux_files = { "sub/lib.rue" = """
const SECRET: i32 = 99;
pub fn touch() -> i32 { SECRET }
""" }
compile_fail = true
error_contains = "private"

# =============================================================================
# Types, Enum Variants, and Associated Functions Through a Module (RUE-293)
# =============================================================================
# A module's types, enum variants, and associated functions are referenced
# through a module binding in expression/pattern positions (10.4:15); a
# qualified path is also accepted in type position (10.4:16); privacy is
# uniform (10.4:18).

[[case]]
name = "qualified_type_variant_and_assoc_fn_forms"
spec = ["10.4:15"]
description = "Struct literal, associated function, variant expression, and variant pattern are all usable through a module binding"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    let p = lib.Point { x: 40, y: 2 };
    let q = lib.Point.origin();
    let c = lib.Color.Green;
    let base = p.x + p.y + q.x + q.y;
    match c {
        lib.Color.Red => 0,
        lib.Color.Green => base,
        lib.Color.Blue => 0,
    }
}
"""
aux_files = { "sub/lib.rue" = """
pub struct Point {
    x: i32,
    y: i32,
    fn origin() -> Point { Point { x: 30, y: 12 } }
}
pub enum Color { Red, Green, Blue, }
""" }
exit_code = 84

[[case]]
name = "qualified_path_in_type_position_allowed"
spec = ["10.4:16"]
description = "A module-qualified path in a type-annotation position resolves through the importing module."
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    let p: lib.Point = lib.Point { x: 1, y: 2 };
    p.x + p.y
}
"""
aux_files = { "sub/lib.rue" = """
pub struct Point { x: i32, y: i32, }
""" }
exit_code = 3

[[case]]
name = "same_named_structs_in_distinct_modules_are_distinct"
spec = ["10.4:16"]
description = "RUE-454: module-qualified type lookup uses the defining module, so sibling modules may each define `Point`."
source = """
const a = @import("a");
const b = @import("b");

fn main() -> i32 {
    let p: a.Point = a.Point { x: 10 };
    let q: b.Point = b.Point { y: 32 };
    p.x + q.y
}
"""
aux_files = { "a.rue" = """
pub struct Point { x: i32, }
""", "b.rue" = """
pub struct Point { y: i32, }
""" }
exit_code = 42

[[case]]
name = "same_named_enums_in_distinct_modules_are_distinct"
spec = ["10.4:15"]
description = "RUE-454: module-qualified enum lookup uses the defining module, so sibling modules may each define `Color`."
source = """
const a = @import("a");
const b = @import("b");

fn main() -> i32 {
    let left = a.pick_a();
    let right = b.pick_b();
    let x = match left {
        a.Color.Red => 10,
        a.Color.Green => 0,
    };
    let y = match right {
        b.Color.Red => 0,
        b.Color.Green => 32,
    };
    x + y
}
"""
aux_files = { "a.rue" = """
pub enum Color { Red, Green, }
pub fn pick_a() -> Color { Color.Red }
""", "b.rue" = """
pub enum Color { Red, Green, }
pub fn pick_b() -> Color { Color.Green }
""" }
exit_code = 42

[[case]]
name = "qualified_private_struct_literal_rejected"
spec = ["10.4:18"]
description = "A private struct named in a module-qualified struct literal from another directory is E0706, uniform with every module-member privacy violation (RUE-525)"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    let s = lib.Secret { n: 3 };
    s.n
}
"""
aux_files = { "sub/lib.rue" = """
struct Secret { n: i32, }
pub fn touch() -> i32 { let s = Secret { n: 1 }; s.n }
""" }
compile_fail = true
error_contains = ["E0706", "is private"]

[[case]]
name = "qualified_private_enum_variant_rejected"
spec = ["10.4:18"]
description = "A private enum's variant named through a module from another directory is E0706 (routes through module-member resolution)"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    let h = lib.Hidden.A;
    0
}
"""
aux_files = { "sub/lib.rue" = """
enum Hidden { A, B, }
pub fn touch() -> i32 { let h = Hidden.A; match h { Hidden.A => 1, Hidden.B => 2, } }
""" }
compile_fail = true
error_contains = ["E0706", "is private"]

# =============================================================================
# Associated-function privacy follows the enclosing type (10.4:19, RUE-330,
# RUE-525). Module-qualified access to a private type's associated function
# is E0706; the unqualified spelling never resolves another file's type at
# all (10.3:8), so it fails name resolution before privacy is considered.

[[case]]
name = "cross_dir_unqualified_private_assoc_fn_rejected"
spec = ["10.4:19", "10.3:8"]
description = "An unqualified associated-function call on another file's struct does not resolve at all (RUE-525): name-resolution error, never a flat-namespace hit"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    let s = Secret.make();
    s.n
}
"""
aux_files = { "sub/lib.rue" = """
struct Secret {
    n: i32,
    fn make() -> Secret { Secret { n: 5 } }
}
""" }
compile_fail = true
error_contains = ["E0201", "undefined variable 'Secret'"]

[[case]]
name = "cross_dir_qualified_private_assoc_fn_rejected"
spec = ["10.4:19", "10.4:18"]
description = "A module-qualified associated-function call on a private struct from another directory is E0706, uniform with every module-member privacy violation (RUE-525)"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    let s = lib.Secret.make();
    s.n
}
"""
aux_files = { "sub/lib.rue" = """
struct Secret {
    n: i32,
    fn make() -> Secret { Secret { n: 5 } }
}
""" }
compile_fail = true
error_contains = ["E0706", "struct `Secret` is private"]

[[case]]
name = "cross_dir_pub_assoc_fn_allowed"
spec = ["10.4:19", "10.4:17"]
description = "A module-qualified associated-function call on a pub struct across directories is allowed; the qualifier resolves the type in the named module"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    let p = lib.Point.origin();
    p.x + p.y
}
"""
aux_files = { "sub/lib.rue" = """
pub struct Point {
    x: i32,
    y: i32,
    fn origin() -> Point { Point { x: 30, y: 12 } }
}
""" }
exit_code = 42

[[case]]
name = "same_dir_private_assoc_fn_allowed"
spec = ["10.4:19"]
description = "Intra-directory visibility is unchanged: an associated-function call on a private struct in an imported same-directory module is allowed"
source = """
const lib = @import("lib");

fn main() -> i32 {
    let s = lib.Secret.make();
    s.n
}
"""
aux_files = { "lib.rue" = """
struct Secret {
    n: i32,
    fn make() -> Secret { Secret { n: 42 } }
}
""" }
exit_code = 42

[[case]]
name = "cross_dir_comptime_bound_assoc_fn_allowed"
spec = ["10.4:19"]
description = "A receiver type reached through a comptime binding (not by naming the struct) is exempt: `let P = lib.Point; P.origin()` is allowed"
source = """
const lib = @import("sub/lib");

fn main() -> i32 {
    let P = lib.Point;
    let p = P.origin();
    p.x + p.y
}
"""
aux_files = { "sub/lib.rue" = """
pub struct Point {
    x: i32,
    y: i32,
    fn origin() -> Point { Point { x: 30, y: 12 } }
}
""" }
exit_code = 42
