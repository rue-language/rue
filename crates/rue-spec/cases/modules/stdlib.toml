[section]
id = "modules.stdlib"
spec_chapter = "4.13"
name = "Standard Library Imports"
description = "Resolution and usage of @import(\"std\") for the standard library."

# =============================================================================
# @import("std") Resolution
# =============================================================================
# Spec 10.2:6 has two halves: the adjacent std/_std.rue directory-module form
# (covered here) and the $RUE_STD_PATH form with its precedence. The spec
# harness cannot set per-case environment variables, so the env-var half is
# exercised by the CLI integration test `import_std_via_env_var`
# (crates/rue-cli-tests/cases/modules.toml).

[[case]]
name = "import_std_resolves"
spec = ["4.13:82", "10.2:6"]
description = "@import(\"std\") resolves to the standard library root when std/ exists"
source = """
fn main() -> i32 {
    let std = @import("std");
    0
}
"""
aux_files = { "std/_std.rue" = """
// Minimal std library for testing
pub fn test_fn() -> i32 { 42 }
""" }
exit_code = 0

[[case]]
name = "import_std_not_found_error"
spec = ["4.13:83"]
description = "@import(\"std\") produces a clear error when stdlib is not found"
source = """
fn main() -> i32 {
    let std = @import("std");
    0
}
"""
compile_fail = true
error_contains = "standard library not found"
# This test runs without RUE_STD_PATH and without std/ in the test directory
# so it should fail to find the standard library

# =============================================================================
# Standard Library Submodule Access
# =============================================================================

[[case]]
name = "import_std_with_submodule"
spec = ["4.13:81", "4.13:82", "10.2:6"]
description = "std library with submodules can be imported and accessed"
source = """
fn main() -> i32 {
    let std = @import("std");
    std.math.abs(0 - 42)
}
"""
aux_files = { "std/_std.rue" = """
pub const math = @import("math.rue");
""", "std/math.rue" = """
pub fn abs(x: i32) -> i32 {
    if x < 0 { -x } else { x }
}
""" }
exit_code = 42

[[case]]
name = "import_std_with_generic_submodule"
spec = ["4.13:81", "4.13:82", "10.2:6"]
description = "std library generic submodule members can be accessed and instantiated"
source = """
fn main() -> i32 {
    let std = @import("std");
    let O = std.option.Option(i32);
    let x = O.Some(7);
    match x {
        O.Some(n) => n,
        O.None => 1,
    }
}
"""
aux_files = { "std/_std.rue" = """
pub const option = @import("option.rue");
""", "std/option.rue" = """
pub fn Option(comptime T: type) -> type {
    enum { Some(T), None }
}
""" }
exit_code = 7

[[case]]
name = "vendored_std_resolves_from_nested_importer"
spec = ["10.2:6"]
description = "A vendored std/_std.rue under the project root serves @import(\"std\") from any depth; std is never searched importer-relative (ADR-0078)"
source = """
fn main() -> i32 {
    let m = @import("sub/mod.rue");
    m.go()
}
"""
aux_files = { "sub/mod.rue" = """
const s = @import("std");
pub fn go() -> i32 { s.vendored() }
""", "std/_std.rue" = """
pub fn vendored() -> i32 { 21 }
""", "sub/std/_std.rue" = """
pub fn hijacked() -> i32 { 13 }
""" }
exit_code = 21
