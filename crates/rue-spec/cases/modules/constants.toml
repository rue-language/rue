[section]
id = "modules.constants"
name = "Constants"
description = "Constant declarations for module re-exports."

# =============================================================================
# Basic Const Declarations
# =============================================================================

[[case]]
name = "const_basic_integer"
description = "Basic const declaration with integer value"
source = """
const VALUE: i32 = 42;
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "const_without_type_rejected"
description = "A value const without a type annotation is E0475 (RUE-179)"
source = """
const VALUE = 42;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0475", "missing type annotation on constant 'VALUE'"]

# =============================================================================
# Typed Const Declarations (RUE-161)
# =============================================================================

[[case]]
name = "const_i64_annotation_respected"
description = "An i64 annotation types the const's value; no truncation to i32"
source = """
const BIG: i64 = 5000000000;
fn main() -> i32 {
    if BIG / 1000000000 == 5 { 5 } else { 1 }
}
"""
exit_code = 5

[[case]]
name = "const_annotation_value_out_of_range"
description = "A const initializer must fit the annotated integer type"
source = """
const X: u8 = 300;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "out of range"

[[case]]
name = "const_annotation_kind_mismatch"
description = "A non-integer const annotation must match the initializer's type"
source = """
const X: bool = 5;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "type mismatch"

[[case]]
name = "const_annotation_unknown_type"
description = "Unknown type names on const items are rejected"
source = """
const X: zzz_bogus = 5;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "unknown type"

# =============================================================================
# Public Const Declarations
# =============================================================================

[[case]]
name = "pub_const_basic"
description = "Public const declaration"
source = """
pub const VALUE: i32 = 42;
fn main() -> i32 { 0 }
"""
exit_code = 0

# =============================================================================
# Const with Import (Module Re-exports)
# =============================================================================

# Note: These tests verify the syntax is accepted. Full re-export behavior
# will be tested once module population is implemented.

[[case]]
name = "const_import_syntax"
description = "Const with @import syntax evaluated at compile time"
source = """
const math = @import("nonexistent");
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "cannot find module 'nonexistent'"

[[case]]
name = "pub_const_import_syntax"
description = "Pub const with @import syntax evaluated at compile time"
source = """
pub const math = @import("nonexistent");
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "cannot find module 'nonexistent'"

# =============================================================================
# Duplicate Detection
# =============================================================================

[[case]]
name = "duplicate_const_error"
description = "Duplicate const declarations cause error"
source = """
const X: i32 = 1;
const X: i32 = 2;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "duplicate"

[[case]]
name = "const_function_conflict"
description = "Const with same name as function causes error"
source = """
fn foo() -> i32 { 42 }
const foo: i32 = 1;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = "duplicate"
