[section]
id = "modules.intra_directory"
name = "Intra-Directory Visibility"
description = "Files within the same directory can access each other's non-pub items. Per ADR-0026, pub only affects cross-directory visibility."

# =============================================================================
# Intra-Directory Access (Same Directory)
# =============================================================================
# Files in the same directory can access private (non-pub) items from each other.

[[case]]
name = "same_dir_access_private_fn"
spec = ["10.3:2"]
description = "Files in same directory can access private functions"
source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    utils.internal_helper()
}
"""
aux_files = { "utils.rue" = """
// Private function - no pub keyword
fn internal_helper() -> i32 {
    42
}
""" }
exit_code = 42

[[case]]
name = "same_dir_access_pub_fn"
spec = ["10.3:4"]
description = "Files in same directory can access public functions"
source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    utils.public_helper()
}
"""
aux_files = { "utils.rue" = """
pub fn public_helper() -> i32 {
    42
}
""" }
exit_code = 42

[[case]]
name = "same_dir_access_private_struct"
spec = ["10.3:2"]
description = "Files in same directory can access private structs"
source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    let InternalPoint = utils.InternalPoint;
    let p = InternalPoint { x: 20, y: 22 };
    p.x + p.y
}
"""
aux_files = { "utils.rue" = """
// Private struct - no pub keyword
struct InternalPoint { x: i32, y: i32 }
""" }
exit_code = 42

[[case]]
name = "same_dir_access_private_enum"
spec = ["10.3:2"]
description = "Files in same directory can access private enums"
source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    let s = utils.InternalStatus.Active;
    match s {
        utils.InternalStatus.Active => 42,
        utils.InternalStatus.Inactive => 0,
    }
}
"""
aux_files = { "utils.rue" = """
// Private enum - no pub keyword
enum InternalStatus { Active, Inactive }
""" }
exit_code = 42

# =============================================================================
# Cross-Directory Access (Different Directories)
# =============================================================================
# Files in different directories can only access pub items.

[[case]]
name = "cross_dir_access_pub_fn"
spec = ["10.3:4"]
description = "Files in different directories can access public functions"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils.rue");
    utils.public_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
pub fn public_fn() -> i32 {
    42
}
""" }
exit_code = 42

[[case]]
name = "cross_dir_access_private_fn_error"
spec = ["10.3:3"]
description = "Files in different directories cannot access private functions"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils.rue");
    utils.private_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
fn private_fn() -> i32 {
    42
}
""" }
compile_fail = true
error_contains = "private"

[[case]]
name = "cross_dir_access_pub_struct"
spec = ["10.3:4"]
description = "Files in different directories can access public structs"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils.rue");
    let PublicPoint = utils.PublicPoint;
    let p = PublicPoint { x: 10, y: 32 };
    p.x + p.y
}
"""
aux_files = { "subdir/utils.rue" = """
pub struct PublicPoint { x: i32, y: i32 }
""" }
exit_code = 42

[[case]]
name = "cross_dir_access_private_struct_error"
spec = ["10.3:3"]
description = "Files in different directories cannot access private structs"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils.rue");
    let PrivatePoint = utils.PrivatePoint;
    let p = PrivatePoint { x: 10, y: 32 };
    p.x + p.y
}
"""
aux_files = { "subdir/utils.rue" = """
struct PrivatePoint { x: i32, y: i32 }
""" }
compile_fail = true
error_contains = "private"

[[case]]
name = "cross_dir_access_pub_enum"
spec = ["10.3:4"]
description = "Files in different directories can access public enums"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils.rue");
    let s = utils.PublicStatus.On;
    match s {
        utils.PublicStatus.On => 42,
        utils.PublicStatus.Off => 0,
    }
}
"""
aux_files = { "subdir/utils.rue" = """
pub enum PublicStatus { On, Off }
""" }
exit_code = 42

[[case]]
name = "cross_dir_access_private_enum_error"
spec = ["10.3:3"]
description = "Files in different directories cannot access private enums"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils.rue");
    let s = utils.PrivateStatus.On;
    0
}
"""
aux_files = { "subdir/utils.rue" = """
enum PrivateStatus { On, Off }
""" }
compile_fail = true
error_contains = "private"

# =============================================================================
# Nested Submodule Access
# =============================================================================
# Tests for the foo/_foo.rue directory module pattern (facade inside, RUE-137).

[[case]]
name = "directory_module_intra_access"
spec = ["10.3:5"]
description = "Files within a directory module can access each other's private items"
source = """
fn main() -> i32 {
    let utils = @import("utils");
    utils.format()
}
"""
aux_files = { "utils/_utils.rue" = """
// Re-export the strings module functions
const strings = @import("strings.rue");

pub fn format() -> i32 {
    strings.internal_format()
}
""", "utils/strings.rue" = """
// Private function - accessible from _utils.rue since same directory module
fn internal_format() -> i32 {
    42
}
""" }
exit_code = 42

# =============================================================================
# Unqualified Cross-Directory Access (RUE-37, RUE-180)
# =============================================================================
# Unqualified references resolve module-locally (10.3:8): a function of an
# imported file — private OR pub, same directory or another — does not
# resolve unqualified. Cross-module access is spelled through the module
# binding; privacy through the binding is E0706 (10.3:7, 10.4:18).

[[case]]
name = "cross_dir_unqualified_private_fn_error"
spec = ["10.3:8"]
description = "Unqualified call to a private function of an imported module in another directory is rejected"
source = """
const utils = @import("subdir/utils.rue");

fn main() -> i32 {
    internal_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
fn internal_fn() -> i32 {
    42
}
""" }
compile_fail = true
error_contains = "undefined function 'internal_fn'"

[[case]]
name = "cross_dir_unqualified_pub_fn_rejected"
spec = ["10.3:8"]
description = "Unqualified call to a pub function of an imported module is rejected; use module-qualified access"
source = """
const utils = @import("subdir/utils.rue");

fn main() -> i32 {
    public_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
pub fn public_fn() -> i32 {
    42
}
""" }
compile_fail = true
error_contains = "undefined function 'public_fn'"

[[case]]
name = "same_dir_unqualified_private_fn_rejected"
spec = ["10.3:2", "10.3:8"]
description = "Unqualified call to a private function of an imported file in the SAME directory is rejected; use module-qualified access"
source = """
const utils = @import("utils.rue");

fn main() -> i32 {
    internal_fn()
}
"""
aux_files = { "utils.rue" = """
fn internal_fn() -> i32 {
    42
}
""" }
compile_fail = true
error_contains = "undefined function 'internal_fn'"

# =============================================================================
# Unqualified Cross-Directory Access: Structs and Constants (RUE-183)
# =============================================================================
# Unqualified lookup does not import another module's item names into the
# current file. These references are rejected as unknown names before privacy
# applies; module-qualified references exercise the privacy rule.

[[case]]
name = "cross_dir_unqualified_private_struct_error"
spec = ["10.3:7"]
description = "Unqualified struct literal + annotation naming a private struct of an imported module in another directory is rejected"
source = """
const defs = @import("subdir/defs.rue");

fn main() -> i32 {
    let p: Point = Point { x: 40, y: 2 };
    p.x + p.y
}
"""
aux_files = { "subdir/defs.rue" = """
struct Point {
    x: i32,
    y: i32,
}
""" }
compile_fail = true
error_contains = "unknown type 'Point'"

[[case]]
name = "cross_dir_unqualified_private_const_error"
spec = ["10.3:7"]
description = "Unqualified read of a private constant of an imported module in another directory is rejected"
source = """
const defs = @import("subdir/defs.rue");

fn main() -> i32 {
    LIMIT
}
"""
aux_files = { "subdir/defs.rue" = """
const LIMIT: i32 = 42;
""" }
compile_fail = true
error_contains = "undefined variable 'LIMIT'"

# =============================================================================
# Unqualified Cross-Directory Access: Enums (RUE-185)
# =============================================================================
# Unqualified lookup does not import enum names from another module into the
# current file. These references are rejected as unknown names before privacy
# applies; module-qualified references exercise the privacy rule.

[[case]]
name = "cross_dir_unqualified_private_enum_error"
spec = ["10.3:7"]
description = "Unqualified annotation + variant construction naming a private enum of an imported module in another directory is rejected"
source = """
const defs = @import("subdir/defs.rue");

fn main() -> i32 {
    let c: Color = Color.Blue;
    0
}
"""
aux_files = { "subdir/defs.rue" = """
enum Color {
    Red,
    Green,
    Blue,
}
""" }
compile_fail = true
error_contains = "unknown type 'Color'"
