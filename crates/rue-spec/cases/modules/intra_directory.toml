[section]
id = "modules.intra_directory"
name = "Intra-Directory Visibility"
description = "Files within the same directory can access each other's non-pub items. Per ADR-0026, pub only affects cross-directory visibility."

# =============================================================================
# Intra-Directory Access (Same Directory)
# =============================================================================
# Files in the same directory can access private (non-pub) items from each other.

[[case]]
name = "same_dir_access_private_fn"
spec = ["10.3:2"]
description = "Files in same directory can access private functions"
source = """
fn main() -> i32 {
    let utils = @import("utils");
    utils.internal_helper()
}
"""
aux_files = { "utils.rue" = """
// Private function - no pub keyword
fn internal_helper() -> i32 {
    42
}
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "same_dir_access_pub_fn"
spec = ["10.3:4"]
description = "Files in same directory can access public functions"
source = """
fn main() -> i32 {
    let utils = @import("utils");
    utils.public_helper()
}
"""
aux_files = { "utils.rue" = """
pub fn public_helper() -> i32 {
    42
}
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "same_dir_access_private_struct"
spec = ["10.3:2"]
description = "Files in same directory can access private structs"
source = """
fn main() -> i32 {
    let utils = @import("utils");
    let InternalPoint = utils.InternalPoint;
    let p = InternalPoint { x: 20, y: 22 };
    p.x + p.y
}
"""
aux_files = { "utils.rue" = """
// Private struct - no pub keyword
struct InternalPoint { x: i32, y: i32 }
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "same_dir_access_private_enum"
spec = ["10.3:2"]
description = "Files in same directory can access private enums"
source = """
fn main() -> i32 {
    let utils = @import("utils");
    let s = utils.InternalStatus::Active;
    match s {
        utils.InternalStatus::Active => 42,
        utils.InternalStatus::Inactive => 0,
    }
}
"""
aux_files = { "utils.rue" = """
// Private enum - no pub keyword
enum InternalStatus { Active, Inactive }
""" }
pass_aux_files = true
exit_code = 42

# =============================================================================
# Cross-Directory Access (Different Directories)
# =============================================================================
# Files in different directories can only access pub items.

[[case]]
name = "cross_dir_access_pub_fn"
spec = ["10.3:4"]
description = "Files in different directories can access public functions"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils");
    utils.public_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
pub fn public_fn() -> i32 {
    42
}
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "cross_dir_access_private_fn_error"
spec = ["10.3:3"]
description = "Files in different directories cannot access private functions"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils");
    utils.private_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
fn private_fn() -> i32 {
    42
}
""" }
pass_aux_files = true
compile_fail = true
error_contains = "private"

[[case]]
name = "cross_dir_access_pub_struct"
spec = ["10.3:4"]
description = "Files in different directories can access public structs"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils");
    let PublicPoint = utils.PublicPoint;
    let p = PublicPoint { x: 10, y: 32 };
    p.x + p.y
}
"""
aux_files = { "subdir/utils.rue" = """
pub struct PublicPoint { x: i32, y: i32 }
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "cross_dir_access_private_struct_error"
spec = ["10.3:3"]
description = "Files in different directories cannot access private structs"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils");
    let PrivatePoint = utils.PrivatePoint;
    let p = PrivatePoint { x: 10, y: 32 };
    p.x + p.y
}
"""
aux_files = { "subdir/utils.rue" = """
struct PrivatePoint { x: i32, y: i32 }
""" }
pass_aux_files = true
compile_fail = true
error_contains = "private"

[[case]]
name = "cross_dir_access_pub_enum"
spec = ["10.3:4"]
description = "Files in different directories can access public enums"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils");
    let s = utils.PublicStatus::On;
    match s {
        utils.PublicStatus::On => 42,
        utils.PublicStatus::Off => 0,
    }
}
"""
aux_files = { "subdir/utils.rue" = """
pub enum PublicStatus { On, Off }
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "cross_dir_access_private_enum_error"
spec = ["10.3:3"]
description = "Files in different directories cannot access private enums"
source = """
fn main() -> i32 {
    let utils = @import("subdir/utils");
    let s = utils.PrivateStatus::On;
    0
}
"""
aux_files = { "subdir/utils.rue" = """
enum PrivateStatus { On, Off }
""" }
pass_aux_files = true
compile_fail = true
error_contains = "private"

# =============================================================================
# Nested Submodule Access
# =============================================================================
# Tests for the foo/_foo.rue directory module pattern (facade inside, RUE-137).

[[case]]
name = "directory_module_intra_access"
spec = ["10.3:5"]
description = "Files within a directory module can access each other's private items"
source = """
fn main() -> i32 {
    let utils = @import("utils");
    utils.format()
}
"""
aux_files = { "utils/_utils.rue" = """
// Re-export the strings module functions
const strings = @import("utils/strings");

pub fn format() -> i32 {
    strings.internal_format()
}
""", "utils/strings.rue" = """
// Private function - accessible from _utils.rue since same directory module
fn internal_format() -> i32 {
    42
}
""" }
pass_aux_files = true
exit_code = 42

# =============================================================================
# Unqualified Cross-Directory Access (RUE-37, RUE-180)
# =============================================================================
# Privacy is uniform (10.3:7): a private function in a file in another
# directory is rejected when called unqualified (E0460), whether that file
# was imported or only listed explicitly. The flat namespace (10.5:2) only
# resolves names — pub items remain callable without imports (10.3:8).

[[case]]
name = "cross_dir_unqualified_private_fn_error"
spec = ["10.3:7"]
description = "Unqualified call to a private function of an imported module in another directory is rejected"
source = """
const utils = @import("subdir/utils");

fn main() -> i32 {
    internal_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
fn internal_fn() -> i32 {
    42
}
""" }
compile_fail = true
error_contains = "is private (defined in"

[[case]]
name = "cross_dir_unqualified_pub_fn_allowed"
spec = ["10.3:7", "10.5:2"]
description = "Unqualified call to a pub function of an imported module still resolves (transitional flat namespace)"
source = """
const utils = @import("subdir/utils");

fn main() -> i32 {
    public_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
pub fn public_fn() -> i32 {
    42
}
""" }
exit_code = 42

[[case]]
name = "same_dir_unqualified_private_fn_allowed"
spec = ["10.3:2", "10.3:7"]
description = "Unqualified call to a private function of an imported file in the SAME directory is allowed (intra-directory visibility)"
source = """
const utils = @import("utils");

fn main() -> i32 {
    internal_fn()
}
"""
aux_files = { "utils.rue" = """
fn internal_fn() -> i32 {
    42
}
""" }
exit_code = 42

[[case]]
name = "flat_multifile_unqualified_private_fn_error"
spec = ["10.3:7", "10.3:8"]
description = "Uniform privacy (RUE-180): a never-imported file listed explicitly is still private — cross-directory unqualified private call is E0460"
source = """
fn main() -> i32 {
    internal_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
fn internal_fn() -> i32 {
    42
}
""" }
pass_aux_files = true
compile_fail = true
error_contains = "is private (defined in"

[[case]]
name = "flat_multifile_unqualified_pub_fn_allowed"
spec = ["10.3:8", "10.5:2"]
description = "The flat namespace still resolves names without imports: a pub function in another never-imported directory is callable unqualified"
source = """
fn main() -> i32 {
    public_fn()
}
"""
aux_files = { "subdir/utils.rue" = """
pub fn public_fn() -> i32 {
    42
}
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "flat_multifile_same_dir_private_fn_allowed"
spec = ["10.3:2", "10.3:8"]
description = "Intra-directory visibility (ADR-0026) is unchanged: a private function in another listed file in the same directory is callable unqualified"
source = """
fn main() -> i32 {
    internal_fn()
}
"""
aux_files = { "utils.rue" = """
fn internal_fn() -> i32 {
    42
}
""" }
pass_aux_files = true
exit_code = 42

# =============================================================================
# Unqualified Cross-Directory Access: Structs and Constants (RUE-183)
# =============================================================================
# The uniform privacy rule (10.3:7) covers every item kind, not just
# functions: naming a private struct (annotation or literal) or reading a
# private constant from another directory is E0460, imported or flat-listed.

[[case]]
name = "cross_dir_unqualified_private_struct_error"
spec = ["10.3:7"]
description = "Unqualified struct literal + annotation naming a private struct of an imported module in another directory is rejected"
source = """
const defs = @import("subdir/defs");

fn main() -> i32 {
    let p: Point = Point { x: 40, y: 2 };
    p.x + p.y
}
"""
aux_files = { "subdir/defs.rue" = """
struct Point {
    x: i32,
    y: i32,
}
""" }
compile_fail = true
error_contains = "struct `Point` is private (defined in"

[[case]]
name = "cross_dir_unqualified_private_const_error"
spec = ["10.3:7"]
description = "Unqualified read of a private constant of an imported module in another directory is rejected"
source = """
const defs = @import("subdir/defs");

fn main() -> i32 {
    LIMIT
}
"""
aux_files = { "subdir/defs.rue" = """
const LIMIT: i32 = 42;
""" }
compile_fail = true
error_contains = "constant `LIMIT` is private (defined in"

[[case]]
name = "flat_multifile_unqualified_private_struct_error"
spec = ["10.3:7", "10.3:8"]
description = "Uniform privacy: a private struct in a never-imported, explicitly listed file in another directory is not nameable unqualified"
source = """
fn main() -> i32 {
    let p: Point = Point { x: 40, y: 2 };
    p.x + p.y
}
"""
aux_files = { "subdir/defs.rue" = """
struct Point {
    x: i32,
    y: i32,
}
""" }
pass_aux_files = true
compile_fail = true
error_contains = "struct `Point` is private (defined in"

[[case]]
name = "flat_multifile_unqualified_private_const_error"
spec = ["10.3:7", "10.3:8"]
description = "Uniform privacy: a private constant in a never-imported, explicitly listed file in another directory is not readable unqualified"
source = """
fn main() -> i32 {
    LIMIT
}
"""
aux_files = { "subdir/defs.rue" = """
const LIMIT: i32 = 42;
""" }
pass_aux_files = true
compile_fail = true
error_contains = "constant `LIMIT` is private (defined in"

[[case]]
name = "cross_dir_const_initializer_private_const_error"
spec = ["10.3:7"]
description = "A constant initializer reading a private constant from another directory is rejected too"
source = """
const X: i32 = LIMIT;

fn main() -> i32 {
    X
}
"""
aux_files = { "subdir/defs.rue" = """
const LIMIT: i32 = 42;
""" }
pass_aux_files = true
compile_fail = true
error_contains = "constant `LIMIT` is private (defined in"

[[case]]
name = "flat_multifile_unqualified_pub_struct_and_const_allowed"
spec = ["10.3:8", "10.5:2"]
description = "The flat namespace still resolves pub structs and constants across directories without imports"
source = """
fn main() -> i32 {
    let p: Point = Point { x: 30, y: 2 };
    p.x + p.y + BONUS
}
"""
aux_files = { "subdir/defs.rue" = """
pub struct Point {
    x: i32,
    y: i32,
}
pub const BONUS: i32 = 10;
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "flat_multifile_same_dir_private_struct_and_const_allowed"
spec = ["10.3:2", "10.3:8"]
description = "Intra-directory visibility (ADR-0026) is unchanged: private structs and constants in another listed file in the same directory are usable unqualified"
source = """
fn main() -> i32 {
    let p: Point = Point { x: 30, y: 2 };
    p.x + p.y + BONUS
}
"""
aux_files = { "defs.rue" = """
struct Point {
    x: i32,
    y: i32,
}
const BONUS: i32 = 10;
""" }
pass_aux_files = true
exit_code = 42

# =============================================================================
# Unqualified Cross-Directory Access: Enums (RUE-185)
# =============================================================================
# The uniform privacy rule (10.3:7) covers enums too: naming a private enum
# from another directory — in a type annotation, a variant construction, or a
# match pattern — is E0460, imported or flat-listed.

[[case]]
name = "cross_dir_unqualified_private_enum_error"
spec = ["10.3:7"]
description = "Unqualified annotation + variant construction naming a private enum of an imported module in another directory is rejected"
source = """
const defs = @import("subdir/defs");

fn main() -> i32 {
    let c: Color = Color::Blue;
    0
}
"""
aux_files = { "subdir/defs.rue" = """
enum Color {
    Red,
    Green,
    Blue,
}
""" }
compile_fail = true
error_contains = "enum `Color` is private (defined in"

[[case]]
name = "flat_multifile_unqualified_private_enum_construction_error"
spec = ["10.3:7", "10.3:8"]
description = "Uniform privacy: constructing a variant of a private enum in a never-imported, explicitly listed file in another directory is rejected"
source = """
fn main() -> i32 {
    let c = Color::Blue;
    0
}
"""
aux_files = { "subdir/defs.rue" = """
enum Color {
    Red,
    Green,
    Blue,
}
""" }
pass_aux_files = true
compile_fail = true
error_contains = "enum `Color` is private (defined in"

[[case]]
name = "flat_multifile_private_enum_match_pattern_error"
spec = ["10.3:7", "10.3:8"]
description = "A match pattern names the enum unqualified too: matching on a private cross-directory enum is rejected even when the scrutinee arrives through a pub function"
source = """
fn main() -> i32 {
    match make() {
        Color::Red => 1,
        Color::Green => 2,
        Color::Blue => 3,
    }
}
"""
aux_files = { "subdir/defs.rue" = """
enum Color {
    Red,
    Green,
    Blue,
}
pub fn make() -> Color {
    Color::Green
}
""" }
pass_aux_files = true
compile_fail = true
error_contains = "enum `Color` is private (defined in"

[[case]]
name = "flat_multifile_unqualified_pub_enum_allowed"
spec = ["10.3:8", "10.5:2"]
description = "The flat namespace still resolves pub enums across directories without imports: annotation, construction, and match all work"
source = """
fn main() -> i32 {
    let c: Color = Color::Blue;
    match c {
        Color::Red => 10,
        Color::Green => 20,
        Color::Blue => 42,
    }
}
"""
aux_files = { "subdir/defs.rue" = """
pub enum Color {
    Red,
    Green,
    Blue,
}
""" }
pass_aux_files = true
exit_code = 42

[[case]]
name = "flat_multifile_same_dir_private_enum_allowed"
spec = ["10.3:2", "10.3:8"]
description = "Intra-directory visibility (ADR-0026) is unchanged: a private enum in another listed file in the same directory is usable unqualified"
source = """
fn main() -> i32 {
    let c: Color = Color::Green;
    match c {
        Color::Red => 1,
        Color::Green => 42,
        Color::Blue => 3,
    }
}
"""
aux_files = { "defs.rue" = """
enum Color {
    Red,
    Green,
    Blue,
}
""" }
pass_aux_files = true
exit_code = 42

# The uniform privacy rule (10.3:7) also covers a comptime type constructor
# (`fn Secret(comptime T) -> type`) applied in type-annotation position: naming
# a private constructor from another directory in a `let x: Secret(i32)`
# annotation is E0460, exactly as a value/call reference is. Before RUE-283 the
# annotation path skipped this check, leaking the private constructor
# cross-directory (a privacy-soundness hole).

[[case]]
name = "cross_dir_private_type_ctor_annotation_error"
spec = ["10.3:7"]
description = "Applying a private comptime type constructor in type-annotation position from another directory is rejected (E0460)"
source = """
fn main() -> i32 {
    let s: Secret(i32) = mk();
    s.v
}
"""
aux_files = { "subdir/lib.rue" = """
fn Secret(comptime T: type) -> type { struct { v: T } }
pub fn mk() -> Secret(i32) { let S = Secret(i32); S { v: 7 } }
""" }
pass_aux_files = true
compile_fail = true
error_contains = "function `Secret` is private (defined in"

[[case]]
name = "cross_dir_pub_type_ctor_annotation_allowed"
spec = ["10.3:7", "10.3:8"]
description = "A pub comptime type constructor applied as an annotation across directories is allowed (flat namespace resolves the name)"
source = """
fn main() -> i32 {
    let s: Secret(i32) = mk();
    s.v
}
"""
aux_files = { "subdir/lib.rue" = """
pub fn Secret(comptime T: type) -> type { struct { v: T } }
pub fn mk() -> Secret(i32) { let S = Secret(i32); S { v: 7 } }
""" }
pass_aux_files = true
exit_code = 7

[[case]]
name = "same_dir_private_type_ctor_annotation_allowed"
spec = ["10.3:2", "10.3:7"]
description = "Intra-directory visibility (ADR-0026) is unchanged: a private comptime type constructor applied as an annotation in another listed file in the same directory is allowed"
source = """
fn main() -> i32 {
    let s: Secret(i32) = mk();
    s.v
}
"""
aux_files = { "lib.rue" = """
fn Secret(comptime T: type) -> type { struct { v: T } }
pub fn mk() -> Secret(i32) { let S = Secret(i32); S { v: 7 } }
""" }
pass_aux_files = true
exit_code = 7
