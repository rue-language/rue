[section]
id = "modules.import"
spec_chapter = "4.13"
name = "Import Expressions"
description = "The @import builtin for importing modules."

# =============================================================================
# @import Syntax Verification
# =============================================================================

# These tests verify that @import accepts valid syntax and resolves modules
# correctly per ADR-0026.

[[case]]
name = "import_basic_syntax"
spec = ["4.13:79", "4.13:80", "4.13:82", "10.2:1"]
description = "@import with string argument is accepted"
source = """
fn main() -> i32 {
    let m = @import("foo.rue");
    0
}
"""
aux_files = { "foo.rue" = "fn f() -> i32 { 1 }" }
exit_code = 0

[[case]]
name = "import_used_in_const"
spec = ["4.13:79", "4.13:80"]
description = "@import can be used in a const binding (typical pattern)"
source = """
fn main() -> i32 {
    let math = @import("math.rue");
    0
}
"""
aux_files = { "math.rue" = "fn add(a: i32, b: i32) -> i32 { a + b }" }
exit_code = 0

[[case]]
name = "import_multiple_files"
spec = ["4.13:79"]
description = "Multiple @import calls in same file"
source = """
fn main() -> i32 {
    let a = @import("a.rue");
    let b = @import("b.rue");
    0
}
"""
aux_files = { "a.rue" = "fn a_fn() -> i32 { 1 }", "b.rue" = "fn b_fn() -> i32 { 2 }" }
exit_code = 0

[[case]]
name = "import_nested_path"
spec = ["4.13:79", "4.13:82"]
description = "@import with nested path"
source = """
fn main() -> i32 {
    let utils = @import("utils/strings.rue");
    0
}
"""
aux_files = { "utils/strings.rue" = "fn format(x: i32) -> i32 { x }" }
exit_code = 0

# =============================================================================
# @import Argument Validation Errors
# =============================================================================

[[case]]
name = "import_no_args_error"
spec = ["4.13:80"]
description = "@import with no arguments is an error"
source = """
fn main() -> i32 {
    let m = @import();
    0
}
"""
compile_fail = true
error_contains = "expects 1 argument"

[[case]]
name = "import_integer_arg_error"
spec = ["4.13:84"]
description = "@import with integer argument should fail"
source = """
fn main() -> i32 {
    let m = @import(42);
    0
}
"""
compile_fail = true
error_contains = "requires a string literal"

[[case]]
name = "import_multiple_args_error"
spec = ["4.13:80"]
description = "@import with multiple arguments should fail"
source = """
fn main() -> i32 {
    let m = @import("a.rue", "b.rue");
    0
}
"""
compile_fail = true
error_contains = "expects 1 argument"

[[case]]
name = "import_module_not_found_error"
spec = ["4.13:83"]
description = "@import with nonexistent module produces error"
source = """
fn main() -> i32 {
    let m = @import("nonexistent");
    0
}
"""
compile_fail = true
error_contains = "cannot find module"

# =============================================================================
# Coexisting module forms and project-root identity (ADR-0078)
# =============================================================================

[[case]]
name = "both_forms_coexist_extensionless_names_facade"
spec = ["10.1:5", "10.2:1"]
description = "foo.rue and foo/_foo.rue may coexist; the extensionless import names the facade alone (E0708 is retired)"
source = """
fn main() -> i32 {
    let m = @import("foo");
    m.b()
}
"""
aux_files = { "foo.rue" = "pub fn a() -> i32 { 1 }", "foo/_foo.rue" = "pub fn b() -> i32 { 2 }" }
exit_code = 2

[[case]]
name = "both_forms_coexist_extension_names_file"
spec = ["10.1:5", "10.2:1"]
description = "With both forms present, the extensioned spelling reaches the file module"
source = """
fn main() -> i32 {
    let m = @import("foo.rue");
    m.a()
}
"""
aux_files = { "foo.rue" = "pub fn a() -> i32 { 1 }", "foo/_foo.rue" = "pub fn b() -> i32 { 2 }" }
exit_code = 1

[[case]]
name = "import_escaping_project_root_is_rejected"
spec = ["4.13:89", "10.2:7"]
description = "A relative import whose normalized candidate leaves the project root is E0713; no filesystem probe is attempted"
source = """
fn main() -> i32 {
    let o = @import("../outside.rue");
    0
}
"""
compile_fail = true
error_contains = "escapes the project root"

[[case]]
name = "const_module_reexport_member_chain"
spec = ["4.13:81", "10.4:3"]
description = "A pub const holding a module (ADR-0026 re-export idiom) is accessible as a member; chained access reaches the inner module's functions (RUE-136)"
source = """
fn main() -> i32 {
    let outer = @import("outer");
    outer.inner.value()
}
"""
aux_files = { "outer/_outer.rue" = """
pub const inner = @import("inner.rue");
""", "outer/inner.rue" = """
pub fn value() -> i32 { 42 }
""" }
exit_code = 42

[[case]]
name = "private_const_reexport_not_visible"
spec = ["4.13:86", "10.4:4"]
description = "A non-pub const module re-export is not accessible from outside the directory"
source = """
fn main() -> i32 {
    let outer = @import("outer");
    outer.inner.value()
}
"""
aux_files = { "outer/_outer.rue" = """
const inner = @import("inner.rue");
""", "outer/inner.rue" = """
pub fn value() -> i32 { 42 }
""" }
compile_fail = true
error_contains = "private"

[[case]]
name = "module_member_call_per_file_membership"
spec = ["4.13:90"]
description = "A pub function from a different file in the same compilation is not a member of an unrelated module (RUE-140)"
source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    let other = @import("other.rue");
    let _ = other.sneaky();
    utils.sneaky()
}
"""
aux_files = { "utils.rue" = "pub fn real() -> i32 { 1 }", "other.rue" = "pub fn sneaky() -> i32 { 99 }" }
compile_fail = true
error_contains = "has no member"
