[section]
id = "cli.string_escape_recovery"
name = "String escape error recovery"
description = """
RUE-535: an invalid escape in a properly-TERMINATED string must produce only
the invalid-escape diagnostic (E0003). The lexer used to bail mid-string, then
read the real closing quote as a fresh opening quote and emit a spurious
E0004 unterminated-string error for the rest of the line.
"""

[[case]]
name = "invalid_escape_no_spurious_unterminated"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s = "abc\\qtail";
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0003", "invalid escape"]
compile_stderr_not_contains = ["E0004", "unterminated"]
