# Generic types (comptime `-> type` function results) applied DIRECTLY in a
# signature or annotation: `fn divide(...) -> Result(i32, i32)` (RUE-241).
#
# Before RUE-241 the type grammar rejected a type-function *call* in type
# position (parser E0100), so a function could not return/accept a generic
# `Result`/`Option` without a named `const` alias. The parser now accepts
# `Name(args...)` as a type expression and sema reduces the comptime type call
# to the same monomorphized enum the value-position call produces — the real
# unblocker for Option/Result error handling (RUE-6). These drive the real
# driver end-to-end and assert exact behavior.

[section]
id = "cli.generic_type_call_sigs"
name = "Generic type-call signatures"
description = "A comptime `-> type` call used directly as a return/param/annotation type (RUE-241)."

# --- Direct call in RETURN position (the headline repro) ---

[[case]]
name = "result_return_direct"
description = "fn divide(...) -> Result(i32, i32) compiles, is called, and its result is matched."
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn divide(a: i32, b: i32) -> Result(i32, i32) {
    if b == 0 { let R = Result(i32, i32); R.Err(1) }
    else { let R = Result(i32, i32); R.Ok(a / b) }
}
fn main() -> i32 {
    let R = Result(i32, i32);
    match divide(84, 2) { R.Ok(v) => v, R.Err(e) => 0 - e }
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# --- Direct call in PARAMETER position ---

[[case]]
name = "result_param_direct"
description = "A generic type used directly as a parameter type: fn unwrap_or(r: Result(i32, i32), ...)."
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn unwrap_or(r: Result(i32, i32), d: i32) -> i32 {
    let R = Result(i32, i32);
    match r { R.Ok(v) => v, R.Err(e) => d }
}
fn divide(a: i32, b: i32) -> Result(i32, i32) {
    let R = Result(i32, i32);
    if b == 0 { R.Err(1) } else { R.Ok(a / b) }
}
fn main() -> i32 { unwrap_or(divide(84, 2), 0) }
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# --- Nested type-function calls compose in type position ---

[[case]]
name = "nested_result_of_option_direct"
description = "Result(Option(i32), i32) as a direct return type; nested type calls compose."
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn make() -> Result(Option(i32), i32) {
    let O = Option(i32);
    let R = Result(Option(i32), i32);
    R.Ok(O.Some(42))
}
fn main() -> i32 {
    let O = Option(i32);
    let R = Result(Option(i32), i32);
    match make() {
        R.Ok(o) => match o { O.Some(v) => v, O.None => 0 },
        R.Err(e) => 0 - e
    }
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# --- Direct call in a LET ANNOTATION (falls out of the same resolver) ---

[[case]]
name = "result_let_annotation_direct"
description = "The same generic type written directly in a `let x: Result(i32, i32)` annotation."
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn divide(a: i32, b: i32) -> Result(i32, i32) {
    let R = Result(i32, i32);
    if b == 0 { R.Err(1) } else { R.Ok(a / b) }
}
fn main() -> i32 {
    let x: Result(i32, i32) = divide(84, 2);
    let R = Result(i32, i32);
    match x { R.Ok(v) => v, R.Err(e) => 0 - e }
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# --- A non-type-returning call in type position errors cleanly (no crash) ---

[[case]]
name = "value_fn_in_type_position_errors"
description = "Applying a value-returning function as a type is a clean E1200, not an ICE."
files = [{ path = "main.rue", source = """
fn some_value_fn() -> i32 { 5 }
fn f() -> some_value_fn() { 3 }
fn main() -> i32 { f() }
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E1200", "is not a type"]

# --- Arity mismatch in a type-call errors cleanly ---

[[case]]
name = "type_call_arity_mismatch_errors"
description = "Wrong number of type arguments to a type constructor is a clean E1200."
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn f() -> Result(i32) { 3 }
fn main() -> i32 { 0 }
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E1200", "expects 2 comptime type argument"]

# --- Type function applied to an ENCLOSING type parameter (RUE-272) ---
#
# Composing RUE-241 (type-call in a signature) with RUE-263
# (comptime-type-var-in-context): a generic function whose signature applies a
# constructor to its own type parameter (`fn wrap(comptime T: type, v: T) ->
# Option(T)`). The `T` in `Option(T)` resolves from the enclosing comptime
# parameter and monomorphizes at each call site — the milestone that makes
# generic FUNCTIONS OVER Option/Result usable, not just concrete
# instantiations.

[[case]]
name = "type_fn_over_enclosing_param_return"
description = "fn wrap(comptime T: type, v: T) -> Option(T): the enclosing T resolves and Some carries 42."
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn wrap(comptime T: type, v: T) -> Option(T) {
    let O = Option(T);
    O.Some(v)
}
fn main() -> i32 {
    let O = Option(i32);
    match wrap(i32, 42) { O.Some(x) => x, O.None => 0 }
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "type_fn_over_enclosing_param_two_instantiations"
description = "Two instantiations (i32 and bool) monomorphize independently: 40 + 2 = 42."
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn wrap(comptime T: type, v: T) -> Option(T) {
    let O = Option(T);
    O.Some(v)
}
fn main() -> i32 {
    let Oi = Option(i32);
    let a = match wrap(i32, 40) { Oi.Some(x) => x, Oi.None => 0 };
    let Ob = Option(bool);
    let b = match wrap(bool, true) { Ob.Some(x) => 2, Ob.None => 0 };
    a + b
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "type_fn_over_enclosing_param_array"
description = "Composes with [T; N]: fn first(comptime T: type, xs: [T; 2]) -> Option(T) returns xs[0]."
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn first(comptime T: type, xs: [T; 2]) -> Option(T) {
    let O = Option(T);
    O.Some(xs[0])
}
fn main() -> i32 {
    let arr = [7, 9];
    let O = Option(i32);
    match first(i32, arr) { O.Some(x) => x, O.None => 0 }
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 7

[[case]]
name = "type_fn_over_enclosing_param_nested"
description = "Nested Result(Option(T), i32) return type resolves and constructs through both layers."
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn wrap_ok(comptime T: type, v: T) -> Result(Option(T), i32) {
    let O = Option(T);
    let R = Result(Option(T), i32);
    R.Ok(O.Some(v))
}
fn main() -> i32 {
    let O = Option(i32);
    let R = Result(Option(i32), i32);
    match wrap_ok(i32, 42) {
        R.Ok(o) => match o { O.Some(v) => v, O.None => 0 },
        R.Err(e) => 0 - e,
    }
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "type_fn_over_enclosing_param_let_annotation"
description = "A `let x: Option(T)` annotation inside the generic body resolves T from the enclosing param."
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn wrap(comptime T: type, v: T) -> Option(T) {
    let O = Option(T);
    let x: Option(T) = O.Some(v);
    x
}
fn main() -> i32 {
    let O = Option(i32);
    match wrap(i32, 42) { O.Some(x) => x, O.None => 0 }
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# A local array annotation `[T; N]` whose element is a comptime type parameter
# used to ICE: specialization interns `[i32; N]` into the type pool only after
# sema had already snapshotted the pool for CFG/codegen, so drop analysis
# indexed an out-of-bounds ArrayTypeId (RUE-282). The pool is now re-snapshotted
# after specialization, so the specialized `[i32; 2]` reaches the backend.

[[case]]
name = "local_array_of_comptime_type_param_no_ice"
description = "RUE-282: `let y: [T; 2]` with a comptime type param T compiles and runs (no out-of-bounds ArrayTypeId ICE)."
files = [{ path = "main.rue", source = """
fn f(comptime T: type, x: T) -> i32 {
    let y: [T; 2] = [x, x];
    y[0] + y[1]
}
fn main() -> i32 { f(i32, 5) }
""" }]
exit_code = 10

[[case]]
name = "array_literal_of_comptime_type_param_no_ice"
description = "RUE-282: an array literal `[x, x]` of a comptime-type-param element (no annotation) also reaches codegen through a re-snapshotted pool."
files = [{ path = "main.rue", source = """
fn f(comptime T: type, x: T) -> i32 {
    let y = [x, x];
    y[0] + y[1]
}
fn main() -> i32 { f(i32, 21) }
""" }]
exit_code = 42

[[case]]
name = "concrete_local_array_control"
description = "Control for RUE-282: a concrete `[i32; 2]` local array (interned before the pool snapshot) still works."
files = [{ path = "main.rue", source = """
fn f(x: i32) -> i32 {
    let y: [i32; 2] = [x, x];
    y[0] + y[1]
}
fn main() -> i32 { f(5) }
""" }]
exit_code = 10

[[case]]
name = "malformed_deferred_type_call_preserves_source_diagnostic"
description = "Physicalizing a deferred generic signature preserves constructor arity errors instead of reporting an internal unresolved placeholder."
files = [{ path = "main.rue", source = """
fn Pair(comptime T: type, comptime U: type) -> type {
    struct { left: T, right: U }
}

fn take(comptime T: type, value: Pair(T)) -> i32 {
    1
}

fn main() -> i32 {
    take(i32, @panic("stop"))
}
""" }]
compile_fail = true
error_contains = ["expects 2", "provided"]

[[case]]
name = "dependent_comptime_value_kind_is_validated_before_reduction"
description = "A type constructor validates an unused comptime value against the type selected by its earlier type argument."
files = [{ path = "main.rue", source = """
const FLAG: bool = true;

fn Witness(comptime T: type, comptime value: T) -> type {
    struct { payload: T }
}

fn read(value: Witness(i32, FLAG)) -> i32 {
    value.payload
}

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["type mismatch", "i32", "bool"]

[[case]]
name = "dependent_comptime_value_range_is_validated_before_reduction"
description = "An unused comptime integer argument is range-checked against its substituted declared type."
files = [{ path = "main.rue", source = """
fn Witness(comptime T: type, comptime value: T) -> type {
    struct { payload: T }
}

fn read(value: Witness(i8, 300)) -> i32 {
    @intCast(value.payload)
}

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E1200", "outside the range", "i8"]

[[case]]
name = "callable_alias_is_not_a_comptime_value_argument"
description = "A callable alias cannot exploit the shared `type` sentinel to masquerade as a first-class comptime value."
files = [{ path = "main.rue", source = """
fn id(value: i32) -> i32 { value }
const F = id;

fn Witness(comptime T: type, comptime value: T) -> type {
    struct { marker: i32 }
}

fn bad(value: Witness(type, F)) -> i32 { value.marker }
fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E1200", "callable alias", "cannot be passed"]

[[case]]
name = "type_and_unit_values_remain_valid_comptime_arguments"
description = "Type metadata and unit remain valid values when a dependent comptime parameter concretely requires them."
files = [{ path = "main.rue", source = """
const META = i32;
const U: () = ();

fn Witness(comptime T: type, comptime value: T) -> type {
    struct { marker: i32 }
}

fn read_meta(value: Witness(type, META)) -> i32 { value.marker }
fn read_unit(value: Witness((), U)) -> i32 { value.marker }
fn main() -> i32 { 42 }
""" }]
exit_code = 42
