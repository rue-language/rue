[section]
id = "cli.deep_nesting"
name = "Deeply nested blocks compile in linear time (RUE-276)"
description = """
Regression coverage for RUE-276: the parser was O(2^depth) in block-nesting
depth because the RUE-210 leading-block-like rule required a `-` to follow and
otherwise let the general Pratt `expr` re-descend the same nested input (two
full descents per level). Depth 16 took ~1.6s and depth 20 timed out (>30s).
A 60-level nested block now compiles effectively instantly; the ordinary
implicit execution contract's strict 10s compile/runtime budgets turn any
return of the exponential blowup into a loud failure rather than a silent hang.
"""

# A 60-deep nest of bare blocks whose innermost value is 42. Every inner block
# is `}`-terminated, so with the fix each level is parsed exactly once.
[[case]]
name = "deep_nested_blocks_return_value"
files = [{ path = "main.rue", source = """
fn main() -> i32 { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { { {  42  } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } }
""" }]
exit_code = 42

# RUE-1107: three hundred sequential `if ... else ...` statements in one block.
# Each is complete at its closing brace with no separator (5.3:6), and none of
# them nests in the next, so the C.6:3 depth allowance of 256 levels must not
# be consumed by a sequence. The pre-parse nesting guard used to count every
# `else` toward the enclosing block until a separator and rejected the 257th
# statement with E0482; a sequence is parsed at the linear rate of A.2:1.
[[case]]
name = "sequential_if_else_statements_are_not_nesting"
