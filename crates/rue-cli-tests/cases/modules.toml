# ---------------------------------------------------------------------------
# RUE-239: top-level duplicate-name detection spans ALL item kinds
# (fn/struct/enum/const share one name space within a module, spec 10.3:1 +
# 10.5:1) and is order-independent. The check is PER-FILE (RUE-572, spec
# 10.5:2): same-named items in different loaded files are module-scoped and
# legal, in any CLI order. Reuses E0436 for cross-kind collisions; same-kind
# keeps its existing code (E0405 types, E0418 constants).
# ---------------------------------------------------------------------------

# const + fn with one name in DIFFERENT files: module-scoped, legal (RUE-572).
# RUE-767 modernized this from two flat positionals to a root that @imports the
# helper: b.rue (the root) still resolves its unqualified `shared()` to its own
# fn, while a.rue's same-named `shared` const stays module-scoped and does not
# collide.
[[case]]
name = "dup_const_fn_const_first"
description = "RUE-572: a const and a fn sharing a name in different files are module-scoped and coexist."
files = [
    { path = "a.rue", source = """
pub const shared: i32 = 5;
""" },
    { path = "b.rue", source = """
const a = @import("a.rue");

pub fn shared() -> i32 {
    100
}

fn main() -> i32 {
    shared()
}
""" },
]
args = ["b.rue", "-o", "prog"]
exit_code = 100

# RUE-767: this case was the order-swapped twin of the one above, pinning that
# flat positional order did not matter. With exactly one root source there is no
# positional order to vary, so it now asserts the extra-source refusal instead.
