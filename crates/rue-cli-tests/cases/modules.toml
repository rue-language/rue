name = "dup_const_fn_fn_first"
description = "RUE-767: a second positional source is refused (formerly the order-swap twin of dup_const_fn_const_first)."
files = [
    { path = "a.rue", source = "const shared: i32 = 5;\n" },
    { path = "b.rue", source = "fn main() -> i32 { 0 }\n" },
]
args = ["b.rue", "a.rue", "-o", "prog"]
compile_fail = true
error_contains = ["unexpected extra source file", "a.rue", "@import"]

