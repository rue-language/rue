# Module resolution from disk, through the real driver.
#
# The spec suite's disk-based import tests never CALL anything from the
# imported module (and all usage tests pass files on the CLI), which is why
# the breakage below went unnoticed. See RUE-14.

[section]
id = "cli.modules"
name = "Module imports from disk"
description = "@import resolution and loading as a user experiences it."

# Resolution alone works: an adjacent module can be found on disk.
[[case]]
name = "import_resolves_adjacent_file"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
exit_code = 0

# Calling into the imported module: the driver discovers @import references
# and loads the resolved files from disk transitively (RUE-14).
[[case]]
name = "import_call_through_local_let"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
stdout = "42\n"

# Top-level `const utils = @import("utils.rue")` — the idiomatic form from
# ADR-0026.
[[case]]
name = "import_call_through_top_level_const"
files = [
    { path = "main.rue", source = """
const utils = @import("utils.rue");

fn main() -> i32 {
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
stdout = "42\n"

[[case]]
name = "source_manifest_allows_escaped_hash_in_path"
description = "RUE-481: source manifest entries can escape # when it is part of a path."
files = [
    { path = "sources.manifest", source = """
main.rue
with\\#hash.rue # comment after an escaped path character
with\\#hash/_with\\#hash.rue # declared absent ambiguity arm
""" },
    { path = "main.rue", source = """
const helper = @import("with#hash.rue");

fn main() -> i32 {
    @dbg(helper.answer());
    0
}
""" },
    { path = "with#hash.rue", source = """
pub fn answer() -> i32 {
    42
}
""" },
]
args = ["--source-manifest", "sources.manifest", "main.rue", "-o", "prog"]
stdout = "42\n"

[[case]]
name = "source_manifest_allows_declared_import"
description = "RUE-445: a source manifest lists files the import graph is allowed to read."
files = [
    { path = "sources.manifest", source = """
# One source path per line, relative to this manifest file.
main.rue
utils.rue
""" },
    { path = "main.rue", source = """
const utils = @import("utils.rue");

fn main() -> i32 {
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
args = ["--source-manifest", "sources.manifest", "main.rue", "-o", "prog"]
stdout = "42\n"

[[case]]
name = "source_manifest_rejects_undeclared_root"
description = "RUE-448: the root source itself must be listed in the build-system manifest."
files = [
    { path = "sources.manifest", source = """
helper.rue
""" },
    { path = "main.rue", source = """
fn main() -> i32 {
    0
}
""" },
    { path = "helper.rue", source = """
pub fn helper() -> i32 {
    42
}
""" },
]
args = ["--source-manifest", "sources.manifest", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["root source", "main.rue", "not listed"]

[[case]]
name = "source_manifest_rejects_undeclared_import"
description = "RUE-503: import discovery rejects undeclared candidates from the source manifest without probing undeclared files."
files = [
    { path = "sources.manifest", source = """
main.rue
""" },
    { path = "main.rue", source = """
const utils = @import("utils.rue");

fn main() -> i32 {
    utils.triple(14)
}
""" },
]
args = ["--source-manifest", "sources.manifest", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["source manifest", "utils.rue", "not listed"]

[[case]]
name = "source_manifest_entries_are_not_semantic_roots"
description = "RUE-445: declaring a file in the manifest makes it available to import, but does not load it or make its bare names visible."
files = [
    { path = "sources.manifest", source = """
main.rue
helper.rue
""" },
    { path = "main.rue", source = """
fn main() -> i32 {
    helper()
}
""" },
    { path = "helper.rue", source = """
pub fn helper() -> i32 {
    42
}
""" },
]
args = ["--source-manifest", "sources.manifest", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["undefined function", "helper"]

[[case]]
name = "emit_deps_reports_root_and_import_graph"
description = "RUE-810: --emit deps reports the canonical topology, complete observations, and accepted reads as a versioned envelope."
files = [
    { path = "main.rue", source = """
const utils = @import("utils.rue");

fn main() -> i32 {
    utils.answer()
}
""" },
    { path = "utils.rue", source = """
const leaf = @import("leaf.rue");

pub fn answer() -> i32 {
    leaf.value()
}
""" },
    { path = "leaf.rue", source = """
pub fn value() -> i32 {
    42
}
""" },
    { path = "unused.rue", source = """
pub fn unused() -> i32 {
    99
}
""" },
]
args = ["--emit", "deps", "main.rue"]
compile_only = true
compile_stdout_contains = [
    "\"version\": 1",
    "\"status\": \"complete\"",
    "\"revision\": \"rue-dependency-revision-v1-sha256:",
    "\"topology\":",
    "\"root\": \"main.rue\"",
    "\"records\":",
    "main.rue",
    "utils.rue",
    "leaf.rue",
    "\"specifier\": \"utils.rue\"",
    "\"specifier\": \"leaf.rue\"",
    "\"status\": \"resolved\"",
    "\"observations\":",
    "\"status\": \"present_readable\"",
    "\"accepted_reads\":",
    "\"physical_identity\":",
    "\"content_fingerprint\":",
]
compile_stdout_not_contains = ["unused.rue"]

[[case]]
name = "emit_deps_ignores_unrelated_semantic_errors"
description = "RUE-499: --emit deps reports the discovered import graph without requiring body/type validation to succeed."
files = [
    { path = "main.rue", source = """
const utils = @import("utils.rue");

fn main() -> i32 {
    utils.answer() + nope
}
""" },
    { path = "utils.rue", source = """
pub fn answer() -> i32 {
    41
}
""" },
]
args = ["--emit", "deps", "main.rue"]
compile_only = true
compile_stdout_contains = [
    "\"version\": 1",
    "\"status\": \"complete\"",
    "main.rue",
    "utils.rue",
    "\"specifier\": \"utils.rue\"",
]
compile_stderr_not_contains = ["undefined variable", "nope", "E0201"]

[[case]]
name = "emit_deps_rejects_unresolved_import"
description = "RUE-810: --emit deps preserves a closed unresolved graph in an incomplete envelope and exits unsuccessfully."
files = [
    { path = "main.rue", source = """
const missing = @import("missing");

fn main() -> i32 {
    missing.answer()
}
""" },
]
args = ["--emit", "deps", "main.rue"]
compile_fail = true
error_contains = ["E0704", "missing"]
compile_stdout_contains = [
    "\"version\": 1",
    "\"status\": \"incomplete\"",
    "\"revision\": \"rue-dependency-revision-v1-sha256:",
    "\"specifier\": \"missing\"",
    "\"status\": \"missing\"",
    "\"status\": \"absent\"",
    "\"accepted_reads\":",
    "\"module\": \"main.rue\"",
]

[[case]]
name = "emit_deps_resolves_facade_when_both_forms_exist"
description = "ADR-0078: both module forms on disk resolve deterministically to the facade; the file spelling is never probed and the migration help names the extensioned spelling on a facade miss."
files = [
    { path = "main.rue", source = """
const helper = @import("helper");
fn main() -> i32 { 0 }
""" },
    { path = "helper.rue", source = """
pub fn file_value() -> i32 { 1 }
""" },
    { path = "helper/_helper.rue", source = """
pub fn directory_value() -> i32 { 2 }
""" },
]
args = ["--emit", "deps", "main.rue"]
compile_only = true
compile_stdout_contains = [
    "\"status\": \"complete\"",
    "\"module\": \"helper/_helper.rue\"",
]
compile_stderr_not_contains = ["E0708", "ambiguous"]

[[case]]
name = "extensionless_file_miss_suggests_extensioned_spelling"
description = "ADR-0078 migration diagnostic: an extensionless import with only {P}.rue present reports E0704 plus a help naming @import(\"thing.rue\"); the probe is presentation-only."
files = [
    { path = "main.rue", source = """
const thing = @import("thing");
fn main() -> i32 { 0 }
""" },
    { path = "thing.rue", source = """
pub fn t() -> i32 { 1 }
""" },
]
compile_fail = true
error_contains = ["E0704", "imported with its extension", "@import(\"thing.rue\")"]

[[case]]
name = "import_escaping_root_is_e0713"
description = "ADR-0078: a relative import whose normalized candidate leaves the project root is E0713 with no filesystem probe."
files = [
    { path = "main.rue", source = """
const nope = @import("../outside.rue");
fn main() -> i32 { 0 }
""" },
]
compile_fail = true
error_contains = ["E0713", "escapes the project root", "../outside.rue"]

[[case]]
name = "emit_deps_malformed_import_has_no_envelope"
description = "RUE-810: malformed import shape has no canonical unresolved topology and emits diagnostics without JSON."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    @import();
    0
}
""" },
]
args = ["--emit", "deps", "main.rue"]
compile_fail = true
error_contains = ["E0701", "expects 1 argument, found 0"]
compile_stdout_not_contains = ["\"version\": 1", "\"status\":"]

# RUE-767: this case formerly pinned that the canonical unresolved-import
# topology preceded mixed positional/import validation. With the flat positional
# surface removed, `--emit deps main.rue helper.rue` is refused at the CLI before
# discovery, so no deps envelope is produced. The unresolved-import envelope is
# still covered by `emit_deps_rejects_unresolved_import` above.
[[case]]
name = "emit_deps_mixed_positional_with_missing_prefers_incomplete_graph"
description = "RUE-767: a second positional source under --emit deps is refused before discovery."
files = [
    { path = "main.rue", source = """
const helper = @import("helper.rue");
const missing = @import("missing");
fn main() -> i32 { 0 }
""" },
    { path = "helper.rue", source = """
pub fn value() -> i32 { 42 }
""" },
]
args = ["--emit", "deps", "main.rue", "helper.rue"]
compile_fail = true
error_contains = ["unexpected extra source file", "helper.rue", "@import"]
compile_stdout_not_contains = ["\"status\":", "\"version\": 1"]

# RUE-767: this case formerly pinned that a normal compile reported the
# canonical unresolved import before mixed-source validation. The second
# positional is now refused at the CLI before discovery, so the unresolved
# import is never reached here; that ordering concern no longer exists.
[[case]]
name = "mixed_positional_with_missing_prefers_canonical_diagnostic"
description = "RUE-767: a second positional source is refused before import discovery."
files = [
    { path = "main.rue", source = """
const helper = @import("helper.rue");
const missing = @import("missing");
fn main() -> i32 { 0 }
""" },
    { path = "helper.rue", source = """
pub fn value() -> i32 { 42 }
""" },
]
args = ["main.rue", "helper.rue", "-o", "prog"]
compile_fail = true
error_contains = ["unexpected extra source file", "helper.rue", "@import"]
compile_stderr_not_contains = ["E0704"]

[[case]]
name = "missing_import_precedes_output_clobber_validation"
description = "RUE-810: a closed attempted import revision renders its canonical diagnostic before output-path validation."
files = [
    { path = "main.rue", source = """
const missing = @import("missing");
fn main() -> i32 { 0 }
""" },
]
args = ["main.rue", "-o", "main.rue"]
compile_fail = true
error_contains = ["E0704", "missing"]
compile_stderr_not_contains = ["also an input source file"]

[[case]]
name = "emit_deps_rejects_mixed_emit_stages"
description = "RUE-446: dependency JSON must not be interleaved with other --emit output."
files = [
    { path = "main.rue", source = """
fn main() -> i32 { 0 }
""" },
]
args = ["--emit", "deps", "--emit", "air", "main.rue"]
compile_fail = true
error_contains = ["--emit deps cannot be combined"]

# The `.rue`-suffixed form resolves from disk (when the module is not used).
[[case]]
name = "import_with_rue_extension"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
exit_code = 0

# Directory module: _utils.rue alongside a utils/ directory (ADR-0026).
# The facade lives INSIDE the directory (utils/_utils.rue), like the
# stdlib's std/_std.rue — ratified in RUE-137 after re-reading the cited
# matklad article (an earlier ADR revision wrongly placed it as a sibling).
[[case]]
name = "import_directory_module_call"
files = [
    { path = "main.rue", source = """
const utils = @import("utils");

fn main() -> i32 {
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "utils/_utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
    { path = "utils/helpers.rue", source = """
pub fn unused() -> i32 {
    0
}
""" },
]
stdout = "42\n"

# A sibling _utils.rue (the rejected pre-RUE-137 layout) is NOT a module
# facade: the import must fail cleanly, not silently half-work.
[[case]]
name = "sibling_facade_is_not_a_directory_module"
files = [
    { path = "main.rue", source = """
const utils = @import("utils.rue");

fn main() -> i32 {
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "_utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
    { path = "utils/helpers.rue", source = """
pub fn unused() -> i32 {
    0
}
""" },
]
compile_fail = true
error_contains = ["E0704"]

# The standard library via a std/ directory adjacent to the source.
[[case]]
name = "import_std_adjacent_dir"
files = [
    { path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    @dbg(std.math.abs(-5));
    0
}
""" },
    { path = "std/_std.rue", source = """
pub const math = @import("math.rue");
""" },
    { path = "std/math.rue", source = """
pub fn abs(x: i32) -> i32 {
    if x < 0 { 0 - x } else { x }
}
""" },
]
stdout = "5\n"

# The standard library via RUE_STD_PATH pointing at the repo's real std/.
[[case]]
name = "import_std_via_env_var"
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    @dbg(std.math.abs(-5));
    0
}
""" }]
env = { RUE_STD_PATH = "${REAL_STD}" }
compile_stderr_not_contains = ["unused function", "exit_syscall_number"]
stdout = "5\n"

# A trusted standard-library module may not use a relative import to leave the
# captured SDK root. The rejected target exists so this exercises the lexical
# escape decision rather than an absent-file diagnostic (RUE-1738).
[[case]]
name = "trusted_std_direct_relative_escape_rejected"
env = { RUE_STD_PATH = "sdk" }
files = [
    { path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    std.outside.answer
}
""" },
    { path = "sdk/_std.rue", source = """
pub const outside = @import("../outside.rue");
""" },
    { path = "outside.rue", source = """
pub const answer: i32 = 42;
""" },
]
compile_fail = true
error_contains = ["E0713", "escapes the project root"]

[[case]]
name = "trusted_std_nested_relative_escape_rejected"
env = { RUE_STD_PATH = "sdk" }
files = [
    { path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    std.nested.outside.answer
}
""" },
    { path = "sdk/_std.rue", source = """
pub const nested = @import("nested/mod.rue");
""" },
    { path = "sdk/nested/mod.rue", source = """
pub const outside = @import("../../outside.rue");
""" },
    { path = "outside.rue", source = """
pub const answer: i32 = 42;
""" },
]
compile_fail = true
error_contains = ["E0713", "escapes the project root"]

[[case]]
name = "trusted_std_in_root_relative_import_works"
env = { RUE_STD_PATH = "sdk" }
files = [
    { path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    std.nested.answer()
}
""" },
    { path = "sdk/_std.rue", source = """
pub const nested = @import("nested/helper.rue");
""" },
    { path = "sdk/nested/helper.rue", source = """
pub fn answer() -> i32 {
    42
}
""" },
]
exit_code = 42

[[case]]
name = "program_anchored_std_import_precedes_sdk"
env = { RUE_STD_PATH = "sdk" }
files = [
    { path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    std.answer()
}
""" },
    { path = "std/_std.rue", source = """
pub fn answer() -> i32 {
    42
}
""" },
    { path = "sdk/_std.rue", source = """
pub fn answer() -> i32 {
    7
}
""" },
]
exit_code = 42

[[case]]
name = "import_std_ignores_unrelated_loaded_std_facade_name"
description = "@import(\"std\") must not bind to an unrelated loaded helper/_std.rue just because its filename is _std.rue (RUE-493)."
files = [
    { path = "main.rue", source = """
const fake = @import("helper/_std.rue");
const std = @import("std");

fn main() -> i32 {
    std.answer()
}
""" },
    { path = "helper/_std.rue", source = """
pub fn answer() -> i32 {
    7
}
""" },
]
env = { RUE_STD_PATH = "" }
compile_fail = true
error_contains = ["E0705", "standard library not found"]

[[case]]
name = "missing_std_blocks_secondary_type_error"
description = "RUE-724: import discovery diagnostics stop semantic analysis before an unresolved std member can emit a secondary error."
files = [{ path = "main.rue", source = """
const std = @import("std");

struct Holder {
    value: std.Missing,
}

fn main() {}
""" }]
env = { RUE_STD_PATH = "" }
compile_fail = true
error_contains = ["E0705", "standard library not found"]
compile_stderr_not_contains = ["E0204", "unknown type"]

# A genuinely missing module should be a clean error (works today).
[[case]]
name = "import_missing_module_is_clean_error"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let nope = @import("does_not_exist");
    0
}
""" }]
compile_fail = true
error_contains = ["E0704", "does_not_exist"]

# Multi-file compile where a NON-ROOT file matches on a module-qualified
# enum path (`m.Color.Green`). The Path match-arm pattern embeds a module
# InstRef that must remain in the canonical multi-module instruction space
# (RUE-130 item 9 — latent today because Sema resolves the enum globally, but
# this pins the user-visible behavior). RUE-920 modernized this case from
# legacy positional inputs to @import: the matcher now lives in an imported
# module, keeping the match in a non-root instruction space.
[[case]]
name = "qualified_enum_pattern_in_second_file"
files = [
    { path = "main.rue", source = """
const matcher = @import("matcher.rue");

fn main() -> i32 {
    matcher.run()
}
""" },
    { path = "matcher.rue", source = """
pub fn run() -> i32 {
    let m = @import("color.rue");
    let c = m.pick();
    match c {
        m.Color.Red => 1,
        m.Color.Green => 2,
        m.Color.Blue => 3,
    }
}
""" },
    { path = "color.rue", source = """
pub enum Color {
    Red,
    Green,
    Blue,
}

pub fn pick() -> Color {
    Color.Green
}
""" },
]
args = ["main.rue", "-o", "prog"]
exit_code = 2

[[case]]
name = "same_named_structs_in_sibling_modules"
description = "RUE-454: module-local type identity allows sibling modules to export same-named structs."
files = [
    { path = "a.rue", source = """
pub struct Item {
    a: i32,
}
""" },
    { path = "b.rue", source = """
pub struct Item {
    b: i32,
}
""" },
    { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    let x: a.Item = a.Item { a: 19 };
    let y: b.Item = b.Item { b: 23 };
    x.a + y.b
}
""" },
]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# Transitive discovery: main imports a, a imports b — only main.rue is on
# the command line; the driver's import scan must load both (RUE-14).
[[case]]
name = "import_transitive_chain"
files = [
    { path = "main.rue", source = """
const a = @import("a.rue");

fn main() -> i32 {
    @dbg(a.double(21));
    0
}
""" },
    { path = "a.rue", source = """
const b = @import("b.rue");

pub fn double(x: i32) -> i32 {
    b.add(x, x)
}
""" },
    { path = "b.rue", source = """
pub fn add(x: i32, y: i32) -> i32 {
    x + y
}
""" },
]
stdout = "42\n"

# RUE-767: RUE-434 rejected a helper that was BOTH listed positionally and
# reached through @import. With the flat positional surface removed, the second
# positional is refused at the CLI before import discovery runs, so the
# arg-level refusal now supersedes RUE-434's mixed-source diagnostic.
[[case]]
name = "mixed_positional_and_import_reachable_file_rejected"
description = "RUE-767: a second positional source (even one reachable via @import) is refused."
files = [
    { path = "main.rue", source = """
const helper = @import("helper.rue");

fn main() -> i32 {
    helper.value()
}
""" },
    { path = "helper.rue", source = """
pub fn value() -> i32 {
    42
}
""" },
]
args = ["main.rue", "helper.rue", "-o", "prog"]
compile_fail = true
error_contains = ["unexpected extra source file", "helper.rue", "@import"]

# Direct member access on a loaded std (no const re-export chain): proves
# std loading itself works; the re-export chain is RUE-136.
[[case]]
name = "import_std_direct_member"
files = [
    { path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    @dbg(std.abs(0 - 5));
    0
}
""" },
    { path = "std/_std.rue", source = """
pub fn abs(x: i32) -> i32 {
    if x < 0 { 0 - x } else { x }
}
""" },
]
stdout = "5\n"

# ---------------------------------------------------------------------------
# Module membership is per-file (RUE-140, spec 4.13:90).
#
# The function table is a flat global namespace, so the member-call path used
# to resolve `utils.sneaky()` to ANY pub function named `sneaky` anywhere in
# the compilation — even one defined in an unrelated file.
# ---------------------------------------------------------------------------

[[case]]
name = "module_member_call_other_files_fn_rejected"
description = "A pub function from another compiled file is not a member of an unrelated module (RUE-140)."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    let other = @import("other.rue");
    let _ = other.sneaky();
    utils.sneaky()
}
""" },
    { path = "utils.rue", source = """
pub fn real() -> i32 {
    1
}
""" },
    { path = "other.rue", source = """
