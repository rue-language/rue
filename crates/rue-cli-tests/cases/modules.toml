[[case]]
# RUE-558: same-named structs in two files must not ICE. Types are file-scoped
# (RUE-454); the global by-name struct map dropped duplicated names, and
# method/destructor analysis looked up name-only, producing E9000 "struct 'P'
# not found in struct map". RUE-767 modernized this from two flat positionals to
