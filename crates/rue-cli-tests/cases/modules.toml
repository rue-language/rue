# Module resolution from disk, through the real driver.
#
# The spec suite's disk-based import tests never CALL anything from the
# imported module (and all usage tests pass files on the CLI), which is why
# the breakage below went unnoticed. See RUE-14.

[section]
id = "cli.modules"
name = "Module imports from disk"
description = "@import resolution and loading as a user experiences it."

# Resolution alone works: an adjacent module can be found on disk.
[[case]]
name = "import_resolves_adjacent_file"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils");
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
exit_code = 0

# Calling into the imported module: the driver discovers @import references
# and loads the resolved files from disk transitively (RUE-14).
[[case]]
name = "import_call_through_local_let"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils");
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
stdout = "42\n"

# Top-level `const utils = @import("utils")` — the idiomatic form from
# ADR-0026.
[[case]]
name = "import_call_through_top_level_const"
files = [
    { path = "main.rue", source = """
const utils = @import("utils");

fn main() -> i32 {
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
stdout = "42\n"

# The `.rue`-suffixed form resolves from disk (when the module is not used).
[[case]]
name = "import_with_rue_extension"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils.rue");
    0
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
exit_code = 0

# Directory module: _utils.rue alongside a utils/ directory (ADR-0026).
# The facade lives INSIDE the directory (utils/_utils.rue), like the
# stdlib's std/_std.rue — ratified in RUE-137 after re-reading the cited
# matklad article (an earlier ADR revision wrongly placed it as a sibling).
[[case]]
name = "import_directory_module_call"
files = [
    { path = "main.rue", source = """
const utils = @import("utils");

fn main() -> i32 {
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "utils/_utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
    { path = "utils/helpers.rue", source = """
pub fn unused() -> i32 {
    0
}
""" },
]
stdout = "42\n"

# A sibling _utils.rue (the rejected pre-RUE-137 layout) is NOT a module
# facade: the import must fail cleanly, not silently half-work.
[[case]]
name = "sibling_facade_is_not_a_directory_module"
files = [
    { path = "main.rue", source = """
const utils = @import("utils");

fn main() -> i32 {
    @dbg(utils.triple(14));
    0
}
""" },
    { path = "_utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
    { path = "utils/helpers.rue", source = """
pub fn unused() -> i32 {
    0
}
""" },
]
compile_fail = true
error_contains = ["E0704"]

# The standard library via a std/ directory adjacent to the source.
[[case]]
name = "import_std_adjacent_dir"
files = [
    { path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    @dbg(std.math.abs(-5));
    0
}
""" },
    { path = "std/_std.rue", source = """
pub const math = @import("std/math.rue");
""" },
    { path = "std/math.rue", source = """
pub fn abs(x: i32) -> i32 {
    if x < 0 { 0 - x } else { x }
}
""" },
]
stdout = "5\n"

# The standard library via RUE_STD_PATH pointing at the repo's real std/.
[[case]]
name = "import_std_via_env_var"
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    @dbg(std.math.abs(-5));
    0
}
""" }]
env = { RUE_STD_PATH = "${REAL_STD}" }
stdout = "5\n"

# A genuinely missing module should be a clean error (works today).
[[case]]
name = "import_missing_module_is_clean_error"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let nope = @import("does_not_exist");
    0
}
""" }]
compile_fail = true
error_contains = ["E0704", "does_not_exist"]

# Multi-file compile where a NON-FIRST file matches on a module-qualified
# enum path (`m.Color::Green`). The Path match-arm pattern embeds a module
# InstRef that Rir::merge must renumber along with everything else; it used
# to be left pointing into the first file's instruction space (RUE-130
# item 9 — latent today because Sema resolves the enum globally, but this
# pins the user-visible behavior).
[[case]]
name = "qualified_enum_pattern_in_second_file"
files = [
    { path = "color.rue", source = """
pub enum Color {
    Red,
    Green,
    Blue,
}

pub fn pick() -> Color {
    Color::Green
}
""" },
    { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import("color.rue");
    let c = m.pick();
    match c {
        m.Color::Red => 1,
        m.Color::Green => 2,
        m.Color::Blue => 3,
    }
}
""" },
]
args = ["color.rue", "main.rue", "-o", "prog"]
exit_code = 2

# Transitive discovery: main imports a, a imports b — only main.rue is on
# the command line; the driver's import scan must load both (RUE-14).
[[case]]
name = "import_transitive_chain"
files = [
    { path = "main.rue", source = """
const a = @import("a");

fn main() -> i32 {
    @dbg(a.double(21));
    0
}
""" },
    { path = "a.rue", source = """
const b = @import("b");

pub fn double(x: i32) -> i32 {
    b.add(x, x)
}
""" },
    { path = "b.rue", source = """
pub fn add(x: i32, y: i32) -> i32 {
    x + y
}
""" },
]
stdout = "42\n"

# Direct member access on a loaded std (no const re-export chain): proves
# std loading itself works; the re-export chain is RUE-136.
[[case]]
name = "import_std_direct_member"
files = [
    { path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    @dbg(std.abs(0 - 5));
    0
}
""" },
    { path = "std/_std.rue", source = """
pub fn abs(x: i32) -> i32 {
    if x < 0 { 0 - x } else { x }
}
""" },
]
stdout = "5\n"

# ---------------------------------------------------------------------------
# Module membership is per-file (RUE-140, spec 4.13:90).
#
# The function table is a flat global namespace, so the member-call path used
# to resolve `utils.sneaky()` to ANY pub function named `sneaky` anywhere in
# the compilation — even one defined in an unrelated file.
# ---------------------------------------------------------------------------

[[case]]
name = "module_member_call_other_files_fn_rejected"
description = "A pub function from another compiled file is not a member of an unrelated module (RUE-140)."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils");
    let other = @import("other");
    let _ = other.sneaky();
    utils.sneaky()
}
""" },
    { path = "utils.rue", source = """
pub fn real() -> i32 {
    1
}
""" },
    { path = "other.rue", source = """
pub fn sneaky() -> i32 {
    99
}
""" },
]
compile_fail = true
error_contains = ["E0707", "module `utils` has no member `sneaky`"]

[[case]]
name = "module_member_call_same_file_control"
description = "Control: a pub function defined in the imported file is still callable as a member."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let utils = @import("utils");
    let other = @import("other");
    let _ = other.sneaky();
    utils.real()
}
""" },
    { path = "utils.rue", source = """
pub fn real() -> i32 {
    7
}
""" },
    { path = "other.rue", source = """
pub fn sneaky() -> i32 {
    99
}
""" },
]
exit_code = 7

[[case]]
name = "module_member_call_facade_chain_control"
description = "Control: the facade re-export chain (RUE-136) still resolves — inner functions are members of the inner module, reached member-by-member."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let mylib = @import("mylib");
    mylib.math.abs(0 - 42)
}
""" },
    { path = "mylib/_mylib.rue", source = """
pub const math = @import("math.rue");
""" },
    { path = "mylib/math.rue", source = """
pub fn abs(x: i32) -> i32 {
    if x < 0 { 0 - x } else { x }
}
""" },
]
exit_code = 42

[[case]]
name = "module_member_call_facade_fn_not_member_of_inner"
description = "A facade-file function is not a member through the re-exported inner module (and vice versa: inner fns are not facade members)."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let mylib = @import("mylib");
    mylib.abs(42)
}
""" },
    { path = "mylib/_mylib.rue", source = """
pub const math = @import("math.rue");
""" },
    { path = "mylib/math.rue", source = """
pub fn abs(x: i32) -> i32 {
    if x < 0 { 0 - x } else { x }
}
""" },
]
compile_fail = true
error_contains = ["E0707", "has no member `abs`"]

# ---------------------------------------------------------------------------
# Per-file import bindings (RUE-113)
#
# `const utils = @import("...")` is THE idiom (ADR-0026): every file writes
# its own imports. Module-binding consts are therefore per-file scoped — two
# files binding the same name must not collide, unlike value constants which
# share the flat global namespace.
# ---------------------------------------------------------------------------

[[case]]
name = "per_file_import_bindings_same_module"
description = "Two files each bind `const utils = @import(...)` to the same module; all files hand-listed on the CLI (the original RUE-113 repro)."
files = [
    { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    a.from_a() + b.from_b()
}
""" },
    { path = "a.rue", source = """
const utils = @import("utils.rue");

pub fn from_a() -> i32 {
    utils.one()
}
""" },
    { path = "b.rue", source = """
const utils = @import("utils.rue");

pub fn from_b() -> i32 {
    utils.one() + 1
}
""" },
    { path = "utils.rue", source = """
pub fn one() -> i32 {
    1
}
""" },
]
args = ["main.rue", "a.rue", "b.rue", "utils.rue", "-o", "prog"]
exit_code = 3

[[case]]
name = "per_file_import_bindings_driver_discovery"
description = "Same shape, but only main.rue on the CLI: the driver discovers and loads the imports transitively."
files = [
    { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    a.from_a() + b.from_b()
}
""" },
    { path = "a.rue", source = """
const utils = @import("utils.rue");

pub fn from_a() -> i32 {
    utils.one()
}
""" },
    { path = "b.rue", source = """
const utils = @import("utils.rue");

pub fn from_b() -> i32 {
    utils.one() + 1
}
""" },
    { path = "utils.rue", source = """
pub fn one() -> i32 {
    1
}
""" },
]
exit_code = 3

[[case]]
name = "per_file_import_bindings_different_modules"
description = "Two files bind the SAME name to DIFFERENT modules: each file sees its own binding."
files = [
    { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    a.from_a() + b.from_b()
}
""" },
    { path = "a.rue", source = """
const helper = @import("m1.rue");

pub fn from_a() -> i32 {
    helper.ten()
}
""" },
    { path = "b.rue", source = """
const helper = @import("m2.rue");

pub fn from_b() -> i32 {
    helper.twenty()
}
""" },
    { path = "m1.rue", source = """
pub fn ten() -> i32 {
    10
}
""" },
    { path = "m2.rue", source = """
pub fn twenty() -> i32 {
    20
}
""" },
]
exit_code = 30

[[case]]
name = "duplicate_import_binding_same_file_still_errors"
description = "Per-file scoping does not excuse a duplicate binding WITHIN one file: still E0418."
files = [
    { path = "main.rue", source = """
const m = @import("m1.rue");
const m = @import("m2.rue");

fn main() -> i32 {
    m.ten()
}
""" },
    { path = "m1.rue", source = """
pub fn ten() -> i32 {
    10
}
""" },
    { path = "m2.rue", source = """
pub fn twenty() -> i32 {
    20
}
""" },
]
compile_fail = true
error_contains = ["E0418", "duplicate constant 'm'"]

# ---------------------------------------------------------------------------
# Boundary-aware import path matching (RUE-39)
#
# Regression test: `@import("til.rue")` must NOT silently bind to a
# pre-loaded `util.rue` via a bare suffix match. Matches must be exact or
# end at a path separator (ModulePath enforces the boundary check).
# ---------------------------------------------------------------------------

[[case]]
name = "typo_import_is_not_suffix_matched"
description = "A typo'd import that is a suffix of another loaded file's name is E0704, not a silent bind."
files = [
    { path = "typo.rue", source = """
const m = @import("til.rue");

fn main() -> i32 {
    m.forty_two()
}
""" },
    { path = "util.rue", source = """
pub fn forty_two() -> i32 {
    42
}
""" },
]
args = ["typo.rue", "util.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0704", "til.rue"]

# ---------------------------------------------------------------------------
# Module privacy (RUE-114 + RUE-37 + RUE-180).
#
# Visibility boundaries are DIRECTORIES (ADR-0026, spec 10.3): a private item
# is reachable from files in the same directory — including through a module
# object — and rejected from any other directory, whether the call is
# qualified (E0706) or unqualified (E0460). Privacy is uniform (RUE-180,
# spec 10.3:7): it applies whether the defining file is imported or only
# listed explicitly; the flat namespace (10.5:2) only resolves names.
# ---------------------------------------------------------------------------

[[case]]
name = "private_fn_cross_dir_qualified_rejected"
description = "Qualified access to a private function of a module in another directory is E0706 (RUE-114)."
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    lib.secret()
}
""" },
    { path = "sub/lib.rue", source = """
fn secret() -> i32 {
    99
}
""" },
]
compile_fail = true
error_contains = ["E0706", "function `secret` is private"]

[[case]]
name = "private_fn_cross_dir_unqualified_rejected"
description = "Dropping the module qualifier must not bypass privacy: unqualified call to the same private function is E0460 (RUE-37)."
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    secret()
}
""" },
    { path = "sub/lib.rue", source = """
fn secret() -> i32 {
    99
}
""" },
]
compile_fail = true
error_contains = ["E0460", "function `secret` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "private_fn_cross_dir_unqualified_rejected_when_also_listed"
description = "Privacy does not depend on how the file was loaded: a file both listed on the CLI and imported is still private cross-directory (E0460)."
args = ["main.rue", "sub/lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    secret()
}
""" },
    { path = "sub/lib.rue", source = """
fn secret() -> i32 {
    99
}
""" },
]
compile_fail = true
error_contains = ["E0460", "function `secret` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "private_fn_same_dir_module_access_allowed"
description = "Control: a private function IS reachable through a module from the same directory (intra-directory visibility, ADR-0026 / spec 10.3:2)."
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");

fn main() -> i32 {
    lib.secret()
}
""" },
    { path = "lib.rue", source = """
fn secret() -> i32 {
    99
}
""" },
]
exit_code = 99

[[case]]
name = "pub_fn_cross_dir_both_forms_allowed"
description = "Control: a pub function in another directory is callable qualified and (transitionally) unqualified."
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    lib.open() + open()
}
""" },
    { path = "sub/lib.rue", source = """
pub fn open() -> i32 {
    7
}
""" },
]
exit_code = 14

[[case]]
name = "flat_multifile_private_fn_cross_dir_rejected"
description = "Uniform privacy (RUE-180): a never-imported file listed explicitly is still private cross-directory — E0460, and the diagnostic names the defining file (no import exists, so no module relationship is claimed)."
args = ["main.rue", "sub/util.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    secret()
}
""" },
    { path = "sub/util.rue", source = """
fn secret() -> i32 {
    42
}
""" },
]
compile_fail = true
error_contains = ["E0460", "function `secret` is private (defined in `sub/util.rue`)"]

[[case]]
name = "flat_multifile_pub_fn_cross_dir_allowed"
description = "Positive control for uniform privacy (RUE-180): a pub function in another never-imported file is callable unqualified with no import — the flat namespace still resolves names (spec 10.3:8)."
args = ["main.rue", "sub/util.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    open()
}
""" },
    { path = "sub/util.rue", source = """
pub fn open() -> i32 {
    42
}
""" },
]
exit_code = 42

[[case]]
name = "flat_multifile_private_fn_same_dir_allowed"
description = "Control: intra-directory visibility (ADR-0026) is unchanged by RUE-180 — a private function in another listed file in the SAME directory is still callable."
args = ["main.rue", "util.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    secret()
}
""" },
    { path = "util.rue", source = """
fn secret() -> i32 {
    42
}
""" },
]
exit_code = 42

# Structs and constants obey the same uniform rule (RUE-183): naming a
# private struct (annotation or literal) or reading a private constant from
# another directory is E0460, whether the file was imported or only listed.

[[case]]
name = "private_struct_cross_dir_unqualified_rejected"
description = "Unqualified struct literal/annotation naming a private struct in another directory is E0460 (RUE-183) — fn-only privacy is not enough."
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    let p: Point = Point { x: 40, y: 2 };
    p.x + p.y
}
""" },
    { path = "sub/lib.rue", source = """
struct Point {
    x: i32,
    y: i32,
}
""" },
]
compile_fail = true
error_contains = ["E0460", "struct `Point` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "private_const_cross_dir_unqualified_rejected"
description = "Unqualified read of a private constant in another directory is E0460 (RUE-183)."
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    LIMIT
}
""" },
    { path = "sub/lib.rue", source = """
const LIMIT: i32 = 99;
""" },
]
compile_fail = true
error_contains = ["E0460", "constant `LIMIT` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "flat_multifile_private_struct_cross_dir_rejected"
description = "Uniform privacy for structs (RUE-183): a private struct in a never-imported listed file is not nameable cross-directory."
args = ["main.rue", "sub/lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let p: Point = Point { x: 40, y: 2 };
    p.x + p.y
}
""" },
    { path = "sub/lib.rue", source = """
struct Point {
    x: i32,
    y: i32,
}
""" },
]
compile_fail = true
error_contains = ["E0460", "struct `Point` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "flat_multifile_private_const_cross_dir_rejected"
description = "Uniform privacy for constants (RUE-183): a private constant in a never-imported listed file is not readable cross-directory."
args = ["main.rue", "sub/lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    LIMIT
}
""" },
    { path = "sub/lib.rue", source = """
const LIMIT: i32 = 99;
""" },
]
compile_fail = true
error_contains = ["E0460", "constant `LIMIT` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "flat_multifile_private_const_in_const_init_rejected"
description = "A constant initializer is a reference site too (RUE-183): `const X = LIMIT;` reading a private cross-directory constant is E0460."
args = ["main.rue", "sub/lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
const X: i32 = LIMIT;

fn main() -> i32 {
    X
}
""" },
    { path = "sub/lib.rue", source = """
const LIMIT: i32 = 99;
""" },
]
compile_fail = true
error_contains = ["E0460", "constant `LIMIT` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "flat_multifile_pub_struct_and_const_cross_dir_allowed"
description = "Positive control (RUE-183): pub structs and constants in another never-imported directory remain usable unqualified (spec 10.3:8)."
args = ["main.rue", "sub/lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let p: Point = Point { x: 30, y: 2 };
    p.x + p.y + BONUS
}
""" },
    { path = "sub/lib.rue", source = """
pub struct Point {
    x: i32,
    y: i32,
}
pub const BONUS: i32 = 10;
""" },
]
exit_code = 42

[[case]]
name = "flat_multifile_private_struct_and_const_same_dir_allowed"
description = "Control (RUE-183): intra-directory visibility is unchanged — private structs and constants in another listed file in the SAME directory are usable."
args = ["main.rue", "lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let p: Point = Point { x: 30, y: 2 };
    p.x + p.y + BONUS
}
""" },
    { path = "lib.rue", source = """
struct Point {
    x: i32,
    y: i32,
}
const BONUS: i32 = 10;
""" },
]
exit_code = 42

# Enums obey the same uniform rule (RUE-185): naming a private enum from
# another directory — annotation, variant construction, or match pattern —
# is E0460, whether the file was imported or merely listed.
[[case]]
name = "private_enum_cross_dir_unqualified_rejected"
description = "Unqualified annotation/construction naming a private enum in another directory is E0460 (RUE-185), imported or not."
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    let c: Color = Color::Blue;
    0
}
""" },
    { path = "sub/lib.rue", source = """
enum Color {
    Red,
    Green,
    Blue,
}
""" },
]
compile_fail = true
error_contains = ["E0460", "enum `Color` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "flat_multifile_private_enum_construction_rejected"
description = "Uniform privacy for enums (RUE-185): a variant of a private enum in a never-imported listed file is not constructible cross-directory."
args = ["main.rue", "sub/lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let c = Color::Blue;
    0
}
""" },
    { path = "sub/lib.rue", source = """
enum Color {
    Red,
    Green,
    Blue,
}
""" },
]
compile_fail = true
error_contains = ["E0460", "enum `Color` is private (defined in `sub/lib.rue`)"]

[[case]]
name = "flat_multifile_private_enum_match_pattern_rejected"
description = "A match pattern is a reference site too (RUE-185): matching on a private cross-directory enum is E0460 with the pattern's own file-attributed span, even when the scrutinee arrives via a pub fn."
args = ["main.rue", "sub/lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    match make() {
        Color::Red => 1,
        Color::Green => 2,
        Color::Blue => 3,
    }
}
""" },
    { path = "sub/lib.rue", source = """
enum Color {
    Red,
    Green,
    Blue,
}
pub fn make() -> Color {
    Color::Green
}
""" },
]
compile_fail = true
error_contains = ["E0460", "enum `Color` is private (defined in `sub/lib.rue`)", "main.rue"]

[[case]]
name = "private_enum_module_qualified_pattern_rejected"
description = "Through a module object the private enum stays E0706 (non-regression, RUE-185): `lib.Color::Red` in a match pattern."
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    match lib.make() {
        lib.Color::Red => 1,
        _ => 0,
    }
}
""" },
    { path = "sub/lib.rue", source = """
enum Color {
    Red,
    Green,
    Blue,
}
pub fn make() -> Color {
    Color::Green
}
""" },
]
compile_fail = true
error_contains = ["E0706", "enum `Color` is private"]

[[case]]
name = "flat_multifile_pub_enum_cross_dir_allowed"
description = "Positive control (RUE-185): a pub enum in another never-imported directory remains usable unqualified — annotation, construction, and match (spec 10.3:8)."
args = ["main.rue", "sub/lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let c: Color = Color::Blue;
    match c {
        Color::Red => 10,
        Color::Green => 20,
        Color::Blue => 42,
    }
}
""" },
    { path = "sub/lib.rue", source = """
pub enum Color {
    Red,
    Green,
    Blue,
}
""" },
]
exit_code = 42

[[case]]
name = "pub_enum_module_qualified_pattern_allowed"
description = "Positive control (RUE-185): a pub enum through a module object works in match patterns, verified by execution."
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    match lib.make() {
        lib.Color::Red => 1,
        lib.Color::Green => 42,
        lib.Color::Blue => 3,
    }
}
""" },
    { path = "sub/lib.rue", source = """
pub enum Color {
    Red,
    Green,
    Blue,
}
pub fn make() -> Color {
    Color::Green
}
""" },
]
exit_code = 42

[[case]]
name = "flat_multifile_private_enum_same_dir_allowed"
description = "Control (RUE-185): intra-directory visibility is unchanged — a private enum in another listed file in the SAME directory is usable."
args = ["main.rue", "lib.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let c: Color = Color::Green;
    match c {
        Color::Red => 1,
        Color::Green => 42,
        Color::Blue => 3,
    }
