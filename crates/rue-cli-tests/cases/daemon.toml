# The local compiler service (ADR-0085, RUE-2128): the `rue daemon
# start|status|stop` controls and `--daemon=auto|required` builds. Every case
# runs against a private endpoint root inside its own directory, so no case
# shares a service with another or with the developer's real runtime
# directory, and the harness stops what a case leaves running. The lifecycle
# cases pin that `status` and `stop` never start a service, `start` is
# idempotent and race-safe, and a scope selects exactly one service; the build
# cases pin that a build through the service publishes a working program,
# reports a rejected one exactly as direct mode does, and follows the support
# table.

[section]
id = "cli.daemon"
name = "rue daemon controls and service builds"
description = "start/status/stop and --daemon builds over a user-private endpoint scoped by directory, isolation, and compiler build."

[[case]]
name = "status_and_stop_without_a_service_start_nothing"
description = "A query for a service that does not exist answers no, twice, and a stop is a no-op; neither launches anything."
files = [{ path = "main.rue", source = "fn main() -> i32 { 0 }\n" }]
daemon = { steps = [
  { args = ["daemon", "status"], exit_code = 1, stderr_contains = ["no service is running for"] },
  { args = ["daemon", "status", "--json"], exit_code = 1, stderr_contains = ["no service is running for"] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["no service was running for"] },
  { args = ["daemon", "status"], exit_code = 1, stderr_contains = ["no service is running for"] },
] }

[[case]]
name = "start_status_and_stop_lifecycle"
description = "start launches once and then finds the running service; status reports it in text and JSON; stop ends it and status answers no again."
files = [{ path = "main.rue", source = "fn main() -> i32 { 0 }\n" }]
daemon = { steps = [
  { args = ["daemon", "start", "--idle-timeout-ms", "60000"], exit_code = 0, stdout_contains = ["rue daemon: started service pid"] },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["rue daemon: running", "  protocol: 3", "  active request: none", "  retained hosts: 0", "  idle timeout: 60000 ms", "  isolation: none", "  resource policy: connections 1/33; queued 0/8; hosts 0/1", "  source snapshot: 0 files, 0 bytes"] },
  { args = ["daemon", "start", "--idle-timeout-ms", "60000"], exit_code = 0, stdout_contains = ["is already running for"], stdout_not_contains = ["started service"] },
  { args = ["daemon", "status", "--json"], exit_code = 0, stdout_contains = ["\"protocol_version\":3", "\"retained_hosts\":0", "\"service_hex\":", "\"max_connections\":33", "\"max_queued_requests\":8", "\"peak_retained_charge_bytes\":0", "\"peak_response_bytes\":0"] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["rue daemon: stopped service pid"] },
  { args = ["daemon", "status"], exit_code = 1, stderr_contains = ["no service is running for"] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["no service was running for"] },
] }

[[case]]
name = "concurrent_starts_share_one_service"
description = "Four simultaneous starts serialize on the startup lock: every one reports the same service and exactly one launches."
files = [{ path = "main.rue", source = "fn main() -> i32 { 0 }\n" }]
daemon = { steps = [
  { args = ["daemon", "start", "--idle-timeout-ms", "60000"], exit_code = 0, concurrency = 4, stdout_contains = ["service pid"] },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["rue daemon: running"] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["rue daemon: stopped service pid"] },
  { args = ["daemon", "status"], exit_code = 1, stderr_contains = ["no service is running for"] },
] }

[[case]]
name = "scope_and_isolation_select_distinct_services"
description = "A service is owned by its scope directory and isolation name: the default scope, an isolated one, and a subdirectory scope are three services, each stopped on its own."
files = [
  { path = "main.rue", source = "fn main() -> i32 { 0 }\n" },
  { path = "sub/main.rue", source = "fn main() -> i32 { 0 }\n" },
]
daemon = { steps = [
  { args = ["daemon", "start", "--isolation", "ci", "--idle-timeout-ms", "60000"], exit_code = 0, stdout_contains = ["started service pid", "(isolation ci)"] },
  { args = ["daemon", "status"], exit_code = 1, stderr_contains = ["no service is running for"] },
  { args = ["daemon", "status", "--isolation", "ci"], exit_code = 0, stdout_contains = ["  isolation: ci"] },
  { args = ["daemon", "start", "--scope", "sub", "--idle-timeout-ms", "60000"], exit_code = 0, stdout_contains = ["started service pid"] },
  { args = ["daemon", "status", "--scope", "sub"], exit_code = 0, stdout_contains = ["rue daemon: running"] },
  { args = ["daemon", "status", "--scope", "."], exit_code = 1, stderr_contains = ["no service is running for"] },
  { args = ["daemon", "stop", "--isolation", "ci"], exit_code = 0, stdout_contains = ["stopped service pid"] },
  { args = ["daemon", "status", "--scope", "sub"], exit_code = 0, stdout_contains = ["rue daemon: running"] },
  { args = ["daemon", "stop", "--scope", "sub"], exit_code = 0, stdout_contains = ["stopped service pid"] },
  { args = ["daemon", "status", "--scope", "sub"], exit_code = 1, stderr_contains = ["no service is running for"] },
] }

[[case]]
name = "malformed_controls_are_argument_errors"
description = "A missing or unknown command, a flag without its value, and a scope that is not a directory are refused before anything is launched."
files = [{ path = "main.rue", source = "fn main() -> i32 { 0 }\n" }]
daemon = { steps = [
  { args = ["daemon"], exit_code = 1, stderr_contains = ["`rue daemon` needs a command", "Usage: rue daemon"] },
  { args = ["daemon", "restart"], exit_code = 1, stderr_contains = ["unknown daemon command `restart`"] },
  { args = ["daemon", "status", "--scope"], exit_code = 1, stderr_contains = ["--scope requires a value"] },
  { args = ["daemon", "stop", "--json"], exit_code = 1, stderr_contains = ["--json applies to `rue daemon status` only"] },
  { args = ["daemon", "start", "--scope", "missing"], exit_code = 1, stderr_contains = ["daemon scope directory", "is not usable"] },
  { args = ["daemon", "start", "--isolation", "no spaces"], exit_code = 1, stderr_contains = ["daemon isolation name"] },
  { args = ["daemon", "status"], exit_code = 1, stderr_contains = ["no service is running for"] },
] }

[[case]]
name = "required_builds_run_through_the_service"
description = "--daemon=required compiles through the service: the client publishes a working program, the service retains the host, and a second build of the same root reuses it."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @dbg(41 + 1);
    0
}
""" }]
daemon = { steps = [
  { args = ["--daemon=required", "main.rue", "-o", "app"], exit_code = 0, stdout_contains = ["Compiled main.rue -> app (target:"], run_output = "app", run_output_stdout_contains = ["42\n"] },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["rue daemon: running", "  active request: none", "  queued requests: 0", "  retained hosts: 1"] },
  { args = ["--daemon", "required", "main.rue", "-o", "app2"], exit_code = 0, stdout_contains = ["Compiled main.rue -> app2"], run_output = "app2", run_output_stdout_contains = ["42\n"] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["stopped service pid"] },
] }

[[case]]
name = "service_diagnostics_match_direct_mode"
description = "A rejected program is reported through the service exactly as directly: the same diagnostic text, the same JSON object, the same exit status, and nothing published."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x: i32 = "nope";
    x
}
""" }]
daemon = { steps = [
  { args = ["main.rue", "-o", "direct"], exit_code = 1, stderr_contains = ["error: [E0206]: type mismatch: expected string type, found i32", " --> main.rue:2:5"] },
  { args = ["--daemon=required", "main.rue", "-o", "app"], exit_code = 1, stderr_contains = ["error: [E0206]: type mismatch: expected string type, found i32", " --> main.rue:2:5"] },
  { args = ["--daemon=required", "--error-format", "json", "main.rue", "-o", "app"], exit_code = 1, stderr_contains = ["\"code\":\"E0206\"", "\"file\":\"main.rue\""] },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["  retained hosts: 1"] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["stopped service pid"] },
] }

[[case]]
name = "the_support_table_decides_between_service_and_direct"
description = "Unsupported lifecycle and linker options still run directly or refuse before work, while daemon presentation stages use the shared service pipeline."
files = [{ path = "main.rue", source = "fn main() -> i32 { 0 }\n" }]
daemon = { steps = [
  { args = ["--daemon=required", "--emit", "cfg", "main.rue"], exit_code = 0, stdout_contains = ["=== CFG ==="] },
  { args = ["--daemon=required", "--error-format", "json", "--emit", "air", "--emit", "cfg", "main.rue"], exit_code = 0, stdout_contains = ["=== AIR ===", "=== CFG ==="] },
  { args = ["--daemon=required", "--linker", "cc", "main.rue"], exit_code = 1, stderr_contains = ["a system linker runs directly"] },
  { args = ["--daemon=required", "--time-passes", "main.rue"], exit_code = 1, stderr_contains = ["--time-passes runs directly"] },
  { args = ["--daemon=required", "--log-level", "debug", "main.rue"], exit_code = 1, stderr_contains = ["compiler tracing (--log-level) runs directly"] },
  { args = ["--daemon=auto", "--emit", "deps", "main.rue"], exit_code = 0, stdout_contains = ["main.rue"] },
  { args = ["--daemon=sometimes", "main.rue"], exit_code = 1, stderr_contains = ["unknown --daemon mode `sometimes`"] },
  { args = ["--daemon-scope", ".", "main.rue"], exit_code = 1, stderr_contains = ["--daemon-scope requires --daemon=auto or --daemon=required"] },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["rue daemon: running", "  retained hosts: 1"] },
] }

[[case]]
name = "auto_starts_the_service_its_scope_selects"
description = "--daemon=auto starts the service for the root's directory; --daemon-scope and --daemon-isolation select the same service the controls address."
files = [
  { path = "main.rue", source = "fn main() -> i32 { 0 }\n" },
  { path = "sub/main.rue", source = "fn main() -> i32 { 0 }\n" },
]
daemon = { steps = [
  { args = ["--daemon=auto", "main.rue", "-o", "app"], exit_code = 0, stdout_contains = ["Compiled main.rue -> app"], run_output = "app" },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["rue daemon: running", "  retained hosts: 1"] },
  { args = ["--daemon=auto", "sub/main.rue", "-o", "sub/app"], exit_code = 0, stdout_contains = ["Compiled sub/main.rue -> sub/app"], run_output = "sub/app" },
  { args = ["daemon", "status", "--scope", "sub"], exit_code = 0, stdout_contains = ["rue daemon: running"] },
  { args = ["--daemon=auto", "--daemon-scope", ".", "--daemon-isolation", "ci", "sub/main.rue", "-o", "sub/app2"], exit_code = 0, run_output = "sub/app2" },
  { args = ["daemon", "status", "--isolation", "ci"], exit_code = 0, stdout_contains = ["  isolation: ci", "  retained hosts: 1"] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["stopped service pid"] },
  { args = ["daemon", "stop", "--scope", "sub"], exit_code = 0, stdout_contains = ["stopped service pid"] },
  { args = ["daemon", "stop", "--isolation", "ci"], exit_code = 0, stdout_contains = ["stopped service pid"] },
] }

[[case]]
name = "test_runs_and_listings_go_through_the_service"
description = "rue test and rue test --list under --daemon=required: the service links the image and answers the inventory, the client runs the tests; verdicts, diagnostics, events and exit statuses are direct mode's, and one host serves the test, listing and executable requests of the root."
files = [
  { path = "main.rue", source = """
fn add(a: i32, b: i32) -> i32 { a + b }
test "adds" { @assert(add(1, 2) == 3); }
test "fails" { @assert(add(1, 2) == 4); }
test "broken" { let x: i32 = "nope"; @assert(x == 1); }
fn main() -> i32 { @dbg(add(20, 22)); 0 }
""" },
  { path = "extra_tests.rue", source = "test \"never imported\" { }\n" },
  { path = "candidates.txt", source = "main.rue\nextra_tests.rue\n" },
]
daemon = { steps = [
  { args = ["test", "--daemon=required", "--seed", "1", "main.rue"], exit_code = 1, stdout_contains = ["FAIL main.rue::fails", "COMPILE ERROR main.rue::broken", "1 passed, 1 failed, 1 compile error"], stderr_contains = ["error: [E0206]: type mismatch: expected string type, found i32", " --> main.rue:4:17"] },
  { args = ["test", "--daemon=required", "--format", "json", "--seed", "1", "--filter", "adds", "main.rue"], exit_code = 0, stdout_contains = ["\"event\":\"run_started\"", "\"plan\":{\"selected\":1,\"total\":3}", "\"id\":\"main.rue::adds\"", "\"verdict\":\"pass\"", "\"event\":\"run_finished\""], stdout_not_contains = ["main.rue::fails"] },
  { args = ["test", "--daemon=required", "--seed", "1", "--filter", "broken", "--format", "json", "main.rue"], exit_code = 1, stdout_contains = ["\"verdict\":\"compile_error\"", "\"payload\":\"E0206: type mismatch: expected string type, found i32\"", "\"location\":{\"column\":17,\"file\":\"main.rue\",\"line\":4}"] },
  { args = ["test", "--daemon=required", "--list", "main.rue"], exit_code = 0, stdout_contains = ["main.rue::adds\nmain.rue::broken\nmain.rue::fails\n"], stderr_contains = ["error: [E0206]"] },
  { args = ["test", "--daemon=required", "--list", "--filter", "nomatch", "main.rue"], exit_code = 3, stderr_contains = ["error: no tests matched the selection"] },
  { args = ["test", "--daemon=required", "--seed", "1", "--filter", "adds", "--test-candidates", "candidates.txt", "main.rue"], exit_code = 0, stdout_contains = ["1 passed"], stderr_contains = ["extra_tests.rue"] },
  { args = ["test", "--daemon=required", "--seed", "1", "--test-candidates", "missing.txt", "main.rue"], exit_code = 2, stderr_contains = ["missing.txt"] },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["  retained hosts: 1", "  active request: none"] },
  { args = ["--daemon=required", "main.rue", "-o", "app"], exit_code = 0, stdout_contains = ["Compiled main.rue -> app"], run_output = "app", run_output_stdout_contains = ["42\n"] },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["  retained hosts: 1"] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["stopped service pid"] },
] }

[[case]]
name = "analysis_only_emit_air_goes_through_the_service"
description = "--emit air under --daemon=required is answered by the service without linking: the AIR text, its warnings, a rejected program's diagnostics and the exit statuses are direct mode's, over the same retained host as the root's executable build."
files = [{ path = "main.rue", source = """
fn add(a: i32, b: i32) -> i32 { a + b }
fn main() -> i32 { let unused: i32 = 7; add(1, 2) - 3 }
""" }]
daemon = { steps = [
  { args = ["--emit", "air", "main.rue"], exit_code = 0, stdout_contains = ["=== AIR ===", "function main:"], stderr_contains = ["warning", "unused"] },
  { args = ["--daemon=required", "--emit", "air", "main.rue"], exit_code = 0, stdout_contains = ["=== AIR ===", "function main:"], stderr_contains = ["warning", "unused"] },
  { args = ["daemon", "status"], exit_code = 0, stdout_contains = ["  retained hosts: 1"] },
  { args = ["--daemon=required", "main.rue", "-o", "app"], exit_code = 0, stdout_contains = ["Compiled main.rue -> app"], run_output = "app" },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["stopped service pid"] },
] }

[[case]]
name = "a_rejected_analysis_is_reported_as_directly"
description = "A program the analysis rejects is reported through the service exactly as direct mode reports it, with nothing on stdout."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x: i32 = "nope";
    x
}
""" }]
daemon = { steps = [
  { args = ["--daemon=required", "--emit", "air", "main.rue"], exit_code = 1, stdout_not_contains = ["=== AIR ==="], stderr_contains = ["error: [E0206]: type mismatch: expected string type, found i32", " --> main.rue:2:5"] },
  { args = ["--daemon=required", "--error-format", "json", "--emit", "air", "main.rue"], exit_code = 1, stderr_contains = ["\"code\":\"E0206\""] },
  { args = ["daemon", "stop"], exit_code = 0, stdout_contains = ["stopped service pid"] },
] }

[[case]]
name = "performance_sidecars_never_replace_sources_or_outputs"
description = "A performance sidecar requires a new file, rejects output aliases before compilation, and leaves the source and executable usable after rejection."
files = [{ path = "main.rue", source = "fn main() -> i32 { @dbg(42); 0 }\n" }]
daemon = { steps = [
  { args = ["--daemon=off", "--daemon-performance-json", "main.rue", "main.rue", "-o", "app"], exit_code = 1, stderr_contains = ["performance sidecar must name a new file"] },
  { args = ["--daemon=off", "main.rue", "-o", "app"], exit_code = 0, run_output = "app", run_output_stdout_contains = ["42\n"] },
  { args = ["--daemon=off", "--daemon-performance-json", "app", "main.rue", "-o", "other"], exit_code = 1, stderr_contains = ["performance sidecar must name a new file"] },
  { args = ["--daemon=off", "--daemon-performance-json", "fresh.json", "main.rue", "-o", "app"], exit_code = 0, run_output = "app", run_output_stdout_contains = ["42\n"] },
  { args = ["--daemon=off", "--daemon-performance-json", "fresh.json", "main.rue", "-o", "app"], exit_code = 1, stderr_contains = ["performance sidecar must name a new file"] },
  { args = ["--daemon=off", "--daemon-performance-json", "future", "main.rue", "-o", "future"], exit_code = 1, stderr_contains = ["performance sidecar cannot also be the executable output"] },
  { args = ["--daemon=required", "--daemon-performance-json", "main.rue", "main.rue", "-o", "app"], exit_code = 1, stderr_contains = ["performance sidecar must name a new file"] },
  { args = ["daemon", "status"], exit_code = 1, stderr_contains = ["no service is running for"] },
] }

[[case]]
name = "performance_sidecars_refuse_unmeasured_input_authority"
description = "Inputs outside the performance regime fail before source or candidate acquisition and before a daemon can start."
files = [{ path = "main.rue", source = "fn main() -> i32 { 0 }\n" }]
daemon = { steps = [
  { args = ["--daemon=required", "--daemon-performance-json", "candidate.json", "--test-candidates", "missing.txt", "main.rue"], exit_code = 1, stderr_contains = ["test candidates, archives, and test listings are not measured"] },
  { args = ["--daemon=required", "--daemon-performance-json", "archive.json", "--link-archive", "missing.a", "main.rue"], exit_code = 1, stderr_contains = ["test candidates, archives, and test listings are not measured"] },
  { args = ["daemon", "status"], exit_code = 1, stderr_contains = ["no service is running for"] },
] }

[[case]]
name = "fresh_action_calls_ignore_an_available_service"
description = "Explicit direct scan, compile, and test calls preserve source-manifest authority while an ambient service stays unused."
files = [
  { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { @dbg(helper.value()); 0 }\ntest \"value\" { @assert(helper.value() == 42); }\n" },
  { path = "helper.rue", source = "pub fn value() -> i32 { 42 }\n" },
  { path = "complete.manifest", source = "main.rue\nhelper.rue\n" },
  { path = "restricted.manifest", source = "main.rue\n" },
]
daemon = { steps = [
  { args = ["daemon", "start", "--idle-timeout-ms", "60000"], exit_code = 0 },
  { args = ["--daemon=off", "--emit", "deps", "main.rue"], exit_code = 0, stdout_contains = ["helper.rue"] },
  { args = ["--daemon=off", "main.rue", "--source-manifest", "complete.manifest", "-o", "app"], exit_code = 0, run_output = "app", run_output_stdout_contains = ["42\n"] },
  { args = ["--daemon=off", "test", "main.rue", "--source-manifest", "complete.manifest", "--seed", "1"], exit_code = 0, stdout_contains = ["1 passed"] },
  { args = ["--daemon=off", "main.rue", "--source-manifest", "restricted.manifest", "-o", "refused"], exit_code = 1, stderr_contains = ["helper.rue", "source manifest"] },
  { args = ["daemon", "status", "--json"], exit_code = 0, stdout_contains = ["\"retained_hosts\":0", "\"last_measurement\":null"] },
  { args = ["daemon", "stop"], exit_code = 0 },
] }
