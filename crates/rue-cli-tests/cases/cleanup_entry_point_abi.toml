execute_if_native = true
files = [{ path = "main.rue", source = """
struct Inner { a: i64, b: i32 }

drop fn Inner(self) {
    @dbg(1000);
    @dbg(self.a);
    @dbg(self.b);
}

fn main() -> i32 {
    let row = [
        Inner { a: 10, b: 11 },
        Inner { a: 20, b: 21 },
        Inner { a: 30, b: 31 },
    ];
    @dbg(row[1].b);
    0
}
""" }]
