# Width-truncating comptime operators across all three evaluation positions
# (RUE-1698, closing out the RUE-163 epic).
#
# Rue evaluates the same expression with more than one engine. The in-body
# engine (rue-air `sema::comptime_eval`) folds a `comptime { }` block inside a
# function body; the durable evaluator in rue-compiler's query database
# evaluates const initializers and reduces cross-callable comptime value calls;
# codegen computes the runtime form. RUE-163 taught the in-body engine the
# spec's truncating semantics for `<<` and `~` and the mod-width shift-amount
# mask (4.3a:10) but left the durable evaluator masking by 127 (the i128 width)
# and range-checking the result, so the two disagreed:
#
#   fn f(comptime n: u8) -> u8 { comptime { ~n } }
#   const X: u8 = f(0);   // E1200 "value -1 is out of range for type u8"
#   let x: u8 = f(0);     // 255, matching runtime `~0u8`
#
# `>>` diverged silently rather than loudly: `n >> 8` at u8 gave 0 in const
# position and 200 (amount masked to 0) in body position, so a const and its
# body-position twin held different values in the same program.
#
# The governing property is that const position, body position, and runtime
# agree, so every case below prints all three for the same operation and pins
# the exact stdout. `differential_opt` additionally runs each at -O0..-O3, which
# puts the CFG constant folder's own truncation on the same triple.
#
# The controls at the bottom are the other half of the property: operations
# that genuinely panic at runtime (add/sub/mul overflow, division and remainder
# by zero, negating a type's minimum) must keep failing in const position. Only
# the operations that cannot trap became total.

[section]
id = "cli.comptime_width_truncation"
name = "Comptime width truncation agrees across evaluation positions"
description = "`~`, `<<`, and `>>` yield the same value in const position, body position, and at runtime."

