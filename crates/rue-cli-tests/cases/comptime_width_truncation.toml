files = [{ path = "main.rue", source = """
fn div(comptime n: i32, comptime d: i32) -> i32 { comptime { n / d } }
const X: i32 = div(1, 0);
fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E1200", "division by zero", "would panic at runtime"]

[[case]]
name = "control_remainder_by_zero_still_rejected"
description = "`1 % 0` in const position is still E1200."
files = [{ path = "main.rue", source = """
fn rem(comptime n: i32, comptime d: i32) -> i32 { comptime { n % d } }
const X: i32 = rem(1, 0);
fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E1200", "remainder by zero", "would panic at runtime"]

[[case]]
name = "control_negate_minimum_still_rejected"
description = "Negation is not a truncating operation: negating a type's minimum still overflows and is still E1200."
files = [{ path = "main.rue", source = """
fn neg(comptime n: i8) -> i8 { comptime { -n } }
const X: i8 = neg(-128);
fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E1200", "integer overflow", "i8", "128"]
