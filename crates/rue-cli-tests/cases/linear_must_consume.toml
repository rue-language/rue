# Linear must-consume on every path (RUE-127 item 5).
#
# The linear consumption check used to ride the move checker's MAY-move
# (union) state: a linear value consumed in only ONE branch of an if/match
# counted as consumed, silently dropping it on the other paths. Consumption
# is now intersected at branch joins (full_move_on_all_paths), so every
# non-diverging path must consume the value. Paths that diverge (return)
# never reach the end of scope and are exempt.

[section]
id = "cli.linear_must_consume"
name = "Linear must-consume on all paths"
description = "Linear values must be consumed on every non-diverging path (RUE-127 item 5)."

[[case]]
name = "linear_one_if_branch_rejected"
description = "Consuming a linear value in only the then-branch leaks it on the else path."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let m = MustUse { value: 42 };
    if true {
        consume(m)
    } else {
        0
    }
}
""" }]
compile_fail = true
error_contains = ["E0443", "not consumed on all paths"]

[[case]]
name = "linear_one_match_arm_rejected"
description = "Consuming a linear value in only one match arm leaks it on the other arms."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let m = MustUse { value: 9 };
    let c = 1;
    match c {
        0 => consume(m),
        _ => 0,
    }
}
""" }]
compile_fail = true
error_contains = ["E0443", "not consumed on all paths"]

[[case]]
name = "linear_both_branches_consume_control"
description = "Control: consuming in BOTH branches satisfies must-consume and runs."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let m = MustUse { value: 42 };
    if true {
        consume(m)
    } else {
        consume(m)
    }
}
""" }]
exit_code = 42

[[case]]
name = "linear_all_match_arms_consume_control"
description = "Control: match arms are alternatives, so consuming in every arm is one consumption per execution."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let m = MustUse { value: 7 };
    let c = 1;
    match c {
        0 => consume(m) + 1,
        _ => consume(m),
    }
}
""" }]
exit_code = 7

[[case]]
name = "linear_consume_then_return_control"
description = "Control: a diverging branch (early return) never reaches end of scope, so it is exempt."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let m = MustUse { value: 5 };
    if false {
        return 0;
    }
    consume(m)
}
""" }]
exit_code = 5

[[case]]
name = "linear_one_branch_in_loop_rejected"
description = "Composes with loop analysis: a linear value declared per-iteration must be consumed on every path of the body."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let mut i = 0;
    let mut total = 0;
    while i < 3 {
        let m = MustUse { value: i };
        if i == 0 {
            total = total + consume(m);
        }
        i = i + 1;
    }
    total
}
""" }]
compile_fail = true
error_contains = ["E0443", "not consumed on all paths"]

[[case]]
name = "linear_both_branches_in_loop_control"
description = "Control: consuming the per-iteration linear value in both branches compiles and runs."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let mut i = 0;
    let mut total = 0;
    while i < 3 {
        let m = MustUse { value: i };
        if i == 0 {
            total = total + consume(m);
        } else {
            total = total + consume(m) + 10;
        }
        i = i + 1;
    }
    total
}
""" }]
exit_code = 23

# ---------------------------------------------------------------------------
# RUE-176: enforcement holes - linear params, discarded temporaries, arrays
# ---------------------------------------------------------------------------

[[case]]
name = "linear_param_unconsumed_in_callee_rejected"
description = "A pass-by-value linear parameter silently dropped by the callee is rejected (RUE-176)."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn f(m: MustUse) -> i32 { 0 }
fn main() -> i32 {
    let m = MustUse { value: 1 };
    f(m)
}
""" }]
compile_fail = true
error_contains = ["E0406", "linear value 'm' must be consumed"]

[[case]]
name = "linear_param_destructure_consumes_control"
description = "Control: the canonical consumer destructures its parameter, which counts as consumption."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    consume(MustUse { value: 42 })
}
""" }]
exit_code = 42

[[case]]
name = "linear_temporary_discarded_rejected"
description = "A linear value produced and discarded by an expression statement is rejected (RUE-176)."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn make_linear() -> MustUse { MustUse { value: 1 } }
fn main() -> i32 {
    make_linear();
    0
}
""" }]
compile_fail = true
error_contains = ["E0478", "carries a linear value and must be consumed"]

[[case]]
name = "linear_array_dropped_rejected"
description = "An array of linear values that is never consumed is rejected, not just warned (RUE-176)."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn make_linear() -> MustUse { MustUse { value: 1 } }
fn main() -> i32 {
    let a = [make_linear(), make_linear()];
    0
}
""" }]
compile_fail = true
error_contains = ["E0406", "linear value 'a' must be consumed"]

[[case]]
name = "linear_plain_local_dropped_control"
description = "Control (E0406 baseline): a plain unconsumed linear local was already rejected before RUE-176."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn main() -> i32 {
    let m = MustUse { value: 1 };
    0
}
""" }]
compile_fail = true
error_contains = ["E0406", "linear value 'm' must be consumed"]

# =============================================================================
# Element-wise consumption of linear arrays (RUE-186, spec 3.8:68-73)
#
# A constant index into an array variable moves just that element out, so a
# linear array can be consumed element by element. Dynamic indices stay
# conservative (E0904); partial consumption at scope end is rejected; drop
# elaboration must not double-drop moved-out elements nor leak unmoved ones.
# =============================================================================

[[case]]
name = "linear_array_elementwise_consume_runs"
description = "Element-wise consumption of a linear array compiles and runs (RUE-186)."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let xs = [MustUse { value: 40 }, MustUse { value: 2 }];
    consume(xs[0]) + consume(xs[1])
}
""" }]
exit_code = 42

[[case]]
name = "linear_array_partial_consumption_rejected"
description = "Consuming only some elements of a linear array names the unconsumed elements."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let xs = [MustUse { value: 1 }, MustUse { value: 2 }, MustUse { value: 3 }];
    consume(xs[1])
}
""" }]
compile_fail = true
error_contains = ["E0406", "element(s) [0], [2]"]

[[case]]
name = "linear_array_element_one_branch_rejected"
description = "An element consumed in only one branch is not consumed on all paths (E0443)."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let xs = [MustUse { value: 1 }, MustUse { value: 2 }];
    let a = consume(xs[0]);
    if a == 1 {
        a + consume(xs[1])
    } else {
        a
    }
}
""" }]
compile_fail = true
error_contains = ["E0443", "element(s) [1]"]

[[case]]
name = "linear_array_dynamic_index_move_rejected"
description = "Moving out through a non-constant index stays rejected (E0904, soundness pin)."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn pick() -> u64 { 0 }
fn main() -> i32 {
    let xs = [MustUse { value: 1 }, MustUse { value: 2 }];
    let i = pick();
    consume(xs[i]) + consume(xs[1])
}
""" }]
compile_fail = true
error_contains = ["E0904", "cannot move out of indexed position"]

[[case]]
name = "array_element_drop_order_after_move"
description = "Drop ORDER with a moved-out element: the new owner drops it first; scope exit drops the remaining elements ascending, exactly once (RUE-186)."
files = [{ path = "main.rue", source = """
struct D { value: i32 }
drop fn D(self) {
    @dbg(self.value);
}
fn consume(d: D) -> i32 { d.value }
fn main() -> i32 {
    let xs = [D { value: 1 }, D { value: 2 }, D { value: 3 }];
    let got = consume(xs[1]);
    @dbg(100);
    got - 2
}
""" }]
exit_code = 0
stdout = "2\n100\n1\n3\n"

[[case]]
name = "array_element_branch_drop_flag_runs"
description = "An element moved on only one path is dropped at exit exactly when that path did not run (runtime drop flag, RUE-186)."
files = [{ path = "main.rue", source = """
struct D { value: i32 }
drop fn D(self) {
    @dbg(self.value);
}
fn consume(d: D) -> i32 { d.value }
fn cond(x: i32) -> bool { x > 0 }
fn main() -> i32 {
    let xs = [D { value: 1 }, D { value: 2 }];
    let mut total = 0;
    if cond(0) {
        total = total + consume(xs[0]);
    }
    @dbg(100);
    total
}
""" }]
exit_code = 0
stdout = "100\n1\n2\n"

[[case]]
name = "array_early_return_drops_unmoved_elements_only"
description = "A return with a partially moved array drops only the unmoved elements (no double drop, no leak)."
files = [{ path = "main.rue", source = """
struct D { value: i32 }
drop fn D(self) {
    @dbg(self.value);
}
fn consume(d: D) -> i32 { d.value }
fn cond(x: i32) -> bool { x > 0 }
fn main() -> i32 {
    let xs = [D { value: 1 }, D { value: 2 }];
    let a = consume(xs[0]);
    if cond(1) {
        @dbg(100);
        return a - 1;
    }
    a + consume(xs[1])
}
""" }]
exit_code = 0
stdout = "1\n100\n2\n"

[[case]]
name = "array_whole_reinit_after_element_move_drops_once"
description = "Overwriting a partially moved array drops only the unmoved old elements, then the new occupants at exit (RUE-64 x RUE-186)."
files = [{ path = "main.rue", source = """
struct D { value: i32 }
drop fn D(self) {
    @dbg(self.value);
}
fn consume(d: D) -> i32 { d.value }
fn main() -> i32 {
    let mut xs = [D { value: 1 }, D { value: 2 }];
    let a = consume(xs[0]);
    xs = [D { value: 7 }, D { value: 8 }];
    @dbg(100);
    a - 1
}
""" }]
exit_code = 0
stdout = "1\n2\n100\n7\n8\n"

[[case]]
name = "array_element_write_partially_moved_rejected"
description = "Assignment into a partially moved array is rejected (E0480): writes cannot re-arm per-element ownership."
files = [{ path = "main.rue", source = """
struct D { value: i32 }
fn consume(d: D) -> i32 { d.value }
fn main() -> i32 {
    let mut xs = [D { value: 1 }, D { value: 2 }];
    let a = consume(xs[0]);
    xs[0] = D { value: 9 };
    a
}
""" }]
compile_fail = true
error_contains = ["E0480", "cannot assign into 'xs'"]

[[case]]
name = "array_element_move_in_loop_rejected"
description = "A constant-index move inside a loop body is a use-after-move on the next iteration."
files = [{ path = "main.rue", source = """
struct D { value: i32 }
fn consume(d: D) -> i32 { d.value }
fn main() -> i32 {
    let xs = [D { value: 1 }, D { value: 2 }];
    let mut i = 0;
    let mut total = 0;
    while i < 2 {
        total = total + consume(xs[0]);
        i = i + 1;
    }
    total
}
""" }]
compile_fail = true
error_contains = ["E0205", "use of moved value 'xs[0]'"]

[[case]]
name = "linear_array_param_elementwise_consume_runs"
description = "A by-value linear array parameter is consumable element-wise by the callee; the caller's whole-array move still satisfies its own obligation."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
fn consume(m: MustUse) -> i32 { m.value }
fn consume_all(xs: [MustUse; 2]) -> i32 { consume(xs[0]) + consume(xs[1]) }
fn main() -> i32 {
    let xs = [MustUse { value: 40 }, MustUse { value: 2 }];
    consume_all(xs)
}
""" }]
exit_code = 42

# ---------------------------------------------------------------------------
# RUE-1603: a NAMED match-arm payload binding is an ordinary local in the ARM
# scope, so a linear one must be consumed there. The arm scope used to be
# popped without the block-exit linear leak check, so these leaked silently.
# ---------------------------------------------------------------------------

[[case]]
name = "linear_match_payload_binding_unconsumed_rejected"
description = "A named linear payload binding left unconsumed in its arm is a leak (RUE-1603; compiled silently before)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
enum E { A(L), B }
fn main() -> i32 {
    let e = E.A(L { v: 5 });
    match e { E.A(x) => 1, E.B => 2 }
}
""" }]
compile_fail = true
error_contains = ["E0406", "linear value 'x' must be consumed"]

[[case]]
name = "linear_match_carrier_payload_binding_names_residual_place"
description = "A linear-carrying struct payload binding left unconsumed names the residual sub-place (RUE-1603)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct D { d: i32 }
struct C { l: L, d: D }
enum E2 { A(C), B }
fn main() -> i32 {
    let e = E2.A(C { l: L { v: 5 }, d: D { d: 6 } });
    match e { E2.A(c) => 1, E2.B => 2 }
}
""" }]
compile_fail = true
error_contains = ["E0406", "'c.l' still holds a linear value"]

[[case]]
name = "linear_match_payload_binding_one_branch_rejected"
description = "A payload binding consumed on only one branch of the arm body is E0443, like any linear local (RUE-1603)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
enum E { A(L), B }
fn sink(x: L) -> i32 { x.v }
fn main() -> i32 {
    let c = true;
    let e = E.A(L { v: 5 });
    match e { E.A(x) => if c { sink(x) } else { 0 }, E.B => 2 }
}
""" }]
compile_fail = true
error_contains = ["E0443", "not consumed on all paths"]

[[case]]
name = "linear_match_payload_binding_drop_hatch_runs"
description = "Control: @drop discharges a named linear payload binding's obligation and the program runs (RUE-1603)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
enum E { A(L), B }
fn main() -> i32 {
    let e = E.A(L { v: 5 });
    match e { E.A(x) => { @drop(x); 42 }, E.B => 2 }
}
""" }]
exit_code = 42

[[case]]
name = "linear_match_payload_binding_consumed_runs"
description = "Control: consuming the payload binding in the arm body compiles and runs (RUE-1603)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
enum E { A(L), B }
fn sink(x: L) -> i32 { x.v }
fn main() -> i32 {
    let e = E.A(L { v: 40 });
    match e { E.A(x) => sink(x) + 2, E.B => 2 }
}
""" }]
exit_code = 42
