# Intrinsic argument lowering through the real driver.
#
# AstGen used to silently DROP a stray type argument to an expression
# intrinsic: `@syscall(a, (), b)` lowered to `@syscall(a, b)`, shifting `b`
# into the wrong syscall register and compiling cleanly — a silent
# miscompile (RUE-130 item 8). The type argument is now lowered to a
# placeholder so Sema reports a proper type error instead.
#
# The `@syscall` cases sit inside `checked` blocks because `@syscall` is an
# unchecked operation (spec 9.2:3a, RUE-1369); without the block the shared
# checked-block gate would fire first and hide the argument diagnostic under
# test.

[section]
id = "cli.intrinsic_args"
name = "Intrinsic argument handling"
description = "Type arguments to expression intrinsics must error, not be dropped."

# A `()` (unit type) argument in the middle of @syscall must be a compile
# error, not silently deleted.
[[case]]
name = "syscall_stray_unit_type_arg_is_error"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let a: u64 = 60;
    let b: u64 = 7;
    checked {
        let r = @syscall(a, (), b);
    };
    0
}
""" },
]
compile_fail = true
error_contains = ["E0702", "argument 1", "found type"]

# Same for a named type used as an expression-intrinsic argument.
[[case]]
name = "syscall_stray_named_type_arg_is_error"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let a: u64 = 60;
    checked {
        let r = @syscall(a, i32);
    };
    0
}
""" },
]
compile_fail = true
error_contains = ["E0702", "argument 1", "found type"]

# Negation of a parenthesized binary expression in intrinsic-arg position
# (RUE-149). Integer-literal defaulting used to bind only the literal's own
# type variable, leaving the binop/neg result variable unresolved as
# `<error>` with no diagnostic — and codegen then SIGABRTed on the
# `unreachable!("@dbg only supports scalars and strings")` arm.
[[case]]
name = "dbg_neg_of_parenthesized_binop"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    @dbg(-(3 + 4));
    0
}
""" },
]
stdout = "-7\n"
exit_code = 0

# Leading `!` in an intrinsic argument must parse as logical not, not as the
# never type (RUE-150). The parser used to commit to the never-type parse of
# the bare `!` and then reject the rest of the argument with E0100.
[[case]]
name = "dbg_logical_not_literal"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    @dbg(!true);
    0
}
""" },
]
stdout = "false\n"
exit_code = 0

[[case]]
name = "dbg_logical_not_variable"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let b = false;
    @dbg(!b);
    0
}
""" },
]
stdout = "true\n"
exit_code = 0

# Control for RUE-150: a bare `!` as the whole argument is still the never
# type in type-argument position (@size_of(!) == 0).
[[case]]
name = "size_of_never_type_arg_still_parses"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    @dbg(@size_of(!));
    0
}
""" },
]
stdout = "0\n"
exit_code = 0
