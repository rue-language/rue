# Runtime-helper names are reserved for user functions (RUE-84, RUE-125).
#
# Defining a function whose name collides with a runtime/codegen symbol
# (__rue_*, _start) used to fail with a confusing duplicate-symbol LINK error —
# or, worse, link "successfully" and silently bind calls to the runtime's
# definition instead of the user's (a miscompile). These names are now rejected
# at declaration time with a clear E0435 diagnostic.
#
# The reserved set is exactly `__rue_*` and `_start` (RUE-125): every
# compiler/runtime symbol, including built-in methods (`__rue_String_len`),
# lives under `__rue_`, so a `Type__method` spelling like `String__len` is an
# ordinary user identifier — see builtin_method_name_allowed below.

[section]
id = "cli.reserved_names"
name = "Reserved runtime-helper function names"
description = "User functions may not shadow runtime/codegen helper symbols; the error is reported at compile time."

# A `Type__method` name is legal and links distinctly from the built-in method
# (whose runtime symbol is `__rue_String_len`). Built-in `s.len()` returns 5;
# the user's `String__len()` returns 7 -> 5*10 + 7 = 57.
[[case]]
name = "builtin_method_name_allowed"
files = [{ path = "main.rue", source = """
fn String__len() -> i32 { 7 }
fn main() -> i32 {
    let mut s = String.new();
    s.push_str("hello");
    let builtin: i32 = @intCast(s.len());
    builtin * 10 + String__len()
}
""" }]
exit_code = 57

[[case]]
name = "rue_runtime_prefix_rejected"
files = [{ path = "main.rue", source = """
fn __rue_alloc() -> i32 { 7 }
fn main() -> i32 { __rue_alloc() }
""" }]
compile_fail = true
error_contains = ["E0435", "__rue_alloc", "reserved"]

[[case]]
name = "entry_point_name_rejected"
files = [{ path = "main.rue", source = """
fn _start() -> i32 { 1 }
fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0435", "_start", "reserved"]

# Control: an ordinary user function with a similar-looking name (double
# underscore, but the prefix is not a built-in type) compiles and runs.
[[case]]
name = "lookalike_user_name_allowed"
files = [{ path = "main.rue", source = """
fn foo__bar() -> i32 { 9 }
fn main() -> i32 { foo__bar() }
""" }]
exit_code = 9
