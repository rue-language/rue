# Nested declared-`linear` destructure (RUE-1632, spec 3.8:33).
#
# Reading a field through a declared-`linear` value destructures THAT value
# (spec 3.8:33): the consumption is scoped to the destructured value's PLACE
# — `h.arr[0]`, `h.a`, or the binding itself when the declared-linear struct
# is the root. It used to be recorded against the root binding, which
# silently discharged every sibling place's must-consume obligation (a linear
# value could be dropped with no diagnostic at all) and, in the other
# direction, made every sibling element unreadable as a use-after-move of the
# whole root.
#
# Declared-linear residue is destroyed immediately when droppable and rejected
# when it carries a linear obligation (RUE-614). These cases also pin the
# SIBLINGS: sibling elements, sibling fields, sibling rows, and the rest of
# the root keep their obligations and their drop glue.

[section]
id = "cli.nested_linear_destructure"
name = "Nested declared-linear destructure"
description = "Destructuring consumption is scoped to the destructured place, not the root binding (RUE-1632)."

[[case]]
name = "array_element_destructure_keeps_sibling_obligation"
description = "Reading a Copy field of one declared-linear array element leaves the sibling element's must-consume obligation standing (RUE-1632)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct H { arr: [L; 2] }
fn main() -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }] };
    h.arr[0].v
}
""" }]
compile_fail = true
error_contains = [
    "E0406",
    "linear value 'h' must be consumed",
    "'h.arr[1]' still holds a linear value",
]

[[case]]
name = "array_all_elements_destructured_runs"
description = "Destructuring EVERY element discharges the array field: the program compiles and runs (before RUE-1632 the second element was a use-after-move of the whole root)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct H { arr: [L; 2] }
fn main() -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }] };
    h.arr[0].v + h.arr[1].v
}
""" }]
exit_code = 3

[[case]]
name = "root_array_element_destructure_keeps_sibling_obligation"
description = "The same scoping at a ROOT array of declared-linear elements: destructuring element 0 leaves element 1 unconsumed, reported element-wise (RUE-1632, spec 3.8:71)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
fn main() -> i32 {
    let a = [L { v: 1 }, L { v: 2 }];
    a[0].v
}
""" }]
compile_fail = true
error_contains = [
    "E0406",
    "element(s) [1] of 'a' are not consumed on every path",
]

[[case]]
name = "root_array_all_elements_destructured_runs"
description = "Destructuring every element of a root array discharges it element-wise and runs."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
fn main() -> i32 {
    let a = [L { v: 1 }, L { v: 2 }];
    a[0].v + a[1].v
}
""" }]
exit_code = 3

[[case]]
name = "by_value_array_param_element_destructure_keeps_sibling_obligation"
