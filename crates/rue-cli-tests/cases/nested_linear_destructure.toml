files = [{ path = "main.rue", source = """
struct D { value: i32 }
drop fn D(self) { @dbg(self.value); }
linear struct Inner { selected: i32, residue: D }
linear struct Outer { inner: Inner, sibling: i32 }
fn main() -> i32 {
    let outer = Outer { inner: Inner { selected: 7, residue: D { value: 1 } }, sibling: 2 };
    outer.inner.selected
}
""" }]
compile_fail = true
error_contains = ["E0406", "linear value 'outer' must be consumed"]

[[case]]
name = "nested_declared_linear_projection_drops_only_inner_residue"
description = "A nested declared-linear projection consumes the inner value, drops its residue immediately, and leaves unrelated outer fields for ordinary scope-exit dropping."
files = [{ path = "main.rue", source = """
