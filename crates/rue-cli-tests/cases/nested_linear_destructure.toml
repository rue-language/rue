drop fn D(self) { @dbg(self.value); }
linear struct Inner { selected: i32, residue: D }
struct Outer { inner: Inner, sibling: D }
fn main() -> i32 {
    let outer = Outer { inner: Inner { selected: 7, residue: D { value: 1 } }, sibling: D { value: 2 } };
    let result = outer.inner.selected;
