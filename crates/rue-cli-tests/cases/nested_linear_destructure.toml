[[case]]
name = "destructured_element_is_moved_out"
description = "The destructured element is consumed: reading through it again is a use-after-move naming the ELEMENT, not the root (RUE-1632)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct H { arr: [L; 2] }
fn main() -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }] };
    h.arr[0].v + h.arr[0].v + h.arr[1].v
}
""" }]
compile_fail = true
error_contains = [
    "E0205",
    "use of moved value 'h.arr[0]'",
]

[[case]]
name = "element_destructured_on_one_path_only"
description = "An element destructured on only one branch is not consumed on all paths, reported at element granularity (RUE-1632 + RUE-127 item 5)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct H { arr: [L; 2] }
fn pick(n: i32) -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }] };
    if n > 0 {
        h.arr[0].v + h.arr[1].v
    } else {
        h.arr[0].v
    }
}
fn main() -> i32 { pick(1) }
""" }]
compile_fail = true
error_contains = [
    "E0443",
    "not consumed on all paths",
    "'h.arr[1]' still holds a linear value",
]

[[case]]
name = "carrier_param_element_destructure_runs"
description = "The same scoping applies to a by-value parameter base: both elements are destructured inside the callee."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct H { arr: [L; 2] }
fn take(h: H) -> i32 { h.arr[0].v + h.arr[1].v }
fn main() -> i32 {
    take(H { arr: [L { v: 3 }, L { v: 4 }] })
}
""" }]
exit_code = 7

[[case]]
name = "sibling_field_destructor_runs_after_destructure"
description = "Destructuring one field no longer suppresses the WHOLE root's drop: the non-linear sibling's destructor runs exactly once, at scope exit (RUE-1632). Before the fix only 99 was printed."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
struct H { a: L, d: D }
fn main() -> i32 {
    let h = H { a: L { v: 5 }, d: D { v: 41 } };
    let r = h.a.v;
    @dbg(99);
    r
}
""" }]
exit_code = 5
stdout = """99
41
"""

[[case]]
name = "sibling_field_destructor_runs_after_element_destructure"
description = "The array-element shape keeps the sibling field's drop glue too: the destructor runs once after every element is destructured (RUE-1632)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
struct H { arr: [L; 2], d: D }
fn main() -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }], d: D { v: 41 } };
    let r = h.arr[0].v + h.arr[1].v;
    @dbg(99);
    r
}
""" }]
exit_code = 3
stdout = """99
41
"""

[[case]]
name = "sibling_field_destructor_runs_after_destructure_aarch64"
description = "The sibling's drop is scheduled by the shared drop elaboration, so aarch64 emits the same ordering; run natively on the aarch64 lane (RUE-1632)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
struct H { arr: [L; 2], d: D }
fn main() -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }], d: D { v: 41 } };
    let r = h.arr[0].v + h.arr[1].v;
    @dbg(99);
    r
}
""" }]
args = ["main.rue", "--target", "aarch64-linux", "-o", "prog"]
executable_target = "aarch64-linux"
execute_if_native = true
exit_code = 3
stdout = """99
41
"""

[[case]]
name = "sibling_field_destructor_runs_after_destructure_at_O2"
