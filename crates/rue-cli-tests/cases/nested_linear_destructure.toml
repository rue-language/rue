[[case]]
name = "infectious_element_carrier_boundary_unchanged"
description = "An INFECTIOUS carrier element is not destructured: its linear sub-place moves, the Copy sibling stays readable, and the other element's sub-place is still reported (RUE-1591 boundary, unchanged by RUE-1632)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct C { l: L, tag: i32 }
struct H { arr: [C; 2] }
fn sink(l: L) -> i32 { l.v }
fn main() -> i32 {
    let h = H { arr: [C { l: L { v: 1 }, tag: 7 }, C { l: L { v: 2 }, tag: 8 }] };
    sink(h.arr[0].l) + h.arr[0].tag
}
""" }]
compile_fail = true
error_contains = [
    "E0406",
    "'h.arr[1].l' still holds a linear value",
]

[[case]]
name = "infectious_element_carrier_all_subplaces_consumed_runs"
description = "Consuming every element's linear sub-place discharges the infectious carrier (RUE-1606), unchanged by RUE-1632."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct C { l: L, tag: i32 }
struct H { arr: [C; 2] }
fn sink(l: L) -> i32 { l.v }
fn main() -> i32 {
    let h = H { arr: [C { l: L { v: 1 }, tag: 7 }, C { l: L { v: 2 }, tag: 8 }] };
    sink(h.arr[0].l) + sink(h.arr[1].l) + h.arr[0].tag
}
""" }]
exit_code = 10

[[case]]
name = "affine_array_element_field_read_control"
