files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
fn eat(a: [L; 2]) -> i32 { a[0].v }
fn main() -> i32 {
    eat([L { v: 1 }, L { v: 2 }])
}
""" }]
compile_fail = true
error_contains = [
    "E0406",
    "element(s) [1] of 'a' are not consumed on every path",
]

[[case]]
name = "by_value_array_param_all_elements_destructured_runs"
