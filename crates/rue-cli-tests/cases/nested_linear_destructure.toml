[[case]]
name = "declared_linear_copy_projection_drops_residue_immediately_in_order"
description = "A Copy projection consumes the declared-linear value and drops droppable residue immediately, once each, in declaration order."
files = [{ path = "main.rue", source = """
struct D { value: i32 }
drop fn D(self) { @dbg(self.value); }
linear struct Token { first: D, selected: i32, second: D }
fn main() -> i32 {
    let t = Token { first: D { value: 1 }, selected: 7, second: D { value: 2 } };
    let result = t.selected;
    @dbg(99);
    result
}
""" }]
exit_code = 7
stdout = """1
2
99
"""

[[case]]
name = "declared_linear_projection_extracts_before_residue_drop"
description = "The selected value is materialized before a residue destructor mutates its source storage."
files = [{ path = "main.rue", source = """
struct Mutator { target: ptr mut i32 }
drop fn Mutator(self) {
    checked {
        @ptr_write(self.target, 99);
        @dbg(@ptr_read(self.target));
    };
}
linear struct Token { selected: i32, residue: Mutator }
fn main() -> i32 {
    let mut dummy = 0;
    let mut token = Token { selected: 7, residue: Mutator { target: checked { @raw_mut(dummy) } } };
    let target: ptr mut i32 = checked { @raw_mut(token.selected) };
    token.residue.target = target;
    let result = token.selected;
    @dbg(result);
    result
}
"""}]
stdout = """99
7
"""
exit_code = 7

[[case]]
name = "declared_linear_non_copy_projection_preserves_selected_owner"
