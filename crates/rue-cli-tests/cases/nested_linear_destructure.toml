files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
struct H { arr: [L; 2], d: D }
fn main() -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }], d: D { v: 41 } };
    let r = h.arr[0].v + h.arr[1].v;
    @dbg(99);
    r
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
