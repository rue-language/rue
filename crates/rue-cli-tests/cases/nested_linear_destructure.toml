stdout = """99
41
"""

# --- Boundaries the fix must NOT move -------------------------------------

[[case]]
name = "declared_linear_root_projection_leaves_ancestor_obligation"
description = "A declared-linear projection rejects residual linear array elements instead of silently discharging them (RUE-614)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
linear struct H { arr: [L; 2] }
fn main() -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }] };
    h.arr[0].v
}
""" }]
compile_fail = true
error_contains = ["E0406", "linear value 'h' must be consumed"]

[[case]]
name = "declared_linear_root_still_rejects_dropping_a_linear_sibling"
description = "The E0474 destructure check is unchanged: accessing a Copy field of a declared-linear root would drop its linear array field."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
linear struct H { arr: [L; 2], n: i32 }
fn main() -> i32 {
    let h = H { arr: [L { v: 1 }, L { v: 2 }], n: 7 };
    h.n
}
""" }]
compile_fail = true
error_contains = [
    "E0474",
    "would implicitly drop linear field 'arr'",
]

[[case]]
name = "smallest_nested_declared_linear_value_is_consumed"
