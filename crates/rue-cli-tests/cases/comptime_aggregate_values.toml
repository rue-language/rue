[[case]]
name = "wrong_nominal"
files = [{ path = "main.rue", source = '''
@copy struct A { x: i32 }
@copy struct B { x: i32 }
fn value(comptime a: A) -> i32 { a.x }
fn main() -> i32 { value(B { x: 42 }) }
''' }]
compile_fail = true
compile_stderr_not_contains = ["E9000"]
