# StrBuf — the growable-string rung of ADR-0043 (RUE-325).
#
# ADR-0043 de-blesses the old `String` type into `StrBuf`, the string analog of
# `ArrayBuf`. These cases pin the runtime-visible behavior (exact stdout) of
# the canonical `StrBuf` spelling.

[section]
id = "cli.strbuf_library"
name = "StrBuf growable string"
description = "The StrBuf name (ADR-0043) builds, mutates, concatenates, and prints."

[[case]]
name = "strbuf_new_push_str_len_print"
description = "StrBuf.new(), push_str, len, and println on the canonical name."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut s = StrBuf.new();
    s.push_str("hello");
    s.push_str(", world");
    println(s);
    println("len is " + @to_string(s.len()));
    if s == "hello, world" { 0 } else { 1 }
}
""" }]
stdout = "hello, world\nlen is 12\n"
exit_code = 0

[[case]]
name = "strbuf_with_capacity_concat"
description = "StrBuf.with_capacity plus @to_string concatenation build a StrBuf value."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let cap: u64 = 8;
    let mut s = StrBuf.with_capacity(cap);
    s.push_str("n=");
    let combined = s + @to_string(42);
    println(combined);
    0
}
""" }]
stdout = "n=42\n"
exit_code = 0

[[case]]
name = "retired_string_name_is_unknown"
description = "The retired `String` name receives the normal unknown-type diagnostic."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: String = "abc";
    0
}
""" }]
compile_fail = true
error_contains = ["E0204", "unknown type 'String'"]

[[case]]
name = "strbuf_reserved_name"
description = "StrBuf is a reserved built-in type name: users cannot define their own."
files = [{ path = "main.rue", source = """
struct StrBuf { x: i32 }

fn main() -> i32 {
    0
}
""" }]
compile_fail = true
error_contains = ["E0404", "StrBuf", "reserved"]
