# The value-oriented method idiom (self in, Self out) on a >6-slot struct —
# the way this bug actually bites users writing ordinary code.
[[case]]
name = "method_self_update_9_slots"
known_bug = "RUE-13"
files = [{ path = "main.rue", source = """
@copy
struct Stack {
    items: [i32; 8],
    len: u32,

    fn push(self, v: i32) -> Stack {
        let mut s = self;
        s.items[s.len] = v;
        s.len = s.len + 1;
        s
    }

    fn top(self) -> i32 {
        self.items[self.len - 1]
    }
}

fn main() -> i32 {
    let mut s = Stack { items: [0, 0, 0, 0, 0, 0, 0, 0], len: 0 };
    s = s.push(10);
    s = s.push(20);
    @dbg(s.top());
    0
}
""" }]
stdout = "20\n"

# The same stack at 5 slots compiles and runs but MISCOMPILES: the len
# field write is lost through the by-value return, so len stays 0 and
# top() underflows (runtime "integer overflow"). Part of RUE-13.
[[case]]
name = "method_self_update_5_slots"
known_bug = "RUE-13"
files = [{ path = "main.rue", source = """
@copy
struct Stack {
    items: [i32; 4],
    len: u32,

    fn push(self, v: i32) -> Stack {
        let mut s = self;
        s.items[s.len] = v;
        s.len = s.len + 1;
        s
    }

    fn top(self) -> i32 {
        self.items[self.len - 1]
    }
}

fn main() -> i32 {
    let mut s = Stack { items: [0, 0, 0, 0], len: 0 };
    s = s.push(10);
    s = s.push(20);
    @dbg(s.top());
    0
}
""" }]
stdout = "20\n"

