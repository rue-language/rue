# Borrow/inout large aggregates should always work (by reference).
[[case]]
name = "struct_9_slots_borrow_and_inout"
files = [{ path = "main.rue", source = """
struct S {
    items: [i32; 8],
    len: u32,
}

fn total(borrow s: S) -> i32 {
    let mut t = 0;
    let mut i = 0;
    while i < 8 {
        t = t + s.items[i];
        i = i + 1;
    }
    t
}

fn bump(inout s: S) {
    s.items[0] = s.items[0] + 100;
}

fn main() -> i32 {
    let mut s = S { items: [1, 2, 3, 4, 5, 6, 7, 8], len: 8 };
    @dbg(total(borrow s));
    bump(inout s);
    @dbg(total(borrow s));
    0
}
""" }]
stdout = """
36
136
"""
