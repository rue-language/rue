# By-value aggregate ABI stress tests (RUE-13).
#
# Aggregates passed/returned by value are exploded into per-slot arguments.
# This matrix probes sizes around the register boundaries in every pass/return
# combination for structs, bare arrays, and methods.
#
# The convention (ADR-0084, see crate::cfg_lower::type_uses_sret_return in
# rue-codegen): the native row is the compilation target's C row with a wider
# return bank.
#   - Args: placed exactly as the target's C row places them — SysV eightbyte
#     classification, the AAPCS64 composite rules — so an aggregate past the
#     register-passed threshold crosses byval on the caller's stack or through
#     a caller-owned copy.
#   - Returns: an aggregate whose eightbytes fit the native result bank
#     (x86-64: six general-purpose plus eight floating-point; aarch64: eight of
#     each) comes back one register per eightbyte; a larger one comes back
#     through the target row's own indirect-result register (`rdi` with the
#     `rax` echo on SysV, `x8` on AAPCS64).
# All sizes here (5/7/9 slots) pass and return correctly on both backends.

[section]
id = "cli.abi"
name = "By-value aggregate ABI"
description = "Structs and arrays passed/returned by value at sizes around the register boundary."

[[case]]
name = "struct_5_slots_pass_and_return"
files = [{ path = "main.rue", source = """
struct S {
    items: [i32; 4],
    len: u32,
}

fn through(s: S) -> S {
    s
}

fn main() -> i32 {
    let s = S { items: [1, 2, 3, 4], len: 4 };
    let t = through(s);
    @dbg(t.items[3]);
    0
}
""" }]
stdout = "4\n"

[[case]]
name = "struct_9_slots_pass_only"
files = [{ path = "main.rue", source = """
struct S {
    items: [i32; 8],
