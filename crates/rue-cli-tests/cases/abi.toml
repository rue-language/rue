# The value-oriented method idiom (self in, Self out) on a >6-slot struct —
# the way RUE-13 actually bit users writing ordinary code.
[[case]]
name = "method_self_update_9_slots"
files = [{ path = "main.rue", source = """
@copy
struct Stack {
    items: [i32; 8],
    len: u32,

    fn push(self, v: i32) -> Stack {
        let mut s = self;
        s.items[s.len] = v;
        s.len = s.len + 1;
        s
    }

    fn top(self) -> i32 {
        self.items[self.len - 1]
    }
}

fn main() -> i32 {
    let mut s = Stack { items: [0, 0, 0, 0, 0, 0, 0, 0], len: 0 };
    s = s.push(10);
    s = s.push(20);
    @dbg(s.top());
    0
}
""" }]
stdout = "20\n"

# The same stack at 5 slots (fits the return registers on both backends,
# so it takes the register-return path rather than sret).
[[case]]
name = "method_self_update_5_slots"
files = [{ path = "main.rue", source = """
@copy
struct Stack {
    items: [i32; 4],
    len: u32,

    fn push(self, v: i32) -> Stack {
        let mut s = self;
        s.items[s.len] = v;
        s.len = s.len + 1;
        s
    }

    fn top(self) -> i32 {
        self.items[self.len - 1]
    }
}

fn main() -> i32 {
    let mut s = Stack { items: [0, 0, 0, 0], len: 0 };
    s = s.push(10);
    s = s.push(20);
    @dbg(s.top());
    0
}
""" }]
stdout = "20\n"

[[case]]
name = "bare_array_7_pass_only"
files = [{ path = "main.rue", source = """
fn sum_ends(a: [i32; 7]) -> i32 {
    a[0] + a[6]
}

fn main() -> i32 {
    let arr = [1, 2, 3, 4, 5, 6, 7];
    @dbg(sum_ends(arr));
    0
}
""" }]
stdout = "8\n"

[[case]]
name = "bare_array_8_pass_and_return"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn through(a: [i32; 8]) -> [i32; 8] {
    a
}

fn main() -> i32 {
    let arr = [1, 2, 3, 4, 5, 6, 7, 8];
    let b = through(arr);
    @dbg(b[7]);
    0
}
""" }]
stdout = "8\n"

# RUE-92: a user function returning StrBuf by value. The caller has always
# used the sret convention (buffer pointer as hidden first argument) for
# StrBuf-returning calls, but the callee used to return the three slots in
# registers and never write the buffer — len/cap arrived as garbage.
[[case]]
name = "string_return_by_value"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn make() -> StrBuf {
    "hello"
}

fn main() -> i32 {
    let s = make();
    @dbg(s.len());
    @dbg(s);
    0
}
""" }]
stdout = """
5
hello
"""

# sret + user args: the hidden sret pointer shifts every user argument by one
# ABI slot; callee and caller must agree on the shift.
[[case]]
name = "string_return_with_args"
differential_opt = true
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn pick(a: StrBuf, b: StrBuf, n: i32) -> StrBuf {
    if n > 0 { a } else { b }
}

fn main() -> i32 {
    let s = pick("first", "second", 1);
    @dbg(s.len());
    @dbg(s);
    0
}
""" }]
stdout = """
5
first
"""
exit_code = 0

# sret + stack-passed args together: a 9-slot struct argument (slots past the
# arg registers spill to the caller's stack, shifted by the hidden sret
# pointer) to a function that also returns a 9-slot struct via sret.
[[case]]
name = "struct_9_slots_sret_with_stack_args"
files = [{ path = "main.rue", source = """
struct S {
    items: [i32; 8],
    len: u32,
}

fn bump_last(s: S, by: i32) -> S {
    let mut t = s;
    t.items[7] = t.items[7] + by;
    t
}

fn main() -> i32 {
    let s = S { items: [1, 2, 3, 4, 5, 6, 7, 8], len: 8 };
    let t = bump_last(s, 100);
    @dbg(t.items[7]);
    @dbg(t.len);
    0
}
""" }]
stdout = """
108
8
"""

# Borrow/inout large aggregates should always work (by reference).
[[case]]
name = "struct_9_slots_borrow_and_inout"
files = [{ path = "main.rue", source = """
struct S {
    items: [i32; 8],
    len: u32,
}

fn total(borrow s: S) -> i32 {
    let mut t = 0;
    let mut i = 0;
    while i < 8 {
        t = t + s.items[i];
        i = i + 1;
    }
    t
}

fn bump(inout s: S) {
    s.items[0] = s.items[0] + 100;
}

fn main() -> i32 {
    let mut s = S { items: [1, 2, 3, 4, 5, 6, 7, 8], len: 8 };
    @dbg(total(borrow s));
    bump(inout s);
    @dbg(total(borrow s));
    0
}
""" }]
stdout = """
36
136
"""
