[[case]]
name = "x86_64_linux_mixed_bank_returns_round_trip"
description = "A `{i64, f64}` result spans both result banks and a `{f32, f32, i32}` result marshals through its compact image, on x86-64."
files = [{ path = "main.rue", source = """
struct Mixed { a: i64, b: f64 }
struct Packed { a: f32, b: f32, c: i32 }
struct Narrow { a: u8, b: u8, c: u8, d: u8 }

fn mixed() -> Mixed { Mixed { a: 7, b: 2.5 } }
fn packed() -> Packed { Packed { a: 1.5, b: 2.5, c: 4 } }
fn narrow() -> Narrow { Narrow { a: 1, b: 2, c: 3, d: 4 } }

fn main() -> i32 {
    let m = mixed();
    let p = packed();
    let n = narrow();
    @dbg(m.a);
    @dbg(m.b);
    @dbg(p.a);
    @dbg(p.b);
    @dbg(p.c);
    @dbg(n.a + n.b + n.c + n.d);
    0
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
stdout = """
7
2.5
1.5
2.5
4
10
"""
exit_code = 0

