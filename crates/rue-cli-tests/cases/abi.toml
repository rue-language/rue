# The value-oriented method idiom (self in, Self out) on a >6-slot struct —
# the way RUE-13 actually bit users writing ordinary code.
[[case]]
name = "method_self_update_9_slots"
files = [{ path = "main.rue", source = """
@copy
struct Stack {
    items: [i32; 8],
    len: u32,

    fn push(self, v: i32) -> Stack {
        let mut s = self;
        s.items[s.len] = v;
        s.len = s.len + 1;
        s
    }

    fn top(self) -> i32 {
        self.items[self.len - 1]
    }
}

fn main() -> i32 {
    let mut s = Stack { items: [0, 0, 0, 0, 0, 0, 0, 0], len: 0 };
    s = s.push(10);
    s = s.push(20);
    @dbg(s.top());
    0
}
""" }]
stdout = "20\n"

# The same stack at 5 slots (fits the return registers on both backends,
# so it takes the register-return path rather than sret).
[[case]]
name = "method_self_update_5_slots"
files = [{ path = "main.rue", source = """
@copy
struct Stack {
    items: [i32; 4],
    len: u32,

    fn push(self, v: i32) -> Stack {
        let mut s = self;
        s.items[s.len] = v;
        s.len = s.len + 1;
        s
    }

    fn top(self) -> i32 {
        self.items[self.len - 1]
    }
}

fn main() -> i32 {
    let mut s = Stack { items: [0, 0, 0, 0], len: 0 };
    s = s.push(10);
    s = s.push(20);
    @dbg(s.top());
    0
}
""" }]
stdout = "20\n"

[[case]]
name = "bare_array_7_pass_only"
