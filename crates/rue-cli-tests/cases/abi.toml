""" }]
stdout = "8\n"

# RUE-92: a user function returning StrBuf by value. The caller has always
# used the sret convention (buffer pointer as hidden first argument) for
# StrBuf-returning calls, but the callee used to return the three slots in
# registers and never write the buffer — len/cap arrived as garbage.
[[case]]
name = "string_return_by_value"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn make() -> StrBuf {
    "hello"
}

fn main() -> i32 {
    let s = make();
    @dbg(s.len());
    @dbg(s);
    0
}
""" }]
stdout = """
5
hello
"""

# An indirect result plus user args: the hidden result pointer takes the target
# row's own register — SysV's first argument register, which shifts every user
# argument one register right, or AAPCS64's dedicated `x8`, which shifts none —
# and the callee and its caller must agree about which.
[[case]]
name = "string_return_with_args"
differential_opt = true
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn pick(a: StrBuf, b: StrBuf, n: i32) -> StrBuf {
    if n > 0 { a } else { b }
}

fn main() -> i32 {
    let s = pick("first", "second", 1);
    @dbg(s.len());
    @dbg(s);
    0
}
""" }]
stdout = """
5
first
"""
exit_code = 0

# sret + stack-passed args together: a 9-slot struct argument (slots past the
# arg registers spill to the caller's stack, shifted by the hidden sret
# pointer) to a function that also returns a 9-slot struct via sret.
[[case]]
name = "struct_9_slots_sret_with_stack_args"
files = [{ path = "main.rue", source = """
struct S {
    items: [i32; 8],
    len: u32,
}

fn bump_last(s: S, by: i32) -> S {
    let mut t = s;
    t.items[7] = t.items[7] + by;
    t
}

fn main() -> i32 {
    let s = S { items: [1, 2, 3, 4, 5, 6, 7, 8], len: 8 };
    let t = bump_last(s, 100);
    @dbg(t.items[7]);
    @dbg(t.len);
    0
}
""" }]
stdout = """
108
8
"""

# Borrow/inout large aggregates should always work (by reference).
[[case]]
name = "struct_9_slots_borrow_and_inout"
files = [{ path = "main.rue", source = """
struct S {
    items: [i32; 8],
    len: u32,
}

fn total(borrow s: S) -> i32 {
    let mut t = 0;
    let mut i = 0;
    while i < 8 {
        t = t + s.items[i];
        i = i + 1;
    }
    t
}

fn bump(inout s: S) {
    s.items[0] = s.items[0] + 100;
}

fn main() -> i32 {
    let mut s = S { items: [1, 2, 3, 4, 5, 6, 7, 8], len: 8 };
    @dbg(total(borrow s));
    bump(inout s);
    @dbg(total(borrow s));
    0
}
""" }]
stdout = """
36
136
"""

# =============================================================================
# Return-bank shapes (ADR-0084, RUE-2038 / RUE-2010)
# =============================================================================
# A result is classified by exactly the rule its target's C row applies to an
# argument of the same shape, read against the wider native result bank, so the
# same value crosses in the same register file in both directions. These pin the
# shapes where the two banks and the two marshaling forms meet. Each is pinned
# to one target and executed on the matching native CI host.

[[case]]
name = "x86_64_linux_float_carrying_returns_use_the_float_bank"
description = "A one-field float struct, a one-element float array, and a float-carrying enum each come back in the floating-point result bank on x86-64."
files = [{ path = "main.rue", source = """
struct Q { f: f64 }

enum Reading { None, Value(f64) }

fn mk() -> Q { Q { f: 2.5 } }
fn row() -> [f64; 1] { [1.5] }
fn reading() -> Reading { Reading.Value(0.25) }

fn main() -> i32 {
    let q = mk();
    let r = row();
    @dbg(q.f);
    @dbg(r[0]);
    match reading() {
        Reading.None => @dbg(0.0),
        Reading.Value(v) => @dbg(v),
    }
    @float_to_int(q.f + 0.5)
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
stdout = """
2.5
1.5
0.25
"""
exit_code = 3

