fn get_last(s: S) -> i32 {
    s.items[7]
}

fn main() -> i32 {
    let s = S { items: [1, 2, 3, 4, 5, 6, 7, 8], len: 8 };
    @dbg(get_last(s));
    0
}
""" }]
stdout = "8\n"

