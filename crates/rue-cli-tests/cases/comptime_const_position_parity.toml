# Every user-visible comptime position must reduce calls with one propagated
# depth authority (4.14:3, 4.14:18). Declaration-time consts and explicit
# blocks use durable queries; ordinary body calls use the in-body engine. The
# canonical frame evaluator and query scheduler agree at the normative depth
# boundary, so these positions cannot distinguish their depth budgets.
#
# The spec suite pins the semantics; these cases drive the real binary so the
# reduced constants are checked as bytes on stdout, not just as exit codes.

[section]
id = "cli.comptime_const_position_parity"
name = "Comptime const-position parity"
description = "A comptime call reduced at declaration time accepts the same depths the in-body engine accepts."

# RUE-1767: the normative 64-level case is reachable in both positions. The
# root call is depth zero, so the exact next level (65) is the boundary failure.
[[case]]
name = "recursion_depth_agrees_between_positions"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 { comptime { if n == 0 { 0 } else { count(n - 1) + 1 } } }

const X: i64 = count(64);

fn main() -> i32 {
    let y: i64 = count(64);
    if X != y { return 1; }
    @dbg(X);
    0
}
""" }]
stdout = "64\n"
exit_code = 0

[[case]]
name = "exact_depth_boundary_agrees_in_body_position"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 { if n <= 0 { 0 } else { 1 + count(n - 1) } }
fn main() -> i32 { let x: i64 = count(64); @dbg(x); 0 }
""" }]
stdout = "64\n"
exit_code = 0

[[case]]
name = "exact_next_depth_is_rejected_in_const_position"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 { comptime { if n == 0 { 0 } else { count(n - 1) + 1 } } }
const X: i64 = count(65);
fn main() -> i32 { @dbg(X); 0 }
""" }]
compile_fail = true
compile_stderr_contains = ["E1200", "exceeded the maximum nesting depth (64)"]

[[case]]
name = "exact_next_depth_is_rejected_in_block_position"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 { if n <= 0 { 0 } else { 1 + count(n - 1) } }
fn main() -> i32 { let x: i64 = comptime { count(65) }; @dbg(x); 0 }
""" }]
compile_fail = true
compile_stderr_contains = ["E1200", "exceeded the maximum nesting depth (64)"]

[[case]]
name = "exact_next_depth_is_rejected_in_body_position"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 { if n <= 0 { 0 } else { 1 + count(n - 1) } }
fn main() -> i32 { let x: i64 = count(65); @dbg(x); 0 }
""" }]
compile_fail = true
compile_stderr_contains = ["E1200", "exceeded the maximum nesting depth (64)"]

# The shared budget must still fire in every position rather than run the
# compiler out of stack. A runaway comptime recursion is a clean E1200 wherever
# it is written.
[[case]]
name = "runaway_recursion_rejected_in_body_position"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 { comptime { if n == 0 { 0 } else { count(n - 1) + 1 } } }
fn main() -> i32 {
    let y: i64 = count(4000);
    if y != 4000 { return 1; }
    0
}
""" }]
compile_fail = true
compile_stderr_contains = ["E1200", "exceeded the maximum nesting depth"]

[[case]]
name = "runaway_recursion_rejected_in_const_position"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 { comptime { if n == 0 { 0 } else { count(n - 1) + 1 } } }
const X: i64 = count(4000);
fn main() -> i32 {
    if X != 4000 { return 1; }
    0
}
""" }]
compile_fail = true
compile_stderr_contains = ["E1200", "exceeded the maximum nesting depth"]

# RUE-1767: a `comptime { }` block that overruns the depth budget must name the
# depth limit, as 4.14:18 requires. It used to report the generic E1200 reason
# "expression contains values that cannot be known at compile time", which
# points at 4.14:4 -- a runtime-value problem -- and tells the programmer
# nothing about the real cause.
#
# The two positions above route around the body host; a call written directly
# in a block goes through `reduce_external_comptime_call`, whose diagnostic arm
# discarded the depth failure for any call that was neither a self call nor a
# `-> type` call. The guard always fired and always produced the right message;
# only the arm that received it threw it away.
[[case]]
name = "block_position_overrun_names_the_depth_limit"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 {
    if n <= 0 { 0 } else { 1 + count(n - 1) }
}

fn main() -> i32 {
    let x: i64 = comptime { count(4000) };
    @dbg(x);
    0
}
""" }]
compile_fail = true
compile_stderr_contains = ["E1200", "exceeded the maximum nesting depth"]

# The companion control: the fix changes which message an overrun prints, not
# where the budget sits. A depth the block position accepted before must still
# compile and still produce the right value -- otherwise "better diagnostic"
# would have quietly become "stricter compiler".
[[case]]
name = "block_position_accepts_a_depth_within_budget"
files = [{ path = "main.rue", source = """
fn count(comptime n: i64) -> i64 {
    if n <= 0 { 0 } else { 1 + count(n - 1) }
}

fn main() -> i32 {
    let x: i64 = comptime { count(64) };
    @dbg(x);
    0
}
""" }]
stdout = "64\n"
exit_code = 0

# A direct Unit literal is the legacy type-value spelling accepted by the
# durable const initializer. A computed Unit retains the existing E1200
# rejection because it is a value, not a direct type literal.
[[case]]
name = "durable_const_direct_unit_type_value"
files = [{ path = "main.rue", source = """
fn Id(comptime T: type) -> type { T }
const U = Id(());
fn use(value: U) -> U { value }
fn main() -> i32 {
    use(());
    0
}
""" }]
exit_code = 0

[[case]]
name = "durable_const_computed_unit_keeps_type_diagnostic"
files = [{ path = "main.rue", source = """
fn Id(comptime T: type) -> type { T }
const U = Id(comptime { () });
fn main() -> i32 { 0 }
""" }]
compile_fail = true
compile_stderr_contains = ["E1200", "must be a type"]
