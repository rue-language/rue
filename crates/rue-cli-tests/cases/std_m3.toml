[[case]]
name = "std_sort_m3"
description = "sort insertion/quick/is_sorted/binary_search over ArrayBuf(i64) (6 checks -> exit 63)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
exit_code = 63
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    let mut score: i32 = 0;
    let B = std.arraybuf.ArrayBuf(i64);
    let Ou = std.option.Option(u64);

    let v5: i64 = 5;
    let v2: i64 = 2;
    let v9: i64 = 9;
    let v1: i64 = 1;
    let v7: i64 = 7;

    // quicksort
    let mut a = B.new();
    a.push(v5); a.push(v2); a.push(v9); a.push(v1); a.push(v7);
    std.sort.quicksort(i64, inout a);
    if std.sort.is_sorted(i64, borrow a) { score = score + 1; }
    if a.get_or(0, -1) == 1 { score = score + 1; }
    if a.get_or(4, -1) == 9 { score = score + 1; }

    // binary_search: present and absent
    match std.sort.binary_search(i64, borrow a, v7) {
        Ou.Some(i) => { if a.get_or(i, -1) == 7 { score = score + 1; } },
        Ou.None => {},
    }
    let miss: i64 = 3;
    match std.sort.binary_search(i64, borrow a, miss) {
        Ou.Some(i) => {},
        Ou.None => { score = score + 1; },
    }

    // insertion_sort
    let mut b = B.new();
    b.push(v9); b.push(v1); b.push(v5); b.push(v2);
    std.sort.insertion_sort(i64, inout b);
    if std.sort.is_sorted(i64, borrow b) { score = score + 1; }

    if score == 6 { 63 } else { @intCast(score) }
}
""" }]

[[case]]
name = "std_rand_m3"
description = "rand Lcg determinism, bounds, and next_bool (5 checks -> exit 64)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
exit_code = 64
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    let mut score: i32 = 0;

    // Same seed -> identical stream (determinism).
    let mut r1 = std.rand.Lcg.new(12345);
    let mut r2 = std.rand.Lcg.new(12345);
    if r1.next_u64() == r2.next_u64() { score = score + 1; }
    if r1.next_u64() == r2.next_u64() { score = score + 1; }

    // next_below stays in range.
    let mut inrange = true;
    let mut i: u64 = 0;
    while i < 100 {
        if r1.next_below(6) >= 6 { inrange = false; }
        i = i + 1;
    }
    if inrange { score = score + 1; }

    // next_below(0) == 0.
    if r1.next_below(0) == 0 { score = score + 1; }

    // next_u64 stays within the 32-bit state range.
    if r1.next_u64() < 4294967296 { score = score + 1; }

    let _ = r1.next_bool();

    if score == 5 { 64 } else { @intCast(score) }
}
""" }]

[[case]]
name = "std_strbuf_compiler_cutover"
description = "Canonical std StrBuf owns operators, searches, indexing, and mutation (RUE-875)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
exit_code = 65
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn main() -> i32 {
    let a = "hello";
    let b = "hello";
    let needle = "ell";
    let prefix = "he";
    if a != b { return 1; }
    if !a.contains(borrow needle) { return 2; }
    if !a.starts_with(borrow prefix) { return 3; }
    if needle.len() != 3 || prefix.len() != 2 { return 4; }
    if a[1] != 101 { return 5; }
    let joined = a + b;
    if joined.len() != 10 || a.len() != 5 { return 6; }

    // Compiler-synthesized borrows of owned rvalues keep the owner alive
    // through the source method call, then tear it down at the block edge.
    let nested = (@to_string(1) + @to_string(2)) + @to_string(3);
    if nested != "123" { return 7; }
    if (@to_string(7) + @to_string(8)) != "78" { return 8; }
    if (@to_string(12) + @to_string(3))[0] != 49 { return 9; }
    if @to_string(999).len() != 3 { return 10; }

    let mut built = std.strbuf.StrBuf.new();
    built.push(120);
    built.push_str("yz");
    built.reserve(20);
    if built.len() != 3 || built.capacity() < 23 { return 11; }
    let copied = built.clone();
    let middle = copied.substring(1, 2);
    if middle != "yz" { return 12; }
    built.clear();
    if !built.is_empty() { return 13; }
    65
}
""" }]

[[case]]
name = "std_strbuf_chars_share_core_decoder"
description = "Canonical StrBuf strict and lossy character iteration share the core str decoder ABI."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
exit_code = 66
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let valid: StrBuf = "hé";
    let mut count = 0;
    let mut sum: u32 = 0;
    for scalar in valid.chars() {
        count = count + 1;
        sum = sum + scalar;
    }
    if count != 2 || sum != 337 { return 1; }

    let mut invalid = std.strbuf.StrBuf.new();
    invalid.push(97);
    invalid.push(255);
    invalid.push(98);
    let mut lossy_count = 0;
    let mut lossy_sum: u32 = 0;
    for scalar in invalid.chars_lossy() {
        lossy_count = lossy_count + 1;
        lossy_sum = lossy_sum + scalar;
    }
    if lossy_count != 3 || lossy_sum != 65728 { return 2; }
    66
}
""" }]

[[case]]
name = "std_strbuf_formatting_and_text_consumers"
description = "Owned formatting results and every text rung use the shared ptr/len consumer path."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
stdout = "viewfixedowned42\n7\nfixed\n"
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
const S = std.strbuf.StrBuf;

struct Holder { text: S }
struct Outer { holder: Holder }

fn make_outer() -> Outer {
    Outer { holder: Holder { text: "owned" } }
}

fn main() -> i32 {
    let view: str = "view";
    let fixed: Str(8) = "fixed";
    print(view);
    print(fixed);
    print(make_outer().holder.text);
    println(@to_string(42));
    @dbg(std.fmt.int_to_string(i64, 7));
    @dbg(fixed);
    @assert(true, view);
    @assert(true, fixed);
    @assert(true, @to_string(8));
    @assert(true, make_outer().holder.text);
    if false { @panic(fixed); }
    if false { @panic(@to_string(9)); }
    if false { @panic(make_outer().holder.text); }

    let Oi = std.option.Option(i32);
    match @parse_i32(view) { Oi.Some(_) => return 1, Oi.None => {} }
    match @parse_i32(fixed) { Oi.Some(_) => return 2, Oi.None => {} }
    match @parse_i32(@to_string(123)) {
        Oi.Some(value) => if value != 123 { return 4; },
        Oi.None => return 5,
    }

    let projected_concat = make_outer().holder.text + "!";
    if projected_concat != "owned!" { return 6; }
    if make_outer().holder.text != "owned" { return 7; }

    let decimal = std.fmt.int_to_string(i64, -42);
    let hex = std.fmt.to_hex(255);
    let combined = decimal + hex;
    if combined != "-42ff" { return 3; }
    0
}
""" }]

