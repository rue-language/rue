const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
const S = std.strbuf.StrBuf;

struct Holder { text: S }
struct Outer { holder: Holder }

fn make_outer() -> Outer {
    Outer { holder: Holder { text: "owned" } }
}

fn main() -> i32 {
    let view: str = "view";
    let fixed: Str(8) = "fixed";
    print(view);
    print(fixed);
    print(make_outer().holder.text);
    println(@to_string(42));
    @dbg(std.fmt.int_to_string(i64, 7));
    @dbg(fixed);
    @assert(true, view);
    @assert(true, fixed);
    @assert(true, @to_string(8));
    @assert(true, make_outer().holder.text);
    if false { @panic(fixed); }
    if false { @panic(@to_string(9)); }
    if false { @panic(make_outer().holder.text); }

    let Oi = std.option.Option(i32);
    match @parse_i32(view) { Oi.Some(_) => return 1, Oi.None => {} }
    match @parse_i32(fixed) { Oi.Some(_) => return 2, Oi.None => {} }
    match @parse_i32(@to_string(123)) {
        Oi.Some(value) => if value != 123 { return 4; },
        Oi.None => return 5,
    }

    let projected_concat = make_outer().holder.text + "!";
    if projected_concat != "owned!" { return 6; }
    if make_outer().holder.text != "owned" { return 7; }

    let decimal = std.fmt.int_to_string(i64, -42);
    let hex = std.fmt.to_hex(255);
    let combined = decimal + hex;
    if combined != "-42ff" { return 3; }
    0
}
""" }]

