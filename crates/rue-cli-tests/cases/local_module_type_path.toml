# RUE-2426: a `let`-bound module is a type-path root wherever a file-level
# `const` module is (10.4:1: member access through either binding form has
# the same semantics; 10.4:16: `m.Type` and `m.Type(T)` in type positions).
#
# Two resolvers missed the local. Type resolution looked a qualified path's
# root up only among the file's module bindings, so `let b: m.S` was E0204
# "unknown type 'm'". The comptime engine decoded a module path's root only as
# a file-level binding and treated a local of that name as shadowing it, so
# the inference precompute never reduced a head like `m.Option(u64)`: the
# payload literal of `m.Option(u64).Some(3)` defaulted to i32 (E0206), and the
# pattern `m.Option(u64).Some(v)` was E0421. A local that is a module now
# reaches both as a module-typed binding, and the path is walked from that
# module by the canonical per-hop walk.

[section]
id = "cli.local_module_type_path"
name = "Let-bound modules as type-path roots (RUE-2426)"
description = "A let-bound module names types, type constructors and constructor heads as a const-bound module does."

[[case]]
name = "annotation_struct"
description = "let b: m.S through a let-bound import."
differential_opt = true
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import("x.rue");
    let b: m.S = m.S { a: 3 };
    b.a
}
""" },
    { path = "x.rue", source = """
pub struct S { a: i32 }
""" },
]
stdout = ""
exit_code = 3

[[case]]
name = "annotation_type_constructor"
description = "let w: m.Wrap(u64) and a type-alias member m.W in annotation position."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import("x.rue");
    let w: m.Wrap(u64) = m.Wrap(u64) { a: 5000000000 };
    let v: m.W = m.W { a: 3 };
    if w.a > 1 { @intCast(v.a) } else { 0 }
}
""" },
    { path = "x.rue", source = """
pub fn Wrap(comptime T: type) -> type { struct { a: T } }
pub const W = Wrap(u8);
""" },
]
exit_code = 3

