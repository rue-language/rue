name = "join_of_different_modules_is_rejected"
description = "let k = if c { a } else { b }; k.R(u64) { v: 3 } is E0206 at the join."
compile_fail = true
error_contains = ["E0206"]
files = [
    { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");
fn take(p: b.R(u64)) -> i32 { @intCast((p.v + p.w + p.x + p.y) % 256) }
fn main() -> i32 { let c = true; let k = if c { a } else { b }; take(k.R(u64) { v: 3 }) }
""" },
    { path = "a.rue", source = """
pub fn R(comptime T: type) -> type { struct { v: T } }
""" },
    { path = "b.rue", source = """
pub fn R(comptime T: type) -> type { struct { v: T, w: T, x: T, y: T } }
""" },
]
