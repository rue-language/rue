    let r = take(m.R(u64) { v: 3 });
    let m = b;
    r
}
""" },
    { path = "a.rue", source = """
pub fn R(comptime T: type) -> type { struct { v: T } }
""" },
    { path = "b.rue", source = """
pub fn R(comptime T: type) -> type { struct { v: T, w: T, x: T, y: T } }
""" },
]

[[case]]
name = "self_named_local_module_ignores_later_nested_rebinding"
description = "let a = a; take(a.R(u64) { v: 3 }); if false { let a = b; } with take expecting b.R(u64) is E0206."
