# The RUE-2425 review's soundness repro. With the head unreduced, inference
# typed the literal from the parameter it flowed into, and a Box(i64) value
# was passed where Box(i32) is expected. The head now reduces, so the argument
# is compared as the Box(i64) it is.
[[case]]
name = "constructor_head_type_is_checked_at_call"
description = "m.Box(i64) { v: 7 } passed to a lib.Box(i32) parameter is E0206, not an accepted mis-typed value."
compile_fail = true
error_contains = ["E0206", "expected Box(i32), found Box(i64)"]
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn take(b: lib.Box(i32)) -> i32 { b.v }
fn main() -> i32 { let m = lib; let x = m.Box(i64) { v: 7 }; take(x) }
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
""" },
]

[[case]]
name = "comptime_alias_head_type_is_checked_at_call"
description = "let W = m.Box(i64); take(W { .. }) with a value past i32 range is E0206, not a truncated Box(i32)."
compile_fail = true
error_contains = ["E0206", "expected Box(i32), found Box(i64)"]
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn take(b: lib.Box(i32)) -> i32 { b.v }
fn main() -> i32 { let m = lib; let W = m.Box(i64); take(W { v: 3000000000 }) }
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
""" },
]

[[case]]
name = "type_alias_member_as_comptime_argument"
description = "m.I, a type-alias member named through the local, is a comptime type argument of a generic call."
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn main() -> i32 { let m = lib; let b = m.boxed(m.I, 5000000000); if b.v > 1 { 3 } else { 0 } }
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
pub fn boxed(comptime T: type, x: T) -> Box(T) { Box(T) { v: x } }
pub const I = i64;
""" },
]
exit_code = 3

# The RUE-2426 review's landing-order repros. A type named through the local
# module (m.I, m.Box(i64)) now evaluates as a comptime argument, so the generic
# call's substituted `-> Box(T)` return (RUE-2425) is Box(i64) and the call
# argument is compared as that, not typed from the Box(i32) parameter.
[[case]]
name = "local_alias_of_member_as_generic_argument_is_checked_at_call"
description = "let W = m.I; take(lib.boxed(W, 3)) with take expecting lib.Box(i32) is E0206."
compile_fail = true
error_contains = ["E0206", "expected Box(i32), found Box(i64)"]
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn take(b: lib.Box(i32)) -> i32 { b.v }
fn main() -> i32 { let m = lib; let W = m.I; take(lib.boxed(W, 3)) }
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
pub fn boxed(comptime T: type, x: T) -> Box(T) { Box(T) { v: x } }
pub const I = i64;
""" },
]

[[case]]
name = "member_as_generic_argument_is_checked_at_call"
description = "take(lib.boxed(m.I, 3)) with take expecting lib.Box(i32) is E0206."
compile_fail = true
error_contains = ["E0206", "expected Box(i32), found Box(i64)"]
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn take(b: lib.Box(i32)) -> i32 { b.v }
fn main() -> i32 { let m = lib; take(lib.boxed(m.I, 3)) }
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
pub fn boxed(comptime T: type, x: T) -> Box(T) { Box(T) { v: x } }
pub const I = i64;
""" },
]

[[case]]
name = "local_constructor_alias_as_generic_argument_is_checked_at_call"
description = "let W = m.Box(i64); take(lib.boxed(W, x).v) with take expecting lib.Box(i32) is E0206."
compile_fail = true
error_contains = ["E0206", "expected Box(i32), found Box(i64)"]
files = [
