# Linker / cross-compile hygiene regression tests.

[section]
id = "cli.linker"
name = "Linker hygiene"
description = "Cross-compile and link-path behavior, including diagnostic cleanliness."

# RUE-86 regression: the aarch64-macos link path used to emit ~269 raw
# `eprintln!("DEBUG: ...")` lines to stderr on every compile. They are now
# tracing::trace! and must never appear on a normal compile.
#
# RUE-86 regression: compiling for aarch64-macos must not emit raw `DEBUG:`
# eprintln spew to stderr (it used to print ~270 lines from link_macho and
# MachOBuilder).
#
# Per-target runtimes make this a success case on every host. The output is not
# executed when foreign; RUE-864 adds complete structural matrix validation.
[[case]]
name = "aarch64_macos_link_no_debug_spew"
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
args = ["main.rue", "--target", "aarch64-macos", "-o", "prog"]
compile_only = true
executable_target = "aarch64-macos"
compile_stderr_not_contains = ["DEBUG"]

# ---------------------------------------------------------------------------
# RUE-36 / ADR-0034: cross-target executable links select target runtimes.
# Every supported CI host builds every target. The harness inspects foreign
# executables without running them and executes the matching native member.
# ---------------------------------------------------------------------------

[[case]]
name = "cross_link_to_aarch64_linux_succeeds"
description = "Every supported host produces a bounded AArch64 ELF with a resolved runtime entry branch; the native host also exercises strings and allocation."
# Keep the original minimal inline source as parser-corpus continuity; this
# matrix case compiles the checked-in runtime smoke via source_path below.
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
source_path = "cli-test-fixtures/cross_runtime_smoke.rue"
args = ["${SOURCE}", "--target", "aarch64-linux", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
executable_target = "aarch64-linux"
execute_if_native = true
stdout = "runtime matrix\n"
exit_code = 42

[[case]]
name = "cross_link_to_x86_64_linux_succeeds"
description = "Every supported host produces a bounded x86-64 ELF with a resolved runtime entry call; the native host also exercises strings and allocation."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
source_path = "cli-test-fixtures/cross_runtime_smoke.rue"
args = ["${SOURCE}", "--target", "x86-64-linux", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
executable_target = "x86-64-linux"
execute_if_native = true
stdout = "runtime matrix\n"
exit_code = 42

[[case]]
name = "cross_link_to_aarch64_macos_succeeds"
description = "Every supported host produces a bounded arm64 Mach-O with valid loads, relocations, and entry branch; the native host also exercises strings and allocation."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
source_path = "cli-test-fixtures/cross_runtime_smoke.rue"
args = ["${SOURCE}", "--target", "aarch64-macos", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
executable_target = "aarch64-macos"
execute_if_native = true
compile_stderr_not_contains = ["DEBUG", "Plt32", "unsupported relocation"]
stdout = "runtime matrix\n"
exit_code = 42

# Cross-target CODEGEN must keep working everywhere independently of linking.
# These run on every host (on the matching host they are native emits).
[[case]]
name = "emit_asm_for_aarch64_linux_works_everywhere"
description = "--emit asm --target aarch64-linux prints aarch64 assembly on any host without linking."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 42 }
""" }]
args = ["--emit", "asm", "--target", "aarch64-linux", "main.rue"]
compile_only = true
compile_stdout_contains = [
    "=== Assembly (aarch64-linux) ===",
    "stp x29, x30",
    "bl __rue_exit",
]

[[case]]
name = "emit_asm_for_x86_64_linux_works_everywhere"
description = "--emit asm --target x86-64-linux prints x86-64 assembly on any host without linking."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 42 }
""" }]
args = ["--emit", "asm", "--target", "x86-64-linux", "main.rue"]
compile_only = true
compile_stdout_contains = [
    "=== Assembly (x86-64-linux) ===",
    "call __rue_exit",
]
