# Linker / cross-compile hygiene regression tests.

[section]
id = "cli.linker"
name = "Linker hygiene"
description = "Cross-compile and link-path behavior, including diagnostic cleanliness."

# RUE-86 regression: the aarch64-macos link path used to emit ~269 raw
# `eprintln!("DEBUG: ...")` lines to stderr on every compile. They are now
# tracing::trace! and must never appear on a normal compile.
#
# RUE-86 regression: compiling for aarch64-macos must not emit raw `DEBUG:`
# eprintln spew to stderr (it used to print ~270 lines from link_macho and
# MachOBuilder).
#
# Per-target runtimes make this a success case on every host. The output is not
# executed when foreign; RUE-864 adds complete structural matrix validation.
[[case]]
name = "aarch64_macos_link_no_debug_spew"
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
args = ["main.rue", "--target", "aarch64-macos", "-o", "prog"]
compile_only = true
compile_stderr_not_contains = ["DEBUG"]

# ---------------------------------------------------------------------------
# RUE-36 / ADR-0034: cross-target executable links select target runtimes.
# Each case is scoped to hosts where the requested target is foreign.
# ---------------------------------------------------------------------------

[[case]]
name = "cross_link_to_aarch64_linux_succeeds"
description = "On non-aarch64-linux hosts, --target aarch64-linux links with the target runtime."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
args = ["main.rue", "--target", "aarch64-linux", "-o", "prog"]
compile_only = true
only_on = ["x86-64-linux", "aarch64-macos"]

[[case]]
name = "cross_link_to_x86_64_linux_succeeds"
description = "On aarch64 hosts, --target x86-64-linux links with the target runtime."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
compile_only = true
only_on = ["aarch64-linux", "aarch64-macos"]

[[case]]
name = "cross_link_to_aarch64_macos_succeeds"
description = "On linux hosts, --target aarch64-macos links with the target runtime without debug spew."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
args = ["main.rue", "--target", "aarch64-macos", "-o", "prog"]
compile_only = true
compile_stderr_not_contains = ["Plt32", "unsupported relocation"]
only_on = ["x86-64-linux", "aarch64-linux"]

# Cross-target CODEGEN must keep working everywhere: --emit asm doesn't link,
# so it must not be affected by the RUE-36 refusal. These run on every host
# (on the matching host they're a native emit, which must also work).
[[case]]
name = "emit_asm_for_aarch64_linux_works_everywhere"
description = "--emit asm --target aarch64-linux prints aarch64 assembly on any host (no link, no RUE-36 refusal)."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 42 }
""" }]
args = ["--emit", "asm", "--target", "aarch64-linux", "main.rue"]
compile_only = true
compile_stdout_contains = [
    "=== Assembly (aarch64-linux) ===",
    "stp x29, x30",
    "bl __rue_exit",
]

[[case]]
name = "emit_asm_for_x86_64_linux_works_everywhere"
description = "--emit asm --target x86-64-linux prints x86-64 assembly on any host (no link, no RUE-36 refusal)."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 42 }
""" }]
args = ["--emit", "asm", "--target", "x86-64-linux", "main.rue"]
compile_only = true
compile_stdout_contains = [
    "=== Assembly (x86-64-linux) ===",
    "call __rue_exit",
]
