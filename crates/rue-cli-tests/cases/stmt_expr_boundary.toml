[section]
id = "cli.stmt_expr_boundary"
name = "Statement / expression boundary parsing"
description = """
Regression coverage for parser statement/expression-boundary bugs:
RUE-209 (bare break/return used as a while/if condition swallowing the
following block as a value operand), RUE-210 (an if/match expression
statement followed by a line starting with unary minus being greedily parsed
as a subtraction spanning both lines), and RUE-918 (a statement-position
block-like expression followed by any other infix binary operator being
greedily parsed as one binary expression; it is now a syntax error).
"""

# =============================================================================
# RUE-209: a bare `break`/`return` used as a while/if condition must NOT swallow
# the following `{ ... }` block as its value operand. Before the fix this
# desynced the parse and produced a wrong-location E0100 pointing at an outer
# brace; after the fix the block attaches as the loop/if body and the program
# gets a clean, correctly-located diagnostic (here E0206, a real type error).
# =============================================================================

[[case]]
name = "while_break_condition_no_desync"
files = [{ path = "main.rue", source = """
fn main() -> i32 { loop { while break {} } }
""" }]
compile_fail = true
error_contains = ["E0206"]

[[case]]
name = "if_break_condition_no_desync"
files = [{ path = "main.rue", source = """
fn main() -> i32 { loop { if break {} } }
""" }]
compile_fail = true
error_contains = ["E0206"]

# A bare `return` used as a loop condition in a unit-returning function: the
# `{}` attaches as the while body, so the whole thing type-checks and compiles
# cleanly. Before the fix this desynced with a wrong-location E0100.
[[case]]
name = "while_return_condition_compiles"
files = [{ path = "main.rue", source = """
fn sink() { loop { while return {} } }
fn main() -> i32 { sink(); 0 }
""" }]
compile_only = true

# The parenthesized control form was never affected and keeps working: `break`
# is rejected as a real semantic error, not a parse desync.
[[case]]
name = "parenthesized_break_condition_semantic_error"
files = [{ path = "main.rue", source = """
fn main() -> i32 { while (break) {} 0 }
""" }]
compile_fail = true
error_contains = ["E0500"]

# =============================================================================
# RUE-210: an `if`/`match` expression statement followed by a line beginning
# with unary `-` is two statements, not a subtraction. The `if`/`match` value
# is discarded and `-1` is the block's tail expression (exit 255 = -1 & 0xFF).
# Before the fix this parsed as `(if ...) - 1`, exiting 230.
# =============================================================================

[[case]]
name = "if_statement_then_unary_minus"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    if true { 999 } else { 888 }
    -1
}
""" }]
exit_code = 255

[[case]]
name = "match_statement_then_unary_minus"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    match 1 { 1 => 999, _ => 888 }
    -1
}
""" }]
exit_code = 255

# Statement-position only: as a `let` right-hand side the block-like expression
# still binds the ambiguous `-` as subtraction (10 - 5 = 5).
[[case]]
name = "if_minus_operand_still_binds_in_expression_position"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x = if true { 10 } else { 20 } - 5;
    x
}
""" }]
exit_code = 5

# =============================================================================
# RUE-918: in statement position a block-like expression is a COMPLETE statement.
# A following infix binary operator (other than `-`, which starts a new
# statement per RUE-210) is a syntax error, not a continuation. Parentheses opt
# the construct into expression use. (RUE-922 tracks turning `if` into a real
# expression; until then this hole is closed conservatively.)
# =============================================================================

# In statement position an unambiguously-binary `+` no longer swallows the
# leading block-like expression as its left operand; it is a syntax error that
# points at parentheses.
[[case]]
name = "if_then_plus_is_syntax_error"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    if true { 10 } else { 20 } + 5
}
""" }]
compile_fail = true
error_contains = [
    "E0102",
    "block-like expression in statement position is a complete statement",
    "(if c { a } else { b }) + x",
]

# The operator on a following line is equally a syntax error: the block-like
# statement does not reach across the newline into a binary expression.
[[case]]
name = "if_then_plus_next_line_is_syntax_error"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    if true { 10 } else { 20 }
    + 5
}
""" }]
compile_fail = true
error_contains = ["E0102", "block-like expression in statement position"]

# Parentheses opt the construct back into expression position, where the
# operator is an ordinary addition again (10 + 5 = 15).
[[case]]
name = "parenthesized_if_then_plus_is_addition"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    (if true { 10 } else { 20 }) + 5
}
""" }]
exit_code = 15

# Documented current behavior (RUE-922): a postfix continuation (`.method()`,
# indexing, calls) after a statement-position block-like expression is still
# accepted through Pratt. RUE-918 deliberately left this boundary untouched;
# this case pins the status quo so a future change is visible in the diff.
[[case]]
name = "if_then_postfix_method_still_continues"
files = [{ path = "main.rue", source = """
struct P { x: i32, fn get(self) -> i32 { self.x } }
fn main() -> i32 {
    if true { P { x: 7 } } else { P { x: 9 } }.get()
}
""" }]
exit_code = 7
