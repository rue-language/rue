[[case]]
name = "canonical_identity_drives_string_semantics"
description = "Qualified and aliased std StrBuf values use view coercions, indexing, iteration, equality, and transitional runtime helpers."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
const S = std.strbuf.StrBuf;

fn read_len(borrow value: str) -> u64 { value.len() }
fn exclusive_len(inout value: str) -> u64 { value.len() }

fn main() -> i32 {
    let mut value: S = "abc";
    if read_len(borrow value) != 3 { return 1; }
    if exclusive_len(inout value) != 3 { return 2; }
    if value[1] != 98 { return 3; }
    if value != "abc" { return 4; }

    let mut bytes = 0;
    for _byte in value { bytes = bytes + 1; }
    if bytes != 3 { return 5; }

    let mut chars = 0;
    for _char in value.chars() { chars = chars + 1; }
    if chars != 3 { return 6; }
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 0

[[case]]
name = "owned_allocation_drop_and_early_free"
description = "cap > 0 owns an allocation; moved scope-drop and explicit early free each leave one teardown path."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const S = std.strbuf.StrBuf;

fn owned(byte: u8) -> S {
    let p: ptr mut u8 = checked { @alloc(4, 1) };
    checked { @ptr_write(@ptr_offset(p, 0), byte); };
    // White-box: assemble an owned header (cap = 4 exactly, below the 16 floor)
    // over the RawBuf core (RUE-1066).
    let mut s = S.new();
    s.core.buf = p;
    s.core.cap = 4;
    s.len = 1;
    s
}

fn consume(s: S) -> i32 {
    // The moved parameter is the sole owner and is dropped on return.
    if s.len() == 1 && s.capacity() == 4 { 0 } else { 1 }
}

fn main() -> i32 {
    let automatic = owned(65);
    if consume(automatic) != 0 { return 1; }

    let mut early = owned(66);
    early.clear();
    if !early.is_empty() { return 2; }
    if early.capacity() != 4 { return 3; }
    early.free();
    // The later source-defined destructor observes cap == 0 and is a no-op.
    if early.capacity() != 0 { return 4; }
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 0

[[case]]
name = "aliased_three_word_layout_and_scope_drop"
description = "An alias preserves the ptr/cap/len three-word layout (buf/cap nested in the RawBuf core) and source-defined scope-exit destructor."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const S = std.strbuf.StrBuf;

fn make() -> S {
    S.new()
}

fn main() -> i32 {
    // StrBuf nests its growable storage in a RawBuf(u8) core (RUE-1066), so the
    // three machine words are still [buf, cap, len] in memory: the RawBuf core
    // (a two-word {buf, cap}) sits at offset 0, and len follows at offset 16.
    let size = @size_of(S);
    let core_offset: u64 = @offset_of(S, core);
    let len_offset: u64 = @offset_of(S, len);
    if size != 24 { return 1; }
    if core_offset != 0 { return 2; }
    if len_offset != 16 { return 3; }

    // Moving the value returned by make leaves one final owner. Its named,
    // source-defined destructor runs exactly once at this scope exit; cap == 0
    // ensures that teardown does not call @free.
    let s = make();
    if s.is_empty() { 0 } else { 5 }
}
""" }]
exit_code = 0

# RUE-943: std.mem.swap works for move-only aggregates. The doc claims "any T
# (including move-only aggregates)", but `let tmp = a;` would move out of the
# `inout` borrow (E0437). swap instead exchanges the two values byte-for-byte
# through raw-pointer primitives; both bindings stay initialized, so each keeps
# exactly one drop obligation. Executed as a real binary so a double-free or
# leak on the balanced-drop path would abort rather than pass.
[[case]]
name = "mem_swap_exchanges_move_only_strbufs"
description = "std.mem.swap exchanges two owning StrBufs with balanced drops (RUE-943)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
exit_code = 42
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    let S = std.strbuf.StrBuf;
    let mut a = S.new(); a.push(65); a.push(66); a.push(67);  // "ABC"
    let mut b = S.new(); b.push(90);                          // "Z"

    std.mem.swap(S, inout a, inout b);

    // Contents exchanged.
    if a.len() != 1 { return 1; }
    if b.len() != 3 { return 2; }
    if a[0] != 90 { return 3; }
    if b[0] != 65 { return 4; }
    if b[2] != 67 { return 5; }

    // Each binding now owns the other's buffer; both remain independently
    // mutable, proving the exchange moved ownership rather than aliasing.
    b.push(68);                                               // "ABCD"
    a.push(89);                                               // "ZY"
    if b.len() != 4 { return 6; }
    if b[3] != 68 { return 7; }
    if a.len() != 2 { return 8; }
    if a[1] != 89 { return 9; }

    // Both a and b drop here: swap must have preserved exactly one owner per
    // buffer, so neither the original nor the exchanged allocation double-frees.
    42
}
""" }]

# RUE-944: a literal-initialized StrBuf binding (`let mut a: S = "x";`) passes a
# generic `inout T` parameter as StrBuf, matching the concrete `inout StrBuf`
# path. Previously the literal defaulted to `str` storage under generic
# unification (E0206 expected StrBuf found str) while the concrete signature
# pinned it. Both paths now agree the binding's storage is StrBuf.
[[case]]
name = "generic_inout_accepts_literal_initialized_strbuf"
description = "A literal-initialized StrBuf binding passes generic `inout T`, matching the concrete inout path (RUE-944)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
exit_code = 42
files = [{ path = "main.rue", source = """
const std = @import("std");

fn generic_fill(comptime T: type, inout x: T) {
    x.push(66);                                              // 'B'
    x.push(67);                                              // 'C'
}

fn concrete_fill(inout x: std.strbuf.StrBuf) {
    x.push(68);                                              // 'D'
}

fn main() -> i32 {
    let S = std.strbuf.StrBuf;

    // Generic `inout T` with a literal-initialized StrBuf binding (RUE-944).
    let mut a: S = "x";
    generic_fill(S, inout a);
    if a.len() != 3 { return 1; }                            // "xBC"
    if a[0] != 120 { return 2; }
    if a[2] != 67 { return 3; }

    // The concrete `inout StrBuf` path stays covered and agrees.
    let mut c: S = "y";
    concrete_fill(inout c);
    if c.len() != 2 { return 4; }                            // "yD"
    if c[1] != 68 { return 5; }

    42
}
""" }]
