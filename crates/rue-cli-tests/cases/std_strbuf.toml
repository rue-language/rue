[[case]]
name = "source_capacity_overflow_fails_fast"
description = "Reserve overflow follows the canonical allocation-failure contract before touching the owner."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const S = std.strbuf.StrBuf;

fn main() -> i32 {
    // White-box: force a length at the u64 ceiling so the next grow's
    // len + additional overflows. The buffer lives in the RawBuf core (RUE-1066).
    let mut impossible = S.new();
    impossible.len = 18446744073709551615;
    impossible.grow(1);
    0
}
""" }]
exit_code = 101
runtime_error_contains = ["panic: out of memory"]

