# Source-defined std.strbuf.StrBuf (RUE-871), exercised through the real std
# bundle. These cases intentionally use only the qualified or aliased library
# type so no compiler-injected `StrBuf` can satisfy the coverage.

[section]
id = "cli.std_strbuf"
name = "Source-defined std.strbuf.StrBuf"
description = "The named std.strbuf.StrBuf header has its source-defined methods, layout, and drop behavior."

[[case]]
name = "qualified_nonallocating_surface"
description = "Qualified construction and nonallocating methods operate on the source-defined type."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    let mut s = std.strbuf.StrBuf.new();
    if s.len() != 0 { return 1; }
    if s.capacity() != 0 { return 2; }
    if !s.is_empty() { return 3; }
    s.clear();
    if !s.is_empty() { return 4; }
    s.free();
    if s.capacity() != 0 { return 5; }
    0
}
""" }]
exit_code = 0

[[case]]
name = "source_owned_algorithms_use_packed_bytes"
description = "The qualified source type allocates, grows, appends, clones, slices, and concatenates packed bytes."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const S = std.strbuf.StrBuf;

fn main() -> i32 {
    let mut bytes = S.allocate(2);
    bytes.append_byte(1);
    bytes.append_byte(2);
    bytes.append_byte(3);
    bytes.append_byte(4);
    bytes.append_byte(5);
    bytes.append_byte(6);
    bytes.append_byte(7);
    bytes.append_byte(8);
    bytes.append_byte(9);
    bytes.append_byte(10);
    bytes.append_byte(11);
    bytes.append_byte(12);
    bytes.append_byte(13);
    bytes.append_byte(14);
    bytes.append_byte(15);
    bytes.append_byte(16);
    bytes.append_byte(17);
    if bytes.len() != 17 || bytes.capacity() < 17 { return 1; }
    bytes.reserve_source(20);
    if bytes.len() != 17 || bytes.capacity() < 37 { return 2; }
    checked {
        let probe1: u8 = @ptr_read(@ptr_offset(bytes.core.buf, 0));
        if probe1 != 1 { return 3; }
        let probe2: u8 = @ptr_read(@ptr_offset(bytes.core.buf, 7));
        if probe2 != 8 { return 4; }
        let probe3: u8 = @ptr_read(@ptr_offset(bytes.core.buf, 8));
        if probe3 != 9 { return 5; }
        let probe4: u8 = @ptr_read(@ptr_offset(bytes.core.buf, 15));
        if probe4 != 16 { return 6; }
        let probe5: u8 = @ptr_read(@ptr_offset(bytes.core.buf, 16));
        if probe5 != 17 { return 7; }
    };

    let value: S = "abcdefghijklmnopq";
    let copied = value.copy();
    if value != "abcdefghijklmnopq" || copied != value { return 8; }

    let empty = S.new();
    let empty_copy = empty.copy();
    if empty_copy.len() != 0 || empty_copy.capacity() < 16 { return 9; }

    let mut appended: S = "ab";
    let suffix: S = "cdefghijk";
    S.append_owned(suffix, inout appended);
    if appended != "abcdefghijk" { return 10; }

    let middle = value.byte_range(2, 10);
    if middle != "cdefghijkl" { return 11; }
    let right: S = "XY";
    let joined = S.concat_borrowed(borrow middle, borrow right);
    if joined != "cdefghijklXY" { return 12; }
    if middle != "cdefghijkl" || right != "XY" { return 13; }
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 0

[[case]]
name = "source_literal_promotion_self_append_and_adjacent_bytes"
description = "Literal promotion and a reallocating self append preserve every adjacent packed byte."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const S = std.strbuf.StrBuf;

fn main() -> i32 {
    let mut value: S = "abcdefghijk";
    value.duplicate();
    if value != "abcdefghijkabcdefghijk" { return 1; }
    if value.capacity() < value.len() { return 2; }
    checked {
        let probe6: u8 = @ptr_read(@ptr_offset(value.core.buf, 7));
        if probe6 != 104 { return 3; }
        let probe7: u8 = @ptr_read(@ptr_offset(value.core.buf, 8));
        if probe7 != 105 { return 4; }
        let probe8: u8 = @ptr_read(@ptr_offset(value.core.buf, 10));
        if probe8 != 107 { return 5; }
        let probe9: u8 = @ptr_read(@ptr_offset(value.core.buf, 11));
        if probe9 != 97 { return 6; }
        let probe10: u8 = @ptr_read(@ptr_offset(value.core.buf, 21));
        if probe10 != 107 { return 7; }
    };

    let mut reserved: S = "stay";
    reserved.reserve_source(0);
    if reserved != "stay" || reserved.capacity() == 0 { return 8; }

    let mut appended_empty: S = "put";
    let empty = S.new();
    S.append_owned(empty, inout appended_empty);
    if appended_empty != "put" || appended_empty.capacity() == 0 { return 9; }
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 0

[[case]]
name = "source_zero_capacity_empty_ranges_and_early_free"
