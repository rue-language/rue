# Built-in `for` loops over arrays and string views (RUE-220, ADR-0037).
#
# These drive the real compiler and check exact
# stdout / exit codes end to end. The `.chars()` cases in particular exercise
# the `__rue_str_char_scalar` / `__rue_str_char_next` runtime ABI (a
# StrBuf flattened to ptr/len/cap plus a byte offset, returning a scalar / next
# offset), and the strict-UTF-8 decode trap, which the spec harness cannot fully
# observe.

[section]
id = "cli.for_loops"
name = "For loops (iteration layer 1)"
description = "for over arrays, StrBuf bytes, and StrBuf .chars()."

[[case]]
name = "for_array_dbg_elements"
description = "for over an array binds each element in index order; the array is only read, so it stays usable after the loop."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: [i32; 4] = [3, 1, 4, 1];
    let mut sum = 0;
    for x in a {
        @dbg(x);
        sum = sum + x;
    }
    @dbg(a[0]);
    sum
}
""" }]
exit_code = 9
stdout = "3\n1\n4\n1\n3\n"

[[case]]
name = "for_string_bytes_dbg"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "for over a StrBuf yields each byte as u8 in ascending byte order; 'café' is 5 bytes (é = 0xC3 0xA9 = 195, 169)."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "café";
    let mut count = 0;
    for b in s {
        @dbg(b);
        count = count + 1;
    }
    count
}
""" }]
exit_code = 5
stdout = "99\n97\n102\n195\n169\n"

[[case]]
name = "for_chars_scalars_dbg"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "for c in s.chars() decodes UTF-8 and binds each Unicode scalar as u32; 'café' is 4 scalars with é = U+00E9 = 233."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "héllo";
    let mut count = 0;
    for c in s.chars() {
        @dbg(c);
        count = count + 1;
    }
    count
}
""" }]
exit_code = 5
stdout = "104\n233\n108\n108\n111\n"

[[case]]
name = "for_chars_invalid_utf8_traps"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "Strict decode: a truncated multi-byte sequence traps at the decode boundary (exit 101) after the valid prefix has been emitted."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let full: StrBuf = "café";
    let s = full.substring(0, 4);
    for c in s.chars() {
        @dbg(c);
    }
    0
}
""" }]
exit_code = 101
stdout = "99\n97\n102\n"
runtime_error_contains = ["invalid UTF-8"]

[[case]]
name = "for_chars_lossy_valid_dbg"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "for c in s.chars_lossy() decodes well-formed UTF-8 identically to .chars(); 'café' is 4 scalars ending in é = 233."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s: StrBuf = "café";
    let mut count = 0;
    for c in s.chars_lossy() {
        @dbg(c);
        count = count + 1;
    }
    count
}
""" }]
exit_code = 4
stdout = "99\n97\n102\n233\n"

[[case]]
name = "for_chars_lossy_replaces_raw_invalid_bytes"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "Lossy decode over a StrBuf holding a raw invalid byte (0xFF): the bad byte becomes U+FFFD (65533) and iteration continues without trapping — the surrounding ASCII bytes decode normally."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut s = StrBuf.new();
    s.push(97);
    s.push(255);
    s.push(98);
    let mut count = 0;
    for c in s.chars_lossy() {
        @dbg(c);
        count = count + 1;
    }
    count
}
""" }]
exit_code = 3
stdout = "97\n65533\n98\n"

# RUE-2201: parentheses are transparent (4.2:3), so a parenthesized StrBuf
# iterable, a parenthesized `.chars()` receiver and a parenthesized whole view
# are the bare forms: the buffer is iterated by shared read and stays usable
# afterwards, and the scalar views still count scalars rather than bytes.
[[case]]
name = "parenthesized_strbuf_iterables_and_views_do_not_move_the_buffer"
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
exit_code = 75
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let s = StrBuf.from_str(borrow "héllo");
    let mut bytes: i32 = 0;
    for b in (s) { bytes = bytes + 1; }
    let mut scalars: i32 = 0;
    for c in (s).chars() { scalars = scalars + 1; }
    let mut again: i32 = 0;
    for c in (s.chars()) { again = again + 1; }
    let mut lossy: i32 = 0;
    for c in (s.chars_lossy()) { lossy = lossy + 1; }
    // 6 bytes, 5 scalars three times: 60 + 15 = 75, and `s` is still live.
    if bytes == @intCast(s.len()) { @intCast(s.len()) * 10 + scalars + again + lossy } else { 1 }
}
""" }]

# RUE-2254: the `for` binder is `identifier | "_"` (4.8:24). A struct pattern
# is a `let` and match-arm form, and lowering has nowhere to put one, so the
# parser rejects every shape that starts one instead of reaching an ICE.
[[case]]
name = "struct_pattern_for_binder_is_a_syntax_error"
description = "`for Point { x, y } in arr` is rejected at the binder with a syntax error, not an internal compiler error."
args = ["main.rue", "-o", "prog"]
compile_fail = true
files = [{ path = "main.rue", source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let arr = [Point { x: 1, y: 2 }];
    for Point { x, y } in arr { return x + y; }
    0
}
""" }]
error_contains = [
    "error: [E0102]: a `for` binder is one identifier or `_`",
    "for p in xs { let Point { x, y } = p; }",
    "main.rue:4:9",
]
compile_stderr_not_contains = ["internal compiler error"]

[[case]]
name = "type_constructor_for_binder_is_a_syntax_error"
description = "The type-constructor head of a struct pattern is rejected at the `for` binder too, with the struct_patterns preview enabled."
args = ["--preview", "struct_patterns", "main.rue", "-o", "prog"]
compile_fail = true
files = [{ path = "main.rue", source = """
fn Pair(comptime T: type) -> type { struct { x: T, y: T } }
fn main() -> i32 {
    let arr = [Pair(i32) { x: 1, y: 2 }];
    for Pair(i32) { x, y } in arr { return x + y; }
    0
}
""" }]
error_contains = [
    "error: [E0102]: a `for` binder is one identifier or `_`",
    "main.rue:4:9",
]
compile_stderr_not_contains = ["internal compiler error"]
