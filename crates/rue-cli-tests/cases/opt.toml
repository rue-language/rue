# Optimization-correctness regression tests.
#
# These compile at -O2 and assert that mandatory runtime traps (overflow,
# divide-by-zero, out-of-bounds) still fire even when the trapping op's result
# is unused. DCE used to eliminate these (RUE-57), silently turning exit 101
# into exit 0 at -O1+. See crates/rue-cfg/src/opt/dce.rs has_side_effects.

[section]
id = "cli.opt"
name = "Optimization correctness"
description = "Mandatory runtime traps must survive optimization passes."

[[case]]
name = "dce_keeps_overflow_panic_at_O2"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: i32 = 2147483647;
    a + 1;
    0
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["integer overflow"]

[[case]]
name = "dce_keeps_div_by_zero_panic_at_O2"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: i32 = 10;
    let z: i32 = 0;
    a / z;
    0
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["division by zero"]

[[case]]
name = "dce_keeps_bounds_check_panic_at_O2"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let arr: [i32; 3] = [1, 2, 3];
    let i: u64 = 5;
    arr[i];
    0
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["index out of bounds"]

# A genuinely dead, non-trapping computation should still be optimized away,
# and a normal program must produce the same result at -O2 as -O0.
[[case]]
name = "normal_program_unaffected_at_O2"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: i32 = 5;
    let b: i32 = a & 3;
    let mut s = 0;
    let mut i = 0;
    while i < 10 { s = s + i; i = i + 1; }
    s
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 45

# RUE-147: constfold folded signed MIN / -1 (and MIN % -1) to an out-of-range
# constant instead of refusing, eliding the mandatory overflow trap at -O1+
# (printed -2147483648 / 0 instead of panicking). The fold must be refused so
# the runtime guard (RUE-30) still fires.
[[case]]
name = "constfold_keeps_min_div_neg1_trap_at_O1"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let r: i32 = -2147483648 / -1;
    if r == 0 { 7 } else { 8 }
}
""" }]
args = ["main.rue", "-O1", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["integer overflow"]

[[case]]
name = "constfold_keeps_min_mod_neg1_trap_at_O2"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let r: i32 = -2147483648 % -1;
    if r == 0 { 7 } else { 8 }
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["integer overflow"]

[[case]]
name = "constfold_keeps_i64_min_div_neg1_trap_at_O2"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let r: i64 = -9223372036854775808 / -1;
    if r == 0 { 7 } else { 8 }
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["integer overflow"]

# Control: a representable constant division still folds and runs correctly.
[[case]]
name = "constfold_min_plus_one_div_neg1_value_at_O2"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let r: i32 = -2147483647 / -1;
    if r == 2147483647 { 42 } else { 7 }
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 42

# RUE-912 peephole must not strength-reduce trapping shapes. x * 8 with a
# dynamic x that overflows must still trap at every level: reducing it to a
# shift would silently wrap instead (the RUE-57 class).
[[case]]
name = "peephole_keeps_mul_pow2_overflow_trap_at_O2"
files = [{ path = "main.rue", source = """
fn scale(x: i32) -> i32 {
    x * 8
}

fn main() -> i32 {
    scale(268435456);
    0
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["integer overflow"]

# x % -1 must not be treated like x % 1: MIN % -1 traps (the implied
# quotient -MIN is unrepresentable), and -1's canonical constant is
# all-ones, which the fold's == 1 test must reject.
[[case]]
name = "peephole_keeps_mod_neg1_overflow_trap_at_O2"
files = [{ path = "main.rue", source = """
fn rem(x: i32) -> i32 {
    x % -1
}

fn main() -> i32 {
    rem(-2147483648);
    0
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["integer overflow"]
