[section]
id = "cli.friendly_type_diagnostics"
name = "Friendly anonymous constructor diagnostics"
description = "Production CLI coverage for durable anonymous-type presentation across query, import, mixed-argument, identity, and JSON paths."

[[case]]
name = "same_named_declared_types_name_their_modules_in_type_mismatches"
description = "Distinct named nominals with the same short spelling are disambiguated at a type mismatch."
files = [
  { path = "main.rue", source = "const left = @import(\"left.rue\");\nconst right = @import(\"right.rue\");\nfn take(value: left.Token) -> i32 { 0 }\nfn main() -> i32 { take(right.Token { value: 0 }) }\n" },
  { path = "left.rue", source = "pub struct Token { value: i64 }\n" },
  { path = "right.rue", source = "pub struct Token { value: i64 }\n" },
]
compile_fail = true
compile_stderr_contains = ["type mismatch: expected Token (in left.rue), found Token (in right.rue)"]

[[case]]
name = "same_named_declared_types_in_arrays_name_their_modules"
description = "The paired type display keeps module provenance when same-named nominals are nested in arrays."
files = [
  { path = "main.rue", source = "const left = @import(\"left.rue\");\nconst right = @import(\"right.rue\");\nfn take(value: [left.Token; 1]) -> i32 { 0 }\nfn main() -> i32 { take([right.Token { value: 0 }]) }\n" },
  { path = "left.rue", source = "pub struct Token { value: i64 }\n" },
  { path = "right.rue", source = "pub struct Token { value: i64 }\n" },
]
compile_fail = true
compile_stderr_contains = ["type mismatch: expected Token (in left.rue), found Token (in right.rue)"]

[[case]]
name = "same_named_types_in_callback_pointers_name_their_modules"
description = "The paired type display carries provenance through function and pointer types."
files = [
  { path = "main.rue", source = "const left = @import(\"left.rue\");\nconst right = @import(\"right.rue\");\nfn take(callback: fn(ptr const left.Token) -> i32) -> i32 { 0 }\nfn right_callback(value: ptr const right.Token) -> i32 { 0 }\nfn main() -> i32 { take(right_callback) }\n" },
  { path = "left.rue", source = "pub struct Token { value: i64 }\n" },
  { path = "right.rue", source = "pub struct Token { value: i64 }\n" },
]
compile_fail = true
compile_stderr_contains = ["fn(ptr const Token (in left.rue)) -> i32", "fn(ptr const Token (in right.rue)) -> i32"]

[[case]]
name = "same_named_types_in_callback_slices_name_their_modules"
description = "The paired type display carries provenance through callback slice parameters."
files = [
  { path = "main.rue", source = "const left = @import(\"left.rue\");\nconst right = @import(\"right.rue\");\nfn take(callback: fn([left.Token]) -> i32) -> i32 { 0 }\nfn right_callback(value: [right.Token]) -> i32 { 0 }\nfn main() -> i32 { take(right_callback) }\n" },
  { path = "left.rue", source = "pub struct Token { value: i64 }\n" },
  { path = "right.rue", source = "pub struct Token { value: i64 }\n" },
]
compile_fail = true
compile_stderr_contains = ["fn([Token (in left.rue)]) -> i32", "fn([Token (in right.rue)]) -> i32"]

[[case]]
name = "same_module_constructor_arguments_name_their_modules"
description = "The paired canonical application renderer disambiguates same-named type arguments from different modules."
files = [
  { path = "main.rue", source = "const left = @import(\"left.rue\");\nconst right = @import(\"right.rue\");\nfn Wrap(comptime T: type) -> type { struct { value: T } }\nfn take(value: Wrap(left.Token)) -> i32 { 0 }\nfn main() -> i32 { take(Wrap(right.Token) { value: right.Token { value: 0 } }) }\n" },
  { path = "left.rue", source = "pub struct Token { value: i64 }\n" },
  { path = "right.rue", source = "pub struct Token { value: i64 }\n" },
]
compile_fail = true
compile_stderr_contains = ["type mismatch: expected Wrap(Token (in left.rue)), found Wrap(Token (in right.rue))"]

[[case]]
name = "nested_constructor_argument_types_name_their_modules"
description = "An outer constructor retains the source modules of same-named anonymous types nested in its arguments."
files = [
  { path = "main.rue", source = "const left = @import(\"left.rue\");\nconst right = @import(\"right.rue\");\nfn Outer(comptime T: type) -> type { struct { value: T } }\nfn take(value: Outer(left.Inner(i64))) -> i32 { 0 }\nfn main() -> i32 { take(Outer(right.Inner(i64)) { value: right.Inner(i64) { value: 0 } }) }\n" },
  { path = "left.rue", source = "pub fn Inner(comptime T: type) -> type { struct { value: T } }\n" },
  { path = "right.rue", source = "pub fn Inner(comptime T: type) -> type { struct { value: T } }\n" },
]
compile_fail = true
compile_stderr_contains = ["Outer(Inner(i64) (in left.rue))", "Outer(Inner(i64) (in right.rue))"]

[[case]]
name = "body_local_nested_enum_deferred_gate"
description = "A body-local nested enum reaches the deferred E0499 query with its producer spelling intact."
files = [{ path = "main.rue", source = """
linear struct Token { v: i32 }
fn Wrap(comptime T: type) -> type { enum { Some(T), None } }
fn Gated(comptime T: type) -> type {
    @require_droppable(T);
    struct { item: T }
}
fn main() -> i32 {
    let W = Wrap(Token);
    let G = Gated(W);
    let _ = G;
    0
}
""" }]
compile_fail = true
error_contains = ["E0499", "Wrap(Token)"]
compile_stderr_not_contains = ["__anon_"]

[[case]]
name = "mixed_type_value_unit_arguments_preserve_declaration_order"
description = "A value/type/value constructor keeps declaration order and retains the unit argument in E0499."
files = [{ path = "main.rue", source = """
linear struct Token { v: i32 }
fn Mixed(comptime n: i32, comptime T: type, comptime marker: ()) -> type {
    @require_droppable(T);
    struct { item: T }
}
const M = Mixed(7, Token, ());
fn main() -> i32 { let _ = M; 0 }
""" }]
compile_fail = true
error_contains = ["E0499", "Mixed(7, Token, ())"]
compile_stderr_not_contains = ["__anon_"]

[[case]]
name = "imported_same_named_constructors_do_not_cross_contaminate"
description = "Imported constructors with the same name and shape retain identity-specific source arguments rather than path$Ctor or anonymous symbols."
files = [
  { path = "main.rue", source = """
linear struct Token { v: i32 }
const left = @import("left.rue");
const right = @import("right.rue");
fn use_left(value: left.Wrap(Token)) -> i32 { value.missing(); 0 }
fn use_right(value: right.Wrap(i64)) -> i32 { value.missing(); 0 }
fn main() -> i32 {
    use_left(left.Wrap(Token) { item: Token { v: 0 } });
    use_right(right.Wrap(i64) { item: 0 });
    0
}
""" },
  { path = "left.rue", source = """
pub fn Wrap(comptime T: type) -> type { struct { item: T } }
""" },
  { path = "right.rue", source = """
pub fn Wrap(comptime T: type) -> type { struct { item: T } }
""" },
]
compile_fail = true
error_contains = ["E0411", "Wrap(Token)", "Wrap(i64)", "no method named 'missing'"]
compile_stderr_not_contains = ["__anon_", "$Wrap"]

[[case]]
name = "json_method_diagnostic_keeps_friendly_type"
description = "The JSON diagnostic surface carries the same friendly E0413 message as text rendering."
files = [{ path = "main.rue", source = """
linear struct Token { v: i32 }
fn Wrap(comptime T: type) -> type { enum { Some(T), None } }
fn use(value: Wrap(Token)) -> i32 { value.missing(); 0 }
fn main() -> i32 {
    use(Wrap(Token).Some(Token { v: 0 }));
    0
}
""" }]
args = ["--error-format", "json", "main.rue", "-o", "prog"]
compile_fail = true
json_diagnostics = true
error_contains = ["\"code\":\"E0413\"", "Wrap(Token)", "no method named 'missing'"]
compile_stderr_not_contains = ["__anon_"]

[[case]]
name = "undefined_method_keeps_friendly_anonymous_type"
description = "The human E0411 message keeps the complete anonymous producer spelling."
files = [{ path = "main.rue", source = """
fn Wrap(comptime T: type) -> type { struct { item: T } }
fn use(value: Wrap(i64)) -> i32 { value.missing(); 0 }
fn main() -> i32 { use(Wrap(i64) { item: 0 }); 0 }
""" }]
compile_fail = true
compile_stderr_contains = ["error: [E0411]: no method named 'missing' found for type 'Wrap(i64)'"]
compile_stderr_not_contains = ["__anon_", "$Wrap"]

[[case]]
name = "undefined_method_json_keeps_friendly_anonymous_type"
description = "The JSON E0411 message keeps the complete anonymous producer spelling."
files = [{ path = "main.rue", source = """
fn Wrap(comptime T: type) -> type { struct { item: T } }
fn use(value: Wrap(i64)) -> i32 { value.missing(); 0 }
fn main() -> i32 { use(Wrap(i64) { item: 0 }); 0 }
""" }]
args = ["--error-format", "json", "main.rue", "-o", "prog"]
compile_fail = true
json_diagnostics = true
json_diagnostic_order = ["error E0411 main.rue:2:35"]
compile_stderr_contains = ["\"message\":\"no method named 'missing' found for type 'Wrap(i64)'\""]
compile_stderr_not_contains = ["__anon_", "$Wrap", "error: [E0411]"]

[[case]]
name = "associated_function_called_as_method_keeps_friendly_anonymous_type"
description = "The human E0415 message and help keep the complete anonymous producer spelling."
files = [{ path = "main.rue", source = """
fn Wrap(comptime T: type) -> type {
    struct {
        item: T,
        fn answer() -> i32 { 42 }
    }
}
fn use(value: Wrap(i64)) -> i32 { value.answer() }
fn main() -> i32 { use(Wrap(i64) { item: 0 }) }
""" }]
compile_fail = true
compile_stderr_contains = ["error: [E0415]: 'answer' is an associated function, not a method; call it on the type, e.g. `Wrap(i64).answer()`"]
compile_stderr_not_contains = ["__anon_", "$Wrap"]

[[case]]
name = "associated_function_called_as_method_json_keeps_friendly_anonymous_type"
description = "The JSON E0415 message and help keep the complete anonymous producer spelling."
files = [{ path = "main.rue", source = """
fn Wrap(comptime T: type) -> type {
    struct {
        item: T,
        fn answer() -> i32 { 42 }
    }
}
fn use(value: Wrap(i64)) -> i32 { value.answer() }
fn main() -> i32 { use(Wrap(i64) { item: 0 }) }
""" }]
args = ["--error-format", "json", "main.rue", "-o", "prog"]
compile_fail = true
json_diagnostics = true
json_diagnostic_order = ["error E0415 main.rue:7:35"]
compile_stderr_contains = ["\"message\":\"'answer' is an associated function, not a method; call it on the type, e.g. `Wrap(i64).answer()`\""]
compile_stderr_not_contains = ["__anon_", "$Wrap", "error: [E0415]"]
