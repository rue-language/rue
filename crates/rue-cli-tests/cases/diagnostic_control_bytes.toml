[section]
id = "cli.diagnostic_control_bytes"
name = "Diagnostic terminal-byte sanitization"
description = """
Regression coverage for RUE-548: the human diagnostic renderer must neutralize
terminal control bytes in both rendered source excerpts and user-derived message
fields, so a crafted source or import path cannot inject escape sequences
(clear-screen, cursor-move) into a developer terminal. Color is off under the
piped test harness, so the only ESC bytes that could appear are injected ones.
compile_stderr_not_contains asserts no raw ESC survives; the control-picture
glyph confirms the byte was rendered visibly instead. The \\u001B sequences
are TOML escapes: the on-disk source and assertions carry the real bytes.
"""

# ESC bytes in a trailing comment (the reported repro): clear-screen + home.
[[case]]
name = "esc_in_source_comment_is_sanitized"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    nope // \u001B[2J\u001B[H injected
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0201", "␛"]
compile_stderr_not_contains = ["\u001B["]

# NUL byte in source renders as its control picture, not a raw 0x00.
[[case]]
name = "nul_in_source_is_sanitized"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    nope\u0000bad
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["␀"]
compile_stderr_not_contains = ["\u0000"]

# ESC bytes in a module-import specifier reach the E0704 title; sanitize there.
[[case]]
name = "esc_in_module_path_is_sanitized"
files = [{ path = "main.rue", source = """
const m = @import("\u001B[2Jevil.rue");
fn main() -> i32 { 0 }
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0704", "␛"]
compile_stderr_not_contains = ["\u001B["]
