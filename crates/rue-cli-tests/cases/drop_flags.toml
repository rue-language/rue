# Runtime drop flags for branch-divergent moves (RUE-108). A value moved on
# only SOME paths used to be conservatively dropped at scope exit anyway —
# a double-drop on the moving path. The exit drop is now guarded by a
# runtime flag: drop exactly once on every path.

[section]
id = "cli.drop_flags"
name = "Runtime drop flags"
description = "Branch-divergent moves drop exactly once on every path."

[[case]]
name = "if_branch_move_drops_once_each_path"
differential_opt = true
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
fn consume(d: D) -> i32 { d.v }
fn run(c: i32) -> i32 {
    let d = D { v: 7 };
    if c == 1 { consume(d) } else { 0 }
}
fn main() -> i32 {
    @dbg(100);
    run(1);
    @dbg(200);
    run(0);
    @dbg(300);
    0
}
""" }]
stdout = "100\n7\n200\n7\n300\n"
exit_code = 0

[[case]]
name = "match_arm_move_drops_once_each_path"
differential_opt = true
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
fn consume(d: D) -> i32 { d.v }
fn run(c: i32) -> i32 {
    let d = D { v: 9 };
    match c {
        1 => consume(d),
        _ => 0,
    }
}
fn main() -> i32 {
    run(1);
    @dbg(555);
    run(2);
    0
}
""" }]
stdout = "9\n555\n9\n"
exit_code = 0

[[case]]
name = "loop_break_move_drops_once"
differential_opt = true
description = "Conservative loop joins are also corrected at runtime by the flag."
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
fn consume(d: D) -> i32 { d.v }
fn main() -> i32 {
    let d = D { v: 3 };
    let mut i = 0;
    while i < 5 {
        if i == 2 {
            consume(d);
            break;
        }
        i = i + 1;
    }
    @dbg(777);
    0
}
""" }]
stdout = "3\n777\n"
exit_code = 0

# RUE-1737: a partial field move on a break edge must reach the loop exit's
# MoveState. Joining the move and non-move break paths keeps the enclosing
# aggregate drop field-granular on the former path and whole-value on the
# latter.
[[case]]
name = "loop_break_partial_field_move_drops_once"
description = "Multiple infinite-loop breaks join partial-field move state without double-dropping the moved field."
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
struct Pair { first: D, second: D }
fn consume(d: D) -> i32 { d.v }
fn run(move_first: bool) -> i32 {
    let pair = Pair { first: D { v: 1 }, second: D { v: 2 } };
    loop {
        if move_first { consume(pair.first); break; }
        break;
    }
    @dbg(100);
    0
}
fn main() -> i32 {
    run(true);
    run(false);
    0
}
""" }]
stdout = "1\n100\n2\n100\n1\n2\n"

[[case]]
name = "while_break_partial_field_move_drops_once"
description = "While-loop condition-false and multiple break paths preserve partial-field drop state."
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
struct Pair { first: D, second: D }
fn consume(d: D) -> i32 { d.v }
fn run(move_first: bool) -> i32 {
    let pair = Pair { first: D { v: 1 }, second: D { v: 2 } };
    let mut i = 0;
    while i < 1 {
        if move_first { consume(pair.first); break; }
        break;
    }
    @dbg(200);
    0
}
fn main() -> i32 {
    run(true);
    run(false);
    0
}
""" }]
stdout = "1\n200\n2\n200\n1\n2\n"

# The same regression with heap-owning StrBuf fields exercises the real
# destructor/drop-glue ownership path in addition to the trace fixture above.
[[case]]
name = "while_break_partial_strbuf_field_does_not_double_free"
description = "A StrBuf field moved on a while break is not freed again by the enclosing aggregate."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
struct Pair { first: StrBuf, second: StrBuf }
fn consume(s: StrBuf) -> i32 { 1 }
fn main() -> i32 {
    let pair = Pair { first: "first", second: "second" };
    let mut i = 0;
    while i < 1 {
        consume(pair.first);
        break;
    }
    @dbg(300);
    0
}
""" }]
stdout = "300\n"

[[case]]
name = "divergent_move_then_reassign_drops_new_value"
description = "Reassignment after a divergent move re-arms the flag."
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
fn consume(d: D) -> i32 { d.v }
fn run(c: i32) -> i32 {
    let mut d = D { v: 1 };
    if c == 1 {
        consume(d);
        d = D { v: 2 };
    }
    @dbg(50);
    0
}
fn main() -> i32 {
    run(1);
    @dbg(60);
    run(0);
    0
}
""" }]
stdout = "1\n50\n2\n60\n50\n1\n"

[[case]]
name = "param_divergent_move_drops_once_each_path"
differential_opt = true
description = "Owned by-value params get the same flag treatment."
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
fn consume(d: D) -> i32 { d.v }
fn taker(d: D, c: i32) -> i32 {
    if c == 1 { consume(d) } else { 0 }
}
fn main() -> i32 {
    taker(D { v: 4 }, 1);
    @dbg(888);
    taker(D { v: 5 }, 0);
    0
}
""" }]
stdout = "4\n888\n5\n"
exit_code = 0

# RUE-67 regression: match arms are SIBLING paths for the move checker. A move
# in one arm must not leak into the others — using `a` in the `_` arm after
# arm 0 consumed it is valid (exactly one arm runs). At runtime the drop flag
# makes each path drop exactly once: in the consuming arm the flag is cleared
# (drop runs inside `consume`), in the non-consuming arm it stays armed and
# the drop runs at scope exit.
[[case]]
name = "match_sibling_arm_use_after_move_accepted"
differential_opt = true
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
fn consume(d: D) -> i32 { d.v }
fn pick(n: i32) -> i32 {
    let a = D { v: n };
    match n {
        0 => consume(a),
        _ => a.v,
    }
}
fn main() -> i32 {
    let x = pick(0);
    let y = pick(9);
    x + y
}
""" }]
stdout = "0\n9\n"
exit_code = 9
