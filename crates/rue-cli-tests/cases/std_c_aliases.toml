# --- Per-alias exact widths (host run) -------------------------------------
# Pins the two widths that define LP64: c_long is 8 (it is 4 under ILP32/LLP64)
# and c_int is 4. Encoded as c_long*10 + c_int = 84, which fits a u8 exit code.

[[case]]
name = "std_c_alias_exact_widths"
description = "c_long is 8 and c_int is 4 (the LP64 signature): c_long*10 + c_int == 84."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    let i: i32 = @intCast(@size_of(std.c.c_int));
    let l: i32 = @intCast(@size_of(std.c.c_long));
    l * 10 + i
}
""" }]
exit_code = 84

# --- char-family signedness is observable ----------------------------------
# c_schar (i8) sign-extends -1 to -1; c_uchar (u8) zero-extends 255 to 255.
# 255 + (-1) == 254. This is the observable signedness fact of the normative
# scalar table's char rows (the signed/unsigned char types).

[[case]]
name = "std_c_char_family_signedness"
description = "c_schar sign-extends and c_uchar zero-extends: (255 as c_uchar) + (-1 as c_schar) == 254."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    let s: std.c.c_schar = -1;
    let sw: i32 = @intCast(s);
    let u: std.c.c_uchar = 255;
    let uw: i32 = @intCast(u);
    uw + sw
}
""" }]
exit_code = 254

# --- c_int is transparently i32 (no wrapper) -------------------------------
# A std.c.c_int value flows into an i32 binding with no cast/coercion, proving
# the alias is transparent rather than a newtype.

[[case]]
name = "std_c_int_is_transparent_i32"
description = "A std.c.c_int value is directly usable as i32 with no coercion (transparent alias)."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    let x: std.c.c_int = 41;
    let y: i32 = x;
    y + 1
}
""" }]
exit_code = 42

# --- Target data-model descriptor, pinned to each supported target ---------
# @target_data_model() specializes for the emitted target (RUE-417), exactly
# like @target_arch()/@target_os(). Every supported target is LP64 => 64.

[[case]]
name = "x86_64_linux_data_model_is_lp64"
description = "@target_data_model() is DataModel.Lp64 on x86-64-linux."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    match @target_data_model() {
        DataModel.Ilp32 => 32,
        DataModel.Lp64 => 64,
        DataModel.Llp64 => 65,
    }
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
exit_code = 64

[[case]]
name = "aarch64_linux_data_model_is_lp64"
description = "@target_data_model() is DataModel.Lp64 on aarch64-linux (architecture alone does not fix the data model)."
