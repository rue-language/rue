# std.c transparent C scalar aliases + the target data-model descriptor
# (RUE-742 / RUE-1064, ADR-0064 Amendment 1 / P1.5b).
#
# std.c is ordinary Rue source (like std.fs / std.net): transparent type
# aliases naming each C scalar by the width and signedness the *selected
# compilation target's* platform psABI assigns it. Every supported target is
# LP64, so the widths are target-invariant and asserted with a single
# @size_of fingerprint; the three target-pinned cases confirm std.c compiles
# cross-target to the same widths (native host also executes, exactly as
# cli.c_ffi / cli.abi_conformance pin their probes).
#
# The one row that is NOT target-invariant — plain `char` signedness (signed on
# x86-64-linux and aarch64-macos, unsigned on aarch64-linux) — cannot yet be a
# transparent alias, because target intrinsics do not fold in const/comptime
# type position. std.c therefore ships `c_schar`/`c_uchar` (unconditional and
# correct everywhere); their observable sign/zero extension is asserted here.

[section]
id = "cli.std_c_aliases"
name = "std.c transparent C scalar aliases + target data-model descriptor"
description = "std.c width/signedness aliases match the target psABI; @target_data_model() reports LP64 for every supported target (RUE-1064, ADR-0064 P1.5b)."

# --- Width fingerprint, pinned to each supported target --------------------
# Sum of @size_of over every alias: 1+1 (schar/uchar) + 2+2 (short/ushort)
# + 4+4 (int/uint) + 8*7 (long/ulong/longlong/ulonglong/size_t/ssize_t/
# ptrdiff_t) + 4 (wchar_t) + 1 (bool) = 75. Identical on every LP64 target.

[[case]]
name = "x86_64_linux_std_c_alias_widths"
description = "std.c alias widths sum to 75 (LP64) on x86-64-linux."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");

fn main() -> i32 {
    let mut acc: i32 = 0;
    acc = acc + @intCast(@size_of(std.c.c_schar));
    acc = acc + @intCast(@size_of(std.c.c_uchar));
    acc = acc + @intCast(@size_of(std.c.c_short));
    acc = acc + @intCast(@size_of(std.c.c_ushort));
    acc = acc + @intCast(@size_of(std.c.c_int));
    acc = acc + @intCast(@size_of(std.c.c_uint));
    acc = acc + @intCast(@size_of(std.c.c_long));
    acc = acc + @intCast(@size_of(std.c.c_ulong));
    acc = acc + @intCast(@size_of(std.c.c_longlong));
    acc = acc + @intCast(@size_of(std.c.c_ulonglong));
    acc = acc + @intCast(@size_of(std.c.c_size_t));
    acc = acc + @intCast(@size_of(std.c.c_ssize_t));
    acc = acc + @intCast(@size_of(std.c.c_ptrdiff_t));
    acc = acc + @intCast(@size_of(std.c.wchar_t));
    acc = acc + @intCast(@size_of(std.c.c_bool));
    acc
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
exit_code = 75

