# --- @target_data_model() takes no arguments -------------------------------

[[case]]
name = "data_model_rejects_arguments"
description = "@target_data_model(x) is rejected: the intrinsic takes no arguments."
compile_fail = true
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    match @target_data_model(1) {
        DataModel.Ilp32 => 32,
        DataModel.Lp64 => 64,
        DataModel.Llp64 => 65,
    }
}
""" }]
error_contains = ["target_data_model"]
