# `print` / `println` builtin free functions (RUE-1).
#
# `print(s: StrBuf)` writes the raw bytes of `s` to stdout with nothing added;
# `println(s: StrBuf)` writes the bytes then a single `\n`. They borrow the
# StrBuf (do not consume it), so the argument stays usable afterwards. These
# are runtime-visible, so every case pins the exact stdout bytes (including the
# presence or absence of a trailing newline) — the one thing the spec harness's
# exit-code assertions can't see.

[section]
id = "cli.print"
name = "print / println output"
description = "Raw-byte stdout output via the print and println builtins."

[[case]]
name = "print_no_trailing_newline"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    print("hello");
    print(" world");
    0
}
""" }]
stdout = "hello world"

[[case]]
name = "println_adds_single_newline"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    println("hi");
    0
}
""" }]
stdout = "hi\n"

[[case]]
name = "println_composed_with_to_string_and_concat"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    println("value is " + @to_string(42));
    0
}
""" }]
stdout = "value is 42\n"

[[case]]
name = "print_empty_and_println_empty"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    print("");
    println("");
    print("end");
    0
}
""" }]
stdout = "\nend"

[[case]]
name = "print_borrows_string_reusable_after_call"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut s = StrBuf.new();
    s.push_str("built ");
    s.push_str("string");
    print(s);
    print(s);
    println(s);
    0
}
""" }]
stdout = "built stringbuilt stringbuilt string\n"

[[case]]
name = "print_utf8_bytes_verbatim"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    println("café");
    0
}
""" }]
# café = 63 61 66 c3 a9, then a newline — the raw UTF-8 bytes, unmodified.
stdout = "café\n"

[[case]]
name = "user_defined_print_shadows_builtin"
files = [{ path = "main.rue", source = """
fn print(x: i32) -> i32 { x + 1 }

fn main() -> i32 {
    print(41)
}
""" }]
exit_code = 42

[[case]]
name = "eprint_routes_bytes_to_stderr"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    eprint("hello");
    eprint(" world");
    0
}
""" }]
stdout = ""
runtime_error_contains = ["hello world"]

[[case]]
name = "eprintln_routes_newline_to_stderr"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    eprintln("");
    eprintln("done");
    0
}
""" }]
stdout = ""
runtime_error_contains = ["done"]

[[case]]
name = "eprint_borrows_strbuf_and_temporary"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut value = StrBuf.new();
    value.push_str("owned ");
    value.push_str("value");
    eprint(value);
    eprint(value);
    eprintln("temporary " + @to_string(7));
    eprint(value);
    0
}
""" }]
stdout = ""
runtime_error_contains = ["owned valueowned value", "temporary 7", "owned value"]

[[case]]
name = "eprintln_accepts_a_borrowed_str_view"
files = [{ path = "main.rue", source = """
fn emit(borrow value: str) {
    eprintln(value);
}

fn main() -> i32 {
    emit(borrow "view");
    0
}
""" }]
stdout = ""
runtime_error_contains = ["view"]

[[case]]
name = "user_defined_eprint_and_eprintln_shadow_builtins"
files = [{ path = "main.rue", source = """
fn eprint(value: i32) -> i32 { value + 1 }
fn eprintln(value: i32) -> i32 { value + 2 }

fn main() -> i32 {
    eprint(40) + eprintln(1)
}
""" }]
stdout = ""
exit_code = 44

[[case]]
name = "eprint_preserves_utf8_and_nul_bytes"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    eprint("café\\0tail");
    0
}
""" }]
stdout = ""
runtime_error_contains = ["café\u0000tail"]
