# RUE-1341: @ptr_read / @ptr_write pointee types participate in inference.
#
# The typed pointer intrinsics used to derive their types only in semantic
# analysis: inference modeled @ptr_read's result as an unconstrained fresh
# variable and left @ptr_write's value operand entirely free. Two shapes fell
# out of that gap whenever the pointee was not the default integer type:
#
#   * `@ptr_read(p) == 30` with `p: ptr mut u8` — the read's variable had
#     nothing to fix it, the literal defaulted to i32, and sema's pointee
#     reconciliation then reported E0206 "expected i32, found u8".
#   * `@ptr_write(p, @intCast(x))` — @intCast reads its target out of the
#     HM-resolved type, which no constraint reached, so it failed E0709.
#
# Inference now reads the pointee off the pointer operand whenever that operand
# is already concrete in the same pass (annotated binding, parameter, struct
# field). Both aligned and unaligned variants share the machinery, so both are
# covered here. When the pointer operand is NOT resolvable during constraint
# generation — for example an address-of operation over an inferred local, or
# a pointer result whose type is context-dependent — the types stay free
# exactly as before and the old diagnostics are unchanged; those pins live at
# the bottom of this file.

[section]
id = "cli.ptr_pointee_inference"
name = "Pointee-driven inference for the typed pointer intrinsics"
description = "@ptr_read's result and @ptr_write's value operand take their type from a resolved pointer operand during inference."

# --- RUE-1341 repro 1: annotation-free comparison against the pointee -------
[[case]]
name = "ptr_read_comparison_infers_pointee"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut b: u8 = 30;
    let hit: bool = checked {
        let p: ptr mut u8 = @raw_mut(b);
        @ptr_read(p) == 30
    };
    @dbg(hit);
    0
}
""" }]
stdout = "true\n"

[[case]]
name = "ptr_offset_wrong_arity_keeps_intrinsic_diagnostic"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let value: i64 = 7;
    let p: ptr const i64 = checked { @raw(value) };
    checked { @ptr_offset(p) };
    0
}
""" }]
compile_fail = true
error_contains = ["E0701", "ptr_offset", "expects 2 arguments"]
compile_stderr_contains = ["main.rue:4:15"]

[[case]]
name = "ptr_offset_bad_offset_keeps_type_diagnostic"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let value: i64 = 7;
    let p: ptr const i64 = checked { @raw(value) };
    checked { @ptr_offset(p, true) };
    0
}
""" }]
compile_fail = true
error_contains = ["E0702", "ptr_offset", "integer offset"]
compile_stderr_contains = ["main.rue:4:15"]

# --- RUE-1341 repro 2: @intCast target comes from the pointee ---------------
[[case]]
name = "ptr_write_intcast_target_from_pointee"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut b: u8 = 0;
    let x: i32 = 30;
    checked {
        let p: ptr mut u8 = @raw_mut(b);
        @ptr_write(p, @intCast(x));
    };
    @dbg(b);
    0
}
""" }]
stdout = "30\n"

# --- The unaligned pair shares the sema-side typing and the same channel ----
[[case]]
name = "ptr_read_unaligned_comparison_infers_pointee"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut b: u8 = 30;
    let hit: bool = checked {
        let p: ptr mut u8 = @raw_mut(b);
        @ptr_read_unaligned(p) == 30
    };
    @dbg(hit);
    0
}
""" }]
stdout = "true\n"

[[case]]
name = "ptr_write_unaligned_intcast_target_from_pointee"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut b: u8 = 0;
    let x: i32 = 30;
    checked {
        let p: ptr mut u8 = @raw_mut(b);
        @ptr_write_unaligned(p, @intCast(x));
    };
    @dbg(b);
    0
}
""" }]
stdout = "30\n"

# --- A parameter is a resolved pointer operand too --------------------------
# The pointee flows in from the signature rather than a local annotation, and
# the read's result is consumed by an unannotated `let` that only ever sees the
# pointee type.
[[case]]
name = "ptr_read_through_parameter_infers_pointee"
files = [{ path = "main.rue", source = """
fn load(p: ptr const u16) -> bool {
    checked { @ptr_read(p) == 4097 }
}
fn main() -> i32 {
    let v: u16 = 4097;
    let hit: bool = checked { load(@raw(v)) };
    @dbg(hit);
    0
}
""" }]
stdout = "true\n"

# --- A struct field holding the pointer is resolved in the same pass --------
[[case]]
name = "ptr_write_through_struct_field_pointee"
files = [{ path = "main.rue", source = """
struct Cell { at: ptr mut u8 }
fn main() -> i32 {
    let mut b: u8 = 0;
    let n: i64 = 200;
    checked {
        let c: Cell = Cell { at: @raw_mut(b) };
        @ptr_write(c.at, @intCast(n));
    };
    @dbg(b);
    0
}
""" }]
stdout = "200\n"

# --- The pointee drives a NON-integer value operand as well -----------------
# `@ptr_write(p, cond)` used to leave `cond`'s literal-free bool alone; the
# equality constraint must not disturb an aggregate/bool pointee round-trip.
[[case]]
name = "ptr_read_write_bool_pointee_roundtrip"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut flag: bool = false;
    let seen: bool = checked {
        let p: ptr mut bool = @raw_mut(flag);
        @ptr_write(p, true);
        @ptr_read(p)
    };
    @dbg(seen);
    0
}
""" }]
stdout = "true\n"

# --- A wrong-typed value operand is still a type error ----------------------
# Inference now catches it instead of sema, and the code stays E0206.
[[case]]
name = "ptr_write_value_type_mismatch_is_e0206"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut b: u8 = 0;
    let x: i32 = 7;
    checked {
        let p: ptr mut u8 = @raw_mut(b);
        @ptr_write(p, x);
    };
    0
}
""" }]
compile_fail = true
error_contains = ["E0206"]

# --- An out-of-range literal is still the honest range diagnostic -----------
# The value operand's constraint must not turn RUE-275's E0800 into a plain
# unification failure: an integer literal still unifies with any integer type.
[[case]]
name = "ptr_write_literal_out_of_range_still_e0800"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut b: u8 = 0;
    checked {
        let p: ptr mut u8 = @raw_mut(b);
        @ptr_write(p, 300);
    };
    0
}
""" }]
compile_fail = true
error_contains = ["E0800"]

# --- An in-range literal still takes the pointee type, not i32 (RUE-275) ----
[[case]]
name = "ptr_write_literal_takes_pointee_type"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut b: u8 = 0;
    checked {
        let p: ptr mut u8 = @raw_mut(b);
        @ptr_write(p, 200);
    };
    @dbg(b);
    0
}
""" }]
stdout = "200\n"

# --- PIN: an unresolvable pointer operand keeps today's behavior ------------
# An inferred local has no concrete type while constraint generation visits its
# address, so `@raw_mut(b)` remains free and the value operand has no
# expectation to read. Inference never guesses a pointee it cannot see, and
# this diagnostic is deliberately unchanged by RUE-1352.
[[case]]
name = "ptr_write_unresolved_pointer_operand_still_e0709"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut b = 0;
    let x: i32 = 30;
    checked {
        @ptr_write(@raw_mut(b), @intCast(x));
    };
    @dbg(b);
    0
}
""" }]
compile_fail = true
error_contains = ["E0709"]

# --- PIN: sema still owns the pointee reconciliation it always owned --------
# With an unresolvable pointer operand the read's result is still a fresh
# variable that the annotation fixes, and sema compares it to the pointee
# (RUE-244). Unchanged by RUE-1341.
[[case]]
name = "ptr_read_unresolved_pointer_operand_still_e0206"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let v: i64 = 42;
    let x: i32 = checked { @ptr_read(@raw(v)) };
    x
}
""" }]
compile_fail = true
error_contains = ["E0206"]

# --- RUE-1352: address-of results publish their concrete pointee ------------
[[case]]
name = "raw_const_direct_read_infers_pointee"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let value: u16 = 4097;
    let hit: bool = checked { @ptr_read(@raw(value)) == 4097 };
    @dbg(hit);
    0
}
""" }]
stdout = "true\n"

[[case]]
name = "raw_mut_direct_write_infers_pointee"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut value: u8 = 0;
    let source: i64 = 200;
    checked { @ptr_write(@raw_mut(value), @intCast(source)); };
    @dbg(value);
    0
}
""" }]
stdout = "200\n"

[[case]]
name = "field_ptr_direct_write_preserves_field_type"
files = [{ path = "main.rue", source = """
struct Pair { narrow: u8, wide: i64 }
fn main() -> i32 {
    let mut pair = Pair { narrow: 0, wide: 0 };
    let source: i64 = 200;
    checked { @ptr_write(@field_ptr(pair.narrow), @intCast(source)); };
    @dbg(pair.narrow);
    0
}
""" }]
stdout = "200\n"

[[case]]
name = "const_pointer_cannot_assign_to_mutable_accessor_place"
files = [{ path = "main.rue", source = """
struct Holder {
    slot: ptr mut u8,
    fn slot_mut(inout self) -> inout ptr mut u8 { yield self.slot; }
}
fn main() -> i32 {
    let mut value: u8 = 1;
    let mut holder = Holder { slot: @raw_mut(value) };
    holder.slot_mut() = @raw(value);
    0
}
""" }]
compile_fail = true
error_contains = ["E0206", "ptr mut u8", "ptr const u8"]

[[case]]
name = "mutable_intrinsic_cannot_assign_to_const_local"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut value: u8 = 1;
    let mut slot: ptr const u8 = checked { @raw(value) };
    slot = @raw_mut(value);
    0
}
""" }]
compile_fail = true
error_contains = ["E0206", "ptr const u8", "ptr mut u8"]

[[case]]
name = "raw_mut_cannot_be_annotated_as_const_pointer"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut value: u8 = 1;
    let view: ptr const u8 = checked { @raw_mut(value) };
    @ptr_to_int(view);
    0
}
""" }]
compile_fail = true
error_contains = ["E0206", "ptr const u8", "ptr mut u8"]

[[case]]
name = "field_ptr_cannot_be_annotated_as_const_pointer"
files = [{ path = "main.rue", source = """
struct Pair { value: u8 }
fn main() -> i32 {
    let mut pair = Pair { value: 1 };
    let view: ptr const u8 = checked { @field_ptr(pair.value) };
    @ptr_to_int(view);
    0
}
""" }]
compile_fail = true
error_contains = ["E0206", "ptr const u8", "ptr mut u8"]

[[case]]
name = "mutable_intrinsic_cannot_assign_to_const_accessor_place"
files = [{ path = "main.rue", source = """
struct Holder {
    slot: ptr const u8,
    fn slot_const(inout self) -> inout ptr const u8 { yield self.slot; }
}
fn main() -> i32 {
    let mut value: u8 = 1;
    let mut holder = Holder { slot: @raw(value) };
    holder.slot_const() = @raw_mut(value);
    0
}
""" }]
compile_fail = true
error_contains = ["E0206", "ptr const u8", "ptr mut u8"]

[[case]]
name = "indirect_mutable_pointer_does_not_coerce_to_const"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut value: u8 = 1;
    let mutable: ptr mut u8 = checked { @raw_mut(value) };
    let immutable: ptr const u8 = mutable;
    @ptr_to_int(immutable);
    0
}
""" }]
compile_fail = true
error_contains = ["E0206", "expected ptr const u8", "found ptr mut u8"]

[[case]]
name = "nested_pointer_arrays_do_not_coerce_mutability"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut value: u8 = 1;
    let mutable: [ptr mut u8; 1] = checked { [@raw_mut(value)] };
    let immutable: [ptr const u8; 1] = mutable;
    @ptr_to_int(immutable[0]);
    0
}
""" }]
compile_fail = true
error_contains = ["E0206"]

[[case]]
name = "ptr_offset_preserves_const_and_mut_pointer_types"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let value: i64 = 4097;
    let mut changed: u16 = 0;
    let hit: bool = checked { @ptr_read(@ptr_offset(@raw(value), 0)) == 4097 };
    let source: i64 = 4095;
    checked { @ptr_write(@ptr_offset(@raw_mut(changed), 0), @intCast(source)); };
    @dbg(hit);
    @dbg(changed);
    0
}
""" }]
stdout = "true\n4095\n"

[[case]]
name = "raw_fixed_array_element_infers_pointee"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut values: [i64; 1] = [0];
    let source: i32 = 4095;
    checked { @ptr_write(@raw_mut(values[0]), @intCast(source)); };
    @dbg(values[0]);
    0
}
""" }]
stdout = "4095\n"

# A non-place operand remains sema-owned even when its value is concrete.
[[case]]
name = "raw_counterfeit_mismatch_keeps_place_diagnostic"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let p: ptr const u8 = checked { @raw(42) };
    @ptr_to_int(p);
    0
}
""" }]
compile_fail = true
error_contains = ["E0485", "addressable place"]

[[case]]
name = "field_ptr_local_counterfeit_keeps_field_diagnostic"
files = [{ path = "main.rue", source = """
struct Pair { value: i64 }
fn main() -> i32 {
    let pair = Pair { value: 7 };
    let fp: ptr mut u8 = checked { @field_ptr(pair) };
    @ptr_to_int(fp);
    0
}
""" }]
compile_fail = true
error_contains = ["E0490", "field access"]

[[case]]
name = "field_ptr_index_counterfeit_keeps_field_diagnostic"
files = [{ path = "main.rue", source = """
