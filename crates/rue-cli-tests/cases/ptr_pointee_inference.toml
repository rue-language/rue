    let values: [i64; 1] = [7];
    let fp: ptr mut u8 = checked { @field_ptr(values[0]) };
    @ptr_to_int(fp);
    0
}
""" }]
compile_fail = true
error_contains = ["E0490", "field access"]

[[case]]
name = "raw_string_index_counterfeit_keeps_place_diagnostic"
files = [{ path = "main.rue", source = """
