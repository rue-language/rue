# Multi-slot aggregate consumer sites (RUE-118).
#
# A multi-slot aggregate (struct, struct-with-array, or the 3-slot String fat
# pointer) read from a *place* — a struct field `h.s`/`w.p` or a rebound local —
# must materialize ALL its slots at every consumer site, not just slot 0. These
# pin the fixed behavior after routing every consumer (call arg, return, Alloc,
# Store, StructInit field, @dbg, drop) through `get_or_compute_field_vregs`.
# Previously these silently miscompiled (wrong value, no diagnostic) or ICE'd.
# Runs on both backends — the aarch64 runtime path is only exercised in CI.

[section]
id = "cli.aggregate_slots"
name = "Multi-slot aggregate place-read consumers"
description = "All slots of a place-read aggregate must reach every consumer site, both backends."

# By-value struct arg sourced from a struct field — previously passed only slot 0
# (silent miscompile: returned 10 instead of 30).
[[case]]
name = "struct_arg_from_field"
files = [{ path = "main.rue", source = """
struct Point { x: i32, y: i32 }
struct Wrap { p: Point, tag: i32 }
fn sum(pt: Point) -> i32 { pt.x + pt.y }
fn main() -> i32 {
    let w = Wrap { p: Point { x: 10, y: 20 }, tag: 1 };
    sum(w.p)
}
""" }]
exit_code = 30

# Struct returned by value sourced from a struct field — previously returned only
# slot 0 (silent miscompile: returned 11 instead of 30).
[[case]]
name = "struct_return_from_field"
files = [{ path = "main.rue", source = """
struct Point { x: i32, y: i32 }
struct Wrap { p: Point, tag: i32 }
fn get_p(w: Wrap) -> Point { w.p }
fn main() -> i32 {
    let w = Wrap { p: Point { x: 10, y: 20 }, tag: 1 };
    let p = get_p(w);
    p.x + p.y
}
""" }]
exit_code = 30

# Multi-slot struct read from a field, rebound to a local (Alloc) — previously
# kept only slot 0.
[[case]]
name = "struct_field_rebound_to_local"
files = [{ path = "main.rue", source = """
struct Point { x: i32, y: i32 }
struct A { p: Point }
fn main() -> i32 {
    let a = A { p: Point { x: 10, y: 20 } };
    let q = a.p;
    q.x + q.y
}
""" }]
exit_code = 30

# StructInit with a nested-struct field sourced from a place-read — previously an
# ICE ("nested struct field should have slot vregs in cache").
[[case]]
name = "struct_init_nested_field_from_place"
files = [{ path = "main.rue", source = """
struct Point { x: i32, y: i32 }
struct A { p: Point }
struct B { p: Point, tag: i32 }
fn main() -> i32 {
    let a = A { p: Point { x: 10, y: 20 } };
    let b = B { p: a.p, tag: 99 };
    b.p.x + b.p.y
}
""" }]
exit_code = 30

# Store of a String sourced from a struct field — previously an ICE
# ("string should have fat pointer fields in Store").
[[case]]
name = "store_string_from_field"
files = [{ path = "main.rue", source = """
struct Holder { s: String, n: i32 }
fn main() -> i32 {
    let h = Holder { s: "hello", n: 7 };
    let mut s2 = "init";
    s2 = h.s;
    if s2 == "hello" { 5 } else { 0 }
}
""" }]
exit_code = 5

# @dbg of a String sourced from a struct field — previously an ICE
# ("string value should have field vregs for fat pointer"). Prints the string.
[[case]]
name = "dbg_string_from_field"
files = [{ path = "main.rue", source = """
struct Holder { s: String, n: i32 }
fn main() -> i32 {
    let h = Holder { s: "hi", n: 1 };
    @dbg(h.s);
    0
}
""" }]
exit_code = 0
stdout = "hi\n"

# Struct containing an array field, copied by value — regression guard that the
# StructInit/Alloc slot lists stay fully flattened (array elements included).
[[case]]
name = "struct_with_array_field_copy"
files = [{ path = "main.rue", source = """
struct S { a: [i32; 3], n: i32 }
fn main() -> i32 {
    let s = S { a: [1, 2, 3], n: 9 };
    let t = s;
    t.a[2] + t.n
}
""" }]
exit_code = 12

# ── RUE-118 part 2: arrays + PlaceWrite ──────────────────────────────────────
# The struct-shaped fixes above left their array-shaped and write-side siblings
# broken. These pin the second wave: array return/args (RUE-78/79), whole-
# aggregate reassignment (RUE-80), and multi-slot PlaceWrite (RUE-23).

# RUE-78: returning an array by value lost all elements (only the ArrayInit
# placeholder vreg reached the return register).
[[case]]
name = "array_return_by_value"
files = [{ path = "main.rue", source = """
fn make() -> [i32; 3] { [10, 20, 30] }
fn main() -> i32 { let arr = make(); arr[0] + arr[1] + arr[2] }
""" }]
exit_code = 60

# RUE-78 (struct flavor): a struct containing an array field returned by value.
[[case]]
name = "struct_with_array_field_return"
files = [{ path = "main.rue", source = """
struct Grid { cells: [i32; 3], n: i32 }
fn make() -> Grid { Grid { cells: [10, 20, 30], n: 7 } }
fn main() -> i32 { let g = make(); g.cells[0] + g.cells[1] + g.cells[2] + g.n }
""" }]
exit_code = 67

# RUE-79: multidimensional array passed by value dropped every row after the
# first (the arg ladder iterated element count, not slot count).
[[case]]
name = "multidim_array_arg"
files = [{ path = "main.rue", source = """
fn sum(g: [[i32; 2]; 2]) -> i32 { g[0][0] + g[0][1] + g[1][0] + g[1][1] }
fn main() -> i32 { let g = [[1, 2], [3, 4]]; sum(g) }
""" }]
exit_code = 10

# Same shape but the nested array literal passed directly (exercises the
# flattened ArrayInit slot cache rather than the Load path).
[[case]]
name = "multidim_array_literal_arg"
files = [{ path = "main.rue", source = """
fn sum(g: [[i32; 2]; 2]) -> i32 { g[0][0] + g[0][1] + g[1][0] + g[1][1] }
fn main() -> i32 { sum([[1, 2], [3, 4]]) }
""" }]
exit_code = 10

# RUE-80: whole-aggregate reassignment copied only the first slot.
[[case]]
name = "whole_array_reassign"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: [i32; 3] = [11, 22, 33];
    let mut b: [i32; 3] = [0, 0, 0];
    b = a;
    b[0] + b[1] + b[2]
}
""" }]
exit_code = 66

# RUE-23: assigning a multi-slot struct to a struct field stored only slot 0.
[[case]]
name = "place_write_struct_field"
files = [{ path = "main.rue", source = """
struct Inner { a: i32, b: i32 }
struct Outer { x: i32, inner: Inner }
fn main() -> i32 {
    let mut o = Outer { x: 1, inner: Inner { a: 0, b: 0 } };
    let i = Inner { a: 20, b: 21 };
    o.inner = i;
    o.x + o.inner.a + o.inner.b
}
""" }]
exit_code = 42

# RUE-23 (array-element flavor): assigning a multi-slot struct into an indexed
# element (dynamic-address store path).
[[case]]
name = "place_write_array_element"
files = [{ path = "main.rue", source = """
struct P { a: i32, b: i32 }
fn main() -> i32 {
    let mut arr: [P; 2] = [P { a: 0, b: 0 }, P { a: 0, b: 0 }];
    let p = P { a: 20, b: 22 };
    arr[0] = p;
    arr[0].a + arr[0].b
}
""" }]
exit_code = 42

# RUE-25: a struct produced by an if/else block expression passed directly as a
# call argument (BlockParam producer) — fixed in part 1, regression-pinned here.
[[case]]
name = "block_expr_struct_arg"
files = [{ path = "main.rue", source = """
struct P { a: i32, b: i32 }
fn get_b(p: P) -> i32 { p.b }
fn main() -> i32 {
    let cond = true;
    get_b(if cond { P { a: 10, b: 42 } } else { P { a: 1, b: 2 } })
}
""" }]
exit_code = 42

# ---------------------------------------------------------------------------
# RUE-188: whole-aggregate EXTRACT producer (indexed element arr[K]/arr[i] or
# array-typed struct field s.arr). The June RUE-118 fix converted aggregate
# CONSUMERS but never the extract PRODUCER, so extracting a multi-slot
# aggregate materialized only slot 0 (7/0/0 instead of 7/8/9). Now routed
# through the agg_slots accessor's indexed-place-read path (load all slots
# through the formed address), both backends.

# (a) array-typed struct field extract: `let a = s.arr;`
[[case]]
name = "extract_struct_field_array"
files = [{ path = "main.rue", source = """
struct S { arr: [i64; 3], tail: i64 }
fn main() -> i32 {
    let s = S { arr: [7, 8, 9], tail: 42 };
    let a = s.arr;
    @dbg(a[0]); @dbg(a[1]); @dbg(a[2]);
    0
}
""" }]
stdout = "7\n8\n9\n"

# (b) 2D-literal row extract, constant index: `let row = m[1];`
[[case]]
name = "extract_row_const_index"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    let row = m[1];
    @dbg(row[0]); @dbg(row[1]); @dbg(row[2]);
    0
}
""" }]
stdout = "10\n20\n30\n"

# (b') 2D-literal row extract, dynamic index: `let i = 1; let row = m[i];`
[[case]]
name = "extract_row_dynamic_index"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    let i = 1;
    let row = m[i];
    @dbg(row[0]); @dbg(row[1]); @dbg(row[2]);
    0
}
""" }]
stdout = "10\n20\n30\n"

# (b'') row extract through a by-ref (borrow) 2D-array param.
[[case]]
name = "extract_row_from_borrow_param"
files = [{ path = "main.rue", source = """
fn get2(borrow m: [[i64; 3]; 2]) -> i64 {
    let row = m[1];
    row[0] + row[1] + row[2]
}
fn main() -> i32 {
    let m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    @dbg(get2(borrow m));
    0
}
""" }]
stdout = "60\n"

# (b''') row extract from an array-typed struct field indexed: `g.rows[1]`.
[[case]]
name = "extract_row_from_struct_field_index"
files = [{ path = "main.rue", source = """
struct Grid { rows: [[i64; 3]; 2] }
fn main() -> i32 {
    let g = Grid { rows: [[1, 2, 3], [10, 20, 30]] };
    let r = g.rows[1];
    @dbg(r[0]); @dbg(r[1]); @dbg(r[2]);
    0
}
""" }]
stdout = "10\n20\n30\n"

# (c) indexed row passed by value to a function (was 100 instead of 123).
[[case]]
name = "extract_row_as_call_arg"
files = [{ path = "main.rue", source = """
fn sum(a: [i64; 3]) -> i64 { a[0] + a[1] + a[2] }
fn main() -> i32 {
    let m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    @dbg(sum(m[0]));
    0
}
""" }]
stdout = "6\n"

# (d) RETURN position: `fn get(m) -> [i64;3] { m[1] }`. Was memory disclosure
# (stale-frame garbage) — must return the real row.
[[case]]
name = "extract_row_return_position"
files = [{ path = "main.rue", source = """
fn get(m: [[i64; 3]; 2]) -> [i64; 3] { m[1] }
fn main() -> i32 {
    let m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    let a = get(m);
    @dbg(a[0]); @dbg(a[1]); @dbg(a[2]);
    0
}
""" }]
stdout = "10\n20\n30\n"

# (e) struct-literal init from an indexed row: `S { arr: m[1], tail: 5 }` —
# arr must be the full row and the neighbor field must be uncorrupted.
[[case]]
name = "extract_row_into_struct_literal"
files = [{ path = "main.rue", source = """
struct S { arr: [i64; 3], tail: i64 }
fn main() -> i32 {
    let m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    let s = S { arr: m[1], tail: 5 };
    @dbg(s.arr[0]); @dbg(s.arr[1]); @dbg(s.arr[2]); @dbg(s.tail);
    0
}
""" }]
stdout = "10\n20\n30\n5\n"

# (f) CONTRAST FACT (preserve): indexed WRITE with an indexed-read RHS
# `m[0] = m[1]` was already correct — pin it.
[[case]]
name = "indexed_write_from_indexed_read"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    m[0] = m[1];
    @dbg(m[0][0]); @dbg(m[0][1]); @dbg(m[0][2]);
    0
}
""" }]
stdout = "10\n20\n30\n"

# (h) rvalue projection then index: call-result and 2D-literal producers.
[[case]]
name = "extract_row_from_call_result"
files = [{ path = "main.rue", source = """
fn mk() -> [[i64; 3]; 2] { [[1, 2, 3], [10, 20, 30]] }
fn main() -> i32 {
    let row = mk()[1];
    @dbg(row[0]); @dbg(row[1]); @dbg(row[2]);
    0
}
""" }]
stdout = "10\n20\n30\n"

[[case]]
name = "extract_row_from_2d_literal"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let row = [[1, 2, 3], [10, 20, 30]][1];
    @dbg(row[0]); @dbg(row[1]); @dbg(row[2]);
    0
}
""" }]
stdout = "10\n20\n30\n"

# (i) if/else join with indexed-read arms — was a cfg_lower 1-vs-N slot-count
# assert; must now materialize full slots and run.
[[case]]
name = "join_indexed_read_arms"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    let row = if true { m[0] } else { m[1] };
    @dbg(row[0]); @dbg(row[1]); @dbg(row[2]);
    0
}
""" }]
stdout = "1\n2\n3\n"

# CONTRAST FACT (preserve): direct chained reads m[i][j] were correct — pin.
[[case]]
name = "chained_index_reads"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let m: [[i64; 3]; 2] = [[1, 2, 3], [10, 20, 30]];
    @dbg(m[1][1]); @dbg(m[0][2]);
    0
}
""" }]
stdout = "20\n3\n"

# ---------------------------------------------------------------------------
# RUE-194 (facet 2): [T; 0] join. `let g: [i64;0] = if true {[]} else {[]};`
# was the same slot-count assert (0-vs-1) from a phantom placeholder slot on
# the zero-slot aggregate. Now zero-slot aggregates get an EMPTY slot list.
[[case]]
name = "empty_array_join"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let _g: [i64; 0] = if true { [] } else { [] };
    0
}
""" }]
exit_code = 0

# ---------------------------------------------------------------------------
# RUE-192: [String; N] elements. All fat-pointer (ptr/len/cap) slots of a
# String element must be materialized. Was three distinct ICEs / garbage:
# @dbg(arr[0]) (cfg_lower 'string value should have field vregs'), a rebind
# `let s = arr[0]`, and `arr[i].len()` (garbage len).
[[case]]
name = "string_array_dbg_element"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let arr: [String; 1] = ["hi"];
    @dbg(arr[0]);
    0
}
""" }]
stdout = "hi\n"

[[case]]
name = "string_array_rebind_element"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let arr: [String; 1] = ["hi"];
    let s = arr[0];
    @dbg(s);
    0
}
""" }]
stdout = "hi\n"

[[case]]
name = "string_array_pass_by_value"
files = [{ path = "main.rue", source = """
fn takes(s: String) -> u64 { s.len() }
fn main() -> i32 {
    let arr: [String; 1] = ["hello"];
    @dbg(takes(arr[0]));
    0
}
""" }]
stdout = "5\n"

[[case]]
name = "string_array_element_len"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let arr: [String; 2] = ["hello", "xy"];
    @dbg(arr[0].len()); @dbg(arr[1].len());
    0
}
""" }]
stdout = "5\n2\n"

# ---------------------------------------------------------------------------
# RUE-193: array drop glue over a multi-slot element type. Each element's
# slots past slot 0 were garbage (second field corrupted), and [String; 3]
# (9 slots) ICE'd 'array drop with 9 element slots exceeds 6 argument
# registers' — fixed by the flattened-slot Call helper that spills past the
# argument registers (RUE-106 #935 pattern).
[[case]]
name = "array_drop_multislot_struct"
files = [{ path = "main.rue", source = """
struct D { a: i32, b: i32 }
drop fn D(self) { @dbg(self.a); @dbg(self.b); }
fn main() -> i32 {
    let _arr: [D; 3] = [D { a: 10, b: 11 }, D { a: 20, b: 21 }, D { a: 30, b: 31 }];
    0
}
""" }]
stdout = "10\n11\n20\n21\n30\n31\n"

# [String; 3] = 9 flattened slots > 6 x86-64 arg regs / > 8 aarch64 arg regs:
# the drop-glue call must spill the overflow onto the stack, not panic.
[[case]]
name = "array_drop_string_nine_slots"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let _arr: [String; 3] = ["aa", "bb", "cc"];
    0
}
""" }]
exit_code = 0

# RUE-589: every projected place carries its root type instead of reconstructing
# the root width from its first projection. One deliberately deep root exercises
# the three consumers of that fact: static aggregate reads, dynamic aggregate
# writes, and projected inout address formation. Sentinels on both sides of each
# aggregate make a wrong root-origin shift observable.
[[case]]
name = "deep_place_root_type_drives_all_codegen_paths"
files = [{ path = "main.rue", source = """
struct Pair { a: i32, b: i32 }
struct Mid { lead: i32, pair: Pair, trail: i32 }
struct Root { head: i32, mid: Mid, rows: [Mid; 2], tail: i32 }

fn bump(inout pair: Pair) {
    pair.a = pair.a + 20;
    pair.b = pair.b + 30;
}

fn main() -> i32 {
    let mut root = Root {
        head: 1,
        mid: Mid { lead: 2, pair: Pair { a: 3, b: 4 }, trail: 5 },
        rows: [
            Mid { lead: 6, pair: Pair { a: 7, b: 8 }, trail: 9 },
            Mid { lead: 10, pair: Pair { a: 11, b: 12 }, trail: 13 }
        ],
        tail: 14,
    };

    let copy = root.mid.pair;
    root.rows[1].pair = copy;
    bump(inout root.rows[0].pair);

    @dbg(root.head);
    @dbg(root.mid.lead); @dbg(root.mid.trail);
    @dbg(root.rows[0].lead); @dbg(root.rows[0].pair.a); @dbg(root.rows[0].pair.b); @dbg(root.rows[0].trail);
    @dbg(root.rows[1].lead); @dbg(root.rows[1].pair.a); @dbg(root.rows[1].pair.b); @dbg(root.rows[1].trail);
    @dbg(root.tail);
    0
}
""" }]
exit_code = 0
stdout = "1\n2\n5\n6\n27\n38\n9\n10\n3\n4\n13\n14\n"

# A zero-sized logical root still needs a concrete address for the physical
# by-reference ABI. Its explicit type must not make the low-end origin shift
# underflow (`slot_count == 0`).
[[case]]
name = "zero_sized_place_root_byref_address"
files = [{ path = "main.rue", source = """
struct Empty {}
struct Holder { value: Empty }
fn answer(borrow value: Empty) -> i32 { 42 }
fn main() -> i32 {
    let holder = Holder { value: Empty {} };
    let values: [Empty; 1] = [Empty {}];
    answer(borrow holder.value) + answer(borrow values[0])
}
""" }]
exit_code = 84

# CFG lowering spills a computed aggregate before projecting it. The temporary
# must reserve the aggregate's full flattened width: with only one slot, the
# Pair's first word overwrites `n` in the adjacent parameter area and this
# returns 30 instead of 25.
[[case]]
name = "computed_aggregate_projection_temp_does_not_overlap_parameter"
files = [{ path = "main.rue", source = """
struct Pair { left: i32, right: i32 }
fn make() -> Pair { Pair { left: 10, right: 20 } }
fn use(n: i32) -> i32 { make().right + n }
fn main() -> i32 { use(5) }
""" }]
exit_code = 25
