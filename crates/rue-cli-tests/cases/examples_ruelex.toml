# The Rue lexer written in Rue (RUE-941; dogfooding maturity rung 3):
# examples/ruelex/. This case compiles the checked-in example directly via
# `source_path` (so the suite stays pinned to the program users actually see),
# then runs it on a tiny fixture and asserts its exact `--emit tokens`-shaped
# output.
#
# The whole point of ruelex is byte-for-byte agreement with the compiler's own
# `rue --emit tokens`, so the pinned `stdout` below is exactly what that command
# emits (token-lines section) for the same `sample.rue` — verified at authoring
# time. The fixture pins the uniform builtin form (RUE-949): `@import` lexes as
# `AT` + `IDENT`, interning `import` at its natural position (`sym:1`), and the
# shared identifier/string interner gives the string literal `"std"` the same
# `sym:0` as the identifier `std`. The third line carries a float literal, so
# the pinned dump also holds ruelex's float support (ADR-0065) to the
# compiler's: `f64` is an ordinary identifier (spec 3.12:2) and the literal's
# exact text is interned as `FLOAT`.

[section]
id = "cli.examples_ruelex"
name = "Rue lexer written in Rue (ruelex)"
description = "compile examples/ruelex and tokenize a fixture, asserting the exact --emit tokens dump byte-for-byte"

[[case]]
name = "ruelex_tokenizes_fixture_matching_emit_tokens"
description = "ruelex on a small fixture reproduces `rue --emit tokens` exactly, including the uniform AT + IDENT form for @import and shared ident/string interning."
contract = "heavyweight"
source_path = "examples/ruelex/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "sample.rue", source = """
const std = @import("std");
fn add(x: i32) -> i32 { x + 1 }
const ratio: f64 = 1.5e3;
""" }]
program_args = ["sample.rue"]
exit_code = 0
stdout = """
   0..5    CONST
   6..9    IDENT(sym:0)
  10..11   EQ
  12..13   AT
  13..19   IDENT(sym:1)
  19..20   LPAREN
  20..25   STRING(sym:0)
  25..26   RPAREN
  26..27   SEMI
  28..30   FN
  31..34   IDENT(sym:2)
  34..35   LPAREN
  35..36   IDENT(sym:3)
  36..37   COLON
  38..41   TYPE(i32)
  41..42   RPAREN
  43..45   ARROW
  46..49   TYPE(i32)
  50..51   LBRACE
  52..53   IDENT(sym:3)
  54..55   PLUS
  56..57   INT(1)
  58..59   RBRACE
  60..65   CONST
  66..71   IDENT(sym:4)
  71..72   COLON
  73..76   IDENT(sym:5)
  77..78   EQ
  79..84   FLOAT(sym:6)
  84..85   SEMI
  86..86   EOF
"""
