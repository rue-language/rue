# Module-qualified inline type-constructor call as a PATTERN head (RUE-947,
# spec 4.14:23). The construction head `std.result.Result(F, FE).Ok(x)` already
# worked (RUE-596); the matching PATTERN head `std.result.Result(F, FE).Ok(v) =>
# ..` previously failed with a raw E0100 parse error. It now parses and resolves
# to the same specialized enum so match arms unify. Accepted with no preview flag
# (stabilized RUE-598). Driven end-to-end through the real binary against the
# real standard library.

[section]
id = "cli.inline_type_ctor_module_qualified_pattern_head"
name = "Module-qualified inline type-constructor pattern head"
description = "`std.result.Result(F, FE).Ok(v) => ..` as a match pattern head, against real std (RUE-947)."

[[case]]
name = "module_qualified_pattern_head_runs"
description = "A ruewc-style match over `std.result.Result(F, FE)` binds both variant payloads through module-qualified pattern heads."
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");

fn score(ok: bool) -> i32 {
    let r = if ok {
        std.result.Result(i32, i32).Ok(40)     // module-qualified construction head
    } else {
        std.result.Result(i32, i32).Err(2)
    };
    match r {
        std.result.Result(i32, i32).Ok(v) => v,     // module-qualified pattern head
        std.result.Result(i32, i32).Err(e) => e,
    }
}

fn main() -> i32 {
    score(true) + score(false)                       // 40 + 2 = 42
}
""" }]
exit_code = 42

[[case]]
name = "module_qualified_pattern_head_accepted_without_flag"
description = "The module-qualified pattern head compiles and runs with no preview flag (stabilized RUE-598)."
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
fn main() -> i32 {
    let ok = std.result.Result(i32, i32).Ok(40);
    match ok {
        std.result.Result(i32, i32).Ok(v) => v,
        std.result.Result(i32, i32).Err(e) => e,
    }
}
""" }]
exit_code = 40

# A wide integer payload literal on the module-qualified construction head must
# be typed at the declared i64 payload width, not defaulted to i32. The local
# `Result(i64, i32).Ok(41)` form was fixed in RUE-599; the module-qualified route
# (which resolves the head through the nested method-call path RUE-947 wired) was
# still dropping the expectation and failing with E0206 until RUE-950. Driven
# end-to-end through the real binary and real std.
[[case]]
name = "module_qualified_head_wide_payload_literal_runs"
description = "`std.result.Result(i64, i32).Ok(41)` widens the payload literal to i64 end-to-end (RUE-950)."
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
fn main() -> i32 {
    let r = std.result.Result(i64, i32).Ok(41);
    match r {
        std.result.Result(i64, i32).Ok(v) => if v == 41 { 42 } else { 1 },
        std.result.Result(i64, i32).Err(e) => e,
    }
}
""" }]
exit_code = 42
