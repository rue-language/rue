# Whole "real program" tests from the 2026-06-09 dogfooding session.
# These are deliberately program-shaped rather than feature-shaped: they
# exercise combinations the spec suite's focused cases don't.

[section]
id = "cli.programs"
name = "Real programs"
description = "Small but complete programs exercising feature combinations."

[[case]]
name = "account_with_inout_free_function"
files = [{ path = "main.rue", source = """
struct Account {
    balance: i64,

    fn deposit(self, amount: i64) -> Account {
        Account { balance: self.balance + amount }
    }
}

fn deposit_free(inout acct: Account, amount: i64) {
    acct.balance = acct.balance + amount;
}

fn main() -> i32 {
    let mut acct = Account { balance: 100 };
    acct = acct.deposit(50);
    deposit_free(inout acct, 25);
    @dbg(acct.balance);
    0
}
""" }]
stdout = "175\n"

[[case]]
name = "enum_match_exhaustive"
files = [{ path = "main.rue", source = """
enum Direction {
    North,
    South,
    East,
    West,
}

fn steps(d: Direction) -> i32 {
    match d {
        Direction.North => 1,
        Direction.South => 2,
        Direction.East => 3,
        Direction.West => 4,
    }
}

fn main() -> i32 {
    @dbg(steps(Direction.East));
    @dbg(steps(Direction.North));
    0
}
""" }]
stdout = """
3
1
"""

[[case]]
name = "comptime_generic_pair"
files = [{ path = "main.rue", source = """
fn Pair(comptime T: type) -> type {
    struct {
        first: T,
        second: T,

        fn swapped(self) -> Self {
            Self { first: self.second, second: self.first }
        }
    }
}

fn main() -> i32 {
    let P = Pair(i32);
    let p: P = P { first: 1, second: 2 };
    let q = p.swapped();
    @dbg(q.first);
    @dbg(q.second);
    0
}
""" }]
stdout = """
2
1
"""

