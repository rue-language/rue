# @read_line() yields the exact trusted std Option(StrBuf); context checks that
# identity. This exercises fallible intrinsics matching against the trusted type.
[[case]]
name = "string_equality_branches"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let OptStr = std.option.Option(StrBuf);
    match @read_line() {
        OptStr.Some(answer) => {
            if answer == "yes" {
                @dbg("affirmative");
            } else {
                @dbg("negative");
            }
        },
        OptStr.None => {},
    }
    0
}
""" },
]
stdin = "yes"
stdout = "affirmative\n"

[[case]]
name = "selection_sort_in_place"
files = [{ path = "main.rue", source = """
fn sort(inout arr: [i32; 5]) {
    let mut i: u32 = 0;
    while i < 5 {
        let mut min = i;
        let mut j = i + 1;
        while j < 5 {
            if arr[j] < arr[min] {
                min = j;
            }
            j = j + 1;
        }
        let tmp = arr[i];
        arr[i] = arr[min];
        arr[min] = tmp;
        i = i + 1;
    }
}

fn main() -> i32 {
    let mut nums = [42, 7, 19, 3, 25];
    sort(inout nums);
    let mut i: u32 = 0;
    while i < 5 {
        @dbg(nums[i]);
        i = i + 1;
    }
    0
}
""" }]
stdout = """
3
7
19
25
42
"""

[[case]]
name = "collatz_steps"
files = [{ path = "main.rue", source = """
fn collatz_steps(start: i32) -> i32 {
    let mut n = start;
    let mut steps = 0;
    while n != 1 {
        if n % 2 == 0 {
            n = n / 2;
        } else {
            n = 3 * n + 1;
        }
        steps = steps + 1;
    }
    steps
}

fn main() -> i32 {
    @dbg(collatz_steps(27));
    0
}
""" }]
stdout = "111\n"

# RUE-77: a `while` whose condition diverges (never-typed) left the loop body and
# exit blocks orphaned (no terminator) -> codegen aborted "block has no terminator".
# The loop body and everything after the loop are unreachable; the condition's
# divergence is the function's result.
[[case]]
name = "while_with_diverging_condition"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    while return 8 {}
    5
}
""" }]
exit_code = 8

# Same diverging-condition while nested inside an outer loop — confirms the
# loop_stack stays balanced and the enclosing loop's break target is intact.
[[case]]
name = "while_diverging_condition_inside_outer_loop"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    loop {
        while return 7 {}
        break;
    }
    5
}
""" }]
exit_code = 7

# RUE-128: a let whose initializer diverges. The Alloc lowering used to discard
# the initializer's continuation, so the builder kept lowering the rest of the
# block and silently OVERWROTE the Return terminator — `let x = { return 7; 2 }; 3`
# returned 3. Everything after such a let is unreachable.
[[case]]
name = "let_with_diverging_block_initializer"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x = { return 7; 2 };
    3
}
""" }]
exit_code = 7

[[case]]
name = "let_with_diverging_if_initializer"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x: i32 = if true { return 9; } else { return 8; };
    3
}
""" }]
exit_code = 9
