const B = std.arraybuf.ArrayBuf(i64);
fn first(borrow b: B) -> i64 { return b.get_ref(0); }
fn main() -> i32 {
    let mut b = B.new();
    b.push(1);
    @intCast(first(borrow b))
}
""" }]
args = ["--preview", "borrow_accessors", "main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
