# @intCast widening sign-extension regression tests (RUE-88, epic RUE-105).
#
# Widening a signed integer to a larger type must SIGN-extend the high bits.
# Both backends used a plain 64-bit move after the range check, carrying the
# source's zero-extended high bits, so e.g. i32 -5 widened to i64 became
# 4294967291. Now a movsx (x86-64) / sxtb/sxth/sxtw (aarch64) is emitted.
#
# Negative i8/i16 values are produced by narrowing an i32 (`@intCast(0 - 5)`)
# rather than i8/i16 arithmetic, to avoid the unrelated sub-word overflow-check
# bug (RUE-28/RUE-60).

[section]
id = "cli.intcast"
name = "@intCast widening sign-extension"
description = "Widening a signed integer must sign-extend, not zero-extend."

[[case]]
name = "i32_to_i64_negative_sign_extends"
files = [{ path = "main.rue", source = """
fn neg(x: i32) -> i32 { 0 - x }
fn main() -> i32 {
    let a: i32 = neg(5);          // -5, produced at runtime
    let b: i64 = @intCast(a);     // must be -5, not 4294967291
    if b == 0 - 5 { 0 } else { 1 }
}
""" }]
exit_code = 0

[[case]]
name = "i8_to_i64_negative_sign_extends"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let n: i32 = 0 - 5;
    let a: i8 = @intCast(n);      // -5 as i8
    let b: i64 = @intCast(a);     // widen i8 -> i64, must be -5
    if b == 0 - 5 { 0 } else { 1 }
}
""" }]
exit_code = 0

[[case]]
name = "i16_to_i64_negative_sign_extends"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let n: i32 = 0 - 5;
    let a: i16 = @intCast(n);
    let b: i64 = @intCast(a);
    if b == 0 - 5 { 0 } else { 1 }
}
""" }]
exit_code = 0

[[case]]
name = "i16_to_i32_negative_sign_extends"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let n: i32 = 0 - 5;
    let a: i16 = @intCast(n);
    let b: i32 = @intCast(a);
    if b == 0 - 5 { 0 } else { 1 }
}
""" }]
exit_code = 0

# Control: positive signed widening is unchanged.
[[case]]
name = "i32_to_i64_positive_ok"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: i32 = 5;
    let b: i64 = @intCast(a);
    if b == 5 { 0 } else { 1 }
}
""" }]
exit_code = 0

# Control: unsigned widening must zero-extend (still correct).
[[case]]
name = "u32_to_u64_zero_extends"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: u32 = 4000000000;
    let b: u64 = @intCast(a);
    if b == 4000000000 { 0 } else { 1 }
}
""" }]
exit_code = 0

# Control: a narrowing cast that overflows still traps.
#
# Also a regression test for RUE-31: the aarch64 range checks used the 32-bit
# CmpRR for 64-bit sources, so this out-of-range value (whose low 32 bits
# happen to land in i32 range) was silently truncated instead of trapping.
# All 64-bit-source range checks now select the 64-bit Cmp64RR.
[[case]]
name = "i64_to_i32_overflow_traps"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: i64 = 5000000000;
    @intCast(a)
}
""" }]
exit_code = 101
runtime_error_contains = ["integer cast overflow"]

# RUE-31: 2^32 exactly — the buggy 32-bit compare saw only the low 32 bits
# (zero, comfortably in i32 range) and let the cast through. The value is
# produced by a function call so constant folding cannot elide the check.
[[case]]
name = "i64_pow32_to_i32_overflow_traps"
files = [{ path = "main.rue", source = """
fn g() -> i64 { 4294967296 }        // 2^32: low 32 bits are all zero
fn main() -> i32 {
    let x: i64 = g();
    let y: i32 = @intCast(x);       // out of i32 range -> must trap
    if y == 0 { 1 } else { 2 }
}
""" }]
exit_code = 101
runtime_error_contains = ["integer cast overflow"]

# RUE-31: the low-32-bits blindness affected every 64-bit-source range check,
# not just signed->signed. u64 -> u32 narrowing must still trap.
[[case]]
name = "u64_to_u32_overflow_traps"
files = [{ path = "main.rue", source = """
fn g() -> u64 { 4294967296 }        // 2^32: low 32 bits are all zero
fn main() -> i32 {
    let x: u64 = g();
    let y: u32 = @intCast(x);       // out of u32 range -> must trap
    if y == 0 { 1 } else { 2 }
}
""" }]
exit_code = 101
runtime_error_contains = ["integer cast overflow"]

# RUE-31: u64 -> i64 is a same-size cast that still needs its upper-bound
# check; comparing only the low 32 bits made that check a no-op.
[[case]]
name = "u64_above_i64_max_traps"
files = [{ path = "main.rue", source = """
fn g() -> u64 { let a: u64 = 9223372036854775807; a + 1 }   // 2^63 > i64::MAX
fn main() -> i32 {
    let x: u64 = g();
    let y: i64 = @intCast(x);       // out of i64 range -> must trap
    if y == 0 { 1 } else { 2 }
}
""" }]
exit_code = 101
runtime_error_contains = ["integer cast overflow"]

# Control: in-range 64-bit-source casts must not trap (the widened compare
# from the RUE-31 fix must not introduce false positives).
[[case]]
name = "i64_in_range_to_i32_ok"
files = [{ path = "main.rue", source = """
fn g() -> i64 { 0 - 2147483647 - 1 }    // i32::MIN, exactly in range
fn main() -> i32 {
    let x: i64 = g();
    let y: i32 = @intCast(x);           // boundary value -> must NOT trap
    let z: i64 = @intCast(y);           // widen back to compare in i64
    if z == g() { 0 } else { 1 }
}
""" }]
exit_code = 0

# RUE-146: the x86-64 peephole rewrote the signed->unsigned negativity check
# (`cmp64 r, 0`) into the 32-bit `test r, r`, so SF came from the low 32 bits
# of the 64-bit source. Both directions broke: a negative i64 whose low 32
# bits are non-negative skipped the mandatory trap, and a positive i64 whose
# low 32 bits are negative trapped falsely. Values are produced via a function
# call so constant folding cannot elide the runtime check.

[[case]]
name = "i64_negative_high_bits_to_u64_traps"
files = [{ path = "main.rue", source = """
fn g() -> i64 { 0 - 4294967296 }    // low 32 bits are all zero
fn main() -> i32 {
    let x: i64 = g();
    let y: u64 = @intCast(x);       // negative -> must trap
    if y == 0 { 1 } else { 2 }
}
""" }]
exit_code = 101
runtime_error_contains = ["integer cast overflow"]

[[case]]
name = "i64_positive_low_sign_bit_to_u64_ok"
files = [{ path = "main.rue", source = """
fn g() -> i64 { 2147483648 }        // bit 31 set, but positive as i64
fn main() -> i32 {
    let x: i64 = g();
    let y: u64 = @intCast(x);       // in range -> must NOT trap
    if y == 2147483648 { 0 } else { 1 }
}
""" }]
exit_code = 0
