# gazette — a static site generator written in Rue (ADR-0072 Phases 3 and 4,
# RUE-1483 and RUE-1484).
#
# The libraries' own construct-by-construct coverage lives in the program's
# self-test, which the no-argument automatic example already runs. What these
# cases add is the real driver path: files on disk, templates registered by the
# name content refers to them by, a whole site built from a content tree, and
# the exit code and diagnostics a caller sees when content steps outside a
# documented subset.
#
# The `build` cases here are deliberately small. The corpus-scale checks —
# determinism, the semantic oracle against Zola, the scale variants, and the
# markup-level spot goldens — live in `scripts/gazette-corpus-diff.py`, which
# needs the pinned Zola and a 500 KiB corpus and so cannot run inside the CLI
# harness's per-case budget. What belongs here is the behaviour a CLI test can
# pin exactly: the routes, the file set, section ordering, the feed, and the
# redirect stub.
[section]
id = "cli.examples_gazette"
name = "gazette, a static site generator written in Rue"
description = "exercise TOML front matter, the Markdown subset, shortcode expansion through the template engine, a whole site build, and loud rejection of out-of-subset constructs"
# Every case compiles the same maintained multi-module program, so the section
# carries the bounded heavyweight contract, matching the automatic example.
contract = "heavyweight"

[[case]]
name = "gazette_self_test_covers_all_three_libraries"
description = "the no-argument self-test checks every construct in the three documented subsets"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
exit_code = 0
stdout_contains = [
  "ok   front-matter scalars, table, array, multi-line string",
  "ok   pipe table, with escaped pipes in cells",
  "ok   external, anchor, relative, and internal links",
  "ok   three-level inheritance with nested block override",
  "ok   the eleven filters and the URL helper",
  "ok   shortcodes expand through the template engine",
  # The genuine recursion check: a macro on a parent template calling itself
  # through a nested tree, gated on a prefix test, with the exact nested
  # output asserted. ADR-0072 Decision 3 forbids moving that decision out of
  # the template, and this is the smallest executable statement of it.
  "ok   recursive macro with starts_with, defined on a parent template",
  "ok   runaway macro recursion is a diagnostic, not a crash",
  "ok   nesting past the depth guard is a diagnostic, not a crash",
  "gazette libraries self-test: all checks passed",
]

[[case]]
name = "gazette_reports_deep_nesting_instead_of_crashing"
description = "pathological nesting yields a located diagnostic and a clean exit, never a signal"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  # 400 nested block quotes: far past the depth guard, far short of what used
  # to be needed to overflow the stack (12,000 segfaulted).
  { path = "deep.md", source = """+++
title = "Deep"
+++

>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> deep
""" },
]
program_args = ["render", "deep.md"]
exit_code = 1
stdout_contains = ["nested deeper than the engine renders"]

[[case]]
name = "gazette_renders_a_macro_defined_on_a_parent_template"
description = "a macro with named arguments and a default, invoked from a child template, plus the starts_with filter"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
# Deliberately NOT the recursion test, though it was once described as one
# while its macro never called itself. What it pins is argument binding,
# defaults, and the prefix filter. Genuine recursion needs a nested tree, and
# the front-matter subset cannot express one — a page carries scalars, arrays
# of scalars, and one level of table — so it is covered where a nested tree
# actually exists: the self-test above builds one in Rue and asserts the exact
# nested output, `gazette_stops_runaway_macro_recursion` below drives the
# engine's depth guard, and the spot goldens render the production-shaped
# sidebar over a real section tree with an active branch.
files = [
  { path = "nav.html", source = """{% macro crumb(node, depth=0) %}<i>{{ node }}{% if depth %} at {{ depth }}{% endif %}</i>{% endmacro %}{{ self::crumb(node=page.title) }}{{ self::crumb(node=page.title, depth=2) }}{% if page.title | starts_with(prefix="Sco") %}<b>match</b>{% endif %}""" },
  { path = "page.md", source = """+++
title = "Scope"
+++

body
""" },
]
program_args = ["render", "-t", "nav.html=nav.html", "--template-out", "nav.html", "page.md"]
exit_code = 0
stdout_contains = ["<i>Scope</i><i>Scope at 2</i><b>match</b>"]

[[case]]
name = "gazette_stops_runaway_macro_recursion"
description = "a macro with no base case reports and stops instead of overflowing the stack"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
# The depth guard at the top of `render_macro_call` is the only thing between
# a self-calling macro and a signal-killed process with a half-written output
# tree, which ADR-0072 Decision 4's determinism check cannot interpret. The
# Markdown depth guard has its own case; this one is the macro engine's, and
# they are not the same guard.
files = [
  { path = "loop.html", source = """{% macro loopy(n) %}x{{ self::loopy(n=n) }}{% endmacro %}{{ self::loopy(n=1) }}""" },
  { path = "page.md", source = """+++
title = "Runaway"
+++

body
""" },
]
program_args = ["render", "-t", "loop.html=loop.html", "--template-out", "loop.html", "page.md"]
exit_code = 1
stdout_contains = ["macro calls are nested deeper than the engine renders (self::loopy)"]

[[case]]
name = "gazette_renders_a_page_with_front_matter_and_shortcodes"
description = "the real driver path: front matter, blocks, inlines, and a shortcode rendered through the template engine"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "shortcodes/rule.html", source = """<div class="rule" id="r-{{ id }}"><a class="rule-link" href="#r-{{ id }}">[{{ id }}]</a></div>""" },
  { path = "page.md", source = """+++
title = "Scope"
weight = 2

[extra]
authors = ["steve", "claude"]
+++

# Scope

{{ rule(id="1.2:1") }}

This specification **MUST** describe `Rue`, per [RFC 2119](https://example.test/rfc).

- lexical structure
- types

| Category | Description |
|----------|-------------|
| `syntax` | Grammar rules |

```rue check
fn main() -> i32 { 0 }
```
""" },
]
program_args = [
  "render",
  "-t", "shortcodes/rule.html=shortcodes/rule.html",
  "-u", "https://rue-lang.dev/spec/01-introduction/",
  "page.md",
]
exit_code = 0
stdout = """<h1 id="scope">Scope</h1>
<div class="rule" id="r-1.2:1"><a class="rule-link" href="#r-1.2:1">[1.2:1]</a></div>
<p>This specification <strong>MUST</strong> describe <code>Rue</code>, per <a href="https://example.test/rfc">RFC 2119</a>.</p>
<ul>
<li>lexical structure</li>
<li>types</li>
</ul>
<table><thead><tr><th>Category</th><th>Description</th></tr></thead><tbody>
<tr><td><code>syntax</code></td><td>Grammar rules</td></tr>
</tbody></table>
<pre><code class="language-rue check">fn main() -&gt; i32 { 0 }
</code></pre>
"""

[[case]]
name = "gazette_rejects_content_outside_the_documented_subset"
description = "out-of-subset front matter and Markdown fail with located diagnostics instead of wrong output"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "page.md", source = """+++
title = "Bad"
when = 2026-06-11T09:00:00Z
[deep.table]
k = 1
+++

Setext
======

~~struck~~

- item
  - nested
""" },
]
program_args = ["render", "page.md"]
exit_code = 1
stdout_contains = [
  "front-matter:3: number is outside the subset (integers only, unsigned, no underscores) (2026-06-11T09:00:00Z)",
  "front-matter:4: nested or quoted table headers are outside the subset (deep.table)",
  "markdown:9: setext headings are outside the subset (use `#`)",
  "markdown:11: strikethrough is outside the subset",
  "markdown:14: nested lists are outside the subset",
]

[[case]]
name = "gazette_builds_a_site_tree"
description = "content discovery, routes, section ordering, the feed, the redirect stub, and static passthrough, in one build"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "site/config.toml", source = """base_url = "https://example.test"
title = "Site"
description = "a site"
""" },
  { path = "site/templates/page.html", source = """<h1>{{ page.title }}</h1>{{ page.content | safe }}{% if page.lower %}<a href="{{ page.lower.permalink }}">prev</a>{% endif %}""" },
  { path = "site/templates/section.html", source = """<h1>{{ section.title }}</h1>{% for pg in section.pages %}<a href="{{ pg.path }}">{{ pg.title }}</a>{% endfor %}{% for sub in section.subsections | sort %}<i>{{ sub }}</i>{% endfor %}""" },
  { path = "site/templates/redirect.html", source = """<meta http-equiv="refresh" content="0; url={{ url | safe }}">""" },
  { path = "site/templates/rss.xml", source = """<rss>{% for page in pages %}<item>{{ page.permalink | safe }}</item>{% endfor %}</rss>""" },
  { path = "site/templates/shortcodes/rule.html", source = """<b id="r-{{ id }}">[{{ id }}]</b>""" },
  { path = "site/static/asset.txt", source = "copied verbatim\n" },
  { path = "site/content/_index.md", source = """+++
title = "Home"
+++

welcome
""" },
  # `sort_by = "date"`, so the newer note leads the index and the feed.
  { path = "site/content/notes/_index.md", source = """+++
title = "Notes"
sort_by = "date"
generate_feeds = true
+++

notes
""" },
  { path = "site/content/notes/older.md", source = """+++
title = "Older"
date = 2026-01-01
+++

first
""" },
  { path = "site/content/notes/newer.md", source = """+++
title = "Newer"
date = 2026-02-02
+++

second
""" },
  # A redirecting section whose pages still render, and whose subsection is
  # ordered by weight.
  { path = "site/content/book/_index.md", source = """+++
title = "Book"
sort_by = "weight"
redirect_to = "book/two"
+++

book
""" },
  { path = "site/content/book/one.md", source = """+++
title = "One"
weight = 2
+++

{{ rule(id="1:1") }}
""" },
  { path = "site/content/book/two.md", source = """+++
title = "Two"
weight = 1
+++

two
""" },
]
program_args = ["build", "site", "-o", "public", "--list"]
exit_code = 0
# The emitted set, in emission order: every ordinary page in content-tree
# order, then each section's index — the redirecting one included — with its
# feed beside it, then the static passthrough.
stdout = """book/one/index.html
book/two/index.html
notes/newer/index.html
notes/older/index.html
index.html
book/index.html
notes/index.html
notes/rss.xml
asset.txt
gazette: 4 pages, 3 sections, 9 files written
"""

# RUE-1496. A content path becomes a route through the slug rule ADR-0072
# Decision 3 documents, and these three cases are its hermetic statement: the
# corpus checks in `scripts/gazette-corpus-diff.py` need the pinned Zola and the
# live site, and the live site could rename its three upper-case files without
# anyone noticing the capability had gone unexercised.
[[case]]
name = "gazette_slugifies_a_file_stem_into_a_link_target"
description = "an `@/…` link to an upper-case content path resolves to the route the page is served at"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
# The corpus's own case, by name: nothing in the live content links to these
# three, but a link and the page's own route come from one function, so a link
# is the cheapest way to assert what that function does with a fragment and a
# section beside a page.
files = [
  { path = "page.md", source = """+++
title = "Links"
+++

[grammar](@/spec/appendices/A-grammar.md), [limits](@/spec/appendices/C-implementation-limits.md#rules), [all](@/spec/appendices/_index.md)
""" },
]
program_args = ["render", "page.md"]
exit_code = 0
# The directories keep their case and the file stem loses it, which is Zola's
# own asymmetry rather than a simplification of it; a section's route is its
# directories, so nothing in it is slugified at all.
stdout = """<p><a href="https://rue-lang.dev/spec/appendices/a-grammar/">grammar</a>, <a href="https://rue-lang.dev/spec/appendices/c-implementation-limits/#rules">limits</a>, <a href="https://rue-lang.dev/spec/appendices/">all</a></p>
"""

[[case]]
name = "gazette_routes_an_upper_case_page_to_its_slug"
description = "an upper-case file stem is emitted at its slugified route, and the section around it is not slugified"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "site/config.toml", source = """base_url = "https://example.test"
title = "Site"
""" },
  { path = "site/templates/page.html", source = """{{ page.content | safe }}""" },
  { path = "site/templates/section.html", source = """{{ section.content | safe }}""" },
  { path = "site/content/_index.md", source = """+++
title = "Home"
+++

home
""" },
  { path = "site/content/appendices/_index.md", source = """+++
title = "Appendices"
+++

appendices
""" },
  { path = "site/content/appendices/A-Grammar.md", source = """+++
title = "Grammar"
+++

grammar
""" },
]
program_args = ["build", "site", "-o", "public", "--list"]
exit_code = 0
stdout = """appendices/a-grammar/index.html
index.html
appendices/index.html
gazette: 1 pages, 2 sections, 3 files written
"""

[[case]]
name = "gazette_refuses_a_content_path_outside_the_slug_subset"
description = "a path the documented slug subset does not cover fails the build instead of routing by guess, in a directory component as well as a file stem"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
# THE WHOLE ROUTE IS CONSTRAINED, not only the stem that folds, and both halves
# are pinned here because ADR-0072 Decision 3's enumeration is load-bearing: a
# reader has to be able to tell that `Docs/page.md` fails.
#
# Each of these is a path the two pinned peers route differently. Zola's `slug`
# crate folds `my_page` to `my-page` while Hugo keeps the underscore; Zola
# copies `Docs` verbatim while Hugo lower-cases it. No rule gazette could
# implement matches both, so the subset stops where they agree and the build
# stops here — which is also why the section's own route is named separately
# from its page's: `Docs/` is refused as a section route, where nothing folds
# at all.
files = [
  { path = "site/config.toml", source = """base_url = "https://example.test"
title = "Site"
""" },
  { path = "site/templates/page.html", source = """{{ page.content | safe }}""" },
  { path = "site/templates/section.html", source = """{{ section.content | safe }}""" },
  { path = "site/content/_index.md", source = """+++
title = "Home"
+++

home
""" },
  { path = "site/content/my_page.md", source = """+++
title = "Mine"
+++

mine
""" },
  { path = "site/content/Docs/_index.md", source = """+++
title = "Docs"
+++

docs
""" },
  { path = "site/content/Docs/page.md", source = """+++
title = "Page"
+++

page
""" },
]
program_args = ["build", "site", "-o", "public"]
exit_code = 1
stdout_contains = [
  "content path is outside the slug subset",
  "(my_page)",
  "(Docs/page)",
  "(Docs/)",
]

[[case]]
name = "gazette_refuses_a_content_directory_without_an_index"
description = "a directory with no `_index.md` is a diagnostic, never an implicit section"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "site/config.toml", source = """base_url = "https://example.test"
title = "Site"
""" },
  { path = "site/templates/page.html", source = """{{ page.content | safe }}""" },
  { path = "site/templates/section.html", source = """{{ section.content | safe }}""" },
  { path = "site/content/_index.md", source = """+++
title = "Home"
+++

home
""" },
  { path = "site/content/orphans/lost.md", source = """+++
title = "Lost"
+++

lost
""" },
]
program_args = ["build", "site", "-o", "public"]
exit_code = 1
stdout_contains = ["this content directory has no `_index.md` (orphans/lost.md)"]

[[case]]
name = "gazette_rejects_an_unknown_shortcode"
description = "a shortcode with no registered template is an error, never a silent gap in the page"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "page.md", source = """+++
title = "Missing"
+++

{{ gallery(id="1") }}
""" },
]
program_args = ["render", "page.md"]
exit_code = 1
stdout_contains = ["shortcode:5: unknown shortcode (gallery)"]

# ADR-0083 / RUE-2000. The example's own `test` declarations, run through the
# real `rue test` driver. The three `*_tests.rue` files are reachable only
# because `main.rue` imports them, so this case is also what keeps the
# aggregator imports honest: drop one and the count falls.
#
# It is the runner's in-tree dogfood — the self-test above is a hand-rolled
# harness inside `main()`, while this is the language's own test subcommand
# over the same libraries — so the count is asserted rather than the
# individual names, which the runner deliberately does not print on a pass.
[[case]]
name = "gazette_test_declarations_run_under_rue_test"
description = "`rue test` over the example's root discovers and passes all 35 test declarations in its three test modules"
source_path = "examples/gazette/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["test", "${SOURCE}", "--seed", "1"]
driver_exit_code = 0
compile_stdout_contains = ["35 passed ("]
