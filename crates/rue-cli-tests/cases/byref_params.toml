# By-ref (inout/borrow) parameter soundness and projection arguments
# (RUE-127 items 3 and 4; RUE-143).
#
# Item 3 (superseded by RUE-143): passing a struct field or array element as
# an `inout`/`borrow` argument used to panic codegen ("by-ref argument must
# be a variable" ICE in cfg_lower), then was rejected in sema with E0438.
# RUE-143 implemented place-address formation for by-ref arguments (shared
# logic in rue-codegen's `byref_args` module), so field and index projections
# are now accepted: the callee reads/writes the projected place in the
# caller's frame through its address. E0438 is retired. What remains
# rejected:
#   - non-lvalue arguments (call results, literals, ...) — E0425/E0427
#   - `inout` arguments rooted at a `borrow` parameter (a mutable view of
#     read-only memory) — E0428
#   - two by-ref arguments sharing a ROOT variable where at least one is
#     inout (exclusive access is per root, conservatively: even disjoint
#     fields conflict) — E0426/E0430
#
# Item 4: moving a non-Copy value out of an `inout` parameter (whole variable
# or a field) compiled but left the CALLER's variable moved-from after the
# call — a use-after-move the caller's own move checker could not see. Sema
# now rejects any move out of an inout parameter with E0437. The rule is
# deliberately conservative (reject-valid): reinitialization before exit is
# not tracked, so moving out and reassigning before returning still errors.
# Field-level moves out of `borrow` parameters are likewise rejected (E0429),
# matching the existing whole-variable rule.
#
# Forwarding a by-ref parameter to another function's by-ref parameter
# (`g(inout v)` inside `fn f(inout v: T)`, and since RUE-143 also
# `g(borrow v)` inside `fn f(borrow v: T)`) is a re-borrow, not a move, and
# must keep working.
#
# The caller's side of the same boundary closes the file (RUE-2042): once a
# place is passed by reference, every later read of its root observes what the
# callee wrote — including when that root is the caller's own by-value
# parameter.

[section]
id = "cli.byref_params"
name = "By-ref parameter soundness"
description = "Field/element by-ref arguments, moves out of inout parameters, and re-reading a by-ref argument's root after the call (RUE-127, RUE-143, RUE-2042)."

# ---------------------------------------------------------------------------
# By-ref arguments accept place projections (RUE-143): the callee must see
# the projected place AND inout writes must land in the caller's variable.
# ---------------------------------------------------------------------------

[[case]]
name = "borrow_field_arg_reads_place"
description = "Passing a struct field as a borrow argument reads the field in place (formerly E0438, before that a cfg_lower ICE); the owner stays usable."
files = [{ path = "main.rue", source = """
struct Inner { x: i32 }
struct Outer { f: Inner }
fn peek(borrow v: Inner) -> i32 { v.x }
fn main() -> i32 {
    let o = Outer { f: Inner { x: 7 } };
    let a = peek(borrow o.f);
    a + peek(borrow o.f) + o.f.x
}
""" }]
exit_code = 21

[[case]]
name = "inout_field_arg_writes_back"
description = "The inout variant: the callee's writes through the field's address are visible in the caller's struct."
files = [{ path = "main.rue", source = """
struct Inner { x: i32 }
struct Outer { f: Inner }
fn bump(inout v: Inner) { v.x = v.x + 1; }
fn main() -> i32 {
    let mut o = Outer { f: Inner { x: 40 } };
    bump(inout o.f);
    bump(inout o.f);
    o.f.x
}
""" }]
exit_code = 42

[[case]]
name = "borrow_array_element_arg_reads_place"
description = "A non-Copy array element can be borrowed in place (no move out of the array)."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn peek(borrow v: D) -> i32 { v.x }
fn main() -> i32 {
    let a = [D { x: 3 }, D { x: 4 }];
    peek(borrow a[0]) + peek(borrow a[1])
}
""" }]
exit_code = 7

[[case]]
name = "inout_array_element_arg_in_loop"
description = "Dynamic-index inout element arguments: each loop iteration's bounds check and address point at the right element."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn bump(inout v: D) { v.x = v.x + 1; }
fn main() -> i32 {
    let mut a = [D { x: 0 }, D { x: 0 }, D { x: 0 }];
    let mut i = 0;
    while i < 3 {
        bump(inout a[i]);
        bump(inout a[i]);
        i = i + 1;
    }
    a[0].x * 100 + a[1].x * 10 + a[2].x
}
""" }]
exit_code = 222

[[case]]
name = "inout_array_element_out_of_bounds_traps"
description = "The address of an out-of-bounds element is never formed: the call site bounds-checks and panics first."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn bump(inout v: D) { v.x = v.x + 1; }
fn main() -> i32 {
    let mut a = [D { x: 1 }, D { x: 2 }];
    let i = 5;
    bump(inout a[i]);
    a[0].x
}
""" }]
exit_code = 101
runtime_error_contains = ["index out of bounds"]

[[case]]
name = "inout_field_through_inout_param"
description = "A field of an inout parameter can be re-passed inout: the address is computed from the received pointer (descending slot offsets); the write surfaces in main's variable."
files = [{ path = "main.rue", source = """
struct Inner { x: i32, y: i32 }
struct Outer { a: i32, f: Inner }
fn bump(inout v: Inner) { v.x = v.x + 1; v.y = v.y + 2; }
fn through(inout o: Outer) { bump(inout o.f); }
fn main() -> i32 {
    let mut o = Outer { a: 9, f: Inner { x: 10, y: 20 } };
    through(inout o);
    o.f.x + o.f.y + o.a
}
""" }]
exit_code = 42

[[case]]
name = "borrow_forward_of_borrow_param"
description = "Re-borrowing a borrow parameter (whole or a field of it) is a sound read-only re-borrow and now compiles (RUE-143)."
files = [{ path = "main.rue", source = """
struct Inner { x: i32 }
struct Outer { f: Inner }
fn peek(borrow v: Inner) -> i32 { v.x }
fn whole(borrow v: Inner) -> i32 { peek(borrow v) }
fn through(borrow o: Outer) -> i32 { peek(borrow o.f) }
fn main() -> i32 {
    let o = Outer { f: Inner { x: 21 } };
    whole(borrow o.f) + through(borrow o)
}
""" }]
exit_code = 42

[[case]]
name = "inout_arg_rooted_at_borrow_param_rejected"
description = "An inout argument rooted at a borrow parameter would hand the callee a mutable view of read-only memory (E0428)."
files = [{ path = "main.rue", source = """
struct Inner { x: i32 }
struct Outer { f: Inner }
fn bump(inout v: Inner) { v.x = v.x + 1; }
fn evil(borrow o: Outer) { bump(inout o.f); }
fn main() -> i32 {
    let o = Outer { f: Inner { x: 1 } };
    evil(borrow o);
    o.f.x
}
""" }]
compile_fail = true
error_contains = ["E0428", "cannot mutate borrowed value"]

[[case]]
name = "inout_arg_non_lvalue_still_rejected"
description = "A call result still cannot be passed by EXCLUSIVE reference: an inout loan writes through the argument's own storage, which a value has none of (E0425). The shared form is elaborated instead (RUE-953, see below)."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn mk() -> D { D { x: 1 } }
fn bump(inout v: D) { v.x = v.x + 1; }
fn main() -> i32 { bump(inout mk()); 0 }
""" }]
compile_fail = true
error_contains = ["E0425", "inout argument must be an lvalue"]

[[case]]
name = "borrow_arg_call_result_is_a_temporary"
description = "A `borrow` call-result argument is materialized in a hidden binding that owns it for the call and is dropped exactly once when the call returns (RUE-953, spec 6.1:41)."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
drop fn D(self) { @dbg(self.x); }
fn mk(x: i32) -> D { D { x: x } }
fn peek(borrow v: D) -> i32 { v.x }
fn main() -> i32 {
    let seen = peek(borrow mk(41));
    @dbg(100);
    seen + 1
}
""" }]
exit_code = 42
stdout = "41\n100\n"

[[case]]
name = "inout_projections_same_root_rejected"
description = "Exclusive access is per ROOT variable: two inout arguments projecting different fields of the same struct are rejected (E0426)."
files = [{ path = "main.rue", source = """
struct O { a: i32, b: i32 }
fn swap(inout x: i32, inout y: i32) { let t = x; x = y; y = t; }
fn main() -> i32 {
    let mut o = O { a: 1, b: 2 };
    swap(inout o.a, inout o.b);
    o.a
}
""" }]
compile_fail = true
error_contains = ["E0426", "same variable 'o' to multiple inout parameters"]

[[case]]
name = "borrow_inout_projections_same_root_rejected"
description = "Law of exclusivity by root: borrowing one field while inout-passing another field of the same struct is rejected (E0430)."
files = [{ path = "main.rue", source = """
struct O { a: i32, b: i32 }
fn obs(borrow x: i32, inout y: i32) -> i32 { x + y }
fn main() -> i32 {
    let mut o = O { a: 1, b: 2 };
    obs(borrow o.a, inout o.b)
}
""" }]
compile_fail = true
error_contains = ["E0430", "cannot borrow 'o' while it is mutably borrowed"]

[[case]]
name = "borrow_of_moved_field_rejected"
description = "Borrowing a field whose value was already moved out is a use-after-move (E0205)."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
struct O { f: D }
fn consume(d: D) -> i32 { d.x }
fn peek(borrow v: D) -> i32 { v.x }
fn main() -> i32 {
    let o = O { f: D { x: 1 } };
    let a = consume(o.f);
    a + peek(borrow o.f)
}
""" }]
compile_fail = true
error_contains = ["E0205", "use of moved value 'o.f'"]

[[case]]
name = "borrow_whole_variable_still_works"
description = "Control: borrowing a whole local variable compiles and the value stays usable after the call."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn peek(borrow v: D) -> i32 { v.x }
fn main() -> i32 {
    let d = D { x: 7 };
    let a = peek(borrow d);
    let b = peek(borrow d);
    a + b
}
""" }]
exit_code = 14

[[case]]
name = "inout_whole_variable_still_works"
description = "Control: passing a whole local as inout mutates it in place."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn bump(inout v: D) { v.x = v.x + 1; }
fn main() -> i32 {
    let mut d = D { x: 41 };
    bump(inout d);
    d.x
}
""" }]
exit_code = 42

# ---------------------------------------------------------------------------
# Item 4: moves out of inout parameters are rejected
# ---------------------------------------------------------------------------

[[case]]
name = "move_out_of_inout_rejected"
description = "Moving an inout parameter into a by-value call left the caller's variable moved-from (returned garbage before the fix)."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn consume(d: D) -> i32 { d.x }
fn steal(inout o: D) -> i32 { consume(o) }
fn main() -> i32 {
    let mut d = D { x: 7 };
    let a = steal(inout d);
    let b = consume(d);
    a + b
}
""" }]
compile_fail = true
error_contains = ["E0437", "cannot move out of inout parameter"]

[[case]]
name = "move_out_of_inout_via_let_rejected"
description = "A let-binding move out of an inout parameter is rejected the same way."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn steal(inout o: D) -> i32 {
    let taken = o;
    taken.x
}
fn main() -> i32 { let mut d = D { x: 7 }; steal(inout d) }
""" }]
compile_fail = true
error_contains = ["E0437", "cannot move out of inout parameter"]

[[case]]
name = "move_out_of_inout_field_rejected"
description = "Moving a non-Copy FIELD out of an inout parameter would leave the caller's variable partially moved-from."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
struct P { f: D }
fn consume(d: D) -> i32 { d.x }
fn steal(inout p: P) -> i32 { consume(p.f) }
fn main() -> i32 { let mut p = P { f: D { x: 7 } }; steal(inout p) }
""" }]
compile_fail = true
error_contains = ["E0437", "cannot move out of inout parameter"]

[[case]]
name = "move_out_of_borrow_field_rejected"
description = "Moving a non-Copy field out of a borrow parameter is rejected (E0429), matching the whole-variable rule."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
struct P { f: D }
fn consume(d: D) -> i32 { d.x }
fn peek(borrow p: P) -> i32 { consume(p.f) }
fn main() -> i32 { let p = P { f: D { x: 7 } }; peek(borrow p) }
""" }]
compile_fail = true
error_contains = ["E0429", "cannot move out of borrowed value"]

[[case]]
name = "move_out_of_inout_in_loop_rejected"
description = "The rejection also fires for moves inside a loop body (composes with the loop back-edge recheck)."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn consume(d: D) -> i32 { d.x }
fn steal(inout o: D) -> i32 {
    let mut i = 0;
    let mut acc = 0;
    while i < 2 {
        acc = acc + consume(o);
        i = i + 1;
    }
    acc
}
fn main() -> i32 { let mut d = D { x: 7 }; steal(inout d) }
""" }]
compile_fail = true
error_contains = ["E0437", "cannot move out of inout parameter"]

[[case]]
name = "move_out_of_inout_with_reinit_still_rejected"
description = "Reject-valid by design: reinitialization before exit is not tracked yet, so move-then-reassign still errors (see the E0437 help text)."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn consume(d: D) -> i32 { d.x }
fn steal_and_reinit(inout o: D) -> i32 {
    let v = consume(o);
    o = D { x: 0 };
    v
}
fn main() -> i32 { let mut d = D { x: 7 }; steal_and_reinit(inout d) }
""" }]
compile_fail = true
error_contains = ["E0437", "cannot move out of inout parameter"]

[[case]]
name = "inout_forwarding_still_works"
description = "Control: forwarding an inout parameter to another inout parameter is a re-borrow, not a move."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn g(inout v: D) -> i32 { v.x = v.x + 1; v.x }
fn f(inout v: D) -> i32 { g(inout v) }
fn main() -> i32 { let mut d = D { x: 7 }; f(inout d) }
""" }]
exit_code = 8

[[case]]
name = "inout_reassign_without_move_still_works"
description = "Control: reassigning an inout parameter (without moving out of it) is the normal supported use."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn replace(inout o: D) {
    o = D { x: 42 };
}
fn main() -> i32 {
    let mut d = D { x: 7 };
    replace(inout d);
    d.x
}
""" }]
exit_code = 42

[[case]]
name = "inout_copy_field_read_still_works"
description = "Control: reading a Copy field through an inout parameter is not a move."
files = [{ path = "main.rue", source = """
struct D { x: i32 }
fn get(inout v: D) -> i32 { v.x }
fn main() -> i32 { let mut d = D { x: 7 }; get(inout d) }
""" }]
exit_code = 7

[[case]]
name = "move_out_of_inout_rejected_in_imported_module"
description = "The imported-module call shape enforces the same rule as a local call."
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn main() -> i32 {
    let mut d = lib.D { x: 7 };
    lib.steal(inout d)
}
""" },
    { path = "lib.rue", source = """
struct D { x: i32 }
fn consume(d: D) -> i32 { d.x }
fn steal(inout o: D) -> i32 { consume(o) }
""" },
]
compile_fail = true
error_contains = ["E0437", "cannot move out of inout parameter"]

# ---------------------------------------------------------------------------
# Exclusive-access checks are uniform across call shapes and pipelines
# (RUE-141). Module member calls (`m.f(...)`) used to skip the exclusive-
# access check entirely, and its check had drifted to cover less than the local
# call shape (no borrow/inout conflict detection, no lvalue check). Both now
# share one implementation.
# ---------------------------------------------------------------------------

[[case]]
name = "module_member_call_double_inout_rejected"
description = "Passing the same variable to two inout parameters of a module member call errors (previously accepted)."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import("mod_swap.rue");
    let mut x = 1;
    m.swap(inout x, inout x);
    0
}
""" },
    { path = "mod_swap.rue", source = """
pub fn swap(inout a: i32, inout b: i32) {
    let tmp = a;
    a = b;
    b = tmp;
}
""" },
]
compile_fail = true
error_contains = ["E0426", "same variable 'x' to multiple inout parameters"]

[[case]]
name = "module_member_call_borrow_inout_conflict_rejected"
description = "Passing the same variable as both borrow and inout to a module member call violates the law of exclusivity (previously accepted)."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import("mod_obs.rue");
    let mut x = 1;
    m.observe(borrow x, inout x)
}
""" },
    { path = "mod_obs.rue", source = """
pub fn observe(borrow a: i32, inout b: i32) -> i32 {
    a + b
}
""" },
]
compile_fail = true
error_contains = ["E0430", "cannot borrow 'x' while it is mutably borrowed"]

[[case]]
name = "regular_call_borrow_inout_conflict_rejected_with_import"
description = "A regular call mixing borrow and inout is rejected even when the program also has an import."
files = [
    { path = "main.rue", source = """
fn observe(borrow a: i32, inout b: i32) -> i32 {
    a + b
}
fn main() -> i32 {
    let m = @import("helper.rue");
    let _ = m.one();
    let mut x = 5;
    observe(borrow x, inout x)
}
""" },
    { path = "helper.rue", source = """
pub fn one() -> i32 {
    1
}
""" },
]
compile_fail = true
error_contains = ["E0430", "cannot borrow 'x' while it is mutably borrowed"]

[[case]]
name = "module_member_call_distinct_byref_vars_control"
description = "Control: distinct variables passed by-ref to a module member call keep working."
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import("mod_swap.rue");
    let mut x = 1;
    let mut y = 41;
    m.swap(inout x, inout y);
    x
}
""" },
    { path = "mod_swap.rue", source = """
pub fn swap(inout a: i32, inout b: i32) {
    let tmp = a;
    a = b;
    b = tmp;
}
""" },
]
exit_code = 41

# ---------------------------------------------------------------------------
# Whole-value reassignment of a multi-slot aggregate through an inout
# parameter (RUE-145): `v = T { ... }` inside `fn f(inout v: T)` used to
# lower ParamStore as a single-slot store through the pointer, writing only
# slot 0 and leaving the caller's remaining slots stale. Field-wise writes
# were unaffected. The fix writes every slot through the pointer, matching
# the aggregate branch of Store.
# ---------------------------------------------------------------------------

[[case]]
name = "inout_whole_struct_reassign"
description = "Whole-value reassignment of a 2-slot struct through inout writes back both slots (RUE-145; used to exit 9: 7 + stale 2)."
files = [{ path = "main.rue", source = """
struct Inner { x: i32, y: i32 }
fn replace(inout v: Inner) { v = Inner { x: 7, y: 35 }; }
fn main() -> i32 {
    let mut f = Inner { x: 1, y: 2 };
    replace(inout f);
    f.x + f.y
}
""" }]
exit_code = 42

[[case]]
name = "inout_whole_struct_reassign_three_slots"
description = "Same for a 3-slot struct: every slot must be written through the inout pointer, not just the first."
files = [{ path = "main.rue", source = """
struct Triple { a: i32, b: i32, c: i32 }
fn replace(inout v: Triple) { v = Triple { a: 10, b: 12, c: 20 }; }
fn main() -> i32 {
    let mut t = Triple { a: 1, b: 2, c: 3 };
    replace(inout t);
    t.a + t.b + t.c
}
""" }]
exit_code = 42

[[case]]
name = "inout_whole_struct_reassign_nested"
description = "Nested aggregate: reassigning a struct containing a struct through inout writes back all flattened slots."
files = [{ path = "main.rue", source = """
struct Inner { x: i32, y: i32 }
struct Outer { a: i32, inner: Inner }
fn replace(inout v: Outer) { v = Outer { a: 5, inner: Inner { x: 14, y: 23 } }; }
fn main() -> i32 {
    let mut o = Outer { a: 1, inner: Inner { x: 2, y: 3 } };
    replace(inout o);
    o.a + o.inner.x + o.inner.y
}
""" }]
exit_code = 42

[[case]]
name = "inout_whole_array_reassign"
description = "Whole-value reassignment of an array through inout writes back every element slot."
files = [{ path = "main.rue", source = """
fn replace(inout v: [i32; 3]) { v = [10, 12, 20]; }
fn main() -> i32 {
    let mut a = [1, 2, 3];
    replace(inout a);
    a[0] + a[1] + a[2]
}
""" }]
exit_code = 42

[[case]]
name = "inout_whole_struct_reassign_i64_field"
description = "Slot sizes: a struct with an i64 field reassigned through inout still writes back all slots."
files = [{ path = "main.rue", source = """
struct Mixed { a: i64, b: i32 }
fn replace(inout v: Mixed) { v = Mixed { a: 40, b: 2 }; }
fn main() -> i32 {
    let mut m = Mixed { a: 1, b: 2 };
    replace(inout m);
    if m.a == 40 { m.b + 40 } else { m.b }
}
""" }]
exit_code = 42

[[case]]
name = "inout_whole_string_reassign"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "Whole-value reassignment of a StrBuf (3-slot fat pointer) through inout writes back ptr, len, and cap."
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn replace(inout v: StrBuf) {
    v = "hello rue!";
}
fn main() -> i32 {
    let mut s: StrBuf = "xx";
    replace(inout s);
    @dbg(s.len());
    @dbg(s);
    0
}
""" }]
stdout = """
10
hello rue!
"""

[[case]]
name = "inout_fieldwise_writes_control"
description = "Control: field-wise writes through inout (which always worked) keep working alongside the whole-value fix."
files = [{ path = "main.rue", source = """
struct Inner { x: i32, y: i32 }
fn replace(inout v: Inner) {
    v.x = 7;
    v.y = 35;
}
fn main() -> i32 {
    let mut f = Inner { x: 1, y: 2 };
    replace(inout f);
    f.x + f.y
}
""" }]
exit_code = 42

# ---------------------------------------------------------------------------
# The CALLER's own parameter passed by reference (RUE-2042).
#
# Passing a place by reference hands the callee that place's ADDRESS, so every
# read of the same root after the call must observe what the callee wrote.
# That holds whatever the root is, and a caller's own by-value parameter is a
# root like any other: `fn f(v: i64) { bump(inout v); v }` returns 6, not 5.
#
# A parameter read is materialized as a `Param { index }` instruction rather
# than a `Load`, and the optimizer keys repeated reads of a never-written
# parameter slot to one value so expressions over parameters deduplicate. The
# by-ref call argument is one of the channels that writes such a slot, so the
# post-call read is a distinct value; the classification lives with the local
# one in rue-cfg's `opt::slot_facts`. Every case here is `differential_opt`:
# -O2/-O3 must agree with the -O0 baseline, which is where the divergence was.
# ---------------------------------------------------------------------------

[[case]]
name = "inout_param_arg_reread_after_call"
differential_opt = true
description = "RUE-2042 repro: a scalar by-value parameter passed `inout` reads the callee's write afterwards, not its entry value."
files = [{ path = "main.rue", source = """
fn bump(inout x: i64) { x = x + 1; }
fn f(v: i64) -> i64 { bump(inout v); v }
fn main() -> i32 { @intCast(f(5)) }
""" }]
stdout = ""
exit_code = 6

[[case]]
name = "inout_param_arg_raw_pointer_write_reread"
differential_opt = true
description = "The callee writes through a raw pointer into the `inout` parameter instead of assigning it; the caller's post-call read still observes the write."
files = [{ path = "main.rue", source = """
fn poke(inout x: i64) {
    let p: ptr mut i64 = checked { @raw_mut(x) };
    checked { @ptr_write(p, 42); };
}
fn f(v: i64) -> i64 { poke(inout v); v }
fn main() -> i32 { @intCast(f(5)) }
""" }]
stdout = ""
exit_code = 42

[[case]]
name = "inout_param_arg_in_loop_reread"
differential_opt = true
description = "The call sits in a loop body: each iteration's read must observe the previous iteration's write, so three iterations add three."
files = [{ path = "main.rue", source = """
fn bump(inout x: i64) { x = x + 1; }
fn f(v: i64) -> i64 {
    let mut i: i64 = 0;
    while i < 3 {
        bump(inout v);
        i = i + 1;
    }
    v
}
fn main() -> i32 { @intCast(f(5)) }
""" }]
stdout = ""
exit_code = 8

[[case]]
name = "inout_param_arg_in_branch_reread"
differential_opt = true
description = "The call sits in one arm of an `if` and the read is after the join, so the taken arm reports 6 and the untaken one reports 5."
files = [{ path = "main.rue", source = """
fn bump(inout x: i64) { x = x + 1; }
fn f(v: i64, c: bool) -> i64 {
    if c { bump(inout v); }
    v
}
fn main() -> i32 {
    @dbg(f(5, true));
    @dbg(f(5, false));
    0
}
""" }]
stdout = """
6
5
"""
exit_code = 0

[[case]]
name = "inout_param_arg_passed_twice_reread"
differential_opt = true
description = "Two by-ref passes of the same parameter: the second call's argument reads the first call's write, and so does the final read."
files = [{ path = "main.rue", source = """
fn bump(inout x: i64) { x = x + 1; }
fn f(v: i64) -> i64 { bump(inout v); bump(inout v); v }
fn main() -> i32 { @intCast(f(5)) }
""" }]
stdout = ""
exit_code = 7

[[case]]
name = "inout_param_arg_subword_and_float_scalars"
differential_opt = true
description = "The rule is per ABI slot, not per width: `u8`, `bool`, and `f64` parameters passed `inout` all re-read the callee's write."
files = [{ path = "main.rue", source = """
fn bump8(inout x: u8) { x = x + 1; }
fn flip(inout b: bool) { b = !b; }
fn bumpf(inout x: f64) { x = x + 1.0; }
fn u8_case(v: u8) -> u8 { bump8(inout v); v }
fn bool_case(v: bool) -> bool { flip(inout v); v }
fn f64_case(v: f64) -> f64 { bumpf(inout v); v }
fn main() -> i32 {
    @dbg(u8_case(5));
    @dbg(bool_case(false));
    @dbg(f64_case(5.0));
    0
}
""" }]
stdout = """
6
true
6.0
"""
exit_code = 0

[[case]]
name = "inout_local_arg_reread_control"
differential_opt = true
description = "Control: the same callee on a LOCAL root, which reads through a `Load` rather than a parameter read and was always correct."
files = [{ path = "main.rue", source = """
fn bump(inout x: i64) { x = x + 1; }
fn f(v: i64) -> i64 {
    let mut l = v;
    bump(inout l);
    l
}
fn main() -> i32 { @intCast(f(5)) }
""" }]
stdout = ""
exit_code = 6

[[case]]
name = "inout_aggregate_param_arg_reread_control"
differential_opt = true
description = "Control: a multi-slot aggregate parameter passed `inout` reads through a projection rather than a whole-slot parameter read, and was always correct."
files = [{ path = "main.rue", source = """
struct P { a: i64, b: i64 }
fn poke(inout p: P) { p.a = 9; }
fn f(v: P) -> i64 { poke(inout v); v.a }
fn main() -> i32 { @intCast(f(P { a: 1, b: 2 })) }
""" }]
stdout = ""
exit_code = 9
