# The Rue stage-1 frontend (RUE-942): a recursive-descent + Pratt parser
# implemented in Rue on top of examples/ruelex. These cases execute the real
# compiled program, not a Rust-side model of it.

[section]
id = "cli.examples_rueparse"
name = "Rue parser written in Rue (rueparse)"
description = "compile the 1.9K-line Rue frontend and exercise its arena AST, full expression ladder, generic patterns, anonymous types, and recovery"

[[case]]
name = "rueparse_covers_real_frontend_grammar"
description = "parse constructs used by current std but missing from the older normative grammar: anonymous enums, anonymous-struct drop fns, and generic qualified patterns"
contract = "heavyweight"
source_path = "examples/ruelex/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "sample.rue", source = """
fn Option(comptime T: type) -> type {
    enum { Some(T), None, }
}

fn Buffer(comptime T: type) -> type {
    struct {
        value: T,
        fn get(borrow self) -> T { self.value }
        drop fn(self) {}
    }
}

fn classify(x: R) -> i32 {
    match x {
        pkg.Result(i32, E).Ok(v) => v,
        pkg.Result(i32, E).Err(e) => 0 - e,
    }
}

fn main() -> i32 {
    let x = 1 + 2 * 3;
    if x == 7 { x } else { 0 }
}
""" }]
program_args = ["--ast", "sample.rue"]
exit_code = 0
stdout_contains = [
    "(program v=0",
    "(anon-enum-type",
    "(anon-struct-type",
    "(drop-fn",
    "(type-call",
    "(pattern",
    "(binary v=62",
]

[[case]]
name = "rueparse_reports_and_recovers_from_syntax_error"
description = "malformed input returns nonzero while still producing diagnostics and a deterministic recovery tree"
contract = "heavyweight"
source_path = "examples/ruelex/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "bad.rue", source = """
fn main() -> i32 {
    let x = ;
    x
}
""" }]
program_args = ["--ast", "bad.rue"]
exit_code = 1
stdout_contains = ["parse error at byte", "(program v="]

[[case]]
name = "rueparse_missing_input_is_an_io_error"
description = "an unreadable input is not silently accepted as an empty program"
contract = "heavyweight"
source_path = "examples/ruelex/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
program_args = ["--ast", "missing.rue"]
exit_code = 1
stdout = "ruelex: cannot read missing.rue\n"

[[case]]
name = "rueparse_parses_test_items"
description = "6.7:2/6.7:3: `test` followed by a string literal at item position is a test item whose children are its directives then its body block, in that order; an empty body is still a test item."
contract = "heavyweight"
source_path = "examples/ruelex/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "tests.rue", source = """
@allow(unused_variable)
test "a test item may carry directives" {
    let ignored = 1;
}

test "an empty body is still a test item" {}

fn main() -> i32 {
    0
}
""" }]
program_args = ["--ast", "tests.rue"]
exit_code = 0
stdout_contains = [
    "(test v=3 @24..88 (list v=0 @0..23 (directive",
    "(test v=5 @90..134 (block v=0 @132..134))",
]

[[case]]
name = "rueparse_keeps_test_an_ordinary_identifier"
description = "6.7:4: `test` is a contextual keyword only at item position with a string literal next. As a function name, a field name, a method name, a let binder, and a callee it stays IDENT, so the shape holds no test node at all."
contract = "heavyweight"
source_path = "examples/ruelex/main.rue"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "ident.rue", source = """
fn test(x: i32) -> i32 { x }

struct Fixture {
    test: i64,

    fn test(borrow self) -> i64 { self.test }
}

fn main() -> i32 {
    let test = test(0);
    test
}
""" }]
program_args = ["--ast-shape", "ident.rue"]
exit_code = 0
stdout = """(program (list (list (list _ (function flags=0 _ (list _ (param mode=0 (type form=named _ _ _ _) _ _ _) _ _) (type form=named _ _ _ _) (block _ (ident _ _ _ _) _ _)) _ _) (struct flags=0 _ (list (list _ (field-def (type form=named _ _ _ _) _ _ _) _ _) (method _ (list _ (param mode=10 _ _ _ _) _ _) (type form=named _ _ _ _) (block _ (field (ident _ _ _ _) _ _ _) _ _)) _ _) _ _) _ _) (function flags=0 _ _ (type form=named _ _ _ _) (block (list _ (let flags=512 _ _ (call (ident _ _ _ _) (list _ (arg mode=0 (int _ _ _ _) _ _ _) _ _) _ _) _) _ _) (ident _ _ _ _) _ _)) _ _) _ _ _)
"""
