# Enum payloads — sum types with data (RUE-221, ADR-0038). These cases drive the
# real compiler and assert exact runtime behavior: tuple-variant
# construction, tagged-union layout, match-with-payload-bindings (move mode),
# and drop-through-the-active-variant running exactly once.

[section]
id = "cli.enum_payloads"
name = "Enum payloads"
description = "Tuple-variant construction, match-with-bindings, and drop of the active variant's payload (RUE-221)."

# Circle(5) -> 5, Rect(3,4) -> 7, Empty -> 0, exercised through a function call
# (so the multi-slot tagged-union value crosses the call ABI).
[[case]]
name = "construct_match_compute"
description = "Construct each variant form, match to extract payloads, compute 5+7+0 = 12."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn area(s: Shape) -> i32 {
    match s {
        Shape.Circle(r) => r,
        Shape.Rect(w, h) => w + h,
        Shape.Empty => 0,
    }
}
fn main() -> i32 {
    area(Shape.Circle(5)) + area(Shape.Rect(3, 4)) + area(Shape.Empty)
}
""" }]
exit_code = 12

# A struct payload with a destructor, moved out by a match binding, drops
# exactly once (its @dbg fires exactly once) when the binding leaves scope.
[[case]]
name = "drop_once_via_active_variant"
description = "Payload struct with `drop fn` moved out of the enum via a match binding drops exactly once: @dbg prints 7 once, exit 7."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Res { id: i32 }
drop fn Res(self) { @dbg(self.id); }
enum Holder { Full(Res), Nothing }
fn main() -> i32 {
    let h = Holder.Full(Res { id: 7 });
    match h {
        Holder.Full(r) => r.id,
        Holder.Nothing => 0,
    }
}
""" }]
stdout = "7\n"
exit_code = 7

# Active-variant drop glue (RUE-221 piece #1): an enum whose active variant
# carries a droppable payload, dropped implicitly at scope exit (never matched),
# drops that payload exactly once. `@dbg(-1)` prints before the scope-exit drop
# of the payload struct's destructor `@dbg(9)`, so order is -1 then 9.
[[case]]
name = "active_variant_drop_glue_has"
description = "Unmatched enum with a droppable active-variant payload drops it once at scope exit: prints -1 then 9."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let e = E.Has(D { v: 9 });
    @dbg(-1);
    0
}
""" }]
stdout = "-1\n9\n"
exit_code = 0

# RUE-998: enum drop glue must use the same reversed complete-aggregate ABI as
# an ordinary Rue by-value call. Passing logical slots directly made a returned
# Json.Array payload reconstruct its ArrayBuf as (cap,len,ptr), then crash while
# freeing cap at scope exit.
[[case]]
name = "returned_nested_json_drops_safely"
description = "A returned std.json.Json with an ArrayBuf payload drops safely at scope exit (RUE-998)."
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn make() -> std.json.Json {
    let Items = std.arraybuf.ArrayBuf(std.json.Json);
    let mut items = Items.new();
    let base: StrBuf = "hello world";
    items.push(std.json.Json.Number(base.substring(0, 5)));
    items.push(std.json.Json.Number(base.substring(6, 5)));
    std.json.Json.Array(items)
}

fn main() -> i32 {
    let value = make();
    println("built");
    0
}
""" }]
stdout = "built\n"
exit_code = 0

# A payload enum nested inside a struct field must still run active-variant drop
# glue when the containing struct is dropped. This used to leak because struct
# drop glue skipped TypeKind::Enum fields.
[[case]]
name = "struct_field_enum_payload_drop_glue"
description = "A droppable payload inside an enum field of a struct is dropped exactly once: prints -1 then 11."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
struct Box { e: E }
fn main() -> i32 {
    let b = Box { e: E.Has(D { v: 11 }) };
    @dbg(-1);
    0
}
""" }]
stdout = "-1\n11\n"
exit_code = 0

# The same active-variant drop must happen when the payload enum is an array
# element. This used to leak because array drop glue skipped TypeKind::Enum
# elements.
[[case]]
name = "array_element_enum_payload_drop_glue"
description = "Droppable payloads inside enum array elements are dropped exactly once in element order: prints -1, 21, 22."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let a = [E.Has(D { v: 21 }), E.Has(D { v: 22 })];
    @dbg(-1);
    0
}
""" }]
stdout = "-1\n21\n22\n"
exit_code = 0

# The inactive (discriminant-only) variant has no payload to drop: only -1 prints.
[[case]]
name = "active_variant_drop_glue_none"
description = "Unmatched enum whose active variant is discriminant-only drops nothing: prints only -1."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let e = E.None;
    @dbg(-1);
    0
}
""" }]
stdout = "-1\n"
exit_code = 0

# The match-move path still drops exactly once (regression): a payload moved out
# via a match binding is NOT also dropped by the scope-exit active-variant glue.
[[case]]
name = "match_move_no_double_drop"
description = "A payload moved out via a match binding drops exactly once — the scope-exit glue does not double-drop it: prints 7 once."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let e = E.Has(D { v: 7 });
    match e {
        E.Has(d) => d.v,
        E.None => 0,
    }
}
""" }]
stdout = "7\n"
exit_code = 7

# Linear/multiplicity infectiousness (RUE-221 piece #2): a variant carrying a
# linear payload makes the whole enum linear — an unconsumed enum value is a
# must-consume error (E0406), not a silent leak.
[[case]]
name = "linear_enum_must_consume"
description = "An enum with a linear-payload variant is linear: leaving a value unconsumed is E0406."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
enum E { Has(L), None }
fn main() -> i32 {
    let e = E.Has(L { v: 1 });
    0
}
""" }]
compile_fail = true
error_contains = ["E0406", "must be consumed"]

# Consuming the linear enum via a match that binds and consumes the payload
# satisfies the obligation and compiles/runs.
[[case]]
name = "linear_enum_consumed_ok"
description = "Consuming a linear enum via a match that moves and consumes the payload satisfies must-consume: exit 5."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
enum E { Has(L), None }
fn sink(l: L) -> i32 { l.v }
fn main() -> i32 {
    let e = E.Has(L { v: 5 });
    match e {
        E.Has(l) => sink(l),
        E.None => 0,
    }
}
""" }]
exit_code = 5

# An all-Copy-payload enum stays Copy (multiplicity join bottoms out at Copy):
# it can be used twice without a move error.
[[case]]
name = "copy_payload_enum_stays_copy"
description = "An enum whose only payloads are Copy stays Copy — usable twice with no must-consume/move error: exit 6."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum C { A(i32), B }
fn val(c: C) -> i32 { match c { C.A(x) => x, C.B => 0 } }
fn main() -> i32 {
    let c = C.A(3);
    val(c) + val(c)
}
""" }]
exit_code = 6

# RUE-237 facet A: a payload enum returned BY VALUE round-trips its payload
# through the call ABI. The return terminator's aggregate-slot gate omitted
# enums, so `make` shipped only the discriminant in the first return register
# and the payload slot was never written — the match read garbage (0).
[[case]]
name = "by_value_enum_return_carries_payload"
description = "A function returning a payload enum by value carries the payload through the ABI: make() -> Some(42), match extracts 42."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Opt { Some(i32), None }
fn make() -> Opt { Opt.Some(42) }
fn main() -> i32 {
    match make() {
        Opt.Some(v) => v,
        Opt.None => 0,
    }
}
""" }]
exit_code = 42

# RUE-237 facet A: a payload enum passed in AND returned (identity) keeps its
# payload across both ABI crossings.
[[case]]
name = "enum_passthru_roundtrip"
description = "Passing a payload enum in and returning it unchanged round-trips the payload: passthru(Circle(9)) -> 9."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Shape { Circle(i32), Square(i32) }
fn passthru(s: Shape) -> Shape { s }
fn main() -> i32 {
    match passthru(Shape.Circle(9)) {
        Shape.Circle(r) => r,
        Shape.Square(x) => x,
    }
}
""" }]
exit_code = 9

# RUE-237 facet C: reading a payload enum out of a STRUCT FIELD round-trips the
# payload. The struct-init slot flattening omitted enum fields, so the struct
# stored only the discriminant and dropped the payload; the field read then
# saw garbage (0).
[[case]]
name = "struct_field_enum_carries_payload"
description = "A payload enum stored in a struct field keeps its payload: w.o = Some(42), match extracts 42."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Opt { Some(i32), None }
struct Wrapper { o: Opt }
fn main() -> i32 {
    let w = Wrapper { o: Opt.Some(42) };
    match w.o {
        Opt.Some(v) => v,
        Opt.None => 0,
    }
}
""" }]
exit_code = 42

# RUE-237: a payload enum stored in an ARRAY element keeps its payload (the
# array-init slot flattening had the same enum omission as struct-init).
[[case]]
name = "array_element_enum_carries_payload"
description = "Payload enums in an array literal keep their payloads: [Some(10), Some(32)], 10 + 32 = 42."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Opt { Some(i32), None }
fn main() -> i32 {
    let a = [Opt.Some(10), Opt.Some(32)];
    match a[0] {
        Opt.Some(x) => match a[1] { Opt.Some(y) => x + y, Opt.None => 0 },
        Opt.None => 0,
    }
}
""" }]
exit_code = 42

# RUE-238: a bare `_` arm consumes the scrutinee but binds nothing, so its
# active-variant payload must still be dropped — exactly once. Previously the
# discarded payload leaked (its destructor never ran, nothing printed).
[[case]]
name = "wildcard_arm_drops_discarded_payload"
description = "A bare `_` match arm over a payload enum drops the discarded active payload exactly once: prints 7."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let e = E.Has(D { v: 7 });
    match e { _ => 0 }
}
""" }]
stdout = "7\n"
exit_code = 0

# RUE-238: the same wildcard drop over a discriminant-only active variant drops
# nothing (the drop glue dispatches on the runtime discriminant): no output.
[[case]]
name = "wildcard_arm_no_payload_drops_nothing"
description = "A bare `_` arm whose active variant is discriminant-only drops nothing: no output, exit 0."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let e = E.None;
    match e { _ => 0 }
}
""" }]
exit_code = 0

# RUE-238: a wildcard catch-all alongside an explicit no-payload variant arm
# still drops the payload of a value the wildcard catches, exactly once.
[[case]]
name = "wildcard_catchall_drops_caught_payload"
description = "A `_` catch-all that catches a droppable variant drops its payload once: E.Has caught by `_`, prints 7."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
enum E { Has(D), None }
fn main() -> i32 {
    let e = E.Has(D { v: 7 });
    match e {
        E.None => 1,
        _ => 0,
    }
}
""" }]
stdout = "7\n"
exit_code = 0

# =============================================================================
# Generic enums — Option/Result as comptime type functions (RUE-6 phase 2,
# ADR-0038). The enum analog of the anonymous-struct comptime type functions:
# an enum body over a comptime type parameter, monomorphized per instantiation.
# Definitions are inline (no prelude — RUE-1 is out of scope).
# =============================================================================

# Option(i32): Some(5) -> 5 and None -> 0, both through a match.
[[case]]
name = "generic_option_construct_match"
description = "Inline generic Option enum: Some(5) matches to 5, None matches to 0; sum is 5."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn main() -> i32 {
    let O = Option(i32);
    let x: O = O.Some(5);
    let y: O = O.None;
    let a = match x { O.Some(n) => n, O.None => 0 };
    let b = match y { O.Some(n) => n, O.None => 0 };
    a + b
}
""" }]
exit_code = 5

# Option(bool) is a distinct instantiation with its own layout and works.
[[case]]
name = "generic_option_bool_instantiation"
description = "Option(bool) is a distinct monomorphization: Some(true) matches to 7."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn main() -> i32 {
    let O = Option(bool);
    let x: O = O.Some(true);
    match x { O.Some(b) => if b { 7 } else { 8 }, O.None => 0 }
}
""" }]
exit_code = 7

# Two-type-parameter Result: both Ok and Err arms construct and match.
[[case]]
name = "generic_result_two_params"
description = "Two-param Result enum: Ok(100) -> 100, Err(true) -> 42; sum is 142."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn main() -> i32 {
    let R = Result(i32, bool);
    let ok: R = R.Ok(100);
    let er: R = R.Err(true);
    let a = match ok { R.Ok(v) => v, R.Err(e) => if e { 1 } else { 2 } };
    let b = match er { R.Ok(v) => v, R.Err(e) => if e { 42 } else { 43 } };
    a + b
}
""" }]
exit_code = 142

# Mixing distinct instantiations (Option(bool) value into Option(i32) slot) is
# a compile-time type error — monomorphization keeps the types apart.
[[case]]
name = "generic_option_distinct_types_rejected"
description = "Assigning an Option(bool) value to an Option(i32)-typed binding is a type error."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn main() -> i32 {
    let Oi = Option(i32);
    let Ob = Option(bool);
    let x: Oi = Ob.Some(true);
    0
}
""" }]
compile_fail = true
error_contains = ["type mismatch"]

# A payload struct with a destructor, carried by Some(D) of a generic Option,
# drops through the active variant exactly once at scope exit.
[[case]]
name = "generic_enum_payload_drop_once"
description = "Generic Option holding a struct with `drop fn`: dropping the enum runs the payload destructor once (@dbg prints 33)."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Noisy { code: i32 }
drop fn Noisy(self) { @dbg(self.code); }
fn Option(comptime T: type) -> type { enum { Some(T), None } }
fn main() -> i32 {
    let O = Option(Noisy);
    let x: O = O.Some(Noisy { code: 33 });
    match x {
        O.Some(v) => v.code,
        O.None => 0,
    }
}
""" }]
stdout = "33\n"
exit_code = 33

# A linear payload type makes the generic enum linear (multiplicity join),
# so an unconsumed value is a compile error — linearity composes for free,
# with no special "Result is linear" rule (ADR-0038).
[[case]]
name = "generic_enum_linear_payload_must_consume"
description = "A generic Result whose Err payload is a linear struct is itself linear: leaving it unconsumed is E0406."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
linear struct Token { v: i32 }
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn main() -> i32 {
    let R = Result(i32, Token);
    let x: R = R.Ok(5);
    0
}
""" }]
compile_fail = true
error_contains = ["must be consumed"]

# RUE-1539: provider-demanded generated fixed-string identities must flow from
# an enum payload constraint into literal contextualization. The executable
# path constructs and extracts Message.Text(Str(8)) and returns its length.
[[case]]
name = "enum_fixed_string_payload_contextualizes_literal"
description = "A fixed-string enum payload contextualizes its construction literal and round-trips through a match: Text(hello) -> 5."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Message { Text(Str(8)), Empty }
fn main() -> i32 {
    let message = Message.Text("hello");
    match message {
        Message.Text(value) => @intCast(value.len()),
        Message.Empty => 0,
    }
}
""" }]
exit_code = 5
