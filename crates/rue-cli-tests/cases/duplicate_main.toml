# `main` is scoped to the root module, not program-wide unique (RUE-920,
# spec 6.1:38). A top-level `main` in a non-root module is an ordinary
# namespaced function: it does not conflict with the root's entry point and is
# callable through its module path. Same-file duplicates remain a per-file
# conflict (spec 10.5:1). ADR-0047 tracked the program-wide check as a
# transitional state; RUE-920/RUE-921 retired it.

[section]
id = "cli.duplicate_main"
name = "Root-module-scoped main"
description = "A non-root `main` is an ordinary namespaced function; same-file duplicates still conflict."

# Same-file duplicate `main` is still a per-file conflict (spec 10.5:1).
[[case]]
name = "same_file_duplicate_main_is_rejected"
files = [
    { path = "main.rue", source = """
fn main() -> i32 { 0 }
fn main() -> i32 { 1 }
""" },
]
compile_fail = true
error_contains = ["E0436", "duplicate function definition", "main", "first defined"]

# A `main` in an imported (non-root) module compiles and is callable by path;
# the root module's `main` remains the entry point and selects the exit code.
[[case]]
name = "imported_main_is_callable_by_path"
files = [
    { path = "main.rue", source = """
const helper = @import("helper.rue");

fn main() -> i32 { helper.main() }
""" },
    { path = "helper.rue", source = """
pub fn main() -> i32 { 42 }
pub fn answer() -> i32 { 7 }
""" },
]
exit_code = 42

# Root `main` and an imported `main` coexist in one executable without a symbol
# collision; the entry point is the root's `main` (exit code 5, not 99).
[[case]]
name = "root_main_is_the_entry_point"
files = [
    { path = "main.rue", source = """
const helper = @import("helper.rue");

fn main() -> i32 { helper.answer() + 3 }
""" },
    { path = "helper.rue", source = """
pub fn main() -> i32 { 99 }
pub fn answer() -> i32 { 2 }
""" },
]
exit_code = 5
