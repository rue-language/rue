# Shared scheduling and timeout contracts for CLI tests. Automatic examples
# and explicit TOML sections both reference these names, so heavyweight
# classification has one declarative authority rather than path checks in the
# Rust harness.
[section]
id = "cli.execution_contracts"
name = "CLI execution contracts"
description = "bounded scheduling and phase-specific budgets for heavyweight dogfood programs"

[contract.heavyweight]
class = "heavyweight"
compile_timeout_ms = 30000
runtime_timeout_ms = 30000

[contract.heavyweight_medium]
class = "heavyweight"
# RUE-1083: temporary Linux ARM64 headroom for the real Rill coverage.
compile_timeout_ms = 60000
runtime_timeout_ms = 30000

[contract.heavyweight_long]
class = "heavyweight"
compile_timeout_ms = 120000
runtime_timeout_ms = 120000

[contract.heavyweight_extra_long]
class = "heavyweight"
# RUE-1083: temporary headroom while the query regression is fixed.
compile_timeout_ms = 900000
runtime_timeout_ms = 120000

[[automatic_example]]
path = "harbor/main.rue"
contract = "heavyweight"

[[automatic_example]]
path = "lattice/main.rue"
contract = "heavyweight"

[[automatic_example]]
path = "mosaic/main.rue"
contract = "heavyweight"

[[automatic_example]]
path = "rill/main.rue"
contract = "heavyweight_medium"

[[automatic_example]]
path = "ruelex/main.rue"
contract = "heavyweight"

[[automatic_example]]
path = "meridian/main.rue"
contract = "heavyweight_long"

[[automatic_example]]
path = "caldera/main.rue"
contract = "heavyweight_extra_long"
