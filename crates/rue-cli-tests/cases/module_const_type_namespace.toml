# A comptime type-constructor result bound to a module-level `const` must work
# as a TYPE NAMESPACE — for associated-function calls (`C.zero()`) and struct
# literals (`P { .. }`) — exactly like a local `let`-bound one and like a
# module-`const`-bound ENUM (`R.Ok(..)`, which already worked). Before RUE-595
# the struct side consulted only `comptime_type_vars` (local `let`) and the
# named-struct tables, never `constants_by_file_name`, so a module-`const`
# struct alias fell through: `C.zero()` was E0413 ("no method named 'zero' on
# type 'type'") and `P { .. }` was E0204 ("unknown type 'P'"), even though the
# TYPE-ANNOTATION form (`fn f() -> P`) resolved. `const AB = ArrayBuf(i32)` at
# module scope — the natural way to alias a generic collection — was the real
# casualty; the std docs only ever used `let`, so the suite never caught it.

[section]
id = "cli.module_const_type_namespace"
name = "Module-const comptime type as a namespace"
description = "`const C = Ctor(T)` resolves for assoc-fn calls and struct literals, matching local `let` and enum consts (RUE-595)."

# --- Facet A: associated-function call through a module-level const ---

[[case]]
name = "module_const_assoc_fn"
description = "`const C = Counter(i32); C.zero()` resolves the assoc fn (was E0413 before RUE-595)."
files = [{ path = "main.rue", source = """
fn Counter(comptime T: type) -> type {
    struct {
        n: T,
        fn zero() -> Self { Self { n: 0 } }
        fn bump(self) -> Self { Self { n: self.n + 1 } }
    }
}
const C = Counter(i32);

fn main() -> i32 {
    let c = C.zero().bump().bump();
    @dbg(c.n);   // 2
    0
}
""" }]
stdout = "2\n"

# --- Facet B: struct literal through a module-level const ---

[[case]]
name = "module_const_struct_literal"
description = "`const P = Point(i32); P { .. }` resolves the literal head (was E0204 before RUE-595)."
files = [{ path = "main.rue", source = """
fn Point(comptime T: type) -> type { struct { x: T, y: T } }
const P = Point(i32);

fn main() -> i32 {
    let p: P = P { x: 3, y: 4 };
    p.x + p.y   // 7
}
""" }]
exit_code = 7

# --- Both facets + the const type used in annotation position, one program ---

[[case]]
name = "module_const_annotation_and_construction"
description = "The same module-const type drives a return annotation, a parameter type, an assoc fn, and a literal."
files = [{ path = "main.rue", source = """
fn Vec2(comptime T: type) -> type {
    struct {
        x: T,
        y: T,
        fn origin() -> Self { Self { x: 0, y: 0 } }
        fn sum(borrow self) -> T { self.x + self.y }
    }
}
const V = Vec2(i32);

fn make() -> V { V { x: 20, y: 22 } }
fn total(borrow v: V) -> i32 { v.sum() }

fn main() -> i32 {
    let o = V.origin();
    @dbg(o.sum());       // 0
    let m = make();
    @dbg(total(borrow m));  // 42
    0
}
""" }]
stdout = "0\n42\n"

# --- Cross-file: the realistic alias — const bound to an imported ctor ---

[[case]]
name = "module_const_alias_of_imported_ctor"
description = "`const C = lib.Counter(i32)` aliasing an imported type constructor resolves for assoc-fn + literal."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn Counter(comptime T: type) -> type {
    struct {
        n: T,
        fn start(v: T) -> Self { Self { n: v } }
        fn get(borrow self) -> T { self.n }
    }
}
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
const C = lib.Counter(i32);

fn main() -> i32 {
    let a = C.start(40);       // assoc fn through the const alias
    let b: C = C { n: 2 };     // literal through the const alias
    @dbg(a.get() + b.get());   // 42
    0
}
""" }]
stdout = "42\n"

# --- RUE-1966: the alias must reach inference, not only sema ---

[[case]]
name = "module_const_u8_struct_literal_constrains_fields"
description = "RUE-1966: a file const alias constrains a struct literal's fields before AIR emission; 200 fits u8 and must not reach the mixed-width ICE path."
files = [{ path = "main.rue", source = """
fn Point(comptime T: type) -> type { struct { x: T } }
const P = Point(u8);

fn identity(comptime T: type, value: T) -> T { value }
fn get(p: P) -> u8 { p.x }

fn main() -> i32 {
    let p: P = P { x: 200 };
    let q = identity(P, p);
    if get(q) == 200 { 0 } else { 1 }
}
""" }]
exit_code = 0

[[case]]
name = "module_const_u8_struct_literal_out_of_range"
description = "RUE-1966 control: the same alias gives an out-of-range field a stable user diagnostic rather than an ICE."
files = [{ path = "main.rue", source = """
fn Point(comptime T: type) -> type { struct { x: T } }
const P = Point(u8);
fn main() -> i32 { let _ = P { x: 300 }; 0 }
""" }]
compile_fail = true
error_contains = ["E0800", "300", "out of range", "u8"]

[[case]]
name = "module_const_u8_struct_literal_type_mismatch"
description = "RUE-1966 control: the alias-constrained field keeps the ordinary E0206 mismatch class."
files = [{ path = "main.rue", source = """
fn Point(comptime T: type) -> type { struct { x: T } }
const P = Point(u8);
fn main() -> i32 { let _ = P { x: true }; 0 }
""" }]
compile_fail = true
error_contains = ["E0206", "expected u8", "found bool"]

[[case]]
name = "user_struct_shadows_opposite_kind_builtin_enum"
description = "RUE-1966 precedence control: a user struct named Arch wins before the builtin Arch enum for annotations, generic arguments, and literals."
files = [{ path = "main.rue", source = """
struct Arch { x: i32 }
fn identity(comptime T: type, value: T) -> T { value }
fn get(value: Arch) -> i32 { value.x }
fn main() -> i32 { get(identity(Arch, Arch { x: 42 })) }
""" }]
exit_code = 42

[[case]]
name = "local_comptime_alias_shadows_file_alias"
description = "RUE-1966 precedence control: a lexical comptime alias wins over a same-named file alias for a struct-literal head."
files = [{ path = "main.rue", source = """
fn Point(comptime T: type) -> type { struct { x: T } }
const P = Point(i32);
fn main() -> i32 {
    let P = Point(u8);
    let p = P { x: 200 };
    if p.x == 200 { 0 } else { 1 }
}
""" }]
exit_code = 0

[[case]]
name = "user_struct_blocks_opposite_kind_builtin_enum_variant"
description = "RUE-1966 wrong-kind control: a same-named user struct blocks fallback to the builtin Arch enum."
files = [{ path = "main.rue", source = """
struct Arch { x: i32 }
fn main() -> i32 { let _ = Arch.X86_64; 0 }
""" }]
compile_fail = true
error_contains = ["E0423", "field access on non-struct type 'type'"]

[[case]]
name = "user_enum_blocks_opposite_kind_builtin_struct_literal"
description = "RUE-1966 symmetric wrong-kind control: a same-named user enum blocks fallback to builtin str as a struct-literal head."
files = [{ path = "main.rue", source = """
enum str { Value }
fn main() -> i32 { let _ = str { x: 1 }; 0 }
""" }]
compile_fail = true
error_contains = ["E0204", "unknown type 'str'"]

[[case]]
name = "primitive_spelling_blocks_same_named_user_struct_literal"
description = "RUE-1966 primitive control: the legal declaration spelling `f32` cannot make struct-literal resolution disagree with annotation resolution, where the primitive wins."
args = ["--preview", "floats", "main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct f32 { x: i32 }
fn main() -> i32 { let _: f32 = f32 { x: 42 }; 0 }
""" }]
compile_fail = true
error_contains = ["E0204", "unknown type 'f32'"]

[[case]]
name = "non_type_const_is_not_a_struct_literal_alias"
description = "RUE-1966 counterfeit control: a value const cannot satisfy the nominal alias slot."
files = [{ path = "main.rue", source = """
const P: i32 = 0;
fn main() -> i32 { let _ = P { x: 200 }; 0 }
""" }]
compile_fail = true
error_contains = ["E0204", "unknown type 'P'"]

# --- Guard: enum consts (which always worked) still resolve, so the struct
#     fix keeps struct and enum namespaces uniform ---

[[case]]
name = "module_const_enum_still_resolves"
description = "A module-const enum alias constructs and matches — unchanged by the struct-side fix (RUE-595 guard)."
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
const R = Result(i32, i32);

fn main() -> i32 {
    let r = R.Ok(42);
    match r { R.Ok(v) => v, R.Err(e) => e }
}
""" }]
exit_code = 42
