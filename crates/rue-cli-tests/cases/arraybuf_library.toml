# RAII: the ArrayBuf owns its buffer and frees it automatically in its `drop fn`
# at scope exit — the program never calls free(). This exercises the real
# ArrayBuf destructor end-to-end (parse + monomorphize + drop-glue + @free), the
# last gap to a real ArrayBuf (RUE-312). The `drop fn(self)` here mirrors
# std/arraybuf.rue. Output is the same as the explicit-free dogfood; the
# destructor's @free is a silent no-op under the bump allocator, so correctness
# is that the program compiles, runs, and exits cleanly with the buffer released
# by the destructor rather than a manual call.
[[case]]
name = "arraybuf_i32_raii_auto_free"
description = "ArrayBuf(i32) frees its buffer via its drop fn at scope exit — no explicit free() call (RUE-312)."
files = [
  { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import(\"arraybuf.rue\");
    let V = m.ArrayBuf(i32);

    let mut v = V.new();
    v.push(10);
    v.push(20);
    v.push(30);
    @dbg(v.len());          // 3
    @dbg(v.get(0));         // 10
    @dbg(v.get(2));         // 30
    let sum: i32 = v.get(0) + v.get(1) + v.get(2);
    @dbg(sum);              // 60
    sum
    // v is dropped here: its drop fn frees the buffer automatically.
}
""" },
  { path = "arraybuf.rue", source = """
pub fn ArrayBuf(comptime T: type) -> type {
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,

        fn new() -> Self {
            let zero: u64 = 0;
            Self { buf: checked { @int_to_ptr(zero) }, len: 0, cap: 0 }
        }
        fn len(borrow self) -> u64 { self.len }

        fn reserve(inout self) {
            if self.len == self.cap {
                let new_cap: u64 = if self.cap == 0 { 4 } else { self.cap * 2 };
                checked {
                    let grown = @realloc(self.buf, self.cap, new_cap);
                    self.buf = grown;
                };
                self.cap = new_cap;
            }
        }
        fn push(inout self, x: T) {
            self.reserve();
            checked {
                let slot = @ptr_offset(self.buf, self.len);
                @ptr_write(slot, x);
            };
            self.len = self.len + 1;
        }
        fn get(borrow self, i: u64) -> T {
            checked { @ptr_read(@ptr_offset(self.buf, i)) }
        }

        drop fn(self) {
            checked { @free(self.buf, self.cap); };
        }
    }
}
""" },
]
stdout = "3\n10\n30\n60\n"
exit_code = 60

# RUE-509 regression: ArrayBuf imports the OFFICIAL Option from option.rue
# instead of defining its own duplicate, so that an Option value returned by
# `ArrayBuf.get` matches against `option.Option(T)` variants named in the caller
# (single source of truth; nominal identity across importers).
#
# This used to be BLOCKED by a comptime limitation (RUE-511): a source-level
# generic type function (`ArrayBuf(T)`) whose method references a comptime type
# function imported from ANOTHER module (`option.Option(T)`) could not be
# instantiated — `let V = arraybuf.ArrayBuf(i32)` failed with
#   E1200: comptime evaluation failed: cannot store type value in variable 'V'
#          at runtime; type values only exist at compile time
# RUE-511 fixed cross-module comptime type-function references in field/return/
# value positions, so `ArrayBuf.get() -> option.Option(T)` with a method-body
# `let O = option.Option(T)` now instantiates. This case (and std/arraybuf.rue's
# real import of option.rue) pins that fix end-to-end.
[[case]]
name = "arraybuf_imports_official_option"
description = "ArrayBuf.get returns the official option.Option(T); caller matches it against option.Option(i32) (RUE-509)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "main.rue", source = """
const option = @import("option.rue");
const arraybuf = @import("arraybuf.rue");

fn main() -> i32 {
    let V = arraybuf.ArrayBuf(i32);
    let O = option.Option(i32);   // the caller's binding, via option.rue
    let mut v = V.new();
    v.push(10);
    v.push(20);
    // The Option returned by ArrayBuf.get is option.Option(i32) — the SAME
    // nominal type the caller names here, so these match arms type-check.
    let a = match v.get(1) { O.Some(x) => x, O.None => -1 };
    @dbg(a);   // 20
    let b = match v.get(9) { O.Some(x) => x, O.None => -1 };
    @dbg(b);   // -1
    v.free();
    a
}
""" },
  { path = "option.rue", source = """
pub fn Option(comptime T: type) -> type {
    enum { Some(T), None }
}
""" },
  { path = "arraybuf.rue", source = """
const option = @import("option.rue");

pub fn ArrayBuf(comptime T: type) -> type {
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,

        fn new() -> Self {
            let zero: u64 = 0;
            Self { buf: checked { @int_to_ptr(zero) }, len: 0, cap: 0 }
        }
        fn len(borrow self) -> u64 { self.len }
        fn reserve(inout self) {
            if self.len == self.cap {
                let new_cap: u64 = if self.cap == 0 { 4 } else { self.cap * 2 };
                checked {
                    let grown = @realloc(self.buf, self.cap, new_cap);
                    self.buf = grown;
                };
                self.cap = new_cap;
            }
        }
        fn push(inout self, x: T) {
            self.reserve();
            checked {
                let slot = @ptr_offset(self.buf, self.len);
                @ptr_write(slot, x);
            };
            self.len = self.len + 1;
        }
        fn get(borrow self, i: u64) -> option.Option(T) {
            let O = option.Option(T);
            if i < self.len {
                O.Some(checked { @ptr_read(@ptr_offset(self.buf, i)) })
            } else {
                O.None
            }
        }
        fn free(inout self) {
            checked { @free(self.buf, self.cap); };
            let zero: u64 = 0;
            self.buf = checked { @int_to_ptr(zero) };
            self.len = 0;
            self.cap = 0;
        }
    }
}
""" },
]
stdout = "20\n-1\n"
exit_code = 20

# RUE-388 well-formedness gate: an owning growable container (`ArrayBuf(T)`)
# owns a heap buffer and frees it wholesale in its `drop fn` — it does NOT run
# per-element drop glue, nor track element linearity. Before the gate, an
# element type carrying a destructor was accepted and its `drop fn` was silently
# skipped when the buffer dropped (a leaked destructor effect); a `linear`
# element would likewise leak. The `@require_droppable(T)` gate in the ArrayBuf
# constructor rejects both classes at INSTANTIATION time. These cases use an
# inline ArrayBuf carrying that gate (mirroring std/arraybuf.rue) so the reject
# is exercised end-to-end through the real binary.
[[case]]
name = "arraybuf_rejects_destructor_element"
description = "ArrayBuf(T) with a destructor-bearing element type is rejected at instantiation (E0498), not silently leaked (RUE-388)."
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0498", "Inner", "drop fn"]
files = [
  { path = "main.rue", source = """
const arraybuf = @import("arraybuf.rue");

struct Inner { v: i32 }
drop fn Inner(self) { @panic("dropped element"); }

fn main() -> i32 {
    let V = arraybuf.ArrayBuf(Inner);
    let mut v = V.new();
    v.push(Inner { v: 7 });
    0
}
""" },
  { path = "arraybuf.rue", source = """
pub fn ArrayBuf(comptime T: type) -> type {
    @require_droppable(T);
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,

        fn new() -> Self {
            let zero: u64 = 0;
            Self { buf: checked { @int_to_ptr(zero) }, len: 0, cap: 0 }
        }
        fn reserve(inout self) {
            if self.len == self.cap {
                let new_cap: u64 = if self.cap == 0 { 4 } else { self.cap * 2 };
                checked {
                    let grown = @realloc(self.buf, self.cap, new_cap);
                    self.buf = grown;
                };
                self.cap = new_cap;
            }
        }
        fn push(inout self, x: T) {
            self.reserve();
            checked {
                let slot = @ptr_offset(self.buf, self.len);
                @ptr_write(slot, x);
            };
            self.len = self.len + 1;
        }
    }
}
""" },
]

