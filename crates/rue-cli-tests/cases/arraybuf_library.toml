# RUE-646 well-formedness gate: an owning growable container (`ArrayBuf(T)`)
# owns a heap buffer of `T`. At scope exit it runs each live element's drop glue
# in ascending index order, then frees the buffer (Rust's `Vec<T>` drop
# discipline). So a destructor-bearing element type is now LEGAL — its `drop fn`
# runs per-element, no leak. The `@require_droppable(T)` gate now rejects ONLY a
# `linear` element type (a linear value must be consumed exactly once, not merely
# dropped, and the container can only drop its elements). The positive drop-trace
# coverage lives in the dedicated cases further below (they use the real std
# ArrayBuf via RUE_STD_PATH so per-element drop glue is exercised end-to-end);
# the case here is the surviving negative control for the linear rejection.

[[case]]
name = "arraybuf_rejects_linear_element"
description = "ArrayBuf(T) with a `linear` element type is rejected at instantiation (E0499), so the linear element cannot be leaked (RUE-388)."
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0499", "Token", "linear"]
files = [
  { path = "main.rue", source = """
const arraybuf = @import("arraybuf.rue");

linear struct Token { v: i32 }

fn main() -> i32 {
    let V = arraybuf.ArrayBuf(Token);
    let mut v = V.new();
    0
}
""" },
  { path = "arraybuf.rue", source = """
pub fn ArrayBuf(comptime T: type) -> type {
    @require_droppable(T);
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,

        fn new() -> Self {
            let zero: u64 = 0;
            Self { buf: checked { @int_to_ptr(zero) }, len: 0, cap: 0 }
        }
    }
}
""" },
]

# Positive control for the RUE-388 gate: a trivially-droppable `Copy` struct
# element type passes the `@require_droppable(T)` gate and round-trips through
# push/pop. This pins that the gate rejects ONLY non-droppable/linear elements
# and does not regress ordinary aggregate element support (ADR-0040 / RUE-311).
[[case]]
name = "arraybuf_gate_allows_copy_struct_element"
description = "ArrayBuf(T) with a trivially-droppable Copy struct element passes the @require_droppable gate and works (RUE-388)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "main.rue", source = """
const arraybuf = @import("arraybuf.rue");

struct Point { x: i32, y: i32 }

fn main() -> i32 {
    let V = arraybuf.ArrayBuf(Point);
    let O = arraybuf.Option(Point);
    let mut v = V.new();
    v.push(Point { x: 3, y: 4 });
    v.push(Point { x: 10, y: 20 });
    match v.pop() { O.Some(p) => p.x + p.y, O.None => -1 }   // 30
}
""" },
  { path = "arraybuf.rue", source = """
pub fn Option(comptime T: type) -> type {
    enum { Some(T), None }
}

pub fn ArrayBuf(comptime T: type) -> type {
    @require_droppable(T);
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,

        fn new() -> Self {
            let zero: u64 = 0;
            Self { buf: checked { @int_to_ptr(zero) }, len: 0, cap: 0 }
        }
        fn reserve(inout self) {
            if self.len == self.cap {
                let new_cap: u64 = if self.cap == 0 { 4 } else { self.cap * 2 };
                checked {
                    let grown = @int_to_ptr(@ptr_to_int(@realloc(@int_to_ptr(@ptr_to_int(self.buf)), self.cap * @intCast(@size_of(T)), @intCast(@align_of(T)), new_cap * @intCast(@size_of(T)))));
                    self.buf = grown;
                };
                self.cap = new_cap;
            }
        }
        fn push(inout self, x: T) {
            self.reserve();
            checked {
                let slot = @ptr_offset(self.buf, self.len);
                @ptr_write(slot, x);
            };
            self.len = self.len + 1;
        }
        fn pop(inout self) -> Option(T) {
            let O = Option(T);
            if self.len == 0 {
                O.None
            } else {
                self.len = self.len - 1;
                O.Some(checked { @ptr_read(@ptr_offset(self.buf, self.len)) })
            }
        }
    }
}
""" },
]
stdout = ""
exit_code = 30

[[case]]
# RUE-566: a zero-sized Copy element type is valid for ArrayBuf. The buffer is
# never allocated (element size 0), so @ptr_write/@ptr_read must be zero-byte
# no-ops (they dereferenced the null buffer: first a codegen abort, then a
# runtime segfault) and a zero-slot Option payload extraction must not touch
# the 1-slot discriminant-only enum's nonexistent payload slots (codegen
# panic). Exercises push/pop/len/clear + Option(Z) match; score pins each leg.
name = "arraybuf_zero_sized_element"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
struct Z {}

fn main() -> i32 {
    let V = std.arraybuf.ArrayBuf(Z);
    let mut v = V.new();
    v.push(Z {});
    v.push(Z {});
    v.push(Z {});
    let O = std.option.Option(Z);
    let popped = v.pop();
    let mut score = 0;
    match popped { O.Some(z) => { score = score + 1; }, O.None => {} }
    if v.len() == 2 { score = score + 10; }
    if v.is_empty() { score = score + 100; }
    v.clear();
    if v.is_empty() { score = score + 1000; }
    score
}
""" }]
exit_code = 243

# ============================================================================
# RUE-646: droppable-but-non-linear element types are legal; the container runs
# each live element's drop glue (ascending index order) before freeing its
# buffer — Rust's `Vec<T>` drop discipline. These cases drive the REAL std
# ArrayBuf via RUE_STD_PATH so the per-element drop loop is exercised end-to-end.
# The @dbg drop traces are the double-free / leak sentinels: an element that
# drops twice, zero times, or out of order changes the exact stdout.
# ============================================================================

# Nested ArrayBuf(ArrayBuf(i64)): build a jagged 3x3, then DRAIN it by popping
# each inner row out (moving it — pop retires the slot so the outer's drop won't
# touch it) and popping every element. Sum of all 9 = 99. Reads a non-Copy inner
# element the SOUND way: `pop` moves it out (single owner), never `get` (which
# returns an aliasing bit-copy of the inner buffer — a masked double-free,
# RUE-651). Proves a container-of-containers compiles, drops correctly, and its
# elements can be read back by moving them out.
[[case]]
name = "arraybuf_nested_i64_drain"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const ArrayBuf = std.arraybuf.ArrayBuf;
const StrBuf = std.strbuf.StrBuf;

fn main() -> i32 {
    let Inner = ArrayBuf(i64);
    let Outer = ArrayBuf(Inner);
    let OInner = std.option.Option(Inner);
    let Oi = std.option.Option(i64);
    let mut outer = Outer.new();
    let mut i: i64 = 0;
    while i < 3 {
        let mut inner = Inner.new();
        let mut j: i64 = 0;
        while j < 3 {
            inner.push(i * 10 + j);
            j = j + 1;
        }
        outer.push(inner);
        i = i + 1;
    }
    let mut sum: i64 = 0;
    while outer.len > 0 {
        match outer.pop() {
            OInner.Some(r) => {
                let mut row = r;
                while row.len > 0 {
                    match row.pop() {
                        Oi.Some(v) => { sum = sum + v; },
                        Oi.None => {},
                    }
                }
            },
            OInner.None => {},
        }
    }
    let r: i32 = @intCast(sum);
    r
}
""" }]
exit_code = 99

# A `drop fn` struct element: push 3, they drop exactly once each in ASCENDING
# index order at scope exit. `100` prints first (before scope exit), then the
# element drops `1 2 3`. A double-free would repeat a value; a skipped drop would
# omit one; a reversed loop would print `3 2 1`. This is the leak/double-free
# sentinel for the destructor path.
[[case]]
name = "arraybuf_drop_trace_ascending"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const ArrayBuf = std.arraybuf.ArrayBuf;

struct D { v: i64 }
drop fn D(self) { @dbg(self.v); }

fn main() {
    let Buf = ArrayBuf(D);
    let mut b = Buf.new();
    b.push(D { v: 1 });
    b.push(D { v: 2 });
    b.push(D { v: 3 });
    @dbg(100);
}
""" }]
stdout = "100\n1\n2\n3\n"
exit_code = 0

# Nested ArrayBuf(ArrayBuf(D)): every leaf D drops EXACTLY once, none twice, at
# scope exit. Two inners of two elements each (v = 0,1,10,11). The outer's drop
# loop drops each inner in ascending order; each inner's drop loop drops its D
# leaves in ascending order. Exact stdout pins no double-free across the two
# levels of drop glue.
[[case]]
name = "arraybuf_nested_drop_trace"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const ArrayBuf = std.arraybuf.ArrayBuf;

struct D { v: i64 }
drop fn D(self) { @dbg(self.v); }

fn main() {
    let Inner = ArrayBuf(D);
    let Outer = ArrayBuf(Inner);
    let mut outer = Outer.new();
    let mut i: i64 = 0;
    while i < 2 {
        let mut inner = Inner.new();
        let mut j: i64 = 0;
        while j < 2 {
            inner.push(D { v: i * 10 + j });
            j = j + 1;
        }
        outer.push(inner);
        i = i + 1;
    }
    @dbg(100);
}
""" }]
stdout = "100\n0\n1\n10\n11\n"
exit_code = 0

# clear / set / free drop accounting. `clear()` drops all live elements (1, 2)
# then resets len; `set(0, ..)` drops the OLD element (3) before writing the new
# one (4); `free()` drops the remaining live element (4) then resets to empty so
# the scope-exit destructor is a no-op (no trailing double-drop after 903). The
# interleaved markers pin WHEN each element drops.
[[case]]
name = "arraybuf_clear_set_free_drop_accounting"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const ArrayBuf = std.arraybuf.ArrayBuf;

struct D { v: i64 }
drop fn D(self) { @dbg(self.v); }

fn main() {
    let Buf = ArrayBuf(D);
    let mut b = Buf.new();
    b.push(D { v: 1 });
    b.push(D { v: 2 });
    @dbg(900);
    b.clear();
    @dbg(901);
    b.push(D { v: 3 });
    b.set(0, D { v: 4 });
    @dbg(902);
    b.free();
    @dbg(903);
}
""" }]
stdout = "900\n1\n2\n901\n3\n902\n4\n903\n"
exit_code = 0

# ArrayBuf(StrBuf): a list of owned, heap-backed strings. Push two, then read
# each back by POPPING it out (moving — the sound way for a non-Copy element;
# `get` would return an aliasing bit-copy of the StrBuf header, a masked
# double-free, RUE-651). StrBuf carries a destructor (it owns a heap buffer), so
# this exercises the RUE-646 droppable-element path with a builtin owning type:
# it compiles, round-trips by move-out, and drops each string exactly once. pop
# returns last-pushed first: world!(6) then hello(5). Score = 1 (len==2) + 1000
# (first pop len 6) + 10 (second pop len 5) = 1011; exit = 1011 & 0xFF = 243.
[[case]]
name = "arraybuf_strbuf_elements"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const ArrayBuf = std.arraybuf.ArrayBuf;
const StrBuf = std.strbuf.StrBuf;

fn main() -> i32 {
    let Buf = ArrayBuf(StrBuf);
    let OStr = std.option.Option(StrBuf);
    let mut b = Buf.new();
    let mut s0 = StrBuf.new();
    s0.push_str("hello");
    let mut s1 = StrBuf.new();
    s1.push_str("world!");
    b.push(s0);
    b.push(s1);
    let mut score: i32 = 0;
    if b.len == 2 { score = score + 1; }
    match b.pop() {
        OStr.Some(g1) => { if g1.len() == 6 { score = score + 1000; } },
        OStr.None => {},
    }
    match b.pop() {
        OStr.Some(g0) => { if g0.len() == 5 { score = score + 10; } },
        OStr.None => {},
    }
    score
}
""" }]
exit_code = 243

# A by-copy read (`get`) of a drop-glue element is REJECTED (E0711, RUE-651).
# Before this gate, `ArrayBuf(StrBuf)::get(0)` returned a bitwise copy of the
# StrBuf that aliased its owned heap buffer; both the copy and the still-live
# slot ran drop glue at scope exit — a double-free that segfaulted in safe code
# (verified: this program exited 139 before the fix). The reader now gates on its
# element type and directs the caller to `get_ref` for an in-place read or `pop`
# to move the element out, leaving one owner. Storing/pushing/popping a StrBuf
# element stays legal — the
# `arraybuf_strbuf_elements` case above (which uses `pop`) still runs.
[[case]]
name = "arraybuf_get_on_drop_glue_element_rejected"
description = "A by-copy `get` of a drop-glue element (StrBuf) is rejected with E0711 and pointed at `get_ref` or `pop`, instead of a double-free segfault (RUE-651/RUE-1017)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0711", "by copy", "use `get_ref` for an in-place read", "move it out with `pop`/`pop_or`"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn main() -> i32 {
    let Buf = std.arraybuf.ArrayBuf(StrBuf);
    let OStr = std.option.Option(StrBuf);
    let mut b = Buf.new();
    let mut s0 = StrBuf.new();
    s0.push_str("hello");
    b.push(s0);
    let n = match b.get(0) { OStr.Some(s) => 1, OStr.None => 0 };
    @intCast(n)
}
""" }]
