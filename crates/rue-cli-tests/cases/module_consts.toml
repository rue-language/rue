# Value constants as module members + const-evaluable member access (RUE-160).
#
# `m.CONST` yields the member constant's value (typed as declared), both at
# use sites and inside another const's initializer. A const initializer that
# resolves to a module (`const math = std.math;`, `const m2 = m;`) is a
# module alias — itself a per-file module binding. Visibility matches other
# items: pub everywhere, non-pub same-directory only (E0706).

[section]
id = "cli.module_consts"
name = "Module member constants"
description = "Value consts as module members, module aliases, and const-context member access (RUE-160)."

# The headline RUE-160 repro: a value const reached through a module binding
# (used to be E0707 "no member").
[[case]]
name = "value_const_as_module_member"
files = [
    { path = "main.rue", source = """
const math = @import("math.rue");

fn main() -> i32 {
    math.ANSWER
}
""" },
    { path = "math.rue", source = """
pub const ANSWER: i32 = 42;
""" },
]
exit_code = 42

[[case]]
name = "same_named_value_consts_in_distinct_modules"
files = [
    { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    a.VALUE + b.VALUE
}
""" },
    { path = "a.rue", source = """
pub const VALUE: i32 = 1;
""" },
    { path = "b.rue", source = """
pub const VALUE: i32 = 2;
""" },
]
exit_code = 3

# Member access in const context: another const's initializer.
[[case]]
name = "member_const_in_const_initializer"
files = [
    { path = "main.rue", source = """
const math = @import("math.rue");
const COPY: i32 = math.ANSWER;

fn main() -> i32 {
    COPY + math.ANSWER
}
""" },
    { path = "math.rue", source = """
pub const ANSWER: i32 = 21;
""" },
]
exit_code = 42

# Member access as an OPERATOR OPERAND in a const initializer, not just as the
# whole initializer (RUE-267): `1 + m.ANSWER` used to be rejected (E0434)
# while `m.ANSWER` alone compiled. The comptime engine now reads the member's
# pre-resolved value, so it composes in any operand position.
[[case]]
name = "member_const_as_operator_operand"
files = [
    { path = "main.rue", source = """
const math = @import("math.rue");
const A: i32 = 1 + math.ANSWER;
const B: i32 = math.ANSWER * 2 - 4;

fn main() -> i32 {
    A + B
}
""" },
    { path = "math.rue", source = """
pub const ANSWER: i32 = 42;
""" },
]
exit_code = 123

# A private member used as an operator operand reports the privacy violation
# (E0706) rather than the generic "not supported in const context" (E0434),
# confirming the pre-resolution propagates the real error (RUE-267).
[[case]]
name = "private_member_as_operator_operand_rejected"
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");
const A: i32 = 1 + lib.SECRET;

fn main() -> i32 { A }
""" },
    { path = "sub/lib.rue", source = """
const SECRET: i32 = 99;
pub fn touch() -> i32 { SECRET }
""" },
]
compile_fail = true
error_contains = ["E0706", "SECRET", "private"]

# The member const's declared width survives the access: an i64 member used
# in arithmetic must be anchored to i64 by inference, not mis-defaulted.
[[case]]
name = "i64_member_const_keeps_width"
files = [
    { path = "main.rue", source = """
const cfg = @import("cfg.rue");

fn main() -> i32 {
    if cfg.BIG / 1000000000 == 5 { 9 } else { 1 }
}
""" },
    { path = "cfg.rue", source = """
pub const BIG: i64 = 5000000000;
""" },
]
exit_code = 9

# Module alias: `const math = std.math;` (the ADR-0026 nested-alias form,
# previously E0434), plus an alias of the alias.
[[case]]
name = "module_alias_of_std_submodule"
files = [{ path = "main.rue", source = """
const std = @import("std");
const math = std.math;
const m2 = math;

fn main() -> i32 {
    @dbg(math.abs(-5) + m2.abs(-2));
    0
}
""" }]
env = { RUE_STD_PATH = "${REAL_STD}" }
stdout = "7\n"

[[case]]
name = "module_scope_type_alias_from_std_type_constructor"
files = [{ path = "main.rue", source = """
const std = @import("std");
const OptI = std.option.Option(i64);

fn read_num() -> OptI {
    let n: i64 = 42;
    OptI.Some(n)
}

fn main() -> i32 {
    let _x: OptI = read_num();
    0
}
""" }]
env = { RUE_STD_PATH = "${REAL_STD}" }
exit_code = 0

# Module alias through local files: alias a re-export, then call through it.
[[case]]
name = "module_alias_of_local_reexport"
files = [
    { path = "main.rue", source = """
const outer = @import("outer");
const inner = outer.inner;

fn main() -> i32 {
    inner.value()
}
""" },
    { path = "outer/_outer.rue", source = """
pub const inner = @import("inner.rue");
""" },
    { path = "outer/inner.rue", source = """
pub fn value() -> i32 { 42 }
""" },
]
exit_code = 42

# pub const members are visible across directories...
[[case]]
name = "pub_member_const_across_directories"
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    lib.LIMIT
}
""" },
    { path = "sub/lib.rue", source = """
pub const LIMIT: i32 = 17;
""" },
]
exit_code = 17

# ...non-pub members are not (E0706), at a use site...
[[case]]
name = "private_member_const_rejected_at_use"
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");

fn main() -> i32 {
    lib.SECRET
}
""" },
    { path = "sub/lib.rue", source = """
const SECRET: i32 = 99;
pub fn touch() -> i32 { SECRET }
""" },
]
compile_fail = true
error_contains = ["E0706", "SECRET", "private"]

# ...and in const context.
[[case]]
name = "private_member_const_rejected_in_const_context"
files = [
    { path = "main.rue", source = """
const lib = @import("sub/lib.rue");
const S: i32 = lib.SECRET;

fn main() -> i32 { S }
""" },
    { path = "sub/lib.rue", source = """
const SECRET: i32 = 99;
pub fn touch() -> i32 { SECRET }
""" },
]
compile_fail = true
error_contains = ["E0706", "SECRET", "private"]

# Non-pub members ARE visible from the same directory (directory privacy).
[[case]]
name = "private_member_const_same_directory_ok"
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");

fn main() -> i32 {
    lib.SECRET
}
""" },
    { path = "lib.rue", source = """
const SECRET: i32 = 33;
pub fn touch() -> i32 { SECRET }
""" },
]
exit_code = 33

# Binding a FUNCTION member in a const creates a callable alias (RUE-173).
[[case]]
name = "fn_member_const_alias_call"
description = "A module-member function const creates a callable alias (spec 6.5:15), and calling the alias is equivalent to calling the function (spec 4.10:12)."
files = [
    { path = "main.rue", source = """
const abs_alias = @import("math.rue").abs;

fn main() -> i32 { abs_alias(0 - 42) }
""" },
    { path = "math.rue", source = """
pub fn abs(x: i32) -> i32 {
    if x < 0 { 0 - x } else { x }
}
""" },
]
exit_code = 42

# The same callable-alias machinery supports local function aliases.
[[case]]
name = "local_fn_const_alias_call"
description = "A local function const creates a callable alias (spec 6.5:15), and calling the alias is equivalent to calling the function (spec 4.10:12)."
files = [{ path = "main.rue", source = """
const f = answer;

fn answer() -> i32 { 42 }

fn main() -> i32 { f() }
""" }]
exit_code = 42

# Function-valued constants are callable aliases only, not first-class runtime
# values.
[[case]]
name = "fn_const_alias_not_runtime_value"
description = "Function-valued constants are callable aliases only, not first-class runtime values (spec 6.5:15)."
files = [{ path = "main.rue", source = """
const f = answer;

fn answer() -> i32 { 42 }

fn main() -> i32 {
    let x = f;
    0
}
""" }]
compile_fail = true
error_contains = ["E0434", "a function reference is not supported in const context"]

# An actually-unknown member is still E0707.
[[case]]
name = "unknown_member_still_e0707"
files = [
    { path = "main.rue", source = """
const math = @import("math.rue");
const X: i32 = math.NOPE;

fn main() -> i32 { 0 }
""" },
    { path = "math.rue", source = """
pub const ANSWER: i32 = 42;
""" },
]
compile_fail = true
error_contains = ["E0707", "has no member `NOPE`"]

# Member consts also resolve through a local `let` binding (and the binding
# counts as used — no spurious unused-variable warning).
[[case]]
name = "value_const_member_through_local_let"
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import("math.rue");
    @dbg(m.ANSWER);
    0
}
""" },
    { path = "math.rue", source = """
pub const ANSWER: i32 = 42;
""" },
]
stdout = "42\n"

# A module-qualified const in EVERY expression position, including the
# equality operand — which routes through sema's place-projection path
# (equality operands are borrows, 4.3:3f) and used to fail E0423 "field
# access on non-struct type '<module>'" because that path lacked the
# module-member fallback the value path has (RUE-632).
[[case]]
name = "module_const_in_equality_operand"
files = [
    { path = "main.rue", source = """
const h = @import("helper.rue");

fn take(v: i64) -> i64 { v }

fn main() -> i32 {
    let a = h.MAGIC;                             // let init
    let b = take(h.MAGIC);                       // call argument
    let c = h.MAGIC + 1;                         // arithmetic operand
    let d = if a == h.MAGIC { 1 } else { 0 };    // equality operand (RUE-632)
    let e = if h.MAGIC != 8 { 1 } else { 0 };    // inequality operand
    let f = if h.MAGIC < 8 { 1 } else { 0 };     // ordering operand
    @intCast(a + b + c + d + e + f + 17)
}
""" },
    { path = "helper.rue", source = """
pub const MAGIC: i64 = 7;
""" },
]
exit_code = 42
