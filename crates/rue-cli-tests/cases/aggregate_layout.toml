# Compact native physical layout through the real driver (ADR-0052, RUE-987
# stabilization). The canonical layout authority reports the ratified compact
# representation by default: natural scalar widths and alignments,
# declaration-order struct fields with interior/tail padding, ascending array
# stride, a smallest-sufficient enum tag, and the uniform zero-sized-type rule.
# The compile-time layout queries (@size_of / @align_of / @offset_of) observe
# those values; slot-identical aggregates (all eight-byte leaves) marshal
# correctly through memory; and narrow (one/two/four-byte) scalar access through
# typed pointers extends with the correct zero/sign extension, so narrow heap
# round-trips, compact struct field access, and heap arrays of narrow scalars
# compile and execute. The one construct without a single physical memory image
# — an enum whose per-variant payloads overlap (an overlapping variant union),
# or an aggregate containing one — is refused loudly rather than miscompiled.

[section]
id = "cli.aggregate_layout"
name = "Compact native layout (ADR-0052)"
description = "The compiler reports the compact physical layout in @size_of / @align_of / @offset_of by default; slot-identical aggregates still execute, and an imageless overlapping-union enum fails loudly."

# Scalars take their natural LP64 width and alignment under the compact layout.
[[case]]
name = "compact_scalar_sizes_and_alignments"
description = "Natural scalar widths/alignments (u8=1, i16=2, i32=4, i64=8, bool=1) by default."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @dbg(@size_of(u8) == 1);
    @dbg(@size_of(i16) == 2);
    @dbg(@size_of(i32) == 4);
    @dbg(@size_of(i64) == 8);
    @dbg(@size_of(bool) == 1);
    @dbg(@align_of(i32) == 4);
    @dbg(@align_of(u64) == 8);
    0
}
""" }]
stdout = "true\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\n"
exit_code = 0

# A struct is laid out in declaration order at naturally aligned offsets with
# interior and tail padding; size rounds up to the struct alignment.
[[case]]
name = "compact_struct_padding_and_offsets"
description = "Padded { a: u8, b: i32, c: u8 } -> a@0, b@4, c@8, size 12, align 4."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Padded { a: u8, b: i32, c: u8 }
fn main() -> i32 {
    @dbg(@offset_of(Padded, a) == 0);
    @dbg(@offset_of(Padded, b) == 4);
    @dbg(@offset_of(Padded, c) == 8);
    @dbg(@size_of(Padded) == 12);
    @dbg(@align_of(Padded) == 4);
    0
}
""" }]
stdout = "true\ntrue\ntrue\ntrue\ntrue\n"
exit_code = 0

# Arrays are ascending with stride equal to the compact element size.
[[case]]
name = "compact_array_stride"
description = "[i32; 3] has size 12; [u8; 4] has size 4 under the compact layout."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @dbg(@size_of([i32; 3]) == 12);
    @dbg(@size_of([u8; 4]) == 4);
    @dbg(@size_of([i64; 2]) == 16);
    0
}
""" }]
stdout = "true\ntrue\ntrue\n"
exit_code = 0

# Zero-sized types have size 0, alignment 1, stride 0 under the compact layout
# (the uniform rule, which includes zero-length arrays).
[[case]]
name = "compact_zero_sized_rules"
description = "unit and [i32; 0] are size 0 with alignment 1."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @dbg(@size_of(()) == 0);
    @dbg(@align_of(()) == 1);
    @dbg(@size_of([i32; 0]) == 0);
    @dbg(@align_of([i32; 0]) == 1);
    0
}
""" }]
stdout = "true\ntrue\ntrue\ntrue\n"
exit_code = 0

# A slot-identical aggregate (all eight-byte leaves) has an identical compact
# and slot layout, so field-pointer read/write through memory still executes
# correctly under the compact layout.
[[case]]
name = "compact_slot_identical_field_ptr_roundtrip"
description = "An all-i64 struct writes and reads a field through a pointer by default."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Cell { first: i64, second: i64 }
fn main() -> i32 {
    let mut c = Cell { first: 40, second: 2 };
    checked {
        let fp: ptr mut i64 = @field_ptr(c.second);
        @ptr_write(fp, 100);
    };
    @dbg(c.first);
    @dbg(c.second);
    @intCast(c.second)
}
""" }]
stdout = "40\n100\n"
exit_code = 100

# The compact layout queries are observed identically whether or not the field
# order forces padding; here an already-aligned all-i64 struct has no padding
# and its size/offsets match the slot model exactly.
[[case]]
name = "compact_slot_identical_offsets_match_slot_model"
description = "An all-i64 struct has offsets 0/8 and size 16 under the compact layout."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Cell { first: i64, second: i64 }
fn main() -> i32 {
    @dbg(@offset_of(Cell, first) == 0);
    @dbg(@offset_of(Cell, second) == 8);
    @dbg(@size_of(Cell) == 16);
    0
}
""" }]
stdout = "true\ntrue\ntrue\n"
exit_code = 0

# RUE-989: writing a narrow i32 field through a `@field_ptr` pointer now lowers
# and executes under the compact layout. The frame stores the field in an
# eight-byte slot; `@field_ptr` addresses that slot, and the narrow four-byte
# store hits its low bytes (little-endian), so the round-trip is correct.
[[case]]
name = "compact_struct_field_narrow_roundtrip"
description = "Writing a narrow i32 field through a pointer round-trips (RUE-989)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Pair { a: i32, b: i32 }
fn main() -> i32 {
    let mut p = Pair { a: 7, b: 9 };
    checked {
        let fp: ptr mut i32 = @field_ptr(p.b);
        @ptr_write(fp, 100);
    };
    @dbg(p.a);
    p.b
}
""" }]
stdout = "7\n"
exit_code = 100

# RUE-989: narrow scalar heap round-trips through @alloc/@ptr_write/@ptr_read
# for i32, i16 (signed, storing -1 and reading it back), u16 (zero-extended),
# and u8. The load extends the narrow physical value into its slot per the
# scalar's signedness.
[[case]]
name = "narrow_heap_roundtrip_scalars"
description = "i32/i16/u16/u8 heap round-trips with correct sign/zero extension (RUE-989)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    checked {
        let pi: ptr mut i32 = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(i32)), @intCast(@align_of(i32)))));
        @ptr_write(pi, 10);
        @dbg(@ptr_read(pi));
        @free(@int_to_ptr(@ptr_to_int(pi)), 1 * @intCast(@size_of(i32)), @intCast(@align_of(i32)));
        let ps: ptr mut i16 = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(i16)), @intCast(@align_of(i16)))));
        let neg: i16 = -1;
        @ptr_write(ps, neg);
        @dbg(@ptr_read(ps));
        @free(@int_to_ptr(@ptr_to_int(ps)), 1 * @intCast(@size_of(i16)), @intCast(@align_of(i16)));
        let pu: ptr mut u16 = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(u16)), @intCast(@align_of(u16)))));
        let big: u16 = 65535;
        @ptr_write(pu, big);
        @dbg(@ptr_read(pu));
        @free(@int_to_ptr(@ptr_to_int(pu)), 1 * @intCast(@size_of(u16)), @intCast(@align_of(u16)));
        let pb: ptr mut u8 = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(u8)), @intCast(@align_of(u8)))));
        let by: u8 = 200;
        @ptr_write(pb, by);
        @dbg(@ptr_read(pb));
        @free(@int_to_ptr(@ptr_to_int(pb)), 1 * @intCast(@size_of(u8)), @intCast(@align_of(u8)));
    };
    0
}
""" }]
stdout = "10\n-1\n65535\n200\n"
exit_code = 0

# RUE-989: heap arrays of narrow scalars walked with @ptr_offset at the compact
# stride (u8 stride 1, i16 stride 2, i32 stride 4), covering signed negatives.
[[case]]
name = "narrow_heap_array_walk"
description = "Walk heap [u8;4], [i16;3] (with negatives), [i32;3] at compact stride (RUE-989)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    checked {
        let pa: ptr mut u8 = @int_to_ptr(@ptr_to_int(@alloc(4 * @intCast(@size_of(u8)), @intCast(@align_of(u8)))));
        let v0: u8 = 10; let v1: u8 = 20; let v2: u8 = 30; let v3: u8 = 40;
        @ptr_write(@ptr_offset(pa, 0), v0);
        @ptr_write(@ptr_offset(pa, 1), v1);
        @ptr_write(@ptr_offset(pa, 2), v2);
        @ptr_write(@ptr_offset(pa, 3), v3);
        @dbg(@ptr_read(@ptr_offset(pa, 0)));
        @dbg(@ptr_read(@ptr_offset(pa, 3)));
        @free(@int_to_ptr(@ptr_to_int(pa)), 4 * @intCast(@size_of(u8)), @intCast(@align_of(u8)));
        let ph: ptr mut i16 = @int_to_ptr(@ptr_to_int(@alloc(3 * @intCast(@size_of(i16)), @intCast(@align_of(i16)))));
        let h0: i16 = -5; let h1: i16 = 6; let h2: i16 = -7;
        @ptr_write(@ptr_offset(ph, 0), h0);
        @ptr_write(@ptr_offset(ph, 1), h1);
        @ptr_write(@ptr_offset(ph, 2), h2);
        @dbg(@ptr_read(@ptr_offset(ph, 0)));
        @dbg(@ptr_read(@ptr_offset(ph, 2)));
        @free(@int_to_ptr(@ptr_to_int(ph)), 3 * @intCast(@size_of(i16)), @intCast(@align_of(i16)));
        let pw: ptr mut i32 = @int_to_ptr(@ptr_to_int(@alloc(3 * @intCast(@size_of(i32)), @intCast(@align_of(i32)))));
        @ptr_write(@ptr_offset(pw, 0), 100);
        @ptr_write(@ptr_offset(pw, 1), 200);
        @ptr_write(@ptr_offset(pw, 2), 300);
        @dbg(@ptr_read(@ptr_offset(pw, 2)));
        @free(@int_to_ptr(@ptr_to_int(pw)), 3 * @intCast(@size_of(i32)), @intCast(@align_of(i32)));
    };
    0
}
""" }]
stdout = "10\n40\n-5\n-7\n300\n"
exit_code = 0

# RUE-989: mixed struct { a: u8, b: i32, c: u8 } field round-trips through
# @field_ptr, each field written and read at its own narrow width.
[[case]]
name = "mixed_struct_field_roundtrip"
description = "Round-trip every field of { a: u8, b: i32, c: u8 } through narrow field pointers (RUE-989)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Mixed { a: u8, b: i32, c: u8 }
fn main() -> i32 {
    let mut m = Mixed { a: 1, b: 2, c: 3 };
    checked {
        let pa: ptr mut u8 = @field_ptr(m.a);
        let av: u8 = 250;
        @ptr_write(pa, av);
        let pb: ptr mut i32 = @field_ptr(m.b);
        @ptr_write(pb, -12345);
        let pc: ptr mut u8 = @field_ptr(m.c);
        let cv: u8 = 99;
        @ptr_write(pc, cv);
    };
    @dbg(m.a);
    @dbg(m.b);
    @dbg(m.c);
    0
}
""" }]
stdout = "250\n-12345\n99\n"
exit_code = 0

# ADR-0052 phase 5.10 (RUE-987): a whole compact (non-slot-identical) struct with
# a variant-independent memory image marshals through a typed pointer as a single
# value. `@ptr_write` stores each field truncated to its physical width at its
# compact byte offset (zeroing padding first, RUE-1007), and `@ptr_read` reloads
# each field extended from its physical width — reusing the RUE-1000 enum-image
# slot machinery. A padded { a: u8, b: i32, c: u8 } (size 12) round-trips through
# a heap pointer.
[[case]]
name = "compact_struct_through_pointer_roundtrip"
description = "A whole compact struct round-trips through a typed heap pointer via its compact memory image (RUE-987)."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Padded { a: u8, b: i32, c: u8 }
fn main() -> i32 {
    let r = checked {
        let p: ptr mut Padded = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(Padded)), @intCast(@align_of(Padded)))));
        @ptr_write(p, Padded { a: 7, b: 100000, c: 9 });
        let q = @ptr_read(p);
        @free(@int_to_ptr(@ptr_to_int(p)), 1 * @intCast(@size_of(Padded)), @intCast(@align_of(Padded)));
        q
    };
    let ra: i32 = @intCast(r.a);
    let rc: i32 = @intCast(r.c);
    @dbg(ra);
    @dbg(r.b);
    @dbg(rc);
    0
}
""" }]
stdout = "7\n100000\n9\n"
exit_code = 0

# A struct WITHOUT a variant-independent compact memory image — here one whose
# field is a fixed array, whose compact stride differs from the slot stride — is
# still refused loudly through a pointer rather than silently miscompiled. The
# RUE-987 image path admits a struct only when every leaf flattens to a scalar
# position (no array, no imageless enum).
[[case]]
name = "array_bearing_struct_through_pointer_roundtrip"
description = "A struct containing a fixed array marshals whole through a pointer: the array field flattens into the compact image at the compact element stride (RUE-1014)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct HasArr { xs: [i32; 2] }
fn main() -> i32 {
    let r = checked {
        let p: ptr mut HasArr = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(HasArr)), @intCast(@align_of(HasArr)))));
        @ptr_write(p, HasArr { xs: [10, 20] });
        let v = @ptr_read(p);
        @free(@int_to_ptr(@ptr_to_int(p)), 1 * @intCast(@size_of(HasArr)), @intCast(@align_of(HasArr)));
        v.xs[0] + v.xs[1]
    };
    @dbg(r);
    0
}
""" }]
stdout = "30\n"
exit_code = 0

# ADR-0052 phase 5.6 (RUE-1000): compact enum memory. A compact enum has a
# smallest-sufficient unsigned tag at offset 0 and its payload placed at the
# maximum variant alignment. A discriminant-only enum narrows to just its tag,
# so @size_of reflects the u8 tag (1) rather than the eight-byte slot.
[[case]]
name = "compact_enum_tag_narrows_size"
description = "A discriminant-only enum is one byte (u8 tag); a payload enum sizes tag + max-aligned payload."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Flag { Off, On }
enum Opt { Some(i32), None }
enum Num { B(u8), W(i32), Big(i64) }
fn main() -> i32 {
    @dbg(@size_of(Flag) == 1);
    @dbg(@size_of(Opt) == 8);
    @dbg(@size_of(Num) == 16);
    @dbg(@align_of(Num) == 8);
    0
}
""" }]
stdout = "true\ntrue\ntrue\ntrue\n"
exit_code = 0

# RUE-1000: a frame-resident enum keeps its slot-based value decomposition
# (discriminant slot + payload slots) untouched by the compact layout, so
# constructing and matching an enum that never reaches physical memory now
# compiles and runs under the preview (RUE-989 refused every enum value).
[[case]]
name = "compact_enum_frame_match_allowed"
description = "A frame-only enum construct-and-match compiles and runs (RUE-1000)."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Color { Red, Green, Blue }
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    let c = Color.Green;
    let base = match c { Color.Red => 1, Color.Green => 2, Color.Blue => 3, };
    let s = Shape.Rect(3, 4);
    let area = match s { Shape.Circle(r) => r, Shape.Rect(w, h) => w + h, Shape.Empty => 0, };
    base + area
}
""" }]
exit_code = 9

# RUE-1000: an Option-like enum round-trips through heap memory. The tag is
# written narrow at offset 0 and read back zero-extended; the i32 payload lives
# at the compact payload offset. Some(42) reads back 42; None matches None.
[[case]]
name = "compact_enum_option_heap_roundtrip"
description = "An Option-like enum write/read/match round-trips through heap memory (RUE-1000)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Opt { Some(i32), None }
fn main() -> i32 {
    checked {
        let p: ptr mut Opt = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(Opt)), @intCast(@align_of(Opt)))));
        @ptr_write(p, Opt.Some(42));
        let some = @ptr_read(p);
        match some { Opt.Some(x) => @dbg(x), Opt.None => @dbg(-1), };
        @ptr_write(p, Opt.None);
        let none = @ptr_read(p);
        match none { Opt.Some(x) => @dbg(x), Opt.None => @dbg(-1), };
        @free(@int_to_ptr(@ptr_to_int(p)), 1 * @intCast(@size_of(Opt)), @intCast(@align_of(Opt)));
    };
    0
}
""" }]
stdout = "42\n-1\n"
exit_code = 0

# RUE-1000: an enum whose variants carry payloads of mixed widths (u8/i32/i64)
# round-trips through heap memory. Every variant's single field shares the same
# payload position; the union slot writes/reads the widest width (8 bytes) and
# the narrower values are clean in their slot, so each variant round-trips.
[[case]]
name = "compact_enum_mixed_payload_widths"
description = "An enum with u8/i32/i64 payload variants round-trips each through heap memory (RUE-1000)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Num { B(u8), W(i32), Big(i64) }
fn main() -> i32 {
    checked {
        let p: ptr mut Num = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(Num)), @intCast(@align_of(Num)))));
        @ptr_write(p, Num.B(200));
        let a = @ptr_read(p);
        match a { Num.B(x) => @dbg(x), Num.W(y) => @dbg(y), Num.Big(z) => { let zi: i64 = z; @dbg(zi); }, };
        @ptr_write(p, Num.W(-12345));
        let b = @ptr_read(p);
        match b { Num.B(x) => @dbg(x), Num.W(y) => @dbg(y), Num.Big(z) => { let zi: i64 = z; @dbg(zi); }, };
        @ptr_write(p, Num.Big(9000000000));
        let c = @ptr_read(p);
        match c { Num.B(x) => @dbg(x), Num.W(y) => @dbg(y), Num.Big(z) => { let zi: i64 = z; @dbg(zi); }, };
        @free(@int_to_ptr(@ptr_to_int(p)), 1 * @intCast(@size_of(Num)), @intCast(@align_of(Num)));
    };
    0
}
""" }]
stdout = "200\n-12345\n9000000000\n"
exit_code = 0

# RUE-1000: an enum whose variants carry uniform multi-field payloads
# (Rect(i32,i32)) round-trips through heap memory: both payload slots occupy
# distinct, non-overlapping compact positions (payload_offset and +4).
[[case]]
name = "compact_enum_uniform_multifield_heap"
description = "A multi-field payload enum (Rect(i32,i32)) round-trips through heap memory (RUE-1000)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    checked {
        let p: ptr mut Shape = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(Shape)), @intCast(@align_of(Shape)))));
        @ptr_write(p, Shape.Rect(3, 4));
        let r = @ptr_read(p);
        match r { Shape.Circle(a) => @dbg(a), Shape.Rect(w, h) => @dbg(w + h), Shape.Empty => @dbg(0), };
        @ptr_write(p, Shape.Circle(9));
        let c = @ptr_read(p);
        match c { Shape.Circle(a) => @dbg(a), Shape.Rect(w, h) => @dbg(w + h), Shape.Empty => @dbg(0), };
        @free(@int_to_ptr(@ptr_to_int(p)), 1 * @intCast(@size_of(Shape)), @intCast(@align_of(Shape)));
    };
    0
}
""" }]
stdout = "7\n9\n"
exit_code = 0

# RUE-1007 (ADR-0052 phase 5.9, ruling 5): deterministic zero on construction.
# Wherever a compact image is materialized, its padding bytes are zeroed before
# the field stores. `Wide { A(u8, i32), B }` has a u8 tag @0, payload @4 (i32
# alignment), a u8 field @4 and an i32 field @8, size 12 => padding [1,4) (the
# tag-to-payload gap) and [5,8) (after the u8 field). Poisoning every byte to
# 0xFF first, an `@ptr_write` must leave those padding bytes deterministically
# zero, and re-poisoning then writing a different variant must leave no residue.
[[case]]
name = "compact_enum_padding_is_deterministically_zeroed"
description = "An enum heap image zeros its tag-to-payload and inter-field padding on @ptr_write, with no residue across an overwrite (RUE-1007)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Wide { A(u8, i32), B }
fn main() -> i32 {
    checked {
        let ep: ptr mut Wide = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(Wide)), @intCast(@align_of(Wide)))));
        let addr: u64 = @ptr_to_int(ep);
        let bp: ptr mut u8 = @int_to_ptr(addr);
        // Poison every byte so any un-zeroed padding would be observable.
        @ptr_write(@ptr_offset(bp, 0), 255);
        @ptr_write(@ptr_offset(bp, 1), 255);
        @ptr_write(@ptr_offset(bp, 2), 255);
        @ptr_write(@ptr_offset(bp, 3), 255);
        @ptr_write(@ptr_offset(bp, 4), 255);
        @ptr_write(@ptr_offset(bp, 5), 255);
        @ptr_write(@ptr_offset(bp, 6), 255);
        @ptr_write(@ptr_offset(bp, 7), 255);
        @ptr_write(ep, Wide.A(7, 16909060));
        // Padding bytes must be deterministically zero.
        let probe1: u8 = @ptr_read(@ptr_offset(bp, 1));
        if probe1 != 0 { return 1; }
        let probe2: u8 = @ptr_read(@ptr_offset(bp, 2));
        if probe2 != 0 { return 2; }
        let probe3: u8 = @ptr_read(@ptr_offset(bp, 3));
        if probe3 != 0 { return 3; }
        let probe4: u8 = @ptr_read(@ptr_offset(bp, 5));
        if probe4 != 0 { return 4; }
        let probe5: u8 = @ptr_read(@ptr_offset(bp, 6));
        if probe5 != 0 { return 5; }
        let probe6: u8 = @ptr_read(@ptr_offset(bp, 7));
        if probe6 != 0 { return 6; }
        // Fields survive the zeroing.
        let a = @ptr_read(ep);
        match a { Wide.A(b, w) => { if b != 7 { return 7; } if w != 16909060 { return 8; } }, Wide.B => { return 9; }, };
        // Overwrite: re-poison the padding, then write a different variant. No
        // residue of the poison (or of A) may remain in B's unused bytes.
        @ptr_write(@ptr_offset(bp, 1), 255);
        @ptr_write(@ptr_offset(bp, 2), 255);
        @ptr_write(@ptr_offset(bp, 3), 255);
        @ptr_write(@ptr_offset(bp, 5), 255);
        @ptr_write(@ptr_offset(bp, 6), 255);
        @ptr_write(@ptr_offset(bp, 7), 255);
        @ptr_write(ep, Wide.B);
        let probe7: u8 = @ptr_read(@ptr_offset(bp, 1));
        if probe7 != 0 { return 10; }
        let probe8: u8 = @ptr_read(@ptr_offset(bp, 2));
        if probe8 != 0 { return 11; }
