# Compact native physical layout through the real driver (ADR-0052, RUE-974 +
# RUE-989). With `--preview aggregate_layout` the canonical layout authority
# reports the ratified compact representation: natural scalar widths and
# alignments, declaration-order struct fields with interior/tail padding,
# ascending array stride, a smallest-sufficient enum tag, and the uniform
# zero-sized-type rule. The compile-time layout queries (@size_of / @align_of /
# @offset_of) observe those values; slot-identical aggregates (all eight-byte
# leaves) marshal correctly through memory; and RUE-989 lowers narrow
# (one/two/four-byte) scalar access through typed pointers with the correct
# zero/sign extension, so narrow heap round-trips, compact struct field access,
# and heap arrays of narrow scalars compile and execute. A program that would
# still need unimplemented whole-aggregate marshalling through a pointer or
# across a call (or compact enum memory) fails loudly rather than emitting
# slot-shaped access against a compact layout. Without the flag every case below
# observes today's eight-byte slot model unchanged.

[section]
id = "cli.aggregate_layout"
name = "Compact native layout (ADR-0052 phase 3)"
description = "The aggregate_layout preview reports the compact physical layout in @size_of / @align_of / @offset_of; slot-identical aggregates still execute, and narrow physical access fails loudly."

# Scalars take their natural LP64 width and alignment under the compact layout.
[[case]]
name = "compact_scalar_sizes_and_alignments"
description = "Natural scalar widths/alignments (u8=1, i16=2, i32=4, i64=8, bool=1) under --preview aggregate_layout."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @dbg(@size_of(u8) == 1);
    @dbg(@size_of(i16) == 2);
    @dbg(@size_of(i32) == 4);
    @dbg(@size_of(i64) == 8);
    @dbg(@size_of(bool) == 1);
    @dbg(@align_of(i32) == 4);
    @dbg(@align_of(u64) == 8);
    0
}
""" }]
stdout = "true\ntrue\ntrue\ntrue\ntrue\ntrue\ntrue\n"
exit_code = 0

# A struct is laid out in declaration order at naturally aligned offsets with
# interior and tail padding; size rounds up to the struct alignment.
[[case]]
name = "compact_struct_padding_and_offsets"
description = "Padded { a: u8, b: i32, c: u8 } -> a@0, b@4, c@8, size 12, align 4."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Padded { a: u8, b: i32, c: u8 }
fn main() -> i32 {
    @dbg(@offset_of(Padded, a) == 0);
    @dbg(@offset_of(Padded, b) == 4);
    @dbg(@offset_of(Padded, c) == 8);
    @dbg(@size_of(Padded) == 12);
    @dbg(@align_of(Padded) == 4);
    0
}
""" }]
stdout = "true\ntrue\ntrue\ntrue\ntrue\n"
exit_code = 0

# Arrays are ascending with stride equal to the compact element size.
[[case]]
name = "compact_array_stride"
description = "[i32; 3] has size 12; [u8; 4] has size 4 under the compact layout."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @dbg(@size_of([i32; 3]) == 12);
    @dbg(@size_of([u8; 4]) == 4);
    @dbg(@size_of([i64; 2]) == 16);
    0
}
""" }]
stdout = "true\ntrue\ntrue\n"
exit_code = 0

# Zero-sized types have size 0, alignment 1, stride 0 under the compact layout
# (the uniform rule, which includes zero-length arrays).
[[case]]
name = "compact_zero_sized_rules"
description = "unit and [i32; 0] are size 0 with alignment 1."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @dbg(@size_of(()) == 0);
    @dbg(@align_of(()) == 1);
    @dbg(@size_of([i32; 0]) == 0);
    @dbg(@align_of([i32; 0]) == 1);
    0
}
""" }]
stdout = "true\ntrue\ntrue\ntrue\n"
exit_code = 0

# A slot-identical aggregate (all eight-byte leaves) has an identical compact
# and slot layout, so field-pointer read/write through memory still executes
# correctly under the compact layout.
[[case]]
name = "compact_slot_identical_field_ptr_roundtrip"
description = "An all-i64 struct writes and reads a field through a pointer under --preview aggregate_layout."
differential_opt = true
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Cell { first: i64, second: i64 }
fn main() -> i32 {
    let mut c = Cell { first: 40, second: 2 };
    checked {
        let fp: ptr mut i64 = @field_ptr(c.second);
        @ptr_write(fp, 100);
    };
    @dbg(c.first);
    @dbg(c.second);
    @intCast(c.second)
}
""" }]
stdout = "40\n100\n"
exit_code = 100

# The compact layout queries are observed identically whether or not the field
# order forces padding; here an already-aligned all-i64 struct has no padding
# and its size/offsets match the slot model exactly.
[[case]]
name = "compact_slot_identical_offsets_match_slot_model"
description = "An all-i64 struct has offsets 0/8 and size 16 under the compact layout."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Cell { first: i64, second: i64 }
fn main() -> i32 {
    @dbg(@offset_of(Cell, first) == 0);
    @dbg(@offset_of(Cell, second) == 8);
    @dbg(@size_of(Cell) == 16);
    0
}
""" }]
stdout = "true\ntrue\ntrue\n"
exit_code = 0

# RUE-989: writing a narrow i32 field through a `@field_ptr` pointer now lowers
# and executes under the compact layout. The frame stores the field in an
# eight-byte slot; `@field_ptr` addresses that slot, and the narrow four-byte
# store hits its low bytes (little-endian), so the round-trip is correct.
[[case]]
name = "compact_struct_field_narrow_roundtrip"
description = "Writing a narrow i32 field through a pointer round-trips under --preview aggregate_layout (RUE-989)."
differential_opt = true
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Pair { a: i32, b: i32 }
fn main() -> i32 {
    let mut p = Pair { a: 7, b: 9 };
    checked {
        let fp: ptr mut i32 = @field_ptr(p.b);
        @ptr_write(fp, 100);
    };
    @dbg(p.a);
    p.b
}
""" }]
stdout = "7\n"
exit_code = 100

# The same narrow-field program also compiles and runs under the default slot
# model when the preview is off (byte-identical gate-off behavior).
[[case]]
name = "narrow_program_unchanged_without_the_preview"
description = "The narrow-field program compiles and runs under the default slot model when the preview is off."
files = [{ path = "main.rue", source = """
struct Pair { a: i32, b: i32 }
fn main() -> i32 {
    let mut p = Pair { a: 7, b: 9 };
    checked {
        let fp: ptr mut i32 = @field_ptr(p.b);
        @ptr_write(fp, 100);
    };
    p.b
}
""" }]
exit_code = 100

# RUE-989: narrow scalar heap round-trips through @alloc/@ptr_write/@ptr_read
# for i32, i16 (signed, storing -1 and reading it back), u16 (zero-extended),
# and u8. The load extends the narrow physical value into its slot per the
# scalar's signedness.
[[case]]
name = "narrow_heap_roundtrip_scalars"
description = "i32/i16/u16/u8 heap round-trips with correct sign/zero extension under --preview aggregate_layout (RUE-989)."
differential_opt = true
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    checked {
        let pi: ptr mut i32 = @alloc(1);
        @ptr_write(pi, 10);
        @dbg(@ptr_read(pi));
        @free(pi, 1);
        let ps: ptr mut i16 = @alloc(1);
        let neg: i16 = -1;
        @ptr_write(ps, neg);
        @dbg(@ptr_read(ps));
        @free(ps, 1);
        let pu: ptr mut u16 = @alloc(1);
        let big: u16 = 65535;
        @ptr_write(pu, big);
        @dbg(@ptr_read(pu));
        @free(pu, 1);
        let pb: ptr mut u8 = @alloc(1);
        let by: u8 = 200;
        @ptr_write(pb, by);
        @dbg(@ptr_read(pb));
        @free(pb, 1);
    };
    0
}
""" }]
stdout = "10\n-1\n65535\n200\n"
exit_code = 0

# RUE-989: heap arrays of narrow scalars walked with @ptr_offset at the compact
# stride (u8 stride 1, i16 stride 2, i32 stride 4), covering signed negatives.
[[case]]
name = "narrow_heap_array_walk"
description = "Walk heap [u8;4], [i16;3] (with negatives), [i32;3] at compact stride under --preview aggregate_layout (RUE-989)."
differential_opt = true
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    checked {
        let pa: ptr mut u8 = @alloc(4);
        let v0: u8 = 10; let v1: u8 = 20; let v2: u8 = 30; let v3: u8 = 40;
        @ptr_write(@ptr_offset(pa, 0), v0);
        @ptr_write(@ptr_offset(pa, 1), v1);
        @ptr_write(@ptr_offset(pa, 2), v2);
        @ptr_write(@ptr_offset(pa, 3), v3);
        @dbg(@ptr_read(@ptr_offset(pa, 0)));
        @dbg(@ptr_read(@ptr_offset(pa, 3)));
        @free(pa, 4);
        let ph: ptr mut i16 = @alloc(3);
        let h0: i16 = -5; let h1: i16 = 6; let h2: i16 = -7;
        @ptr_write(@ptr_offset(ph, 0), h0);
        @ptr_write(@ptr_offset(ph, 1), h1);
        @ptr_write(@ptr_offset(ph, 2), h2);
        @dbg(@ptr_read(@ptr_offset(ph, 0)));
        @dbg(@ptr_read(@ptr_offset(ph, 2)));
        @free(ph, 3);
        let pw: ptr mut i32 = @alloc(3);
        @ptr_write(@ptr_offset(pw, 0), 100);
        @ptr_write(@ptr_offset(pw, 1), 200);
        @ptr_write(@ptr_offset(pw, 2), 300);
        @dbg(@ptr_read(@ptr_offset(pw, 2)));
        @free(pw, 3);
    };
    0
}
""" }]
stdout = "10\n40\n-5\n-7\n300\n"
exit_code = 0

# RUE-989: mixed struct { a: u8, b: i32, c: u8 } field round-trips through
# @field_ptr, each field written and read at its own narrow width.
[[case]]
name = "mixed_struct_field_roundtrip"
description = "Round-trip every field of { a: u8, b: i32, c: u8 } through narrow field pointers (RUE-989)."
differential_opt = true
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Mixed { a: u8, b: i32, c: u8 }
fn main() -> i32 {
    let mut m = Mixed { a: 1, b: 2, c: 3 };
    checked {
        let pa: ptr mut u8 = @field_ptr(m.a);
        let av: u8 = 250;
        @ptr_write(pa, av);
        let pb: ptr mut i32 = @field_ptr(m.b);
        @ptr_write(pb, -12345);
        let pc: ptr mut u8 = @field_ptr(m.c);
        let cv: u8 = 99;
        @ptr_write(pc, cv);
    };
    @dbg(m.a);
    @dbg(m.b);
    @dbg(m.c);
    0
}
""" }]
stdout = "250\n-12345\n99\n"
exit_code = 0

# A whole non-slot-identical aggregate marshalled through a pointer as a single
# value is still refused loudly: that marshalling (and the frame-versus-heap
# pointer provenance it depends on) is unimplemented. RUE-989 lifts the refusal
# only for narrow SCALAR access.
[[case]]
name = "narrow_aggregate_through_pointer_still_fails"
description = "Writing a whole narrow struct through a pointer is still refused, not silently miscompiled."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Pair { a: i32, b: i32 }
fn main() -> i32 {
    checked {
        let p: ptr mut Pair = @alloc(1);
        @ptr_write(p, Pair { a: 1, b: 2 });
    };
    0
}
""" }]
compile_fail = true
error_contains = ["aggregate_layout", "not yet implemented"]

# ADR-0052 phase 5.6 (RUE-1000): compact enum memory. A compact enum has a
# smallest-sufficient unsigned tag at offset 0 and its payload placed at the
# maximum variant alignment. A discriminant-only enum narrows to just its tag,
# so @size_of reflects the u8 tag (1) rather than the eight-byte slot.
[[case]]
name = "compact_enum_tag_narrows_size"
description = "A discriminant-only enum is one byte (u8 tag) under --preview aggregate_layout; a payload enum sizes tag + max-aligned payload."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Flag { Off, On }
enum Opt { Some(i32), None }
enum Num { B(u8), W(i32), Big(i64) }
fn main() -> i32 {
    @dbg(@size_of(Flag) == 1);
    @dbg(@size_of(Opt) == 8);
    @dbg(@size_of(Num) == 16);
    @dbg(@align_of(Num) == 8);
    0
}
""" }]
stdout = "true\ntrue\ntrue\ntrue\n"
exit_code = 0

# RUE-1000: a frame-resident enum keeps its slot-based value decomposition
# (discriminant slot + payload slots) untouched by the compact layout, so
# constructing and matching an enum that never reaches physical memory now
# compiles and runs under the preview (RUE-989 refused every enum value).
[[case]]
name = "compact_enum_frame_match_allowed"
description = "A frame-only enum construct-and-match compiles and runs under --preview aggregate_layout (RUE-1000)."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Color { Red, Green, Blue }
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    let c = Color.Green;
    let base = match c { Color.Red => 1, Color.Green => 2, Color.Blue => 3, };
    let s = Shape.Rect(3, 4);
    let area = match s { Shape.Circle(r) => r, Shape.Rect(w, h) => w + h, Shape.Empty => 0, };
    base + area
}
""" }]
exit_code = 9

# RUE-1000: an Option-like enum round-trips through heap memory. The tag is
# written narrow at offset 0 and read back zero-extended; the i32 payload lives
# at the compact payload offset. Some(42) reads back 42; None matches None.
[[case]]
name = "compact_enum_option_heap_roundtrip"
description = "An Option-like enum write/read/match round-trips through heap memory under --preview aggregate_layout (RUE-1000)."
differential_opt = true
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Opt { Some(i32), None }
fn main() -> i32 {
    checked {
        let p: ptr mut Opt = @alloc(1);
        @ptr_write(p, Opt.Some(42));
        let some = @ptr_read(p);
        match some { Opt.Some(x) => @dbg(x), Opt.None => @dbg(-1), };
        @ptr_write(p, Opt.None);
        let none = @ptr_read(p);
        match none { Opt.Some(x) => @dbg(x), Opt.None => @dbg(-1), };
        @free(p, 1);
    };
    0
}
""" }]
stdout = "42\n-1\n"
exit_code = 0

# RUE-1000: an enum whose variants carry payloads of mixed widths (u8/i32/i64)
# round-trips through heap memory. Every variant's single field shares the same
# payload position; the union slot writes/reads the widest width (8 bytes) and
# the narrower values are clean in their slot, so each variant round-trips.
[[case]]
name = "compact_enum_mixed_payload_widths"
description = "An enum with u8/i32/i64 payload variants round-trips each through heap memory under --preview aggregate_layout (RUE-1000)."
differential_opt = true
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Num { B(u8), W(i32), Big(i64) }
fn main() -> i32 {
    checked {
        let p: ptr mut Num = @alloc(1);
        @ptr_write(p, Num.B(200));
        let a = @ptr_read(p);
        match a { Num.B(x) => @dbg(x), Num.W(y) => @dbg(y), Num.Big(z) => { let zi: i64 = z; @dbg(zi); }, };
        @ptr_write(p, Num.W(-12345));
        let b = @ptr_read(p);
        match b { Num.B(x) => @dbg(x), Num.W(y) => @dbg(y), Num.Big(z) => { let zi: i64 = z; @dbg(zi); }, };
        @ptr_write(p, Num.Big(9000000000));
        let c = @ptr_read(p);
        match c { Num.B(x) => @dbg(x), Num.W(y) => @dbg(y), Num.Big(z) => { let zi: i64 = z; @dbg(zi); }, };
        @free(p, 1);
    };
    0
}
""" }]
stdout = "200\n-12345\n9000000000\n"
exit_code = 0

# RUE-1000: an enum whose variants carry uniform multi-field payloads
# (Rect(i32,i32)) round-trips through heap memory: both payload slots occupy
# distinct, non-overlapping compact positions (payload_offset and +4).
[[case]]
name = "compact_enum_uniform_multifield_heap"
description = "A multi-field payload enum (Rect(i32,i32)) round-trips through heap memory under --preview aggregate_layout (RUE-1000)."
differential_opt = true
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Shape { Circle(i32), Rect(i32, i32), Empty }
fn main() -> i32 {
    checked {
        let p: ptr mut Shape = @alloc(1);
        @ptr_write(p, Shape.Rect(3, 4));
        let r = @ptr_read(p);
        match r { Shape.Circle(a) => @dbg(a), Shape.Rect(w, h) => @dbg(w + h), Shape.Empty => @dbg(0), };
        @ptr_write(p, Shape.Circle(9));
        let c = @ptr_read(p);
        match c { Shape.Circle(a) => @dbg(a), Shape.Rect(w, h) => @dbg(w + h), Shape.Empty => @dbg(0), };
        @free(p, 1);
    };
    0
}
""" }]
stdout = "7\n9\n"
exit_code = 0

# RUE-1000 keeps refusing enums whose compact memory image is variant-dependent:
# A(i64) and B(i32,i32) would need overlapping union slots (the i64 field spans
# both i32 positions), so there is no single slot->byte map. Refused loudly.
[[case]]
name = "compact_enum_overlapping_union_still_fails"
description = "An enum whose union payload slots overlap (i64 vs two i32) has no variant-independent memory image and is refused."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Bad { A(i64), B(i32, i32) }
fn main() -> i32 {
    checked {
        let p: ptr mut Bad = @alloc(1);
        @ptr_write(p, Bad.A(5));
    };
    0
}
""" }]
compile_fail = true
error_contains = ["aggregate_layout", "not yet implemented"]

# RUE-1000 keeps refusing a nested-aggregate enum payload through a pointer:
# a struct payload has no single-slot scalar memory image in this phase.
[[case]]
name = "compact_enum_struct_payload_still_fails"
description = "An enum with a struct payload marshalled through a pointer is still refused under --preview aggregate_layout."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Res { id: i32 }
enum Holder { Full(Res), Nothing }
fn main() -> i32 {
    checked {
        let p: ptr mut Holder = @alloc(1);
        @ptr_write(p, Holder.Full(Res { id: 7 }));
    };
    0
}
""" }]
compile_fail = true
error_contains = ["aggregate_layout", "not yet implemented"]

# RUE-1000 keeps refusing a compact enum crossing a CALL boundary by value:
# the preserved slot call convention cannot express it and the indirect
# marshalling is the next phase (RUE-976's transitional indirect rule).
[[case]]
name = "compact_enum_crossing_call_still_fails"
description = "A compact enum passed by value across a call is still refused under --preview aggregate_layout (call marshalling is the next phase)."
args = ["main.rue", "--preview", "aggregate_layout", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Opt { Some(i32), None }
fn unwrap(o: Opt) -> i32 {
    match o { Opt.Some(x) => x, Opt.None => 0, }
}
fn main() -> i32 {
    unwrap(Opt.Some(5))
}
""" }]
compile_fail = true
error_contains = ["aggregate_layout", "not yet implemented"]
