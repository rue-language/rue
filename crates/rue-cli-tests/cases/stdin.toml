# Programs that read stdin: the @read_line / @parse_i32 loop.
#
# Since RUE-6 (ADR-0038) these intrinsics are fallible-by-Option, not
# trapping: @read_line returns Option(StrBuf) (None at EOF) and @parse_* return
# Option(int) (None on bad input).
#
# Fallible intrinsics yield the exact trusted std Option in every context.
# Contextual annotations check that identity; user-defined Option lookalikes
# are rejected as non-matching.

[section]
id = "cli.stdin"
name = "Standard input interaction"
description = "Piping input to compiled programs; recoverable Option-based read/parse."

# Fallible intrinsics yield the exact trusted std Option; contextual type
# checks validate this identity.
[[case]]
name = "read_and_echo_number"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let OptStr = std.option.Option(StrBuf);
    let OptInt = std.option.Option(i32);
    let line: OptStr = @read_line();
    match line {
        OptStr.Some(text) => {
            match @parse_i32(text) {
                OptInt.Some(n) => { @dbg(n); },
                OptInt.None => {},
            }
        },
        OptStr.None => {},
    }
    0
}
""" },
]
stdin = "42\n"
stdout = "42\n"

# Fallible intrinsics yield the exact trusted std Option; contextual type
# checks validate this identity.
[[case]]
name = "guessing_loop_scripted"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let OptStr = std.option.Option(StrBuf);
    let OptInt = std.option.Option(i32);
    let secret = 73;
    loop {
        let line: OptStr = @read_line();
        match line {
            OptStr.None => break,
            OptStr.Some(text) => {
                match @parse_i32(text) {
                    OptInt.Some(guess) => {
                        if guess < secret {
                            @dbg("Too low!");
                        } else if guess > secret {
                            @dbg("Too high!");
                        } else {
                            @dbg("You got it!");
                            break;
                        }
                    },
                    OptInt.None => {},
                }
            },
        }
    }
    0
}
""" },
]
stdin = "50\n90\n73\n"
stdout = """
Too low!
Too high!
You got it!
"""

# RUE-1172: a single chunked stdin read can contain several logical lines.
# Every byte after a newline must remain available to the next @read_line call.
[[case]]
name = "read_line_preserves_buffered_consecutive_lines"
description = "Consecutive read_line calls consume retained bytes after each newline and reach None at EOF."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
const OptStr = std.option.Option(StrBuf);
const OptInt = std.option.Option(i32);

fn read_num() -> i32 {
    let line: OptStr = @read_line();
    match line {
        OptStr.Some(text) => {
            match @parse_i32(text) {
                OptInt.Some(value) => value,
                OptInt.None => -100,
            }
        },
        OptStr.None => -200,
    }
}

fn main() -> i32 {
    let first = read_num();
    let second = read_num();
    let third = read_num();
    let eof = read_num();
    if first == 11 && second == 22 && third == 33 && eof == -200 {
        0
    } else {
        1
    }
}
""" },
]
stdin = "11\n22\n33\n"
exit_code = 0

# RUE-1172: the first newline lands at the end of a full stdin chunk. The next
# line is already available to a subsequent @read_line call.
[[case]]
name = "read_line_chunk_boundary_newline"
description = "A long line ending at the retained-buffer boundary does not lose the following line."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
const OptStr = std.option.Option(StrBuf);

fn read_len() -> i32 {
    let line: OptStr = @read_line();
    match line {
        OptStr.Some(text) => @intCast(text.len()),
        OptStr.None => -1,
    }
}

fn main() -> i32 {
    let first = read_len();
    let second = read_len();
    let eof = read_len();
    if first == 4095 && second == 1 && eof == -1 { 0 } else { 1 }
}
""" },
]
stdin = "\nz\n"
exit_code = 0


# Recoverable error model (RUE-6, ADR-0038). Before error handling landed these
# two cases trapped with exit 101 ("parse error" / "unexpected end of input").
# Now a bad parse is `None` and EOF is `None` — the program chooses what to do.

# Fallible intrinsics yield the exact trusted std Option; contextual type
# checks validate this identity.
[[case]]
name = "parse_error_yields_none"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let OptStr = std.option.Option(StrBuf);
    let OptInt = std.option.Option(i32);
    let line: OptStr = @read_line();
    match line {
        OptStr.Some(text) => {
            match @parse_i32(text) {
                OptInt.Some(n) => n,
                OptInt.None => 7,
            }
        },
        OptStr.None => 0,
    }
}
""" },
]
stdin = "banana\n"
exit_code = 7

# Fallible intrinsics yield the exact trusted std Option; contextual type
# checks validate this identity.
[[case]]
name = "read_line_at_eof_yields_none"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
  { path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let OptStr = std.option.Option(StrBuf);
    let line: OptStr = @read_line();
    match line {
        OptStr.Some(_text) => 1,
        OptStr.None => 0,
    }
}
""" },
]
stdin = ""
exit_code = 0
