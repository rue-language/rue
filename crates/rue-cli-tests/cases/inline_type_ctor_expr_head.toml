# Inline type-constructor call as an EXPRESSION head (RUE-596, spec 4.14:23):
# `F(args).NAME(..)` where `F(args)` reduces to a concrete type at comptime, used
# directly as an enum-variant construction (`Result(i32,i32).Ok(42)`) or an
# associated-function call (`Counter(i32).zero()`) without binding the
# specialization to a name first. Accepted with no preview flag (stabilized
# RUE-598); the struct-literal head and pattern head are exercised alongside it.

[section]
id = "cli.inline_type_ctor_expr_head"
name = "Inline type-constructor expression head"
description = "`F(args).Variant(..)` / `F(args).assoc(..)` as an expression head (RUE-596)."

[[case]]
name = "enum_variant_head_runs"
description = "`Result(i32,i32).Ok(42)` constructs an enum variant inline; `?`-free round-trip through a match."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn main() -> i32 {
    let r = Result(i32, i32).Ok(42);        // inline variant head
    let R = Result(i32, i32);
    match r { R.Ok(v) => v, R.Err(e) => e } // 42
}
""" }]
exit_code = 42

[[case]]
name = "struct_assoc_fn_head_runs"
description = "`Counter(i32).zero()` calls an associated function on an inline type-constructor head."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Counter(comptime T: type) -> type {
    struct {
        n: T,
        fn zero() -> Self { Self { n: 0 } }
        fn bump(self) -> Self { Self { n: self.n + 1 } }
        fn get(borrow self) -> T { self.n }
    }
}
fn main() -> i32 {
    let c = Counter(i32).zero().bump().bump();   // inline head, then by-value chain
    c.get()                                       // 2
}
""" }]
exit_code = 2

[[case]]
name = "inline_head_accepted_without_flag"
description = "The inline enum-variant head compiles with no preview flag (stabilized RUE-598)."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn main() -> i32 {
    let r = Result(i32, i32).Ok(42);
    0
}
""" }]
exit_code = 0

[[case]]
name = "unknown_inline_enum_variant"
description = "An unknown variant on a reduced inline enum type is E0420, as for a named enum path."
compile_fail = true
error_contains = ["E0420", "unknown variant 'C' in enum 'E(i32)'"]
files = [{ path = "main.rue", source = """
fn E(comptime T: type) -> type { enum { A(T), B } }
fn main() -> i32 { E(i32).C(1); 0 }
""" }]

[[case]]
name = "unknown_inline_struct_assoc_function"
description = "An unknown associated function on a reduced inline struct remains E0412."
compile_fail = true
error_contains = ["E0412", "no associated function named 'missing'"]
files = [{ path = "main.rue", source = """
fn S(comptime T: type) -> type { struct { value: T, fn make() -> Self { Self { value: 0 } } } }
fn main() -> i32 { S(i32).missing(1); 0 }
""" }]

[[case]]
name = "runtime_enum_receiver_unknown_method"
description = "An unknown method on a runtime enum value remains E0413."
compile_fail = true
error_contains = ["E0413", "no method named 'missing' on type 'E'"]
files = [{ path = "main.rue", source = """
enum E { A, B }
fn main() -> i32 { let e = E.A; e.missing(); 0 }
""" }]

[[case]]
name = "bound_name_form_still_runs"
description = "The equivalent bind-first form (`let R = F(args); R.Ok(..)`) runs identically."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }
fn main() -> i32 {
    let R = Result(i32, i32);
    let r = R.Ok(42);
    match r { R.Ok(v) => v, R.Err(e) => e }
}
""" }]
exit_code = 42

[[case]]
name = "all_three_heads_one_program"
description = "Struct-literal head, enum-variant head, and pattern head together, driven through the real binary (RUE-596)."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Pair(comptime T: type) -> type { struct { a: T, b: T } }
fn Result(comptime T: type, comptime E: type) -> type { enum { Ok(T), Err(E) } }

fn classify(p_a: i32, p_b: i32) -> Result(i32, i32) {
    let p = Pair(i32) { a: p_a, b: p_b };   // struct-literal head
    if p.a > p.b {
        Result(i32, i32).Err(p.a)           // enum-variant head
    } else {
        Result(i32, i32).Ok(p.a + p.b)      // enum-variant head
    }
}

fn main() -> i32 {
    match classify(20, 22) {                // pattern heads below
        Result(i32, i32).Ok(v) => v,        // 42
        Result(i32, i32).Err(e) => e,
    }
}
""" }]
exit_code = 42
