# The --emit pipeline must behave like a normal build (RUE-130 items 3-4):
# same module resolution, same warnings. It used to skip sema's file paths
# (module programs failed E0704 only under --emit) and silently drop all
# warnings.

[section]
id = "cli.emit_pipeline"
name = "--emit pipeline parity"
description = "--emit modes resolve modules and report warnings like a normal build."

[[case]]
name = "emit_air_warnings_not_dropped"
description = "Warnings were silently dropped in all --emit modes (RUE-130 item 3)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let unused = 1;
    0
}
""" }]
args = ["--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== AIR ==="]
compile_stderr_contains = ["unused variable", "'unused'"]

[[case]]
name = "emit_air_resolves_modules"
description = "--emit skipped sema.set_file_paths, so module programs failed E0704 only under --emit (RUE-130 item 4)."
files = [
    { path = "main.rue", source = """
const utils = @import("utils");

fn main() -> i32 {
    utils.triple(2)
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
args = ["--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== AIR ==="]
compile_stderr_not_contains = ["E0704"]

# A lex error in the SECOND file used to be reported with the first file's
# path and source snippet, because the --emit tokens path lexed every file
# with FileId::DEFAULT (RUE-38).
[[case]]
name = "emit_tokens_lex_error_attributed_to_correct_file"
description = "Lex errors under multi-file --emit tokens name the file that actually contains the error."
files = [
    { path = "main.rue", source = """
fn main() -> i32 { 0 }
""" },
    { path = "bad.rue", source = """
fn ok() -> i32 { 1 }
let # = 3;
""" },
]
args = ["--emit", "tokens", "main.rue", "bad.rue"]
compile_fail = true
compile_stderr_contains = ["bad.rue:", "let # = 3;"]
compile_stderr_not_contains = ["main.rue:"]

# RUE-352: `-j`/`--jobs` was silently ignored under --emit. The jobs setting was
# only applied inside compile_multi_file_with_options, which the --emit path
# never calls, so `--emit asm -j1` ran multi-threaded. The pool config is now
# hoisted into main() ahead of both paths. This case pins that --emit still
# produces asm when a jobs count is requested (and that it doesn't panic on a
# double thread-pool init).
[[case]]
name = "emit_asm_honors_jobs_flag"
description = "-j/--jobs is accepted and applied in --emit mode (RUE-352)."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 42 }
""" }]
args = ["--emit", "asm", "-j1", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== Assembly", "main"]

[[case]]
name = "emit_lowering_reports_deferred_lowering_errors"
description = "--emit lowering used to ignore deferred by-ref lowering diagnostics and exit successfully (RUE-482)."
files = [{ path = "main.rue", source = """
const X: i32 = 1;

fn f(inout x: i32) {
    x = 2;
}

fn main() -> i32 {
    f(inout X);
    X
}
""" }]
args = ["--emit", "lowering", "main.rue"]
compile_fail = true
error_contains = ["E0425", "inout argument must be an lvalue"]

[[case]]
name = "emit_mir_suppresses_partial_stdout_on_late_lowering_error"
description = "--emit mir buffers fallible per-function output so a later lowering error does not leave partial MIR on stdout (RUE-483)."
files = [{ path = "main.rue", source = """
const X: i32 = 1;

fn f(inout x: i32) {
    x = 2;
}

fn main() -> i32 {
    f(inout X);
    X
}
""" }]
args = ["--emit", "mir", "main.rue"]
compile_fail = true
error_contains = ["E0425", "inout argument must be an lvalue"]
compile_stdout_not_contains = ["=== MIR", "function f:"]

[[case]]
name = "emit_air_target_arch_uses_requested_target"
description = "@target_arch() in --emit uses --target, not the compiler host (RUE-417)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    match @target_arch() {
        Arch::X86_64 => 86,
        Arch::Aarch64 => 64,
    }
}
""" }]
args = ["--target", "aarch64-linux", "--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["enum_variant #1::1"]

[[case]]
name = "emit_air_target_os_uses_requested_target"
description = "@target_os() in --emit uses --target, not the compiler host (RUE-417)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    match @target_os() {
        Os::Linux => 1,
        Os::Macos => 2,
    }
}
""" }]
args = ["--target", "aarch64-macos", "--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["enum_variant #2::1"]
