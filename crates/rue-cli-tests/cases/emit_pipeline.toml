# The --emit pipeline must behave like a normal build (RUE-130 items 3-4):
# same module resolution, same warnings. It used to skip sema's file paths
# (module programs failed E0704 only under --emit) and silently drop all
# warnings.

[section]
id = "cli.emit_pipeline"
name = "--emit pipeline parity"
description = "--emit modes resolve modules and report warnings like a normal build."

# RUE-767: this case pinned that RIR presentation retained the caller order of
# two flat positional sources. With exactly one root source there is no
# positional order to preserve, so it now asserts the extra-source refusal.
# Single-root RIR presentation is covered by combined_rir_air_resolves_imports_once.
[[case]]
name = "emit_rir_extra_source_refused"
description = "RUE-767: a second positional source under --emit rir is refused."
files = [
    { path = "z.rue", source = "fn main() -> i32 { let z = 40; z + 2 }\n" },
    { path = "a.rue", source = "fn alpha() -> i32 { let a = 1; a }\n" },
]
args = ["--emit", "rir", "z.rue", "a.rue"]
compile_fail = true
error_contains = ["unexpected extra source file", "a.rue", "@import"]
compile_stdout_not_contains = ["=== RIR ==="]

[[case]]
name = "combined_rir_air_resolves_imports_once"
description = "RUE-728: combined RIR and semantic emits consume the same canonical import-aware frontend artifacts."
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\"); fn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 42 }\n" },
]
args = ["--emit", "rir", "--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== RIR ===", "fn answer()", "fn main()", "=== AIR ==="]
compile_stderr_not_contains = ["E0704", "internal compiler error"]

# RUE-1112: RIR is a pre-semantic presentation — it lowers but never runs
# semantic body analysis, so a semantic-only error (an undefined variable, which
# name resolution raises in sema) is NOT reported by `--emit rir`; the untyped RIR
# is shown instead. A normal build of the same program still reports it with
# canonical multi-file attribution (see the companion case below). RIR's own
# multi-file diagnostic attribution (RUE-728) is exercised by the parse-error case
# `emit_rir_multifile_errors_follow_discovery_not_logical_order`.
[[case]]
name = "emit_rir_is_pre_semantic_and_defers_body_diagnostics"
description = "RUE-1112: --emit rir presents the untyped RIR without semantic body analysis, deferring semantic-only diagnostics."
files = [
    { path = "main.rue", source = "const bad = @import(\"bad.rue\"); fn main() -> i32 { bad.broken() }\n" },
    { path = "bad.rue", source = "pub fn broken() -> i32 { missing }\n" },
]
args = ["--emit", "rir", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== RIR ==="]
compile_stderr_not_contains = ["E0201", "undefined variable"]

[[case]]
name = "normal_build_reports_the_body_diagnostic_rir_emit_defers"
description = "RUE-1112: the semantic-only error --emit rir defers is reported by a normal build with canonical multi-file attribution."
files = [
    { path = "main.rue", source = "const bad = @import(\"bad.rue\"); fn main() -> i32 { bad.broken() }\n" },
    { path = "bad.rue", source = "pub fn broken() -> i32 { missing }\n" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
compile_stderr_contains = ["E0201", "bad.rue:", "undefined variable 'missing'"]

# RUE-1112: --emit ast and --emit rir are pre-semantic presentations, so they run
# no reached-body semantic analysis and therefore no trusted-toolchain park or std
# acquisition. Even a reached fallible intrinsic (@parse_i64) with a MALFORMED std
# option.rue on disk emits successfully: the malformed module is never read (if it
# were, acquisition would fail with a toolchain-integrity error).
[[case]]
name = "emit_ast_reached_fallible_intrinsic_reads_no_std"
description = "RUE-1112: --emit ast reads zero std for a reached fallible intrinsic, even with a malformed std on disk."
env = { RUE_STD_PATH = "badstd" }
files = [
    { path = "main.rue", source = "fn main() -> i32 { let _ = @parse_i64(\"7\"); 42 }\n" },
    { path = "badstd/option.rue", source = "this is not a valid rue module @@@ ???\n" },
]
args = ["--emit", "ast", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== AST"]
compile_stderr_not_contains = ["Toolchain integrity error", "malformed"]

[[case]]
name = "emit_rir_reached_fallible_intrinsic_reads_no_std"
description = "RUE-1112: --emit rir reads zero std for a reached fallible intrinsic, even with a malformed std on disk."
env = { RUE_STD_PATH = "badstd" }
files = [
    { path = "main.rue", source = "fn main() -> i32 { let _ = @parse_i64(\"7\"); 42 }\n" },
    { path = "badstd/option.rue", source = "this is not a valid rue module @@@ ???\n" },
]
args = ["--emit", "rir", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== RIR ==="]
compile_stderr_not_contains = ["Toolchain integrity error", "malformed"]

[[case]]
name = "emit_rir_stops_at_canonical_import_preflight"
description = "RUE-809: RIR emit cannot lower a malformed import before the compiler-owned import diagnostic batch succeeds."
files = [{ path = "main.rue", source = "fn main() { let bad = @import(1); }\n" }]
args = ["--emit", "rir", "main.rue"]
compile_fail = true
compile_stderr_contains = ["E0703", "@import requires a string literal argument"]
compile_stdout_not_contains = ["=== RIR ==="]

# RUE-767 modernized this from two flat positionals to a clean root that
# @imports two broken helpers. The root imports z-helper before a-helper, so
# discovery order is z-helper then a-helper — the reverse of logical
# (alphabetical) order — and both files' errors must still be accumulated in one
# session-backed emit rather than the discovery aborting after the first.
[[case]]
name = "emit_rir_multifile_errors_follow_discovery_not_logical_order"
description = "RUE-736: session-backed emit diagnostics accumulate every discovered file's errors, in discovery order."
files = [
    { path = "root.rue", source = "const z = @import(\"z-helper.rue\");\nconst a = @import(\"a-helper.rue\");\nfn main() -> i32 { 0 }\n" },
    { path = "z-helper.rue", source = "fn zulu() { let # = 1; }\n" },
    { path = "a-helper.rue", source = "fn alpha() { let # = 2; }\n" },
]
args = ["--emit", "rir", "root.rue"]
compile_fail = true
compile_stderr_contains = ["z-helper.rue:", "let # = 1", "a-helper.rue:", "let # = 2"]
compile_stdout_not_contains = ["=== RIR ==="]

[[case]]
name = "emit_air_warnings_not_dropped"
description = "Warnings were silently dropped in all --emit modes (RUE-130 item 3)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let unused = 1;
    0
}
""" }]
args = ["--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== AIR ==="]
compile_stderr_contains = ["unused variable", "'unused'"]

[[case]]
name = "emit_air_resolves_modules"
description = "--emit skipped sema.set_file_paths, so module programs failed E0704 only under --emit (RUE-130 item 4)."
files = [
    { path = "main.rue", source = """
const utils = @import("utils.rue");

fn main() -> i32 {
    utils.triple(2)
}
""" },
    { path = "utils.rue", source = """
pub fn triple(x: i32) -> i32 {
    x * 3
}
""" },
]
args = ["--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== AIR ==="]
compile_stderr_not_contains = ["E0704"]

# A lex error in an imported file used to be reported with the root file's
# path and source snippet, because the --emit tokens path lexed every file
# with FileId::DEFAULT (RUE-38). RUE-767 modernized this from a legacy second
# positional to an @import from the root; the error still lives in bad.rue.
[[case]]
name = "emit_tokens_lex_error_attributed_to_correct_file"
description = "Lex errors under multi-file --emit tokens name the file that actually contains the error."
files = [
    { path = "main.rue", source = """
const bad = @import("bad.rue");
fn main() -> i32 { 0 }
""" },
    { path = "bad.rue", source = """
fn ok() -> i32 { 1 }
let # = 3;
""" },
]
args = ["--emit", "tokens", "main.rue"]
compile_fail = true
compile_stderr_contains = ["bad.rue:", "let # = 3;"]
compile_stderr_not_contains = ["main.rue:"]

[[case]]
name = "emit_tokens_reports_multiple_lexer_errors"
description = "--emit tokens preserves accumulated lexer diagnostics instead of collapsing to the first error (RUE-496)."
files = [{ path = "main.rue", source = """
fn main() -> i32 { $ # }
""" }]
args = ["--emit", "tokens", "main.rue"]
compile_fail = true
compile_stderr_contains = [
    "unexpected character: $",
    "unexpected character: #",
]

# RUE-767: RUE-644's duplicate-normalized-identity check (E1400) only fired when
# two positional sources normalized to the same file. With the flat positional
# surface removed, `--emit tokens main.rue ./main.rue` is refused at the CLI
# before discovery, so the duplicate-identity path is no longer reachable here.
[[case]]
name = "emit_tokens_rejects_duplicate_normalized_source_identity_before_output"
description = "RUE-767: a second positional source (a re-spelled duplicate) is refused before output."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 0 }
""" }]
args = ["--emit", "tokens", "main.rue", "./main.rue"]
compile_fail = true
error_contains = ["unexpected extra source file", "./main.rue", "@import"]
compile_stdout_not_contains = ["=== Tokens"]

# RUE-352: `-j`/`--jobs` was silently ignored under --emit. The jobs setting was
# only applied inside the former batch compatibility path, which the --emit
# mode bypassed, so `--emit asm -j1` ran multi-threaded. The pool config is now
# hoisted into main() ahead of both paths. This case pins that --emit still
# produces asm when a jobs count is requested (and that it doesn't panic on a
# double thread-pool init).
[[case]]
name = "emit_asm_honors_jobs_flag"
description = "-j/--jobs is accepted and applied in --emit mode (RUE-352)."
files = [{ path = "main.rue", source = """
fn main() -> i32 { 42 }
""" }]
args = ["--emit", "asm", "-j1", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== Assembly", "main"]

# RUE-1141: backend diagnostics are projections of the production backend
# product. In particular, helper definitions and calls must use the same
# canonical machine symbols that a normal object build uses.
[[case]]
name = "backend_emits_use_production_symbols_x86_64"
description = "Every x86-64 backend emit stage projects the production lowering/allocation/emission path and its canonical symbols."
files = [{ path = "main.rue", source = """
fn helper() -> i32 { 42 }
fn main() -> i32 { helper() }
""" }]
args = [
    "--target", "x86-64-linux",
    "--emit", "lowering",
    "--emit", "mir",
    "--emit", "liveness",
    "--emit", "regalloc",
    "--emit", "asm",
    "main.rue",
]
compile_only = true
compile_stdout_contains = [
    "=== Instruction Selection",
    "=== MIR",
    "=== Liveness",
    "=== Register Allocation",
    "=== Assembly",
    "function __rue_sem_v1_",
    ".globl __rue_sem_v1_",
    "call __rue_sem_v1_",
]
compile_stdout_not_contains = [
    "function helper:",
    ".globl helper",
    "helper:",
    "call helper",
]

[[case]]
name = "backend_emits_use_production_symbols_aarch64"
description = "Every AArch64 backend emit stage projects the production lowering/allocation/emission path and its canonical symbols."
files = [{ path = "main.rue", source = """
fn helper() -> i32 { 42 }
fn main() -> i32 { helper() }
""" }]
args = [
    "--target", "aarch64-linux",
    "--emit", "lowering",
    "--emit", "mir",
    "--emit", "liveness",
    "--emit", "regalloc",
    "--emit", "asm",
    "main.rue",
]
compile_only = true
compile_stdout_contains = [
    "=== Instruction Selection",
    "=== MIR",
    "=== Liveness",
    "=== Register Allocation",
    "=== Assembly",
    "function __rue_sem_v1_",
    ".globl __rue_sem_v1_",
    "bl __rue_sem_v1_",
]
compile_stdout_not_contains = [
    "function helper:",
    ".globl helper",
    "helper:",
    "bl helper",
]

[[case]]
name = "emit_lowering_reports_semantic_byref_errors"
description = "--emit lowering reports by-ref non-place operands rejected during semantic/AIR construction (RUE-760)."
files = [{ path = "main.rue", source = """
const X: i32 = 1;

fn f(inout x: i32) {
    x = 2;
}

fn main() -> i32 {
    f(inout X);
    X
}
""" }]
args = ["--emit", "lowering", "main.rue"]
compile_fail = true
error_contains = ["E0425", "inout argument must be an lvalue"]

[[case]]
name = "emit_mir_suppresses_stdout_on_semantic_byref_error"
description = "--emit mir leaves no partial MIR on stdout when semantic/AIR construction rejects a by-ref non-place operand (RUE-760)."
files = [{ path = "main.rue", source = """
const X: i32 = 1;

fn f(inout x: i32) {
    x = 2;
}

fn main() -> i32 {
    f(inout X);
    X
}
""" }]
args = ["--emit", "mir", "main.rue"]
compile_fail = true
error_contains = ["E0425", "inout argument must be an lvalue"]
compile_stdout_not_contains = ["=== MIR", "function f:"]

[[case]]
name = "emit_air_target_arch_uses_requested_target"
description = "@target_arch() in --emit uses --target, not the compiler host (RUE-417)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    match @target_arch() {
        Arch.X86_64 => 86,
        Arch.Aarch64 => 64,
    }
}
""" }]
args = ["--target", "aarch64-linux", "--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["enum_variant #", "::1"]

[[case]]
name = "emit_air_target_os_uses_requested_target"
description = "@target_os() in --emit uses --target, not the compiler host (RUE-417)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    match @target_os() {
        Os.Linux => 1,
        Os.Macos => 2,
    }
}
""" }]
args = ["--target", "aarch64-macos", "--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["enum_variant #", "::1"]
