# Move checker: loop back-edge soundness (RUE-32).
#
# A value moved anywhere in a loop's condition or body is already moved when
# the back edge re-enters the loop, so iteration 2 would re-move (and
# double-drop) it. These cases pin the E0205 error for that pattern and the
# valid controls that must keep compiling (value defined inside the body,
# reassignment before the next use, Copy types).
#
# A move is checked only when a body path can return to the loop head. A body
# that unconditionally breaks after the move runs at most once and is valid.

[section]
id = "cli.loop_moves"
name = "Loop back-edge move checking"
description = "Use-of-moved-value across loop iterations (RUE-32)."

[[case]]
name = "move_into_call_in_while_loop"
description = "Moving a non-Copy struct into a call inside a while body errors: iteration 2 re-moves it."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    let mut i = 0;
    let mut total = 0;
    while i < 2 { total = total + consume(d); i = i + 1; }
    total
}
""" }]
compile_fail = true
error_contains = ["E0205", "use of moved value", "previous iteration of the loop"]

[[case]]
name = "string_move_in_while_loop"
description = "The StrBuf variant of the same bug double-freed at runtime before the fix."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn consume(s: StrBuf) -> i32 { 1 }
fn main() -> i32 {
    let s: StrBuf = "hi";
    let mut i = 0;
    while i < 2 { consume(s); i = i + 1; }
    0
}
""" }]
compile_fail = true
error_contains = ["E0205", "previous iteration of the loop"]

[[case]]
name = "move_in_while_condition"
description = "The condition re-executes every iteration, so a move inside it also errors."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn check(d: Data) -> bool { d.x > 0 }
fn main() -> i32 {
    let d = Data { x: 1 };
    while check(d) { }
    0
}
""" }]
compile_fail = true
error_contains = ["E0205", "previous iteration of the loop"]

[[case]]
name = "move_in_infinite_loop_with_break_ok"
description = "An unconditional break makes the move execute at most once, so there is no back-edge conflict."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    loop { consume(d); break; }
    0
}
""" }]
exit_code = 0

[[case]]
name = "diverging_intrinsic_argument_does_not_create_phantom_break"
description = "An intrinsic argument after a diverging argument is unreachable and cannot create a break edge."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn never() -> ! { loop {} }
fn run() -> bool { true }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    loop {
        if run() { break; }
        consume(d);
        checked { @syscall(never(), { break; 0 }); }
    }
    0
}
""" }]
exit_code = 0

[[case]]
name = "diverging_place_rhs_does_not_create_phantom_break"
description = "A mutable place target after a diverging assignment RHS is unreachable and cannot create a break edge."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
struct P {
    x: i32,
    fn at(inout self, i: i32) -> inout i32 { yield self.x; }
}
fn never() -> ! { loop {} }
fn run() -> bool { true }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    let mut p = P { x: 0 };
    loop {
        if run() { break; }
        consume(d);
        loop { p.at({ break; 0 }) = never(); }
    }
    0
}
""" }]
exit_code = 0

[[case]]
name = "diverging_field_rhs_does_not_create_phantom_break"
description = "A projected field target after a diverging assignment RHS is unreachable and cannot create a break edge."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
struct P {
    value: i32,
    fn at(inout self, i: i32) -> inout P { yield self; }
}
fn never() -> ! { loop {} }
fn run() -> bool { true }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    let mut p = P { value: 0 };
    loop {
        if run() { break; }
        consume(d);
        loop { p.at({ break; 0 }).value = never(); }
    }
    0
}
""" }]
exit_code = 0

