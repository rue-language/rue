[[case]]
name = "move_in_all_break_arms_ok"
description = "When every conditional body arm breaks, neither arm reaches a later iteration."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    let choose = 1;
    loop {
        if choose == 1 { consume(d); break; }
        else { consume(d); break; }
    }
    0
}
""" }]
exit_code = 0

[[case]]
name = "move_in_nested_all_break_control_flow_ok"
description = "Nested loops and branches whose paths all break do not create a phantom back edge."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    let choose = 1;
    loop {
        while choose == 1 {
            if choose == 1 { consume(d); break; }
            else { consume(d); break; }
        }
        break;
    }
    0
}
""" }]
exit_code = 0

[[case]]
name = "nested_loop_with_only_return_does_not_create_outer_backedge"
description = "An inner loop with only a reachable return and an unreachable break still diverges to its outer loop."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    loop {
        consume(d);
        loop { return 0; break; }
    }
}
""" }]
exit_code = 0

[[case]]
name = "move_in_while_condition_and_break_ok"
description = "A condition move and a body move are each executed once when the body always breaks."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn check(d: Data) -> bool { d.x > 0 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let condition_data = Data { x: 1 };
    let body_data = Data { x: 2 };
    while check(condition_data) { consume(body_data); break; }
    0
}
""" }]
exit_code = 0

[[case]]
name = "move_into_explicit_continue_errors"
description = "An explicit continue is a real back edge and retains the previous-iteration rejection."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    loop { consume(d); continue; }
}
""" }]
compile_fail = true
error_contains = ["E0205", "previous iteration of the loop"]

[[case]]
name = "unreachable_continue_after_break_is_ignored"
description = "A continue after an unconditional break is dead and must not create a back edge."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    loop { consume(d); break; continue; }
    0
}
""" }]
exit_code = 0

[[case]]
name = "while_all_diverging_break_or_return_preserves_owned_exit"
description = "A return arm that moves is not a post-loop path when the other arm breaks."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn run() -> bool { false }
fn leave() -> bool { false }
fn main() -> i32 {
    let d = Data { x: 1 };
    while run() {
        if leave() { consume(d); return 0; }
        else { break; }
    }
    consume(d)
}
""" }]
exit_code = 1

[[case]]
name = "while_all_diverging_match_preserves_owned_exit"
description = "A match arm that moves and returns is excluded when the other arm breaks."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn run() -> bool { false }
fn main() -> i32 {
    let d = Data { x: 1 };
    while run() {
        match run() {
            true => { consume(d); return 0; },
            false => { break; }
        }
    }
    consume(d)
}
""" }]
exit_code = 1

[[case]]
name = "while_zero_iteration_linear_path_is_checked"
description = "A linear value consumed only when the while body runs is not consumed on the false-condition exit."
files = [{ path = "main.rue", source = """
linear struct Token { value: i32 }
fn consume(t: Token) { @drop(t); }
fn run() -> bool { false }
fn main() -> i32 {
    let t = Token { value: 1 };
    while run() { consume(t); break; }
    0
}
""" }]
compile_fail = true
error_contains = ["E0443", "not consumed on all paths"]

[[case]]
name = "conditional_move_in_loop"
description = "A move under an if inside the loop body is still a potential re-move (union semantics)."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    let mut i = 0;
    while i < 3 { if i == 1 { consume(d); } i = i + 1; }
    0
}
""" }]
compile_fail = true
error_contains = ["E0205", "previous iteration of the loop"]

[[case]]
name = "move_in_nested_loop"
description = "A move in an inner loop body errors at the inner back edge."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    let mut i = 0;
    while i < 2 { let mut j = 0; while j < 2 { consume(d); j = j + 1; } i = i + 1; }
    0
}
""" }]
compile_fail = true
error_contains = ["E0205", "previous iteration of the loop"]

[[case]]
name = "value_defined_inside_loop_ok"
description = "Control: a value created and moved within the same iteration is fine."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let mut i = 0;
    let mut total = 0;
    while i < 2 { let t = Data { x: 1 }; total = total + consume(t); i = i + 1; }
    total
}
""" }]
exit_code = 2

[[case]]
name = "reassign_after_move_ok"
description = "Control: reassigning before the next iteration's use makes the move per-iteration valid."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let mut d = Data { x: 1 };
    let mut i = 0;
    let mut total = 0;
    while i < 2 { total = total + consume(d); d = Data { x: 2 }; i = i + 1; }
    total
}
""" }]
exit_code = 3

[[case]]
name = "reassign_before_move_ok"
description = "Control: reassignment at the top of the body clears last iteration's move."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let mut d = Data { x: 1 };
    let mut i = 0;
    let mut total = 0;
    while i < 2 { d = Data { x: 5 }; total = total + consume(d); i = i + 1; }
    total
}
""" }]
exit_code = 10

[[case]]
name = "copy_type_in_loop_ok"
description = "Control: Copy types are never moved, so repeated by-value calls are fine."
files = [{ path = "main.rue", source = """
fn double(x: i32) -> i32 { x * 2 }
fn main() -> i32 {
    let v = 3;
    let mut i = 0;
    let mut total = 0;
    while i < 2 { total = total + double(v); i = i + 1; }
    total
}
""" }]
exit_code = 12

[[case]]
name = "diverging_if_condition_does_not_create_phantom_continue"
description = "A continue in an arm whose condition diverges is unreachable and cannot form a back edge."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn never() -> ! { loop {} }
fn run() -> bool { true }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    loop {
        if run() { break; }
        consume(d);
        if never() { continue; }
    }
    0
}
""" }]
exit_code = 0

[[case]]
name = "diverging_match_scrutinee_does_not_create_phantom_continue"
description = "Continue arms after a diverging match scrutinee are unreachable and cannot form a back edge."
files = [{ path = "main.rue", source = """
struct Data { x: i32 }
fn never() -> ! { loop {} }
fn run() -> bool { true }
fn consume(d: Data) -> i32 { d.x }
fn main() -> i32 {
    let d = Data { x: 1 };
    loop {
        if run() { break; }
        consume(d);
        match (if never() { true } else { false }) {
            true => { continue; },
            false => { continue; }
        }
    }
    0
}
""" }]
exit_code = 0

