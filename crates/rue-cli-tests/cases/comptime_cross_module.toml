files = [
  { path = "b.rue", source = """
pub fn Mk(comptime T: type) -> type {
    enum { Some(T), None }
}
""" },
  { path = "a.rue", source = """
const b = @import("b.rue");

pub fn Alias(comptime T: type) -> type {
    let X = b.Mk(T);
    X
}
""" },
  { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    let A = a.Alias(i32);
    let O = b.Mk(i32);
    let x = A.Some(7);
    match x {
        O.Some(v) => v,
        O.None => -1,
    }
