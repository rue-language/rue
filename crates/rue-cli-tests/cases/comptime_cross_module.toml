[[case]]
# RUE-575: a comptime let-bound alias of a CROSS-MODULE type constructor is
# usable as a field type inside a -> type body.
name = "cross_module_let_alias_in_field_type_position"
args = ["main.rue", "-o", "prog"]
files = [
  { path = "b.rue", source = """
pub fn Mk(comptime T: type) -> type {
    struct { value: T }
}
""" },
  { path = "main.rue", source = """
const b = @import("b.rue");

fn Wrap(comptime T: type) -> type {
    let Inner = b.Mk(T);
    struct { x: Inner }
}

fn main() -> i32 {
    let W = Wrap(i32);
    let I = b.Mk(i32);
    let w: W = W { x: I { value: 42 } };
    w.x.value
}
""" },
]
exit_code = 42

# --- RUE-993: named struct fields retaining specializations whose ctor
# bodies contain module-qualified nested constructor calls. Field-type
# resolution reduces the ctor body during declaration binding, before the
# defining file's import constants are collected; the nested `mk.Mk(T)` /
# `arraybuf.ArrayBuf(u64)` receiver must resolve through the declaration
# namespace (on-demand), not the raw binding table, or the whole reduction
# silently degrades to E1200. ---
[[case]]
name = "struct_field_retains_ctor_with_nested_module_call"
description = "A named struct retains `wrap.Wrap(i32)` whose body opens with `let Inner = mk.Mk(T)` from a third module (RUE-993)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "mk.rue", source = """
pub fn Mk(comptime T: type) -> type {
    struct { value: T }
}
""" },
  { path = "wrap.rue", source = """
const mk = @import("mk.rue");

pub fn Wrap(comptime T: type) -> type {
    let Inner = mk.Mk(T);
    struct {
        inner: Inner,
        fn make(v: T) -> Self {
            let I = mk.Mk(T);
            Self { inner: I { value: v } }
        }
        fn get(borrow self) -> T { self.inner.value }
    }
}
""" },
  { path = "main.rue", source = """
const wrap = @import("wrap.rue");

pub struct Holder {
    w: wrap.Wrap(i32),

    fn new() -> Self {
        let W = wrap.Wrap(i32);
        Self { w: W.make(7) }
    }
}

fn main() -> i32 {
    let h = Holder.new();
    h.w.get()
}
""" },
]
exit_code = 7

[[case]]
name = "struct_field_retains_std_strmap_specialization"
description = "A public cross-module struct retains `std.strmap.StrMap(u64)` as a field and uses it at runtime (RUE-993)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
files = [
  { path = "pool.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
const OptU64 = std.option.Option(u64);

pub struct Pool {
    index: std.strmap.StrMap(u64),

    fn new() -> Self {
        let M = std.strmap.StrMap(u64);
        Self { index: M.new(0) }
    }

    fn put(inout self, borrow key: StrBuf, value: u64) {
        self.index.insert(borrow key, value);
    }

    fn get_or(borrow self, borrow key: StrBuf, fallback: u64) -> u64 {
        match self.index.get(borrow key) { OptU64.Some(v) => v, OptU64.None => fallback }
    }
}
""" },
  { path = "main.rue", source = """
const std = @import("std");
const pool = @import("pool.rue");

fn main() -> i32 {
    let mut p = pool.Pool.new();
    let k1: std.strbuf.StrBuf = "alpha";
    let k2: std.strbuf.StrBuf = "beta";
    let absent: std.strbuf.StrBuf = "absent";
    p.put(borrow k1, 11);
    p.put(borrow k2, 22);
    println(@to_string(p.get_or(borrow k1, 0)));
    println(@to_string(p.get_or(borrow k2, 0)));
    println(@to_string(p.get_or(borrow absent, 99)));
    0
}
""" },
]
exit_code = 0
stdout = "11\n22\n99\n"

# RUE-2417: a module-qualified call to a `-> type` function reduces at compile
# time exactly as the unqualified call does (spec 4.14:5a, 4.14:28), in every
# position, and a module-qualified call that cannot reduce is rejected at the
# call rather than reaching codegen (spec 4.14:6).

[[case]]
name = "cross_module_zero_param_type_ctor_discarded_statement"
description = "A discarded module-qualified zero-parameter `-> type` call reduces at compile time; it was an internal error (RUE-2417)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn Foo() -> type { i32 }
pub fn Bar(comptime T: type) -> type { T }
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
fn main() -> i32 {
    lib.Foo();
    lib.Bar(i32);
    42
}
""" },
]
exit_code = 42

[[case]]
name = "cross_module_zero_param_type_ctor_as_comptime_type_argument"
description = "A module-qualified zero-parameter `-> type` call supplies a `comptime T: type` argument, like the unqualified call (RUE-2417)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn Foo() -> type { i32 }
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
fn first(comptime T: type, a: T) -> T { a }
fn main() -> i32 {
    let L = lib.Foo();
    let x: L = first(lib.Foo(), 42);
    x
}
""" },
]
exit_code = 42

[[case]]
name = "cross_module_runtime_param_type_call_rejected"
description = "A module-qualified call to a `-> type` function with a runtime parameter is rejected at the call; it was an internal error (RUE-2417)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn pick(c: bool) -> type { if c { i32 } else { i64 } }
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
fn main() -> i32 {
    let c = true;
    lib.pick(c);
    42
}
""" },
]
compile_fail = true
error_contains = ["E1200", "this call produces a type value at runtime; a `type` result requires a fully-comptime call"]

[[case]]
name = "module_returning_type_call_discarded_statement"
description = "A call to a `-> type` function whose body is an `@import` reduces to that module in call position, so a discarded call is a module expression statement, accepted as `@import(..);` is (10.4:7). It once neither reduced nor reached codegen (RUE-2417), and was then rejected at the call (RUE-2420)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn f() -> i32 { 42 }
""" },
  { path = "main.rue", source = """
fn m() -> type { @import("lib.rue") }
fn main() -> i32 {
    m();
    42
}
""" },
]
exit_code = 42

[[case]]
name = "module_returning_type_call_binds_and_heads_paths"
description = "A `-> type` function whose body is an `@import` reduces to that module wherever it is called, as a `const` binding of the same call does (10.4:8, 10.4:10): a `let` binds it and calls, struct literals and annotations walk through the local; the call itself heads a member call and a nested re-export path; a comptime parameter selects which module; and a callee in another directory resolves its import from its own file (RUE-2420)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn g() -> i32 { 1 }
pub struct P { x: i32 }
pub const sub = @import("sub.rue");
""" },
  { path = "sub.rue", source = """
pub fn h() -> i32 { 2 }
""" },
  { path = "other.rue", source = """
pub fn g() -> i32 { 4 }
""" },
  { path = "dir/lib.rue", source = """
pub fn inner() -> type { @import("inner.rue") }
""" },
  { path = "dir/inner.rue", source = """
pub fn v() -> i32 { 8 }
""" },
  { path = "main.rue", source = """
const dir = @import("dir/lib.rue");
fn f() -> type { @import("lib.rue") }
fn pick(comptime first: bool) -> type { if first { @import("lib.rue") } else { @import("other.rue") } }
fn main() -> i32 {
    let m = f();
    let p = m.P { x: 16 };
    let q: m.P = p;
    let o = pick(false);
    let i = dir.inner();
    m.g() + f().sub.h() + o.g() + i.v() + q.x + f().g() + pick(true).g() + 8
}
""" },
]
exit_code = 41

[[case]]
name = "module_returning_type_call_comptime_let"
description = "A `let` inside a function body's `comptime` block binds the module a module-returning `-> type` call reduces to, and calls through it, as `let m = @import(..)` does there (RUE-2445, RUE-2420)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn add(comptime x: i32) -> i32 { x + 1 }
""" },
  { path = "other.rue", source = """
pub fn add(comptime x: i32) -> i32 { x + 20 }
""" },
  { path = "main.rue", source = """
fn f() -> type { @import("lib.rue") }
fn pick(comptime first: bool) -> type { if first { @import("lib.rue") } else { @import("other.rue") } }
fn main() -> i32 {
    let a: i32 = comptime { let m = f(); m.add(1) };
    let b: i32 = comptime { let m = pick(false); let n = m; n.add(20) };
    a + b
}
""" },
]
exit_code = 42

