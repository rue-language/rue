# Cross-module comptime type-function references (RUE-511) and composite type
# values as type-constructor arguments (RUE-565), driven end-to-end through the
# real binary with @imports resolved from disk.
#
# RUE-511: a source-level generic type function (`Wrap(T)`) whose method bodies /
# field types / return types reference a comptime type function imported from
# ANOTHER module (`b.Mk(T)`) used to fail with
#   E1200: cannot store type value in variable 'W' at runtime
# because the comptime evaluator only recognized SAME-file constructor calls.
# The fix resolves module-qualified comptime type calls in field position,
# method-signature position, and value position (`let O = b.Mk(T)`), with a
# membership + visibility check so a same-named constructor in a different file
# cannot satisfy the call (the RUE-564 hole). These cases pin every position AND
# the runtime result of matching the cross-module enum.
#
# RUE-565: composite type VALUES (`[i32; 2]`, nested arrays) are legal
# type-constructor arguments; they used to be rejected with E1201.

[section]
id = "cli.comptime_cross_module"
name = "Cross-module comptime type functions"
description = "Module-qualified comptime type-function references (RUE-511) and composite type arguments (RUE-565)."

[[case]]
name = "cross_module_const_direct_unit_type_value"
description = "A module-qualified durable const initializer accepts the direct Unit type-value spelling."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn Id(comptime T: type) -> type { T }
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
const U = lib.Id(());
fn use(value: U) -> U { value }
fn main() -> i32 {
    use(());
    0
}
""" },
]
exit_code = 0

# --- RUE-511: field-type position ---
[[case]]
name = "cross_module_ctor_field_type"
description = "A generic type function's struct field type references an imported constructor `b.Mk(T)` (RUE-511)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "b.rue", source = """
pub fn Mk(comptime T: type) -> type {
    enum { Some(T), None }
}
""" },
  { path = "a.rue", source = """
const b = @import("b.rue");

pub fn Wrap(comptime T: type) -> type {
    struct {
        inner: b.Mk(T),
        fn make(v: T) -> Self {
            let O = b.Mk(T);
            Self { inner: O.Some(v) }
        }
    }
}
""" },
  { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    let W = a.Wrap(i32);
    let O = b.Mk(i32);
    let w = W.make(42);
    match w.inner {
        O.Some(x) => x,
        O.None => -1,
    }
}
""" },
]
exit_code = 42

[[case]]
name = "cross_module_const_deferred_value_parameter_kind"
description = "A module-qualified type constructor keeps `comptime value: T` in the value stream when reduced as a file constant."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn Witness(comptime T: type, comptime value: T) -> type {
    struct { payload: T }
}
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
const W = lib.Witness(i32, 7);

fn read(w: lib.Witness(i32, 7)) -> i32 {
    w.payload
}

fn main() -> i32 {
    read(W { payload: 42 })
}
""" },
]
exit_code = 42

# --- RUE-511: method return-type + value (let) position ---
[[case]]
name = "cross_module_ctor_return_and_let"
description = "A method returns `b.Mk(T)` and binds `let O = b.Mk(T)` in its body, both cross-module (RUE-511)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "b.rue", source = """
pub fn Mk(comptime T: type) -> type {
    enum { Some(T), None }
}
""" },
  { path = "a.rue", source = """
const b = @import("b.rue");

pub fn Wrap(comptime T: type) -> type {
    struct {
        v: T,
        fn get(borrow self) -> b.Mk(T) {
            let O = b.Mk(T);
            O.Some(self.v)
        }
    }
}
""" },
  { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    let W = a.Wrap(i32);
    let O = b.Mk(i32);
    let w = W { v: 30 };
    match w.get() {
        O.Some(x) => x,
        O.None => -1,
    }
}
""" },
]
exit_code = 30

# --- RUE-511: value position inside the -> type constructor body (delegating) ---
[[case]]
name = "cross_module_ctor_body_let_binding"
description = "A `-> type` constructor binds `let X = b.Mk(T)` in its body and returns X, cross-module (RUE-511)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "b.rue", source = """
pub fn Mk(comptime T: type) -> type {
    enum { Some(T), None }
}
""" },
  { path = "a.rue", source = """
const b = @import("b.rue");

pub fn Alias(comptime T: type) -> type {
    let X = b.Mk(T);
    X
}
""" },
  { path = "main.rue", source = """
const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    let A = a.Alias(i32);
    let O = b.Mk(i32);
    let x = A.Some(7);
    match x {
        O.Some(v) => v,
        O.None => -1,
    }
}
""" },
]
exit_code = 7

# --- RUE-511: privacy — direct resolution of a non-pub imported constructor
# across directories reports the canonical privacy diagnostic. ---
[[case]]
name = "cross_module_ctor_private_rejected"
description = "A non-pub constructor imported from another directory is rejected with the canonical privacy diagnostic before wrapper reduction (RUE-511)."
compile_fail = true
args = ["main.rue", "-o", "prog"]
# Privacy takes precedence at the exact transitive constructor use; the outer
# type constructor must not obscure it with a generic reduction failure.
error_contains = ["E0706", "private"]
files = [
  { path = "sub/b.rue", source = """
fn Mk(comptime T: type) -> type {
    enum { Some(T), None }
}
""" },
  { path = "a.rue", source = """
const b = @import("sub/b.rue");

pub fn Wrap(comptime T: type) -> type {
    struct { inner: b.Mk(T) }
}
""" },
  { path = "main.rue", source = """
const a = @import("a.rue");

fn main() -> i32 {
    let W = a.Wrap(i32);
    0
}
""" },
]

# --- RUE-565: composite (array) type value as a type-constructor argument ---
[[case]]
name = "array_type_arg_local_ctor"
description = "`[i32; 2]` is accepted as a comptime type argument to a local `-> type` constructor (RUE-565)."
files = [{ path = "main.rue", source = """
fn Box(comptime T: type) -> type {
    struct { value: T }
}

fn main() -> i32 {
    let B = Box([i32; 2]);
    let arr: [i32; 2] = [21, 21];
    let b = B { value: arr };
    b.value[0] + b.value[1]
}
""" }]
exit_code = 42

# --- RUE-565: array type value through the std bundle + nested arrays ---
[[case]]
name = "array_type_arg_std_and_nested"
description = "`[i32; 2]` and nested `[[i32; 3]; 2]` are accepted as type arguments to std.option.Option / std.arraybuf.ArrayBuf (RUE-565)."
files = [{ path = "main.rue", source = """
const std = @import("std");

fn Box(comptime T: type) -> type {
    struct { value: T }
}

fn main() -> i32 {
    let A = std.option.Option([i32; 2]);
    let V = std.arraybuf.ArrayBuf([i32; 2]);
    let N = Box([[i32; 3]; 2]);
    let arr: [i32; 2] = [1, 2];
    let x = A.Some(arr);
    match x {
        A.Some(a) => a[0] + a[1],
        A.None => -1,
    }
}
""" }]
env = { RUE_STD_PATH = "${REAL_STD}" }
exit_code = 3

[[case]]
# RUE-552: a MODULE-QUALIFIED value-parameterized constructor applies in
# type position (`lib.Buffer(2)` as a parameter type). This used to fail at
# PARSE time (E0100 at the integer token).
name = "qualified_value_parameterized_ctor_in_type_position"
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn Buffer(comptime N: i32) -> type {
    struct { data: [i32; N] }
}
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");

fn first(b: lib.Buffer(2)) -> i32 {
    b.data[0]
}

fn main() -> i32 {
    let B = lib.Buffer(2);
    first(B { data: [40, 2] })
}
""" },
]
exit_code = 40

[[case]]
# RUE-575: a comptime let-bound alias of a CROSS-MODULE type constructor is
# usable as a field type inside a -> type body.
name = "cross_module_let_alias_in_field_type_position"
args = ["main.rue", "-o", "prog"]
files = [
  { path = "b.rue", source = """
pub fn Mk(comptime T: type) -> type {
    struct { value: T }
}
""" },
  { path = "main.rue", source = """
const b = @import("b.rue");

fn Wrap(comptime T: type) -> type {
    let Inner = b.Mk(T);
    struct { x: Inner }
}

fn main() -> i32 {
    let W = Wrap(i32);
    let I = b.Mk(i32);
    let w: W = W { x: I { value: 42 } };
    w.x.value
}
""" },
]
exit_code = 42

# --- RUE-993: named struct fields retaining specializations whose ctor
# bodies contain module-qualified nested constructor calls. Field-type
# resolution reduces the ctor body during declaration binding, before the
# defining file's import constants are collected; the nested `mk.Mk(T)` /
# `arraybuf.ArrayBuf(u64)` receiver must resolve through the declaration
# namespace (on-demand), not the raw binding table, or the whole reduction
# silently degrades to E1200. ---
[[case]]
name = "struct_field_retains_ctor_with_nested_module_call"
description = "A named struct retains `wrap.Wrap(i32)` whose body opens with `let Inner = mk.Mk(T)` from a third module (RUE-993)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "mk.rue", source = """
pub fn Mk(comptime T: type) -> type {
    struct { value: T }
}
""" },
  { path = "wrap.rue", source = """
const mk = @import("mk.rue");

pub fn Wrap(comptime T: type) -> type {
    let Inner = mk.Mk(T);
    struct {
        inner: Inner,
        fn make(v: T) -> Self {
            let I = mk.Mk(T);
            Self { inner: I { value: v } }
        }
        fn get(borrow self) -> T { self.inner.value }
    }
}
""" },
  { path = "main.rue", source = """
const wrap = @import("wrap.rue");

pub struct Holder {
    w: wrap.Wrap(i32),

    fn new() -> Self {
        let W = wrap.Wrap(i32);
        Self { w: W.make(7) }
    }
}

fn main() -> i32 {
    let h = Holder.new();
    h.w.get()
}
""" },
]
exit_code = 7

[[case]]
name = "struct_field_retains_std_strmap_specialization"
description = "A public cross-module struct retains `std.strmap.StrMap(u64)` as a field and uses it at runtime (RUE-993)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
files = [
  { path = "pool.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
const OptU64 = std.option.Option(u64);

pub struct Pool {
    index: std.strmap.StrMap(u64),

    fn new() -> Self {
        let M = std.strmap.StrMap(u64);
        Self { index: M.new(0) }
    }

    fn put(inout self, borrow key: StrBuf, value: u64) {
        self.index.insert(borrow key, value);
    }

    fn get_or(borrow self, borrow key: StrBuf, fallback: u64) -> u64 {
        match self.index.get(borrow key) { OptU64.Some(v) => v, OptU64.None => fallback }
    }
}
""" },
  { path = "main.rue", source = """
const std = @import("std");
const pool = @import("pool.rue");

fn main() -> i32 {
    let mut p = pool.Pool.new();
    let k1: std.strbuf.StrBuf = "alpha";
    let k2: std.strbuf.StrBuf = "beta";
    let absent: std.strbuf.StrBuf = "absent";
    p.put(borrow k1, 11);
    p.put(borrow k2, 22);
    println(@to_string(p.get_or(borrow k1, 0)));
    println(@to_string(p.get_or(borrow k2, 0)));
    println(@to_string(p.get_or(borrow absent, 99)));
    0
}
""" },
]
exit_code = 0
stdout = "11\n22\n99\n"

# RUE-2417: a module-qualified call to a `-> type` function reduces at compile
# time exactly as the unqualified call does (spec 4.14:5a, 4.14:28), in every
# position, and a module-qualified call that cannot reduce is rejected at the
# call rather than reaching codegen (spec 4.14:6).

[[case]]
name = "cross_module_zero_param_type_ctor_discarded_statement"
description = "A discarded module-qualified zero-parameter `-> type` call reduces at compile time; it was an internal error (RUE-2417)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn Foo() -> type { i32 }
pub fn Bar(comptime T: type) -> type { T }
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
fn main() -> i32 {
    lib.Foo();
    lib.Bar(i32);
    42
}
""" },
]
exit_code = 42

[[case]]
name = "cross_module_zero_param_type_ctor_as_comptime_type_argument"
description = "A module-qualified zero-parameter `-> type` call supplies a `comptime T: type` argument, like the unqualified call (RUE-2417)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn Foo() -> type { i32 }
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
fn first(comptime T: type, a: T) -> T { a }
fn main() -> i32 {
    let L = lib.Foo();
    let x: L = first(lib.Foo(), 42);
    x
}
""" },
]
exit_code = 42

[[case]]
name = "cross_module_runtime_param_type_call_rejected"
description = "A module-qualified call to a `-> type` function with a runtime parameter is rejected at the call; it was an internal error (RUE-2417)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn pick(c: bool) -> type { if c { i32 } else { i64 } }
""" },
  { path = "main.rue", source = """
const lib = @import("lib.rue");
fn main() -> i32 {
    let c = true;
    lib.pick(c);
    42
}
""" },
]
compile_fail = true
error_contains = ["E1200", "this call produces a type value at runtime; a `type` result requires a fully-comptime call"]

[[case]]
name = "module_returning_type_call_rejected_not_ice"
description = "A call to a `-> type` function whose body is an `@import` does not reduce in call position; it is rejected at the call rather than reaching codegen, and — having zero parameters — without the runtime-parameter help, which would point at a condition the call already meets (RUE-2417)."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "lib.rue", source = """
pub fn f() -> i32 { 42 }
""" },
  { path = "main.rue", source = """
fn m() -> type { @import("lib.rue") }
fn main() -> i32 {
    m();
    42
}
""" },
]
compile_fail = true
error_contains = ["E1200", "this function's body does not reduce to a type at compile time"]
compile_stderr_not_contains = ["every parameter of the function is `comptime`"]
