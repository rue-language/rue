# =============================================================================
# S8 — struct, 8 narrow slots: 32 bytes, so four eightbytes to the convention
# =============================================================================

# param by-value -> return -> control-flow join, all eight slots survive
# (RUE-13 class: wide by-value aggregates once ICE'd / dropped slots). Its
# eight narrow leaves pack into four eightbytes, which cross through the
# value's compact image in both directions.
[[case]]
name = "s8_param_return_join"
files = [{ path = "main.rue", source = """
struct S8 { a: i32, b: i32, c: i32, d: i32, e: i32, f: i32, g: i32, h: i32 }
fn id(s: S8) -> S8 { s }
fn pick(cond: bool) -> S8 {
    let x = S8 { a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8 };
    let y = S8 { a: 10, b: 20, c: 30, d: 40, e: 50, f: 60, g: 70, h: 80 };
    if cond { x } else { y }
}
fn main() -> i32 {
    let v = id(pick(false));
    @dbg(v.a); @dbg(v.d); @dbg(v.h);
    0
}
""" }]
stdout = "10\n40\n80\n"

