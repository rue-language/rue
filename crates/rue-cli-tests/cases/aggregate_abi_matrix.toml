# by-value returns of growing payload enums (RUE-946). An enum is one
# discriminant plus its widest payload, and its result is classified by the
# compact image those occupy against the native return bank — six
# general-purpose result registers on x86-64 and eight on aarch64 — so a value
# past the bank comes back through the row's indirect-result register instead of
# indexing past the result-register array. These sizes straddle both banks, and
# each case prints a position-weighted payload sum, so any single dropped or
# misrouted eightbyte changes the output.

# A five-i32 payload.
[[case]]
name = "enum_return_at_x86_budget"
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum E { V(i32, i32, i32, i32, i32), Empty }
fn make() -> E { E.V(1, 2, 3, 4, 5) }
fn weighted(e: E) -> i32 {
    match e {
        E.V(a, b, c, d, e) => a * 1 + b * 2 + c * 3 + d * 4 + e * 5,
        E.Empty => -1,
    }
}
fn main() -> i32 {
    @dbg(weighted(make()));
    0
}
""" }]
stdout = "55\n"

