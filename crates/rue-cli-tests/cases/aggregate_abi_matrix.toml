enum E { V(i32, i32), Empty }
fn sum(e: E) -> i32 { match e { E.V(x, y) => x + y, E.Empty => 0 } }
struct Wrap { e: E, tag: i32 }
fn main() -> i32 {
    let mut w = Wrap { e: E.Empty, tag: 9 };
    w.e = E.V(7, 8);
    @dbg(sum(w.e)); @dbg(w.tag);
    0
}
""" }]
stdout = "15\n9\n"

