fn pick(cond: bool) -> S8 {
    let x = S8 { a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8 };
    let y = S8 { a: 10, b: 20, c: 30, d: 40, e: 50, f: 60, g: 70, h: 80 };
    if cond { x } else { y }
}
fn main() -> i32 {
    let v = id(pick(false));
    @dbg(v.a); @dbg(v.d); @dbg(v.h);
    0
}
""" }]
