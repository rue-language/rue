# ADR-0043 Phase 1 slice runtime — executable regression tests (RUE-322).
#
# The second-class slice `[T]` is a two-word fat pointer `{ptr, len}` modeled as
# a synthetic `@copy` struct (so it reuses the multi-slot aggregate ABI, struct
# field reads, and by-value parameter passing — no new codegen, both backends).
# A `borrow s: [T]` parameter is passed by value; `borrow arr` at the call site
# materializes `{ptr: @raw(arr[0]), len: N}`; `s.len()` reads the runtime `len`
# word; and `s[i]` lowers to `@ptr_read(@ptr_offset(ptr, i))` guarded by a
# runtime bounds check that traps (exit 101) like array indexing.
#
# Deferred to later phases (still reported cleanly, not runnable here):
# `inout [T]` write-slices, range slicing `x[a..b]`, ArrayBuf/Vec slices, and
# returning/storing a slice (E0487-E0489 second-class enforcement).
#
# Under the default compact layout these cases view a slot-identical backing
# element type (i64: one eight-byte slot per element). The view is materialized
# as `{ptr: @raw(arr[0]), len: N}` and indexed by `@ptr_offset(ptr, i)`, which
# strides by `size_of(T)`; for a slot-identical element that stride equals the
# frame's slot stride, so a frame-array view is exact. A slice over a frame array
# of a NON-slot-identical element (e.g. `[i32]`/`[u8]`, whose compact stride is
# narrower than the 8-byte frame slot) would stride across mismatched storage and
# is refused loudly (RUE-987 / RUE-1035 M2); `slice_param_narrow_frame_refused`
# pins that. The slice runtime itself (len, bounds-checked indexing, forwarding,
# methods) is element-width-independent and is exercised here on i64.

[section]
id = "cli.slices"
name = "Slice runtime (ADR-0043 Phase 1)"
description = "borrow-a-whole-array slice parameter: len() and bounds-checked read-indexing."

# The canonical verify-by-execution case from RUE-322: sum a borrowed array
# through a `borrow s: [i32]` slice parameter using `s.len()` and `s[i]`.
[[case]]
name = "slice_param_sum_len_index"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [i64]) -> i32 {
    let mut t: i64 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + s[i];
        i = i + 1;
    }
    @intCast(t)
}
fn main() -> i32 {
    let a: [i64; 3] = [10, 20, 30];
    sum(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 60

# Out-of-bounds read-index through a slice parameter must trap at runtime with
# the same abort discipline as array indexing (exit 101).
[[case]]
name = "slice_param_index_out_of_bounds_traps"
files = [{ path = "main.rue", source = """
fn get(borrow s: [i64], i: u64) -> i32 {
    @intCast(s[i])
}
fn main() -> i32 {
    let a: [i64; 3] = [10, 20, 30];
    get(borrow a, 5)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 101

# Signed negative indices must trap too. Slice indexing should match array
# bounds semantics: any index below zero is out of bounds, not a huge pointer
# offset or a read before the backing array.
[[case]]
name = "slice_param_negative_signed_index_traps"
files = [{ path = "main.rue", source = """
fn get(borrow s: [i64], i: i32) -> i32 {
    @intCast(s[i])
}
fn main() -> i32 {
    let a: [i64; 3] = [10, 20, 30];
    get(borrow a, -1)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 101

# A constant read-index resolves the element position (discriminating value: the
# middle element 5 catches an off-by-one or wrong-stride lowering).
[[case]]
name = "slice_param_constant_index"
files = [{ path = "main.rue", source = """
fn second(borrow s: [i64]) -> i32 {
    @intCast(s[1])
}
fn main() -> i32 {
    let a: [i64; 4] = [3, 5, 7, 9];
    second(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 5

# `.len()` returns the runtime length word (whole-array borrow -> N).
[[case]]
name = "slice_param_len"
files = [{ path = "main.rue", source = """
fn ln(borrow s: [i64]) -> i32 {
    @intCast(s.len())
}
fn main() -> i32 {
    let a: [i64; 6] = [9, 9, 9, 9, 9, 9];
    ln(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 6

# A `[u8]` view over a frame array is refused under the compact layout: the
# slice would stride `@ptr_offset` by the compact element size (1) while the
# frame stores each `u8` element in an 8-byte slot, so the pointer walk crosses
# mismatched storage. The refusal is loud (RUE-987 / RUE-1035 M2) and names the
# frame aggregate. A slot-identical element (see the i64 cases above) is exact;
# a heap-backed narrow slice awaits compact frames (RUE-975) / a heap slice API.
[[case]]
name = "slice_param_narrow_frame_refused"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [u8]) -> i32 {
    let mut t: i32 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + @intCast(s[i]);
        i = i + 1;
    }
    t
}
fn main() -> i32 {
    let a: [u8; 4] = [1, 2, 3, 4];
    sum(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["raw pointer", "frame-resident aggregate"]

# Borrowing a zero-length fixed array still produces a valid zero-length slice:
# the pointer word is never dereferenced because `len()` is 0. This used to ICE
# while trying to materialize the slice pointer as `@raw(arr[0])`.
[[case]]
name = "slice_param_empty_array_len_zero"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [i32]) -> i32 {
    let mut t = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + s[i];
        i = i + 1;
    }
    t + @intCast(s.len())
}
fn main() -> i32 {
    let a: [i32; 0] = [];
    sum(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 0

# A slice parameter can be forwarded to another slice parameter (`borrow s`
# where `s` is itself a slice): the fat pointer is passed through by value
# rather than re-materialized.
[[case]]
name = "slice_param_forwarding"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [i64]) -> i32 {
    let mut t: i64 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + s[i];
        i = i + 1;
    }
    @intCast(t)
}
fn outer(borrow s: [i64]) -> i32 {
    sum(borrow s)
}
fn main() -> i32 {
    let a: [i64; 3] = [10, 20, 30];
    outer(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 60

# User-defined methods and associated functions share the same view
# materialization contract as free functions. Direct array arguments exercise
# the method-signature inference seam as well as the AIR lowering seam.
[[case]]
name = "method_and_assoc_slice_view_coercions"
files = [{ path = "main.rue", source = """
struct Sum {
    bias: i32,

    fn method(borrow self, borrow s: [i64]) -> i32 {
        self.bias + @intCast(s[0] + s[1])
    }

    fn assoc(borrow s: [i64]) -> i32 {
        @intCast(s[0] + s[1])
    }
}

fn main() -> i32 {
    let values: [i64; 2] = [5, 7];
    let sum = Sum { bias: 18 };
    sum.method(borrow values) + Sum.assoc(borrow values)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# Forwarding an existing slice is a distinct physical case: the two-word view
# must pass through by value (Normal AIR mode), not become a one-word Borrow
# argument merely because the source still spells `borrow`.
[[case]]
name = "method_and_assoc_forward_slice_view"
files = [{ path = "main.rue", source = """
struct Sum {
    bias: i32,

    fn method(borrow self, borrow s: [i64]) -> i32 {
        self.bias + @intCast(s[0] + s[1])
    }

    fn assoc(borrow s: [i64]) -> i32 {
        @intCast(s[0] + s[1])
    }
}

fn forward(borrow s: [i64]) -> i32 {
    let sum = Sum { bias: 18 };
    sum.method(borrow s) + Sum.assoc(borrow s)
}

fn main() -> i32 {
    let values: [i64; 2] = [5, 7];
    forward(borrow values)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# Passing an array whose element type does not match the slice element type is
# a clean compile error (the coercion validates element compatibility, since
# inference relaxes the whole-type equality for slice parameters).
[[case]]
name = "slice_param_element_mismatch"
files = [{ path = "main.rue", source = """
fn h(borrow s: [u8]) -> i32 { 0 }
fn main() -> i32 {
    let a: [i32; 3] = [1, 2, 3];
    h(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["type mismatch"]

# Passing the removed feature name uses the ordinary unknown-preview error.
[[case]]
name = "slices_preview_name_is_unknown"
files = [{ path = "main.rue", source = """
fn ln(borrow s: [i32]) -> i32 { @intCast(s.len()) }
fn main() -> i32 {
    let a: [i32; 2] = [1, 2];
    ln(borrow a)
}
""" }]
args = ["main.rue", "--preview", "slices", "-o", "prog"]
compile_fail = true
error_contains = ["unknown preview feature", "slices"]
