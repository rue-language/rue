# ADR-0043 Phase 1 slice runtime — executable regression tests (RUE-322).
#
# The second-class slice `[T]` is a two-word fat pointer `{ptr, len}` modeled as
# a synthetic `@copy` struct (so it reuses the multi-slot aggregate ABI, struct
# field reads, and by-value parameter passing — no new codegen, both backends).
# A `borrow s: [T]` parameter is passed by value; `borrow arr` at the call site
# materializes `{ptr: @raw(arr[0]), len: N}`; `s.len()` reads the runtime `len`
# word; and `s[i]` lowers to `@ptr_read(@ptr_offset(ptr, i))` guarded by a
# runtime bounds check that traps (exit 101) like array indexing.
#
# Deferred to later phases (still reported cleanly, not runnable here):
# `inout [T]` write-slices, range slicing `x[a..b]`, ArrayBuf/Vec slices, and
# returning/storing a slice (E0487-E0489 second-class enforcement).
#
# Under the default compact layout these cases view a slot-identical backing
# element type (i64: one eight-byte slot per element). The view is materialized
# as `{ptr: @raw(arr[0]), len: N}` and indexed by `@ptr_offset(ptr, i)`, which
# strides by `size_of(T)`; for a slot-identical element that stride equals the
# frame's slot stride, so a frame-array view is exact. A slice over a frame array
# of a NON-slot-identical element (e.g. `[i32]`/`[u8]`, whose compact stride is
# narrower than the 8-byte frame slot) would stride across mismatched storage and
# is refused loudly (RUE-987 / RUE-1035 M2); `slice_param_narrow_frame_refused`
# pins that. The slice runtime itself (len, bounds-checked indexing, forwarding,
# methods) is element-width-independent and is exercised here on i64.
#
# The element type does not have to be a scalar. A struct built from slot-width
# fields is slot-identical too, so `[S]` and `[P]` views coerce and stride by
# the element's whole size; the `struct_element_*` cases below cover that
# family, including the multi-slot stride and the aggregate form of the same
# narrow-element refusal (RUE-1610).

[section]
id = "cli.slices"
name = "Slice runtime (ADR-0043 Phase 1)"
description = "borrow-a-whole-array slice parameter: len() and bounds-checked read-indexing."

# The canonical verify-by-execution case from RUE-322: sum a borrowed array
# through a `borrow s: [i32]` slice parameter using `s.len()` and `s[i]`.
[[case]]
name = "slice_param_sum_len_index"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [i64]) -> i32 {
    let mut t: i64 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + s[i];
        i = i + 1;
    }
    @intCast(t)
}
fn main() -> i32 {
    let a: [i64; 3] = [10, 20, 30];
    sum(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 60

# Out-of-bounds read-index through a slice parameter must trap at runtime with
# the same abort discipline as array indexing (exit 101).
[[case]]
name = "slice_param_index_out_of_bounds_traps"
files = [{ path = "main.rue", source = """
fn get(borrow s: [i64], i: u64) -> i32 {
    @intCast(s[i])
}
fn main() -> i32 {
    let a: [i64; 3] = [10, 20, 30];
    get(borrow a, 5)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 101

# Signed negative indices must trap too. Slice indexing should match array
# bounds semantics: any index below zero is out of bounds, not a huge pointer
# offset or a read before the backing array.
[[case]]
name = "slice_param_negative_signed_index_traps"
files = [{ path = "main.rue", source = """
fn get(borrow s: [i64], i: i32) -> i32 {
    @intCast(s[i])
}
fn main() -> i32 {
    let a: [i64; 3] = [10, 20, 30];
    get(borrow a, -1)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 101

# A constant read-index resolves the element position (discriminating value: the
# middle element 5 catches an off-by-one or wrong-stride lowering).
[[case]]
name = "slice_param_constant_index"
files = [{ path = "main.rue", source = """
fn second(borrow s: [i64]) -> i32 {
    @intCast(s[1])
}
fn main() -> i32 {
    let a: [i64; 4] = [3, 5, 7, 9];
    second(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 5

# `.len()` returns the runtime length word (whole-array borrow -> N).
[[case]]
name = "slice_param_len"
files = [{ path = "main.rue", source = """
fn ln(borrow s: [i64]) -> i32 {
    @intCast(s.len())
}
fn main() -> i32 {
    let a: [i64; 6] = [9, 9, 9, 9, 9, 9];
    ln(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 6

# A narrow-element view over a frame array is refused at the source-level
# coercion boundary: the compact element stride differs from the frame slot
# stride. The stable diagnostic names the actual restriction and does not leak
# the backend's raw-pointer implementation. A slot-identical element (see the
# i64 cases above) is exact; a heap-backed narrow slice awaits compact frames
# (RUE-975) / a heap slice API.
[[case]]
name = "slice_param_narrow_frame_refused"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [u8]) -> i32 {
    let mut t: i32 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + @intCast(s[i]);
        i = i + 1;
    }
    t
}
fn main() -> i32 {
    let a: [u8; 4] = [1, 2, 3, 4];
    sum(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0908", "frame array", "non-slot-width", "coerce or borrow", "u8"]
compile_stderr_not_contains = ["E9001", "@raw", "@ptr_offset", "@alloc", "heap"]

# The same source-level restriction applies to a four-byte element. Keep this
# separate from the u8 case so both compact widths remain covered.
[[case]]
name = "slice_param_i32_narrow_frame_refused"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [i32]) -> i32 {
    let mut t: i32 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + s[i];
        i = i + 1;
    }
    t
}
fn main() -> i32 {
    let a: [i32; 3] = [1, 2, 3];
    sum(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0908", "frame array", "non-slot-width", "coerce or borrow", "i32"]
compile_stderr_not_contains = ["E9001", "@raw", "@ptr_offset", "@alloc", "heap"]

# Borrowing a zero-length fixed array still produces a valid zero-length slice:
# the pointer word is never dereferenced because `len()` is 0. This used to ICE
# while trying to materialize the slice pointer as `@raw(arr[0])`.
[[case]]
name = "slice_param_empty_array_len_zero"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [i32]) -> i32 {
    let mut t = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + s[i];
        i = i + 1;
    }
    t + @intCast(s.len())
}
fn main() -> i32 {
    let a: [i32; 0] = [];
    sum(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 0

# A slice parameter can be forwarded to another slice parameter (`borrow s`
# where `s` is itself a slice): the fat pointer is passed through by value
# rather than re-materialized.
[[case]]
name = "slice_param_forwarding"
files = [{ path = "main.rue", source = """
fn sum(borrow s: [i64]) -> i32 {
    let mut t: i64 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        t = t + s[i];
        i = i + 1;
    }
    @intCast(t)
}
fn outer(borrow s: [i64]) -> i32 {
    sum(borrow s)
}
fn main() -> i32 {
    let a: [i64; 3] = [10, 20, 30];
    outer(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 60

# User-defined methods and associated functions share the same view
# materialization contract as free functions. Direct array arguments exercise
# the method-signature inference seam as well as the AIR lowering seam.
[[case]]
name = "method_and_assoc_slice_view_coercions"
files = [{ path = "main.rue", source = """
struct Sum {
    bias: i32,

    fn method(borrow self, borrow s: [i64]) -> i32 {
        self.bias + @intCast(s[0] + s[1])
    }

    fn assoc(borrow s: [i64]) -> i32 {
        @intCast(s[0] + s[1])
    }
}

fn main() -> i32 {
    let values: [i64; 2] = [5, 7];
    let sum = Sum { bias: 18 };
    sum.method(borrow values) + Sum.assoc(borrow values)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# Forwarding an existing slice is a distinct physical case: the two-word view
# must pass through by value (Normal AIR mode), not become a one-word Borrow
# argument merely because the source still spells `borrow`.
[[case]]
name = "method_and_assoc_forward_slice_view"
files = [{ path = "main.rue", source = """
struct Sum {
    bias: i32,

    fn method(borrow self, borrow s: [i64]) -> i32 {
        self.bias + @intCast(s[0] + s[1])
    }

    fn assoc(borrow s: [i64]) -> i32 {
        @intCast(s[0] + s[1])
    }
}

fn forward(borrow s: [i64]) -> i32 {
    let sum = Sum { bias: 18 };
    sum.method(borrow s) + Sum.assoc(borrow s)
}

fn main() -> i32 {
    let values: [i64; 2] = [5, 7];
    forward(borrow values)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# Passing an array whose element type does not match the slice element type is
# a clean compile error (the coercion validates element compatibility, since
# inference relaxes the whole-type equality for slice parameters).
[[case]]
name = "slice_param_element_mismatch"
files = [{ path = "main.rue", source = """
fn h(borrow s: [u8]) -> i32 { 0 }
fn main() -> i32 {
    let a: [i32; 3] = [1, 2, 3];
    h(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["type mismatch"]

# --- Struct element types (RUE-1610) -----------------------------------------
#
# A slice element may be any type the coercion admits (7.2:2, 7.2:14), and a
# struct built from slot-width fields qualifies. The failing shape was a callee
# that measures the view without ever naming the element type: the element's
# nominal reached the callee's CFG epoch only through the view's `ptr` field, a
# route that carried no nominal at all, so the body failed to materialize with
# an internal error. These cases exercise both routes — a body that only calls
# `len` (no mention of `S` anywhere) and a body that reads elements out.

[[case]]
name = "struct_element_slice_len"
description = "RUE-1610 repro: a `[S]` view whose callee never names `S` compiles and measures the view."
files = [{ path = "main.rue", source = """
struct S { v: i64 }
fn ln(borrow s: [S]) -> i32 {
    @intCast(s.len())
}
fn main() -> i32 {
    let a: [S; 2] = [S { v: 1 }, S { v: 2 }];
    ln(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 2
compile_stderr_not_contains = ["E9000", "internal compiler error", "MissingNominal"]

[[case]]
name = "struct_element_slice_index_and_len"
description = "Reading struct elements out of a view: positions match the backing array and the length word is the array length."
files = [{ path = "main.rue", source = """
struct S { v: i64 }
fn total(borrow s: [S]) -> i32 {
    let mut acc: i64 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        let e = s[i];
        acc = acc + e.v;
        i = i + 1;
    }
    @intCast(acc) + @intCast(s.len())
}
fn main() -> i32 {
    let a: [S; 3] = [S { v: 10 }, S { v: 20 }, S { v: 9 }];
    total(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "struct_element_slice_index_out_of_bounds_traps"
description = "The bounds check is element-type-independent: a struct-element view traps (exit 101) on an out-of-range index."
files = [{ path = "main.rue", source = """
struct S { v: i64 }
fn pick(borrow s: [S], i: u64) -> i32 {
    let e = s[i];
    @intCast(e.v)
}
fn main() -> i32 {
    let a: [S; 2] = [S { v: 7 }, S { v: 8 }];
    pick(borrow a, 5)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 101

# A multi-slot element is the stride case: an element of two i64 fields is
# slot-identical but sixteen bytes wide, so a view that strided by one slot
# would read the wrong halves of the wrong elements. The discriminating value
# depends on every element being read whole and in order.
[[case]]
name = "struct_element_slice_multi_slot_stride"
description = "A two-slot struct element (`{i64, i64}`) is viewed with the element's own stride, not the slot stride."
files = [{ path = "main.rue", source = """
struct P { a: i64, b: i64 }
fn fold(borrow s: [P]) -> i32 {
    let mut acc: i64 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        let e = s[i];
        acc = acc * 10 + e.a * 2 + e.b;
        i = i + 1;
    }
    @intCast(acc)
}
fn main() -> i32 {
    let a: [P; 3] = [P { a: 0, b: 1 }, P { a: 1, b: 0 }, P { a: 1, b: 3 }];
    fold(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 125

# A nested aggregate element keeps its inner layout through the view.
[[case]]
name = "struct_element_slice_nested_aggregate"
description = "An element whose own field is a struct is read out whole: the inner field is reachable through the copy."
files = [{ path = "main.rue", source = """
struct Inner { a: i64 }
struct Outer { i: Inner, b: i64 }
fn pick(borrow s: [Outer]) -> i32 {
    let e = s[1];
    @intCast(e.i.a * 10 + e.b + @intCast(s.len()))
}
fn main() -> i32 {
    let a: [Outer; 2] = [
        Outer { i: Inner { a: 1 }, b: 2 },
        Outer { i: Inner { a: 4 }, b: 0 },
    ];
    pick(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# A view does not own what it views (7.2:2), so a droppable element type is
# dropped exactly once each, by the frame that owns the backing array, after
# the viewing call has returned. Exact stdout pins the drop ORDER.
[[case]]
name = "struct_element_slice_does_not_drop_the_viewed_elements"
description = "Viewing an array of a droppable struct runs each element's destructor once, in the backing array's own drop order, after the call."
files = [{ path = "main.rue", source = """
struct D { v: i64 }

drop fn D(self) {
    @dbg(self.v);
}

fn ln(borrow s: [D]) -> i32 {
    @intCast(s.len())
}

fn main() -> i32 {
    let a: [D; 3] = [D { v: 1 }, D { v: 2 }, D { v: 3 }];
    let n = ln(borrow a);
    @dbg(99);
    n
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 3
stdout = "99\n1\n2\n3\n"

[[case]]
name = "struct_element_slice_empty_view"
description = "An empty array of a struct element still coerces: the pointer word is never dereferenced."
files = [{ path = "main.rue", source = """
struct S { v: i64 }
fn ln(borrow s: [S]) -> i32 {
    @intCast(s.len())
}
fn main() -> i32 {
    let a: [S; 0] = [];
    ln(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 0

# The layout restriction of `slice_param_narrow_frame_refused` applies to an
# aggregate element too: a struct holding an i32 field is not slot-identical,
# and the diagnostic names the struct.
[[case]]
name = "struct_element_with_narrow_field_refused"
description = "A struct element holding a narrow field is refused at the coercion boundary with E0908 naming the struct."
files = [{ path = "main.rue", source = """
struct N { v: i32 }
fn ln(borrow s: [N]) -> i32 {
    @intCast(s.len())
}
fn main() -> i32 {
    let a: [N; 2] = [N { v: 1 }, N { v: 2 }];
    ln(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0908", "non-slot-width", "coerce or borrow", "N"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "MissingNominal"]

# The element's nominal has to travel across a module boundary too: the callee
# lives in the imported module and the backing array in the root module.
[[case]]
name = "struct_element_slice_across_modules"
description = "A struct element declared in an imported module is carried into both the measuring and the reading callee (RUE-1610)."
files = [
    { path = "main.rue", source = """
const h = @import("helper.rue");

fn main() -> i32 {
    let a: [h.S; 3] = [h.S { v: 10 }, h.S { v: 20 }, h.S { v: 9 }];
    @intCast(h.total(borrow a) + h.count(borrow a))
}
""" },
    { path = "helper.rue", source = """
pub struct S { v: i64 }

pub fn total(borrow s: [S]) -> i64 {
    let mut acc: i64 = 0;
    let mut i: u64 = 0;
    while i < s.len() {
        let e = s[i];
        acc = acc + e.v;
        i = i + 1;
    }
    acc
}

pub fn count(borrow s: [S]) -> i64 {
    @intCast(s.len())
}
""" },
]
args = ["main.rue", "-o", "prog"]
exit_code = 42

# --- `len` result typing (RUE-1611) ------------------------------------------
#
# `s.len()` is `u64` (7.2:17). It used to take no part in inference — the view
# has no declared method, so the call typed as the error type, which unified
# with any annotation — and a mismatched binding reached CFG verification as a
# u64 value in an i32 slot, reported as an internal error. It is an ordinary
# type mismatch at the binding now.
[[case]]
name = "slice_len_mismatched_annotation_is_e0206"
description = "RUE-1611 repro: `let n: i32 = s.len();` is E0206 at the binding, not a CFG verification ICE."
files = [{ path = "main.rue", source = """
fn ln(borrow s: [i64]) -> i32 {
    let n: i32 = s.len();
    n
}
fn main() -> i32 {
    let a: [i64; 2] = [1, 2];
    ln(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected i32, found u64"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification"]

[[case]]
name = "slice_len_u64_annotation_stays_legal"
description = "Control: the exact `u64` annotation of the same call is accepted."
files = [{ path = "main.rue", source = """
fn ln(borrow s: [i64]) -> i32 {
    let n: u64 = s.len();
    @intCast(n)
}
fn main() -> i32 {
    let a: [i64; 5] = [1, 2, 3, 4, 5];
    ln(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 5

[[case]]
name = "slice_len_intcast_to_i32_stays_legal"
description = "Control: an explicit conversion of the length reaches a narrower type, in a binding and in an expression."
files = [{ path = "main.rue", source = """
fn ln(borrow s: [i64]) -> i32 {
    let n: i32 = @intCast(s.len());
    n + @intCast(s.len())
}
fn main() -> i32 {
    let a: [i64; 3] = [1, 2, 3];
    ln(borrow a)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 6

# The unannotated binding keeps the call's own type: `n` is the u64 length, so
# it still needs a conversion to reach the i32 return.
[[case]]
name = "slice_len_unannotated_binding_is_u64"
description = "Control: `let n = s.len();` binds a u64, and a comparison against another u64 length is exact."
files = [{ path = "main.rue", source = """
fn same(borrow s: [i64], borrow t: [i64]) -> i32 {
    let n = s.len();
    if n == t.len() { 7 } else { 3 }
}
fn main() -> i32 {
    let a: [i64; 2] = [1, 2];
    let b: [i64; 2] = [3, 4];
    same(borrow a, borrow b)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 7

# Passing the removed feature name uses the ordinary unknown-preview error.
[[case]]
name = "slices_preview_name_is_unknown"
files = [{ path = "main.rue", source = """
fn ln(borrow s: [i32]) -> i32 { @intCast(s.len()) }
fn main() -> i32 {
    let a: [i32; 2] = [1, 2];
    ln(borrow a)
}
""" }]
args = ["main.rue", "--preview", "slices", "-o", "prog"]
compile_fail = true
error_contains = ["unknown preview feature", "slices"]
