# Generated Rue callbacks cross the hosted pthread boundary on every native
# platform via the existing `scripts/rue cli abi` CI selection.

[section]
id = "cli.abi_parallel_lifecycle"
name = "Structured join callback ABI and lifetime"
description = "Real native callbacks preserve their context ABI, concurrent progress, and failure/cleanup contract."

[[case]]
name = "abi_parallel_generic_context_layouts"
description = "Repeated forwarded joins retain narrow fields, mixed GP/FP aggregates, empty contexts, and caller-owned linear obligations."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["--preview", "concurrency", "-O3", "main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");

struct Small { a: u8, b: u16, c: u32 }
struct Wide { a: i64, b: f64, c: u8, d: [i64; 3] }
struct Empty {}
linear struct Ticket { n: i64 }

fn small_step(inout value: Small) {
    value.a += 1;
    value.b += 2;
    value.c += 3;
}

fn wide_step(inout value: Wide) {
    value.a += 4;
    value.b += 0.5;
    value.c += 1;
    value.d[2] += 1;
}

fn empty_step(inout value: Empty) {}
fn ticket_step(inout value: Ticket) {}

fn relay(comptime A: type, comptime B: type, inout left: A, inout right: B,
         left_fn: fn(inout A), right_fn: fn(inout B))
    -> std.result.Result((), std.parallel.SpawnError) {
    std.parallel.join_inout(A, B, inout left, inout right, left_fn, right_fn)
}

fn require_ok(result: std.result.Result((), std.parallel.SpawnError)) {
    let R = std.result.Result((), std.parallel.SpawnError);
    match result {
        R.Ok(_) => (),
        R.Err(_) => @panic("unexpected launch failure"),
    };
}

fn main() -> i32 {
    let mut small = Small { a: 1, b: 2, c: 3 };
    let mut wide = Wide { a: 10, b: 1.5, c: 0, d: [10, 20, 30] };
    let mut i: u64 = 0;
    while i < 10 {
        require_ok(relay(Small, Wide, inout small, inout wide, small_step, wide_step));
        @assert(small.a == @intCast(i + 2));
        i += 1;
    }
    @assert(small.a == 11 && small.b == 22 && small.c == 33);
    @assert(wide.a == 50 && wide.b == 6.5 && wide.c == 10 && wide.d[2] == 40);
    let mut empty = Empty {};
    let mut ticket = Ticket { n: 42 };
    require_ok(relay(Empty, Ticket, inout empty, inout ticket, empty_step, ticket_step));
    @intCast(ticket.n)
}
""" }]
exit_code = 42

[[case]]
name = "abi_parallel_callbacks_make_concurrent_progress"
concurrency_observation = "progress"
description = "Each callback publishes a directory then waits for its peer. A serial implementation cannot complete, and fresh case directories prevent stale markers from satisfying the rendezvous."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["--preview", "concurrency", "-O3", "main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
struct Work { own: StrBuf, peer: StrBuf, observed: bool }

fn exists(borrow path: StrBuf) -> bool {
    let R = std.result.Result(std.fs.Metadata, std.fs.FileError);
    match std.fs.metadata(borrow path) {
        R.Ok(_) => true,
        R.Err(error) => match error {
            std.fs.FileError.NotFound => false,
            _ => @panic("metadata failed"),
        },
    }
}

fn rendezvous(inout work: Work) {
    let R = std.result.Result((), std.fs.FileError);
    match std.fs.create_dir(borrow work.own) {
        R.Ok(_) => (),
        R.Err(_) => @panic("publish failed"),
    };
    while !exists(borrow work.peer) {}
    work.observed = true;
}

fn main() -> i32 {
    let mut left = Work {
        own: StrBuf.from_str(borrow "left-ready"),
        peer: StrBuf.from_str(borrow "right-ready"),
        observed: false,
    };
    let mut right = Work {
        own: StrBuf.from_str(borrow "right-ready"),
        peer: StrBuf.from_str(borrow "left-ready"),
        observed: false,
    };
    let R = std.result.Result((), std.parallel.SpawnError);
    match std.parallel.join_inout(Work, Work, inout left, inout right, rendezvous, rendezvous) {
        R.Ok(_) => (),
        R.Err(_) => @panic("launch failed"),
    };
    if left.observed && right.observed { 42 } else { 0 }
}
""" }]
exit_code = 42

[[case]]
name = "abi_parallel_resource_failure_preserves_contexts_and_recovers"
concurrency_observation = "resource_exhaustion"
description = "A worker-only recursion chain exhausts the worker registry, verifies unchanged contexts on launch failure, unwinds, and successfully starts a later join."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["--preview", "concurrency", "-O3", "main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
struct Work { depth: u32, entered: bool, exhausted: bool }

fn parent_step(inout value: i32) { value += 1; }

fn worker_step(inout work: Work) {
    work.entered = true;
    if work.depth == 0 { @panic("expected bounded worker exhaustion"); }
    let depth = work.depth - 1;
    let mut child = Work { depth: depth, entered: false, exhausted: false };
    let mut parent: i32 = 17;
    let R = std.result.Result((), std.parallel.SpawnError);
    match std.parallel.join_inout(Work, i32, inout child, inout parent, worker_step, parent_step) {
        R.Ok(_) => {
            @assert(child.entered && child.exhausted && parent == 18);
            work.exhausted = true;
        },
        R.Err(error) => match error {
            std.parallel.SpawnError.ResourceExhausted => {
                @assert(child.depth == depth && !child.entered && !child.exhausted && parent == 17);
                work.exhausted = true;
            },
            _ => @panic("unexpected initialization failure"),
        },
    };
}

fn main() -> i32 {
    let mut work = Work { depth: 70, entered: false, exhausted: false };
    worker_step(inout work);
    @assert(work.entered && work.exhausted);
    let mut left: i32 = 20;
    let mut right: i32 = 20;
    let R = std.result.Result((), std.parallel.SpawnError);
    match std.parallel.join_inout(i32, i32, inout left, inout right, parent_step, parent_step) {
        R.Ok(_) => left + right,
        R.Err(_) => @panic("worker registry did not recover"),
    }
}
""" }]
exit_code = 42

