# Raw pointer semantics through the real driver (RUE-8).
#
# Exercises the full pointer surface end-to-end: taking a pointer with
# @raw / @raw_mut, reading and writing through it, round-tripping an
# address through @ptr_to_int / @int_to_ptr, passing pointers across
# function boundaries, and the checked-context enforcement (spec 9.1:1,
# 9.1:12) that rejects unchecked pointer operations outside a `checked`
# block.

[section]
id = "cli.pointers"
name = "Raw pointers"
description = "Raw pointer operations and unchecked-context enforcement via the CLI driver."

# Read through a pointer taken with @raw. Prints the pointed-to value.
[[case]]
name = "ptr_read_roundtrip"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x: i32 = 123;
    let v: i32 = checked {
        let p: ptr const i32 = @raw(x);
        @ptr_read(p)
    };
    @dbg(v);
    0
}
""" }]
stdout = "123\n"

# Mutate a local through a ptr mut, then observe the mutation.
[[case]]
name = "ptr_write_mutates_local"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut x: i32 = 10;
    checked {
        let p: ptr mut i32 = @raw_mut(x);
        @ptr_write(p, 77);
    };
    @dbg(x);
    0
}
""" }]
stdout = "77\n"

# Round-trip an address through @ptr_to_int / @int_to_ptr and read it back.
[[case]]
name = "ptr_int_roundtrip"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x: i32 = 42;
    let addr: u64 = checked {
        let p: ptr const i32 = @raw(x);
        @ptr_to_int(p)
    };
    let v: i32 = checked {
        let p2: ptr mut i32 = @int_to_ptr(addr);
        @ptr_read(p2)
    };
    @dbg(v);
    0
}
""" }]
stdout = "42\n"

# A pointer passes across a function boundary as a parameter and is read
# in the callee.
[[case]]
name = "ptr_across_function"
files = [{ path = "main.rue", source = """
fn deref(p: ptr const i32) -> i32 {
    checked { @ptr_read(p) }
}
fn main() -> i32 {
    let x: i32 = 99;
    let v: i32 = checked {
        let p: ptr const i32 = @raw(x);
        deref(p)
    };
    @dbg(v);
    0
}
""" }]
stdout = "99\n"

# @ptr_offset advances a pointer by offset * sizeof(pointee) and reads the
# element at that offset — NOT element 0 (RUE-213). This differential case
# asserts the exact runtime value at a non-zero offset: reading index 1 of
# [10, 20, 30] must yield 20. A miscompiled address computation (missing or
# wrong-direction scale) reads 10 or garbage instead.
[[case]]
name = "ptr_offset_reads_offset_element"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let v: i32 = checked {
        let base: ptr const i32 = @raw(arr[0]);
        @ptr_read(@ptr_offset(base, 1))
    };
    @dbg(v);
    let w: i32 = checked {
        let base: ptr const i32 = @raw(arr[0]);
        @ptr_read(@ptr_offset(base, 2))
    };
    @dbg(w);
    0
}
""" }]
stdout = "20\n30\n"

# A negative @ptr_offset walks backward through the array: starting at
# element 2 and offsetting by -1 must land on element 1 (20). This guards
# the sign-extension of a narrow (i32) index — without it the -1 is treated
# as ~4 billion and the address is corrupted (RUE-213).
[[case]]
name = "ptr_offset_negative_walks_backward"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let arr: [i32; 3] = [10, 20, 30];
    let v: i32 = checked {
        let base: ptr const i32 = @raw(arr[2]);
        @ptr_read(@ptr_offset(base, -1))
    };
    @dbg(v);
    0
}
""" }]
stdout = "20\n"

# Writing through an offset `ptr mut` mutates the element at that offset,
# not element 0 (RUE-213). Offset by 2 from arr[0], write 99, observe it at
# arr[2].
[[case]]
name = "ptr_offset_write_hits_offset_element"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut arr: [i32; 3] = [10, 20, 30];
    checked {
        let base: ptr mut i32 = @raw_mut(arr[0]);
        @ptr_write(@ptr_offset(base, 2), 99);
    };
    @dbg(arr[0]);
    @dbg(arr[2]);
    0
}
""" }]
stdout = "10\n99\n"

# @ptr_offset is standard pointer arithmetic: a plain ADD, forward toward
# HIGHER addresses, uniform for every pointer origin (ADR-0040 / RUE-243).
# This walks a fresh mmap region (NOT a local array): @ptr_offset(base, 1)
# must land one element FORWARD (higher address), so writing 100/200/300 at
# offsets 0/1/2 and reading them back returns them in order, and the address
# delta base->base+1 is exactly sizeof(pointee) (8, one slot). Before RUE-243
# @ptr_offset subtracted, so it walked mmap pointers BACKWARD and this read
# garbage. mmap uses the x86-64 Linux syscall ABI, so scope to that host.
[[case]]
name = "ptr_offset_forward_on_mmap_pointer"
only_on = ["x86-64-linux"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    checked {
        let sys_mmap: u64 = 9;
        let zero: u64 = 0;
        let len: u64 = 4096;
        let prot: u64 = 3;
        let flags: u64 = 34;
        let fdneg: u64 = 18446744073709551615;
        let addr: i64 = @syscall(sys_mmap, zero, len, prot, flags, fdneg, zero);
        let au: u64 = @intCast(addr);
        let base: ptr mut i32 = @int_to_ptr(au);
        @ptr_write(@ptr_offset(base, 0), 100);
        @ptr_write(@ptr_offset(base, 1), 200);
        @ptr_write(@ptr_offset(base, 2), 300);
        let d: u64 = @ptr_to_int(@ptr_offset(base, 1)) - @ptr_to_int(base);
        @dbg(d);
        @dbg(@ptr_read(@ptr_offset(base, 0)));
        @dbg(@ptr_read(@ptr_offset(base, 1)));
        @dbg(@ptr_read(@ptr_offset(base, 2)));
    };
    0
}
""" }]
stdout = "8\n100\n200\n300\n"

# Array indexing and @ptr_offset AGREE by construction (ADR-0040 / RUE-243):
# both compute base + i*size (ascending). Write element 2 through the index
# path (`a[2] = 77`), then read it back through the pointer path
# (@ptr_offset(@raw(a[0]), 2)); the two must resolve to the same address, so
# the read observes 77. Conversely, write through the pointer path and read
# through the index path.
[[case]]
name = "array_index_and_ptr_offset_agree"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut a: [i32; 4] = [0, 0, 0, 0];
    a[2] = 77;
    let via_ptr: i32 = checked { @ptr_read(@ptr_offset(@raw(a[0]), 2)) };
    @dbg(via_ptr);
    checked {
        @ptr_write(@ptr_offset(@raw_mut(a[0]), 3), 88);
    };
    @dbg(a[3]);
    0
}
""" }]
stdout = "77\n88\n"

# @ptr_offset moves toward HIGHER addresses for a positive index and LOWER
# for a negative one, on an ordinary (non-array-origin) local pointer
# (ADR-0040 / RUE-243). The forward delta is exactly sizeof(pointee) = 8.
[[case]]
name = "ptr_offset_forward_is_higher_address"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x: i32 = 0;
    checked {
        let p: ptr const i32 = @raw(x);
        let fwd: u64 = @ptr_to_int(@ptr_offset(p, 1)) - @ptr_to_int(p);
        @dbg(fwd);
    };
    0
}
""" }]
stdout = "8\n"

# Enforcement: a pointer operation outside a `checked` block is rejected
# with E1300, not silently accepted (spec 9.1:12).
[[case]]
name = "ptr_read_outside_checked_is_error"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let x: i32 = 5;
    let p: ptr const i32 = checked { @raw(x) };
    @ptr_read(p)
}
""" }]
compile_fail = true
error_contains = ["E1300", "requires a `checked` block"]

# Enforcement: calling an `unchecked fn` outside a `checked` block is
# rejected (spec 9.1:1).
[[case]]
name = "unchecked_fn_outside_checked_is_error"
files = [{ path = "main.rue", source = """
unchecked fn danger() -> i32 { 42 }
fn main() -> i32 {
    danger()
}
""" }]
compile_fail = true
error_contains = ["E1300", "unchecked function"]
