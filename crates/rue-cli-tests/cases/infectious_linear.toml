struct D1 { v: i32 }
drop fn D1(self) { @dbg(self.v); }
struct D2 { v: i32 }
drop fn D2(self) { @dbg(self.v); }
struct C { a: D1, l: L, b: D2 }
fn sink(l: L) -> i32 { l.v }
fn main() -> i32 {
    let c = C { a: D1 { v: 10 }, l: L { v: 1 }, b: D2 { v: 20 } };
    let r = sink(c.l);
    @dbg(99);
    r
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 1
stdout = """99
10
20
"""

[[case]]
name = "carrier_param_residue_dropped_in_callee_at_O2"
description = "The callee-side residue drop of a carrier parameter is preserved at -O2, inlining included (RUE-1591)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
struct C { l: L, d: D }
fn sink(l: L) -> i32 { l.v }
fn eat(c: C) -> i32 {
    let r = sink(c.l);
    @dbg(88);
    r
}
fn main() -> i32 {
    let c = C { l: L { v: 1 }, d: D { v: 42 } };
    let r = eat(c);
    @dbg(99);
    r
}
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 1
stdout = """88
42
99
"""

[[case]]
name = "carrier_residue_destructor_runs_once_under_drop_flags_at_O2"
description = "Branch-conditional consumption still drops the residue exactly once at -O2 (RUE-1591 drop flags)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct D { v: i32 }
drop fn D(self) { @dbg(self.v); }
struct C { l: L, d: D }
fn sink(l: L) -> i32 { l.v }
fn pick(n: i32) -> i32 {
    let c = C { l: L { v: 1 }, d: D { v: 42 } };
    let r = if n > 0 { sink(c.l) } else { sink(c.l) };
    @dbg(99);
    r
}
fn main() -> i32 { pick(1) }
""" }]
args = ["main.rue", "-O2", "-o", "prog"]
exit_code = 1
stdout = """99
42
"""

[[case]]
name = "carrier_with_own_destructor_field_move_rejected"
description = "A carrier that has its own destructor now reaches the destructor-type field-move rejection (E0456) instead of silently skipping its destructor via whole-value consumption (RUE-1591)."
files = [{ path = "main.rue", source = """
linear struct L { v: i32 }
struct C { l: L, n: i32 }
drop fn C(self) { @dbg(self.n); }
fn sink(l: L) -> i32 { l.v }
fn main() -> i32 {
    let c = C { l: L { v: 1 }, n: 7 };
    sink(c.l)
}
""" }]
compile_fail = true
error_contains = [
    "E0456",
    "cannot move field `l` out of a value of type 'C', which has a destructor",
]

[[case]]
name = "declared_linear_nested_field_consumes_outer_container"
description = "Projection consumes the smallest declared-linear container and immediately drops its droppable residue; ordinary infectious-carrier behavior remains unchanged."
files = [{ path = "main.rue", source = """
linear struct Token { v: i32 }
linear struct H { t: Token, n: i32 }
fn consume(t: Token) -> i32 { t.v }
fn main() -> i32 {
    let h = H { t: Token { v: 5 }, n: 1 };
    consume(h.t)
}
""" }]
exit_code = 5

[[case]]
name = "extract_and_consume_linear_field_ok"
description = "Extracting the linear field and consuming it satisfies the container's linearity; the binary runs."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
struct Container { inner: MustUse, tag: i32 }
fn sink(m: MustUse) -> i32 { m.value }
fn main() -> i32 {
    let c = Container { inner: MustUse { value: 42 }, tag: 1 };
    sink(c.inner)
}
""" }]
exit_code = 42

[[case]]
name = "container_one_branch_consumption_rejected"
description = "Must-consume-on-all-paths (E0443) applies to infectiously linear containers."
files = [{ path = "main.rue", source = """
linear struct MustUse { value: i32 }
struct Wrap { m: MustUse }
fn sink(w: Wrap) -> i32 { w.m.value }
fn main() -> i32 {
    let w = Wrap { m: MustUse { value: 1 } };
    let c = true;
    if c {
        sink(w)
    } else {
        0
    }
}
""" }]
compile_fail = true
error_contains = ["E0443", "not consumed on all paths"]
