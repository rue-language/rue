# Very large explicit array literal must compile without a Rust stack overflow
# (RUE-346). A source with an explicit element list `[e0, e1, ...]` of several
# thousand elements built a user-chain of that depth in the instruction
# scheduler, whose critical-path priority pass (`calculate_priorities`) walked
# it with a recursive DFS and overflowed the native stack (SIGABRT / SIGSEGV),
# rather than compiling or emitting a clean diagnostic. The pass is now an
# explicit-stack iterative traversal, so depth no longer maps to native-stack
# depth. 8000 elements is comfortably past the old ~6000-element crash threshold
# (x86-64, 8 MiB stack). This must be an explicit element LIST, not the
# `[value; count]` repeat form (see array_repeat.toml) — only the list builds
# the deep per-element dependency chain that triggered the overflow.
#
# stdout is pinned via @dbg so a miscompiled literal (wrong element addressing)
# is caught too, not merely the absence of a crash: a[0]=3, a[7999]=39, sum 42.

[section]
id = "cli.large_array_literal_no_stack_overflow"
name = "Large explicit array literal does not overflow the stack"
description = "A ~8000-element explicit array literal compiles and runs instead of crashing the compiler with a native stack overflow (RUE-346)."

