# CFG cleanup convergence (RUE-2545).
#
# The optimizer's cleanup fixpoint sites (`run_cleanup_to_fixpoint` in
# rue-cfg's opt module) are bounded at 64 rounds as a safety net against a
# non-converging pass. Each case below is a chain of 100 or more links in which
# every link becomes constant (or provably equal to a value it already has)
# only after the link before it folds. Before RUE-2545 each link cost one
# cleanup round, so these valid programs exhausted the bound: a panic in a
# debug compiler, an under-optimized graph in a release one. The sparse
# constant driver now carries the chain through branches, join parameters,
# dead writes, dead loops, and identities in one run, so each site settles in a
# fixed number of rounds whatever the chain's length.
#
# Every case is `differential_opt`: it must compile and give the pinned output
# at -O0, -O1, -O2, and -O3.

[section]
id = "cli.cfg_cleanup_convergence"
name = "CFG cleanup convergence"
description = "Chains longer than the cleanup round bound compile and agree at every optimization level."

# The `performance/workloads` scale_functions shape: at -O2 every call is
# inlined, and each callee's result reaches the next call through the
# continuation join of a branch that folds only once the previous result is
# constant. 128 copies; 64 already exceeded the old bound.
