[section]
id = "cli.rue_test_question"
name = "`?` in a test body, through `rue test`"
description = """
RUE-1921 (ADR-0083 §1, spec 6.7:13 - 6.7:17): `?` in a test body reports and
traps instead of propagating. These run the whole path through the real binary —
compiler, linked test image, dispatched process, failure channel, runner — so
what is pinned here is the verdict a consumer of the event stream actually sees:
kind `unhandled_error`, the `?` operand's own line and column rather than the
test declaration's header, and the error rendered by the synthesized structural
printer.

They use the real standard library because `?` accepts only the trusted
`std.option.Option` and `std.result.Result` producers (spec 4.15:3), so a
self-contained lookalike would exercise nothing. `-j1` and `--format json` for
the same reasons the sibling `cli.rue_test` cases give: whole-line interleaving
is by design under parallel workers, and the event schema is a consumer contract
(docs/process/test-events.md).

Each `?` site is pinned by line and column, which is how these cases show the
report names the operand's own start rather than the test declaration's header
or the `?` token: `    let value = <call>()?;` puts the operand at column 17.
"""

# =============================================================================
# The failing arm: kind, site, and payload.
# =============================================================================

[[case]]
name = "an_unhandled_option_question_is_kind_unhandled_error"
description = """
Spec 6.7:14: a `None` reaching `?` reports `unhandled_error` and traps at the
site. `Option`'s failure carries nothing, so 6.7:15's rendering of it is the
constant `None` — and no printer is synthesized for it at all.
"""
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

fn absent() -> std.option.Option(i64) {
    let O = std.option.Option(i64);
    O.None
}

test "unwraps a missing option" {
    let value = absent()?;
    @assert(value == 0);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"exit_code":101,"kind":"unhandled_error"',
    '"message":"unhandled error"',
    '"payload":"None"',
    '"verdict":"fail"',
    '"crash":0,"event":"run_finished","failed":1,"passed":0',
    # The site is the `?` operand's own position, not the test's header: the
    # declaration is on line 8 and the operator is on line 9.
    '"column":17,"file":',
    '"line":9}',
]

[[case]]
name = "an_unhandled_result_question_reports_its_rendered_error"
description = """
Spec 6.7:15: a struct error renders one level deep as `{ field: value, … }`,
with integers in decimal and `bool` as `true`/`false`. The rendering is the
compiler-synthesized printer's output, carried on the failure channel and
republished by the runner as the failure record's payload.
"""
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

struct Detail { code: i32, retryable: bool }

fn detail_error() -> std.result.Result(i64, Detail) {
    let R = std.result.Result(i64, Detail);
    R.Err(Detail { code: 9, retryable: true })
}

test "unwraps a failed result" {
    let value = detail_error()?;
    @assert(value == 0);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"kind":"unhandled_error"',
    '"payload":"{ code: 9, retryable: true }"',
    '"verdict":"fail"',
]

[[case]]
name = "an_unhandled_enum_error_renders_its_variant_and_payload"
description = """
Spec 6.7:15: a unit variant renders as its name, a payload variant as its name
and its rendered payloads. A negative integer keeps its sign, and a byte string
renders as its own bytes.
"""
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

enum Code {
    Missing,
    Invalid(i32, StrBuf),
}

fn missing() -> std.result.Result(i64, Code) {
    let R = std.result.Result(i64, Code);
    R.Err(Code.Missing)
}

fn invalid() -> std.result.Result(i64, Code) {
    let R = std.result.Result(i64, Code);
    R.Err(Code.Invalid(0 - 7, StrBuf.from_str(borrow "bad")))
}

test "a unit variant" {
    let value = missing()?;
    @assert(value == 0);
}

test "a payload variant" {
    let value = invalid()?;
    @assert(value == 0);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"payload":"Missing"',
    '"payload":"Invalid(-7, bad)"',
    '"crash":0,"event":"run_finished","failed":2,"passed":0',
]

# =============================================================================
# The success arm is ordinary (spec 6.7:14).
# =============================================================================

[[case]]
name = "a_succeeding_question_unwraps_and_the_body_runs_on"
description = "A `?` whose operand succeeds yields the payload and the test completes normally, exactly as 4.15:6 describes."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

fn present() -> std.option.Option(i64) {
    let O = std.option.Option(i64);
    O.Some(41)
}

test "unwraps a present option" {
    let value = present()?;
    @assert(value + 1 == 42);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1"]
driver_exit_code = 0
compile_stdout_contains = ["1 passed ("]
compile_stdout_not_contains = ["FAIL", "unhandled_error"]

# =============================================================================
# Which position 6.7:14 means (RUE-1960).
# =============================================================================

[[case]]
name = "the_reported_site_is_the_operand_start_not_the_operator"
description = """
Spec 6.7:14: the report names where the `?` operator's OPERAND begins, not the
`?` token. The two coordinates are one column apart in the sibling cases above,
which is enough to show the header is not used but not enough to show which end
of the expression is. Here the `?` site is indented inside an `if` and the
operand is eight characters wide, so the operand starts at column 21 and the
operator sits at column 29 — an implementation that staged the operator's own
position would report 29, and this case would fail.
"""
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

fn absent() -> std.option.Option(i64) {
    let O = std.option.Option(i64);
    O.None
}

test "reports where the failing expression begins" {
    if true {
        let value = absent()?;
        @assert(value == 0);
    }
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"kind":"unhandled_error"',
    '"column":21,"file":',
    '"line":10}',
]
compile_stdout_not_contains = ['"column":29,', '"column":9,']
