# Constant initializer evaluation (RUE-171) and required annotations (RUE-179).
#
# Const initializers go through the comptime engine: negated literals,
# arithmetic, comptime blocks, and references to other constants are legal.
# Value constants REQUIRE a type annotation (spec 6.5:4): an unannotated one
# is E0475 (the value-based i32 -> i64 -> u64 inference that #980 shipped was
# removed by RUE-179). Module bindings (`const m = @import(...)` and aliases)
# are exempt. Annotated values are range-checked at the declaration (E0800).
# Initializers are evaluated in dependency order across files; cycles are
# E0461.

[section]
id = "cli.const_init"
name = "Constant initializer evaluation"
description = "Comptime-evaluated const initializers, required type annotations (E0475), dependency ordering, cycle detection (RUE-171, RUE-179)."

# A negated literal — the headline RUE-171 repro (used to be E0434).
[[case]]
name = "negated_literal_initializer"
files = [{ path = "main.rue", source = """
const NEG: i32 = -5;

fn main() -> i32 {
    NEG + 47
}
""" }]
exit_code = 42

# Negative consts materialize sign-extended at i64 width too.
[[case]]
name = "negated_literal_i64_initializer"
files = [{ path = "main.rue", source = """
const NEG: i64 = -5000000000;

fn main() -> i32 {
    if NEG / 1000000000 == -5 { 7 } else { 1 }
}
""" }]
exit_code = 7

# Arithmetic, boolean operators, and const-to-const references.
[[case]]
name = "arithmetic_and_const_refs"
files = [{ path = "main.rue", source = """
const AREA: i32 = 6 * 7;
const DOUBLE: i32 = AREA + AREA;
const FLAG: bool = !false;

fn main() -> i32 {
    if FLAG { DOUBLE - AREA } else { 0 }
}
""" }]
exit_code = 42

# A comptime block initializer.
[[case]]
name = "comptime_block_initializer"
files = [{ path = "main.rue", source = """
const X: i32 = comptime { 6 * 7 };

fn main() -> i32 {
    X
}
""" }]
exit_code = 42

# An unannotated value constant is E0475, with a help suggesting the
# annotation the removed inference would have chosen (RUE-179).
[[case]]
name = "unannotated_const_rejected_with_help"
files = [{ path = "main.rue", source = """
const X = 5;

fn main() -> i32 {
    X
}
""" }]
compile_fail = true
error_contains = ["E0475", "missing type annotation on constant 'X'", "add a type annotation: `const X: i32 = ...;`"]

# The E0475 help suggests i64 for a literal that does not fit i32 (this
# pinned inference under #980; the chain now only feeds the suggestion).
[[case]]
name = "unannotated_big_literal_rejected_suggests_i64"
files = [{ path = "main.rue", source = """
const BIG = 5000000000;

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0475", "missing type annotation on constant 'BIG'", "`const BIG: i64 = ...;`"]

# ... and u64 beyond i64::MAX.
[[case]]
name = "unannotated_huge_literal_rejected_suggests_u64"
files = [{ path = "main.rue", source = """
const HUGE = 18446744073709551615;

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0475", "missing type annotation on constant 'HUGE'", "`const HUGE: u64 = ...;`"]

# The annotated equivalents of the old inference chain keep working.
[[case]]
name = "annotated_big_literal_i64"
files = [{ path = "main.rue", source = """
const BIG: i64 = 5000000000;

fn main() -> i32 {
    if BIG / 1000000000 == 5 { 5 } else { 1 }
}
""" }]
exit_code = 5

[[case]]
name = "annotated_huge_literal_u64"
files = [{ path = "main.rue", source = """
const HUGE: u64 = 18446744073709551615;

fn main() -> i32 {
    if HUGE > 18446744073709551614 { 3 } else { 1 }
}
""" }]
exit_code = 3

# Module bindings are NOT value constants: no annotation required (RUE-179
# carve-out), and member access through one still works annotated.
[[case]]
name = "module_binding_exempt_from_annotation"
files = [
    { path = "main.rue", source = """
const cfg = @import("cfg.rue");
const X: i32 = cfg.ANSWER;

fn main() -> i32 {
    X
}
""" },
    { path = "cfg.rue", source = """
pub const ANSWER: i32 = 42;
""" },
]
exit_code = 42

# A type-valued initializer is a module-scope type alias, not a runtime value
# constant, so it is exempt from the annotation requirement.
[[case]]
name = "type_alias_initializer_is_module_scope_alias"
files = [{ path = "main.rue", source = """
fn MakeT() -> type { i32 }
const T = MakeT();

fn main() -> i32 {
    let x: T = 42;
    x
}
""" }]
exit_code = 42

# Annotated out-of-range value is rejected AT THE DECLARATION (E0800).
[[case]]
name = "annotated_out_of_range_at_declaration"
files = [{ path = "main.rue", source = """
const X: u8 = 300;

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0800", "out of range", "u8"]

# A negative value can't adopt an unsigned annotation.
[[case]]
name = "negative_value_unsigned_annotation_rejected"
files = [{ path = "main.rue", source = """
const N: u8 = -5;

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["value -5 is out of range for type u8"]

# Forward reference within a file: declaration order does not matter.
[[case]]
name = "forward_reference_same_file"
files = [{ path = "main.rue", source = """
const A: i32 = B + 1;
const B: i32 = C * 2;
const C: i32 = 10;

fn main() -> i32 {
    A
}
""" }]
exit_code = 21

# Cross-file const chain: the defining file comes SECOND on the command
# line, so collection must be dependency-ordered, not file-ordered.
[[case]]
name = "cross_file_chain_definer_second"
args = ["main.rue", "-o", "prog"]
files = [
    { path = "main.rue", source = """
const config = @import("config.rue");
const FROM_CONFIG: i32 = config.LIMIT + 1;

fn main() -> i32 {
    FROM_CONFIG
}
""" },
    { path = "config.rue", source = """
pub const LIMIT: i32 = 41;
""" },
]
exit_code = 42

# Same chain with the defining file first (both orders must agree).
[[case]]
name = "cross_file_chain_definer_first"
args = ["main.rue", "-o", "prog"]
files = [
    { path = "config.rue", source = """
pub const LIMIT: i32 = 41;
""" },
    { path = "main.rue", source = """
const config = @import("config.rue");
const FROM_CONFIG: i32 = config.LIMIT + 1;

fn main() -> i32 {
    FROM_CONFIG
}
""" },
]
exit_code = 42

# A reference cycle is a compile error (E0461), not a hang.
[[case]]
name = "cycle_is_error_not_hang"
files = [{ path = "main.rue", source = """
const A: i32 = B;
const B: i32 = A;

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0461", "cycle detected in constant initializers", "A -> B -> A"]

# Self-reference is the smallest cycle.
[[case]]
name = "self_cycle_is_error"
files = [{ path = "main.rue", source = """
const SELF: i32 = SELF;

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0461", "SELF -> SELF"]

# A genuinely non-evaluable initializer is still E0434 (function calls are
# not const-evaluable; fn-valued constants are RUE-173).
[[case]]
name = "runtime_call_initializer_still_rejected"
files = [{ path = "main.rue", source = """
fn get() -> i32 { 42 }
const X: i32 = get();

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0434", "not supported in const context"]

# String constants (RUE-957): a top-level `const DIR: str = "..."` was E0434
# ("string literals is not supported in const context"); the workaround was a
# function returning the literal. Pin the runtime behavior end-to-end,
# including the printed bytes and cross-file member access.
[[case]]
name = "string_const_prints_and_measures"
files = [{ path = "main.rue", source = """
const DIR: str = "/tmp/rue-out";
const BANNER: str = "rue says hi";

fn main() -> i32 {
    println(BANNER);
    println(DIR);
    @intCast(DIR.len())
}
""" }]
exit_code = 12
stdout = "rue says hi\n/tmp/rue-out\n"

[[case]]
name = "string_const_cross_module"
files = [
  { path = "main.rue", source = """
const util = @import("util.rue");

fn main() -> i32 {
    println(util.NAME);
    @intCast(util.NAME.len())
}
""" },
  { path = "util.rue", source = """
pub const NAME: str = "rue-util";
""" },
]
exit_code = 8
stdout = "rue-util\n"
