# Drop elaboration vs move semantics (RUE-61 / RUE-62, fixed by RUE-108).
#
# Spec 3.9:2: a value is dropped exactly once — moved values are dropped at
# their final destination, not at their original binding. Before the fix,
# sema's move analysis was discarded before AIR, so drop elaboration dropped
# every live slot at scope exit: a value moved into a callee / another local /
# out via return ran its destructor TWICE, and a callee never dropped its
# owned pass-by-value parameters at all (the caller's spurious drop masked
# that leak).
#
# These cases pin EXACT destructor output via @dbg markers so both the count
# and the order of drops are regression-tested.
#
# Partial (per-field) moves are field-granular (RUE-62): moving one field out
# of a struct (`eat(o.a)`) suppresses ONLY that field's drop at the struct's
# scope exit, and the remaining droppable fields are dropped individually in
# declaration order. This only applies to structs WITHOUT their own `drop fn`:
# moving a field out of a value whose type has a user-defined destructor is a
# compile error (E0456, RUE-158) — the destructor would observe the moved-out
# field and the field glue would drop it a second time.
#
# Branch-divergent moves are handled with runtime drop flags (RUE-108 for
# whole slots, RUE-156 for individual field paths): a value moved in only
# one branch drops exactly once on every path. Field moves are tracked as
# full paths of any depth (`eat(o.a.b)`, RUE-157), with each affected
# field's scope-exit drop guarded by its own flag.
#
# Assignment-overwrite drops are covered separately in `overwrite_drops.toml`
# (RUE-64), including field and array-element writes. This file stays focused
# on move/drop suppression rather than the overwrite matrix.

[section]
id = "cli.drop_moves"
name = "Drop suppression for moved-out values"
description = "Moved values are dropped exactly once, at their destination (RUE-61/RUE-62)."

[[case]]
name = "control_unmoved_value_drops_exactly_once"
description = "Control: a value that is never moved drops exactly once, at scope exit."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    @dbg(self.v);
}

fn main() -> i32 {
    let d = D { v: 7 };
    @dbg(100);
    0
}
""" }]
stdout = "100\n7\n"
exit_code = 0

[[case]]
name = "control_destructor_then_field_drop_order"
description = "Control: dropping a struct runs its destructor, then drops its droppable fields."
files = [{ path = "main.rue", source = """
struct A { x: i32 }
struct O { a: A, b: i32 }

drop fn A(self) {
    @dbg(self.x);
}

drop fn O(self) {
    @dbg(800);
}

fn main() -> i32 {
    let o = O { a: A { x: 1 }, b: 2 };
    @dbg(100);
    0
}
""" }]
stdout = "100\n800\n1\n"
exit_code = 0

[[case]]
name = "move_into_call_drops_once_in_callee"
description = "RUE-61: a value moved into a call is dropped by the callee (param drop at callee exit), not again by the caller."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    @dbg(self.v);
}

fn take(d: D) -> i32 {
    d.v
}

fn main() -> i32 {
    let d = D { v: 7 };
    let x = take(d);
    @dbg(100);
    x - 7
}
""" }]
stdout = "7\n100\n"
exit_code = 0

[[case]]
name = "move_param_to_local_drops_once"
description = "RUE-61 original repro: callee re-binds its param to a local; destructor runs once (in the callee), not again in main."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    @dbg(self.v);
}

fn consume(d: D) -> i32 {
    let held = d;
    held.v
}

fn main() -> i32 {
    let d = D { v: 7 };
    consume(d);
    @dbg(100);
    0
}
""" }]
stdout = "7\n100\n"
exit_code = 0

[[case]]
name = "move_to_local_drops_once_lifo"
description = "Chained let-moves: only the final binding drops the value; LIFO order unaffected for other slots."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    @dbg(self.v);
}

fn main() -> i32 {
    let a = D { v: 7 };
    let other = D { v: 50 };
    let b = a;
    let c = b;
    @dbg(100);
    0
}
""" }]
stdout = "100\n7\n50\n"
exit_code = 0

[[case]]
name = "move_out_via_return_not_dropped_in_returning_fn"
description = "RUE-61 return path: a returned value is not dropped in the returning function; the caller's binding drops it."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    @dbg(self.v);
}

fn make() -> D {
    let d = D { v: 5 };
    d
}

fn main() -> i32 {
    let m = make();
    @dbg(100);
    0
}
""" }]
stdout = "100\n5\n"
exit_code = 0

[[case]]
name = "method_consumes_receiver_drops_once"
description = "A by-value self receiver is moved into the method, which drops it at method exit."
files = [{ path = "main.rue", source = """
struct D {
    v: i32,

    fn get(self) -> i32 {
        self.v
    }
}

drop fn D(self) {
    @dbg(self.v);
}

fn main() -> i32 {
    let d = D { v: 9 };
    let x = d.get();
    @dbg(100);
    x - 9
}
""" }]
stdout = "9\n100\n"
exit_code = 0

[[case]]
name = "reassignment_after_move_drops_new_value"
description = "Assigning to a moved-from variable re-initializes it: the new value drops at scope exit, the old one only at its destination."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    @dbg(self.v);
}

fn consume(d: D) -> i32 { d.v }

fn main() -> i32 {
    let mut d = D { v: 1 };
    consume(d);
    d = D { v: 2 };
    @dbg(100);
    0
}
""" }]
stdout = "1\n100\n2\n"
exit_code = 0

[[case]]
name = "moved_array_drops_once"
description = "Moving an array of droppable elements suppresses the source binding's drops."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    @dbg(self.v);
}

fn main() -> i32 {
    let arr: [D; 2] = [D { v: 1 }, D { v: 2 }];
    let arr2 = arr;
    @dbg(100);
    0
}
""" }]
stdout = "100\n1\n2\n"
exit_code = 0

[[case]]
name = "borrow_arg_caller_still_drops"
description = "A borrow argument is not a move: the caller keeps ownership and drops at its own scope exit, the callee does not."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    @dbg(self.v);
}

fn peek(borrow d: D) -> i32 {
    d.v
}

fn main() -> i32 {
    let d = D { v: 7 };
    let x = peek(borrow d);
    @dbg(100);
    x - 7
}
""" }]
stdout = "100\n7\n"
exit_code = 0

[[case]]
name = "partial_field_move_out_of_destructor_type_rejected"
description = "RUE-158: moving o.a out of O is rejected because O has its own `drop fn` (which would observe the moved-out field). Before the fix this compiled and printed 1, 100, 800."
files = [{ path = "main.rue", source = """
struct A { x: i32 }
struct O { a: A, b: i32 }

drop fn A(self) {
    @dbg(self.x);
}

drop fn O(self) {
    @dbg(800);
}

fn eat(a: A) -> i32 {
    a.x
}

fn main() -> i32 {
    let o = O { a: A { x: 1 }, b: 2 };
    eat(o.a);
    @dbg(100);
    0
}
""" }]
compile_fail = true
error_contains = ["E0456", "cannot move field `a` out of a value of type 'O'"]

[[case]]
name = "partial_field_move_remaining_field_still_drops"
description = "RUE-62 original repro: with both fields droppable, the moved field drops in the callee and ONLY the remaining field drops at main's exit."
files = [{ path = "main.rue", source = """
struct Inner { v: i32 }

drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { a: Inner, b: Inner }

fn eat(i: Inner) -> i32 {
    @dbg(800);
    0
}

fn main() -> i32 {
    let o = Outer { a: Inner { v: 1 }, b: Inner { v: 2 } };
    eat(o.a);
    @dbg(777);
    0
}
""" }]
stdout = "800\n1\n777\n2\n"
exit_code = 0

[[case]]
name = "partial_field_move_out_of_byvalue_param"
description = "RUE-62 for owned params: a field moved out of a pass-by-value struct param is not re-dropped by the callee's param drop at exit."
files = [{ path = "main.rue", source = """
struct Inner { v: i32 }

drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { a: Inner, b: Inner }

fn eat(i: Inner) -> i32 {
    @dbg(800);
    0
}

fn f(o: Outer) -> i32 {
    eat(o.a);
    @dbg(500);
    0
}

fn main() -> i32 {
    let o = Outer { a: Inner { v: 1 }, b: Inner { v: 2 } };
    f(o);
    @dbg(777);
    0
}
""" }]
stdout = "800\n1\n500\n2\n777\n"
exit_code = 0

[[case]]
name = "moved_field_reassigned_drops_new_value"
description = "Writing a fresh value into a moved-out field re-initializes it: the NEW value drops at scope exit (the moved-out one only in the callee)."
files = [{ path = "main.rue", source = """
struct Inner { v: i32 }

drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { a: Inner, b: Inner }

fn eat(i: Inner) -> i32 {
    @dbg(800);
    0
}

fn main() -> i32 {
    let mut o = Outer { a: Inner { v: 1 }, b: Inner { v: 2 } };
    eat(o.a);
    o.a = Inner { v: 3 };
    @dbg(777);
    0
}
""" }]
stdout = "800\n1\n777\n3\n2\n"
exit_code = 0

[[case]]
name = "partial_string_field_move_no_double_free"
description = "RUE-62 with a heap type: moving one String field out of a struct must not double-free it at the struct's scope-exit drop."
files = [{ path = "main.rue", source = """
struct Holder { name: String, tag: String }

fn eat(s: String) -> i32 {
    0
}

fn main() -> i32 {
    let h = Holder { name: String.with_capacity(8), tag: String.with_capacity(8) };
    eat(h.name);
    @dbg(777);
    0
}
""" }]
stdout = "777\n"
exit_code = 0

[[case]]
name = "branch_divergent_string_field_move_no_double_free"
description = "RUE-156 with a heap type: a String field moved in only ONE branch must not be freed again by the struct's scope-exit drop on the moving path."
files = [{ path = "main.rue", source = """
struct Holder { name: String, tag: String }

fn eat(s: String) -> i32 {
    0
}

fn main() -> i32 {
    let h = Holder { name: String.with_capacity(8), tag: String.with_capacity(8) };
    let c = true;
    if c {
        eat(h.name);
    }
    @dbg(777);
    0
}
""" }]
stdout = "777\n"
exit_code = 0

[[case]]
name = "branch_divergent_field_move_drops_once_taken"
description = "RUE-156: a field moved in only ONE branch drops exactly once when the branch IS taken — in the callee, with the field's guarded scope-exit drop skipped at runtime."
files = [{ path = "main.rue", source = """
struct Inner { v: i32 }

drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { a: Inner, b: Inner }

fn eat(i: Inner) -> i32 {
    0
}

fn main() -> i32 {
    let o = Outer { a: Inner { v: 1 }, b: Inner { v: 2 } };
    let c = true;
    if c {
        eat(o.a);
    }
    @dbg(777);
    0
}
""" }]
stdout = "1\n777\n2\n"
exit_code = 0

[[case]]
name = "branch_divergent_field_move_drops_once_not_taken"
description = "RUE-156: when the moving branch is NOT taken, the field's guarded scope-exit drop still runs — both fields drop at exit, nothing leaks."
files = [{ path = "main.rue", source = """
struct Inner { v: i32 }

drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { a: Inner, b: Inner }

fn eat(i: Inner) -> i32 {
    0
}

fn main() -> i32 {
    let o = Outer { a: Inner { v: 1 }, b: Inner { v: 2 } };
    let c = false;
    if c {
        eat(o.a);
    }
    @dbg(777);
    0
}
""" }]
stdout = "777\n1\n2\n"
exit_code = 0

[[case]]
name = "different_field_moved_per_branch_drops_once"
description = "RUE-156: each branch moves a DIFFERENT field; per-field flags keep exactly the not-moved field's exit drop on each path."
files = [{ path = "main.rue", source = """
struct Inner { v: i32 }

drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { a: Inner, b: Inner }

fn eat(i: Inner) -> i32 {
    0
}

fn main() -> i32 {
    let o = Outer { a: Inner { v: 1 }, b: Inner { v: 2 } };
    let c = true;
    if c {
        eat(o.a);
    } else {
        eat(o.b);
    }
    @dbg(777);
    0
}
""" }]
stdout = "1\n777\n2\n"
exit_code = 0

[[case]]
name = "branch_divergent_field_move_then_reinit_drops_new_value"
description = "RUE-156: a conditionally moved field that is reassigned afterwards is statically owned again — the fresh value drops at exit (no guard, no double drop of the moved one)."
files = [{ path = "main.rue", source = """
struct Inner { v: i32 }

drop fn Inner(self) {
    @dbg(self.v);
}

struct Outer { a: Inner, b: Inner }

fn eat(i: Inner) -> i32 {
    0
}

fn main() -> i32 {
    let mut o = Outer { a: Inner { v: 1 }, b: Inner { v: 2 } };
    let c = true;
    if c {
        eat(o.a);
    }
    o.a = Inner { v: 9 };
    @dbg(777);
    0
}
""" }]
stdout = "1\n777\n9\n2\n"
exit_code = 0

[[case]]
name = "deep_field_move_drops_once"
description = "RUE-157: moving a depth-2 field path (`t.mid.leaf`) exports a path marker — the leaf drops only in the callee, and the exit drop walks the structs field-granularly."
files = [{ path = "main.rue", source = """
struct Leaf { v: i32 }
struct Mid { leaf: Leaf, other: Leaf }
struct Top { mid: Mid }

drop fn Leaf(self) {
    @dbg(self.v);
}

fn eat(l: Leaf) -> i32 {
    0
}

fn main() -> i32 {
    let t = Top { mid: Mid { leaf: Leaf { v: 5 }, other: Leaf { v: 6 } } };
    eat(t.mid.leaf);
    @dbg(777);
    0
}
""" }]
stdout = "5\n777\n6\n"
exit_code = 0

[[case]]
name = "deep_field_move_out_of_byvalue_param_drops_once"
description = "RUE-157: a depth-2 path moved out of a by-value PARAM suppresses just that path in the callee's param exit drop."
files = [{ path = "main.rue", source = """
struct Leaf { v: i32 }
struct Mid { leaf: Leaf, other: Leaf }
struct Top { mid: Mid }

drop fn Leaf(self) {
    @dbg(self.v);
}

fn eat(l: Leaf) -> i32 {
    0
}

fn consume(t: Top) -> i32 {
    eat(t.mid.leaf)
}

fn main() -> i32 {
    let t = Top { mid: Mid { leaf: Leaf { v: 5 }, other: Leaf { v: 6 } } };
    consume(t);
    @dbg(777);
    0
}
""" }]
stdout = "5\n6\n777\n"
exit_code = 0

