# Control flow: nested loops, branches, mutation, early-ish exits. Exercises
# CFG-shaped code where a bad block-simplification would show up.
[[case]]
name = "control_flow_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut sum: i32 = 0;
    let mut i: i32 = 0;
    while i < 10 {
        if i % 2 == 0 {
            sum = sum + i;
        } else {
            sum = sum - 1;
        }
        let mut j: i32 = 0;
        while j < i {
            sum = sum + 1;
            j = j + 1;
        }
        i = i + 1;
    }
    @dbg(sum);
    sum
}
""" }]
stdout = "60\n"
exit_code = 60

# ABI / by-value aggregate: a struct passed and returned by value, with a
# large-enough field mix to exercise the aggregate-slot path that has
# historically miscompiled (RUE-13/14). Divergence here would be an ABI bug the
# optimizer exposed.
[[case]]
name = "aggregate_abi_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
struct Vec3 {
    x: i64,
    y: i64,
    z: i64,
}

fn add(a: Vec3, b: Vec3) -> Vec3 {
    Vec3 { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }
}

fn dot(a: Vec3, b: Vec3) -> i64 {
    a.x * b.x + a.y * b.y + a.z * b.z
}

fn main() -> i32 {
    let s = add(Vec3 { x: 1, y: 2, z: 3 }, Vec3 { x: 10, y: 20, z: 30 });
    @dbg(s.x);
    @dbg(s.y);
    @dbg(s.z);
    let d = dot(Vec3 { x: 1, y: 2, z: 3 }, Vec3 { x: 10, y: 20, z: 30 });
    @dbg(d);
    let r: i32 = @intCast(d % 256);
    r
}
""" }]
stdout = """11
22
33
140
"""
exit_code = 140

# Zero-width Normal arguments have real CFG values but no physical ABI slots
# (RUE-635). Interleave unit, an empty struct, and a zero-length array with
# enough real scalar arguments to cross both x86-64's six-register and
# AArch64's eight-register limits. The unit-producing call's output proves its
# evaluation is retained even though its result is not marshalled.
[[case]]
name = "zero_width_normal_args_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
struct Empty {}

fn observed_unit() {
    @dbg(99);
}

fn sum(
    a: i32,
    unit: (),
    b: i32,
    empty: Empty,
    c: i32,
    zero: [i32; 0],
    d: i32,
    e: i32,
    f: i32,
    g: i32,
    h: i32,
    i: i32,
) -> i32 {
    a + b + c + d + e + f + g + h + i
}

fn main() -> i32 {
    sum(1, observed_unit(), 2, Empty {}, 3, [], 4, 5, 6, 7, 8, 6)
}
""" }]
stdout = "99\n"
exit_code = 42

# The same omission rule must compose with a hidden sret pointer, while
# zero-sized Borrow/Inout arguments retain their one real pointer slot. The
# trailing scalar lands after the two by-ref pointers and before the returned
# nine-slot aggregate is copied out.
[[case]]
name = "zero_width_args_with_byref_and_sret_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
struct Empty {}

struct Nine {
    a: i32,
    b: i32,
    c: i32,
    d: i32,
    e: i32,
    f: i32,
    g: i32,
    h: i32,
    i: i32,
}

fn build(borrow shared: Empty, inout writable: Empty, unit: (), tail: i32) -> Nine {
    writable = Empty {};
    Nine { a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8, i: tail }
}

fn main() -> i32 {
    let shared = Empty {};
    let mut writable = Empty {};
    let value = build(borrow shared, inout writable, (), 6);
    value.a + value.b + value.c + value.d + value.e
        + value.f + value.g + value.h + value.i
}
""" }]
stdout = ""
exit_code = 42

# Exact fixed-string references retain one-pointer identity through direct and
# multi-hop forwarding into projected field/array-element lvalues. Equality,
# indexing, and length checks prove the copied-back value's content, while every
# helper's exact Str(8) signature pins the nominal capacity. The separate
# `inout str` chain is read-only: a view may be forwarded, but unlike an exact
# `inout Str(8)` it cannot replace the caller's whole value.
[[case]]
name = "fixed_string_inout_forwarding_and_projected_lvalues_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
struct Holder {
    direct: Str(8),
    forwarded: Str(8),
}

fn replace(inout value: Str(8), replacement: Str(8)) {
    value = replacement;
}

fn forward(inout value: Str(8), replacement: Str(8)) {
    replace(inout value, replacement);
}

fn make(value: Str(8)) -> Str(8) { value }

fn exact(value: Str(8), expected: Str(8), expected_len: u64) -> bool {
    value == expected && value.len() == expected_len && value[0] == expected[0]
}

fn view_len(inout value: str) -> u64 {
    value.len()
}

fn forward_view_len(inout value: str) -> u64 {
    view_len(inout value)
}

fn main() -> i32 {
    let mut local: Str(8) = "local";
    let mut holder = Holder { direct: "field", forwarded: "other" };
    let mut values: [Str(8); 2] = [make("zero"), make("one")];

    forward(inout local, "forward");
    replace(inout holder.direct, "project");
    forward(inout holder.forwarded, "nested");
    replace(inout values[0], "array");
    forward(inout values[1], "element");

    let field_view_len = forward_view_len(inout holder.forwarded);
    let array_view_len = forward_view_len(inout values[1]);
    if exact(local, "forward", 7)
        && exact(holder.direct, "project", 7)
        && exact(holder.forwarded, "nested", field_view_len)
        && exact(values[0], "array", 5)
        && exact(values[1], "element", array_view_len)
        && field_view_len == 6
        && array_view_len == 7
    {
        42
    } else {
        1
    }
}
""" }]
args = ["main.rue", "-o", "prog"]
stdout = ""
exit_code = 42

# Call / recursion: mutual + self recursion, so inlining or tail-call style
# opts (should they ever land) can't silently change the result.
[[case]]
name = "recursion_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn fib(n: i32) -> i32 {
    if n < 2 {
        n
    } else {
        fib(n - 1) + fib(n - 2)
    }
}

fn is_even(n: i32) -> bool {
    if n == 0 { true } else { is_odd(n - 1) }
}

fn is_odd(n: i32) -> bool {
    if n == 0 { false } else { is_even(n - 1) }
}

fn main() -> i32 {
    let f: i32 = fib(15);
    @dbg(f);
    if is_even(f) { @dbg(0); } else { @dbg(1); }
    f
}
""" }]
stdout = """610
0
"""
exit_code = 98

# Enum structural equality with payloads: the same variant with a DIFFERENT
# payload must not compare equal. Regression for RUE-348 — const-folding compared
# only the variant tag, so `Opt.Some(5) == Opt.Some(6)` folded to `true` at
# -O1+ while -O0 (deferring to codegen's structural compare) was correct.
[[case]]
name = "enum_payload_equality_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
enum Opt { None, Some(i32) }

fn main() -> i32 {
    let ne: bool = Opt.Some(5) == Opt.Some(6);   // false: same variant, diff payload
    let eq: bool = Opt.Some(5) == Opt.Some(5);   // true
    let tag: bool = Opt.None == Opt.Some(0);     // false: different variant
    if ne { @dbg(1); } else { @dbg(0); }
    if eq { @dbg(1); } else { @dbg(0); }
    if tag { @dbg(1); } else { @dbg(0); }
    0
}
""" }]
stdout = """0
1
0
"""
exit_code = 0

# Address-taking intrinsics keep their place operands (RUE-521): constprop
# rewrote the `Load` feeding `@raw` into its constant value, so codegen
# dereferenced the integer 42 as an address — a segfault at -O1+ while -O0 was
# correct. Covers all three address-taking intrinsics (@raw, @raw_mut,
# @field_ptr) with pointer round-trips pinned at every level.
[[case]]
name = "raw_pointer_place_operands_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
struct P { a: i32, b: i32 }

fn main() -> i32 {
    let x: i32 = 42;
    let mut y: i32 = 7;
    let s = P { a: 30, b: 12 };
    checked {
        let p: ptr const i32 = @raw(x);
        let v: i32 = @ptr_read(p);
        @dbg(v);
        let q: ptr mut i32 = @raw_mut(y);
        @ptr_write(q, 35);
        let f: ptr const i32 = @field_ptr(s.a);
        let w: i32 = @ptr_read(f);
        @dbg(w);
    };
    y
}
""" }]
stdout = """42
30
"""
exit_code = 35

# Constant-condition control flow (RUE-910): simplify-cfg folds Branch on a
# folded BoolConst / Switch on a folded Const into Goto, and DCE then prunes
# the dead arm. The live arm's side effects and computed values must survive
# at every level, and -O0 (which never folds) must agree byte-for-byte.
[[case]]
name = "constant_branches_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let flag: bool = 10 > 3;
    let dead: bool = 1 == 2;
    let mut acc: i32 = 0;
    if flag {
        @dbg(1);
        acc = acc + 40;
    } else {
        @dbg(2);
        acc = acc + 1000;
    }
    if dead {
        @dbg(3);
        acc = acc + 2000;
    }
    while dead {
        @dbg(4);
        acc = acc + 3000;
    }
    acc = acc + 2;
    acc
}
""" }]
stdout = """1
"""
exit_code = 42

# Constant match scrutinees (RUE-910): int, bool, and enum matches whose
# scrutinee constant-folds. The switch must fold to the arm the backends
# would select at runtime, including a negative case value and a
# no-case-matches default.
[[case]]
name = "constant_switches_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
enum Mode { Fast, Slow, Off }

fn main() -> i32 {
    let n: i32 = 3 - 4;
    let picked: i32 = match n {
        -1 => 10,
        0 => 20,
        _ => 30,
    };
    @dbg(picked);
    let missed: i32 = match n * 5 {
        1 => 100,
        2 => 200,
        _ => 300,
    };
    @dbg(missed);
    let b: bool = 2 < 1;
    let from_bool: i32 = match b {
        true => 7,
        false => 8,
    };
    @dbg(from_bool);
    let m = Mode.Slow;
    match m {
        Mode.Fast => 1,
        Mode.Slow => 2,
        Mode.Off => 3,
    }
}
""" }]
stdout = """10
300
8
"""
exit_code = 2

# Platform selection via constant enum comparison (RUE-910, the motivating
# case for fold_enum_comparison): the untaken architecture's arm is
# statically dead at -O1+ but the observable result is identical at -O0.
# Both arms compute the same observable values through different expressions
# on purpose: differential cases must declare exact stdout, so the program
# has to be target-invariant while still giving each architecture a distinct
# dead arm to eliminate.
[[case]]
name = "target_arch_selection_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    if @target_arch() == Arch.X86_64 {
        @dbg(40 + 2);
    } else {
        @dbg(6 * 7);
    }
    match @target_arch() {
        Arch.X86_64 => 2 + 3,
        Arch.Aarch64 => 10 - 5,
    }
}
""" }]
stdout = """42
"""
exit_code = 5

# Block merging and threading (RUE-911): value-yielding ifs (block-arg joins)
# with both constant conditions (join merges into a straight line) and
# dynamic conditions (join keeps two predecessors and must NOT merge), plus a
# dynamic while loop whose back edge must survive simplification intact.
[[case]]
name = "merged_blocks_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn pick(flag: bool) -> i32 {
    let r: i32 = if flag { 10 } else { 20 };
    r + 1
}

fn main() -> i32 {
    let constant: i32 = if 2 > 1 { 5 } else { 6 };
    @dbg(constant);
    @dbg(pick(true));
    @dbg(pick(false));
    let mut i: i32 = 0;
    let mut total: i32 = 0;
    while i < 4 {
        total = total + i;
        i = i + 1;
    }
    @dbg(total);
    constant + total
}
""" }]
stdout = """5
11
21
6
"""
exit_code = 11

# Peephole algebraic simplification (RUE-912): identity rewires (x+0, x*1,
# x/1, x|0, x^0, shifts by 0, x&x, x|x, !!b), constant-producing annihilators
# (x*0, x-x, x^x, x%1), and unsigned power-of-two strength reduction. The
# helper params keep operands dynamic so the rewrites (not constant folding)
# are what's exercised; -O0 never rewrites and must agree exactly. The signed
# division uses a NEGATIVE dividend to pin round-toward-zero: an illegal
# sar-based reduction would produce -4 instead of -3.
[[case]]
name = "peephole_identities_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn identities(x: i32) -> i32 {
    let a: i32 = x + 0;
    let b: i32 = 0 + a;
    let c: i32 = b - 0;
    let d: i32 = c * 1;
    let e: i32 = 1 * d;
    let f: i32 = e / 1;
    let g: i32 = f | 0;
    let h: i32 = g ^ 0;
    let i: i32 = h << 0;
    let j: i32 = i >> 0;
    j & j | (j | j)
}

fn annihilators(x: i32) -> i32 {
    (x - x) + (x ^ x) + (x * 0) + (0 * x) + (x & 0) + (x % 1)
}

fn unsigned_reduce(x: u32) -> u32 {
    x / 8 + x % 8 + x / 1
}

fn signed_round_toward_zero(x: i32) -> i32 {
    x / 2
}

fn double_not(x: i32) -> bool {
    !!(x > 3)
}

fn main() -> i32 {
    @dbg(identities(21));
    @dbg(annihilators(-17));
    @dbg(unsigned_reduce(100));
    @dbg(signed_round_toward_zero(-7));
    if double_not(5) { @dbg(1); } else { @dbg(0); }
    identities(21) * 2
}
""" }]
stdout = """21
0
116
-3
1
"""
exit_code = 42

# Block-local CSE (RUE-913): a repeated pure subexpression's shared operand is
# value-numbered once and reused, so the three separate `const 100`
# materializations in `weighted` collapse to a single instruction at -O2. The
# helper's params keep the surrounding multiplies opaque to constopt, so they
# survive to CSE instead of folding away. `safe_div` is a repeated division that
# does NOT trap for these inputs — CSE must leave its observable result
# unchanged. -O0/-O1 (no CSE) must agree byte-for-byte with -O2/-O3.
[[case]]
name = "cse_shared_subexpressions_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn weighted(x: i32, y: i32) -> i32 {
    x * 100 + y * 100 + 100
}

fn safe_div(a: i32, b: i32) -> i32 {
    (a / b) + (a / b)
}

fn main() -> i32 {
    let w: i32 = weighted(2, 3);
    let d: i32 = safe_div(30, 3);
    @dbg(w);
    @dbg(d);
    w + d
}
""" }]
stdout = """600
20
"""
exit_code = 108

# Block-local CSE on a TRAPPING expression (RUE-913): constopt propagates the
# constant `z = 0` into both divisors, so the two `100 / z` divisions become
# identical `100 / 0` operations and -O2 CSE merges them into one. Eliminating
# the SECOND occurrence is trap-exact — the first division executes earlier in
# the same block, dominates, and still divides by zero — so every level aborts
# with the same "division by zero" and exit status. This is the RUE-57
# obligation the pass must honor: CSE may drop a redundant trap but never a
# reachable one, and the differential net proves -O2 did not change behavior.
[[case]]
name = "cse_trapping_division_still_traps_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let z: i32 = 0;
    (100 / z) + (100 / z)
}
""" }]
stdout = ""
exit_code = 101
runtime_error_contains = ["division by zero"]

# Value forwarding + CSE over parameter expressions (RUE-914). `a` and `b` are
# never-written by-value parameters, so their repeated reads are the same pure
# value: forwarding turns the `let s`/`let t`/`let u` loads into the single
# `a + b`, CSE's parameter keying (RUE-914) collapses the duplicated reads, and
# the three `a + b` computations become one. `acc` is a multi-write local, so it
# exercises block-local forwarding with kill-on-store between its mutations. The
# result must be identical at every level — forwarding and CSE are semantics-
# preserving, not just at -O2 where they fire.
[[case]]
name = "forward_and_cse_param_expressions_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn compute(a: i32, b: i32) -> i32 {
    let s = a + b;
    let t = a + b;
    let mut acc = s + t;
    acc = acc + a;
    acc = acc * b;
    let u = a + b;
    acc + u
}

fn main() -> i32 {
    let x = compute(3, 4);
    @dbg(x);
    x
}
""" }]
stdout = "75\n"
exit_code = 75

# A store followed by an `inout` call followed by a load must RELOAD, not
# forward the pre-call value (RUE-914). The callee writes through the by-ref
# pointer, so forwarding kills the slot's tracked store at the call; `let r = v`
# then reads the mutated value. If forwarding wrongly propagated the pre-call
# `5`, -O2 would print/return `5` while -O0 returns `105` — the differential net
# names that divergence. The `inout` argument's own load also stays a place at
# every level (the by-ref lowering requires it).
[[case]]
