# result must be byte-for-byte identical at every level: -O0/-O1/-O2 (no LICM)
# compute it per iteration, -O3 computes it once, and both must agree.
[[case]]
name = "licm_hoistable_pure_computation_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn compute(a: i32, b: i32, n: i32) -> i32 {
    let mut i: i32 = 0;
    let mut acc: i32 = 0;
    while i < n {
        let inv: i32 = (a & b) | (a ^ b);
        acc = acc + inv;
        i = i + 1;
    }
    acc
}

fn main() -> i32 {
    let r: i32 = compute(6, 7, 5);
    @dbg(r);
    r
}
""" }]
stdout = "35\n"
exit_code = 35

# LICM TRAP-SAFETY (RUE-927, the mandatory ADR-0054 §2 regression): a ZERO-TRIP
# loop whose body contains a loop-invariant division `100 / d` with `d == 0`.
# The division is invariant (both operands defined outside the loop) but it
# *may trap*, so LICM must NOT hoist it — the loop runs zero times, so the source
# never executes the division, and hoisting it into the preheader (which runs
# before the entry test) would manufacture a divide-by-zero trap out of thin air.
# This is the inverse of RUE-57 (DCE deleting a mandatory trap); here LICM must
# not INVENT one. Every level must exit cleanly with `0`; a regression that
# hoisted the division would make -O3 abort with exit 101 while -O0 returns 0,
# and the differential net names that divergence.
[[case]]
name = "licm_trap_safety_zero_trip_invariant_division_across_opt_levels"
differential_opt = true
files = [{ path = "main.rue", source = """
fn trap_safe(n: i32, d: i32) -> i32 {
    let mut i: i32 = 0;
    let mut acc: i32 = 0;
    while i < n {
        let q: i32 = 100 / d;
        acc = acc + q;
        i = i + 1;
    }
    acc
}

fn main() -> i32 {
    let r: i32 = trap_safe(0, 0);
    @dbg(r);
    r
}
""" }]
stdout = "0\n"
exit_code = 0

