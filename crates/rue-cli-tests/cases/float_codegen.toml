files = [{ path = "main.rue", source = """
fn read32(borrow value: f32) -> f32 { value }
fn read64(borrow value: f64) -> f64 { value }
fn bump32(inout value: f32) { value = value + 1.5; }
fn bump64(inout value: f64) { value = value + 2.0; }
