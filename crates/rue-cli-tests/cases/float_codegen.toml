# `f32`/`f64` are identifiers rather than lexer keywords, so a float type
# passed as a `comptime T: type` argument reaches inference as a variable
# reference. Inference resolved such a reference only against type parameters
# and user structs/enums, left `T` unsubstituted, and reported a bogus
# "expected comptime_float, found type" against a `-> T` return used in a
# binary operation with a float literal.
[[case]]
name = "native_float_type_argument_to_generic_call"
files = [{ path = "main.rue", source = """
fn sq(comptime T: type, x: T) -> T { x * x }
fn inf(comptime T: type) -> T { let zero: T = 0.0; let one: T = 1.0; one / zero }
fn neg_inf(comptime T: type) -> T { 0.0 - inf(T) }
fn main() -> i32 {
    let v: f32 = 2.5;
    let w: f32 = 1.0 + sq(f32, v);
    let d: f64 = sq(f64, 1.5) + 1.0;
    let n: f32 = neg_inf(f32);
    let sign: i32 = if n < 0.0 { 10 } else { 0 };
    let a: i32 = @float_to_int(w);
    let b: i32 = @float_to_int(d);
    a + b + sign
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 20

# The same call across a module boundary. The module-qualified generic path
# built its type substitution but returned a bare inference variable for a
# `-> T` result, so the use site decided the type instead: `h.sq(f32, v) ==
# 6.25` defaulted the literal to `f64` while sema specialized the call to
# `f32`, and the disagreement surfaced only as an AIR verification ICE.
[[case]]
name = "native_float_type_argument_to_cross_module_generic_call"
files = [
    { path = "main.rue", source = """
const h = @import("helper.rue");
fn main() -> i32 {
    let v: f32 = 2.5;
    let eq: i32 = if h.sq(f32, v) == 6.25 { 1 } else { 0 };
    let w: f32 = h.sq(f32, v) + 1.0;
    let d: f64 = h.sq(f64, 1.5) + 1.0;
    let n: f32 = h.neg_inf(f32);
    let sign: i32 = if n < 0.0 { 10 } else { 0 };
    let a: i32 = @float_to_int(w);
    let b: i32 = @float_to_int(d);
    eq + a + b + sign
}
""" },
    { path = "helper.rue", source = """
pub fn sq(comptime T: type, x: T) -> T { x * x }
pub fn inf(comptime T: type) -> T { let zero: T = 0.0; let one: T = 1.0; one / zero }
pub fn neg_inf(comptime T: type) -> T { 0.0 - inf(T) }
""" },
]
args = ["main.rue", "-o", "prog"]
exit_code = 21

# =============================================================================
# Float fields inside AGGREGATES crossing a call boundary.
#
# A slot's register class follows its LEAF type everywhere: the call ABI
# classifies each argument slot from `types::aggregate_leaf_types`, parameter
# metadata from `native_arg_leaf_classes`, and multi-slot frame traffic from the
# leaf types. A ONE-SLOT aggregate is the shape that had no such rule: its
# lowering asked whether the WRAPPER type was a float, answered no for
# `struct P { field: f64 }`, and put an FP-classed ABI slot in a general-purpose
# vreg — an ICE at the emitter's operand-class assertion for a let-bound value
# crossing a call, and, for a multi-slot float aggregate written through a
# pointer, a silent general-purpose store of an XMM/V register's bytes.
#
# Every shape below is written per target so the argument and return banks are
# exercised on both register files; execution runs on the native one.
# =============================================================================

