# ---------------------------------------------------------------------------
# ADR-0065 §4, §7, §8: unsigned conversions, integral rounding, square root,
# and IEEE total ordering. The same program runs on both targets; a NaN's sign
# bit is the one target-dependent observable (x86-64's default NaN is negative,
# AArch64's positive), so the total-order checks compare NaN only against
# itself and against a value whose ordering does not depend on that bit.
# ---------------------------------------------------------------------------


[[case]]
name = "x86-64-linux_rounding_sqrt_and_total_order"
files = [{ path = "main.rue", source = """
fn check(cond: bool, id: i32) -> i32 { if cond { 0 } else { id } }
fn main() -> i32 {
    let mut bad: i32 = 0;
    let zero: f64 = 0.0;
    let nan: f64 = zero / zero;
    let inf: f64 = 1.0 / zero;
    if bad == 0 { bad = check(@floor(2.7) == 2.0, 1); }
    if bad == 0 { bad = check(@floor(-2.2) == -3.0, 2); }
    if bad == 0 { bad = check(@ceil(2.2) == 3.0, 3); }
    if bad == 0 { bad = check(@ceil(-2.7) == -2.0, 4); }
    if bad == 0 { bad = check(@trunc(2.7) == 2.0, 5); }
    if bad == 0 { bad = check(@trunc(-2.7) == -2.0, 6); }
    if bad == 0 { bad = check(@round(2.5) == 3.0, 7); }
    if bad == 0 { bad = check(@round(-2.5) == -3.0, 8); }
    if bad == 0 { bad = check(@round(2.4) == 2.0, 9); }
    if bad == 0 { bad = check(@round(-2.4) == -2.0, 10); }
    if bad == 0 { bad = check(@round(0.49999999999999994) == 0.0, 11); }
    if bad == 0 { bad = check(@round(inf) == inf, 12); }
    if bad == 0 { bad = check(@round(nan) != @round(nan), 13); }
    if bad == 0 { bad = check(@sqrt(9.0) == 3.0, 14); }
    if bad == 0 { bad = check(@sqrt(-1.0) != @sqrt(-1.0), 15); }
    let big: f64 = 4503599627370497.0;
    if bad == 0 { bad = check(@round(big) == big, 16); }
    let neg_small: f64 = -0.25;
    if bad == 0 { bad = check(1.0 / @round(neg_small) == -inf, 17); }
    if bad == 0 { bad = check(1.0 / @ceil(neg_small) == -inf, 18); }
    if bad == 0 { bad = check(1.0 / @trunc(neg_small) == -inf, 19); }
    if bad == 0 { bad = check(@floor(neg_small) == -1.0, 20); }
    let pz: f64 = 0.0;
    let nz: f64 = -0.0;
    if bad == 0 { bad = check(@total_cmp(nz, pz) == -1, 21); }
    if bad == 0 { bad = check(@total_cmp(pz, nz) == 1, 22); }
    if bad == 0 { bad = check(@total_cmp(pz, pz) == 0, 23); }
    if bad == 0 { bad = check(@total_cmp(nan, nan) == 0, 24); }
    if bad == 0 { bad = check(@total_cmp(nan, inf) * @total_cmp(-nan, -inf) == -1, 25); }
    if bad == 0 { bad = check(@total_cmp(1.5, 2.5) == -1, 26); }
    if bad == 0 { bad = check(@total_cmp(-1.5, -2.5) == 1, 27); }
    if bad == 0 { bad = check(@total_cmp(-inf, inf) == -1, 28); }
    let f32v: f32 = -2.5;
    if bad == 0 { bad = check(@round(f32v) == -3.0, 42); }
    if bad == 0 { bad = check(@floor(f32v) == -3.0, 43); }
    if bad == 0 { bad = check(@ceil(f32v) == -2.0, 44); }
    if bad == 0 { bad = check(@trunc(f32v) == -2.0, 45); }
    if bad == 0 { bad = check(@sqrt(f32v * f32v) == 2.5, 46); }
    let f32nz: f32 = -0.0;
    let f32pz: f32 = 0.0;
    if bad == 0 { bad = check(@total_cmp(f32nz, f32pz) == -1, 47); }
    if bad == 0 { bad = check(@total_cmp(f32pz, f32nz) == 1, 48); }
    bad
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
exit_code = 0

