# std-under-compact-layout sweep (ADR-0052, RUE-987 / RUE-1014).
#
# The compact physical layout is only useful if the standard library's
# data-structure PATTERNS compile and run correctly under it. This suite is the
# permanent CI home for that sweep: each case exercises a real std shape —
# heap-backed containers, byte buffers, nested records, struct elements, and
# variant-dependent enum images and compact arrays — through the compact-layout
# machinery (narrow scalar access RUE-989, compact enum memory RUE-1000,
# call-boundary marshalling RUE-1004/1005, zero-padding RUE-1007, whole
# compact-struct marshalling through typed pointers RUE-987, and variant-dependent
# enum images plus compact arrays through pointers and across calls RUE-1014).
# Every `stdout`/`exit_code` here is pinned oracle output that a miscompile would
# change. `differential_opt` additionally pins identical behavior across every
# optimization level.
#
# Most programs are self-contained mirrors of the std container/string/record
# patterns; the RUE-1014 additions at the end drive the REAL std via
# `@import("std")` (RUE_STD_PATH), because a full-std import — including
# `std.json`, whose `Json` enum has variant-dependent aggregate payloads — now
# COMPILES under the gate: the `Json` payloads overlay a single variant-
# independent scalar image, so the imageless-enum blocker RUE-987 recorded is
# cleared. An enum whose per-variant payloads genuinely overlap or disagree on
# leaf offset has no such image and stays loudly refused (see the sentinel).

[section]
id = "cli.aggregate_layout_std_sweep"
name = "std patterns under the compact layout"
description = "Self-contained programs mirroring std container/string/record patterns compile and run byte-identically (RUE-987)."

# A heap array of compact records walked with @ptr_offset at the compact stride:
# each record { id: u8, val: i32, tag: u16 } is written whole through the typed
# pointer (RUE-987 image store, padding zeroed) and read back whole, its narrow
# fields extended. This is the ArrayBuf(struct) storage pattern.
[[case]]
name = "heap_struct_array_walk"
description = "A heap array of compact { u8, i32, u16 } records walked with @ptr_offset; whole-struct @ptr_write/@ptr_read at the compact stride."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Rec { id: u8, val: i32, tag: u16 }
fn main() -> i32 {
    let sum = checked {
        let p: ptr mut Rec = @int_to_ptr(@ptr_to_int(@alloc(4 * @intCast(@size_of(Rec)), @intCast(@align_of(Rec)))));
        let mut i: u64 = 0;
        while i < 4 {
            let slot = @ptr_offset(p, i);
            @ptr_write(slot, Rec { id: @intCast(i), val: @intCast(i * 100), tag: 7 });
            i = i + 1;
        }
        let mut s: i32 = 0;
        let mut j: u64 = 0;
        while j < 4 {
            let r = @ptr_read(@ptr_offset(p, j));
            let idc: i32 = @intCast(r.id);
            let tg: i32 = @intCast(r.tag);
            s = s + r.val + idc + tg;
            j = j + 1;
        }
        @free(@int_to_ptr(@ptr_to_int(p)), 4 * @intCast(@size_of(Rec)), @intCast(@align_of(Rec)));
        s
    };
    @dbg(sum);
    0
}
""" }]
stdout = "634\n"
exit_code = 0

# A nested compact record marshalled whole through a pointer: the inner struct's
# fields flatten into the outer image at their compact offsets, so the whole
# Outer { u16, Inner { u8, i32 }, u8 } round-trips.
[[case]]
name = "nested_compact_struct_through_pointer"
description = "A nested compact record round-trips whole through a typed pointer; the inner struct's leaves flatten into the outer compact image (RUE-987)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Inner { a: u8, b: i32 }
struct Outer { x: u16, inner: Inner, y: u8 }
fn main() -> i32 {
    let r = checked {
        let p: ptr mut Outer = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(Outer)), @intCast(@align_of(Outer)))));
        @ptr_write(p, Outer { x: 300, inner: Inner { a: 5, b: 9999 }, y: 42 });
        let o = @ptr_read(p);
        @free(@int_to_ptr(@ptr_to_int(p)), 1 * @intCast(@size_of(Outer)), @intCast(@align_of(Outer)));
        o
    };
    let x: i32 = @intCast(r.x);
    let a: i32 = @intCast(r.inner.a);
    let y: i32 = @intCast(r.y);
    @dbg(x);
    @dbg(a);
    @dbg(r.inner.b);
    @dbg(y);
    0
}
""" }]
stdout = "300\n5\n9999\n42\n"
exit_code = 0

# A narrow-byte heap buffer (the StrBuf / ArrayBuf(u8) storage pattern): u8 values
# written and read at compact stride 1 with narrow access (RUE-989).
[[case]]
name = "narrow_byte_buffer_roundtrip"
description = "A heap u8 buffer written/read at compact stride 1 with narrow access — the StrBuf/ArrayBuf(u8) storage pattern."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let sum = checked {
        let p: ptr mut u8 = @int_to_ptr(@ptr_to_int(@alloc(5 * @intCast(@size_of(u8)), @intCast(@align_of(u8)))));
        let mut i: u64 = 0;
        while i < 5 { let bv: u8 = @intCast(65 + i); @ptr_write(@ptr_offset(p, i), bv); i = i + 1; }
        let mut s: i32 = 0;
        let mut j: u64 = 0;
        while j < 5 { let b: i32 = @intCast(@ptr_read(@ptr_offset(p, j))); s = s + b; j = j + 1; }
        @free(@int_to_ptr(@ptr_to_int(p)), 5 * @intCast(@size_of(u8)), @intCast(@align_of(u8)));
        s
    };
    @dbg(sum);
    0
}
""" }]
stdout = "335\n"
exit_code = 0

# The generic ArrayBuf(compact struct) container end-to-end: a Rue-source
# ArrayBuf(Point) whose element is a compact { x: i32, y: i32 }. push/set store the
# whole struct through the heap pointer (RUE-987) and get/pop_or return it by value
# across the sret boundary (RUE-1004). This is the ArrayBuf(struct) dogfood the
# earlier ADR-0052 rungs left refused.
[[case]]
name = "arraybuf_compact_struct_element"
description = "A generic @import ArrayBuf(Point) with a compact struct element: push/get/set/pop_or round-trip whole structs under the gate (RUE-987)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [
  { path = "main.rue", source = """const arraybuf = @import("arraybuf.rue");
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let mut v = arraybuf.ArrayBuf(Point).new();
    v.push(Point { x: 1, y: 2 });
    v.push(Point { x: 3, y: 4 });
    v.push(Point { x: 5, y: 6 });
    let p1 = v.get(1);
    @dbg(p1.x);
    @dbg(p1.y);
    v.set(0, Point { x: 90, y: 91 });
    let p0 = v.get(0);
    @dbg(p0.x);
    @dbg(p0.y);
    let last = v.pop_or(Point { x: 0, y: 0 });
    @dbg(last.x);
    @dbg(last.y);
    v.free();
    0
}""" },
  { path = "arraybuf.rue", source = """
pub fn ArrayBuf(comptime T: type) -> type {
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,
        fn new() -> Self { let z: u64 = 0; Self { buf: checked { @int_to_ptr(z) }, len: 0, cap: 0 } }
        fn len(borrow self) -> u64 { self.len }
        fn reserve(inout self) {
            if self.len == self.cap {
                let nc: u64 = if self.cap == 0 { 4 } else { self.cap * 2 };
                checked { let g = @int_to_ptr(@ptr_to_int(@realloc(@int_to_ptr(@ptr_to_int(self.buf)), self.cap * @intCast(@size_of(T)), @intCast(@align_of(T)), nc * @intCast(@size_of(T))))); self.buf = g; };
                self.cap = nc;
            }
        }
        fn push(inout self, x: T) {
            self.reserve();
            checked { let s = @ptr_offset(self.buf, self.len); @ptr_write(s, x); };
            self.len = self.len + 1;
        }
        fn get(borrow self, i: u64) -> T { checked { @ptr_read(@ptr_offset(self.buf, i)) } }
        fn set(inout self, i: u64, x: T) {
            if i < self.len { checked { let s = @ptr_offset(self.buf, i); @ptr_write(s, x); }; }
        }
        fn pop_or(inout self, default: T) -> T {
            if self.len == 0 { default } else {
                self.len = self.len - 1;
                checked { @ptr_read(@ptr_offset(self.buf, self.len)) }
            }
        }
        fn free(inout self) {
            checked { @free(@int_to_ptr(@ptr_to_int(self.buf)), self.cap * @intCast(@size_of(T)), @intCast(@align_of(T))); };
            let z: u64 = 0; self.buf = checked { @int_to_ptr(z) }; self.len = 0; self.cap = 0;
        }
    }
}
""" },
]
stdout = "3\n4\n90\n91\n5\n6\n"
exit_code = 0

# ---------------------------------------------------------------------------
# RUE-1014: variant-dependent enum images and compact arrays. The two shapes the
# earlier rungs left refused now execute — an enum with a struct payload
# (Option(struct)) whose per-variant payloads overlay one variant-independent
# scalar image, and a fixed array crossing a call by value (marshalled at the
# compact element stride). Both are pinned to the gate-OFF oracle.
# ---------------------------------------------------------------------------

# An enum with a struct (aggregate) payload now has a variant-independent memory
# image: the payload's leaves flatten to a scalar union that agrees across
# variants, so returning Option(struct) by value across a call marshals through
# the compact sret image (RUE-1014). This is the `ArrayBuf(struct).get -> Option(T)`
# shape, now supported under the gate.
[[case]]
name = "option_struct_return_roundtrip"
description = "Returning an enum with a struct payload (Option(struct)) by value round-trips under the gate: the struct payload flattens to a variant-independent image (RUE-1014)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct P { x: i32, y: i32 }
enum Opt { Some(P), None }
fn make(v: bool) -> Opt { if v { Opt.Some(P { x: 1, y: 2 }) } else { Opt.None } }
fn main() -> i32 {
    match make(true) { Opt.Some(p) => @dbg(p.x + p.y), Opt.None => @dbg(-1) };
    match make(false) { Opt.Some(p) => @dbg(p.x + p.y), Opt.None => @dbg(-1) };
    0
}
""" }]
stdout = "3\n-1\n"
exit_code = 0

# A fixed array crossing a call by value (return) now marshals through the
# caller's sret buffer as its compact image — `count` elements at the compact
# element stride, each extended from its physical width (RUE-1014). This is the
# std.binary `u32_to_be_bytes -> [u8; 4]` shape. The returned array is then
# `[]`-indexed as a frame value at the slot stride.
[[case]]
name = "array_crossing_call_roundtrip"
description = "A fixed array returned by value across a call marshals through its compact image and is then indexed as a frame value (RUE-1014)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn make() -> [u8; 4] { [1, 2, 3, 4] }
fn main() -> i32 {
    let a = make();
    let s: i32 = @intCast(a[0]) + @intCast(a[3]);
    @dbg(s);
    0
}
""" }]
stdout = "5\n"
exit_code = 0

# The REAL std.json parser under the gate: `parse` returns
# `Result(Json, ParseError)` by value across a call, and `Json` — an enum with
# variant-dependent aggregate payloads (StrBuf / ArrayBuf(Json) / Object) — is
# marshalled through its variant-independent scalar image at every boundary
# (heap pointer, sret, by-value). This is the exact full-`@import("std")`
# construct RUE-987 recorded as the last blocker; classifying the parsed value
# pins the top-level variant (an array -> 5).
[[case]]
name = "std_json_parse_variant"
description = "The real std.json parser compiles and runs by default: Json's variant-dependent aggregate payloads marshal through one variant-independent image (RUE-1014)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const json = std.json;
const result = std.result;
const StrBuf = std.strbuf.StrBuf;
const PR = result.Result(json.Json, json.ParseError);
fn classify(v: json.Json) -> i32 {
    match v {
        json.Json.Null => 0,
        json.Json.Bool(b) => if b { 1 } else { 2 },
        json.Json.Number(n) => 3,
        json.Json.String(s) => 4,
        json.Json.Array(a) => 5,
        json.Json.Object(o) => 6,
    }
}
fn main() -> i32 {
    let src: str = "[true,null,42]";
    let input = StrBuf.from_str(borrow src);
    let code = match json.parse(input) {
        PR.Ok(v) => classify(v),
        PR.Err(e) => 0 - 1,
    };
    @dbg(code);
    0
}
""" }]
stdout = "5\n"
exit_code = 0

# The REAL std PriorityQueue(i32, i32) under the gate: its backing
# ArrayBuf(Pair(i32, i32)) stores whole compact structs through the heap pointer
# (RUE-987) and its `get`/`pop` return `Option(Pair)` by value — a variant-
# dependent enum image (RUE-1014) — across the sret boundary. A four-element
# min-heap pops in ascending priority order, pinning the whole pipeline.
[[case]]
name = "std_priority_queue_option_pair"
description = "The real std PriorityQueue(i32,i32) runs by default: ArrayBuf(Pair) struct elements plus Option(Pair) variant-dependent enum returns (RUE-1014)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const bh = std.binary_heap;
const option = std.option;
const tuple = std.tuple;
fn main() -> i32 {
    let PQ = bh.PriorityQueue(i32, i32);
    let Item = tuple.Pair(i32, i32);
    let O = option.Option(Item);
    let mut q = PQ.new();
    q.push(5, 50);
    q.push(1, 10);
    q.push(3, 30);
    q.push(2, 20);
    let mut n: u64 = 0;
    while n < 4 {
        match q.pop() {
            O.Some(it) => { @dbg(it.first); @dbg(it.second); },
            O.None => @dbg(0 - 1),
        };
        n = n + 1;
    }
    0
}
""" }]
stdout = "1\n10\n2\n20\n3\n30\n5\n50\n"
exit_code = 0

# RUE-1037: an enum whose per-variant payloads overlap at narrow widths
# (`A(u16, u16)` at payload+0/+2 versus `B(u32)` at payload+0) now marshals
# through a per-variant tag dispatch — each variant's own narrow leaves are
# stored/loaded, and the full-extent zero on a store leaves no residue. Both
# variants round-trip through the heap.
[[case]]
name = "overlapping_union_enum_roundtrips_via_dispatch"
description = "An enum with overlapping narrow payload positions (u16,u16 vs u32) round-trips through a heap pointer via per-variant tag dispatch (RUE-1037)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
enum Ov { A(u16, u16), B(u32) }
fn make(v: bool) -> Ov { if v { Ov.A(1, 2) } else { Ov.B(3) } }
fn main() -> i32 {
    let r = checked {
        let p: ptr mut Ov = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(Ov)), @intCast(@align_of(Ov)))));
        @ptr_write(p, make(true));
        let a: Ov = @ptr_read(p);
        @ptr_write(p, make(false));
        let b: Ov = @ptr_read(p);
        @free(@int_to_ptr(@ptr_to_int(p)), 1 * @intCast(@size_of(Ov)), @intCast(@align_of(Ov)));
        let av: i32 = match a { Ov.A(x, y) => @intCast(x) + @intCast(y), Ov.B(c) => @intCast(c) };
        let bv: i32 = match b { Ov.A(x, y) => @intCast(x) + @intCast(y), Ov.B(c) => @intCast(c) };
        av * 10 + bv
    };
    @dbg(r);
    0
}
""" }]
stdout = "33\n"
exit_code = 0

# RUE-1037: a faithful mirror of std.net's Result(SockAddr, NetworkError) return
# surface (TcpListener.local_addr) — the exact heterogeneous shape that blocked
# the compact-layout default. Ok(SockAddr{ IpAddr enum, u16 }) and
# Err(NetworkError enum with an Other(i64) payload) have DISAGREEING payload
# layouts, so the enum is marshalled by per-variant tag dispatch. Exercised as an
# sret return, a by-value argument, a heap @ptr_write/@ptr_read round-trip, and a
# nested-match on both variants. 8208 (Ok) + 111 (Err) + 8208 (heap Ok) = 16527.
[[case]]
name = "std_net_result_sockaddr_networkerror_mirror"
description = "A faithful mirror of std.net Result(SockAddr, NetworkError) — the heterogeneous enum blocking the compact default — round-trips by value, by argument, and through the heap via per-variant tag dispatch (RUE-1037)."
differential_opt = true
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Ipv4Addr { a: u8, b: u8, c: u8, d: u8 }
enum IpAddr { V4(Ipv4Addr) }
struct SockAddr { ip: IpAddr, port: u16 }
enum NetworkError {
    Unsupported, PermissionDenied, AddressInUse, AddressNotAvailable,
    ConnectionRefused, ConnectionReset, ConnectionAborted, NotConnected,
    TimedOut, Interrupted, WouldBlock, InvalidInput, Other(i64),
}
enum NetResult { Ok(SockAddr), Err(NetworkError) }
fn local_addr_ok() -> NetResult {
    NetResult.Ok(SockAddr { ip: IpAddr.V4(Ipv4Addr { a: 127, b: 0, c: 0, d: 1 }), port: 8080 })
}
fn local_addr_err() -> NetResult { NetResult.Err(NetworkError.Other(111)) }
fn octet_sum(ip: IpAddr) -> i64 {
    match ip { IpAddr.V4(v4) => @intCast(v4.a) + @intCast(v4.b) + @intCast(v4.c) + @intCast(v4.d), }
}
fn err_code(e: NetworkError) -> i64 {
    match e {
        NetworkError.ConnectionRefused => 0 - 1,
        NetworkError.Other(code) => code,
        _ => 0 - 2,
    }
}
fn classify(r: NetResult) -> i64 {
    match r {
        NetResult.Ok(sa) => octet_sum(sa.ip) + @intCast(sa.port),
        NetResult.Err(e) => err_code(e),
    }
}
fn main() -> i32 {
    let s1 = classify(local_addr_ok());
    let s2 = classify(local_addr_err());
    let s3 = checked {
        let p: ptr mut NetResult = @int_to_ptr(@ptr_to_int(@alloc(1 * @intCast(@size_of(NetResult)), @intCast(@align_of(NetResult)))));
        @ptr_write(p, local_addr_ok());
        let back: NetResult = @ptr_read(p);
        @free(@int_to_ptr(@ptr_to_int(p)), 1 * @intCast(@size_of(NetResult)), @intCast(@align_of(NetResult)));
        classify(back)
    };
    let total: i32 = @intCast(s1 + s2 + s3);
    @dbg(total);
    0
}
""" }]
stdout = "16527\n"
exit_code = 0
