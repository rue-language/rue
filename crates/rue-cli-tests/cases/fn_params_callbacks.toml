# Second-class callbacks through the driver (ADR-0096, RUE-2194, RUE-2195).
#
# A named function bound to a `fn` parameter is a `fn_ref` in AIR and a
# `fn_addr` in CFG; a call through the parameter is `call_indirect` in both.
# Both native backends lower the pair (RUE-2195): the function's address is a
# PC-relative symbol load and the call is a register-indirect call through
# the ordinary native call plan, so the executable cases here run the same
# programs the reference interpreter runs in rue-oracle's unit tests.

[section]
id = "cli.fn_params_callbacks"
name = "Callback binding and indirect calls"
description = "Pins the AIR and CFG presentation of a bound callback and an indirect call (RUE-2194), the module-qualified and associated-function argument forms, the foreign-function rejection, and the native execution of bound, forwarded, nested and by-reference callbacks on both backends (RUE-2195)."

[[case]]
name = "emit_air_shows_fn_ref_and_call_indirect"
description = "Binding a named function is `fn_ref @symbol`; calling through the parameter is `call_indirect %callee(args)`."
files = [{ path = "main.rue", source = """
struct Policy { descending: bool }

fn precedes(borrow p: Policy, a: i64, b: i64) -> bool {
    if p.descending { a > b } else { a < b }
}

fn choose(borrow p: Policy, a: i64, b: i64,
          cmp: fn(borrow Policy, i64, i64) -> bool) -> i64 {
    if cmp(borrow p, a, b) { a } else { b }
}

fn forward(borrow p: Policy, a: i64, b: i64,
           cmp: fn(borrow Policy, i64, i64) -> bool) -> i64 {
    choose(borrow p, a, b, cmp)
}

fn main() -> i32 {
    let p = Policy { descending: true };
    @intCast(forward(borrow p, 3, 9, precedes))
}
""" }]
args = ["--emit", "air", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== AIR ===", "fn_ref @", "precedes", "call_indirect %"]
compile_stderr_not_contains = ["error", "internal compiler error"]

[[case]]
name = "emit_cfg_shows_fn_addr_and_call_indirect"
description = "The CFG carries the same pair: `fn_addr @symbol` and `call_indirect v(args)` with the by-reference argument modes of the callback's `fn` type."
files = [{ path = "main.rue", source = """
struct Policy { descending: bool }

fn precedes(borrow p: Policy, a: i64, b: i64) -> bool {
    if p.descending { a > b } else { a < b }
}

fn choose(borrow p: Policy, a: i64, b: i64,
          cmp: fn(borrow Policy, i64, i64) -> bool) -> i64 {
    if cmp(borrow p, a, b) { a } else { b }
}

fn main() -> i32 {
    let p = Policy { descending: true };
    @intCast(choose(borrow p, 3, 9, precedes))
}
""" }]
args = ["--emit", "cfg", "main.rue"]
compile_only = true
compile_stdout_contains = ["fn_addr @", "precedes", "call_indirect v0(borrow v1, v2, v3)"]
compile_stderr_not_contains = ["error", "internal compiler error"]

[[case]]
name = "module_qualified_and_associated_functions_bind_as_callbacks"
description = "`module.function` and `Type.function` name a callback exactly as an unqualified name does (ADR-0096 §4)."
files = [
    { path = "main.rue", source = """
const helper = @import("helper.rue");

struct Counter {
    n: i32,
    fn zero() -> i32 { 0 }
}

fn apply(cb: fn(i32) -> i32, value: i32) -> i32 { cb(value) }
fn make(cb: fn() -> i32) -> i32 { cb() }

fn main() -> i32 { apply(helper.triple, 2) + make(Counter.zero) }
""" },
    { path = "helper.rue", source = "pub fn triple(value: i32) -> i32 { value * 3 }\n" },
]
args = ["--emit", "cfg", "main.rue"]
