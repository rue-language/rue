[[case]]
name = "foreign_function_is_not_a_callback"
description = "An `extern \"C\"` import is called under the C convention and has no Rue callable address (ADR-0096 §4)."
files = [{ path = "main.rue", source = """
extern "C" {
    fn abs(value: i32) -> i32;
}
fn apply(cb: fn(i32) -> i32, value: i32) -> i32 { cb(value) }

fn main() -> i32 { apply(abs, 1) }
""" }]
args = ["--preview", "c_ffi", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = [
    "E0216",
    "the foreign function `abs` cannot be bound to a `fn` parameter",
    "write a named Rue function that calls it inside a `checked` block and pass that",
]

[[case]]
name = "bound_callback_runs_natively"
description = "The comparator example of ADR-0096: a `borrow` context argument, two by-value arguments, a bound callback and a forwarded one, called through the native indirect call."
files = [{ path = "main.rue", source = """
struct Policy { descending: bool }

fn precedes(borrow p: Policy, a: i64, b: i64) -> bool {
    if p.descending { a > b } else { a < b }
}

fn choose(borrow p: Policy, a: i64, b: i64,
          cmp: fn(borrow Policy, i64, i64) -> bool) -> i64 {
    if cmp(borrow p, a, b) { a } else { b }
}

fn forward(borrow p: Policy, a: i64, b: i64,
           cmp: fn(borrow Policy, i64, i64) -> bool) -> i64 {
    choose(borrow p, a, b, cmp)
}

fn main() -> i32 {
    let up = Policy { descending: false };
    let down = Policy { descending: true };
    let first = choose(borrow up, 3, 9, precedes);
    let second = forward(borrow down, 3, 9, precedes);
    @intCast(first * 10 + second)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 39

[[case]]
name = "callback_in_zero_slot_associated_wrapper_runs_at_every_opt_level"
differential_opt = true
description = "A callback call in an associated function on a zero-slot struct still gets a non-leaf prologue at every optimization level, including the non-inlined O3 body (RUE-2196)."
files = [{ path = "main.rue", source = """
struct S {
    fn apply(f: fn(i32) -> i32) -> i32 { f(41) + 0 }
}

fn inc(value: i32) -> i32 { value + 1 }

fn main() -> i32 { S.apply(inc) }
""" }]
stdout = ""
exit_code = 42

[[case]]
name = "callback_writes_back_through_inout_and_takes_stack_arguments"
description = "An `inout` argument crosses the indirect call by address and is written back; eight integer arguments spill the register roster onto the outgoing stack area exactly as at a direct call."
files = [{ path = "main.rue", source = """
fn bump(inout n: i32) { n = n + 1; }

fn twice(step: fn(inout i32), inout n: i32) {
    step(inout n);
    step(inout n);
}

fn add8(a: i64, b: i64, c: i64, d: i64, e: i64, f: i64, g: i64, h: i64) -> i64 {
    a + b + c + d + e + f + g + h
}

fn total(cb: fn(i64, i64, i64, i64, i64, i64, i64, i64) -> i64) -> i64 {
    cb(1, 2, 3, 4, 5, 6, 7, 8)
}

fn main() -> i32 {
    let mut count = 4;
    twice(bump, inout count);
    @intCast(total(add8)) + count
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "nested_aliased_and_associated_callbacks_run_natively"
description = "A callback that takes a callback, a `const` alias, a receiverless associated function and a generic callee's substituted `fn(T) -> T` parameter all reach their targets."
files = [{ path = "main.rue", source = """
struct Counter {
    n: i32,
    fn zero() -> i32 { 0 }
}

fn inc(value: i32) -> i32 { value + 1 }
const STEP = inc;

fn apply(cb: fn(i32) -> i32, value: i32) -> i32 { cb(value) }
fn twice(step: fn(fn(i32) -> i32, i32) -> i32, value: i32) -> i32 {
    step(inc, step(STEP, value))
}
fn make(cb: fn() -> i32) -> i32 { cb() }
fn generic(comptime T: type, cb: fn(T) -> T, value: T) -> T { cb(value) }

fn main() -> i32 { twice(apply, 38) + make(Counter.zero) + generic(i32, inc, 1) }
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "by_value_aggregate_argument_crosses_the_indirect_call"
description = "A two-slot struct passed by value to the callback is marshaled through the same argument plan as a direct call."
files = [{ path = "main.rue", source = """
struct Pair { a: i64, b: i64 }

fn sum(p: Pair, k: i64) -> i64 { p.a + p.b + k }
fn apply(cb: fn(Pair, i64) -> i64, p: Pair, k: i64) -> i64 { cb(p, k) }

fn main() -> i32 { @intCast(apply(sum, Pair { a: 20, b: 20 }, 2)) }
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "float_two_slot_and_hidden_result_callbacks_run_natively"
description = "RUE-2113 exit criteria: a callback that takes and returns `f64` in the floating-point registers, one that returns a two-slot struct in registers, and one that returns a three-slot struct through the hidden result location all cross the indirect call exactly as a direct call."
files = [{ path = "main.rue", source = """
struct Pair { a: i64, b: i64 }
struct Triple { a: i64, b: i64, c: i64 }

fn scale(x: f64, k: f64) -> f64 { x * k }
fn mix(x: f64, k: f64, cb: fn(f64, f64) -> f64) -> f64 { cb(x, k) + 0.5 }

fn split(n: i64) -> Pair { Pair { a: n / 2, b: n - n / 2 } }
fn halves(n: i64, cb: fn(i64) -> Pair) -> i64 {
    let p = cb(n);
    p.a * 100 + p.b
}

fn spread(n: i64) -> Triple { Triple { a: n, b: n + 1, c: n + 2 } }
fn total(n: i64, cb: fn(i64) -> Triple) -> i64 {
    let t = cb(n);
    t.a + t.b + t.c
}

fn main() -> i32 {
    let f: i64 = @float_to_int(mix(3.0, 2.5, scale));  // 7.5 + 0.5 = 8
    let two = halves(7, split);                        // 3 * 100 + 4 = 304
    let three = total(10, spread);                     // 10 + 11 + 12 = 33
    @intCast(f + two - three - 237)                    // 42
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "inout_aggregate_context_is_written_back_through_the_indirect_call"
description = "RUE-2113 exit criteria: a mutable context struct reaches the callback by `inout` on every call and every write is visible to the caller afterwards."
files = [{ path = "main.rue", source = """
struct Stats { sum: i64, seen: i64, max: i64 }

fn tally(inout s: Stats, v: i64) {
    s.sum = s.sum + v;
    s.seen = s.seen + 1;
    if v > s.max { s.max = v; }
}

fn each(items: [i64; 4], inout s: Stats, visit: fn(inout Stats, i64)) {
    for v in items {
        visit(inout s, v);
    }
}

fn main() -> i32 {
    let mut s = Stats { sum: 0, seen: 0, max: 0 };
    each([5, 17, 3, 9], inout s, tally);
    @intCast(s.sum + s.seen - s.max + 21)  // 34 + 4 - 17 + 21 = 42
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "callback_forwarded_across_modules_reaches_its_target"
description = "RUE-2113 exit criteria: the root names a callback from one module, passes it to a second module, which forwards it to a third; the target and the context both survive the two module boundaries."
files = [
    { path = "main.rue", source = """
const policy = @import("policy.rue");
const pipeline = @import("pipeline.rue");

fn main() -> i32 {
    let up = policy.Policy { descending: false };
    let down = policy.Policy { descending: true };
    let first = pipeline.run(borrow up, 3, 9, policy.precedes);
    let second = pipeline.run(borrow down, 3, 9, policy.precedes);
    @intCast(first * 10 + second)
}
""" },
    { path = "policy.rue", source = """
pub struct Policy { descending: bool }

pub fn precedes(borrow p: Policy, a: i64, b: i64) -> bool {
    if p.descending { a > b } else { a < b }
}
""" },
    { path = "pipeline.rue", source = """
const policy = @import("policy.rue");
const engine = @import("engine.rue");

pub fn run(borrow p: policy.Policy, a: i64, b: i64,
           cmp: fn(borrow policy.Policy, i64, i64) -> bool) -> i64 {
    engine.choose(borrow p, a, b, cmp)
}
""" },
    { path = "engine.rue", source = """
const policy = @import("policy.rue");

pub fn choose(borrow p: policy.Policy, a: i64, b: i64,
              cmp: fn(borrow policy.Policy, i64, i64) -> bool) -> i64 {
    if cmp(borrow p, a, b) { a } else { b }
}
""" },
]
args = ["main.rue", "-o", "prog"]
exit_code = 39

[[case]]
name = "module_qualified_associated_functions_and_reexport_chains_bind_as_callbacks"
description = "RUE-2197: `module.Type.function` and a function reached through a re-export chain (`outer.inner.f`, 10.4) bind as callbacks exactly as they call, including into a generic receiving function; the direct call and a local `const` alias are the controls."
files = [
    { path = "main.rue", source = """
const h = @import("helper.rue");
const outer = @import("outer.rue");
const S = h.S;

fn apply0(f: fn() -> i32) -> i32 { f() }
fn apply1(f: fn(i32) -> i32) -> i32 { f(41) }
fn generic(comptime T: type, f: fn(T) -> T, value: T) -> T { f(value) }

fn main() -> i32 {
    let direct = h.S.answer() + outer.inner.inc(41);           // 84
    let qualified = apply0(h.S.answer) + apply1(outer.inner.inc); // 84
    let aliased = apply0(S.answer);                              // 42
    let deep = apply1(outer.inner.S2.bump);                      // 42
    let generic_bound = generic(i32, h.S.twice, 21);             // 42
    if direct == 84 && qualified == 84 && aliased == 42 && deep == 42 && generic_bound == 42 { 42 } else { 1 }
}
""" },
    { path = "helper.rue", source = """
pub struct S {
    fn answer() -> i32 { 42 }
    fn twice(x: i32) -> i32 { x * 2 }
}
""" },
    { path = "outer.rue", source = """
pub const inner = @import("inner.rue");
""" },
    { path = "inner.rue", source = """
pub fn inc(x: i32) -> i32 { x + 1 }
pub struct S2 {
    fn bump(x: i32) -> i32 { x + 1 }
}
""" },
]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "module_qualified_callback_rejections_follow_the_call_rules"
description = "RUE-2197: through a module the same ineligibility rules apply as for a local type: a receiver method is rejected (E0216)."
files = [
