}
""" }]
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
exit_code = 5

# A source-defined type with the same spelling in another module is a distinct
# nominal identity and cannot contextualize a string literal.
[[case]]
name = "user_module_strbuf_name_does_not_gain_literal_identity"
files = [
  { path = "main.rue", source = """
const other = @import("other.rue");
fn take(value: other.StrBuf) -> i32 { 0 }
fn main() -> i32 { take("literal") }
""" },
  { path = "other.rue", source = """
pub struct StrBuf { value: i32 }
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "expected string type"]

# ============================================================================
# RUE-386 two-types model: reject buffer/view -> first-class `str` escapes.
# Both of these were VERIFIED SEGFAULTS (exit 139) on the pre-fix compiler: a
# heap `StrBuf` coerced to a first-class `str` that escaped its scope, leaving a
# dangling `{ptr, len}`. They are now compile errors (E0495), and each legal
# alternative (`borrow str`) is exercised alongside.
# ============================================================================

# The original RUE-386 repro #1: a `StrBuf` passed to a bare `str` parameter,
# stored in a struct field, and escaping its scope. SEGFAULT -> E0495.
[[case]]
name = "strbuf_to_first_class_str_param_field_escape_rejected"
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

struct Keep { s: str }
fn cap(s: str) -> Keep { Keep { s: s } }
fn main() -> i32 {
    let k = {
        let left: StrBuf = "xx";
        let right: StrBuf = "yy";
        let b = left + right;
        cap(b)
    };
    @dbg(k.s.len());
    @dbg(k.s[0]);
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
compile_fail = true
error_contains = ["E0495", "did you mean `borrow str`?"]

# The original RUE-386 repro #2: the return-position variant. SEGFAULT -> E0495.
[[case]]
name = "strbuf_to_first_class_str_return_escape_rejected"
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn take(s: str) -> str { s }
fn main() -> i32 {
    let r = {
        let left: StrBuf = "xx";
        let right: StrBuf = "yy";
        let b = left + right;
        take(b)
    };
    @dbg(r.len());
    @dbg(r[0]);
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
compile_fail = true
error_contains = ["E0495"]

# A borrowed `str` view escaping via a returned struct field was ALSO a verified
# segfault (the `borrow`-keyword variant of repro #1): E0497.
[[case]]
name = "borrow_str_view_field_escape_rejected"
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

struct Keep { s: str }
fn cap(borrow s: str) -> Keep { Keep { s: s } }
fn main() -> i32 {
    let k = {
        let left: StrBuf = "xx";
        let right: StrBuf = "yy";
        let b = left + right;
        cap(borrow b)
    };
    @dbg(k.s.len());
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
compile_fail = true
error_contains = ["E0497"]

# The legal alternative to the repros: read the buffer through a `borrow str`
# view within the call. A `Str(N)` buffer (static-backed like `str`) is read
# correctly through the view — `.len()` and the first byte.
[[case]]
name = "buffer_read_through_borrow_str_view_ok"
files = [{ path = "main.rue", source = """
fn len_of(borrow s: str) -> u64 { s.len() }
fn first(borrow s: str) -> u8 { s[0] }
fn main() -> i32 {
    let buf: Str(8) = "hello";
    if len_of(borrow buf) == 5 && first(borrow buf) == 104 { 7 } else { 0 }
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 7

# RUE-559 facet 1: the SAME reads with a heap `StrBuf` source. Before the
# call-site view materialization, the 3-word `{ptr, len, cap}` header was
# passed raw through the 2-slot by-value ABI: `.len()` returned the CAPACITY
# (16) and byte indexing dereferenced the length (segfault, exit 139). The
# buffer is borrowed, not moved, so it stays usable (and is dropped exactly
# once) in the caller.
[[case]]
name = "strbuf_read_through_borrow_str_view_values"
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn len_of(borrow s: str) -> u64 { s.len() }
fn first(borrow s: str) -> u8 { s[0] }
fn main() -> i32 {
    let left: StrBuf = "xx";
    let right: StrBuf = "yy";
    let b = left + right;                 // heap StrBuf: len 4, cap != 4
    let len_ok = len_of(borrow b) == 4;  // the length, NOT the capacity
    let byte_ok = first(borrow b) == 120;    // 'x', no segfault
    let reuse_ok = len_of(borrow b) == 4;    // borrow again: not moved
    let own_ok = b.len() == 4;               // caller still owns b
    if len_ok && byte_ok && reuse_ok && own_ok { 9 } else { 0 }
}
""" }]
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
exit_code = 9

# RUE-559 facet 2: an unannotated literal binding is a first-class `str`.
# This also pins the loan/move interaction (RUE-523): a single
# `borrow` argument must NOT be misread as a move of its own loan (E0208).
[[case]]
name = "strbuf_literal_binding_borrow_str_len"
files = [{ path = "main.rue", source = """
fn rd(borrow s: str) -> u64 { s.len() }
fn main() -> i32 {
    let s = "hello";             // stable first-class str
    @intCast(rd(borrow s))
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 5

# RUE-559: module-qualified calls take a separate argument-analysis path
# (analyze_module_member_call) that skipped the slice/str coercions entirely —
# a `StrBuf` passed to a module function's `borrow s: str` parameter failed
# E0206. Exercises the coercion through `m.f(borrow b)`.
[[case]]
name = "module_fn_borrow_str_view_of_strbuf"
files = [
    { path = "util.rue", source = """
pub fn rd(borrow s: str) -> u64 {
    s.len()
}
""" },
    { path = "main.rue", source = """
const util = @import("util.rue");
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn main() -> i32 {
    let left: StrBuf = "xx";
    let right: StrBuf = "yy";
    let b = left + right;
    @intCast(util.rd(borrow b))
}
""" },
]
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
exit_code = 4

# The comptime evaluator must use the canonical type resolver: `str` is
# registered lazily, and this is deliberately its first use in the program.
[[case]]
name = "generic_first_use_lazy_str_type_argument"
files = [{ path = "main.rue", source = """
fn choose(comptime T: type, trailing: i32) -> i32 {
    trailing
}

fn main() -> i32 {
    choose(str, 42)
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 42

[[case]]
name = "runtime_parameter_shadows_lazy_str_type_value"
files = [{ path = "main.rue", source = """
fn choose(comptime T: type, value: T) -> i32 { 0 }

fn outer(str: i32) -> i32 {
    choose(str, str)
}

fn main() -> i32 { outer(42) }
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["compile-time known value"]

[[case]]
name = "ignored_type_parameter_still_validates_argument_kind"
files = [{ path = "main.rue", source = """
fn Ignore(comptime T: type) -> type {
    struct { value: i32 }
}

fn main() -> i32 {
    let I = Ignore(7);
    0
}
""" }]
compile_fail = true
error_contains = ["must be a type"]

# RUE-559: a `StrBuf` struct FIELD as the borrowed view source — the coercion
# traces the place projection, not just whole variables.
[[case]]
name = "strbuf_field_borrow_str_view"
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

struct Holder { buf: StrBuf }

fn rd(borrow s: str) -> u64 { s.len() }

fn main() -> i32 {
    let left: StrBuf = "xyz";
    let right: StrBuf = "w";
    let h = Holder { buf: left + right };
    @intCast(rd(borrow h.buf))
}
""" }]
args = ["main.rue", "-o", "prog"]
env = { RUE_STD_PATH = "${REAL_STD}" }
exit_code = 4

# --- `len` result typing on the string rungs (RUE-1679) ----------------------
#
# `s.len()` is `u64` (spec 3.7:45 for `str`, 3.7:52 for `Str(N)`). Neither type
# has a DECLARED `len` — sema answers the call by reading the view's `len` word,
# the same route a slice `[T]` takes — so until inference published the `u64`
# result the call typed as the error type, which unifies with any annotation. A
# mismatched binding then sailed through inference and reached CFG verification
# as a u64 value in an i32 slot, surfacing as E9000. This is the RUE-1611 class
# on the string rungs; RUE-1611 fixed `[T]` and deliberately excluded these two
# on the assumption their `len` signatures resolve, which they do not.
#
# Each mismatch case asserts the ABSENCE of the ICE as well as the presence of
# the ordinary diagnostic: a fix that only changed the wording would still pass
# a bare `error_contains`.

[[case]]
name = "str_len_mismatched_annotation_is_e0206"
description = "RUE-1679 repro: `let n: i32 = s.len();` on a `str` local is E0206 at the binding, not a CFG verification ICE."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: str = "hello";
    let n: i32 = s.len();
    n
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected i32, found u64"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification"]

[[case]]
name = "str_literal_len_mismatched_annotation_is_e0206"
description = "The same call on a bare literal receiver, whose text type is still contextual when the method is looked up."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let n: i32 = "hello".len();
    n
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected i32, found u64"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification"]

[[case]]
name = "str_fixed_len_mismatched_annotation_is_e0206"
description = "A `Str(N)` receiver takes the same route as `str` and is type-checked the same way."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: Str(16) = "hello";
    let n: i32 = s.len();
    n
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected i32, found u64"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification"]

[[case]]
name = "str_field_len_mismatched_annotation_is_e0206"
description = "A struct-FIELD receiver reaches the call with a concrete `str` type rather than a literal's contextual variable — the other half of the mechanism."
files = [{ path = "main.rue", source = """
struct Holder { s: str }
fn main() -> i32 {
    let h = Holder { s: "hello" };
    let n: i32 = h.s.len();
    n
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected i32, found u64"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification"]

[[case]]
name = "str_param_len_mismatched_annotation_is_e0206"
description = "A `str` parameter receiver, the third way the receiver's type reaches the call."
files = [{ path = "main.rue", source = """
fn take(s: str) -> i32 {
    let n: i32 = s.len();
    n
}
fn main() -> i32 {
    take("hello")
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected i32, found u64"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification"]

[[case]]
name = "str_len_u64_annotation_and_intcast_stay_legal"
description = "Control: the exact `u64` annotation is accepted for `str`, `Str(N)` and a literal, and `@intCast` is how the length reaches a narrower type. Exit code is the summed length, so a wrong published result type would show up as a wrong value, not just a compile failure."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: str = "hello";
    let f: Str(16) = "hi";
    let a: u64 = s.len();
    let b: u64 = f.len();
    let c: i32 = @intCast("xyz".len());
    @intCast(a) + @intCast(b) + c
}
""" }]
args = ["main.rue", "-o", "prog"]
exit_code = 10

[[case]]
name = "str_unknown_method_is_undefined_method_not_ice"
description = "Control: `len` is the only method these rungs answer, and every other name is still an ordinary undefined-method diagnostic — publishing `len`'s result did not turn a typo into an ICE."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: str = "hello";
    let n = s.bogus();
    n
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0411", "no method named 'bogus' found for type 'str'"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification"]

[[case]]
name = "str_len_with_argument_is_undefined_method_not_ice"
description = "Control: `len` with an argument is not the zero-arg view `len`; it stays an ordinary undefined-method diagnostic."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: str = "hello";
    let n: u64 = s.len(1);
    @intCast(n)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0411", "no method named 'len' found for type 'str'"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification"]

# --- Saved sema-fuzzer return mismatch (RUE-1513) ---------------------------

