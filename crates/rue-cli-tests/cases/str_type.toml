# The `str` string type — executable regression tests (ADR-0043 Phase 3,
# RUE-324).
#
# `str` is `[u8]` + the UTF-8 byte-string convention: a read-only two-word view
# `{ptr, len}` that reuses the slice representation. StrBuf literals have type
# `str` where a `str` is expected, and are STATIC-BACKED — their bytes live in
# `.rodata`, and the value is `{ptr -> rodata bytes, len = byte length}` (a
# 2-word value, not the 3-word heap `StrBuf`). Because static data cannot
# dangle, a literal `str` is FIRST-CLASS: `@copy`, storable, reassignable,
# returnable, passable.
#
# `.len()` reads the runtime `len` word (byte length). `s[i]` reads the i-th
# PACKED byte via `__rue_str_byte_at(ptr, len, index)` (bounds-checked, traps
# exit 101) — packed bytes, NOT the 8-byte-slotted stride an array slice uses.
#
# Deferred to later phases: `str` concat/comparison, `str`<->`StrBuf` interop,
# methods beyond `.len()`/index, and char iteration.

[section]
id = "cli.str_type"
name = "str type (ADR-0043 Phase 3)"
description = "Static-backed first-class string literals: len(), packed byte-indexing, params, storage."

# The canonical verify-by-execution: a `str` local, `.len()` == 5, and s[0] the
# first byte 'h' == 104.
[[case]]
name = "str_len_and_first_byte"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: str = "hello";
    let n: u64 = s.len();
    let b: u8 = s[0];
    if n == 5 && b == 104 { 42 } else { 0 }
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 42

# Byte indexing sees raw packed bytes (a multibyte char decomposes into its
# UTF-8 bytes), never char boundaries. "café" = c a f 0xC3 0xA9.
[[case]]
name = "str_packed_byte_indexing"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: str = "café";
    @dbg(s.len());   // 5 bytes
    @dbg(s[2]);      // 102 'f'
    @dbg(s[3]);      // 195 0xC3
    @dbg(s[4]);      // 169 0xA9
    0
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 0
stdout = "5\n102\n195\n169\n"

# An out-of-bounds byte index traps at runtime (exit 101), like array/StrBuf.
[[case]]
name = "str_index_out_of_bounds_traps"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: str = "hi";
    let b: u8 = s[5];
    @intCast(b)
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 101
runtime_error_contains = ["index out of bounds"]

# A `str` parameter receives a string literal (first-class argument) and a
# forwarded `str` variable, both by value.
[[case]]
name = "str_param_literal_and_forward"
files = [{ path = "main.rue", source = """
fn first_byte(s: str) -> u8 {
    s[0]
}
fn len_of(s: str) -> u64 {
    s.len()
}
fn main() -> i32 {
    let lit: u8 = first_byte("hello");     // 104
    let s: str = "world";
    let n: u64 = len_of(s);                 // 5 (forwarded str var)
    if lit == 104 && n == 5 { 7 } else { 0 }
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 7

# A literal `str` is first-class: returned from a function, stored in a struct
# field, and reassigned through a `let mut`.
[[case]]
name = "str_first_class_return_store_reassign"
files = [{ path = "main.rue", source = """
struct Tag { name: str }
fn pick(b: bool) -> str {
    if b { return "yes"; }
    "no"
}
fn main() -> i32 {
    let t: Tag = Tag { name: "abc" };       // stored in a field
    let picked: str = pick(true);           // returned
    let mut m: str = "hello";
    m = "hi";                               // reassigned
    // 3 (field) + 3 (picked "yes") + 2 (m "hi") = 8
    @intCast(t.name.len() + picked.len() + m.len())
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 8

# Two-types model (ADR-0043, RUE-386): a first-class / static `str` value is NOT
# a legal `inout str` operand — an exclusive view requires *local* buffer
# provenance. (This supersedes the earlier RUE-385 behaviour, where `inout str`
# rebound the caller's static `{ptr, len}`; under the ruling that static-operand
# case is rejected outright, closing the write-to-`.rodata` and Copy-two-roots
# holes.) The callee/assignment never runs; sema rejects the call.
[[case]]
name = "str_inout_static_operand_rejected"
files = [{ path = "main.rue", source = """
fn set_hi(inout s: str) {
    // The callee never runs: this case isolates the invalid call operand.
    let _length = s.len();
}
fn main() -> i32 {
    let mut s: str = "hello";
    set_hi(inout s);
    @intCast(s.len())
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
compile_fail = true
error_contains = ["E0496"]

# `inout str` DOES accept a local buffer operand (`StrBuf`/`Str(N)`): the
# exclusive view reads the buffer's bytes through the `str` interface.
[[case]]
name = "str_inout_accepts_local_buffer"
files = [{ path = "main.rue", source = """
fn take(inout s: str) -> u64 {
    s.len()
}
fn main() -> i32 {
    let mut b: Str(8) = "hello";
    @intCast(take(inout b))
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 5

# Without the preview flag, `str` is gated with a clear diagnostic (not an ICE).
[[case]]
name = "str_requires_preview_flag"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s: str = "hello";
    @intCast(s.len())
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["requires preview feature"]

# A string literal with NO `str` expectation stays the 3-word heap `StrBuf`, so
# existing StrBuf operations are unaffected by the `str` preview.
[[case]]
name = "str_preview_does_not_change_string_default"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let s = "hello";        // no annotation -> StrBuf
    let t: StrBuf = s;      // StrBuf, not str
    @intCast(t.len())
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 5

# ============================================================================
# RUE-386 two-types model: reject buffer/view -> first-class `str` escapes.
# Both of these were VERIFIED SEGFAULTS (exit 139) on the pre-fix compiler: a
# heap `StrBuf` coerced to a first-class `str` that escaped its scope, leaving a
# dangling `{ptr, len}`. They are now compile errors (E0495), and each legal
# alternative (`borrow str`) is exercised alongside.
# ============================================================================

# The original RUE-386 repro #1: a `StrBuf` passed to a bare `str` parameter,
# stored in a struct field, and escaping its scope. SEGFAULT -> E0495.
[[case]]
name = "strbuf_to_first_class_str_param_field_escape_rejected"
files = [{ path = "main.rue", source = """
struct Keep { s: str }
fn cap(s: str) -> Keep { Keep { s: s } }
fn main() -> i32 {
    let k = {
        let b = "xx" + "yy";
        cap(b)
    };
    @dbg(k.s.len());
    @dbg(k.s[0]);
    0
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
compile_fail = true
error_contains = ["E0495", "did you mean `borrow str`?"]

# The original RUE-386 repro #2: the return-position variant. SEGFAULT -> E0495.
[[case]]
name = "strbuf_to_first_class_str_return_escape_rejected"
files = [{ path = "main.rue", source = """
fn take(s: str) -> str { s }
fn main() -> i32 {
    let r = {
        let b = "xx" + "yy";
        take(b)
    };
    @dbg(r.len());
    @dbg(r[0]);
    0
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
compile_fail = true
error_contains = ["E0495"]

# A borrowed `str` view escaping via a returned struct field was ALSO a verified
# segfault (the `borrow`-keyword variant of repro #1): E0497.
[[case]]
name = "borrow_str_view_field_escape_rejected"
files = [{ path = "main.rue", source = """
struct Keep { s: str }
fn cap(borrow s: str) -> Keep { Keep { s: s } }
fn main() -> i32 {
    let k = {
        let b = "xx" + "yy";
        cap(borrow b)
    };
    @dbg(k.s.len());
    0
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
compile_fail = true
error_contains = ["E0497"]

# The legal alternative to the repros: read the buffer through a `borrow str`
# view within the call. A `Str(N)` buffer (static-backed like `str`) is read
# correctly through the view — `.len()` and the first byte.
[[case]]
name = "buffer_read_through_borrow_str_view_ok"
files = [{ path = "main.rue", source = """
fn len_of(borrow s: str) -> u64 { s.len() }
fn first(borrow s: str) -> u8 { s[0] }
fn main() -> i32 {
    let buf: Str(8) = "hello";
    if len_of(borrow buf) == 5 && first(borrow buf) == 104 { 7 } else { 0 }
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 7

# RUE-559 facet 1: the SAME reads with a heap `StrBuf` source. Before the
# call-site view materialization, the 3-word `{ptr, len, cap}` header was
# passed raw through the 2-slot by-value ABI: `.len()` returned the CAPACITY
# (16) and byte indexing dereferenced the length (segfault, exit 139). The
# buffer is borrowed, not moved, so it stays usable (and is dropped exactly
# once) in the caller.
[[case]]
name = "strbuf_read_through_borrow_str_view_values"
files = [{ path = "main.rue", source = """
fn len_of(borrow s: str) -> u64 { s.len() }
fn first(borrow s: str) -> u8 { s[0] }
fn main() -> i32 {
    let b = "xx" + "yy";                 // heap StrBuf: len 4, cap != 4
    let len_ok = len_of(borrow b) == 4;  // the length, NOT the capacity
    let byte_ok = first(borrow b) == 120;    // 'x', no segfault
    let reuse_ok = len_of(borrow b) == 4;    // borrow again: not moved
    let own_ok = b.len() == 4;               // caller still owns b
    if len_ok && byte_ok && reuse_ok && own_ok { 9 } else { 0 }
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 9

# RUE-559 facet 2: an unannotated literal binding is a `StrBuf` too (see
# str_preview_does_not_change_string_default) — its borrowed view used to
# read length 0. Also pins the loan/move interaction (RUE-523): a single
# `borrow` argument must NOT be misread as a move of its own loan (E0208).
[[case]]
name = "strbuf_literal_binding_borrow_str_len"
files = [{ path = "main.rue", source = """
fn rd(borrow s: str) -> u64 { s.len() }
fn main() -> i32 {
    let s = "hello";             // StrBuf (no `str` annotation)
    @intCast(rd(borrow s))
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 5

# RUE-559: module-qualified calls take a separate argument-analysis path
# (analyze_module_member_call) that skipped the slice/str coercions entirely —
# a `StrBuf` passed to a module function's `borrow s: str` parameter failed
# E0206. Exercises the coercion through `m.f(borrow b)`.
[[case]]
name = "module_fn_borrow_str_view_of_strbuf"
files = [
    { path = "util.rue", source = """
pub fn rd(borrow s: str) -> u64 {
    s.len()
}
""" },
    { path = "main.rue", source = """
const util = @import("util.rue");

fn main() -> i32 {
    let b = "xx" + "yy";
    @intCast(util.rd(borrow b))
}
""" },
]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 4

# The comptime evaluator must use the canonical type resolver: `str` is
# registered lazily, and this is deliberately its first use in the program.
[[case]]
name = "generic_first_use_lazy_str_type_argument"
files = [{ path = "main.rue", source = """
fn choose(comptime T: type, trailing: i32) -> i32 {
    trailing
}

fn main() -> i32 {
    choose(str, 42)
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 42

[[case]]
name = "generic_lazy_str_type_argument_preserves_preview_diagnostic"
files = [{ path = "main.rue", source = """
fn choose(comptime T: type, trailing: i32) -> i32 {
    trailing
}

fn main() -> i32 {
    choose(str, 42)
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E1100", "requires preview feature"]

[[case]]
name = "runtime_parameter_shadows_lazy_str_type_value"
files = [{ path = "main.rue", source = """
fn choose(comptime T: type, value: T) -> i32 { 0 }

fn outer(str: i32) -> i32 {
    choose(str, str)
}

fn main() -> i32 { outer(42) }
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
compile_fail = true
error_contains = ["compile-time known value"]

[[case]]
name = "ignored_type_parameter_still_validates_argument_kind"
files = [{ path = "main.rue", source = """
fn Ignore(comptime T: type) -> type {
    struct { value: i32 }
}

fn main() -> i32 {
    let I = Ignore(7);
    0
}
""" }]
compile_fail = true
error_contains = ["must be a type"]

# RUE-559: a `StrBuf` struct FIELD as the borrowed view source — the coercion
# traces the place projection, not just whole variables.
[[case]]
name = "strbuf_field_borrow_str_view"
files = [{ path = "main.rue", source = """
struct Holder { buf: StrBuf }

fn rd(borrow s: str) -> u64 { s.len() }

fn main() -> i32 {
    let h = Holder { buf: "xyz" + "w" };
    @intCast(rd(borrow h.buf))
}
""" }]
args = ["main.rue", "--preview", "string_trio", "-o", "prog"]
exit_code = 4
