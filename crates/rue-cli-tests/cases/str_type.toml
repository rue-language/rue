# An explicit, imported StrBuf context selects three-word materialization.
[[case]]
name = "str_preserves_explicit_strbuf_literal_context"
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
