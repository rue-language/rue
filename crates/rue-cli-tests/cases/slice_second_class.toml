# Second-class slice enforcement through the real driver (ADR-0043 Phase 1,
# RUE-322). A slice `[T]` is a second-class fat-pointer view (ADR-0037): valid
# only in argument position. These cases drive the real `rue` binary on real
# files and pin the escape-family diagnostics
# (E0487 return / E0488 aggregate field / E0489 let-or-const) and confirm the
# one legal position (a parameter) is accepted.
#
# The fat-pointer runtime (the by-value `{ptr, len}` ABI plus slice `.len()` and
# bounds-checked read-indexing on both backends) has landed; its end-to-end
# runtime behaviour (sums, the OOB trap) is pinned in slices_mvp.toml.

[section]
id = "cli.slice_second_class"
name = "Slice second-class enforcement (ADR-0043 Phase 1)"
description = "A second-class slice `[T]` may only name a function parameter; every escaping position is a clean compile error (RUE-322)."

# Return position: a slice cannot be returned (E0487).
[[case]]
name = "slice_return_rejected_e0487"
description = "fn -> [i32] is E0487: a slice cannot be returned."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn f() -> [i32] { 0 }
fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0487", "cannot be returned"]

# Struct field: a slice cannot be stored in an aggregate (E0488).
[[case]]
name = "slice_struct_field_rejected_e0488"
description = "A struct field of slice type is E0488."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Holder { s: [i32] }
fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E0488", "cannot be stored in a struct field"]

# let binding: a slice cannot be bound past its argument scope (E0489).
[[case]]
name = "slice_let_rejected_e0489"
description = "A `let s: [i32]` local is E0489."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 { let s: [i32] = 0; 0 }
""" }]
compile_fail = true
error_contains = ["E0489", "can only name a function parameter"]

# Argument position (the one legal spot): a slice parameter compiles and runs
# (ADR-0043 Phase 1 fat-pointer runtime, RUE-322). The end-to-end runtime
# behaviour — `.len()`, bounds-checked `s[i]`, the OOB trap — is pinned in
# slices_mvp.toml; here we only confirm the legal position is accepted.
[[case]]
name = "slice_param_position_compiles"
description = "A slice parameter is the one legal position; it compiles and runs."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn sum(borrow s: [i32]) -> i32 { 0 }
fn main() -> i32 { 0 }
""" }]
exit_code = 0
