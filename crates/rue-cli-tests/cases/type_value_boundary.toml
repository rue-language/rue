# The boundary between a type used as a *value* and a type used in an
# *annotation* (RUE-770).
#
# `Expr::TypeLit` has exactly three producers in the expression grammar:
# `struct { ... }`, `enum { ... }`, and a primitive type keyword. Every compound
# type shape — arrays, slices, pointers — is therefore reachable only from a
# type annotation, where lowering preserves element/length identity. The
# bracketed forms that look like array *types* in value position are ordinary
# array expressions over type values and are rejected at their own span, so RIR
# lowering never invents a stand-in name for an "array type value".
#
# These cases pin both halves: the rejections keep their precise diagnostics,
# and the annotation path keeps its runtime behavior (stdout pinned, not just
# the exit code).

[section]
id = "cli.type_value_boundary"
name = "Type-value boundary"
description = "Compound type shapes are annotation-only; value position yields precise diagnostics (RUE-770)."

[[case]]
name = "array_bracket_form_in_value_position_is_an_array_expression"
description = "`[i32; 4]` as a value is an array repeat of the type value `i32`, rejected at its own span (E1200) — not lowered to a placeholder array type."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let t = [i32; 4];
    0
}
""" }]
compile_fail = true
error_contains = ["E1200", "type values cannot exist at runtime", "[i32; 4]"]

[[case]]
name = "slice_bracket_form_in_value_position_is_an_array_expression"
description = "`[i32]` as a value is a one-element array literal holding the type value `i32`, rejected the same way."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let t = [i32];
    0
}
""" }]
compile_fail = true
error_contains = ["E1200", "type values cannot exist at runtime", "[i32]"]

[[case]]
name = "pointer_type_in_value_position_is_not_an_expression"
description = "`ptr const i32` never starts an expression, so it is a parse error (E0100) rather than a silently interned type value."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let p = ptr const i32;
    0
}
""" }]
compile_fail = true
error_contains = ["E0100", "expected expression, found 'ptr'"]

[[case]]
name = "primitive_type_value_still_binds"
description = "A primitive type keyword is the one compound-free shape the grammar admits as a value; it keeps its own name through lowering."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const T = i32;

fn Holder(comptime U: type) -> type {
    struct { value: U }
}

fn main() -> i32 {
    let h = Holder(T) { value: 7 };
    @dbg(h.value);
    @dbg(@size_of(T));
    0
}
""" }]
stdout = "7\n4\n"

[[case]]
name = "array_annotations_preserve_element_and_length"
description = "The annotation path keeps element/length identity for nested arrays, named lengths, and `@size_of` type arguments."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const N: i32 = 3;

fn main() -> i32 {
    let a: [i32; 4] = [3; 4];
    let n: [[u8; 2]; N] = [[1; 2]; 3];
    let e: i32 = @intCast(n[1][1]);
    @dbg(@size_of([i32; 4]));
    @dbg(@size_of([[u8; 2]; N]));
    @dbg(a[2] + e);
    0
}
""" }]
stdout = "16\n6\n4\n"

# A type written in a runtime position cannot hold `type` as an array element,
# a pointer pointee, or a slice element, at any depth: a value of it would
# carry a type value, and type values cannot exist at run time (4.14:6). Each
# position reports E1200 naming the child (RUE-2606); `comptime` positions
# that hold types are unaffected.

[[case]]
name = "let_annotation_pointer_to_type_is_e1200"
description = "`let g: ptr const type` reports E1200 at the binding rather than panicking while interning a pointer to `type` (RUE-2606)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let g: ptr const type = 0;
    0
}
""" }]
compile_fail = true
error_contains = ["E1200", "a pointer pointee cannot be `type`: type values cannot exist at runtime", "main.rue:2:5"]
compile_stderr_not_contains = ["panicked", "internal compiler error"]

[[case]]
name = "let_annotation_array_of_type_is_e1200"
description = "`let g: [type; 2]` reports E1200 rather than a mismatch against `[type; 2]` as if it were a runtime type (RUE-2606)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let g: [type; 2] = 0;
    0
}
""" }]
compile_fail = true
error_contains = ["E1200", "an array element cannot be `type`: type values cannot exist at runtime", "main.rue:2:5"]
compile_stderr_not_contains = ["E0206"]

[[case]]
name = "slice_of_type_in_body_type_syntax_is_e1200"
description = "`[type]` written in a body (here a `@size_of` argument) reports E1200 rather than panicking while minting the view's pointer field (RUE-2606)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @intCast(@size_of([type]))
}
""" }]
compile_fail = true
error_contains = ["E1200", "a slice element cannot be `type`: type values cannot exist at runtime"]
compile_stderr_not_contains = ["panicked", "internal compiler error"]

[[case]]
name = "parameter_pointer_to_type_is_e1200"
description = "A runtime parameter `ptr mut type` is E1200 at the parameter's type, even with no call, as a `fn` type taking `type` is (RUE-2606)."
files = [{ path = "main.rue", source = """
fn f(p: ptr mut type) -> i32 { 0 }

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E1200", "a pointer pointee cannot be `type`: type values cannot exist at runtime", "main.rue:1:9"]

[[case]]
name = "called_parameter_slice_of_type_is_e1200"
description = "A called function with a `borrow p: [type]` parameter reports E1200 at the parameter rather than panicking while importing its signature (RUE-2606)."
files = [{ path = "main.rue", source = """
fn g(borrow p: [type]) -> i32 { 0 }

fn main() -> i32 { g(borrow 0) }
""" }]
compile_fail = true
error_contains = ["E1200", "a slice element cannot be `type`: type values cannot exist at runtime", "main.rue:1:16"]
compile_stderr_not_contains = ["panicked", "internal compiler error", "E0202"]

[[case]]
name = "struct_field_array_of_type_is_e1200"
description = "A struct field `[type; 2]` is E1200, as a field `type` is (RUE-2606)."
files = [{ path = "main.rue", source = """
struct S { t: [type; 2] }

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E1200", "an array element cannot be `type`: type values cannot exist at runtime"]

[[case]]
name = "return_type_holding_type_is_e1200"
description = "`-> [ptr const type; 2]` is E1200 at the return type naming the innermost child; `-> type` alone is a constructor (RUE-2606)."
files = [{ path = "main.rue", source = """
fn f() -> [ptr const type; 2] { f() }

fn main() -> i32 { 0 }
""" }]
compile_fail = true
error_contains = ["E1200", "a pointer pointee cannot be `type`: type values cannot exist at runtime", "main.rue:1:11"]

[[case]]
name = "comptime_positions_holding_types_still_compile"
description = "Control for RUE-2606: a `comptime T: type` parameter, a `-> type` constructor whose fields are `T` and `[T; 2]`, a `[T]` parameter over it, and pointers and arrays of a constructed type all still compile and run."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn Pair(comptime T: type) -> type {
    struct { a: T, b: [T; 2] }
}

fn first(comptime T: type, borrow xs: [T]) -> T {
    xs[0]
}

fn main() -> i32 {
    let p = Pair(i64) { a: 1, b: [2, 3] };
    let xs: [i64; 2] = p.b;
    @dbg(first(i64, borrow xs));
    @dbg(@size_of(Pair(i32)));
    @dbg(@size_of([ptr const Pair(u8); 2]));
    0
}
""" }]
stdout = "2\n12\n16\n"
