[section]
id = "cli.explain"
name = "Compiler-owned error explanations"
description = """
RUE-437: `rue explain E####` is a non-compiling CLI command backed by the
canonical rue-error metadata identity. The deliberately invalid fixture proves
the successful command returns before source loading or compilation.
"""

[[case]]
name = "covered_code_is_explained_without_compiling"
files = [{ path = "main.rue", source = "fn # this source must never be parsed\n" }]
args = ["explain", "E0201"]
compile_only = true
compile_stdout_contains = [
  "E0201: Undefined variable",
  "Likely cause:",
  "Undefined local:",
  "Define the name before use:",
  "docs/spec/src/10-modules/03-visibility.md (spec rule 10.3:8)",
]
compile_stdout_not_contains = ["Compiled"]
compile_stderr_not_contains = ["main.rue", "error[E"]

[[case]]
name = "lexer_code_uses_the_same_compiler_owned_query"
files = [{ path = "main.rue", source = "fn # this source must never be parsed\n" }]
args = ["explain", "E0011"]
compile_only = true
compile_stdout_contains = [
  "E0011: Malformed float literal",
  "Leading dot diagnosed by the lexer:",
  "Trailing dot diagnosed by the parser:",
  "docs/spec/src/02-lexical-structure/_index.md (spec rule 2.0:2)",
]
compile_stdout_not_contains = ["Compiled"]
compile_stderr_not_contains = ["main.rue", "error[E"]

[[case]]
name = "lexer_budget_summary_is_explained_without_compiling"
files = [{ path = "main.rue", source = "fn # this source must never be parsed\n" }]
args = ["explain", "E0010"]
compile_only = true
compile_stdout_contains = [
  "E0010: Lexer diagnostics omitted",
  "after retaining its first 100 lexical diagnostics",
  "More than 100 lexical errors:",
]
compile_stdout_not_contains = ["Compiled"]
compile_stderr_not_contains = ["main.rue", "error[E"]

[[case]]
name = "parser_unexpected_eof_uses_the_active_unexpected_token_code"
files = [{ path = "main.rue", source = "fn # this source must never be parsed\n" }]
args = ["explain", "E0100"]
compile_only = true
compile_stdout_contains = [
  "E0100: Unexpected token",
  "End-of-file is treated as a token",
  "Unexpected end of file:",
  "docs/spec/src/06-items/01-functions.md (spec rule 6.1:2)",
]
compile_stdout_not_contains = ["Compiled"]
compile_stderr_not_contains = ["main.rue", "error[E"]

[[case]]
name = "parser_budget_summary_is_explained_without_compiling"
files = [{ path = "main.rue", source = "fn # this source must never be parsed\n" }]
args = ["explain", "E0103"]
compile_only = true
compile_stdout_contains = [
  "E0103: Parser diagnostics omitted",
  "first 100 diagnostics selected by the parser's diagnostic policy",
  "More than 100 parser errors:",
]
compile_stdout_not_contains = ["Compiled"]
compile_stderr_not_contains = ["main.rue", "error[E"]

[[case]]
name = "malformed_code_is_rejected"
files = [{ path = "main.rue", source = "fn main() {}\n" }]
args = ["explain", "E201"]
compile_fail = true
error_contains = ["must have the form E followed by exactly four decimal digits"]
compile_stdout_not_contains = ["E0201:"]

[[case]]
name = "unknown_code_is_rejected"
files = [{ path = "main.rue", source = "fn main() {}\n" }]
args = ["explain", "E9999"]
compile_fail = true
error_contains = ["unknown or retired error code E9999"]

[[case]]
name = "retired_code_is_rejected"
files = [{ path = "main.rue", source = "fn main() {}\n" }]
args = ["explain", "E0005"]
compile_fail = true
error_contains = ["unknown or retired error code E0005"]

[[case]]
name = "known_but_uncovered_code_is_rejected"
files = [{ path = "main.rue", source = "fn main() {}\n" }]
args = ["explain", "E0250"]
compile_fail = true
error_contains = ["no detailed explanation is available yet for E0250"]

[[case]]
name = "extra_argument_is_rejected"
files = [{ path = "main.rue", source = "fn main() {}\n" }]
args = ["explain", "E0201", "main.rue"]
compile_fail = true
error_contains = ["requires exactly one error code", "Usage: rue explain <E####>"]
