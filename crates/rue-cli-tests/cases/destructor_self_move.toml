# Moving `self` out of a destructor body is a compile error (RUE-139).
#
# Dropping a value runs its destructor and then the drop glue. If the
# destructor moves `self` to a new owner (a by-value call argument, another
# binding, a by-value method receiver, ...), that owner drops the value again
# at ITS scope exit — re-entering the destructor in infinite recursion (the
# original repro segfaulted on stack exhaustion at runtime). Sema now rejects
# the move with E0442, in the spirit of Rust's E0509 (cannot move out of a
# type implementing Drop).
#
# Reading `self`'s fields in a destructor stays legal (control case).

[section]
id = "cli.destructor_self_move"
name = "Destructor cannot move self out"
description = "Moving `self` out of a destructor is rejected at compile time (RUE-139)."

[[case]]
name = "destructor_passes_self_to_call_rejected"
description = "RUE-139 original repro: `consume(self)` inside `drop fn` used to compile and recurse at runtime (consume's param drop re-enters the destructor)."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

fn consume(d: D) -> i32 {
    d.v
}

drop fn D(self) {
    consume(self);
}

fn main() -> i32 {
    let _d = D { v: 7 };
    0
}
""" }]
compile_fail = true
error_contains = ["E0442", "cannot move `self` out of the destructor"]

[[case]]
name = "destructor_rebinds_self_rejected"
description = "Binding `self` to a local in a destructor is also a move to a new owner (the local's scope-exit drop would re-enter the destructor)."
files = [{ path = "main.rue", source = """
struct D { v: i32 }

drop fn D(self) {
    let stash = self;
    @dbg(stash.v);
}

fn main() -> i32 {
    let _d = D { v: 7 };
    0
}
""" }]
compile_fail = true
error_contains = ["E0442", "cannot move `self` out of the destructor"]

[[case]]
name = "destructor_reading_self_fields_stays_legal"
description = "Control: a destructor that only reads `self`'s fields compiles and runs exactly once."
files = [{ path = "main.rue", source = """
struct D { v: i32, w: i32 }

drop fn D(self) {
    @dbg(self.v);
    @dbg(self.w);
}

fn main() -> i32 {
    let d = D { v: 7, w: 8 };
    @dbg(100);
    d.v - 7
}
""" }]
stdout = "100\n7\n8\n"
exit_code = 0
