# Multi-file error attribution (RUE-115, RUE-175).
#
# Parse errors produced by the parser used to drop the
# FileId (defaulting to FileId::DEFAULT), so in a multi-file compile the
# diagnostic renderer fell back to an ARBITRARY source file: the error could be
# rendered with a caret on perfectly valid code in the wrong file. These cases
# pin that a parse error in one file is attributed to THAT file regardless of
# argument order, and that the other (valid) file is never named in stderr.
#
# RUE-175 was the same bug class one layer down: the parser built MERGED spans
# (binary exprs, unary exprs, assign-target field/index chains, implicit unit
# block results) with `Span::new`, which resets the FileId to DEFAULT. Any sema
# diagnostic whose primary span was such a merged span then landed on a
# hash-map-order-dependent file. The `*_span_*` cases below pin each expression
# shape to its actual file.

[section]
id = "cli.multifile_errors"
name = "Multi-file error attribution"
description = "Diagnostics must name the file that actually contains them (RUE-115, RUE-175)."

[[case]]
name = "parse_error_in_second_file"
description = """
RUE-115: the E0100 (unexpected token) conversion path lost the FileId. The
error lives in the imported bad.rue; stderr must point at bad.rue:1:9 and must
not caret the root file. (RUE-767 modernized this from legacy positional inputs
to @import: the error still lives in a non-root imported file.)
"""
files = [
    { path = "main.rue", source = """
const bad = @import("bad.rue");

fn main() -> i32 { 0 }
""" },
    { path = "bad.rue", source = """
fn bad( -> i32 { 2 }
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0100", "bad.rue:1:9"]
compile_stderr_not_contains = ["main.rue:"]

# RUE-767: this case was the order-swapped twin of parse_error_in_second_file,
# pinning that attribution did not depend on positional order. With exactly one
# root source there is no positional order to vary, so it now asserts the
# extra-source refusal instead.
[[case]]
name = "parse_error_in_first_file"
description = "RUE-767: a second positional source is refused (formerly the order-swap twin)."
files = [
    { path = "good.rue", source = "fn good() -> i32 { 1 }\n" },
    { path = "bad.rue", source = "fn main() -> i32 { 0 }\n" },
]
args = ["bad.rue", "good.rue", "-o", "prog"]
compile_fail = true
error_contains = ["unexpected extra source file", "good.rue", "@import"]

[[case]]
name = "missing_semicolon_error_in_second_file"
description = """
Control for RUE-115: the E0102 (expected semicolon) path already threaded the
FileId correctly via the parser state. Pin it so it stays correct. (RUE-767
modernized this from legacy positional inputs to @import.)
"""
files = [
    { path = "main.rue", source = """
const bad = @import("bad.rue");

fn main() -> i32 { 0 }
""" },
    { path = "bad.rue", source = """
fn other() -> i32 {
    let s = 1;
    s s
}
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0102", "bad.rue:3:5"]
compile_stderr_not_contains = ["main.rue:"]

[[case]]
name = "lex_and_parse_errors_in_different_files_are_accumulated"
description = """
RUE-361: multi-file parsing used to fail fast on the first lex/parse error,
so argument order determined which broken file was reported. Both broken files
must now be diagnosed in one compiler invocation. (RUE-767 modernized this from
legacy positional inputs to a root that @imports both broken helper files.)
"""
files = [
    { path = "main.rue", source = """
const lex_bad = @import("lex_bad.rue");
const parse_bad = @import("parse_bad.rue");

fn main() -> i32 { 0 }
""" },
    { path = "lex_bad.rue", source = """
fn lex_bad() -> i32 { $ }
""" },
    { path = "parse_bad.rue", source = """
fn parse_bad( -> i32 { 2 }
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = [
    "E0001",
    "lex_bad.rue:1:23",
    "E0100",
    "parse_bad.rue:1:15",
    "aborting due to 2 previous errors",
]

[[case]]
name = "binary_expr_span_in_second_file"
description = """
RUE-175: make_binary built the merged span with Span.new, dropping the
FileId. The E0206 on the `if 1 + 2` condition in the imported (non-root)
lib.rue alternated between lib.rue:2:8 and a misaligned caret in the root file
depending on hash-map iteration order. It must always point at lib.rue:2:8.
(RUE-920 modernized this case from legacy positional inputs to @import; the
regression surface — span attribution to a non-root FileId — is unchanged.)
"""
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");

fn main() -> i32 {
    return lib.check();
}
""" },
    { path = "lib.rue", source = """
pub fn check() -> i32 {
    if 1 + 2 {
        return 1;
    }
    return 0;
}
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "lib.rue:2:8"]
compile_stderr_not_contains = ["main.rue:"]

# RUE-767: this case was the order-swapped twin of binary_expr_span_in_second_file,
# pinning that attribution did not depend on which file came first. With exactly
# one root source there is no positional order to vary, so it now asserts the
# extra-source refusal instead.
[[case]]
name = "binary_expr_span_swapped_order"
description = "RUE-767: a second positional source is refused (formerly the order-swap twin)."
files = [
    { path = "main.rue", source = "fn main() -> i32 { 0 }\n" },
    { path = "lib.rue", source = "pub fn helper() -> i64 { return 1; }\n" },
]
args = ["main.rue", "lib.rue", "-o", "prog"]
compile_fail = true
error_contains = ["unexpected extra source file", "lib.rue", "@import"]

[[case]]
name = "unary_expr_span_in_second_file"
description = """
RUE-175: make_unary also built its merged span (operator start .. operand end)
with Span.new. The E0206 on the `if -1` condition in the imported (non-root)
lib.rue must point at lib.rue:2:8, never at the root file. (RUE-920 modernized
this case from legacy positional inputs to @import.)
"""
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");

fn main() -> i32 {
    return lib.check();
}
""" },
    { path = "lib.rue", source = """
pub fn check() -> i32 {
    if -1 {
        return 1;
    }
    return 0;
}
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "lib.rue:2:8"]
compile_stderr_not_contains = ["main.rue:"]

[[case]]
name = "field_assign_span_in_second_file"
description = """
RUE-175: field-assignment shape. The E0206 for assigning a bool to an i64
field in the imported (non-root) lib.rue must be attributed to the RHS at
lib.rue:4:11, never to the root file. (RUE-920 modernized this case from legacy
positional inputs to @import; RUE-1640 narrowed it to the value expression.)
"""
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");

fn main() -> i32 {
    return lib.check();
}
""" },
    { path = "lib.rue", source = """
struct P { x: i64 }
pub fn check() -> i32 {
    let mut p = P { x: 1 };
    p.x = true;
    return 0;
}
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "lib.rue:4:11"]
compile_stderr_not_contains = ["main.rue:"]

[[case]]
name = "index_expr_span_in_second_file"
description = """
RUE-175: index-expression shape. The E0206 whose primary span is the postfix
index expression `a[0]` (used where a bool is required) in the imported
(non-root) lib.rue must be attributed to lib.rue:3:13, never to the root file.
(RUE-920 modernized this case from legacy positional inputs to @import.)
"""
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");

fn main() -> i32 {
    return lib.check();
}
""" },
    { path = "lib.rue", source = """
pub fn check() -> i32 {
    let mut a = [1, 2, 3];
    let i = a[0] && true;
    return 0;
}
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "lib.rue:3:13"]
compile_stderr_not_contains = ["main.rue:"]

[[case]]
name = "directive_span_in_second_file"
description = """
RUE-189: the RIR directive encoding dropped the span's file id (and decoded
len as end), the same loss shape as the RUE-185 pattern-span bug. The
E0457 secondary label "type declared `@copy` here" anchors on the @copy
directive's span in other.rue; before the fix it rendered the honest
"unknown file id" fallback instead of the snippet. The label must show the
@copy line from other.rue and never fall back. (RUE-767 modernized this from a
legacy positional input to an @import from the root.)
"""
files = [
    { path = "main.rue", source = """
const other = @import("other.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "other.rue", source = """
@copy
pub struct P { x: i32 }

drop fn P(self) {
    @dbg(self.x);
}
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0457", "other.rue:4:1", "type declared `@copy` here", "@copy"]
compile_stderr_not_contains = ["unknown file id", "main.rue:"]

[[case]]
name = "directive_span_in_first_file"
description = """
RUE-189, swapped order: with the @copy struct in the FIRST file, the file id
is 0 (which coincidentally matched the pre-fix default), but the pre-fix
decode also read the span's len word as its END offset — so any directive not
at file offset 0 got a corrupted range. The `@copy` here sits mid-file after
a leading comment; its label must still render the right line. (RUE-767
modernized this from a legacy positional input to an @import from the root; the
distinct regression — a directive at a nonzero byte offset — is unchanged.)
"""
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "lib.rue", source = """
// leading comment so the directive is not at byte offset 0
@copy
pub struct Q { x: i32 }

drop fn Q(self) {
    @dbg(self.x);
}
""" },
]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0457", "lib.rue:5:1", "type declared `@copy` here", "@copy"]
compile_stderr_not_contains = ["unknown file id", "main.rue:"]
