# Multi-file error attribution (RUE-115, RUE-175).
#
# Parse errors produced by the chumsky error-conversion path used to drop the
# FileId (defaulting to FileId::DEFAULT), so in a multi-file compile the
# diagnostic renderer fell back to an ARBITRARY source file: the error could be
# rendered with a caret on perfectly valid code in the wrong file. These cases
# pin that a parse error in one file is attributed to THAT file regardless of
# argument order, and that the other (valid) file is never named in stderr.
#
# RUE-175 was the same bug class one layer down: the parser built MERGED spans
# (binary exprs, unary exprs, assign-target field/index chains, implicit unit
# block results) with `Span::new`, which resets the FileId to DEFAULT. Any sema
# diagnostic whose primary span was such a merged span then landed on a
# hash-map-order-dependent file. The `*_span_*` cases below pin each expression
# shape to its actual file.

[section]
id = "cli.multifile_errors"
name = "Multi-file error attribution"
description = "Diagnostics must name the file that actually contains them (RUE-115, RUE-175)."

[[case]]
name = "parse_error_in_second_file"
description = """
RUE-115: the E0100 (unexpected token) conversion path lost the FileId. The
error lives in bad.rue, passed second; stderr must point at bad.rue:1:9 and
must not mention good.rue at all.
"""
files = [
    { path = "good.rue", source = """
fn good() -> i32 { 1 }
""" },
    { path = "bad.rue", source = """
fn bad( -> i32 { 2 }
fn main() -> i32 { 0 }
""" },
]
args = ["good.rue", "bad.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0100", "bad.rue:1:9"]
compile_stderr_not_contains = ["good.rue"]

[[case]]
name = "parse_error_in_first_file"
description = """
RUE-115, swapped order: before the fix the rendered file depended on hash-map
iteration order, so the same error could land on either file. With bad.rue
passed first, stderr must still point at bad.rue and never at good.rue.
"""
files = [
    { path = "good.rue", source = """
fn good() -> i32 { 1 }
""" },
    { path = "bad.rue", source = """
fn bad( -> i32 { 2 }
fn main() -> i32 { 0 }
""" },
]
args = ["bad.rue", "good.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0100", "bad.rue:1:9"]
compile_stderr_not_contains = ["good.rue"]

[[case]]
name = "missing_semicolon_error_in_second_file"
description = """
Control for RUE-115: the E0102 (expected semicolon) path already threaded the
FileId correctly via the parser state. Pin it so it stays correct.
"""
files = [
    { path = "good.rue", source = """
fn good() -> i32 { 1 }
""" },
    { path = "bad.rue", source = """
fn other() -> i32 {
    let s = 1;
    s s
}
fn main() -> i32 { 0 }
""" },
]
args = ["good.rue", "bad.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0102", "bad.rue:3:5"]
compile_stderr_not_contains = ["good.rue"]

[[case]]
name = "binary_expr_span_in_second_file"
description = """
RUE-175: make_binary built the merged span with Span::new, dropping the
FileId. The E0206 on the `if 1 + 2` condition in main.rue (passed second)
alternated between main.rue:2:8 and a misaligned caret in lib.rue depending on
hash-map iteration order. It must always point at main.rue:2:8.
"""
files = [
    { path = "lib.rue", source = """
pub fn helper() -> i64 {
    return 1;
}
""" },
    { path = "main.rue", source = """
fn main() -> i64 {
    if 1 + 2 {
        return 1;
    }
    return 0;
}
""" },
]
args = ["lib.rue", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "main.rue:2:8"]
compile_stderr_not_contains = ["lib.rue"]

[[case]]
name = "binary_expr_span_swapped_order"
description = """
RUE-175, swapped argument order: attribution must not depend on which file
comes first on the command line.
"""
files = [
    { path = "lib.rue", source = """
pub fn helper() -> i64 {
    return 1;
}
""" },
    { path = "main.rue", source = """
fn main() -> i64 {
    if 1 + 2 {
        return 1;
    }
    return 0;
}
""" },
]
args = ["main.rue", "lib.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "main.rue:2:8"]
compile_stderr_not_contains = ["lib.rue"]

[[case]]
name = "unary_expr_span_in_second_file"
description = """
RUE-175: make_unary also built its merged span (operator start .. operand end)
with Span::new. The E0206 on the `if -1` condition must point at main.rue:2:8,
never at lib.rue.
"""
files = [
    { path = "lib.rue", source = """
pub fn helper() -> i64 {
    return 1;
}
""" },
    { path = "main.rue", source = """
fn main() -> i64 {
    if -1 {
        return 1;
    }
    return 0;
}
""" },
]
args = ["lib.rue", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "main.rue:2:8"]
compile_stderr_not_contains = ["lib.rue"]

[[case]]
name = "field_assign_span_in_second_file"
description = """
RUE-175: field-assignment shape. The E0206 for assigning a bool to an i64
field must be attributed to main.rue:4:5, never to lib.rue.
"""
files = [
    { path = "lib.rue", source = """
pub fn helper() -> i64 {
    return 1;
}
""" },
    { path = "main.rue", source = """
struct P { x: i64 }
fn main() -> i64 {
    let mut p = P { x: 1 };
    p.x = true;
    return p.x;
}
""" },
]
args = ["lib.rue", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "main.rue:4:5"]
compile_stderr_not_contains = ["lib.rue"]

[[case]]
name = "index_expr_span_in_second_file"
description = """
RUE-175: index-expression shape. The E0206 whose primary span is the postfix
index expression `a[0]` (used where a bool is required) must be attributed to
main.rue:3:13, never to lib.rue.
"""
files = [
    { path = "lib.rue", source = """
pub fn helper() -> i64 {
    return 1;
}
""" },
    { path = "main.rue", source = """
fn main() -> i64 {
    let mut a = [1, 2, 3];
    let i = a[0] && true;
    return 0;
}
""" },
]
args = ["lib.rue", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0206", "main.rue:3:13"]
compile_stderr_not_contains = ["lib.rue"]

[[case]]
name = "directive_span_in_second_file"
description = """
RUE-189: the RIR directive encoding dropped the span's file id (and decoded
len as end), the same loss shape as the RUE-185 pattern-span bug. The
E0457 secondary label "type declared `@copy` here" anchors on the @copy
directive's span in other.rue; before the fix it rendered the honest
"unknown file id" fallback instead of the snippet. The label must show the
@copy line from other.rue and never fall back.
"""
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    0
}
""" },
    { path = "other.rue", source = """
@copy
pub struct P { x: i32 }

drop fn P(self) {
    @dbg(self.x);
}
""" },
]
args = ["main.rue", "other.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0457", "other.rue:4:1", "type declared `@copy` here", "@copy"]
compile_stderr_not_contains = ["unknown file id", "main.rue"]

[[case]]
name = "directive_span_in_first_file"
description = """
RUE-189, swapped order: with the @copy struct in the FIRST file, the file id
is 0 (which coincidentally matched the pre-fix default), but the pre-fix
decode also read the span's len word as its END offset — so any directive not
at file offset 0 got a corrupted range. The `@copy` here sits mid-file after
a leading comment; its label must still render the right line.
"""
files = [
    { path = "lib.rue", source = """
// leading comment so the directive is not at byte offset 0
@copy
pub struct Q { x: i32 }

drop fn Q(self) {
    @dbg(self.x);
}
""" },
    { path = "main.rue", source = """
fn main() -> i32 {
    0
}
""" },
]
args = ["lib.rue", "main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0457", "lib.rue:5:1", "type declared `@copy` here", "@copy"]
compile_stderr_not_contains = ["unknown file id", "main.rue"]
