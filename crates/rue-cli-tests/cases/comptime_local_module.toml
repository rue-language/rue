# RUE-2445: a module bound by a `let` inside a `comptime { }` block is a
# module-path root, as the same binding is in a function body (10.4:1, and
# RUE-2426 for function bodies).
#
# The body's comptime evaluator evaluated the initializer as a value, and a
# module is not one, so any such `let` made the whole block E1200, even when
# the local was unused. Declaration-time evaluation did hold the module value,
# but its type resolver had no lexical module roots, so `let v: m.I` was E0204
# "unknown type 'm'" or, with a file-level module of the same name, resolved
# through that one instead. The binding is now a local module in both: calls,
# struct literals and annotations walk the path from it, and the name is still
# never a compile-time value.

[section]
id = "cli.comptime_local_module"
name = "Let-bound modules in comptime blocks (RUE-2445)"
description = "A module bound by a let inside a comptime block roots calls, literals and type paths as a function body's let-bound module does."

[[case]]
name = "body_comptime_local_module"
description = "Function-body comptime blocks bind a module, a nested module and an inline import, call, build and annotate through it, and shadow it by nearer bindings."
differential_opt = true
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn main() -> i32 {
    let unused: i32 = comptime { let m = lib; 1 };
    let call: i32 = comptime { let m = lib; m.add(6) };
    let s = comptime { let m = lib; m.S { a: 4 } };
    let wide: i64 = comptime { let m = lib; let v: m.I = 5000000000; v };
    let nested = comptime { let m = lib; let n = m.sub; n.S { a: 9 } };
    let inline: i32 = comptime { let m = @import("lib.rue"); m.add(2) };
    let shadow: i32 = comptime { let m = lib; let r = { let m = 5; m }; r + m.add(0) };
    let m = 0;
    let outer: i32 = comptime { let m = lib; m.add(1) };
    let wide_ok = if wide == 5000000000 { 10 } else { 0 };
    unused + call + s.a + nested.a + inline + shadow + outer + m + wide_ok
}
""" },
    { path = "lib.rue", source = """
@copy pub struct S { a: i32 }
pub const I = i64;
pub fn add(comptime x: i32) -> i32 { x + 1 }
pub const sub = @import("sub.rue");
""" },
    { path = "sub.rue", source = """
@copy pub struct S { a: i32 }
""" },
]
stdout = ""
exit_code = 42

[[case]]
name = "const_comptime_local_module"
description = "A constant's comptime block annotates through a let-bound, nested and inline-import module, applies a constructor through it and declares a struct whose field type is read through it."
differential_opt = true
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
const WIDE: i64 = comptime { let m = lib; let v: m.I = 5000000000; v };
const NESTED: i32 = comptime { let m = lib; let n = m.sub; let v: n.I = 9; v };
const APPLIED: i64 = comptime { let m = lib; let v: m.Id(m.I) = 5000000001; v };
const INLINE: i64 = comptime { let m = @import("lib.rue"); let v: m.I = 5000000002; v };
const LIT: i32 = comptime { let m = lib; let s: m.S = m.S { a: 12 }; s.a };
const T = comptime { let m = lib; struct { x: m.I } };
fn main() -> i32 {
    let t = T { x: 5000000003 };
    let a = if WIDE == 5000000000 { 5 } else { 0 };
    let b = if APPLIED == 5000000001 { 5 } else { 0 };
    let c = if INLINE == 5000000002 { 5 } else { 0 };
    let d = if t.x == 5000000003 { 5 } else { 0 };
    NESTED + LIT + a + b + c + d
}
""" },
    { path = "lib.rue", source = """
@copy pub struct S { a: i32 }
pub const I = i64;
pub fn Id(comptime T: type) -> type { T }
pub const sub = @import("sub.rue");
""" },
    { path = "sub.rue", source = """
pub const I = i32;
""" },
]
stdout = ""
exit_code = 41

[[case]]
name = "comptime_local_module_shadows_file_module"
description = "A comptime block's let-bound module shadows the file's same-named module binding in annotations and literals, in a constant and in a function body."
differential_opt = true
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
const m = @import("other.rue");
const N: i32 = comptime { let m = lib; let s: m.S = m.S { a: 4 }; s.a };
fn main() -> i32 {
    let b: i32 = comptime { let m = lib; let s: m.S = m.S { a: 5 }; s.a };
    N + b + m.K
}
""" },
    { path = "lib.rue", source = """
@copy pub struct S { a: i32 }
""" },
    { path = "other.rue", source = """
@copy pub struct S { a: i32, b: i32 }
pub const K: i32 = 30;
""" },
]
stdout = ""
exit_code = 39

[[case]]
name = "body_comptime_local_module_private_member_rejected"
description = "A private struct named through a comptime block's let-bound module is the direct path's E0706 on the literal."
compile_fail = true
error_contains = ["E0706", "struct `Priv` is private", "main.rue:2:50"]
files = [
    { path = "main.rue", source = """
const p = @import("sub/p.rue");
fn main() -> i32 { let c = comptime { let m = p; m.Priv { a: 1 } }; c.a }
""" },
    { path = "sub/p.rue", source = """
@copy struct Priv { a: i32 }
""" },
]

[[case]]
name = "const_comptime_local_module_private_alias_rejected"
description = "A private type alias named through a constant's comptime let-bound module is the direct path's E0706, not E0204."
compile_fail = true
error_contains = ["E0706", "const `I` is private", "main.rue:2:1"]
files = [
    { path = "main.rue", source = """
const p = @import("sub/p.rue");
const X: i64 = comptime { let m = p; let v: m.I = 5; v };
fn main() -> i32 { 0 }
""" },
    { path = "sub/p.rue", source = """
const I = i64;
""" },
]
