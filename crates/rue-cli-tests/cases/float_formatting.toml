[[case]]
name = "x86-64-linux_to_string_matches_dbg_and_widths"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
fn main() -> i32 {
    let a: f64 = 1.5;
    let b: f32 = 0.1;
    let zero: f64 = 0.0;
    let s = @to_string(a);
    let t = @to_string(b);
    let u = @to_string(1e300 * 10.0);
    let v = @to_string(zero / zero);
    let w = @to_string(-0.0);
    let x = @to_string(@float_cast(b));
    @dbg(s);
    @dbg(t);
    @dbg(u);
    @dbg(v);
    @dbg(w);
    @dbg(x);
    if s == "1.5" && t == "0.1" && u == "1e+301" && v == "NaN" && w == "-0.0"
        && x == "0.10000000149011612" { 0 } else { 1 }
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
stdout = """1.5
0.1
1e+301
NaN
-0.0
0.10000000149011612
"""
exit_code = 0

