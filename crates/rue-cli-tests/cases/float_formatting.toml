[[case]]
name = "dbg_rejects_aggregates_still"
files = [{ path = "main.rue", source = """
struct P { x: f64 }
fn main() -> i32 {
    let p = P { x: 1.0 };
    @dbg(p);
    0
}
""" }]
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0702", "expects integer, float, bool, or String, found P"]
