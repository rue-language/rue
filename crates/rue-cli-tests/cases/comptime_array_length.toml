# Comptime values as array lengths `[T; N]` (RUE-16).
#
# `N` in an array type may name a file-level `const` or a `comptime` value
# parameter, not only an integer literal. These exercise the real driver
# end-to-end: two specializations of the same generic in one program must
# produce arrays of different sizes, and runtime/negative/undefined lengths
# must be rejected.

[section]
id = "cli.comptime_array_length"
name = "Comptime array lengths"
description = "Array lengths [T; N] where N is a const or comptime value parameter (RUE-16)."

[[case]]
name = "const_length"
files = [{ path = "main.rue", source = """
const K: i32 = 4;

fn main() -> i32 {
    let a: [i32; K] = [10, 20, 30, 40];
    @dbg(a[0] + a[3]);
    0
}
""" }]
stdout = "50\n"

[[case]]
name = "comptime_param_struct_field"
files = [{ path = "main.rue", source = """
fn Buffer(comptime N: i32) -> type {
    struct { data: [i32; N], len: u32 }
}

fn main() -> i32 {
    let B = Buffer(3);
    let b: B = B { data: [7, 8, 9], len: 3 };
    @dbg(b.data[0] + b.data[2]);
    0
}
""" }]
stdout = "16\n"

[[case]]
name = "two_specializations_different_sizes"
files = [{ path = "main.rue", source = """
fn Buffer(comptime N: i32) -> type {
    struct { data: [i32; N], len: u32 }
}

fn main() -> i32 {
    let B2 = Buffer(2);
    let B4 = Buffer(4);
    let b2: B2 = B2 { data: [1, 2], len: 2 };
    let b4: B4 = B4 { data: [10, 20, 30, 40], len: 4 };
    @dbg(b2.data[1] + b4.data[3]);
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "comptime_param_function_arg"
description = "A computed comptime argument is evaluated at the declared parameter type before sizing an array."
files = [{ path = "main.rue", source = """
const N: i32 = 9;

fn first(comptime N: i32, arr: [i32; N]) -> i32 {
    arr[0]
}

fn main() -> i32 {
    @dbg(first(1 + 2, [42, 1, 2]));
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "substituted_generic_argument_uses_declared_width"
files = [{ path = "main.rue", source = """
fn Id(comptime T: type) -> type { T }

fn use(comptime T: type, comptime n: T) -> i32 {
    @intCast(n)
}

fn main() -> i32 { use(Id(i8), 1 << 8) }
""" }]
exit_code = 1

[[case]]
name = "runtime_length_rejected"
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let n: i32 = 4;
    let a: [i32; n] = [1, 2, 3, 4];
    a[0]
}
""" }]
compile_fail = true
error_contains = ["not a compile-time constant"]

[[case]]
name = "negative_specialized_parameter_length_is_source_error"
description = "A bad call-site substitution preserves E0481 instead of becoming an unresolved-signature internal error."
files = [{ path = "main.rue", source = """
fn first(comptime N: i32, values: [i32; N]) -> i32 {
    values[0]
}

fn main() -> i32 {
    first(-1, [1])
}
""" }]
compile_fail = true
error_contains = ["negative"]

[[case]]
name = "negative_const_length_rejected"
files = [{ path = "main.rue", source = """
const NEG: i32 = -3;

fn main() -> i32 {
    let a: [i32; NEG] = [1];
    a[0]
}
""" }]
compile_fail = true
error_contains = ["negative"]

# --- Local `let` annotation sized by a comptime value parameter (RUE-271) ---
# `let arr: [T; N]` inside `fn f(comptime N: i32)` used to E0481 (length
# resolved context-free) and, once threaded, ICE'd in CFG drop analysis because
# the specialized array type wasn't visible to the CFG builder's type pool. Now
# it binds the concrete length per specialization and runs end to end.

[[case]]
name = "local_annotation_comptime_length"
files = [{ path = "main.rue", source = """
fn f(comptime N: i32, x: i32) -> i32 {
    let y: [i32; N] = [x, x];
    @intCast(y[0]) + @intCast(y[1])
}

fn main() -> i32 {
    f(2, 21)
}
""" }]
exit_code = 42

[[case]]
name = "local_annotation_two_specializations"
files = [{ path = "main.rue", source = """
fn head(comptime N: i32) -> i32 {
    let y: [i32; N] = [7, 7, 7];
    y[0] + N
}

fn main() -> i32 {
    @dbg(head(2));
    @dbg(head(3));
    0
}
""" }]
stdout = "9\n10\n"

[[case]]
name = "local_annotation_comptime_type_and_length"
files = [{ path = "main.rue", source = """
fn f(comptime P: type, comptime N: i32, a: P, b: P) -> P {
    let y: [P; N] = [a, b];
    y[1]
}

fn main() -> i32 {
    f(i32, 2, 40, 42)
}
""" }]
exit_code = 42

[[case]]
name = "local_annotation_drop_element_no_ice"
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn f(comptime N: i32) -> i32 {
    let y: [StrBuf; N] = ["ab", "cde"];
    42
}

fn main() -> i32 {
    f(2)
}
""" }]
exit_code = 42

[[case]]
name = "local_annotation_runtime_length_rejected"
files = [{ path = "main.rue", source = """
fn f(n: i32) -> i32 {
    let y: [i32; n] = [1, 1];
    y[0]
}

fn main() -> i32 {
    f(2)
}
""" }]
compile_fail = true
error_contains = ["not a compile-time constant"]
