driver_exit_code = 1
compile_stdout_contains = [
    # The value is the repo's own std/, absolute; the key order is the
    # alphabetical one every object in this stream uses, so `repro_env`
    # follows `repro`.
    '"repro_env":{"RUE_STD_PATH":"/',
    '/std"}',
    '"kind":"assert"',
]

