compile_stdout_contains = [
    '"event":"test","file":"tests.rue","id":"tests.rue::aaa reaches the broken helper"',
    '"event":"test","file":"tests.rue","id":"tests.rue::bbb reaches nothing broken"',
]
compile_stdout_not_contains = ['"event":"run_started"', '"event":"run_finished"', '"severity"']
compile_stderr_contains = [
    '"code":"E0206"',
    '"message":"type mismatch: expected i32, found bool"',
]

[[case]]
name = "a_filter_narrows_the_run_set_and_not_the_analysis_root_set"
description = """
Ruled, ADR-0083 §2: `--filter` narrows the run set, never the analysis root set,
so the whole closure still compiles and the broken test's diagnostic still
reaches stderr. Only the selected test's verdict is reported, and the run exits
`0` because no selected test is a `compile_error`.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "aaa is broken" {
    let wrong: i32 = true;
}

test "bbb is selected" {
    @assert(1 == 1);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--filter", "bbb is selected", "--format", "json"]
driver_exit_code = 0
compile_stdout_contains = [
    '"plan":{"selected":1,"total":2}',
    '"event":"test_started","id":"tests.rue::bbb is selected"',
    '"verdict":"pass"',
    '"compile_error":0,"crash":0,"event":"run_finished","failed":0,"passed":1',
]
compile_stdout_not_contains = ['"verdict":"compile_error"', "aaa is broken"]
compile_stderr_contains = ["type mismatch: expected i32, found bool"]

[[case]]
name = "a_failure_outside_every_test_closure_is_still_a_stopped_run"
description = """
The boundary of the per-test contract (ADR-0083 §3). A failing import belongs to
no test's closure, so it is still diagnostics on stderr, an empty event stream,
and exit `2` — never a `run_started` for a run that never began.
"""
files = [
    { path = "main.rue", source = """
const missing = @import("nowhere.rue");

fn main() -> i32 {
    0
}

test "never reached" {
    @assert(1 == 1);
}
""" },
]
args = ["test", "main.rue", "--format", "json"]
driver_exit_code = 2
compile_stdout_not_contains = ['"event":"run_started"', '"event":"run_finished"']

[[case]]
name = "residual_a_declaration_that_fails_to_analyze_is_still_a_stopped_run"
description = """
A known residual of the per-test contract, pinned so it is executable rather
than prose. The per-test verdict covers a *body* that fails to analyze; a
*declaration* that fails — a struct field type here, and equally a function
signature or a `const` initializer — is closure-fatal: it stops the reachability
walk itself, so the closure it left behind is incomplete and attributing the
stop to the roots walked so far would name an arbitrary subset. It therefore
stays a whole-run failure with an empty event stream and exit `2`, even though
exactly one test reaches the broken declaration and the other is independent.
Attributing declaration failures is tracked as follow-up work; when it lands
this case becomes a per-test `compile_error` and is rewritten, not deleted.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
struct Broken { v: Nope }

test "aaa uses the broken declaration" {
    let value = Broken { v: 1 };
    @assert(value.v == 1);
}

test "bbb is independent" {
    @assert(1 == 1);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 2
compile_stdout_not_contains = ['"event":"run_started"', '"event":"run_finished"', '"verdict"']
compile_stderr_contains = ["unknown type 'Nope'"]

[[case]]
name = "known_bug_runtime_failure_preserves_evidence"
description = "A marked assertion failure publishes xfail with its original evidence beside an ordinary passing test."
files = [{ path = "main.rue", source = """
@known_bug("RUE-2018")
test "expected" { @assert(false); }
test "ordinary" { }
""" }]
args = ["test", "main.rue", "-j1", "--format", "json"]
driver_exit_code = 0
compile_stdout_contains = ['"verdict":"xfail"', '"kind":"assert"', '"passed":1', '"xfail":1,"xpass":0', '"scratch_dir"', '"repro"']

[[case]]
name = "known_bug_xpass_has_a_full_human_report"
description = "An unexpected pass fails the run and retains output and reproduction information."
