[section]
id = "cli.rue_test"
name = "The rue test subcommand, runner, and event stream"
description = """
RUE-1920 (ADR-0083 Phase 2c): `rue test` end to end through the real binary —
subcommand dispatch, the verdict taxonomy against the real runtime, the exit-code
contract, and the NDJSON event stream.

Two things are pinned here that nothing else can pin. The verdict classification
reads the runtime's own pinned abort messages, so these cases run real programs
down each trap path: a runtime that reworded `assertion failed` or
`error: division by zero` fails a case rather than silently reclassifying a trap
as a bare `exit`. And the event schema is a consumer contract
(docs/process/test-events.md), so the JSON cases assert exact object text —
alphabetical keys included — which a field rename or a dropped field breaks.

Cases that assert the event stream pass `-j1`: parallel workers interleave whole
lines by design, and the schema promises the content of each line rather than an
order across concurrent tests.
"""

# ========================= verdicts =========================

[[case]]
name = "a_passing_test_exits_zero_and_reports_a_count"
description = "ADR-0083 §2: passes are a count, not a wall of green."
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "arithmetic still works" {
    @assert(2 + 2 == 4);
}

test "so does comparison" {
    @assert(1 < 2);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1"]
driver_exit_code = 0
compile_stdout_contains = ["2 passed ("]
compile_stdout_not_contains = ["FAIL", "PASS "]

[[case]]
name = "a_passing_test_captures_eprint_on_stderr_and_keeps_stdout_empty"
description = "The test event's stderr capture records eprint bytes separately from stdout."
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "stderr output" {
    eprint("raw");
    eprintln(" bytes");
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 0
compile_stdout_contains = [
    '"stderr":{"bytes_total":10,"digest":"sha256:a5cf8aefeee5127b4782d1f5e9df62d8ad976df8249c6dca5aaec94a26dd313d","encoding":"utf8"}',
    '"stdout":{"bytes_total":0,"digest":"sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","encoding":"utf8"}',
]

[[case]]
name = "a_failed_assert_is_kind_assert_and_exits_one"
description = """
`@assert` writes its own `failure` frame on the §5.1 channel (RUE-1953), so the
`assert` kind comes from the frame rather than from the pinned `assertion
failed` stderr line, and the location is the intrinsic's own — line 2, column 5
— rather than the declaration header on line 1. This case runs the real runtime
path; the stderr byte count pins that the message itself did not change. Object
keys are alphabetical, so `location` follows `kind`.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "two plus two is five" {
    @assert(2 + 2 == 5);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"assert","location":{"column":5,"file":"tests.rue","line":2}',
    '"message":"assertion failed"}',
    '"stderr":{"bytes_total":17,"data":"assertion failed\n","encoding":"utf8"}',
    '"verdict":"fail"',
    '"crash":0,"event":"run_finished","failed":1,"passed":0',
]

[[case]]
name = "an_assert_message_is_the_frames_message_under_the_same_kind"
description = """
`@assert(cond, "msg")` publishes the programmer's text as the frame's message
under the same `assert` kind, so a consumer never has to know which spelling
failed. Its stderr is unchanged and is `@panic`'s: `panic: <msg>` — which the
sibling case above shows would classify as `trap:panic` on stderr alone. The
frame is what makes it an assertion, and it carries the intrinsic's site.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "checks the port" {
    let port: i32 = 0;
    @assert(port != 0, "port must be assigned");
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"assert","location":{"column":5,"file":"tests.rue","line":3}',
    '"message":"port must be assigned"}',
    '"stderr":{"bytes_total":29,"data":"panic: port must be assigned\n","encoding":"utf8"}',
    '"verdict":"fail"',
]

[[case]]
name = "each_bare_assert_in_one_body_names_its_own_line"
description = """
The gap RUE-1953 closed: several bare assertions in one body used to report the
declaration header, because the kind was classified from stderr and stderr
carries no site. The second assertion is the one that fails, and the record says
so.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "several checks" {
    @assert(1 + 1 == 2);
    @assert(2 + 2 == 5);
    @assert(3 + 3 == 6);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"assert","location":{"column":5,"file":"tests.rue","line":3}',
    '"message":"assertion failed"}',
]

[[case]]
name = "an_owned_assert_message_reports_its_own_length"
description = """
A `StrBuf` message is narrowed to a `{ptr, len}` view before it reaches the
report, the same narrowing `@panic` performs (RUE-1066). The assertion used to
hand the runtime the StrBuf header's first two slots — `buf` and `cap` — so
`@assert(false, @to_string(8))` wrote `panic: 8` followed by the uninitialized
remainder of a 16-byte buffer, while `@panic` on the same value was always
correct. The captured stderr's byte count is what pins that the two now agree.
"""
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

test "formats its message" {
    @assert(1 + 1 == 3, @to_string(8));
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"assert","location":{"column":5,"file":"tests.rue","line":4}',
    '"message":"8"}',
    '"stderr":{"bytes_total":9,"data":"panic: 8\n","encoding":"utf8"}',
]

[[case]]
name = "the_human_rendering_of_an_assert_names_its_message_and_site"
description = """
The default renderer reads the same record the event stream does, so a bare
assertion prints `assert: assertion failed  (file:line:col)` and a message one
prints its own text in the same shape.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "bare" {
    @assert(2 + 2 == 5);
}

test "with a message" {
    @assert(2 + 2 == 5, "arithmetic is broken");
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1"]
driver_exit_code = 1
compile_stdout_contains = [
    "assert: assertion failed  (tests.rue:2:5)",
    "assert: arithmetic is broken  (tests.rue:6:5)",
]

[[case]]
name = "an_ordinary_build_keeps_both_pinned_assert_messages"
description = """
`@assert` lowers the same way outside a test image (spec 4.13:5d): there is no
descriptor 3, the frame write fails with `EBADF` as designed, and the pinned
stderr message plus status 101 is the whole report. Adding the report changed
neither message.
"""
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @assert(1 + 1 == 3);
    0
}
""" }]
exit_code = 101
runtime_error_contains = ["assertion failed"]

[[case]]
name = "an_ordinary_build_prints_an_assert_message_as_a_panic"
description = "The message form's stderr is `@panic`'s, unchanged (spec 4.13:5d)."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @assert(1 + 1 == 3, "why");
    0
}
""" }]
exit_code = 101
runtime_error_contains = ["panic: why"]

[[case]]
name = "an_empty_assert_message_stays_the_message_form"
description = """
`@assert(cond, "")` is the message form with nothing in it, and still writes
`@panic`'s bare `panic: ` line rather than collapsing into `assertion failed`.
The runtime is told which form it is rather than inferring it from the message's
length, and this is the case that would notice if that changed: the substring
here is not one the bare form can produce.
"""
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    @assert(1 + 1 == 3, "");
    0
}
""" }]
exit_code = 101
runtime_error_contains = ["panic: "]

[[case]]
name = "a_panicking_test_is_kind_trap_panic"
description = """
`@panic(msg)` writes the pinned `panic: <msg>` prefix and exits 101, and since
RUE-2019 it reports that on the §5.1 channel with its own site. The kind and the
message are what the stderr classification already produced; `location` is what
the record adds, and it names the `@panic` rather than the `test` header.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "gives up" {
    let attempts: i32 = 3;
    @panic("boom");
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"trap:panic","location":{"column":5,"file":"tests.rue","line":3}',
    '"message":"panic: boom"}',
    '"stderr":{"bytes_total":12,"data":"panic: boom\n","encoding":"utf8"}',
    '"verdict":"fail"',
]

[[case]]
name = "a_message_less_panic_names_its_own_line"
description = """
`@panic()` has its own pinned stderr line — the bare `panic` — and reports the
same `trap:panic` kind under that message with its own site (RUE-2019). Stating
the form rather than inferring it keeps the record and stderr identical.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "gives up without a word" {
    let attempts: i32 = 3;
    let limit: i32 = 1;
    @panic();
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"trap:panic","location":{"column":5,"file":"tests.rue","line":4}',
    '"message":"panic"}',
    '"stderr":{"bytes_total":6,"data":"panic\n","encoding":"utf8"}',
]

[[case]]
name = "a_panic_reached_through_a_call_names_the_panics_own_file"
description = """
The site is the `@panic`'s, not the caller's and not the test declaration's, so
a panic inside a helper in another module names that module's line. Falling back
to the header would have named `tests.rue` and the `test` line for a failure
that happened somewhere else entirely.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "helper.rue", source = """
pub fn open(port: i32) -> i32 {
    if port == 0 {
        @panic("port must be assigned");
    }
    port
}
""" },
    { path = "tests.rue", source = """
const helper = @import("helper.rue");

test "opens the port" {
    @assert(helper.open(0) == 1);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"kind":"trap:panic","location":{"column":9,"file":"helper.rue","line":3}',
    '"message":"panic: port must be assigned"}',
]

[[case]]
name = "a_very_long_panic_message_is_truncated_and_stays_a_trap_panic"
description = """
RUE-2064: the record's `message` is bounded to 4096 bytes and marked with
` …[truncated]`, and the bound covers the whole field, so the pinned `panic: `
prefix counts toward it. `HEAD` and `TAIL` bracket exactly 4081 filler bytes, so
the record ending immediately after `TAIL` is what pins the cut at 4096 and not
merely somewhere.

Unbounded, this message costs the test its verdict rather than its tail: the
channel's retention budget is a quarter of a stream's, the runner kills the
process group when a record exhausts it, and the report that reaches the event
stream is `output_overflow` with no kind and no exit code — which is what this
case asserts against. Stderr keeps the whole 300008-byte message, so the bound
is the channel's alone.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

test "gives up at length" {
    let mut message = std.strbuf.StrBuf.from_str(borrow "HEAD");
    let mut i: u64 = 0;
    while i < 4081 {
        message.push(120);
        i = i + 1;
    }
    message.append_str(borrow "TAIL");
    while i < 300000 {
        message.push(120);
        i = i + 1;
    }
    @panic(message);
}
""" },
]
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"trap:panic","location":{"column":5,"file":"tests.rue","line":15},"message":"panic: HEADxxxxx',
    'xxxxxTAIL …[truncated]"}',
    '"stderr":{"bytes_total":300016,',
    '"verdict":"fail"',
]
compile_stdout_not_contains = ['output_overflow']

[[case]]
name = "a_panic_that_floods_stderr_keeps_its_class_and_notes_the_flood"
description = """
RUE-2083: the channel's message bound and the stream budgets are independent,
so a `@panic` message past 1 MiB writes a complete, bounded frame and still
floods stderr. The frame is the failure — `trap:panic`, exit 101, its own site —
and the flood is published beside it as the record's `runner_note` rather than
as a `kind` that disagrees with the frame it sits next to.
"""
contract = "heavyweight_long"
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

test "floods stderr with its own message" {
    let mut message = std.strbuf.StrBuf.from_str(borrow "HEAD");
    let mut i: u64 = 0;
    while i < 1200000 {
        message.push(120);
        i = i + 1;
    }
    @panic(message);
}
""" },
]
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"trap:panic","location":{"column":5,"file":"tests.rue","line":10},"message":"panic: HEADxxxxx',
    '"runner_note":"stderr exceeded its 1048576-byte retention budget; the process group was killed"}',
    '"verdict":"fail"',
]
compile_stdout_not_contains = ['output_overflow']

[[case]]
name = "a_panic_message_that_is_not_utf8_still_reports_its_class"
description = """
RUE-2064: a Rue string is an arbitrary byte sequence, so a `@panic` message can
carry bytes that are not UTF-8. The writer escapes each one as `\\u00xx` rather
than passing it through, because a channel line the runner cannot decode costs
the test its class: the record was dropped as malformed and the verdict fell
back to a bare `exit` with a runner note. The `c` before the two escaped bytes
is what shows the escaping is per-byte rather than per-line.

Stderr is unchanged and still carries the raw bytes, which is why it is tagged
`base64` here while the record is ordinary text (§2).
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

test "gives up in no encoding at all" {
    let mut message = std.strbuf.StrBuf.new();
    message.push(99);
    message.push(255);
    message.push(254);
    @panic(message);
}
""" },
]
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"failure":{"exit_code":101,"kind":"trap:panic","location":{"column":5,"file":"tests.rue","line":8},"message":"panic: cÿþ"}',
    # The channel line spelled those two bytes `\u00ff\u00fe`; the event
    # stream publishes the scalars they name, so the bytes read back.
    '"stderr":{"bytes_total":11,"data":"cGFuaWM6IGP//go=","encoding":"base64"}',
    '"verdict":"fail"',
]
compile_stdout_not_contains = ["runner_note"]

[[case]]
name = "an_out_of_bounds_index_takes_its_class_from_the_channel"
description = """
`__rue_bounds_check` writes its own `trap:bounds_check` record, so the class is
the runtime's own statement rather than a match against a stderr line. The
fixed-array check the compiler emits below AIR stages no site, so `location` is
still the `test` declaration's header — the gap RUE-2019 documents rather than
closes, because both ways to stage a site there cost the passing path.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "reads past the end" {
    let values: [i32; 3] = [1, 2, 3];
    let mut index: u64 = 0;
    index = index + 5;
    @assert(values[index] == 0);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"kind":"trap:bounds_check","location":{"column":1,"file":"tests.rue","line":1}',
    '"message":"error: index out of bounds"}',
    '"stderr":{"bytes_total":27,"data":"error: index out of bounds\n","encoding":"utf8"}',
]

[[case]]
name = "a_trapping_test_is_classified_by_its_runtime_message"
description = """
ADR-0083 §2's `trap:<class>` names come from the runtime's own pinned messages.
This runs the division trap so `error: division by zero` is matched against the
real `__rue_div_by_zero`, not against a retyped copy.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "divides by zero" {
    let d: i32 = 0;
    let n: i32 = 1;
    @assert(n / d == 0);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = ['"kind":"trap:div_by_zero"', '"message":"error: division by zero"']

[[case]]
name = "a_null_pointer_write_is_a_segfault_not_a_stack_overflow"
description = """
RUE-2163: the runtime reported every SIGSEGV as `stack overflow`, so a `checked`
null write reached this taxonomy as `trap:stack_overflow`. The handler now reads
the faulting address from `siginfo_t` and classifies it, and this runs a real
null write through the real runtime so both the `trap:segfault` kind and the
address its message carries are the runtime's own output rather than a retyped
copy. No lowering stages a site beside a fault, so `location` stays the `test`
declaration's header the way every other trap's does.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "writes through a null pointer" {
    let zero: u64 = 0;
    let p: ptr mut i64 = checked { @int_to_ptr(zero) };
    checked { @ptr_write(p, 7) };
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"kind":"trap:segfault","location":{"column":1,"file":"tests.rue","line":1}',
    '"message":"segmentation fault at 0x0"}',
    '"verdict":"fail"',
]

[[case]]
name = "an_early_exit_before_the_epilogue_is_incomplete"
description = """
ADR-0083 §3: a body calling `std.exit(0)` before its assertions must not report
as a pass — that is false-positive test evidence. The dispatcher's completion
record is what distinguishes them, and its absence is the `incomplete` kind.
"""
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
const std = @import("std");

test "leaves before it checks anything" {
    std.exit(0);
    @assert(1 == 2);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"kind":"incomplete"',
    "\"message\":\"the test exited 0 without the dispatcher's completion record\"",
    '"verdict":"fail"',
]

[[case]]
name = "a_hanging_test_times_out_and_is_its_own_verdict"
description = """
ADR-0083 §3: the per-test budget kills the process group and yields the
`timeout` verdict, which is distinct from a failure so a suite can tell a wrong
answer from a wedged one.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "never finishes" {
    let mut i: i32 = 0;
    while i >= 0 {
        if i > 0 {
            i = i - 1;
        }
    }
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--timeout-ms", "500", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"verdict":"timeout"',
    '"kind":"timeout"',
    'the process group was killed',
    '"crash":0,"event":"run_finished","failed":0,"passed":0',
    '"timeout":1',
]

[[case]]
name = "a_flooding_test_is_killed_with_kind_output_overflow"
description = """
ADR-0083 §2: capture is bounded as bytes arrive, and exceeding a stream's budget
kills the process group and yields `output_overflow` with the retained prefix
attached. This writes past the 1 MiB default in 4 KiB lines.
"""
contract = "heavyweight_long"
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "floods its own stdout" {
    let mut i: u64 = 0;
    while i < 4096 {
        @dbg("");
        i = i + 1;
    }
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = ['"kind":"output_overflow"', '"verdict":"fail"']
# RUE-1958 bounds the *human* rendering only. The event stream carries the
# retained window whole, so its `data` is never elided.
compile_stdout_not_contains = ["omitted here"]

[[case]]
name = "a_flood_is_elided_in_the_human_rendering_so_the_repro_survives"
description = """
RUE-1958: the retained window is a megabyte, which is thirteen thousand lines
in a terminal. The human renderer prints a head and a tail with one line saying
what it skipped, so the `scratch:` and `repro:` lines below the capture are
still on screen. `--format json` remains the lossless copy.
"""
contract = "heavyweight_long"
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "floods its own stdout" {
    let mut i: u64 = 0;
    while i < 4096 {
        @dbg("");
        i = i + 1;
    }
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "human"]
driver_exit_code = 1
compile_stdout_contains = [
    "FAIL tests.rue::floods its own stdout",
    "output_overflow",
    "omitted here; --format json carries the whole capture",
    "further bytes were not retained",
    "repro: /",
    "/rue test /",
    "/main.rue --filter",
    "0 passed, 1 failed",
]

