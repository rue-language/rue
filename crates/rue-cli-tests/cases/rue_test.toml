[[case]]
name = "a_flooded_failure_channel_is_killed_with_kind_output_overflow"
description = """
RUE-2025: the channel's 256 KiB budget is enforced the way a stream's is. It was
checked nowhere before, so a test that wrote past it had its last frame cut in
half and reported as a bare `exit` with a runner note about an unreadable
channel — the symptom, not the cause. The message names the capture that
overflowed and the budget it exceeded, which for the channel is a quarter of a
stream's.

Descriptor 3 is written raw, because the built-in producers write one frame per
failure and no Rue-level program reaches a quarter of a megabyte through them.
Linux only: the write syscall's number is per-platform, and what this pins is
the runner's supervision rather than any portable language behavior.
"""
only_on = ["x86-64-linux", "aarch64-linux"]
files = [
    { path = "main.rue", source = """
fn main() -> i32 {
    0
}

test "floods its own failure channel" {
    let write_nr: u64 = match @target_arch() {
        Arch.X86_64 => 1,
        Arch.Aarch64 => 64,
    };
    let buf: ptr mut u8 = checked { @alloc(4096, 1) };
    let mut i: u64 = 0;
    while i < 4096 {
        checked { @ptr_write(@ptr_offset(buf, i), 120); };
        i = i + 1;
    }
    let addr: u64 = checked { @ptr_to_int(buf) };
    let mut writes: u64 = 0;
    while writes < 160 {
        checked { @syscall(write_nr, 3, addr, 4096); };
        writes = writes + 1;
    }
    checked { @free(buf, 4096, 1); };
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"kind":"output_overflow"',
    '"message":"the failure channel exceeded its 262144-byte retention budget; the process group was killed"',
    '"verdict":"fail"',
    '"crash":0,"event":"run_finished","failed":1,"passed":0',
]

# ==================== per-test compile_error verdicts ====================
#
# RUE-2017 (ADR-0083 §3): a test whose closure fails to analyze is a verdict,
# not a run abort. These cases pin the four things the contract turns on — the
# other tests still run, the verdict and its `diagnostics` field, the exit
# status, and the attribution of a broken helper to every dependent test — plus
# the two boundaries: `--list` still lists a test whose body does not analyze,
# and a failure outside every test closure is still exit `2` with no events.

[[case]]
name = "a_broken_test_is_a_verdict_and_the_others_still_run"
description = """
ADR-0083 §3: one test's semantic error excludes that test from the image and
runs every other. The run exits `1` — a `compile_error` is a failed test — and
the summary names the class separately from `failed`, because "did not compile"
and "ran and failed" send a reader to different places.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "aaa is broken" {
    let wrong: i32 = true;
    @assert(wrong == 1);
}

test "bbb still runs" {
    @assert(2 + 2 == 4);
}

test "ccc still runs too" {
    @assert(1 < 2);
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1"]
driver_exit_code = 1
compile_stdout_contains = [
    "COMPILE ERROR tests.rue::aaa is broken",
    "compile_error: type mismatch: expected i32, found bool  (tests.rue:2:5)",
    "the diagnostic is on stderr; the test was excluded from the image",
    "2 passed, 1 compile error (",
]
compile_stdout_not_contains = ["FAIL ", "bbb still runs", "ccc still runs too"]
compile_stderr_contains = ["type mismatch: expected i32, found bool", "tests.rue:2:5"]

[[case]]
name = "a_compile_error_event_carries_the_verdict_and_its_diagnostics"
description = """
The event schema (test-events.md). `duration_ms` is `0` and both captures are
empty because no process existed; `scratch_dir` is absent for the same reason.
The failure record's `diagnostics` array is the same object `--error-format
json` writes on stderr — a `1.0`-additive field — and `run_finished` gains the
`compile_error` count alphabetically ahead of `crash`. Object keys are
alphabetical, so a field rename or a dropped field fails this case.
"""
files = [
    { path = "main.rue", source = """
const tests = @import("tests.rue");

fn main() -> i32 {
    0
}
""" },
    { path = "tests.rue", source = """
test "does not analyze" {
    let wrong: i32 = true;
}
""" },
]
args = ["test", "main.rue", "--seed", "1", "-j1", "--format", "json"]
driver_exit_code = 1
compile_stdout_contains = [
    '"duration_ms":0,"event":"test_finished","failure":{"diagnostics":[{"code":"E0206","helps":[],"message":"type mismatch: expected i32, found bool","notes":[],"severity":"error","spans":[{"column":5,',
    '"file":"tests.rue","label":null,"line":2,"primary":true,',
    '"kind":"compile_error","location":{"column":5,"file":"tests.rue","line":2}',
    '"message":"type mismatch: expected i32, found bool","payload":"E0206: type mismatch: expected i32, found bool"}',
    '"stderr":{"bytes_total":0,"data":"","encoding":"utf8"}',
    '"verdict":"compile_error"',
    '"compile_error":1,"crash":0,"event":"run_finished","failed":0,"passed":0',
]
compile_stdout_not_contains = ['"scratch_dir"']
compile_stderr_contains = ["type mismatch: expected i32, found bool"]

