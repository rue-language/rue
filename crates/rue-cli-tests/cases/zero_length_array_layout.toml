# Zero-length arrays under the two layout models (RUE-2256, RUE-2243).
#
# A frame-resident aggregate is stored slot-shaped (one eight-byte slot per
# leaf) while `@ptr_read`/`@ptr_write`/`@ptr_offset` address its packed compact
# image. Where the two models put bytes at different offsets a raw pointer would
# mix representations, so codegen refuses it (RUE-1595's E0908 at the coercion
# boundary, E9001 at the backend gate).
#
# A zero-length array has no byte in either model, so there is nothing to
# disagree about — but the shared layout predicate classified `[T; N]` purely by
# recursing into `T`, never reading `N`. `[i32; 0]` therefore inherited `i32`'s
# narrowness and two very different failures followed:
#
# - RUE-2256: `@raw`/`@raw_mut`/`@field_ptr` into a zero-length narrow-element
#   frame array was refused with the internal-error-class E9001, although the
#   pointer addresses no byte at all. `[i64; 0]` compiled, `[i32; 0]` did not.
# - RUE-2243: because the array looked non-slot-identical, a pointer read of it
#   was planned as a compact-image marshal — and the image of a zero-length
#   array has no entries, so `@ptr_read`'s primary-slot read indexed an empty
#   slot vector and panicked in CFG lowering on both backends. `ArrayBuf([i32;
#   0]).push` reaches exactly that shape.
#
# Both halves are fixed independently and both are pinned here: the predicate
# now reads the length, and the backends divert a zero-slot pointer read the way
# they already diverted a zero-sized pointer write (RUE-2086). The refusal for a
# NON-empty narrow frame array is intentional and must keep firing, so the last
# section pins that too.

[section]
id = "cli.zero_length_array_layout"
name = "Zero-length array layout"
description = "A zero-length array is zero-sized in both layout models: raw pointers into it are accepted and read back, and a zero-slot pointer read moves no bytes (RUE-2256, RUE-2243)."

# --- RUE-2256: raw pointers into a zero-length narrow-element array ----------

[[case]]
name = "zero_length_i32_array_raw_round_trip"
description = "RUE-2256 repro: `@raw` of a `[i32; 0]` local and `@ptr_read` back. `[i64; 0]` already compiled; the narrow element type is what decided the refusal."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let src: [i32; 0] = [];
    let whole: [i32; 0] = checked { let ps: ptr const [i32; 0] = @raw(src); @ptr_read(ps) };
    let _kept: [i32; 0] = whole;
    @dbg(@size_of([i32; 0]));
    0
}
""" }]
stdout = "0\n"
exit_code = 0
differential_opt = true

[[case]]
name = "zero_length_narrow_array_raw_round_trip_every_element_type"
description = "Every narrow element the refusal used to name — u8, bool, i16, f32 — plus a struct element holding one, all round-trip through a raw pointer at zero length."
files = [{ path = "main.rue", source = """
@copy struct Narrow { a: u8, b: f32 }
fn main() -> i32 {
    let bytes: [u8; 0] = [];
    let flags: [bool; 0] = [];
    let shorts: [i16; 0] = [];
    let floats: [f32; 0] = [];
    let narrows: [Narrow; 0] = [];
    let _b: [u8; 0] = checked { let p: ptr const [u8; 0] = @raw(bytes); @ptr_read(p) };
    let _f: [bool; 0] = checked { let p: ptr const [bool; 0] = @raw(flags); @ptr_read(p) };
    let _s: [i16; 0] = checked { let p: ptr const [i16; 0] = @raw(shorts); @ptr_read(p) };
    let _l: [f32; 0] = checked { let p: ptr const [f32; 0] = @raw(floats); @ptr_read(p) };
    let _n: [Narrow; 0] = checked { let p: ptr const [Narrow; 0] = @raw(narrows); @ptr_read(p) };
    @dbg(@size_of([Narrow; 0]));
    0
}
""" }]
stdout = "0\n"
exit_code = 0
differential_opt = true

[[case]]
name = "zero_length_array_raw_mut_write_moves_no_bytes"
description = "`@raw_mut` of a `[i32; 0]` local and a whole-value `@ptr_write` through it: the write moves no bytes, so a sized neighbour keeps its value."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut dst: [i32; 0] = [];
    let guard: i64 = 42;
    let src: [i32; 0] = [];
    let pm: ptr mut [i32; 0] = checked { @raw_mut(dst) };
    checked { @ptr_write(pm, src) };
    @dbg(guard);
    @intCast(guard)
}
""" }]
stdout = "42\n"
exit_code = 42
differential_opt = true

[[case]]
name = "field_ptr_into_zero_length_array_field"
description = "`@field_ptr` of a struct's only field, a `[u8; 0]`, and `@raw` of the whole zero-sized struct: both pointers form, marshal nothing, and disturb nothing."
files = [{ path = "main.rue", source = """
@copy struct E { xs: [u8; 0] }
fn main() -> i32 {
    let mut e = E { xs: [] };
    let guard: i64 = 7;
    let empty: [u8; 0] = [];
    let p: ptr mut [u8; 0] = checked { @field_ptr(e.xs) };
    checked { @ptr_write(p, empty) };
    let pe: ptr const E = checked { @raw(e) };
    let back: E = checked { @ptr_read(pe) };
    let _kept: E = back;
    @dbg(@size_of(E));
    @dbg(guard);
    0
}
""" }]
stdout = "0\n7\n"
exit_code = 0
differential_opt = true

[[case]]
name = "array_of_zero_length_arrays_raw_round_trip"
description = "`[[i32; 0]; 3]` is zero-sized through the element level rather than its own length: the recursion has to reach the inner zero length."
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let src: [[i32; 0]; 3] = [[], [], []];
    let whole: [[i32; 0]; 3] = checked { let ps: ptr const [[i32; 0]; 3] = @raw(src); @ptr_read(ps) };
    let _kept: [[i32; 0]; 3] = whole;
    @dbg(@size_of([[i32; 0]; 3]));
    0
}
""" }]
stdout = "0\n"
exit_code = 0
differential_opt = true

# --- RUE-2243: a zero-slot pointer read in CFG lowering ---------------------

[[case]]
name = "arraybuf_zero_length_array_element"
description = "RUE-2243 repro: `ArrayBuf([i32; 0])` push/get/pop/len/clear. `push` stores through a raw element pointer whose pointee has no slots; the primary-slot read indexed an empty vector and panicked in CFG lowering."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
fn main() -> i32 {
    let A = std.arraybuf.ArrayBuf([i32; 0]);
    let O = std.option.Option([i32; 0]);
    let mut xs = A.new();
    xs.push([]);
    xs.push([]);
    @dbg(xs.len());
    let mut score = 0;
    match xs.get(1) { O.Some(e) => { score = score + 1; }, O.None => {} }
    match xs.pop() { O.Some(e) => { score = score + 10; }, O.None => {} }
    @dbg(xs.len());
    if xs.is_empty() { score = score + 100; }
    xs.clear();
    if xs.is_empty() { score = score + 1000; }
    @dbg(score);
    0
}
""" }]
stdout = "2\n1\n1011\n"
exit_code = 0
differential_opt = true

[[case]]
name = "arraybuf_struct_wrapping_zero_length_array_element"
description = "The same shape one level in: an element struct whose only field is a `[u8; 0]`. Three pushes, a pop and a get all marshal nothing through the element pointer."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
@copy struct E { xs: [u8; 0] }
fn main() -> i32 {
    let A = std.arraybuf.ArrayBuf(E);
    let O = std.option.Option(E);
    let mut es = A.new();
    es.push(E { xs: [] });
    es.push(E { xs: [] });
    es.push(E { xs: [] });
    @dbg(es.len());
    let mut score = 0;
    match es.pop() { O.Some(e) => { score = score + 1; }, O.None => {} }
    match es.get(0) { O.Some(e) => { score = score + 10; }, O.None => {} }
    @dbg(es.len());
    @dbg(score);
    0
}
""" }]
stdout = "3\n2\n11\n"
exit_code = 0
differential_opt = true

[[case]]
name = "aarch64_zero_length_array_layout_lowers"
description = "AArch64 carries the sibling of both fixes: the same raw-pointer round trips and the `ArrayBuf([i32; 0])` push emit assembly. Before RUE-2256/RUE-2243 the first was refused and the second panicked in the AArch64 CFG lowering."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
@copy struct E { xs: [u8; 0] }
fn main() -> i32 {
    let src: [i32; 0] = [];
    let _whole: [i32; 0] = checked { @ptr_read(@raw(src)) };
    let mut e = E { xs: [] };
    let p: ptr mut [u8; 0] = checked { @field_ptr(e.xs) };
    let empty: [u8; 0] = [];
    checked { @ptr_write(p, empty) };
    let A = std.arraybuf.ArrayBuf([i32; 0]);
    let mut xs = A.new();
    xs.push([]);
    @intCast(xs.len())
}
""" }]
args = ["--emit", "asm", "--target", "aarch64-linux", "main.rue"]
compile_only = true
compile_stdout_contains = ["=== Assembly (aarch64-linux) ===", "main:"]

# --- The refusal that must survive: a NON-empty narrow frame array ----------
# RUE-1595 is the intentional limit, and E9001 is the backend gate behind it.
# Reading the array's length must not weaken the answer for any length above
# zero.

[[case]]
name = "non_empty_narrow_frame_array_raw_still_refused"
description = "RUE-1595 pin: `@raw` of a `[i32; 4]` frame array is still refused with E9001. Only the zero-length case changed."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let src: [i32; 4] = [1, 2, 3, 4];
    let whole: [i32; 4] = checked { let ps: ptr const [i32; 4] = @raw(src); @ptr_read(ps) };
    whole[0]
}
""" }]
compile_fail = true
error_contains = ["E9001", "raw pointer", "frame-resident aggregate"]

[[case]]
name = "non_empty_narrow_element_slice_coercion_still_refused"
description = "RUE-1595's source-level half: a `[i32; 4]` still cannot coerce to `borrow [i32]`, while the zero-length array already could and still can."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn total(borrow xs: [i32]) -> i32 { @intCast(xs.len()) }
fn main() -> i32 {
    let full: [i32; 4] = [1, 2, 3, 4];
    total(borrow full)
}
""" }]
compile_fail = true
error_contains = ["E0908"]

[[case]]
name = "zero_length_narrow_array_slice_coercion_still_accepted"
description = "The empty-array exemption the coercion already carried is unchanged; the shared predicate now agrees with it instead of being overridden by a local length test."
files = [{ path = "main.rue", source = """
fn count(borrow xs: [i32]) -> i32 { @intCast(xs.len()) }
fn main() -> i32 {
    let empty: [i32; 0] = [];
    @dbg(count(borrow empty));
    0
}
""" }]
stdout = "0\n"
exit_code = 0
differential_opt = true
