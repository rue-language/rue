# Comptime generic function calls: argument type checking, specialization
# symbol mangling, and type-parameter forwarding (RUE-109 epic).
#
# Generic calls used to bypass argument type checking entirely (RUE-73,
# RUE-101): an i64 silently truncated into T=i32, a struct A was accepted
# where T=B and the callee read B-shaped fields out of an A-sized allocation
# (RUE-99, an out-of-bounds read). All struct/enum type arguments also mangled
# to the same specialized symbol (RUE-100), and forwarding a comptime type
# parameter to a nested generic call ICEd in the CFG builder (RUE-102).

[section]
id = "cli.generics"
name = "Comptime generic calls"
description = "Argument type checking, symbol mangling, and forwarding for comptime generics."

# =============================================================================
# Argument type checking (RUE-73, RUE-101)
# =============================================================================

[[case]]
name = "generic_arg_i64_into_i32_rejected"
description = "Passing an i64 where T = i32 is a type error, not a silent truncation (RUE-73)."
files = [{ path = "main.rue", source = """
fn identity(comptime T: type, x: T) -> T {
    x
}
fn main() -> i32 {
    let big: i64 = 4294967296;
    let t = identity(i32, big);
    if t == 0 { 1 } else { 2 }
}
""" }]
compile_fail = true
error_contains = ["type mismatch"]

[[case]]
name = "generic_arg_bool_into_i32_rejected"
description = "Passing a bool where T = i32 is a type error (RUE-101)."
files = [{ path = "main.rue", source = """
fn identity(comptime T: type, x: T) -> T {
    x
}
fn main() -> i32 {
    identity(i32, true)
}
""" }]
compile_fail = true
error_contains = ["type mismatch"]

[[case]]
name = "generic_arg_negative_into_u32_rejected"
description = "A negative literal where T = u32 is rejected instead of wrapping (RUE-101)."
files = [{ path = "main.rue", source = """
fn identity(comptime T: type, x: T) -> T {
    x
}
fn main() -> i32 {
    let r = identity(u32, -1);
    0
}
""" }]
compile_fail = true
error_contains = ["cannot apply unary operator"]

[[case]]
name = "generic_arg_literal_ranged_against_t"
description = "Integer literal arguments are range-checked against T, not against i32 (RUE-101)."
files = [{ path = "main.rue", source = """
fn identity(comptime T: type, x: T) -> T {
    x
}
fn main() -> i32 {
    let big = identity(i64, 4294967296);
    if big == 4294967296 { 42 } else { 1 }
}
""" }]
exit_code = 42

# =============================================================================
# Aggregate argument type checking (RUE-99: was an out-of-bounds read)
# =============================================================================

[[case]]
name = "generic_arg_wrong_struct_rejected"
description = "Passing struct A where T = B is a type error; previously the callee read B-sized fields from an A-sized allocation (RUE-99)."
files = [{ path = "main.rue", source = """
struct A { x: i32 }
struct B { x: i32, y: i32, z: i32 }

fn get_z(comptime T: type, v: T) -> i32 {
    v.z
}

fn main() -> i32 {
    let a = A { x: 7 };
    get_z(B, a)
}
""" }]
compile_fail = true
error_contains = ["type mismatch"]

# =============================================================================
# Specialization symbol mangling (RUE-100)
# =============================================================================

[[case]]
name = "generic_two_struct_instantiations_link"
description = "Two struct instantiations of one generic produce distinct symbols; this used to fail to link with 'duplicate symbol' (RUE-100)."
files = [{ path = "main.rue", source = """
struct A { x: i32 }
struct B { y: i32 }

fn one(comptime T: type, v: T) -> i32 {
    1
}

fn main() -> i32 {
    let a = A { x: 7 };
    let b = B { y: 9 };
    one(A, a) + one(B, b)
}
""" }]
exit_code = 2

[[case]]
name = "generic_two_struct_instantiations_distinct_bodies"
description = "Each struct instantiation gets its own specialized body reading its own layout (RUE-100: they silently shared one body when the link happened to succeed)."
files = [{ path = "main.rue", source = """
struct Pair { x: i32, y: i32 }
struct Triple { x: i32, y: i32, z: i32 }

fn pick(comptime T: type, v: T, second: bool) -> i32 {
    if second { v.y } else { v.x }
}

fn main() -> i32 {
    let p = Pair { x: 2, y: 4 };
    let t = Triple { x: 10, y: 30, z: 50 };
    pick(Pair, p, false) + pick(Triple, t, true)
}
""" }]
exit_code = 32

# =============================================================================
# Specialized names live in a namespace disjoint from user names (RUE-41)
# =============================================================================
#
# The specialized symbol for `identity<i32>` used to be `identity__i32` — a
# string a user can legally spell as a plain function name — so a program that
# defined BOTH failed to link with "duplicate symbol: identity__i32" even
# though it is valid Rue. The mangling now joins segments with `.`, illegal in
# a Rue identifier, so specialized names can never collide with user names.

[[case]]
name = "specialization_name_does_not_collide_with_user_fn"
description = "identity<i32> plus a user fn literally named identity__i32 links and runs (RUE-41: used to be 'duplicate symbol: identity__i32')."
files = [{ path = "main.rue", source = """
fn identity(comptime T: type, x: T) -> T { x }
fn identity__i32(x: i32) -> i32 { x + 100 }
fn main() -> i32 { identity(i32, 7) + identity__i32(0) }
""" }]
exit_code = 107

[[case]]
name = "specialization_i32_and_i64_distinct_symbols"
description = "identity<i32> and identity<i64> get distinct specialized symbols and distinct bodies (must not regress to RUE-100's single-symbol collapse)."
files = [{ path = "main.rue", source = """
fn identity(comptime T: type, x: T) -> T { x }
fn widen(comptime T: type, x: i64) -> i64 { identity(T, x) }
fn main() -> i32 {
    @dbg(identity(i32, 5));
    @dbg(widen(i64, 40));
    0
}
""" }]
stdout = "5\n40\n"

# =============================================================================
# Type parameter forwarding to nested generic calls (RUE-102)
# =============================================================================

[[case]]
name = "generic_forwarding_t_return"
description = "Forwarding T to a nested generic call whose return type is T; used to fail with a spurious type mismatch (RUE-102)."
files = [{ path = "main.rue", source = """
fn inner(comptime T: type, x: T) -> T { x }
fn outer(comptime T: type, x: T) -> T {
    inner(T, x)
}
fn main() -> i32 {
    outer(i32, 42)
}
""" }]
exit_code = 42

[[case]]
name = "generic_forwarding_concrete_return"
description = "Forwarding T to a nested generic call with a concrete return type; used to ICE in the CFG builder because specialization did not iterate (RUE-102)."
files = [{ path = "main.rue", source = """
fn inner(comptime T: type, x: T) -> i32 { 1 }
fn outer(comptime T: type, x: T) -> i32 {
    inner(T, x)
}
fn main() -> i32 {
    if outer(i32, 41) == 1 { 42 } else { 0 }
}
""" }]
exit_code = 42

[[case]]
name = "generic_forwarding_multiple_types"
description = "Forwarding T through a relay for two different instantiations, with values exercising the full 64-bit width (RUE-102)."
files = [{ path = "main.rue", source = """
fn pick(comptime T: type, a: T, b: T, first: bool) -> T {
    if first { a } else { b }
}
fn relay(comptime T: type, a: T, b: T) -> T {
    pick(T, a, b, false)
}
fn main() -> i32 {
    let x = relay(i32, 1, 40);
    let y: i64 = relay(i64, 2, 9000000000);
    if y == 9000000000 { x + 2 } else { 0 }
}
""" }]
exit_code = 42

# =============================================================================
# A user-declared struct/enum NAME as the comptime type argument (RUE-1680)
# =============================================================================
#
# `identity(Foo, Foo { x: 42 })` was rejected with a bogus
# "type mismatch: expected Foo, found type". A struct/enum name in argument
# position parses as a variable reference, and inference resolved such a
# reference only against the enclosing type substitution and the BUILTIN
# struct/enum tables — never against the user-declared ones. `T` therefore
# stayed out of the call's substitution map, a `-> T` return type could not be
# substituted, and the call's type remained the literal `type` placeholder,
# which mismatched the binding's annotation.
#
# The bug is invisible whenever the return type does not mention `T` — the
# struct cases above (`one(A, a) -> i32`) passed throughout — so these cases
# all bind the result to the nominal type.

[[case]]
name = "generic_struct_name_type_argument"
description = "RUE-1680 repro: a user struct passed by name as `comptime T: type` with a `-> T` return."
files = [{ path = "main.rue", source = """
struct Foo { x: i32 }
fn identity(comptime T: type, v: T) -> T { v }
fn main() -> i32 {
    let f: Foo = identity(Foo, Foo { x: 42 });
    f.x
}
""" }]
exit_code = 42

[[case]]
name = "generic_enum_name_type_argument"
description = "A user enum name resolves on the same route as a struct name; the payload survives the round trip."
files = [{ path = "main.rue", source = """
enum Slot { Empty, Full(i32) }
fn identity(comptime T: type, v: T) -> T { v }
fn main() -> i32 {
    let s: Slot = identity(Slot, Slot.Full(42));
    match s {
        Slot.Empty => 0,
        Slot.Full(v) => v,
    }
}
""" }]
exit_code = 42

[[case]]
name = "generic_struct_name_type_argument_composite_return"
description = "The composite `-> [T; 2]` return substitutes a user struct passed by name (the RUE-172 shape, which also only worked for primitives)."
files = [{ path = "main.rue", source = """
struct Foo { x: i32 }
fn pair(comptime T: type, a: T, b: T) -> [T; 2] { [a, b] }
fn main() -> i32 {
    let p: [Foo; 2] = pair(Foo, Foo { x: 40 }, Foo { x: 2 });
    p[0].x + p[1].x
}
""" }]
exit_code = 42

[[case]]
name = "generic_struct_name_type_argument_forwarded"
description = "A user-struct type argument forwards through a nested generic call — the RUE-102 relay shape, now reachable with a nominal argument."
files = [{ path = "main.rue", source = """
struct Foo { x: i32 }
fn inner(comptime T: type, v: T) -> T { v }
fn outer(comptime T: type, v: T) -> T { inner(T, v) }
fn main() -> i32 {
    let f: Foo = outer(Foo, Foo { x: 42 });
    f.x
}
""" }]
exit_code = 42

[[case]]
name = "generic_struct_name_type_argument_two_instantiations"
description = "Two nominal instantiations of one `-> T` generic keep their own layouts; a shared or mis-resolved substitution would read the wrong field."
files = [{ path = "main.rue", source = """
struct Pair { x: i32, y: i32 }
struct Triple { x: i32, y: i32, z: i32 }
fn echo(comptime T: type, v: T) -> T { v }
fn main() -> i32 {
    let p: Pair = echo(Pair, Pair { x: 2, y: 4 });
    let t: Triple = echo(Triple, Triple { x: 10, y: 30, z: 6 });
    p.y + t.z + t.x * 3
}
""" }]
exit_code = 40

[[case]]
name = "generic_type_argument_alias_and_primitive_controls"
description = "Controls, unchanged by the fix: a let-bound alias (RUE-281) and a primitive literal type name resolve as before, and a local shadowing the type name is still not a type value."
files = [{ path = "main.rue", source = """
struct Foo { x: i32 }
fn identity(comptime T: type, v: T) -> T { v }
fn main() -> i32 {
    let P = Foo;
    let a: Foo = identity(P, Foo { x: 20 });
    let b: i32 = identity(i32, 22);
    a.x + b
}
""" }]
exit_code = 42

[[case]]
name = "generic_type_argument_runtime_local_shadowing_type_name_rejected"
description = "Control: a runtime local that shadows a struct name is a value, not a type — the nominal lookup must not fire through a shadowing binding, so the call is still rejected. (The wording is the unsubstituted-`T` mismatch rather than the comptime-argument diagnostic; that is pre-existing and unchanged here.)"
files = [{ path = "main.rue", source = """
struct Foo { x: i32 }
fn identity(comptime T: type, v: T) -> T { v }
fn main() -> i32 {
    let Foo = 7;
    let a: i32 = identity(Foo, 3);
    a
}
""" }]
compile_fail = true
error_contains = ["E0206"]
compile_stderr_not_contains = ["E9000", "internal compiler error"]
