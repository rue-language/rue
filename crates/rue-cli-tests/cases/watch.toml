[section]
id = "cli.watch"
name = "Watch loop integration"
description = "Exercise real driver watch orchestration through the test protocol seam."

[[case]]
name = "edit_rebuilds_and_publishes_new_output"
files = [{ path = "main.rue", source = "fn main() -> i32 { 1 }\n" }]

[case.watch]
kind = "edit"
expected_exit_codes = [1, 2]

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 2 }\n"

[[case]]
name = "change_during_compile_publishes_only_newest_revision"
files = [{ path = "main.rue", source = "fn main() -> i32 { 1 }\n" }]

[case.watch]
kind = "cancel"
compile_delay_ms = 250
expected_exit_codes = [1, 3]

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 2 }\n"

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 3 }\n"

[[case]]
name = "deleted_import_retries_reobserve_before_rebuilding"
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]

[case.watch]
kind = "delete"
error_format = "json"
expected_exit_codes = [1, 2]

[[case.watch.edits]]
path = "helper.rue"
delete = true

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 2 }\n"

[[case]]
name = "retargeted_import_symlink_rebuilds_and_publishes_new_output"
only_on = [
    "x86-64-linux",
    "aarch64-linux",
    "x86-64-macos",
    "aarch64-macos",
]
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "target_a.rue", source = "pub fn answer() -> i32 { 1 }\n" },
    { path = "target_b.rue", source = "pub fn answer() -> i32 { 2 }\n" },
]
symlinks = [{ link = "helper.rue", target = "target_a.rue" }]

[case.watch]
kind = "symlink_retarget"
expected_exit_codes = [1, 2]

[[case.watch.edits]]
path = "helper.rue"
symlink_target = "target_b.rue"

# RUE-1783. The watcher can learn that its inputs changed three ways: the
# in-flight change monitor, the publication guard, or the trailing check once
# the monitor has stopped. Only the monitor announced itself, and the
# `change-detected` milestone was emitted solely from `wait_for_change` -- which
# the loop reaches only when the cycle ends with nothing pending. So an edit
# landing after the monitor stopped but before the trailing check was acted on
# correctly (the watcher rebuilt and republished) and never announced, hanging
# any consumer waiting on the milestone.
#
# The window is normally microseconds, which is why this only ever failed on
# loaded CI runners. `boundary_delay_ms` widens it on purpose so the edit lands
# inside it every run: without the fix this case times out after 30s with
# `timed out waiting for watch event "change-detected"`, exactly as CI reported.
#
# A bounded in-flight delay makes the second edit land after compile-started
# but before publication, independently of host load. The first edit still
# exercises the widened post-monitor boundary above.
[[case]]
name = "change_after_monitor_stops_is_still_announced"
files = [{ path = "main.rue", source = "fn main() -> i32 { 1 }\n" }]

[case.watch]
kind = "cancel"
boundary_delay_ms = 400
compile_delay_ms = 100
expected_exit_codes = [1, 3]

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 2 }\n"

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 3 }\n"

# RUE-1830. A watch cycle used to start its change monitor only after
# re-observation and import-graph closure had completed, so an edit landing
# while discovery was still re-closing could not supersede the stale attempt:
# it was noticed only once compilation proper began, or on the next cycle.
# `reobserve_delay_ms` widens the re-closure window on purpose so the second
# edit deterministically lands inside it. The cycle may retain a coherent close
# only after its atomic commit boundary, but it must re-observe newest bytes
# before compiling; only the newest revision's output ever publishes.
[[case]]
name = "change_during_reobserve_supersedes_the_stale_attempt"
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]

[case.watch]
kind = "supersede_reobserve"
reobserve_delay_ms = 400
expected_exit_codes = [1, 3]

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 2 }\n"

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 3 }\n"

# RUE-1863. Re-observation was made supersedable by RUE-1830, but the phase
# right after it -- acquiring the trusted toolchain modules a reached body
# demands -- still ran to completion against bytes an edit had already
# invalidated. `acquire_delay_ms` widens that window on purpose so the second
# edit deterministically lands while the demand is being read and the import
# graph re-closed. `@parse_i64` is what makes the program park on a trusted
# std demand at all, so the case needs the real std to reach acquisition.
#
# The superseded acquisition is a transaction that commits nothing: the run
# must reacquire cleanly afterwards (`acquire-ok` strictly after
# `acquire-superseded`) and publish only the newest revision's output.
[[case]]
name = "change_during_toolchain_acquisition_supersedes_the_stale_attempt"
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { let _ = @parse_i64(\"1\"); helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]
env = { RUE_STD_PATH = "${REAL_STD}" }

[case.watch]
kind = "supersede_acquire"
acquire_delay_ms = 400
expected_exit_codes = [1, 3]

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 2 }\n"

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 3 }\n"

# RUE-1969. Watch used to assemble its own compile orchestration and never
# gated on the discovery status, so a root whose import graph did not close
# reached the compiler and came back with the driver's own internal-input
# error: `E1400 invalid compiler input: compilation requires a closed-valid
# import discovery revision`. The user never saw the unresolved `@import` that
# actually failed, nor the ADR-0078 migration help a batch compile prints for
# it. The gate now lives in the host's compile-scope entry points, so every
# driver reports the program's own diagnostic.
[[case]]
name = "discovery_failure_reports_the_unresolved_import_with_its_help"
files = [
    { path = "main.rue", source = "const util = @import(\"util\");\nfn main() -> i32 { util.value() }\n" },
    { path = "util.rue", source = "pub fn value() -> i32 { 7 }\n" },
]

[case.watch]
kind = "initial_failure"
stderr_contains = [
    "E0704",
    "cannot find module 'util'",
    "imported with its extension: @import(\"util.rue\")",
]
expected_exit_codes = [7]

[[case.watch.edits]]
path = "main.rue"
source = "const util = @import(\"util.rue\");\nfn main() -> i32 { util.value() }\n"

# RUE-2091. A syntax error inside the closure fails import discovery, not
# compilation, and a failed discovery cannot park on a change: the broken
# `@import` may name a file that does not exist yet, which is outside the
# retained closure and so outside anything there is to watch. The loop
# therefore retries every 250ms — and it used to reprint the whole diagnostic
# and its status line on every tick, roughly four identical reports a second
# for as long as someone sat inside the error.
#
# The report now belongs to the failure rather than to the tick, and it returns
# on two triggers: the rendered diagnostic changing, or a source in the watched
# closure changing. The case walks both, plus the memory a successful revision
# clears, because each is separately mutation-survivable — a suite that pins
# only the silence would stay green while a later change quietly undid either
# trigger.
#
# `rue test --watch` shares this loop, so `cli.watch_test` pins that the
# suppression reaches the other watcher rather than re-deriving these three
# behaviors against it.
[[case]]
name = "an_unchanged_reobserve_failure_is_reported_once_not_per_retry"
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nconst other = @import(\"other.rue\");\nfn main() -> i32 { helper.answer() + other.extra() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
    { path = "other.rue", source = "pub fn extra() -> i32 { 0 }\n" },
]

[case.watch]
kind = "repeated_failure"
# 1 + 0 to start; the repaired revision publishes 2 + 3, which is also the last
# thing published — the verbatim re-break that follows it compiles nothing.
expected_exit_codes = [1, 5]
stderr_occurrences = [
    # The first failure, held for several retries, reported once. The code is
    # part of the expectation: keeping the wording while moving the code would
    # otherwise pass.
    { text = "error: [E0102]: expected semicolon after expression", count = 1 },
    # The second failure is reported three times over three revisions, and
    # never twice for the same one: once when it replaces the first, once when
    # an unrelated closure file is saved underneath it, and once when its exact
    # bytes come back after a repair.
    { text = "error: [E0100]: expected 'mut' or identifier or '_', found ';'", count = 3 },
    # One status line per report, not one per attempt.
    { text = "keeping the last successful executable", count = 4 },
]

# Break the closure. Reported once, however many times it is retried.
[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 1 \n"

# A different failure, and so a different report.
[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { let ; }\n"

# A save to another closure file. `helper.rue` is untouched and its rendering
# is byte-identical, so the diagnostic half of the key cannot explain this
# report; only the physical observation of the closure can.
[[case.watch.edits]]
path = "other.rue"
source = "pub fn extra() -> i32 { 3 }\n"

# The repair, which must still publish promptly.
[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 2 }\n"

# The previous failure's bytes, restored verbatim: same rendering, and the same
# physical closure state the third report described, since `other.rue` has not
# moved since. Only the reset on the intervening successful revision makes this
# news again.
[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { let ; }\n"

# RUE-2103. The suppression RUE-2091 added keys on the rendered diagnostic and
# on an observation of the source. The observation half was built from the last
# COMMITTED closure, and a failed re-observation commits nothing — so a module
# that has never been read successfully was in no key at all, and saving it
# produced no output whatsoever, however substantive the edit. That module is
# not an unrelated file: wiring a pre-existing broken helper into the graph for
# the first time is the ordinary way this failure arrives, which makes the
# silent file exactly the one the diagnostic names and the user is editing.
#
# `extra.rue` is broken on disk from the start and imported by nobody. The
# first edit wires it in; the second edits it; the third saves it without
# changing a byte; the fourth repairs it. The two reports below carry the SAME
# rendering at the SAME location, so only the source half of the key can have
# produced the second one.
[[case]]
name = "an_edit_to_a_newly_imported_broken_module_is_acknowledged"
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
    { path = "extra.rue", source = "pub fn spare() -> i32 { 1 }\npub fn broken() -> i32 { 2\n" },
]

[case.watch]
kind = "failure_outside_closure"
expected_exit_codes = [1, 2]
stderr_occurrences = [
    # Twice, byte for byte, at the same line and column: the first report, and
    # the acknowledgement of the edit to the file it names. A key that saw only
    # the committed closure printed this once and then went silent.
    { text = "error: [E0102]: expected semicolon after expression", count = 2 },
    { text = "--> extra.rue:2:26", count = 2 },
    # One status line per report, not one per retry and not one per save: the
    # save that changed no bytes added none.
    { text = "keeping the last successful executable", count = 2 },
]

# Wire the pre-existing broken module into the closure for the first time.
[[case.watch.edits]]
path = "helper.rue"
source = "const extra = @import(\"extra.rue\");\npub fn answer() -> i32 { extra.broken() }\n"

# Edit that module. Line 2 is untouched, so the diagnostic does not move.
[[case.watch.edits]]
path = "extra.rue"
source = "pub fn spare() -> i32 { 41 }\npub fn broken() -> i32 { 2\n"

# Save it without changing it. Content, not the modification time, is what
# makes a revision.
[[case.watch.edits]]
path = "extra.rue"
touch = true

# Repair it. The published program now answers with the repaired module.
[[case.watch.edits]]
path = "extra.rue"
source = "pub fn spare() -> i32 { 41 }\npub fn broken() -> i32 { 2 }\n"

[[case]]
name = "an_edit_to_a_newly_imported_unreadable_module_is_acknowledged"
description = """
RUE-2105. The same failure as the case above, one step earlier in the read.
`extra.rue` is present but cannot be turned into source at all — its bytes are
not UTF-8 — so no attempt ever accepts any bytes for it and it appears in no
accepted-read manifest. Keying the suppression only on what an attempt
*accepted* therefore left this family with nothing to observe: the failure
reported once and then went silent over every later save, on the retry timer,
which is the identical bug the case above closes for a module that reads fine
and merely fails to parse.

Both reports below carry the same message at the same location, so only the
record of the attempt's rejected read can have produced the second.
"""
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]

[case.watch]
kind = "read_failure_outside_closure"
expected_exit_codes = [1, 2]
stderr_occurrences = [
    { text = "could not read import candidate", count = 2 },
    { text = "stream did not contain valid UTF-8", count = 2 },
    # One status line per report, not one per retry and not one per save: the
    # save that changed no bytes added none.
    { text = "keeping the last successful executable", count = 2 },
]

# Stage the unreadable module. Nothing imports it yet, so it is in no closure
# and no watch input, and the watcher must not stir for it.
[[case.watch.edits]]
path = "extra.rue"
undecodable_source = "pub fn broken() -> i32 { 1 }\n"

# Wire it into the closure for the first time.
[[case.watch.edits]]
path = "helper.rue"
source = "const extra = @import(\"extra.rue\");\npub fn answer() -> i32 { extra.broken() }\n"

# Edit it. It is exactly as unreadable and the diagnostic does not move, but it
# is a save the user made and it owes an answer.
[[case.watch.edits]]
path = "extra.rue"
undecodable_source = "pub fn broken() -> i32 { 41 }\n"

# Save it without changing a byte. The record is content-derived on both sides
# of the read, so the new modification time is invisible here too.
[[case.watch.edits]]
path = "extra.rue"
touch = true

# Repair it into real source. The published program answers with it.
[[case.watch.edits]]
path = "extra.rue"
source = "pub fn broken() -> i32 { 2 }\n"

[[case]]
name = "daemon_watch_edits_and_republishes"
description = "The daemon-backed executable watcher republishes an edited transitive module."
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]
args = ["--daemon=required"]
[case.watch]
kind = "edit"
expected_exit_codes = [1, 2]
[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 2 }\n"

[[case]]
name = "daemon_watch_deleted_import_recovers_when_restored"
description = "The daemon-backed executable watcher observes a deleted transitive import and resumes after restoration."
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 3 }\n" },
]
args = ["--daemon=required"]
[case.watch]
kind = "delete"
expected_exit_codes = [3, 4]
[[case.watch.edits]]
path = "helper.rue"
delete = true
[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 4 }\n"

[[case]]
name = "daemon_watch_missing_import_recovers_when_created"
description = "The daemon-backed watcher retains an initial missing import observation until the file is created."
files = [{ path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" }]
args = ["--daemon=required"]
[case.watch]
kind = "initial_failure"
expected_exit_codes = [5]
stderr_contains = ["E0704"]
[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 5 }\n"

[[case]]
name = "an_edit_beside_a_directory_in_a_modules_place_is_acknowledged"
description = """
RUE-2105, the other shape of the same read failure: a directory where a module
belongs. There are no bytes to accept, so the record falls back to the identity
and metadata of whatever is at the path — which is what makes a change under
that directory a new revision and a save that changes nothing still silent.

The repair replaces the directory with a real module, so the counted string is
the directory diagnostic alone: it is reported exactly twice, once when the
directory is wired in and once for the change beneath it.
"""
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]

[case.watch]
kind = "read_failure_outside_closure"
expected_exit_codes = [1, 2]
stderr_occurrences = [
    { text = "which is not a regular source file", count = 2 },
]

# Put a directory where `extra.rue` belongs.
[[case.watch.edits]]
path = "extra.rue"
directory = true

# Wire it in.
[[case.watch.edits]]
path = "helper.rue"
source = "const extra = @import(\"extra.rue\");\npub fn answer() -> i32 { extra.broken() }\n"

# Change what is under it. Creating the entry restamps the directory itself,
# atomically — nothing here ever leaves the path momentarily absent, which
# would produce a different diagnostic rather than a repeat of this one.
[[case.watch.edits]]
path = "extra.rue/inner.rue"
source = "pub fn inner() -> i32 { 1 }\n"

# Save that file without changing it. The directory is untouched, so this is
# not a revision of the module and owes no report.
[[case.watch.edits]]
path = "extra.rue/inner.rue"
touch = true

# Replace the directory with a real module.
[[case.watch.edits]]
path = "extra.rue"
source = "pub fn broken() -> i32 { 2 }\n"

[[case]]
name = "an_edit_beside_a_named_pipe_in_a_modules_place_is_acknowledged"
only_on = [
    "x86-64-linux",
    "aarch64-linux",
    "x86-64-macos",
    "aarch64-macos",
]
description = """
RUE-2105, the read failure that must be classified without opening anything. A
named pipe where a module belongs is not a regular source file, and opening it
for reading blocks until a writer appears — which never happens. The loader has
always decided this from metadata alone; the record of what an attempt could not
read has to hold the same order, or the observation itself never returns and the
watcher stops answering entirely rather than merely going quiet.

So the assertion that matters here is that the watcher keeps reporting at all:
the first report when the pipe is wired in, a second for the closure edit beside
it, and a publication when the module is repaired into real source.
"""
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]

[case.watch]
kind = "read_failure_outside_closure"
expected_exit_codes = [1, 2]
stderr_occurrences = [
    { text = "which is not a regular source file", count = 2 },
]

# Put a named pipe where `extra.rue` belongs. Nothing imports it yet.
[[case.watch.edits]]
path = "extra.rue"
fifo = true

# Wire it in. This is the report that never arrived while the probe reached for
# the pipe's bytes.
[[case.watch.edits]]
path = "helper.rue"
source = "const extra = @import(\"extra.rue\");\npub fn answer() -> i32 { extra.broken() }\n"

# Edit the importing module beside it. The pipe is untouched and renders the
# same diagnostic, so this report can only come from the changed closure read —
# which the loop has to still be running to produce.
[[case.watch.edits]]
path = "helper.rue"
source = "const extra = @import(\"extra.rue\");\n\npub fn answer() -> i32 { extra.broken() }\n"

# Replace the pipe with a real module.
[[case.watch.edits]]
path = "extra.rue"
source = "pub fn broken() -> i32 { 2 }\n"
