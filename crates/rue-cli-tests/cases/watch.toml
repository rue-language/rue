[section]
id = "cli.watch"
name = "Watch loop integration"
description = "Exercise real driver watch orchestration through the test protocol seam."

[[case]]
name = "edit_rebuilds_and_publishes_new_output"
files = [{ path = "main.rue", source = "fn main() -> i32 { 1 }\n" }]

[case.watch]
kind = "edit"
expected_exit_codes = [1, 2]

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 2 }\n"

[[case]]
name = "change_during_compile_publishes_only_newest_revision"
files = [{ path = "main.rue", source = "fn main() -> i32 { 1 }\n" }]

[case.watch]
kind = "cancel"
compile_delay_ms = 250
expected_exit_codes = [1, 3]

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 2 }\n"

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 3 }\n"

[[case]]
name = "deleted_import_retries_reobserve_before_rebuilding"
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]

[case.watch]
kind = "delete"
error_format = "json"
expected_exit_codes = [1, 2]

[[case.watch.edits]]
path = "helper.rue"
delete = true

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 2 }\n"

[[case]]
name = "retargeted_import_symlink_rebuilds_and_publishes_new_output"
only_on = [
    "x86-64-linux",
    "aarch64-linux",
    "x86-64-macos",
    "aarch64-macos",
]
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "target_a.rue", source = "pub fn answer() -> i32 { 1 }\n" },
    { path = "target_b.rue", source = "pub fn answer() -> i32 { 2 }\n" },
]
symlinks = [{ link = "helper.rue", target = "target_a.rue" }]

[case.watch]
kind = "symlink_retarget"
expected_exit_codes = [1, 2]

[[case.watch.edits]]
path = "helper.rue"
symlink_target = "target_b.rue"

# RUE-1783. The watcher can learn that its inputs changed three ways: the
# in-flight change monitor, the publication guard, or the trailing check once
# the monitor has stopped. Only the monitor announced itself, and the
# `change-detected` milestone was emitted solely from `wait_for_change` -- which
# the loop reaches only when the cycle ends with nothing pending. So an edit
# landing after the monitor stopped but before the trailing check was acted on
# correctly (the watcher rebuilt and republished) and never announced, hanging
# any consumer waiting on the milestone.
#
# The window is normally microseconds, which is why this only ever failed on
# loaded CI runners. `boundary_delay_ms` widens it on purpose so the edit lands
# inside it every run: without the fix this case times out after 30s with
# `timed out waiting for watch event "change-detected"`, exactly as CI reported.
#
# A bounded in-flight delay makes the second edit land after compile-started
# but before publication, independently of host load. The first edit still
# exercises the widened post-monitor boundary above.
[[case]]
name = "change_after_monitor_stops_is_still_announced"
files = [{ path = "main.rue", source = "fn main() -> i32 { 1 }\n" }]

[case.watch]
kind = "cancel"
boundary_delay_ms = 400
compile_delay_ms = 100
expected_exit_codes = [1, 3]

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 2 }\n"

[[case.watch.edits]]
path = "main.rue"
source = "fn main() -> i32 { 3 }\n"

# RUE-1830. A watch cycle used to start its change monitor only after
# re-observation and import-graph closure had completed, so an edit landing
# while discovery was still re-closing could not supersede the stale attempt:
# it was noticed only once compilation proper began, or on the next cycle.
# `reobserve_delay_ms` widens the re-closure window on purpose so the second
# edit deterministically lands inside it. The superseded attempt must commit
# nothing: exactly one fresh re-observation over the newest bytes follows, and
# only the newest revision's output ever publishes.
[[case]]
name = "change_during_reobserve_supersedes_the_stale_attempt"
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]

[case.watch]
kind = "supersede_reobserve"
reobserve_delay_ms = 400
expected_exit_codes = [1, 3]

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 2 }\n"

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 3 }\n"

# RUE-1863. Re-observation was made supersedable by RUE-1830, but the phase
# right after it -- acquiring the trusted toolchain modules a reached body
# demands -- still ran to completion against bytes an edit had already
# invalidated. `acquire_delay_ms` widens that window on purpose so the second
# edit deterministically lands while the demand is being read and the import
# graph re-closed. `@parse_i64` is what makes the program park on a trusted
# std demand at all, so the case needs the real std to reach acquisition.
#
# The superseded acquisition is a transaction that commits nothing: the run
# must reacquire cleanly afterwards (`acquire-ok` strictly after
# `acquire-superseded`) and publish only the newest revision's output.
[[case]]
name = "change_during_toolchain_acquisition_supersedes_the_stale_attempt"
files = [
    { path = "main.rue", source = "const helper = @import(\"helper.rue\");\nfn main() -> i32 { let _ = @parse_i64(\"1\"); helper.answer() }\n" },
    { path = "helper.rue", source = "pub fn answer() -> i32 { 1 }\n" },
]
env = { RUE_STD_PATH = "${REAL_STD}" }

[case.watch]
kind = "supersede_acquire"
acquire_delay_ms = 400
expected_exit_codes = [1, 3]

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 2 }\n"

[[case.watch.edits]]
path = "helper.rue"
source = "pub fn answer() -> i32 { 3 }\n"
