    flags = flags + 10;
    a + b
}
fn main() -> i32 {
    let mut flags = 0;
    let total = add(mul(3, 4, inout flags), 5, inout flags);
    @dbg(total);
    @dbg(flags);
    0
}
""" }]
stdout = "17\n11\n"
exit_code = 0
