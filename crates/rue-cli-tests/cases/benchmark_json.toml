[section]
id = "cli.benchmark_json"
name = "Benchmark JSON timing contract"
description = """
RUE-642 pins the honest inclusive-span schema and ensures a restrictive
RUST_LOG filter affects log formatting without disabling timing collection.
ADR-0067 adds the additive wall-clock partition alongside it, so this case
also pins that both timing models are published and stay distinguishable.
"""

[[case]]
name = "timing_survives_restrictive_log_filter"
files = [{ path = "main.rue", source = "fn main() -> i32 { 42 }\n" }]
args = ["--benchmark-json", "main.rue", "-o", "prog"]
env = { RUST_LOG = "error" }
exit_code = 42
compile_stdout_contains = [
  '"schema_version":19',
  '"compiler_build_profile":',
  '"timing_model":"inclusive_spans"',
  # The additive partition, which is the only model that may be stacked. Its
  # bands are integer nanoseconds summing exactly to compiler_root_ns.
  '"phase_accounting":',
  '"compiler_root_ns":',
  '"mixed_parallel_ns":',
  '"unattributed_ns":',
  '"semantic_analysis":',
  '"linking":',
  '"name":"compile"',
  '"root_invocations":1',
  '"name":"lexer"',
  '"name":"parser"',
  '"name":"declaration_occurrence_index"',
  '"name":"body_analysis"',
  '"name":"cfg_construction"',
  '"name":"cfg_optimization"',
  '"name":"codegen_unit"',
  '"source_metrics":',
  '"files":1',
  '"modules":1',
  '"bytes":24',
  '"lines":1',
  '"tokens":',
  '"functions":1',
  '"compiler_work":',
  '"semantic_provider":',
  '"materializations":',
  '"shared_payload_materializations":',
  '"owned_payload_materializations":',
  '"declarations_selected":',
  '"callables_selected":',
  '"query_runtime":',
  '"validation":',
  '"retention_scan_entries":',
]
