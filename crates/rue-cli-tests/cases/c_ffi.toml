# --- Foreign redeclaration across modules (spec 9.3:5, RUE-1218) ------------
# Under the module-local identity rule (RUE-1125) a foreign declaration's
# internal symbol is the raw C name it declares, so two modules declaring one C
# function correctly produce one undefined symbol for the linker. They also land
# on one signature key: disagreeing declarations must be rejected rather than
# letting the last-installed signature silently type-check the other module's
# calls. The check runs at declaration time, so no call site is needed.

[[case]]
name = "extern_conflicting_redeclaration_rejected"
description = "Two modules declaring one C symbol with disagreeing signatures is rejected, naming both declaration sites (E1107)."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 {
    a.call() + b.call()
}""" },
  { path = "a.rue", source = """extern "C" {
    fn shared(x: i64) -> i64;
}

pub fn call() -> i32 {
    @intCast(checked { shared(1) })
}""" },
  { path = "b.rue", source = """extern "C" {
    fn shared(x: ptr const u8) -> i32;
}

pub fn call() -> i32 {
    let byte: u8 = 0;
    checked { shared(@raw(byte)) }
}""" },
]
compile_fail = true
error_contains = ["E1107", "shared", "conflicting signatures", "a.rue", "b.rue"]

[[case]]
name = "extern_conflicting_redeclaration_rejected_without_call_site"
description = "The redeclaration check is a declaration rule: it fires with no call to the foreign symbol at all (E1107)."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 { 0 }""" },
  { path = "a.rue", source = """extern "C" {
    fn shared(x: i64) -> i64;
}""" },
  { path = "b.rue", source = """extern "C" {
    fn shared() -> bool;
}""" },
]
compile_fail = true
error_contains = ["E1107", "shared", "conflicting signatures"]

[[case]]
name = "emit_air_rejects_conflicting_foreign_redeclaration"
description = "The query-owned declaration projection rejects a foreign-signature conflict for semantic presentation as well as normal image production (E1107)."
args = ["main.rue", "--preview", "c_ffi", "--emit", "air"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 { 0 }""" },
  { path = "a.rue", source = """extern "C" {
    fn shared(x: i64) -> i64;
}""" },
  { path = "b.rue", source = """extern "C" {
    fn shared() -> bool;
}""" },
]
compile_fail = true
error_contains = ["E1107", "shared", "conflicting signatures"]

[[case]]
name = "extern_identical_redeclaration_accepted"
description = "An identical redeclaration of one C symbol in two modules is legal, as in C; parameter names are not part of the signature."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");
const b = @import("b.rue");

fn main() -> i32 { 0 }""" },
  { path = "a.rue", source = """extern "C" {
    fn shared(x: i64) -> i64;
}""" },
  { path = "b.rue", source = """extern "C" {
    fn shared(y: i64) -> i64;
}""" },
]
exit_code = 0

# --- Foreign declaration of the entry point (spec 9.3:6, RUE-1220) ----------
# `main` is the program's own entry symbol, reserved for the runtime start glue
# (spec 6.1:38). Because a foreign declaration names the C symbol it declares
# (RUE-1125), `extern "C" { fn main(); }` in a non-root module used to take the
# bare `main` symbol: the program compiled and linked, and a call through the
# declaration recursed into the program's own `main` (stack overflow, exit 101).
# The signature agrees with the entry point's, so the RUE-1218 conflict rule
# cannot reach it — the name alone is the fault, in every module.

[[case]]
name = "extern_declaration_of_main_rejected"
description = "The RUE-1220 repro: a non-root module declaring `extern \"C\" fn main` is rejected instead of binding the program's own entry point (E1108)."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");

fn main() -> i32 {
    a.run()
}""" },
  { path = "a.rue", source = """extern "C" {
    fn main() -> i32;
}

pub fn run() -> i32 {
    checked { main() }
}""" },
]
compile_fail = true
error_contains = ["E1108", "main", "entry point", "a.rue"]

[[case]]
name = "extern_declaration_of_main_in_root_module_rejected"
description = "The entry symbol is reserved in the root module too, with no other declaration to collide with (E1108). A root that also defines `main` is caught earlier still, by the duplicate-definition rule."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """extern "C" {
    fn main() -> i32;
}

fn other() -> i32 { 0 }""" },
]
compile_fail = true
error_contains = ["E1108", "entry point"]

[[case]]
name = "extern_declaration_of_another_symbol_still_accepted"
description = "The rule names the entry symbol exactly: a foreign declaration under any other C name is unaffected."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");

fn main() -> i32 {
    a.run()
}""" },
  { path = "a.rue", source = """extern "C" {
    fn mainly(x: i64) -> i64;
}

pub fn run() -> i32 { 0 }""" },
]
exit_code = 0

[[case]]
name = "ordinary_main_in_another_module_still_compiles_and_runs"
description = "An ordinary (non-`extern`) `main` outside the root stays a namespaced function (RUE-1125): it is mangled, called normally, and does not become the entry point."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");

fn main() -> i32 {
    a.main()
}""" },
  { path = "a.rue", source = """pub fn main() -> i32 { 7 }""" },
]
exit_code = 7
