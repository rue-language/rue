# --- Foreign declaration of the entry point (spec 9.3:6, RUE-1220) ----------
# `main` is the program's own entry symbol, reserved for the runtime start glue
# (spec 6.1:38). Because a foreign declaration names the C symbol it declares
# (RUE-1125), `extern "C" { fn main(); }` in a non-root module used to take the
# bare `main` symbol: the program compiled and linked, and a call through the
# declaration recursed into the program's own `main` (stack overflow, exit 101).
# The signature agrees with the entry point's, so the RUE-1218 conflict rule
# cannot reach it — the name alone is the fault, in every module.

[[case]]
name = "extern_declaration_of_main_rejected"
description = "The RUE-1220 repro: a non-root module declaring `extern \"C\" fn main` is rejected instead of binding the program's own entry point (E1108)."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");

fn main() -> i32 {
    a.run()
}""" },
  { path = "a.rue", source = """extern "C" {
    fn main() -> i32;
}

pub fn run() -> i32 {
    checked { main() }
}""" },
]
compile_fail = true
error_contains = ["E1108", "main", "entry point", "a.rue"]

[[case]]
name = "extern_declaration_of_main_in_root_module_rejected"
description = "The entry symbol is reserved in the root module too, with no other declaration to collide with (E1108). A root that also defines `main` is caught earlier still, by the duplicate-definition rule."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """extern "C" {
    fn main() -> i32;
}

fn other() -> i32 { 0 }""" },
]
compile_fail = true
error_contains = ["E1108", "entry point"]

[[case]]
name = "extern_declaration_of_another_symbol_still_accepted"
description = "The rule names the entry symbol exactly: a foreign declaration under any other C name is unaffected."
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");

fn main() -> i32 {
    a.run()
}""" },
  { path = "a.rue", source = """extern "C" {
    fn mainly(x: i64) -> i64;
}

pub fn run() -> i32 { 0 }""" },
]
exit_code = 0

[[case]]
name = "ordinary_main_in_another_module_still_compiles_and_runs"
description = "An ordinary (non-`extern`) `main` outside the root stays a namespaced function (RUE-1125): it is mangled, called normally, and does not become the entry point."
args = ["main.rue", "-o", "prog"]
files = [
  { path = "main.rue", source = """const a = @import("a.rue");

fn main() -> i32 {
    a.main()
}""" },
  { path = "a.rue", source = """pub fn main() -> i32 { 7 }""" },
]
exit_code = 7

# --- P5: floating point and the FP calling convention (ADR-0064 P5) ---------
#
# Floats are FFI-safe scalars (spec 9.3:1e): `f32` is C `float` and `f64` is C
# `double`, and both cross in the row's floating-point register file. The
# archive's `ffi_fadd` / `ffi_fmul32` members are leaves that read their
# arguments out of `xmm0`/`xmm1` (SysV) or `d0`/`d1` and `s0`/`s1` (AAPCS64)
# and answer in the first of them, so a wrong bank or a wrong move width
# produces a different number rather than a link error. Every value here is a
# whole number in both binary32 and binary64, so the printed integer is exact.

[[case]]
name = "x86_64_linux_float_import_returns_exact_result"
description = "An `extern \"C\"` import taking two `f64`s and one taking two `f32`s cross in the SSE registers and return exact results on x86-64."
files = [{ path = "main.rue", source = """
extern "C" {
    fn ffi_fadd(a: f64, b: f64) -> f64;
    fn ffi_fmul32(a: f32, b: f32) -> f32;
}

fn main() -> i32 {
    let sum = checked { ffi_fadd(1.5, 2.25) };
    let product = checked { ffi_fmul32(3.0, 5.0) };
    @dbg(@float_to_int(sum * 4.0));
    @dbg(@float_to_int(@float_cast(product)));
    0
}
""" }]
args = ["main.rue", "--preview", "c_ffi", "--link-archive", "${FFI_ARCHIVE}", "--target", "x86-64-linux", "-o", "prog"]
ffi_answer_archive = true
executable_target = "x86-64-linux"
execute_if_native = true
stdout = "15\n15\n"
exit_code = 0

[[case]]
name = "aarch64_linux_float_import_returns_exact_result"
description = "The same float imports cross in `d0`/`d1` and `s0`/`s1` under AAPCS64 and return the same exact results."
files = [{ path = "main.rue", source = """
extern "C" {
    fn ffi_fadd(a: f64, b: f64) -> f64;
    fn ffi_fmul32(a: f32, b: f32) -> f32;
}

fn main() -> i32 {
    let sum = checked { ffi_fadd(1.5, 2.25) };
    let product = checked { ffi_fmul32(3.0, 5.0) };
    @dbg(@float_to_int(sum * 4.0));
    @dbg(@float_to_int(@float_cast(product)));
    0
}
""" }]
args = ["main.rue", "--preview", "c_ffi", "--link-archive", "${FFI_ARCHIVE}", "--target", "aarch64-linux", "-o", "prog"]
ffi_answer_archive = true
executable_target = "aarch64-linux"
execute_if_native = true
stdout = "15\n15\n"
exit_code = 0

[[case]]
name = "x86_64_linux_float_export_called_from_c"
