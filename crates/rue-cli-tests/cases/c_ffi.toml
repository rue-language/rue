    a + b
}

pub extern "C" fn rue_sub(a: i32, b: i32) -> i32 {
    a - b
}

extern "C" {
    fn ffi_call_exports() -> i64;
}

fn main() -> i32 {
    @dbg(checked { ffi_call_exports() });
    0
}
""" }]
