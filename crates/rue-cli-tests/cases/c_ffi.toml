}

pub extern "C" fn rue_pair(p: Pair) -> Pair { p }
pub extern "C" fn rue_quad(q: Quad) -> Quad { q }
pub extern "C" fn rue_split(s: Split) -> Split { s }
pub extern "C" fn rue_wide(w: Wide) -> Wide { w }

