    fn f(p: Pt) -> i64;
}
fn main() -> i32 { 0 }
""" }]
args = ["main.rue", "--preview", "c_ffi", "-o", "prog"]
compile_fail = true
error_contains = ["aggregate type `Pt`", "must be marked", "@repr(c)"]

