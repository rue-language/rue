    x
}

pub extern "C" fn rue_id_u16(x: u16) -> u16 {
    x
}

pub extern "C" fn rue_id_bool(x: bool) -> bool {
    x
}

fn main() -> i32 {
    0
}
""" }]
args = ["main.rue", "--preview", "c_ffi", "--target", "aarch64-macos", "-o", "prog"]
executable_target = "aarch64-macos"
execute_if_native = true
stdout = ""
exit_code = 0

