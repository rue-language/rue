# The source-level Vec(T) library (examples/std/vec.rue) driven end-to-end as a
# user would: a flat multi-file compile of a program that exercises
# push / len / get / set / pop / a while-loop sum / out-of-bounds access on a
# Vec(i32) (RUE-1, ADR-0041).
#
# Vec is generic over a Copy element type and is built entirely on the unchecked
# heap intrinsics @alloc/@realloc/@free behind a safe method API. Its `get`/`pop`
# accessors return `Option(T)` (from option.rue), with the enclosing element type
# `T` usable inside the method bodies (RUE-313). It also owns its buffer and frees
# it automatically in a `drop fn` at scope exit (RUE-312); the
# `vec_i32_raii_auto_free` case below exercises that path with no explicit free()
# call. See vec.rue's header for the remaining limitation: Copy element types only.

[section]
id = "cli.vec_library"
name = "Source-level Vec(T) library"
description = "A Rue-source Vec(T) on @alloc/@free with a full push/pop/get/set dogfood returning Option(T) (RUE-1, RUE-313)."

[[case]]
name = "vec_i32_dogfood"
description = "push/len/get/set/pop/while-sum/out-of-bounds on Vec(i32), Option(T) accessors, flat multi-file."
files = [
  { path = "main.rue", source = """
fn main() -> i32 {
    let V = Vec(i32);
    let O = Option(i32);

    let mut v = V::new();
    v.push(10);
    v.push(20);
    v.push(30);
    @dbg(v.len());          // 3

    @dbg(match v.get(1) { O::Some(x) => x, O::None => -1 });   // 20
    v.set(0, 99);
    @dbg(match v.get(0) { O::Some(x) => x, O::None => -1 });   // 99

    @dbg(match v.pop() { O::Some(x) => x, O::None => -1 });    // 30 (removed)
    @dbg(v.len());          // 2

    @dbg(match v.get(99) { O::Some(x) => x, O::None => -1 });  // -1 (out of bounds)

    let mut i: u64 = 0;
    let mut sum: i32 = 0;
    while i < v.len() {
        sum = sum + v.get_or(i, 0);
        i = i + 1;
    }
    @dbg(sum);              // 99 + 20 = 119

    v.free();
    sum
}
""" },
  { path = "option.rue", source = """
pub fn Option(comptime T: type) -> type {
    enum { Some(T), None }
}
""" },
  { path = "vec.rue", source = """
pub fn Vec(comptime T: type) -> type {
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,

        fn new() -> Self {
            let zero: u64 = 0;
            Self { buf: checked { @int_to_ptr(zero) }, len: 0, cap: 0 }
        }
        fn len(borrow self) -> u64 { self.len }
        fn is_empty(borrow self) -> bool { self.len == 0 }
        fn capacity(borrow self) -> u64 { self.cap }

        fn reserve(inout self) {
            if self.len == self.cap {
                let new_cap: u64 = if self.cap == 0 { 4 } else { self.cap * 2 };
                checked {
                    let grown = @realloc(self.buf, self.cap, new_cap);
                    self.buf = grown;
                };
                self.cap = new_cap;
            }
        }
        fn push(inout self, x: T) {
            self.reserve();
            checked {
                let slot = @ptr_offset(self.buf, self.len);
                @ptr_write(slot, x);
            };
            self.len = self.len + 1;
        }
        fn get(borrow self, i: u64) -> Option(T) {
            let O = Option(T);
            if i < self.len {
                O::Some(checked { @ptr_read(@ptr_offset(self.buf, i)) })
            } else {
                O::None
            }
        }
        fn get_or(borrow self, i: u64, default: T) -> T {
            if i < self.len {
                checked { @ptr_read(@ptr_offset(self.buf, i)) }
            } else {
                default
            }
        }
        fn set(inout self, i: u64, x: T) {
            if i < self.len {
                checked {
                    let slot = @ptr_offset(self.buf, i);
                    @ptr_write(slot, x);
                };
            }
        }
        fn pop(inout self) -> Option(T) {
            let O = Option(T);
            if self.len == 0 {
                O::None
            } else {
                self.len = self.len - 1;
                O::Some(checked { @ptr_read(@ptr_offset(self.buf, self.len)) })
            }
        }
        fn clear(inout self) { self.len = 0; }
        fn free(inout self) {
            checked { @free(self.buf, self.cap); };
            let zero: u64 = 0;
            self.buf = checked { @int_to_ptr(zero) };
            self.len = 0;
            self.cap = 0;
        }
    }
}
""" },
]
args = ["main.rue", "vec.rue", "option.rue", "-o", "prog"]
stdout = "3\n20\n99\n30\n2\n-1\n119\n"
exit_code = 119

# Multi-slot struct element type: push/get/set/pop of a two-field `Point`
# round-trips correctly now that aggregates are laid out ascending and raw
# pointers walk their slots upward (ADR-0040 / RUE-311). Previously the second
# field was written at `ptr - 8`, corrupting the preceding element/allocation,
# so Vec was scoped to single-slot Copy elements.
[[case]]
name = "vec_struct_element_dogfood"
description = "push/get/set/pop on Vec(Point) with a two-field struct element (RUE-311)."
files = [
  { path = "main.rue", source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let m = @import(\"vec.rue\");
    let V = m.Vec(Point);

    let mut v = V::new();
    v.push(Point { x: 1, y: 2 });
    v.push(Point { x: 3, y: 4 });
    v.push(Point { x: 5, y: 6 });
    @dbg(v.len());                       // 3

    let p1 = v.get(1);
    @dbg(p1.x); @dbg(p1.y);              // 3 4

    v.set(0, Point { x: 90, y: 91 });
    let p0 = v.get(0);
    @dbg(p0.x); @dbg(p0.y);              // 90 91

    let last = v.pop_or(Point { x: 0, y: 0 });
    @dbg(last.x); @dbg(last.y);          // 5 6
    @dbg(v.len());                       // 2

    v.free();
    0
}
""" },
  { path = "vec.rue", source = """
pub fn Vec(comptime T: type) -> type {
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,

        fn new() -> Self {
            let zero: u64 = 0;
            Self { buf: checked { @int_to_ptr(zero) }, len: 0, cap: 0 }
        }
        fn len(borrow self) -> u64 { self.len }

        fn reserve(inout self) {
            if self.len == self.cap {
                let new_cap: u64 = if self.cap == 0 { 4 } else { self.cap * 2 };
                checked {
                    let grown = @realloc(self.buf, self.cap, new_cap);
                    self.buf = grown;
                };
                self.cap = new_cap;
            }
        }
        fn push(inout self, x: T) {
            self.reserve();
            checked {
                let slot = @ptr_offset(self.buf, self.len);
                @ptr_write(slot, x);
            };
            self.len = self.len + 1;
        }
        fn get(borrow self, i: u64) -> T {
            checked { @ptr_read(@ptr_offset(self.buf, i)) }
        }
        fn set(inout self, i: u64, x: T) {
            if i < self.len {
                checked {
                    let slot = @ptr_offset(self.buf, i);
                    @ptr_write(slot, x);
                };
            }
        }
        fn pop_or(inout self, default: T) -> T {
            if self.len == 0 {
                default
            } else {
                self.len = self.len - 1;
                checked { @ptr_read(@ptr_offset(self.buf, self.len)) }
            }
        }
        fn free(inout self) {
            checked { @free(self.buf, self.cap); };
            let zero: u64 = 0;
            self.buf = checked { @int_to_ptr(zero) };
            self.len = 0;
            self.cap = 0;
        }
    }
}
""" },
]
args = ["main.rue", "vec.rue", "-o", "prog"]
stdout = "3\n3\n4\n90\n91\n5\n6\n2\n"
exit_code = 0

# RAII: the Vec owns its buffer and frees it automatically in its `drop fn` at
# scope exit — the program never calls free(). This exercises the real Vec
# destructor end-to-end (parse + monomorphize + drop-glue + @free), the last
# gap to a real Vec (RUE-312). The `drop fn(self)` here mirrors examples/std/
# vec.rue. Output is the same as the explicit-free dogfood; the destructor's
# @free is a silent no-op under the bump allocator, so correctness is that the
# program compiles, runs, and exits cleanly with the buffer released by the
# destructor rather than a manual call.
[[case]]
name = "vec_i32_raii_auto_free"
description = "Vec(i32) frees its buffer via its drop fn at scope exit — no explicit free() call (RUE-312)."
files = [
  { path = "main.rue", source = """
fn main() -> i32 {
    let m = @import(\"vec.rue\");
    let V = m.Vec(i32);

    let mut v = V::new();
    v.push(10);
    v.push(20);
    v.push(30);
    @dbg(v.len());          // 3
    @dbg(v.get(0));         // 10
    @dbg(v.get(2));         // 30
    let sum: i32 = v.get(0) + v.get(1) + v.get(2);
    @dbg(sum);              // 60
    sum
    // v is dropped here: its drop fn frees the buffer automatically.
}
""" },
  { path = "vec.rue", source = """
pub fn Vec(comptime T: type) -> type {
    struct {
        buf: ptr mut T,
        len: u64,
        cap: u64,

        fn new() -> Self {
            let zero: u64 = 0;
            Self { buf: checked { @int_to_ptr(zero) }, len: 0, cap: 0 }
        }
        fn len(borrow self) -> u64 { self.len }

        fn reserve(inout self) {
            if self.len == self.cap {
                let new_cap: u64 = if self.cap == 0 { 4 } else { self.cap * 2 };
                checked {
                    let grown = @realloc(self.buf, self.cap, new_cap);
                    self.buf = grown;
                };
                self.cap = new_cap;
            }
        }
        fn push(inout self, x: T) {
            self.reserve();
            checked {
                let slot = @ptr_offset(self.buf, self.len);
                @ptr_write(slot, x);
            };
            self.len = self.len + 1;
        }
        fn get(borrow self, i: u64) -> T {
            checked { @ptr_read(@ptr_offset(self.buf, i)) }
        }

        drop fn(self) {
            checked { @free(self.buf, self.cap); };
        }
    }
}
""" },
]
args = ["main.rue", "vec.rue", "-o", "prog"]
stdout = "3\n10\n30\n60\n"
exit_code = 60
