# `Option(Result(T, E))`: three levels through two library type constructors.
[[case]]
name = "x86_64_linux_nested_option_of_result"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "Nested patterns over `Option(Result(i64, E))` on x86-64: 11 + 3 + 30 = 44."
files = [{ path = "main.rue", source = """
const std = @import("std");

enum E { A(u8), B }
const R = std.result.Result(i64, E);
const O = std.option.Option(R);

fn make(n: i32) -> O {
    if n == 0 {
        O.Some(R.Ok(11))
    } else if n == 1 {
        O.Some(R.Err(E.A(3)))
    } else {
        O.None
    }
}

fn classify(n: i32) -> i64 {
    match make(n) {
        O.Some(R.Ok(v)) => v,
        O.Some(R.Err(E.A(b))) => @intCast(b),
        O.Some(R.Err(E.B)) => 100,
        O.None => 30,
    }
}

fn main() -> i32 {
    @intCast(classify(0) + classify(1) + classify(2))
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
exit_code = 44

