# A `_` at a nested position is a fresh unnameable binding, so its droppable
# payload still drops exactly once at the arm's end.
[[case]]
name = "x86_64_linux_nested_wildcard_position_drops_once"
description = "A `_` inside a nested payload pattern drops the discarded value once at the arm's end, on x86-64: prints 7 then -1, exit 5."
files = [{ path = "main.rue", source = """
struct Res { id: i32 }
drop fn Res(self) { @dbg(self.id); }
enum Inner { Full(Res), Nothing }
enum Outer { Wrap(Inner), Empty }

fn take(o: Outer) -> i32 {
    match o {
        Outer.Wrap(Inner.Full(_)) => 5,
        Outer.Wrap(Inner.Nothing) => 1,
        Outer.Empty => 2,
    }
}

fn main() -> i32 {
    let a = take(Outer.Wrap(Inner.Full(Res { id: 7 })));
    @dbg(-1);
    a
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
