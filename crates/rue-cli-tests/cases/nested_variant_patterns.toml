# Three levels of discriminant tests plus a binding, exercised for every path
# through the tree: 7 + 20 + 30 + 40 = 97.
[[case]]
name = "x86_64_linux_three_level_nesting"
description = "Three levels of nested variant patterns dispatch to the right arm on every path, on x86-64: 7+20+30+40 = 97."
files = [{ path = "main.rue", source = """
enum Deep { X(i32), Y }
enum Mid { A(Deep), B }
enum Top { P(Mid), Q }

fn pick(n: i32) -> Top {
    if n == 0 {
        Top.P(Mid.A(Deep.X(7)))
    } else if n == 1 {
        Top.P(Mid.A(Deep.Y))
    } else if n == 2 {
        Top.P(Mid.B)
    } else {
        Top.Q
    }
}

fn classify(n: i32) -> i32 {
    match pick(n) {
        Top.P(Mid.A(Deep.X(v))) => v,
        Top.P(Mid.A(Deep.Y)) => 20,
        Top.P(Mid.B) => 30,
        Top.Q => 40,
    }
}

fn main() -> i32 {
    classify(0) + classify(1) + classify(2) + classify(3)
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
exit_code = 97

