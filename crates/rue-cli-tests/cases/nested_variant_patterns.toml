# A droppable payload reached through a nested pattern is moved out and dropped
# exactly once, at the end of its arm: `7` prints once, before the `-1` marker.
[[case]]
name = "x86_64_linux_nested_droppable_payload_drops_once"
description = "A nested pattern binding a payload with a destructor drops it exactly once at the arm's end, on x86-64: prints 7 then -1, exit 10."
files = [{ path = "main.rue", source = """
struct Res { id: i32 }
drop fn Res(self) { @dbg(self.id); }
enum Inner { Full(Res), Nothing }
enum Outer { Wrap(Inner), Empty }

fn take(o: Outer) -> i32 {
    match o {
        Outer.Wrap(Inner.Full(r)) => r.id,
        Outer.Wrap(Inner.Nothing) => 1,
        Outer.Empty => 2,
    }
}

fn main() -> i32 {
    let a = take(Outer.Wrap(Inner.Full(Res { id: 7 })));
    @dbg(-1);
    let b = take(Outer.Wrap(Inner.Nothing));
    let c = take(Outer.Empty);
    a + b + c
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
stdout = """
7
-1
"""
exit_code = 10

