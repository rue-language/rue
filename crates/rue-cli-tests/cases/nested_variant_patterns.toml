# Two payload positions of one pattern are discriminated at once (RUE-2080):
# the decision tree tests one extracted payload at a time and the arms dispatch
# on the combination. 7 + 23 + 0 + 0 = 30.

[[case]]
name = "x86_64_linux_two_nested_positions"
description = "Nested patterns in both payload positions of one variant dispatch on the combination, on x86-64: 7 + 23 = 30."
files = [{ path = "main.rue", source = """
enum Inner { A(i32), B }
enum Outer { Pair(Inner, Inner) }

fn classify(o: Outer) -> i32 {
    match o {
        Outer.Pair(Inner.A(v), Inner.B) => v,
        Outer.Pair(Inner.B, Inner.A(w)) => w + 20,
        Outer.Pair(_, _) => 0,
    }
}

fn main() -> i32 {
    classify(Outer.Pair(Inner.A(7), Inner.B))
        + classify(Outer.Pair(Inner.B, Inner.A(3)))
        + classify(Outer.Pair(Inner.A(7), Inner.A(1)))
        + classify(Outer.Pair(Inner.B, Inner.B))
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
exit_code = 30

[[case]]
name = "aarch64_linux_two_nested_positions"
description = "The same two-position dispatch on AArch64: 30."
