# Multi-position dispatch keeps the drop accounting: each bound position is
# dropped once at the end of its arm (in reverse declaration order), and the
# value that fails every nested test reaches the catch-all arm, whose
# whole-scrutinee drop runs exactly once (RUE-238).

[[case]]
name = "x86_64_linux_two_nested_positions_drop_once"
description = "Two-position dispatch drops each payload exactly once, including through the catch-all arm, on x86-64: prints 4, 3, -1, 5, -2, 6; exit 9."
files = [{ path = "main.rue", source = """
struct Res { id: i32 }
drop fn Res(self) { @dbg(self.id); }
enum Inner { Full(Res), Nothing }
enum Outer { Pair(Inner, Inner), One(Inner), Empty }

fn take(o: Outer) -> i32 {
    match o {
        Outer.Pair(Inner.Full(r), Inner.Nothing) => r.id,
        Outer.Pair(_, _) => 1,
        _ => 2,
    }
}

fn main() -> i32 {
    let a = take(Outer.Pair(Inner.Full(Res { id: 3 }), Inner.Full(Res { id: 4 })));
    @dbg(-1);
    let b = take(Outer.One(Inner.Full(Res { id: 5 })));
    @dbg(-2);
    let c = take(Outer.Pair(Inner.Full(Res { id: 6 }), Inner.Nothing));
    a + b + c
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
stdout = """
4
3
-1
5
-2
6
"""
exit_code = 9

