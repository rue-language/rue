        + classify(Outer.Pair(Inner.A(7), Inner.A(1)))
        + classify(Outer.Pair(Inner.B, Inner.B))
}
""" }]
args = ["main.rue", "--target", "aarch64-linux", "-o", "prog"]
executable_target = "aarch64-linux"
