# Nested variant patterns (RUE-2053, RUE-2080, spec 4.7:37-4.7:41). A payload
# position may hold another variant pattern, in any number of positions, so one
# match discriminates several levels of a sum type. These cases drive the real
# compiler on both backends: the CFG tests the outer discriminant, extracts the
# payloads it must discriminate, tests them one at a time, and only then binds.

[section]
id = "cli.nested_variant_patterns"
name = "Nested variant patterns"
description = "Nested payload patterns lower to a match on the extracted payload, on both x86-64 and AArch64."

# The RUE-2053 program itself: a library `Result(i64, E)` whose error payload is
# discriminated in the same match that discriminates the result.
[[case]]
name = "x86_64_linux_nested_error_payload"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "`R.Err(E.A(b))` binds the inner payload of a generic Result's error, on x86-64: exit 1."
files = [{ path = "main.rue", source = """
const std = @import("std");

enum E { A(u8), B }
const R = std.result.Result(i64, E);

fn f(x: i64) -> R {
    if x > 0 { R.Ok(x) } else { R.Err(E.A(1)) }
}

fn main() -> i32 {
    match f(0) {
        R.Ok(_) => 0,
        R.Err(E.A(b)) => @intCast(b),
        R.Err(E.B) => 2,
    }
}
""" }]
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
exit_code = 1

