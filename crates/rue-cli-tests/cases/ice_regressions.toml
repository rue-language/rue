# ICE regression corpus (RUE-51).
#
# Every case here is a minimal program that USED to crash the compiler
# (SIGABRT / Rust panic / E9000 internal-compiler-error) and now must either
# compile-and-run or produce a clean diagnostic (exit 1, NO signal). Each is
# labelled with the RUE-NN it pins.
#
# The rue-cli-tests harness auto-classifies death-by-signal or a panic in
# compiler stderr as a distinct INTERNAL COMPILER ERROR failure (see the
# module doc in src/main.rs), so these cases are the durable net that keeps a
# fixed crash fixed: reintroduce any of these ICEs and the case fails loudly as
# an ICE rather than silently regressing. New fuzz crashes should be minimized
# and added here as part of triage.
#
# Do NOT add a green (expected-pass) case for a program that still ICEs on
# trunk: mark it `known_bug = "RUE-NN"` instead, so the harness tracks it as a
# known failure until fixed. Every case below was verified to no longer ICE on
# trunk before being committed.

[section]
id = "cli.ice_regressions"
name = "ICE regressions"
description = "Minimal programs that used to crash the compiler; each must now compile-or-cleanly-error with no signal (RUE-51)."

[[case]]
name = "nonexhaustive_comptime_match_infers_all_arms_rue1910"
description = "RUE-1910: a selected but non-exhaustive comptime match takes the ordinary semantic path, so inference must cover every arm that AIR analysis visits."
files = [{ path = "main.rue", source = """
fn f(comptime n: i32) -> i32 { match n { 0 => 1, 0 => 1 } }
fn main() -> i32 { f(0) }
""" }]
compile_fail = true
error_contains = ["E0600", "match is not exhaustive"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "type inference did not resolve type"]

[[case]]
name = "loop_break_tail_in_never_function_rue1911"
description = "RUE-1911: a reachable never-returning function whose loop can break must be rejected by semantic analysis before its unit return reaches CFG verification."
files = [{ path = "main.rue", source = """
fn stop() -> ! { loop { break } }
fn main() -> i32 { stop() }
""" }]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected !, found ()"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification failed"]

[[case]]
name = "unconstrained_intrinsic_tail_in_never_function_rue1911"
description = "RUE-1911: an unresolved context-driven intrinsic tail is not proof that a declared-never function diverges."
env = { RUE_STD_PATH = "${REAL_STD}" }
files = [{ path = "main.rue", source = """
const std = @import("std");
fn stop() -> ! { @read_line() }
fn main() -> i32 { stop() }
""" }]
compile_fail = true
error_contains = ["E0702", "intrinsic '@read_line' expects Option(StrBuf), found !"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification failed"]

[[case]]
name = "comparison_value_left_never_right_remains_valid_rue1911"
description = "RUE-1911 control: symmetric expression equality still accepts a diverging right operand."
files = [{ path = "main.rue", source = """
fn stop() -> ! { loop {} }
fn compare(flag: bool) -> bool {
    let value: i32 = 1;
    if flag { value == stop() } else { false }
}
fn main() -> i32 { if compare(false) { 1 } else { 0 } }
""" }]
exit_code = 0

[[case]]
name = "comparison_never_left_value_right_remains_valid_rue1911"
description = "RUE-1911 control: symmetric expression equality still accepts a diverging left operand."
files = [{ path = "main.rue", source = """
fn stop() -> ! { loop {} }
fn compare(flag: bool) -> bool {
    let value: i32 = 1;
    if flag { stop() == value } else { false }
}
fn main() -> i32 { if compare(false) { 1 } else { 0 } }
""" }]
exit_code = 0

[[case]]
name = "nominal_type_adjacent_to_if_tail_rue1418"
description = "RUE-1418: a named type adjacent to a block-like if became the function tail and reached CFG as a non-unit return without a runtime value."
files = [{ path = "main.rue", source = """
struct S { v: [i32; 3] }

fn main() -> i32 {
    let a = S { v: [1, 2, 3] };
    let b = S { v: [1, 2, 3] };
    let c = S { v: [1, 2, 4] };
    if a == b && a != c { 1 } else { 0 }S
}
""" }]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected i32, found type"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "CFG verification failed", "has no value"]

[[case]]
name = "qualified_struct_type_adjacent_to_if_tail_rue1418"
