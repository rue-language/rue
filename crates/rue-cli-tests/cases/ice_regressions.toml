const StrBuf = std.strbuf.StrBuf;
fn consume(s: StrBuf) -> i32 {
    let held = s;
    0
}
fn main() -> i32 { consume(StrBuf.new()) }
""" }]
exit_code = 0

[[case]]
name = "struct_field_string_eq_rue94"
