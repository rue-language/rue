name = "comptime_type_param_still_ok_rue217"
description = "RUE-217 guard: a properly-marked `comptime T: type` parameter must still compile and run (spec 4.14:5)."
files = [{ path = "main.rue", source = """
fn f(comptime T: type, x: T) -> T { x }
fn main() -> i32 { f(i32, 5) }
""" }]
exit_code = 5

[[case]]
name = "generic_array_length_undefined_name_rue381"
description = "RUE-381: `[T; A]` in a comptime-generic signature must reject undefined length A as E0481, not ICE during specialization."
files = [{ path = "main.rue", source = """
fn f(comptime T: type, a: [T; A]) -> T { a[0] }
fn main() -> i32 {
    let xs = [7, 8];
    f(i32, xs)
}
""" }]
compile_fail = true
error_contains = ["E0481", "invalid array length", "'A' is not a compile-time constant"]

[[case]]
name = "borrow_const_not_lvalue_rue52"
description = "RUE-52: `borrow CONST` reached codegen as an immediate `Const` and hit panic!(\"by-ref argument must be a place\") in byref_args -> SIGABRT. Now a clean E0427."
files = [{ path = "main.rue", source = """
const C: i32 = 5;
fn take(borrow v: i32) -> i32 { v }
fn main() -> i32 {
    take(borrow C)
}
""" }]
compile_fail = true
error_contains = ["E0427", "borrow argument must be"]

[[case]]
name = "inout_const_not_lvalue_rue52"
description = "RUE-52: `inout CONST` reached codegen as an immediate `Const` and hit panic!(\"by-ref argument must be a place\") in byref_args -> SIGABRT. Now a clean E0425."
files = [{ path = "main.rue", source = """
const C: i32 = 5;
fn bump(inout v: i32) { v = v + 1; }
fn main() -> i32 {
    bump(inout C);
    C
}
""" }]
compile_fail = true
error_contains = ["E0425", "inout argument must be"]
[[case]]
name = "invalid_comptime_type_argument_reports_diagnostic"
description = "A rejected comptime type argument is a deterministic user error, not an incomplete body query."
files = [{ path = "main.rue", source = """
fn id(comptime T: type, value: T) -> T { value }
fn main() -> i32 { id(32, 42) }
""" }]
compile_fail = true
error_contains = ["E0206", "type mismatch"]
compile_stderr_not_contains = ["internal compiler error", "did not publish a terminal"]

[[case]]
name = "unknown_comptime_type_argument_reports_diagnostic"
description = "An unknown type passed to a comptime type parameter does not abort body-query publication."
files = [{ path = "main.rue", source = """
fn id(comptime T: type, value: T) -> T { value }
fn main() -> i32 { id(i34, 42) }
""" }]
compile_fail = true
error_contains = ["E0206", "type mismatch"]
compile_stderr_not_contains = ["internal compiler error", "did not publish a terminal"]
