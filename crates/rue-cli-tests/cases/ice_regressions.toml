[[case]]
name = "runtime_call_struct_head_literal_inference_rue1570"
description = "RUE-1570: a runtime-valued call parsed as an inline struct-literal head skipped inference for its integer argument, so the intended type diagnostic became E9000."
files = [{ path = "main.rue", source = """
fn test(x: i32) -> i32 {
    let y = if x > 5 { return 100 } else { x };
    y * 2
}
fn main() -> i32 { test(3) { x };
    y * 2}
""" }]
compile_fail = true
error_contains = ["E0206", "type mismatch: expected a type, found i32"]
compile_stderr_not_contains = ["E9000", "internal compiler error", "type inference did not resolve type"]

[[case]]
name = "generic_array_value_length_unknown_element_type_rue407"
description = "RUE-407 / GitHub #1225: a deferred generic array type `[i3; N]` validated only the `N` length, then specialization panicked when the unknown element type failed substitution. Now it is a clean E0204."
files = [{ path = "main.rue", source = """
fn first(comptime N: i32, arr: [i3; N]) -> i32 {
    arr[0]
}
fn main() -> i32 {
    first(3, [42, 1, 2])
}
""" }]
compile_fail = true
error_contains = ["E0204", "unknown type 'i3'"]

[[case]]
name = "nested_struct_field_into_if_merge_rue24"
description = "RUE-24: a nested struct field flowing into an if/else merge block had no field vregs -> SIGABRT at cfg_lower."
files = [{ path = "main.rue", source = """
struct Inner { a: i32, b: i32 }
struct Outer { inner: Inner }
fn main() -> i32 {
    let o = Outer { inner: Inner { a: 10, b: 32 } };
    let r = if true { o.inner } else { Inner { a: 1, b: 2 } };
    r.a + r.b
}
""" }]
exit_code = 42

[[case]]
name = "placeread_nested_struct_copy_rue22"
description = "RUE-22: PlaceRead of a 2-slot nested struct loaded only slot 0 (miscompiled to 10; ICE family root)."
files = [{ path = "main.rue", source = """
struct Inner { a: i32, b: i32 }
struct Outer { x: i32, inner: Inner }
fn main() -> i32 {
    let o = Outer { x: 1, inner: Inner { a: 10, b: 32 } };
    let r = o.inner;
    r.a + r.b
}
""" }]
exit_code = 42

[[case]]
name = "inout_struct_field_rue35"
description = "RUE-35: inout of a struct field ('by-ref argument must be a variable') -> SIGABRT at cfg_lower."
files = [{ path = "main.rue", source = """
struct Pair { n: i32 }
fn bump(inout v: i32) { v = v + 1; }
fn main() -> i32 {
    let mut p = Pair { n: 41 };
    bump(inout p.n);
    p.n
}
""" }]
exit_code = 42

[[case]]
name = "inout_array_element_rue35"
description = "RUE-35: inout of an array element -> same SIGABRT at cfg_lower."
files = [{ path = "main.rue", source = """
fn bump(inout v: i32) { v = v + 1; }
fn main() -> i32 {
    let mut a: [i32; 3] = [41, 0, 0];
    bump(inout a[0]);
    a[0]
}
""" }]
exit_code = 42

[[case]]
