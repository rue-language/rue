# `Self` type in struct blocks (RUE-123, RUE-2223).
#
# `Self` must resolve to the enclosing struct type wherever a type is expected
# (6.4:18): a method's return type, its parameter types, `Self { ... }` body
# literals, a field's type, and the initializer of a type-valued associated
# constant. Before the fixes, each of these positions produced E0204
# "unknown type 'Self'"; the anonymous-struct field case surfaced instead as a
# misleading E1200 at the binding that stored the type constructor's result.

[section]
id = "cli.self_type_methods"
name = "Self type in struct blocks"
description = "Self resolves to the enclosing struct in named-struct and anonymous-struct signatures, field types, associated-constant initializers, and bodies."

[[case]]
name = "self_return_type_associated_fn"
files = [{ path = "main.rue", source = """
struct P {
    x: i32,

    fn make() -> Self {
        P { x: 42 }
    }

    fn get(self) -> i32 { self.x }
}

fn main() -> i32 {
    let p = P.make();
    @dbg(p.get());
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "self_in_param_return_and_body_literal"
files = [{ path = "main.rue", source = """
struct P {
    x: i32,

    fn make(v: i32) -> Self { Self { x: v } }
    fn combine(self, other: Self) -> Self { Self { x: self.x + other.x } }
    fn get(self) -> i32 { self.x }
}

fn main() -> i32 {
    let a = P.make(30);
    let b = P { x: 12 };
    @dbg(a.combine(b).get());
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "self_method_chaining_returning_self"
files = [{ path = "main.rue", source = """
struct Counter {
    value: i32,

    fn inc(self) -> Self {
        Self { value: self.value + 1 }
    }
}

fn main() -> i32 {
    let c = Counter { value: 39 };
    @dbg(c.inc().inc().inc().value);
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "self_in_a_field_type_through_the_driver"
description = "A named struct's `ptr mut Self` field links and runs, including through a nested array, pointer, and type-constructor argument (RUE-2223)."
files = [{ path = "main.rue", source = """
fn Boxed(comptime T: type) -> type { struct { p: ptr mut T } }

struct Node {
    v: i32,
    next: ptr mut Self,
    kids: [ptr mut Self; 2],
    boxed: Boxed(Self),

    fn value(borrow self) -> i32 { self.v }
}

fn main() -> i32 {
    let null = checked { @int_to_ptr(0) };
    let n = Node { v: 42, next: null, kids: [null, null], boxed: Boxed(Node) { p: null } };
    @dbg(n.value());
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "self_in_an_anonymous_struct_field_type"
description = "A type constructor's anonymous struct names itself in a field type; the produced type is still an ordinary runtime type (RUE-2223)."
files = [{ path = "main.rue", source = """
fn LinkedNode(comptime T: type) -> type {
    struct {
        v: T,
        next: ptr mut Self,

        fn value(borrow self) -> T { self.v }
    }
}

fn main() -> i32 {
    let N = LinkedNode(i32);
    let n: N = N { v: 42, next: checked { @int_to_ptr(0) } };
    @dbg(n.value());
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "self_initializes_a_type_valued_associated_constant"
description = "With --preview interfaces, `const Element = Self;` supplies the struct itself for an interface's associated-type requirement (RUE-2223)."
files = [{ path = "main.rue", source = """
interface Holder { const Element: type; fn get(borrow self) -> i64; }

struct Node is Holder {
    v: i64,
    pub const Element = Self;

    fn get(borrow self) -> i64 { self.v }
}

fn main() -> i32 {
    let n = Node { v: 3 };
    @dbg(n.get());
    @intCast(n.get())
}
""" }]
args = ["--preview", "interfaces", "main.rue", "-o", "prog"]
stdout = "3\n"
exit_code = 3

[[case]]
name = "self_outside_a_struct_block_is_still_unknown"
description = "`Self` in a free function's parameter type has no enclosing struct and stays E0204 (RUE-2223)."
files = [{ path = "main.rue", source = """
struct Pair { a: i32, b: i32 }

fn take(p: Self) -> i32 { p.a }

fn main() -> i32 { take(Pair { a: 1, b: 2 }) }
""" }]
compile_fail = true
error_contains = ["E0204", "unknown type 'Self'"]
