# Comptime value parameters are monomorphized per value (RUE-166).
#
# Before the fix, a function with a `comptime n: i32` parameter was analyzed
# ONCE with `n` unknown: `comptime { n }` in its body failed E1200, and
# recursion (`fact(n - 1)`) failed E1201 at the argument. Now every distinct
# comptime value creates its own specialization (`f.v5`, `f.v3`, ...) —
# mirroring the RUE-109 type-identity mangling — in which `n` is a
# compile-time constant. Comptime-known `if` conditions inside such bodies
# select their branch at compile time, so comptime recursion terminates; a
# depth cap (64 rounds) diagnoses runaway recursion instead of hanging.

[section]
id = "cli.comptime_value_params"
name = "Comptime value parameter specialization"
description = "Per-value monomorphization of comptime value parameters through the real driver."

[[case]]
name = "comptime_block_uses_param"
description = "The body's comptime block sees the concrete value of the comptime parameter."
files = [{ path = "main.rue", source = """
fn f(comptime n: i32) -> i32 {
    comptime { n + 1 }
}
fn main() -> i32 {
    @dbg(f(5));
    0
}
""" }]
stdout = "6\n"

[[case]]
name = "comptime_recursion_factorial"
description = "Comptime recursion: each value specializes, dead branches prune, recursion terminates."
files = [{ path = "main.rue", source = """
fn fact(comptime n: i32) -> i32 {
    if n <= 1 { 1 } else { n * fact(n - 1) }
}
fn main() -> i32 {
    @dbg(fact(5));
    0
}
""" }]
stdout = "120\n"

[[case]]
name = "comptime_forwarding_still_works"
description = "Pin: forwarding a comptime parameter to another comptime parameter (worked pre-fix)."
files = [{ path = "main.rue", source = """
fn g(comptime m: i32) -> i32 { m }
fn f(comptime n: i32) -> i32 { g(n) }
fn main() -> i32 {
    @dbg(f(42));
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "two_distinct_values_two_symbols"
description = "f(3) and f(5) produce distinct specialized symbols; same value dedups (RUE-100's duplicate-symbol failure mode must not return)."
files = [{ path = "main.rue", source = """
fn f(comptime n: i32) -> i32 {
    comptime { n + 1 }
}
fn main() -> i32 {
    @dbg(f(3) + f(5) + f(5));
    0
}
""" }]
stdout = "16\n"

[[case]]
name = "mixed_type_and_value_params"
description = "A function with both a comptime type parameter and a comptime value parameter specializes on both."
files = [{ path = "main.rue", source = """
fn scaled(comptime T: type, comptime k: i32, x: T) -> T {
    x * comptime { k * 2 }
}
fn main() -> i32 {
    @dbg(scaled(i32, 3, 7));
    0
}
""" }]
stdout = "42\n"

[[case]]
name = "runaway_comptime_recursion_diagnosed"
description = "Recursion with no comptime-known base case hits the depth cap with a clean diagnostic (no hang, no ICE)."
files = [{ path = "main.rue", source = """
fn runaway(comptime n: i32) -> i32 {
    runaway(n + 1)
}
fn main() -> i32 {
    runaway(0)
}
""" }]
compile_fail = true
error_contains = ["exceeded the maximum"]

[[case]]
name = "deep_base_case_diagnosed_not_hung"
description = "fact(1000000): a base case beyond the depth cap is a fast, clean error — not a compiler hang."
files = [{ path = "main.rue", source = """
fn fact(comptime n: i64) -> i64 {
    if n <= 1 { 1 } else { n * fact(n - 1) }
}
fn main() -> i32 {
    if fact(1000000) > 0 { 1 } else { 0 }
}
""" }]
compile_fail = true
error_contains = ["exceeded the maximum"]

[[case]]
name = "module_member_call_with_comptime_param"
description = "Calling a comptime-value function through a module object routes through specialization."
files = [
    { path = "main.rue", source = """
const util = @import("util.rue");
fn main() -> i32 {
    @dbg(util.scale(5, 7));
    0
}
""" },
    { path = "util.rue", source = """
pub fn scale(comptime k: i32, x: i32) -> i32 {
    x * comptime { k + 1 }
}
""" },
]
stdout = "42\n"

[[case]]
name = "runtime_arg_to_comptime_param_still_rejected"
description = "Pin: a runtime value passed to a comptime parameter is still E1201."
files = [{ path = "main.rue", source = """
fn double(comptime n: i32) -> i32 { n * 2 }
fn main() -> i32 {
    let x = 21;
    double(x)
}
""" }]
compile_fail = true
error_contains = ["comptime parameter requires a compile-time known value"]

[[case]]
name = "runtime_parameter_shadows_file_const_during_comptime_evaluation"
description = "A runtime parameter must not resolve to a same-named file constant when passed to a comptime parameter."
files = [{ path = "main.rue", source = """
const N: i32 = 7;

fn need(comptime value: i32) -> i32 { value }

fn outer(N: i32) -> i32 {
    need(N)
}

fn main() -> i32 { outer(42) }
""" }]
compile_fail = true
error_contains = ["E1201", "comptime parameter requires a compile-time known value"]

[[case]]
name = "comptime_recursion_factorial_via_match"
description = "RUE-191: comptime recursion written with `match` instead of `if` — arm selection on the comptime-known scrutinee lets the recursion terminate instead of spuriously hitting the depth cap."
files = [{ path = "main.rue", source = """
fn fact(comptime n: i32) -> i32 {
    match n {
        0 => 1,
        1 => 1,
        _ => n * fact(n - 1),
    }
}
fn main() -> i32 {
    @dbg(fact(5));
    0
}
""" }]
stdout = "120\n"

[[case]]
name = "comptime_match_dead_arm_not_analyzed"
description = "RUE-191: the unselected arm of a comptime-known match is not analyzed — its comptime block would divide by zero for THIS specialization but is dead."
files = [{ path = "main.rue", source = """
fn f(comptime n: i32) -> i32 {
    match n {
        0 => 7,
        _ => comptime { 100 / n },
    }
}
fn main() -> i32 {
    @dbg(f(0));
    @dbg(f(4));
    0
}
""" }]
stdout = "7\n25\n"

[[case]]
name = "comptime_match_bool_arms"
description = "RUE-191: bool comptime scrutinees select their arm; each specialization takes a different arm."
files = [{ path = "main.rue", source = """
fn pick(comptime b: bool) -> i32 {
    match b {
        true => 1,
        false => 2,
    }
}
fn main() -> i32 {
    @dbg(pick(false));
    @dbg(pick(true));
    0
}
""" }]
stdout = "2\n1\n"

[[case]]
name = "comptime_match_nonexhaustive_still_rejected"
description = "RUE-191 guard: exhaustiveness stays checked when the scrutinee is comptime-known — a matching arm does not excuse a non-exhaustive pattern set."
files = [{ path = "main.rue", source = """
fn f(comptime n: i32) -> i32 {
    match n {
        0 => 1,
    }
}
fn main() -> i32 {
    @dbg(f(0));
    0
}
""" }]
compile_fail = true
error_contains = ["E0600", "not exhaustive"]

[[case]]
name = "runtime_match_unchanged_control"
description = "RUE-191 control: a match on a RUNTIME scrutinee inside a value-specialized body still compiles to a real runtime match (all arms live)."
files = [{ path = "main.rue", source = """
fn classify(comptime unused: i32, x: i32) -> i32 {
    match x {
        0 => 10,
        1 => 20,
        _ => 30,
    }
}
fn main() -> i32 {
    @dbg(classify(9, 0));
    @dbg(classify(9, 1));
    @dbg(classify(9, 5));
    0
}
""" }]
stdout = "10\n20\n30\n"

[[case]]
name = "comptime_match_out_of_range_pattern_rejected"
description = "RUE-215 facet A: an out-of-range integer pattern is diagnosed (E0800) even when the comptime scrutinee lets the match be pruned. Pattern legality is independent of arm selection (spec 4.7:23)."
files = [{ path = "main.rue", source = """
fn f(comptime n: i8) -> i32 {
    match n {
        0 => 1,
        200 => 2,
        _ => 3,
    }
}
fn main() -> i32 {
    f(0)
}
""" }]
compile_fail = true
error_contains = ["E0800", "out of range for type 'i8'"]

[[case]]
name = "match_out_of_range_pattern_control"
description = "RUE-215 facet A control: identical body with a plain (non-comptime) i8 scrutinee is rejected the same way — confirms the check exists on the normal path."
files = [{ path = "main.rue", source = """
fn f(n: i8) -> i32 {
    match n {
        0 => 1,
        200 => 2,
        _ => 3,
    }
}
fn main() -> i32 {
    f(0)
}
""" }]
compile_fail = true
error_contains = ["E0800", "out of range for type 'i8'"]

[[case]]
name = "comptime_match_negative_on_unsigned_rejected"
description = "RUE-215 facet B: a negative pattern on an unsigned comptime scrutinee is diagnosed (E0801) even when the match is prunable (spec 4.7:24)."
files = [{ path = "main.rue", source = """
fn f(comptime n: u32) -> i32 {
    match n {
        0 => 1,
        -1 => 2,
        _ => 3,
    }
}
fn main() -> i32 {
    f(0)
}
""" }]
compile_fail = true
error_contains = ["E0801", "u32"]

[[case]]
name = "match_negative_on_unsigned_control"
description = "RUE-215 facet B control: identical body with a plain (non-comptime) u32 scrutinee is rejected the same way."
files = [{ path = "main.rue", source = """
fn f(n: u32) -> i32 {
    match n {
        0 => 1,
        -1 => 2,
        _ => 3,
    }
}
fn main() -> i32 {
    f(0)
}
""" }]
compile_fail = true
error_contains = ["E0801", "u32"]

[[case]]
name = "comptime_match_in_range_pattern_still_runs"
description = "RUE-215 guard: a valid comptime match with an in-range pattern still prunes and runs correctly — the added legality check does not disturb selection."
files = [{ path = "main.rue", source = """
fn f(comptime n: i8) -> i32 {
    match n {
        0 => 1,
        100 => 2,
        _ => 3,
    }
}
fn main() -> i32 {
    @dbg(f(100));
    @dbg(f(0));
    @dbg(f(50));
    0
}
""" }]
stdout = "2\n1\n3\n"

# A deferred semantic type (`T`) does not make this a comptime TYPE parameter.
# Source-declared kind controls stream routing and erasure: `value` remains one
# concrete runtime slot in the specialized function.
[[case]]
name = "comptime_value_parameter_typed_by_type_parameter"
files = [{ path = "main.rue", source = """
fn choose(comptime T: type, comptime value: T, trailing: i32) -> i32 {
    trailing
}

fn main() -> i32 {
    choose(i64, 7, 42)
}
""" }]
exit_code = 42
