# A `for` loop is a shared borrow of the collection for the loop's duration
# (spec 4.8:26, RUE-233/RUE-257/RUE-259/RUE-2052 — one root: the loop desugared
# to a move-out instead of the shared borrow the spec mandates). Four faces:
#
#  * RUE-233: mutating the iterated place — element (`a[i]=`), whole variable
#    (`a=`), or field — inside the body is E0428 (`MutateBorrowedValue`), like
#    an explicit `borrow` parameter (used to be silently accepted).
#  * RUE-257: mutating the collection through an `inout self` method (StrBuf
#    `.clear()`/`.push()`) inside the body is E0428 too — previously a runtime
#    miscompile (a spurious `invalid UTF-8` / out-of-bounds trap).
#  * RUE-259: a NON-Copy element type is bound by shared borrow, not moved out
#    of the collection — the loop compiles (used to be E0904), the array drops
#    each element exactly once, and moving the binder out is rejected.
#  * RUE-2052: because the loop only reads the collection through that borrow,
#    the iterable need not be owned by the iterating function — a `borrow` or
#    `inout` parameter is iterable (used to be E0429).
#
# Iterating a different collection, and read-only iteration, still compile.

[section]
id = "cli.for_loop_iter_borrow"
name = "For-loop iterable borrow-check"
description = "A `for` loop is a shared borrow: non-Copy elements iterate without moving, borrowed iterables are accepted, per-element destructors run once, mutating the collection mid-loop is E0428 (RUE-233/257/259/2052)."

[[case]]
name = "mutate_iterated_element_is_e0428"
description = "RUE-233: `a[2] = 100` inside `for x in a` mutates a shared-borrowed collection (E0428)."
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0428"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut a: [i32; 3] = [1, 2, 3];
    let mut sum = 0;
    for x in a {
        sum = sum + x;
        a[2] = 100;
    }
    sum
}
""" }]

[[case]]
name = "reassign_iterated_array_is_e0428"
description = "RUE-233: whole-array reassign `a = [7,8,9]` inside `for x in a` is E0428."
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0428"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut a: [i32; 3] = [1, 2, 3];
    let mut sum = 0;
    for x in a {
        sum = sum + x;
        a = [7, 8, 9];
    }
    sum
}
""" }]

[[case]]
name = "mutate_different_array_is_fine"
description = "Control: iterating `b` while mutating a DIFFERENT array `a` compiles and runs (60 + 100)."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let mut a: [i32; 3] = [1, 2, 3];
    let b: [i32; 3] = [10, 20, 30];
    let mut sum = 0;
    for x in b {
        sum = sum + x;
        a[0] = 100;
    }
    sum + a[0]
}
""" }]
exit_code = 160

[[case]]
name = "read_only_for_loop_still_works"
description = "Control: a read-only `for x in a` still compiles and sums correctly (1+2+3 = 6)."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a: [i32; 3] = [1, 2, 3];
    let mut sum = 0;
    for x in a {
        sum = sum + x;
    }
    sum
}
""" }]
exit_code = 6

# --- RUE-259: non-Copy element type iterates by shared borrow -----------------

[[case]]
name = "non_copy_element_iterates"
description = "RUE-259: a non-Copy struct element iterates by shared borrow (was wrongly E0904); sums to 4."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Point { x: i32, y: i32 }
fn main() -> i32 {
    let a = [Point { x: 1, y: 2 }, Point { x: 3, y: 4 }];
    let mut sum = 0;
    for p in a {
        sum = sum + p.x;
    }
    sum
}
""" }]
exit_code = 4

[[case]]
name = "non_copy_element_destructor_runs_once"
description = "RUE-259: the array (not the loop binder) drops each element once — destructor fires exactly once per element."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Res { tag: i32 }
drop fn Res(self) { @dbg(self.tag); }
fn main() -> i32 {
    let a = [Res { tag: 11 }, Res { tag: 22 }];
    let mut total = 0;
    for r in a {
        total = total + r.tag;
    }
    total
}
""" }]
stdout = "11\n22\n"
exit_code = 33

[[case]]
name = "non_copy_wildcard_binder_destructor_once"
description = "RUE-259: `for _ in a` over a drop-bearing element also borrows (not discards) it — the array drops each element once, not twice."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Res { tag: i32 }
drop fn Res(self) { @dbg(self.tag); }
fn main() -> i32 {
    let a = [Res { tag: 7 }, Res { tag: 8 }];
    let mut n = 0;
    for _ in a {
        n = n + 1;
    }
    n
}
""" }]
stdout = "7\n8\n"
exit_code = 2

[[case]]
name = "move_element_out_is_error"
description = "RUE-259: moving the binder out of the loop would double-drop — rejected (cannot move out of borrowed value)."
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["cannot move out of borrowed value"]
files = [{ path = "main.rue", source = """
struct Res { tag: i32 }
drop fn Res(self) { @dbg(self.tag); }
fn eat(r: Res) -> i32 { r.tag }
fn main() -> i32 {
    let a = [Res { tag: 1 }, Res { tag: 2 }];
    let mut s = 0;
    for r in a {
        s = s + eat(r);
    }
    s
}
""" }]

[[case]]
name = "declared_linear_constant_projection_from_loop_binder_is_rejected"
description = "A constant projection that would consume a declared-linear loop binder is rejected through the loop's shared borrow slot."
compile_fail = true
error_contains = ["cannot move out of borrowed value"]
files = [{ path = "main.rue", source = """
linear struct Token { values: [i32; 2] }
fn main() -> i32 {
    let tokens = [Token { values: [7, 8] }];
    for token in tokens {
        token.values[0]
    }
    @drop(tokens);
    0
}
""" }]

# --- RUE-257: mutating the collection via an inout-self method ----------------

[[case]]
name = "mutate_via_method_in_chars_loop_is_e0428"
env = { RUE_STD_PATH = "${REAL_STD}" }
description = "RUE-257: `s.clear()` inside `for c in s.chars()` mutates a shared-borrowed StrBuf (E0428), not a runtime UTF-8 trap."
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0428"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut s = "abc".clone();
    for c in s.chars() {
        s.clear();
        @dbg(c);
    }
    0
}
""" }]

[[case]]
name = "mutate_via_method_in_byte_loop_is_e0428"
description = "RUE-257: `s.clear()` inside `for b in s` (byte view) is E0428, not an out-of-bounds trap."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
compile_fail = true
error_contains = ["E0428"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;
fn main() -> i32 {
    let mut s: StrBuf = "abc";
    for b in s {
        s.clear();
    }
    0
}
""" }]

[[case]]
name = "read_collection_elsewhere_in_body_is_fine"
description = "Control: reading (not mutating) the iterated array elsewhere in the body is a shared+shared read — fine."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
fn main() -> i32 {
    let a = [1, 2, 3];
    let mut sum = 0;
    for x in a {
        sum = sum + x + a[0];
    }
    sum
}
""" }]
exit_code = 9

# --- RUE-2052: the iterable may itself be borrowed ---------------------------
# Iteration reads the collection through a loan, so the iterating function does
# not have to own it: a `borrow` or `inout` parameter is iterable, and no move
# is recorded against a local either. The reported program is target-pinned like
# cli.abi_conformance: every host compiles and links both backends, and the
# matching native host executes it.

[[case]]
name = "x86_64_linux_for_over_borrow_strbuf_parameter"
description = "RUE-2052: `for b in s` over a `borrow StrBuf` parameter compiles and counts 2 spaces on x86-64 (was E0429)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "--target", "x86-64-linux", "-o", "prog"]
executable_target = "x86-64-linux"
execute_if_native = true
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn count_spaces(borrow s: StrBuf) -> u64 {
    let mut n: u64 = 0;
    for b in s {
        if b == 32 { n += 1; }
    }
    n
}

fn main() -> i32 {
    let s: StrBuf = "a b c";
    @intCast(count_spaces(borrow s))
}
""" }]
exit_code = 2

[[case]]
name = "aarch64_linux_for_over_borrow_strbuf_parameter"
description = "RUE-2052: the same borrowed-iterable program compiles, links, and (on a native host) counts 2 spaces on AArch64."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "--target", "aarch64-linux", "-o", "prog"]
executable_target = "aarch64-linux"
execute_if_native = true
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn count_spaces(borrow s: StrBuf) -> u64 {
    let mut n: u64 = 0;
    for b in s {
        if b == 32 { n += 1; }
    }
    n
}

fn main() -> i32 {
    let s: StrBuf = "a b c";
    @intCast(count_spaces(borrow s))
}
""" }]
exit_code = 2

[[case]]
name = "for_over_inout_strbuf_parameter_is_a_read"
description = "RUE-2052: iterating an `inout StrBuf` parameter is a shared read, not a write — the parameter stays mutable afterward (2 spaces + 6 bytes = 8)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn count_then_push(inout s: StrBuf) -> u64 {
    let mut n: u64 = 0;
    for b in s {
        if b == 32 { n += 1; }
    }
    s.push(33);
    n
}

fn main() -> i32 {
    let mut s: StrBuf = "a b c";
    let n = count_then_push(inout s);
    @intCast(n + s.len())
}
""" }]
exit_code = 8

[[case]]
name = "for_over_borrow_array_of_non_copy_elements"
description = "RUE-2052: a `borrow [StrBuf; 2]` parameter iterates without moving out of the loan (2 + 3 bytes, plus 2 read back from the caller's array = 7)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn total_len(borrow a: [StrBuf; 2]) -> u64 {
    let mut t: u64 = 0;
    for s in a {
        t += s.len();
    }
    t
}

fn main() -> i32 {
    let a: [StrBuf; 2] = ["ab", "cde"];
    let n = total_len(borrow a);
    @intCast(n + a[0].len())
}
""" }]
exit_code = 7

[[case]]
name = "for_over_local_strbuf_leaves_it_usable"
description = "RUE-2052 (the other side): a local StrBuf iterated by a `for` is borrowed, not moved, so `s.len()` after the loop is fine (2 + 5 = 7)."
env = { RUE_STD_PATH = "${REAL_STD}" }
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

fn main() -> i32 {
    let s: StrBuf = "a b c";
    let mut n: u64 = 0;
    for b in s {
        if b == 32 { n += 1; }
    }
    @intCast(n + s.len())
}
""" }]
exit_code = 7

[[case]]
name = "for_over_temporary_iterable_drops_it_once_after_the_loop"
description = "RUE-2052 control: a by-value temporary iterable is still owned by the loop's hidden binding and dropped exactly once, after the loop."
args = ["main.rue", "-o", "prog"]
files = [{ path = "main.rue", source = """
struct Res { tag: i32 }
drop fn Res(self) { @dbg(self.tag); }
fn make() -> [Res; 2] { [Res { tag: 7 }, Res { tag: 8 }] }
fn main() -> i32 {
    let mut total = 0;
    for r in make() {
        total = total + r.tag;
    }
    @dbg(99);
    total
}
""" }]
stdout = "7\n8\n99\n"
exit_code = 15
