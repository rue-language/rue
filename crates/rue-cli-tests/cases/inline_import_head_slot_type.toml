# A value flowing into a declared-type slot, or an operand into an operator,
# is checked by its analyzed type (RUE-2438). Inference unifies each of these
# with the slot, but it has no fact for an operand it could not type, and
# `<error>` unifies with anything while AIR emission still computes the real
# type. An inline `@import("lib.rue").Box(i64) { .. }` head was such an
# operand until RUE-2439: call arguments, assignments, the tail result, array
# elements and operator operands trusted inference, so a `Box(i64)` reached a
# `Box(i32)` slot. Another module's four-field `R(u64)` passed for a one-field
# one read past the value and segfaulted, a `StrBuf == R(u64)` read the struct
# as a string, an assignment kept stale fields, and the other positions failed
# as E9000 or codegen ICEs.
#
# The comptime engine now reduces a path rooted at an inline `@import`
# (RUE-2439), so inference has the fact and reports each of these first; the
# analyzed-type check stays behind it for any other operand inference cannot
# type. Either way each position reports E0206 (E0801 for a unary `-`), never
# a miscompile or ICE.
#
# A head through a re-exported callable alias (`facade.Box(u8)` with
# `pub const Box = boxes.Box;`) was another head the comptime engine did not
# reduce; it now resolves the alias as a runtime module-member call does, so
# the call's arguments take their declared types.

[section]
id = "cli.inline_import_head_slot_type"
name = "Inline-import literal heads against declared slot types"
description = "A literal through an inline `@import` head of another instance is rejected at each declared slot and operator operand: E0206, not a miscompile or ICE (RUE-2438, RUE-2439)."

[[case]]
name = "call_argument_of_another_module_instance_is_e0206"
description = "`take(@import(\"a.rue\").R(u64) { v: 3 })` into `take(p: b.R(u64))`, where b's `R` has four fields, is E0206 (was a segfault)."
compile_fail = true
error_contains = ["E0206", "type mismatch"]
files = [
    { path = "main.rue", source = """
const b = @import("b.rue");
fn take(p: b.R(u64)) -> i32 { @intCast((p.v + p.w + p.x + p.y) % 256) }
fn main() -> i32 { take(@import("a.rue").R(u64) { v: 3 }) }
""" },
    { path = "a.rue", source = """
pub fn R(comptime T: type) -> type { struct { v: T } }
""" },
    { path = "b.rue", source = """
pub fn R(comptime T: type) -> type { struct { v: T, w: T, x: T, y: T } }
""" },
]

