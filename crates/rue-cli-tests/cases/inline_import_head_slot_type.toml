# A value flowing into a declared-type slot is checked by its analyzed type
# (RUE-2438). An inline `@import("lib.rue").Box(i64) { .. }` head is one that
# inference does not reduce (RUE-2439): inference types the literal `<error>`,
# which unifies with any slot, while AIR emission reduces the head to the real
# `Box(i64)`. Call arguments, assignments, the tail result, array elements, and
# equality operands trusted inference, so a `Box(i64)` reached a `Box(i32)`
# slot: another module's four-field `R(u64)` passed for a one-field one read
# past the value and segfaulted, an assignment kept stale fields, and the other
# positions failed as E9000 or codegen ICEs. Each now reports E0206, the
# diagnostic a `let` annotation and a struct field already gave.
#
# A head through a re-exported callable alias (`facade.Box(u8)` with
# `pub const Box = boxes.Box;`) was another head the comptime engine did not
# reduce; it now resolves the alias as a runtime module-member call does, so
# the call's arguments take their declared types.

[section]
id = "cli.inline_import_head_slot_type"
name = "Inline-import literal heads against declared slot types"
description = "A literal whose inline `@import` head inference cannot reduce is checked against each declared slot by its analyzed type: E0206, not a miscompile or ICE (RUE-2438)."

[[case]]
name = "call_argument_of_another_module_instance_is_e0206"
description = "`take(@import(\"a.rue\").R(u64) { v: 3 })` into `take(p: b.R(u64))`, where b's `R` has four fields, is E0206 (was a segfault)."
compile_fail = true
error_contains = ["E0206", "type mismatch"]
files = [
    { path = "main.rue", source = """
const b = @import("b.rue");
fn take(p: b.R(u64)) -> i32 { @intCast((p.v + p.w + p.x + p.y) % 256) }
fn main() -> i32 { take(@import("a.rue").R(u64) { v: 3 }) }
""" },
    { path = "a.rue", source = """
pub fn R(comptime T: type) -> type { struct { v: T } }
""" },
    { path = "b.rue", source = """
pub fn R(comptime T: type) -> type { struct { v: T, w: T, x: T, y: T } }
""" },
]

[[case]]
name = "let_bound_call_argument_of_another_instance_is_e0206"
description = "`let x = @import(\"lib.rue\").Box(i64) { v: 7 }; take(x)` into `take(b: lib.Box(i32))` is E0206 (was accepted)."
compile_fail = true
error_contains = ["E0206", "expected Box(i32), found Box(i64)"]
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn take(b: lib.Box(i32)) -> i32 { b.v }
fn main() -> i32 { let x = @import("lib.rue").Box(i64) { v: 7 }; take(x) }
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
""" },
]

[[case]]
name = "method_argument_of_another_instance_is_e0206"
description = "A method's by-value argument takes the same check as a free function's (was accepted)."
compile_fail = true
error_contains = ["E0206", "expected Box(i32), found Box(i64)"]
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
struct H { k: i32, fn go(self, b: lib.Box(i32)) -> i32 { b.v + self.k } }
fn main() -> i32 { let h = H { k: 0 }; h.go(@import("lib.rue").Box(i64) { v: 7 }) }
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
""" },
]

[[case]]
name = "reexported_callable_alias_head_types_its_arguments"
description = "`facade.Box(u8).make(300)` through `pub const Box = boxes.Box;` reduces its head, so `300` is range-checked as `u8` (E0800); it used to default to `i32` and truncate to 44."
compile_fail = true
error_contains = ["E0800", "out of range for type 'u8'"]
files = [
    { path = "main.rue", source = """
const facade = @import("facade.rue");
fn main() -> i32 { let b = facade.Box(u8).make(300); @intCast(b.get()) }
""" },
    { path = "facade.rue", source = """
const boxes = @import("boxes.rue");
pub const Box = boxes.Box;
""" },
    { path = "boxes.rue", source = """
pub fn Box(comptime T: type) -> type {
    struct {
        v: T,
        fn make(v: T) -> Self { Self { v: v } }
        fn get(borrow self) -> T { self.v }
    }
}
""" },
]

