]

[[case]]
name = "same_instance_through_inline_head_still_runs"
description = "Control: a literal through the inline head still flows into same-instance argument, assignment, field, array, and result slots (exit 42)."
files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
struct H { b: lib.Box(i64) }
fn take(b: lib.Box(i64)) -> i64 { b.v }
fn mk() -> lib.Box(i64) { @import("lib.rue").Box(i64) { v: 10 } }
fn main() -> i32 {
    let mut p = lib.Box(i64) { v: 0 };
    p = @import("lib.rue").Box(i64) { v: 20 };
    let mut h = H { b: lib.Box(i64) { v: 0 } };
    h.b = @import("lib.rue").Box(i64) { v: 5 };
    let xs = [lib.Box(i64) { v: 0 }, @import("lib.rue").Box(i64) { v: 4 }];
    let t = take(@import("lib.rue").Box(i64) { v: 3 });
    @intCast(p.v + h.b.v + xs[1].v + t + mk().v)  // 20 + 5 + 4 + 3 + 10
}
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
""" },
]
exit_code = 42
