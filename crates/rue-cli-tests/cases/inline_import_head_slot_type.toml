files = [
    { path = "main.rue", source = """
const lib = @import("lib.rue");
fn main() -> i32 { let mut p = lib.Box(i32) { v: 1 }; p = @import("lib.rue").Box(i64) { v: 7 }; p.v }
""" },
    { path = "lib.rue", source = """
pub fn Box(comptime T: type) -> type { struct { v: T } }
""" },
]

