[package]
name = "rue-runtime"
edition.workspace = true
version.workspace = true

[lib]
# Build as a static library for linking with assembly runtime
crate-type = ["staticlib"]

[dependencies]
# No dependencies - we're no_std and self-contained

[features]
default = []

# Note: This crate is no_std and requires panic = "abort"
# which is set at the workspace level