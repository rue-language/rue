# Targeted diagnostics for common Rust-isms (RUE-133 item 9).
#
# `5 as i64` is valid Rust but not valid Rue; it used to die with a generic
# parse error ("expected semicolon after expression"). It now gets a targeted
# diagnostic that says what Rue offers instead.
#
# (0x/0b/0o integer literals used to live here as Rust-isms too; they are
# valid Rue syntax since RUE-177. Diagnostics for MALFORMED integer literals
# are in diagnostics/int_literals.toml.)

[section]
id = "diagnostics.rust_refugees"
name = "Rust-refugee diagnostics"
description = "Targeted errors for Rust-isms: `as` casts and `impl` blocks."

[[case]]
name = "as_cast_targeted_error"
description = """
RUE-133: `as` is an ordinary identifier in Rue, so `5 as i64` used to be a
generic "expected semicolon after expression" error pointing at the `5`. It
must name the missing operator and suggest the Rue alternatives.
"""
source = """
fn main() -> i32 {
    let x = 5 as i64;
    0
}
"""
compile_fail = true
error_contains = ["Rue has no 'as' cast operator", "@intCast", "let x: i64 = value"]

[[case]]
name = "as_cast_in_expression_statement"
source = """
fn main() -> i32 {
    5 as i64;
    0
}
"""
compile_fail = true
error_contains = ["Rue has no 'as' cast operator"]

[[case]]
name = "as_still_valid_as_identifier"
description = "`as` is NOT reserved; only `expr as ...` is special-cased."
source = """
fn main() -> i32 {
    let as = 40;
    as + 2
}
"""
exit_code = 42

[[case]]
name = "impl_block_hint"
description = """
RUE-19 item 4: `impl` is Rust muscle memory. Rue has no `impl` blocks. `impl` is
a reserved keyword (spec 2.4:2, RUE-331), so it reaches the parser as a dedicated
token and dies at item position with an opaque "expected item, found 'impl'". The
error must point the user at where methods actually go (inside the struct body).
"""
source = """
struct Block { x: i32 }
impl Block {
    fn foo(self) -> i32 { self.x }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["Rue has no `impl` blocks", "inside the struct body"]

[[case]]
name = "impl_reserved_as_identifier"
description = """
`impl` is a reserved keyword (spec 2.4:2, RUE-331): it can no longer be used as a
binding name. Even away from item position it is rejected, and the diagnostic
still offers the `impl`-block hint. (Reservation was chosen over unreserving so
that `impl` stays available for future trait support.)
"""
source = """
fn main() -> i32 {
    let impl = 42;
    impl
}
"""
compile_fail = true
error_contains = ["Rue has no `impl` blocks"]
