# Parser diagnostic wording (RUE-19).
#
# These pin the user-facing wording of common syntax errors: type-position
# expectations, the array-length position, the `self`-placement help, and that
# a `self` in the wrong place is reported exactly once (no cascading duplicate).
#
# They also pin RUE-19 item 1: the parser no longer emits the opaque catch-all
# "expected something else". A missing identifier now says `expected
# identifier`, a missing atom says `expected expression`, and the catch-all is
# dropped from any enumeration that already lists a concrete alternative.

[section]
id = "diagnostics.parser_messages"
name = "Parser diagnostic wording"
description = "Targeted wording for type-position, array-length, and self-placement syntax errors."

[[case]]
name = "type_position_names_type"
description = """
RUE-19: a non-type token in type position summarizes the whole type grammar as
`expected type` instead of enumerating raw first tokens (`'(' or '!' or '['`).
"""
source = """
fn foo() -> 123 { 0 }
"""
compile_fail = true
error_contains = ["expected type, found integer"]

[[case]]
name = "let_binding_bad_type_names_type"
source = """
fn main() -> i32 {
    let x: 99 = 5;
    0
}
"""
compile_fail = true
error_contains = ["expected type, found integer"]

[[case]]
name = "empty_array_length_named"
description = """
RUE-19: the array-length `select!` catch-all used to render the opaque
`expected something else`; it now names the array-length position.
"""
source = """
fn foo(a: [i32; ]) -> i32 { 0 }
"""
compile_fail = true
error_contains = ["expected array length"]

[[case]]
name = "self_not_first_parameter_help"
description = """
RUE-19: `self` after a regular parameter both keeps the E0100 wording and gains
a help pointing at the receiver rule. It must also be reported exactly once
(the duplicate cascading E0100 is deduped).
"""
source = """
struct Foo {
    fn bar(x: i32, self) -> i32 { x }
}
"""
compile_fail = true
error_contains = ["found 'self'", "methods take `self` as the first parameter"]

[[case]]
name = "missing_identifier_names_identifier"
description = """
RUE-19 item 1: `ident_parser` is a bare `select!` filter that used to render as
the opaque "expected something else". A directive name that is not an identifier
now reports `expected identifier` and never the catch-all.
"""
source = """
@ 3 struct Foo {}
"""
compile_fail = true
error_contains = ["expected identifier"]

[[case]]
name = "missing_expression_names_expression"
description = """
RUE-19 item 1: an atom position that starts with none of the literal/`self`/etc.
branches (all bare `select!` filters) now summarizes the whole atom grammar as
`expected ... or expression`, never the opaque "something else".
"""
source = """
fn main() -> i32 {
    let x = ;
    0
}
"""
compile_fail = true
error_contains = ["expression"]

[[case]]
name = "catch_all_dropped_beside_concrete"
description = """
RUE-19 item 1: when a concrete alternative is available (here the `drop`
keyword, valid as an intrinsic name after `@`), the useless "something else"
catch-all is dropped from the enumeration rather than shown alongside it.
"""
source = """
fn main() -> i32 {
    @ 4
}
"""
compile_fail = true
error_contains = ["expected identifier or 'drop'"]

# Type-position intrinsic arguments (RUE-788): `@size_of`, `@align_of`, and
# `@offset_of`'s first argument parse with the canonical type grammar, and an
# expression-shaped argument gets exactly one targeted diagnostic instead of
# drifting through expression parsing or item-level recovery.

[[case]]
name = "type_intrinsic_value_argument_names_type"
description = "A non-type token in a type-intrinsic argument reports the type expectation once, with no cascading directive re-parse error."
source = """
fn main() -> i32 {
    @size_of(1 + 2)
}
"""
compile_fail = true
expected_error = """
error: [E0100]: expected type, found integer
 --> test.rue:2:14
  |
2 |     @size_of(1 + 2)
  |              ^
  |
"""

[[case]]
name = "type_intrinsic_prefix_not_is_distinguished_from_never"
description = "`!x` in a type-intrinsic argument is called out as a prefix-not expression; a bare `!` remains the never type."
source = """
fn main() -> i32 {
    @size_of(!x)
}
"""
compile_fail = true
error_contains = ["prefix-not expression", "never type"]

[[case]]
name = "type_intrinsic_trailing_expression_is_targeted"
description = "A value expression that starts like a type (struct literal) is rejected with the type-position wording."
source = """
struct Point { x: i32 }
fn main() -> i32 {
    @align_of(Point { x: 1 })
}
"""
compile_fail = true
error_contains = ["`@align_of` takes a type in this argument position"]
