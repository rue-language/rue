[section]
id = "diagnostics.float-literals"
name = "Float literal diagnostics"
description = """
ADR-0065 (RUE-1068 through RUE-1072), stabilized in Phase 10. Two families live
here: the spelling rules for the literal itself (`.5` / `5.` / `1e`), which are
lexical or grammatical, and the typing rules a float literal is held to — its
contextual f32/f64 type, the finite-range rule, and the refusal to mix integer
and floating-point operands.
"""

[[case]]
name = "literal_reaches_scalar_codegen"
description = "The literal is typed and accepted by scalar code generation."
source = """
fn main() -> i32 {
    let x = 1.5;
    0
}
"""
exit_code = 0

[[case]]
name = "float_in_a_comptime_block_names_the_real_reason"
description = "A literal is the most compile-time-knowable thing there is; the comptime path must not blame constant-ness."
source = """
fn main() -> i32 {
    let x = comptime { 1.5 };
    0
}
"""
exit_code = 0

[[case]]
name = "float_as_a_call_argument"
description = "A comptime_float does not implicitly convert to an integer parameter."
source = """
fn f(a: i32) -> i32 { a }

fn main() -> i32 {
    let z = f(2.5);
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected comptime_float, found i32"]

[[case]]
name = "contextual_f32_reaches_typed_boundary"
source = """
fn value() -> f32 { 1.5 }
fn main() -> i32 { @float_to_int(value()) }
"""
exit_code = 1

[[case]]
name = "unconstrained_literal_defaults_to_f64"
description = "`2.0` has no context of its own, so it takes f64 (3.12:8) and orders above the f64 1.0."
source = """
fn explicit() -> f64 { 1.0 }
fn main() -> i32 { @total_cmp(2.0, explicit()) }
"""
exit_code = 1

[[case]]
name = "generic_anonymous_float_identity_is_preserved"
source = """
fn Box(comptime T: type) -> type { struct { value: T } }
fn read(boxed: Box(f64)) -> f64 { boxed.value }
fn main() -> i32 {
    let B = Box(f64);
    @float_to_int(read(B { value: 1.25 }))
}
"""
exit_code = 1

[[case]]
name = "integer_literal_is_admitted_by_float_context"
source = """
fn value() -> f64 { 42 }
fn main() -> i32 { @float_to_int(value()) }
"""
exit_code = 42

[[case]]
name = "integer_literals_are_admitted_by_each_direct_float_destination"
source = """
struct Holder { field: f32 }
fn take(value: f64) -> f64 { value }
fn value() -> f64 {
    let annotated: f32 = 1;
    let holder = Holder { field: 2 };
    take(3) + @float_cast(annotated) + @float_cast(holder.field)
}
fn main() -> i32 { @float_to_int(value()) }
"""
exit_code = 6

[[case]]
name = "finite_range_overflow_is_rejected_before_lowering"
source = """
fn value() -> f32 { 1e999999 }
fn main() -> i32 { @float_to_int(value()) }
"""
compile_fail = true
error_contains = ["E0206", "finite f32 literal"]

[[case]]
name = "float_remainder_names_the_workaround"
description = "Spec 3.12:25 — `%` has no float meaning; the diagnostic names the std.math.rem replacement."
source = """
fn value() -> f64 { 5.0 % 2.0 }
fn main() -> i32 { @float_to_int(value()) }
"""
compile_fail = true
error_contains = ["`%` is not defined on floats", "std.math.rem"]

[[case]]
name = "float_intrinsics_round_trip_an_integer"
source = """
fn main() -> i32 { @float_to_int(@int_to_float(1)) }
"""
exit_code = 1

[[case]]
name = "float_intrinsics_accept_their_typed_signatures"
source = """
fn source() -> f32 { @int_to_float(1) }
fn widened() -> f64 { @float_cast(source()) }
fn narrowed() -> f32 { @float_cast(widened()) }
fn main() -> i32 { @total_cmp(narrowed(), source()) + @float_to_int(widened()) }
"""
exit_code = 1

[[case]]
name = "float_intrinsic_wrong_count_is_clear"
source = "fn main() -> i32 { @float_to_int() }"
compile_fail = true
error_contains = ["E0701", "float_to_int", "expects 1 argument"]

[[case]]
name = "unsigned_float_to_int_is_lowered"
description = "`@float_to_int` takes an unsigned result type from context (3.12:17)."
source = "fn value() -> u32 { @float_to_int(1.0) }\nfn main() -> i32 { @intCast(value()) }"
exit_code = 1

[[case]]
name = "unsigned_int_to_float_is_lowered"
description = "`@int_to_float` accepts an unsigned operand (3.12:16)."
source = "fn value() -> f64 { let x: u32 = 1; @int_to_float(x) }\nfn main() -> i32 { @float_to_int(value()) }"
exit_code = 1

[[case]]
name = "total_cmp_requires_matching_float_widths"
source = """
fn a() -> f32 { 1.0 }
fn b() -> f64 { 1.0 }
fn main() -> i32 { @total_cmp(a(), b()) }
"""
compile_fail = true
error_contains = ["E0206", "expected f32, found f64"]

[[case]]
name = "imported_float_identity_reaches_the_same_boundary"
source = """
const dep = @import("dep.rue");
fn main() -> i32 { @float_to_int(dep.value()) }
"""
aux_files = { "dep.rue" = "pub fn value() -> f64 { 1.25 }\n" }
exit_code = 1

[[case]]
name = "leading_dot_names_the_replacement"
description = "ADR-0065 §3 rejects `.5`; the diagnostic spells the accepted form."
source = """
fn main() -> i32 {
    let x = .5;
    0
}
"""
compile_fail = true
error_contains = [
    "E0011",
    "floating-point literal cannot start with `.`: write `0.5` instead of `.5`",
]

[[case]]
name = "trailing_dot_names_the_replacement"
description = "ADR-0065 §3 rejects `5.` too — reported by the parser, since `5.` is also the prefix of `5.to_string()`."
source = """
fn main() -> i32 {
    let x = 5.;
    0
}
"""
compile_fail = true
error_contains = [
    "E0011",
    "floating-point literal cannot end with `.`: write `5.0` instead of `5.`",
]

[[case]]
name = "trailing_dot_on_float_names_the_float_without_the_dot"
description = "A float base such as `5.5` keeps its valid spelling when the parser rejects an extra trailing dot."
source = """
fn main() -> i32 {
    let x = 5.5.;
    0
}
"""
compile_fail = true
error_contains = [
    "E0011",
    "floating-point literal cannot end with `.`: write `5.5` instead of `5.5.`",
]

[[case]]
name = "empty_exponent_names_the_literal"
description = "`1e` is diagnosed as one malformed literal rather than an integer abutting an identifier."
source = """
fn main() -> i32 {
    let x = 1e;
    0
}
"""
compile_fail = true
error_contains = [
    "E0011",
    "missing digits in the exponent of floating-point literal `1e`",
]

[[case]]
name = "mixed_integer_and_float_literals_do_not_coerce_through_operators"
source = """
fn main() -> i32 {
    let a = 1 + 2.0;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected f32 or f64, found i32"]

[[case]]
name = "mixed_integer_and_float_literals_do_not_subtract"
source = "fn main() -> i32 { let value = 1 - 2.0; 0 }"
compile_fail = true
error_contains = ["E0206", "expected f32 or f64, found i32"]

[[case]]
name = "mixed_integer_and_float_literals_do_not_multiply"
source = "fn main() -> i32 { let value = 1 * 2.0; 0 }"
compile_fail = true
error_contains = ["E0206", "expected f32 or f64, found i32"]

[[case]]
name = "mixed_integer_and_float_literals_do_not_divide"
source = "fn main() -> i32 { let value = 1 / 2.0; 0 }"
compile_fail = true
error_contains = ["E0206", "expected f32 or f64, found i32"]

[[case]]
name = "mixed_integer_and_float_literals_do_not_order"
source = "fn main() -> i32 { let value = 1 < 2.0; 0 }"
compile_fail = true
error_contains = ["E0206", "expected f32 or f64, found i32"]

[[case]]
name = "mixed_integer_and_float_literals_do_not_compare_for_equality"
source = "fn main() -> i32 { let value = 1 == 2.0; 0 }"
compile_fail = true
error_contains = ["E0206", "expected f32 or f64, found i32"]

[[case]]
name = "mixed_integer_and_float_literals_do_not_take_remainder"
source = "fn main() -> i32 { let value = 1 % 2.0; 0 }"
compile_fail = true
error_contains = ["E0206", "expected f32 or f64, found i32"]

[[case]]
name = "named_and_imported_float_constants_keep_their_exact_value"
description = "`1.500` and `15e-1` are the same f64 across a module boundary: every ordering is equal."
source = """
const local: f64 = 1.500;
const rounded: f64 = 1.5;
const dep = @import("dep.rue");
fn value() -> f64 { local }
fn main() -> i32 { @total_cmp(value(), dep.value()) + @total_cmp(rounded, dep.value()) }
"""
aux_files = { "dep.rue" = "pub const exact: f64 = 15e-1;\npub fn value() -> f64 { exact }\n" }
exit_code = 0

[[case]]
name = "comptime_float_named_constant_is_rejected"
description = "The `comptime_float` spelling of the constant above names a type no program may write (3.12:3); it must be a diagnostic, never a silently zeroed value."
source = """
const B: comptime_float = 1.5;
fn take(v: f64) -> f64 { v }
fn value() -> f64 { B }
fn main() -> i32 { @dbg(value()); @dbg(take(B)); 0 }
"""
compile_fail = true
error_contains = ["E0204", "unknown type 'comptime_float'"]

[[case]]
name = "comptime_float_specialization_parameter_is_rejected"
description = "The `comptime_float` spelling of a comptime float parameter is refused at its declaration instead of reaching the specialization's call ABI."
source = """
fn materialize(comptime value: comptime_float) -> f64 { value }
fn main() -> i32 { @float_to_int(materialize(1.5)) }
"""
compile_fail = true
error_contains = ["E0204", "unknown type 'comptime_float'"]

[[case]]
name = "unannotated_float_constant_suggests_a_width"
description = "E0475's suggestion must name a type the program may write: `f64`, the no-context width of 3.12:8, not the unnameable `comptime_float`."
source = """
const B = 1.5;
fn main() -> i32 { @float_to_int(B) }
"""
compile_fail = true
error_contains = ["E0475", "`const B: f64 = ...;`"]

[[case]]
name = "captured_comptime_float_takes_its_width_from_use"
description = "A captured comptime float carries only its decimal spelling, so it contextualizes at each use exactly as a captured integer does (RUE-216's float mirror); it used to reach codegen as the comptime_float zero placeholder."
source = """
fn Box(comptime value: f64) -> type {
    struct {
        tag: i32,
        fn scaled(self) -> i32 { @float_to_int(value * 100.0) }
        fn big(self) -> bool { value > 1.0 }
    }
}
fn main() -> i32 {
    let B = Box(1.5);
    let b: B = B { tag: 7 };
    @dbg(b.scaled());
    @dbg(b.big());
    0
}
"""
expected_stdout = "150\ntrue\n"
exit_code = 0

[[case]]
name = "float_specializations_preserve_exact_identity"
description = "`1.0`, `01.00e0` and `100e-2` are one comptime float value, so they select one specialization; `1.01` selects another."
source = """
fn materialize(comptime value: f64) -> f64 { value }
fn Box(comptime value: f64) -> type { struct { field: f64 } }
fn main() -> i32 {
    let A = Box(1.0);
    let A2 = Box(01.00e0);
    let B = Box(1.01);
    let a: A = A2 { field: materialize(100e-2) };
    let b: B = B { field: materialize(1.01) };
    @total_cmp(a.field, b.field)
}
"""
exit_code = 255

[[case]]
name = "negative_float_literals_and_negative_zero_are_lowered"
description = "`-1.5` orders below `-0.0` in the total order, and `-0.0` truncates to zero."
source = """
fn a() -> f32 { -0.0 }
fn b() -> f64 { -1.5 }
fn main() -> i32 { @total_cmp(b(), -0.0) + @float_to_int(a()) }
"""
exit_code = 255

[[case]]
name = "diverging_operands_propagate_through_every_float_intrinsic"
source = """
fn f32_value() -> f32 { 1.0 }
fn f64_value() -> f64 { 1.0 }
fn a() -> f32 { @int_to_float(@panic("x")) }
fn b() -> i32 { @float_to_int(@panic("x")) }
fn c() -> f64 { @float_cast(@panic("x")) }
fn d() -> i32 { @total_cmp(@panic("x"), f32_value()) }
fn e() -> i32 { @total_cmp(f64_value(), @panic("x")) }
fn main() -> i32 {
    let n = @random_u32();
    if n == 0 { @float_to_int(a()) }
    else if n == 1 { b() }
    else if n == 2 { @float_to_int(c()) }
    else if n == 3 { d() }
    else { e() }
}
"""
runtime_error = "x"

[[case]]
name = "total_cmp_result_is_the_canonical_i32"
source = """
fn value() -> f64 { 1.0 }
fn main() -> i32 {
    let order: i32 = @total_cmp(value(), value());
    order
}
"""
exit_code = 0

[[case]]
name = "unused_float_function_signature_compiles"
source = """
fn unused(value: f32) -> f64 { value }
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "unused_float_generic_signature_compiles"
source = """
fn unused(comptime T: type, value: f32) -> T { @panic("unused") }
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "unused_float_struct_field_compiles"
source = """
struct Holder { field: f32 }
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "unused_float_type_alias_compiles"
source = """
const Alias: type = f64;
fn main() -> i32 { 0 }
"""
exit_code = 0

[[case]]
name = "unused_imported_float_signature_compiles"
source = """
const dep = @import("dep.rue");
fn main() -> i32 { 0 }
"""
aux_files = { "dep.rue" = "pub fn unused(value: f32) -> f64 { value }\n" }
exit_code = 0
