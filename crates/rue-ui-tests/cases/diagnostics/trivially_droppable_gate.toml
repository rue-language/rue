[section]
id = "diagnostics.trivially-droppable-gate"
name = "By-copy element read gate (E0711)"
description = """
An owning container's by-copy read (`ArrayBuf(T)::get`/`get_or`, RUE-651) copies
the element out with `@ptr_read` while the stored slot stays live. For a `T` with
drop glue that copy would alias the element's owned resources — both the copy and
the slot run drop glue at scope exit, a double-free. `@require_trivially_droppable(T)`
in the reader's body rejects those reads (E0711), directing the caller to `get_ref`
for an in-place read or `pop`
(which moves the element, leaving one owner). Because the gate lives in the method
body, demand-driven analysis (ADR-0045) fires it only when a by-copy read is
actually called — storing/pushing/popping/dropping a drop-glue element stays legal
(RUE-646). Mirrors Swift's rule that a non-copyable element cannot use a by-value
`get` subscript. These cases use a self-contained minimal container so the gate is
tested independent of the std `ArrayBuf` source.
"""

[[case]]
name = "e0711_drop_glue_element_read_rejected"
description = "Calling a by-copy read whose element type has drop glue is rejected with E0711 and pointed at `get_ref` or `pop`."
source = """
struct D { v: i32 }
drop fn D(self) {}
fn Reader(comptime T: type) -> type {
    struct {
        x: T,
        fn first(borrow self) -> T {
            @require_trivially_droppable(T);
            self.x
        }
    }
}
fn main() -> i32 {
    let R = Reader(D);
    let r = R { x: D { v: 5 } };
    let _ = r.first();
    0
}
"""
compile_fail = true
error_contains = [
    "E0711",
    "cannot read an element of type `D` by copy",
    "use `get_ref` for an in-place read, or move it out with `pop`/`pop_or`",
]

[[case]]
name = "e0711_copy_element_read_compiles"
description = "The same by-copy read compiles and runs for a trivially-droppable (Copy) element type."
source = """
fn Reader(comptime T: type) -> type {
    struct {
        x: T,
        fn first(borrow self) -> T {
            @require_trivially_droppable(T);
            self.x
        }
    }
}
fn main() -> i32 {
    let R = Reader(i32);
    let r = R { x: 42 };
    @intCast(r.first())
}
"""
compile_fail = false
exit_code = 42

[[case]]
name = "drop_glue_element_stored_but_unread_compiles"
description = "Storing a drop-glue element is legal (RUE-646); the read gate is dormant until a by-copy read is actually called (demand-driven, ADR-0045)."
source = """
struct D { v: i32 }
drop fn D(self) {}
fn Reader(comptime T: type) -> type {
    struct {
        x: T,
        fn first(borrow self) -> T {
            @require_trivially_droppable(T);
            self.x
        }
    }
}
fn main() -> i32 {
    let R = Reader(D);
    let r = R { x: D { v: 5 } };
    7
}
"""
compile_fail = false
exit_code = 7

[[case]]
name = "deferred_named_struct_late_destructor_is_rejected"
description = "A declaration-time gate defers a named struct until its later destructor declaration has been installed."
source = """
struct D { v: i32 }
fn Gated(comptime T: type) -> type {
    @require_trivially_droppable(T);
    struct { y: T }
}
const G = Gated(D);
drop fn D(self) {}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0711", "D"]

[[case]]
name = "deferred_named_enum_without_drop_glue_compiles"
description = "A declaration-time drop-glue query resolves negative after a named enum's primitive payload is complete."
source = """
enum Maybe { Some(i32), None }
fn Gated(comptime T: type) -> type {
    @require_trivially_droppable(T);
    struct { y: T }
}
const G = Gated(Maybe);
fn main() -> i32 { 0 }
"""
compile_fail = false
exit_code = 0

[[case]]
name = "zero_drop_array_is_trivially_droppable"
description = "A zero-length array has no elements to drop, so the trivially-droppable gate accepts it."
source = """
struct D { v: i32 }
drop fn D(self) {}
fn Gated(comptime T: type) -> type {
    @require_trivially_droppable(T);
    struct { y: T }
}
const G = Gated([D; 0]);
fn main() -> i32 { 0 }
"""
compile_fail = false
exit_code = 0
