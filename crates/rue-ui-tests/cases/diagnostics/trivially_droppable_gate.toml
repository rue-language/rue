[[case]]
name = "reachable_named_outer_is_rejected_during_binding"
description = "Binding-time ownership uses transitive drop facts for a named outer aggregate."
source = """
struct D { v: i32 }
drop fn D(self) {}
struct Outer { d: D }
fn Reader(comptime T: type) -> type {
    struct { x: T, fn first(borrow self) -> T { @require_trivially_droppable(T); self.x } }
}
fn main() -> i32 {
    let R = Reader(Outer);
    let r = R { x: Outer { d: D { v: 1 } } };
    let _ = r.first();
    0
}
"""
compile_fail = true
error_contains = ["E0711", "Outer"]

[[case]]
name = "reachable_anonymous_explicit_destructor_is_rejected_during_binding"
description = "Binding-time ownership recognizes an anonymous destructor even without droppable fields."
source = """
fn Owner() -> type { struct { drop fn(self) {} } }
fn Reader(comptime T: type) -> type {
    struct { x: T, fn first(borrow self) -> T { @require_trivially_droppable(T); self.x } }
}
fn main() {
    let O = Owner();
    let R = Reader(O);
    let r = R { x: O {} };
    let _ = r.first();
}
"""
compile_fail = true
error_contains = ["E0711", "Owner"]

