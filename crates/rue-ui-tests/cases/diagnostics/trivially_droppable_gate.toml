[[case]]
name = "anonymous_associated_drop_lookalike_is_trivial"
description = "An associated function named __drop has no receiver and cannot counterfeit a destructor."
source = """
fn Plain() -> type { struct { fn __drop() {} } }
fn Gated(comptime T: type) -> type { @require_trivially_droppable(T); struct { x: T } }
const P = Plain();
const G = Gated(P);
fn main() {}
"""
compile_fail = false
exit_code = 0

