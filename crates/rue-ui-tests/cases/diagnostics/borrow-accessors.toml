[section]
id = "diagnostics.borrow-accessors"
name = "Borrow accessor diagnostics"
description = "Provider-path accessor calls retain their second-class place diagnostics."

[[case]]
name = "returned_accessor_result_names_method_and_root"
source = """
struct P {
    x: i64,

    fn xr(borrow self) -> borrow i64 {
        yield self.x;
    }
}
fn read(borrow p: P) -> i64 {
    return p.xr();
}
fn main() -> i32 {
    let p = P { x: 1 };
    @intCast(read(borrow p))
}
"""
compile_fail = true
error_contains = ["E0250", "cannot return an accessor result", "`xr`", "`p`"]

[[case]]
name = "uncalled_accessor_body_exit_names_the_offending_form"
description = "The declaration-seam E0254 names which exit bypasses the trailing `yield`, since it has no body analysis to anchor a note to."
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> borrow i64 {
        yield self.x;
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "E0254",
    "a second `yield`",
    "guards may only diverge or fall through to the trailing `yield`",
]

[[case]]
name = "uncalled_accessor_yield_root_names_the_offending_root"
description = "The declaration-seam E0255 names the root the body actually yielded from."
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self, other: i64) -> borrow i64 {
        yield other;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0255", "place rooted at `self`", "`other`"]

[[case]]
name = "mutable_accessor_requires_exact_receiver_pair"
description = "Mutable accessor diagnostics identify the required inout self/result pairing."
source = """
struct P {
    x: i64,

    @allow(unused_function)
    fn xr(borrow self) -> inout i64 {
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0257", "inout self", "-> inout"]

[[case]]
name = "mutable_accessor_rejects_immutable_receiver"
description = "An exclusive accessor cannot be called through an immutable binding."
source = """
struct P {
    x: i64,
    fn xr(inout self) -> inout i64 { yield self.x; }
}
fn main() -> i32 {
    let p = P { x: 1 };
    p.xr() = 2;
    0
}
"""
compile_fail = true
error_contains = ["E0203"]

[[case]]
name = "mutable_accessor_result_cannot_escape"
description = "An exclusive accessor result remains expression-scoped and cannot be returned."
source = """
struct P {
    x: i64,
    fn xr(inout self) -> inout i64 { yield self.x; }
}
fn read(inout p: P) -> i64 {
    return p.xr();
}
fn main() -> i32 {
    let mut p = P { x: 1 };
    read(inout p);
    0
}
"""
compile_fail = true
error_contains = ["E0250", "cannot return an accessor result"]

[[case]]
name = "mutable_accessor_double_value_use_conflicts"
description = "Two exclusive accessor results rooted at one receiver conflict in ordinary value position."
source = """
struct V {
    cells: [i64; 2],
    fn get_mut(inout self, i: u64) -> inout i64 { yield self.cells[i]; }
}
fn main() -> i32 {
    let mut v = V { cells: [1, 2] };
    let _ = v.get_mut(0) + v.get_mut(1);
    0
}
"""
compile_fail = true
error_contains = ["E0259", "accessor result"]

[[case]]
name = "mutable_accessor_invalid_body"
description = "An exclusive accessor body must yield exactly one place rooted at self."
source = """
struct P {
    x: i64,
    fn xr(inout self) -> inout i64 {
        self.x = 2;
        yield self.x;
        yield self.x;
    }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0254", "second `yield`"]
