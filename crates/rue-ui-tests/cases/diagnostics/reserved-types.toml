[section]
id = "diagnostics.reserved-types"
name = "Ordinary Type Names"
description = "Standard-library type spellings are not globally reserved."

# =============================================================================
# Reserved Type Names
# =============================================================================

[[case]]
name = "struct_named_strbuf_is_allowed"
source = """
struct StrBuf {
    data: i32,
}

fn main() -> i32 {
    StrBuf { data: 7 }.data
}
"""
exit_code = 7

[[case]]
name = "enum_named_strbuf_is_allowed"
source = """
enum StrBuf {
    Empty,
    Full,
}

fn main() -> i32 {
    match StrBuf.Full { StrBuf.Empty => 0, StrBuf.Full => 8 }
}
"""
exit_code = 8
