[section]
id = "diagnostics.inference_recovery"
name = "Inference Recovery"
description = "A body's independent inference failures are reported beside its semantic errors in source order, without cascades from failed or recovery-typed bindings (RUE-2614)."

[[case]]
name = "arity_error_then_inference_mismatch_both_reported"
description = "An arity error stops its statement, and the independent type mismatch in the next statement is still reported after it."
source = """
fn f(a: i32) -> i32 { a }
fn main() -> i32 { let x = f(1, 2); let z: bool = 1; 0 }
"""
compile_fail = true
expected_error = """
error: [E0207]: expected 1 argument, found 2
 --> test.rue:2:28
  |
2 | fn main() -> i32 { let x = f(1, 2); let z: bool = 1; 0 }
  |                            ^^^^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:37
  |
2 | fn main() -> i32 { let x = f(1, 2); let z: bool = 1; 0 }
  |                                     ^^^^^^^^^^^^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "inference_mismatch_then_arity_error_both_reported"
description = "A type mismatch found by inference is reported at its statement, and analysis continues to the arity error after it."
source = """
fn f(a: i32) -> i32 { a }
fn main() -> i32 { let z: bool = 1; let x = f(1, 2); 0 }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:20
  |
2 | fn main() -> i32 { let z: bool = 1; let x = f(1, 2); 0 }
  |                    ^^^^^^^^^^^^^^^^
  |
error: [E0207]: expected 1 argument, found 2
 --> test.rue:2:45
  |
2 | fn main() -> i32 { let z: bool = 1; let x = f(1, 2); 0 }
  |                                             ^^^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "two_inference_mismatches_both_reported"
description = "Two independent mismatches in one body are both reported, in source order."
source = """
fn main() -> i32 { let y: bool = 2; let z: bool = 1; 0 }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:1:20
  |
1 | fn main() -> i32 { let y: bool = 2; let z: bool = 1; 0 }
  |                    ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:1:37
  |
1 | fn main() -> i32 { let y: bool = 2; let z: bool = 1; 0 }
  |                                     ^^^^^^^^^^^^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "comptime_failure_then_inference_mismatch_both_reported"
description = "A comptime evaluation failure at a call stops its statement, and the independent mismatch after it is still reported."
source = """
fn Bad() -> type { Bad() }
fn main() -> i32 { Bad(); let z: bool = 1; 0 }
"""
compile_fail = true
expected_error = """
error: [E1200]: comptime evaluation failed: specialization of 'Bad' depends on its own result: reducing this call with these compile-time arguments requires that same call, so the recursion has no base case to start from
 --> test.rue:2:20
  |
2 | fn main() -> i32 { Bad(); let z: bool = 1; 0 }
  |                    ^^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:27
  |
2 | fn main() -> i32 { Bad(); let z: bool = 1; 0 }
  |                           ^^^^^^^^^^^^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "inference_mismatch_then_comptime_failure_both_reported"
description = "A mismatch found by inference is reported before the comptime evaluation failure at a later call."
source = """
fn Bad() -> type { Bad() }
fn main() -> i32 { let z: bool = 1; Bad(); 0 }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:20
  |
2 | fn main() -> i32 { let z: bool = 1; Bad(); 0 }
  |                    ^^^^^^^^^^^^^^^^
  |
error: [E1200]: comptime evaluation failed: specialization of 'Bad' depends on its own result: reducing this call with these compile-time arguments requires that same call, so the recursion has no base case to start from
 --> test.rue:2:37
  |
2 | fn main() -> i32 { let z: bool = 1; Bad(); 0 }
  |                                     ^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "failed_binding_read_by_later_mismatch_is_not_reported_again"
description = "A statement that reads a binding whose initializer failed is poisoned, not reported."
source = """
fn main() -> i32 { let y: bool = 2; let z: i32 = y; 0 }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:1:20
  |
1 | fn main() -> i32 { let y: bool = 2; let z: i32 = y; 0 }
  |                    ^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "binding_typed_by_recovery_keeps_its_reader_reported"
description = "A binding whose type only the failed constraint decided is poisoned silently, so the statement whose failure decided it is still reported, and so is a later independent mismatch."
source = """
fn main() -> i32 { let w = 5; let z: bool = w; let y: bool = 2; 0 }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:1:31
  |
1 | fn main() -> i32 { let w = 5; let z: bool = w; let y: bool = 2; 0 }
  |                               ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:1:48
  |
1 | fn main() -> i32 { let w = 5; let z: bool = w; let y: bool = 2; 0 }
  |                                                ^^^^^^^^^^^^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "literal_class_poisoned_by_failed_assignment_reports_only_the_assignment"
description = "A literal whose class a failed assignment joined is not checked against the recovery type, and the later reader of the binding is not reported."
source = """
fn main() -> i32 { let mut a = 1; a = true; let b: bool = a; 0 }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected integer type, found bool
 --> test.rue:1:39
  |
1 | fn main() -> i32 { let mut a = 1; a = true; let b: bool = a; 0 }
  |                                       ^^^^
  |
"""

[[case]]
name = "arity_failed_binding_read_by_later_mismatch_is_not_reported"
description = "A mismatch that reads the binding of a statement which stopped with an arity error is suppressed with that binding."
source = """
fn f(a: i32) -> i32 { a }
fn main() -> i32 { let x = f(1, 2); let z: bool = x; 0 }
"""
compile_fail = true
expected_error = """
error: [E0207]: expected 1 argument, found 2
 --> test.rue:2:28
  |
2 | fn main() -> i32 { let x = f(1, 2); let z: bool = x; 0 }
  |                            ^^^^^^^
  |
"""

[[case]]
name = "if_initializer_reports_the_branch_mismatch_not_the_annotation"
description = "Inside one statement the first failure in constraint order is the cause; the let's annotation mismatch it induced is not reported."
source = """
fn main() -> i32 {
    let x: i32 = if true { true } else { 1 };
    x
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:42
  |
2 |     let x: i32 = if true { true } else { 1 };
  |                                          ^
  |
"""

[[case]]
name = "match_initializer_reports_the_arm_mismatch_not_the_annotation"
description = "The arm mismatch is reported, not the annotation mismatch it caused."
source = """
fn main() -> i32 {
    let n = 3;
    let x: u8 = match n { 0 => true, _ => 1 };
    0
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:3:43
  |
3 |     let x: u8 = match n { 0 => true, _ => 1 };
  |                                           ^
  |
"""

[[case]]
name = "block_initializer_reports_the_inner_mismatch_not_the_annotation"
description = "The inner let's mismatch is reported, not the annotation mismatch of the enclosing let."
source = """
fn main() -> i32 {
    let x: u8 = { let t: bool = 1; t };
    0
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:19
  |
2 |     let x: u8 = { let t: bool = 1; t };
  |                   ^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "array_initializer_reports_the_element_not_the_let"
description = "An array element mismatch points at the element."
source = """
fn main() -> i32 {
    let x: [u8; 2] = [true, 1];
    0
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected u8, found bool
 --> test.rue:2:23
  |
2 |     let x: [u8; 2] = [true, 1];
  |                       ^^^^
  |
"""

[[case]]
name = "comparison_initializer_reports_only_the_operand_mismatch"
description = "A comparison's operand mismatch is reported alone; the bool result's mismatch with the annotation follows from it."
source = """
fn main() -> i32 {
    let x: u8 = (1 == true);
    0
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected integer type, found bool
 --> test.rue:2:23
  |
2 |     let x: u8 = (1 == true);
  |                       ^^^^
  |
"""

[[case]]
name = "arity_stop_keeps_a_later_mismatch_over_a_recovery_typed_binding"
description = "After an arity error stops the body, a later mismatch is still reported when the binding it reads was poisoned only because of that mismatch."
source = """
fn f(a: i32) -> i32 { a }
fn main() -> i32 { let w = 5; let x = f(1, 2); let z: bool = w; 0 }
"""
compile_fail = true
expected_error = """
error: [E0207]: expected 1 argument, found 2
 --> test.rue:2:39
  |
2 | fn main() -> i32 { let w = 5; let x = f(1, 2); let z: bool = w; 0 }
  |                                       ^^^^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:48
  |
2 | fn main() -> i32 { let w = 5; let x = f(1, 2); let z: bool = w; 0 }
  |                                                ^^^^^^^^^^^^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "staged_if_on_comptime_parameter_reports_each_independent_error"
description = "In a body specialized on a comptime parameter, an `if` on it does not stop the body at its first error: the mismatches before, inside each selected arm, and after it are all reported, each once across the two specializations."
source = """
fn g(comptime n: i32) -> i32 {
    let a: bool = 1;
    if n > 0 { let q: bool = 2; } else { let r: bool = 3; }
    let b: u8 = true;
    n
}
fn main() -> i32 { g(1) + g(0) }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:5
  |
2 |     let a: bool = 1;
  |     ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:3:16
  |
3 |     if n > 0 { let q: bool = 2; } else { let r: bool = 3; }
  |                ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:3:42
  |
3 |     if n > 0 { let q: bool = 2; } else { let r: bool = 3; }
  |                                          ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected u8, found bool
 --> test.rue:4:5
  |
4 |     let b: u8 = true;
  |     ^^^^^^^^^^^^^^^^^
  |
error: aborting due to 4 previous errors
"""

[[case]]
name = "staged_selected_body_with_a_nested_selector_reports_each_independent_error"
description = "A selected arm that itself selects reports its own mismatch beside the body's others; the arm its nested `if` does not select is not analyzed."
source = """
fn g(comptime n: i32) -> i32 {
    let a: bool = 1;
    if n > 0 {
        let q: bool = 2;
        if n > 1 { let z: u8 = true; }
    }
    let b: u8 = true;
    n
}
fn main() -> i32 { g(1) }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:5
  |
2 |     let a: bool = 1;
  |     ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:4:9
  |
4 |         let q: bool = 2;
  |         ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected u8, found bool
 --> test.rue:7:5
  |
7 |     let b: u8 = true;
  |     ^^^^^^^^^^^^^^^^^
  |
error: aborting due to 3 previous errors
"""

[[case]]
name = "staged_match_on_comptime_parameter_reports_each_independent_error"
description = "A `match` on a comptime parameter reports the selected arm's mismatch beside a later one."
source = """
fn g(comptime n: i32) -> i32 {
    match n {
        1 => { let q: bool = 2; },
        _ => { },
    }
    let b: u8 = true;
    n
}
fn main() -> i32 { g(1) }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:3:16
  |
3 |         1 => { let q: bool = 2; },
  |                ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected u8, found bool
 --> test.rue:6:5
  |
6 |     let b: u8 = true;
  |     ^^^^^^^^^^^^^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "staged_selected_mismatch_follows_an_undefined_variable"
description = "A staged body reports a semantic error before an `if` on its comptime parameter and the selected arm's mismatch."
source = """
fn g(comptime n: i32) -> i32 {
    let a: i32 = nope;
    if n > 0 { let q: bool = 2; }
    n
}
fn main() -> i32 { g(1) }
"""
compile_fail = true
expected_error = """
error: [E0201]: undefined variable 'nope'
 --> test.rue:2:18
  |
2 |     let a: i32 = nope;
  |                  ^^^^
  |
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:3:16
  |
3 |     if n > 0 { let q: bool = 2; }
  |                ^^^^^^^^^^^^^^^^
  |
error: aborting due to 2 previous errors
"""

[[case]]
name = "staged_selected_arm_reading_a_failed_binding_is_silent"
description = "A selected arm that reads a binding whose initializer failed reports nothing of its own, as in a body that is not staged."
source = """
fn g(comptime n: i32) -> i32 {
    let a: bool = 1;
    if n > 0 { let q: u8 = a; }
    n
}
fn main() -> i32 { g(1) }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:5
  |
2 |     let a: bool = 1;
  |     ^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "specializations_report_a_shared_mistake_once"
description = "Two specializations of one body report a mistake outside any comptime selection once."
source = """
fn g(comptime n: i32) -> i32 {
    let a: bool = 1;
    let b: u8 = true;
    n
}
fn main() -> i32 { g(1) + g(0) }
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:2:5
  |
2 |     let a: bool = 1;
  |     ^^^^^^^^^^^^^^^^
  |
error: [E0206]: type mismatch: expected u8, found bool
 --> test.rue:3:5
  |
3 |     let b: u8 = true;
  |     ^^^^^^^^^^^^^^^^^
  |
error: aborting due to 2 previous errors
"""
