[section]
id = "diagnostics.never_place_join"
name = "Joins with a continuing !-typed place"
description = """
An `if` or `match` arm that reads a `!`-typed place (`let v = return 5`, a `!`
parameter or field) continues, so the join does not drop it as a diverging arm:
it binds the join's result to `!`, and a peer of any concrete type is a
mismatch at the later arm. Whether such an arm should instead coerce to its
peer's type (3.4:4) is an open question (RUE-2561); this pins the current
diagnostic.
"""

# Open question, RUE-2561: should a continuing `!`-typed place arm coerce at
# an if/match join? Until it is decided, a string literal peer is rejected
# like every other concrete type (`if c { v } else { true }` is the same
# E0206). Base accepted the string form only because a string literal could
# take `!` (RUE-2559 removed that exemption).
[[case]]
name = "string_literal_beside_a_never_typed_local_arm"
description = "The `!`-typed local `v` is a continuing arm, so the string literal arm meets `!`."
source = """
fn f(c: bool) -> i32 {
    let v = return 5;
    let _s = if c { v } else { "x" };
    0
}
fn main() -> i32 { f(true) }
"""
compile_fail = true
expected_error_code = "E0206"
expected_error = """
error: [E0206]: type mismatch: expected !, found str
 --> test.rue:3:32
  |
3 |     let _s = if c { v } else { "x" };
  |                                ^^^
  |
"""
