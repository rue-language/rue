[section]
id = "diagnostics.error-spans"
name = "Error Span Precision"
description = "Tests that error messages point to the precise location of errors."

# =============================================================================
# Match Pattern Type Mismatch Errors
# =============================================================================

# These tests verify that pattern type mismatch errors point to the specific
# pattern, not the entire match expression.

[[case]]
name = "pattern_type_mismatch_int_vs_bool"
source = """
fn main() -> i32 {
    match 1 {
        true => 10,
        _ => 0,
    }
}
"""
compile_fail = true
# Points at the offending `true` pattern: the integer-literal scrutinee can
# never have type bool, and the error should blame the pattern that demanded
# it, not the scrutinee (RUE-133).
error_contains = ["3:9", "expected integer type, found bool"]

[[case]]
name = "pattern_type_mismatch_bool_vs_int"
source = """
fn main() -> i32 {
    match true {
        42 => 10,
        _ => 0,
    }
}
"""
compile_fail = true
error_contains = "3:9"

# =============================================================================
# For-loop iterable errors
# =============================================================================

[[case]]
name = "for_iterable_type_error_points_at_iterable"
source = """
fn main() -> i32 {
    let notiter: i32 = 5;
    for x in notiter {
        let y = x;
    }
    0
}
"""
compile_fail = true
# The not-iterable error anchors on the iterable subexpression (`notiter` at
# 3:14), not the whole `for` statement: the desugared @__rue_iter_len intrinsic
# carries the iterable's span (rue-rir component review, 2026-07-04).
error_contains = ["3:14", "expected an array or a StrBuf, found i32"]

# Struct field mismatches use the value expression's span, including when the
# value is a nested expression and the mismatching field is not first. This
# keeps the primary diagnostic useful instead of pointing at the whole literal
# (RUE-1640).
[[case]]
name = "struct_field_type_mismatch_points_at_value_expression"
source = """
struct Pair { left: i32, right: bool }
fn id(n: i32) -> i32 { n }

fn main() -> i32 {
    let x: i32 = 1;
    Pair { left: 1, right: id(x) }
}
"""
compile_fail = true
error_contains = ["6:28", "expected bool, found i32"]

[[case]]
name = "struct_field_sema_mismatch_label_points_at_value"
source = """
struct Record { text: str }
fn main() -> i32 {
    let x: i32 = 1;
    let r = Record { text: x };
    0
}
"""
compile_fail = true
error_contains = ["4:28", "field 'text' expects type str", "expected str, found i32"]

# =============================================================================
# Signature type errors
# =============================================================================

# A type written in a signature is resolved once, per written type, by the
# declaration-level type machine. That resolver knows which parameter (or the
# result) it is resolving, and it is the only place that knows; the stable
# failure now carries that position, so the diagnostic lands on the type
# instead of on the whole declaration (RUE-2161).

[[case]]
name = "unknown_parameter_type_points_at_the_type"
source = """
fn f(borrow p: Nope) -> i32 { 0 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["1:16", "unknown type 'Nope'"]

[[case]]
name = "unknown_parameter_type_constructor_points_at_the_application"
source = """
fn f(borrow p: Nope(i32)) -> i32 { 0 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["1:16", "unknown type 'Nope(...)'"]

[[case]]
name = "unknown_result_type_points_at_the_result_type"
source = """
fn f(p: i32) -> Nope(i32) { 0 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["1:17", "unknown type 'Nope(...)'"]

[[case]]
name = "unknown_method_parameter_type_points_at_the_type"
source = """
struct S {
    fn m(borrow self, x: Nope(i32)) -> i32 { 0 }
}
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["2:26", "unknown type 'Nope(...)'"]
