[section]
id = "diagnostics.slice-second-class"
name = "Slice type second-class diagnostics (ADR-0043 Phase 1)"
description = """
A slice is a second-class fat-pointer view (ADR-0037): it is valid only in
argument position and may not escape. These cases pin the second-class
enforcement — return position is E0487, a struct field / enum payload is
E0488, and a `let` / `const` binding is E0489 — which fire *before* the
runtime is consulted. In argument position (the one legal spot) the slice
type is accepted and its fat-pointer runtime (`.len()`, bounds-checked
`s[i]`) runs; that end-to-end behaviour is pinned in the CLI suite
(slices_mvp.toml). These UI cases pin the second-class enforcement
diagnostics.
"""


[[case]]
name = "slice_narrow_frame_array_coercion_e0908"
description = "Borrowing a non-slot-width frame array as a slice is rejected at the source-level coercion boundary with E0908."
source = """
fn take(borrow s: [i32]) -> i32 { 0 }
fn main() -> i32 {
    let a: [i32; 3] = [1, 2, 3];
    take(borrow a)
}
"""
compile_fail = true
error_contains = ["E0908", "frame array", "non-slot-width", "coerce or borrow", "i32"]

[[case]]
name = "slice_non_slot_identical_enum_frame_array_e0908"
description = "An equal-stride aggregate element with a non-slot-width tag is rejected at the same source-level coercion boundary rather than leaking backend E9001."
source = """
enum E { A(i64), B }
fn take(borrow s: [E]) -> i32 { 0 }
fn main() -> i32 {
    let a: [E; 2] = [E.A(1), E.B];
    take(borrow a)
}
"""
compile_fail = true
error_contains = ["E0908", "frame array", "non-slot-width", "coerce or borrow", "E"]

[[case]]
name = "slice_return_is_second_class_e0487"
description = "A slice in return position is second-class: E0487 (cannot be returned)."
source = """
fn f() -> [i32] { 0 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0487", "cannot be returned"]

[[case]]
name = "slice_struct_field_is_second_class_e0488"
description = "A slice as a struct field is second-class: E0488 (cannot be stored in a struct field)."
source = """
struct Holder { s: [i32] }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0488", "cannot be stored in a struct field"]

[[case]]
name = "slice_enum_payload_is_second_class_e0488"
description = "A slice as an enum variant payload is aggregate storage: E0488, worded for an enum payload rather than a struct field (RUE-2569)."
source = """
enum Maybe { None, Some([i32]) }
fn main() -> i32 { 0 }
"""
compile_fail = true
expected_error_code = "E0488"
error_contains = ["E0488", "cannot be stored in an enum payload"]

[[case]]
name = "slice_anonymous_enum_payload_is_second_class_e0488"
description = "A type constructor's anonymous enum with a slice payload is E0488 worded for an enum payload, as a named enum's is (RUE-2569)."
source = """
fn Wrap(comptime T: type) -> type { enum { Some(T), None } }
fn main() -> i32 {
    let w: Wrap([i64]) = Wrap([i64]).None;
    0
}
"""
compile_fail = true
expected_error_code = "E0488"
error_contains = ["E0488", "cannot be stored in an enum payload", "test.rue:1:37"]

[[case]]
name = "slice_anonymous_struct_field_is_second_class_e0488"
description = "An anonymous struct with a slice field keeps the struct-field wording (RUE-2569)."
source = """
fn main() -> i32 {
    let S = struct { a: [i64] };
    0
}
"""
compile_fail = true
expected_error_code = "E0488"
error_contains = ["E0488", "cannot be stored in a struct field"]

[[case]]
name = "slice_std_option_instantiation_is_second_class_e0488"
description = """
`std.option.Option([i64])` instantiates the standard library's anonymous enum
with a slice payload: E0488 worded for an enum payload. The primary span is
the `enum { ... }` body in `std/option.rue`; the memoized constructor
evaluation carries no caller site, so no note names the user's instantiation
yet (RUE-2569).
"""
source = """
const option = @import("std").option;
fn main() -> i32 {
    let x: option.Option([i64]) = option.Option([i64]).None;
    0
}
"""
compile_fail = true
real_std = true
expected_error_code = "E0488"
error_contains = ["E0488", "cannot be stored in an enum payload", "option.rue:12:5"]

[[case]]
name = "slice_let_binding_is_second_class_e0489"
description = "A slice in a `let` annotation is second-class: E0489 (can only name a function parameter)."
source = """
fn main() -> i32 { let s: [i32] = 0; 0 }
"""
compile_fail = true
error_contains = ["E0489", "can only name a function parameter"]

[[case]]
name = "slice_const_binding_is_second_class_e0489"
description = "A slice in a `const` annotation is second-class: E0489."
source = """
const S: [i32] = 0;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0489", "can only name a function parameter"]

[[case]]
name = "slice_type_intrinsic_sizes_the_fat_pointer"
description = "@size_of([i32]) resolves the slice's synthetic fat-pointer struct: two 8-byte words."
source = """
fn main() -> i32 { @size_of([i32]) }
"""
exit_code = 16
