[section]
id = "diagnostics.comptime-position-agreement"
name = "Comptime diagnostics agree in const and comptime position"
description = """
A const initializer is comptime-evaluable by exactly the set that governs a
comptime block (6.5:2, 4.14:26-29), so the same fragment must be judged the
same way in either position. Two ComptimeHosts implement that judgement --
ordinary body evaluation and durable declaration-time evaluation -- and each
case below pairs the two positions on one fragment so the hosts cannot drift
apart again (RUE-1968).
"""

# =============================================================================
# A comptime-known match that selects no arm (4.14:19)
# =============================================================================

[[case]]
name = "match_no_selected_arm_in_const_position"
source = """
const X: i32 = match 3 { 1 => 10, 2 => 20 };

fn main() -> i32 { X }
"""
compile_fail = true
error_contains = [
    "E1200",
    "comptime match has no selected arm",
]

[[case]]
name = "match_no_selected_arm_in_comptime_position"
source = """
fn main() -> i32 {
    let x: i32 = comptime { match 3 { 1 => 10, 2 => 20 } };
    x
}
"""
compile_fail = true
error_contains = [
    "E1200",
    "comptime match has no selected arm",
]

# =============================================================================
# Arithmetic overflow wording (4.14:4, 6.5:12)
# =============================================================================

[[case]]
name = "multiplication_overflow_in_const_position"
source = """
const K: i32 = 2000000 * 2000;

fn main() -> i32 { K }
"""
compile_fail = true
error_contains = [
    "E1200",
    "integer overflow evaluating multiplication at type i32: the result 4000000000 does not fit in i32",
    "this operation would panic at runtime",
]

[[case]]
name = "multiplication_overflow_in_comptime_position"
source = """
fn main() -> i32 {
    let k: i32 = comptime { 2000000 * 2000 };
    k
}
"""
compile_fail = true
error_contains = [
    "E1200",
    "integer overflow evaluating multiplication at type i32: the result 4000000000 does not fit in i32",
    "this operation would panic at runtime",
]

[[case]]
name = "u8_intermediate_overflow_in_const_position"
source = """
const K: u8 = 200 + 100 - 100;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "E1200",
    "integer overflow evaluating addition at type u8: the result 300 does not fit in u8",
]

[[case]]
name = "u8_intermediate_overflow_in_comptime_position"
source = """
fn main() -> i32 {
    let k: u8 = comptime { 200 + 100 - 100 };
    0
}
"""
compile_fail = true
error_contains = [
    "E1200",
    "integer overflow evaluating addition at type u8: the result 300 does not fit in u8",
]

# =============================================================================
# An out-of-range operand magnitude is the literal fact, not a trap (3.1:17)
# =============================================================================

[[case]]
name = "out_of_range_operand_in_const_position"
source = """
const K: i32 = 0 - 3000000000;

fn main() -> i32 { K }
"""
compile_fail = true
error_contains = [
    "E0800",
    "literal value 3000000000 is out of range for type 'i32'",
]

[[case]]
name = "out_of_range_operand_in_comptime_position"
source = """
fn main() -> i32 {
    let k: i32 = comptime { 0 - 3000000000 };
    k
}
"""
compile_fail = true
error_contains = [
    "E0800",
    "literal value 3000000000 is out of range for type 'i32'",
]

# =============================================================================
# Unsigned negation is a legality error, not an overflow (4.2:14)
# =============================================================================

[[case]]
name = "unsigned_negation_in_const_position"
source = """
const K: u32 = -1;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "E0801",
    "cannot apply unary operator `-` to type 'u32'",
    "unsigned values cannot be negated",
]

[[case]]
name = "unsigned_negation_in_comptime_position"
source = """
fn main() -> i32 {
    let k: u32 = comptime { -1 };
    0
}
"""
compile_fail = true
error_contains = [
    "E0801",
    "cannot apply unary operator `-` to type 'u32'",
    "unsigned values cannot be negated",
]

[[case]]
name = "unsigned_negation_of_a_constant_in_const_position"
source = """
const A: u32 = 1;
const K: u32 = -A;

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "E0801",
    "cannot apply unary operator `-` to type 'u32'",
]

# =============================================================================
# Agreement is not only about failures: the same fragment reduces alike
# =============================================================================

[[case]]
name = "signed_minimum_negation_in_const_position"
source = """
const K: i8 = -128;

fn main() -> i32 { @intCast(K) + 170 }
"""
exit_code = 42

[[case]]
name = "signed_minimum_negation_in_comptime_position"
source = """
fn main() -> i32 {
    let k: i8 = comptime { -128 };
    @intCast(k) + 170
}
"""
exit_code = 42

# =============================================================================
# A const initializer's diagnostic lands where the body path puts it (RUE-2405)
# =============================================================================

[[case]]
name = "negated_literal_out_of_range_in_const_points_at_literal"
source = """
const X: i8 = -129;
fn main() -> i32 { 0 }
"""
compile_fail = true
expected_error = """
error: [E0800]: literal value -129 is out of range for type 'i8'
 --> test.rue:1:15
  |
1 | const X: i8 = -129;
  |               ^^^^
  |
"""

[[case]]
name = "negated_literal_out_of_range_in_let_points_at_literal"
source = """
fn main() -> i32 { let x: i8 = -129; 0 }
"""
compile_fail = true
expected_error = """
error: [E0800]: literal value -129 is out of range for type 'i8'
 --> test.rue:1:32
  |
1 | fn main() -> i32 { let x: i8 = -129; 0 }
  |                                ^^^^
  |
"""

[[case]]
name = "negated_literal_out_of_range_in_const_array_points_at_element"
source = """
const A: [i8; 2] = [1, -129];
fn main() -> i32 { 0 }
"""
compile_fail = true
expected_error = """
error: [E0800]: literal value -129 is out of range for type 'i8'
 --> test.rue:1:24
  |
1 | const A: [i8; 2] = [1, -129];
  |                        ^^^^
  |
"""

[[case]]
name = "unsigned_negation_in_const_points_at_negation"
description = "The const path preserves the unary site and the note shown by body analysis."
source = """
const K: u8 = -1;
fn main() -> i32 { 0 }
"""
compile_fail = true
expected_error = """
error: [E0801]: cannot apply unary operator `-` to type 'u8'
 --> test.rue:1:15
  |
1 | const K: u8 = -1;
  |               ^^
  |
  = note: unsigned values cannot be negated
"""

[[case]]
name = "unsigned_negation_u8_in_comptime_position"
source = """
fn main() -> i32 {
    let x: u8 = comptime { -1 };
    0
}
"""
compile_fail = true
expected_error = """
error: [E0801]: cannot apply unary operator `-` to type 'u8'
 --> test.rue:2:28
  |
2 |     let x: u8 = comptime { -1 };
  |                            ^^
  |
  = note: unsigned values cannot be negated
"""

[[case]]
name = "boolean_negation_in_const_position"
source = """
const X: bool = -true;
fn main() -> i32 { 0 }
"""
compile_fail = true
expected_error = """
error: [E0801]: cannot apply unary operator `-` to type 'bool'
 --> test.rue:1:17
  |
1 | const X: bool = -true;
  |                 ^^^^^
  |
  = note: unary `-` requires a signed integer or floating-point operand
"""

[[case]]
name = "boolean_bitnot_remains_comptime_evaluation_error"
source = """
const X: bool = ~true;
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E1200", "comptime arithmetic operand is not an integer"]

# A named array length the durable engine rejects is reported on the length
# expression, in a const and through a type constructor alike (RUE-2405).

[[case]]
name = "negative_named_length_in_const_points_at_repeat"
source = """
const N: i32 = -1;
const A = [0; N];
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0481", "'N' is negative or too large", "test.rue:2:11"]

[[case]]
name = "type_shadowed_length_from_const_points_into_constructor"
source = """
fn TypeShadow(comptime N: type) -> type { [i32; N] }
const TYPE: type = TypeShadow(i32);
fn main() -> i32 { let x: TYPE = [1, 2]; 0 }
"""
compile_fail = true
error_contains = ["E0481", "'N' is not an integer", "test.rue:1:43"]

[[case]]
name = "type_shadowed_length_from_let_points_into_constructor"
source = """
fn TypeShadow(comptime N: type) -> type { [i32; N] }
fn main() -> i32 { let x: TypeShadow(i32) = [1, 2]; 0 }
"""
compile_fail = true
error_contains = ["E0481", "'N' is not an integer", "test.rue:1:43"]

# A constructor whose body the durable engine rejects is reported inside the
# constructor, whether it is reached from a signature, a let or a const.

[[case]]
name = "fn_field_in_constructor_from_signature_points_into_constructor"
source = """
fn Make() -> type { struct { cb: fn(i32) -> i32 } }
fn apply(m: Make()) -> i32 { 0 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0214", "not a struct field", "test.rue:1:21"]

[[case]]
name = "fn_payload_in_constructor_from_const_points_into_constructor"
source = """
fn Make() -> type { enum { Run(fn(i32) -> i32), Skip } }
const T = Make();
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0214", "not an enum payload", "test.rue:1:21"]

[[case]]
name = "out_of_range_in_imported_const_points_into_its_file"
source = """
const lib = @import("lib.rue");
const A: i8 = lib.B;
fn main() -> i32 { 0 }
"""
aux_files = { "lib.rue" = "// padding\n// padding\npub const B: i8 = -129;\n" }
compile_fail = true
error_contains = ["E0800", "literal value -129 is out of range for type 'i8'", "lib.rue:3:19"]

# Scalar values returned by declaration-time evaluation can fail the declared
# integer range after evaluation. Keep the diagnostic on the value expression
# just as the body path does, including when the declaration comes from import.
[[case]]
name = "positive_scalar_out_of_range_const_points_at_literal_u8"
source = """
const X: u8 = 256;
fn main() -> i32 { 0 }
"""
compile_fail = true
expected_error = """
error: [E0800]: literal value 256 is out of range for type 'u8'
 --> test.rue:1:15
  |
1 | const X: u8 = 256;
  |               ^^^
  |
"""

[[case]]
name = "positive_scalar_out_of_range_const_points_at_literal_i8"
source = """
const X: i8 = 128;
fn main() -> i32 { 0 }
"""
compile_fail = true
expected_error = """
error: [E0800]: literal value 128 is out of range for type 'i8'
 --> test.rue:1:15
  |
1 | const X: i8 = 128;
  |               ^^^
  |
"""

[[case]]
name = "positive_scalar_out_of_range_const_points_at_initializer_expression"
source = """
const X: u8 = 300 + 1;
fn main() -> i32 { 0 }
"""
compile_fail = true
expected_error = """
error: [E0800]: literal value 300 is out of range for type 'u8'
 --> test.rue:1:15
  |
1 | const X: u8 = 300 + 1;
  |               ^^^^^^^
  |
"""

[[case]]
name = "positive_scalar_out_of_range_imported_const_points_at_literal"
source = """
const lib = @import("lib.rue");
const A: i8 = lib.B;
fn main() -> i32 { 0 }
"""
aux_files = { "lib.rue" = "pub const B: u8 = 256;\n" }
compile_fail = true
expected_error = """
error: [E0800]: literal value 256 is out of range for type 'u8'
 --> lib.rue:1:19
  |
1 | pub const B: u8 = 256;
  |                   ^^^
  |
"""
