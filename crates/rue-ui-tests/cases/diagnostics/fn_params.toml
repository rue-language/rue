# Second-class function parameter types (ADR-0096, RUE-2193).
#
# A `fn` type names a callback signature and is legal only as the type of a
# by-value runtime parameter. These cases pin the preview gate, the spelling
# the type is rendered with, and the E0214 rejection of every other position.
# Passing, calling, and forwarding a callback are RUE-2194. A body is analyzed
# only when it is reachable, so the body-level positions are exercised from
# `main`.

[section]
id = "diagnostics.fn_params"
name = "Function parameter type diagnostics"
description = "Pins the diagnostics of the fn_params preview (spec 6.1:46-6.1:48, RUE-2193): the preview gate, the rendered spelling of a function type, and the E0214 rejection of a `fn` type in every position other than a by-value runtime parameter."

[[case]]
name = "fn_type_without_preview_names_the_flag"
source = """
fn apply(cb: fn(i32) -> i32, value: i32) -> i32 { value }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "[E1100]",
    "function parameter types requires preview feature `fn_params`",
    "use --preview fn_params to enable this feature (ADR-0096)",
]

[[case]]
name = "fn_type_is_rendered_with_its_modes"
description = "A mismatch names the callback's type exactly as a program spells it: modes before types, no parameter names."
preview = "fn_params"
source = """
struct Policy { descending: bool }

fn choose(cmp: fn(borrow Policy, i64, inout [u8; 4]) -> bool) -> i32 { 0 }

fn main() -> i32 { choose(1) }
"""
compile_fail = true
error_contains = [
    "[E0206]",
    "found fn(borrow Policy, i64, inout [u8; 4]) -> bool",
]

[[case]]
name = "fn_type_with_a_unit_result_is_rendered_without_the_arrow"
preview = "fn_params"
source = """
fn each(visit: fn(i32)) -> i32 { 0 }

fn main() -> i32 { each(true) }
"""
compile_fail = true
error_contains = ["[E0206]", "expected fn(i32), found bool"]

[[case]]
name = "nested_fn_types_are_admitted_in_parameter_position"
description = "A callback may take a callback: the parameter list of a `fn` type is itself parameter position (6.1:47)."
preview = "fn_params"
source = """
fn twice(step: fn(fn(i32) -> i32, i32) -> i32, unit: fn()) -> i32 { 0 }

fn main() -> i32 { 0 }
"""
compile_only = true

[[case]]
name = "fn_type_as_return_type_is_rejected"
preview = "fn_params"
source = """
fn pick(cb: fn(i32) -> i32) -> fn(i32) -> i32 { cb }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "[E0214]",
    "a `fn` type may only be the type of a by-value parameter, not a return type",
    "a callback is second-class and cannot be stored, returned, or nested in another type (ADR-0096)",
]

[[case]]
name = "fn_type_on_a_borrow_parameter_is_rejected"
preview = "fn_params"
source = """
fn apply(borrow cb: fn(i32) -> i32) -> i32 { 0 }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["[E0214]", "not a `borrow` parameter"]

[[case]]
name = "fn_type_on_an_inout_parameter_is_rejected"
preview = "fn_params"
source = """
