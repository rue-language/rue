[[case]]
name = "fn_type_as_a_type_argument_is_rejected"
description = "A type constructor cannot be instantiated over a callback: `Wrap(fn(...))` would be a stored callback."
preview = "fn_params"
source = """
fn Wrap(comptime T: type) -> type { struct { value: T } }

fn apply(w: Wrap(fn(i32) -> i32)) -> i32 { 0 }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["[E0214]", "not a type argument"]

[[case]]
name = "fn_type_as_a_let_annotation_is_rejected"
preview = "fn_params"
source = """
fn main() -> i32 {
    let kept: fn(i32) -> i32 = 0;
    0
}
"""
compile_fail = true
error_contains = ["[E0214]", "not a `let` binding"]

[[case]]
name = "fn_type_as_a_const_annotation_is_rejected"
