error_contains = ["[E0214]", "not a struct field"]

[[case]]
name = "fn_type_as_an_anonymous_struct_field_is_rejected"
description = "A type constructor cannot build a struct that stores a callback either."
preview = "fn_params"
source = """
fn Make() -> type { struct { cb: fn(i32) -> i32 } }

fn apply(m: Make()) -> i32 { 0 }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["[E0214]", "not a struct field"]

