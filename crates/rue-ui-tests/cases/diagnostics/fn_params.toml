[[case]]
name = "fn_type_as_an_intrinsic_type_argument_is_rejected"
description = "A callback has no size a program may ask for: `@size_of` and its siblings take no `fn` type."
preview = "fn_params"
source = """
fn main() -> i32 { @intCast(@size_of(fn(i32) -> i32)) }
"""
compile_fail = true
error_contains = ["[E0214]", "not an intrinsic type argument"]
