# Directive validation (RUE-133).
#
# Unknown @-directives in item/statement position used to be silently
# accepted and ignored, so a typo like `@alllow(...)` was a no-op. They are
# now a compile error naming the directive. The vocabulary — directive names,
# argument names, and the sites each is accepted and honored at — lives in
# rue-parser's `directives` module (allow, copy, repr, non_exhaustive); the
# cases below pin both the rejection and that every known directive still
# works. (Expression-position intrinsics like @dbg/@intCast and the fused
# @import token are separate mechanisms and unaffected.)
#
# This file also covers parameter-modifier validation: `comptime comptime T`
# used to be silently accepted via a vestigial is_comptime/ParamMode duality.

[section]
id = "diagnostics.directives"
name = "Directive and parameter-modifier validation"
description = "Unknown directives and repeated parameter modifiers are rejected; known ones still work."

[[case]]
name = "unknown_directive_on_function"
source = """
@important
fn main() -> i32 { 42 }
"""
compile_fail = true
error_contains = ["unknown directive '@important'", "@allow, @copy, @repr, @non_exhaustive, @known_bug, and @known_bug_on"]

[[case]]
name = "non_exhaustive_directive_private_enum_rejected"
preview = "non_exhaustive_enums"
source = """
@non_exhaustive enum E { A }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["@non_exhaustive can only be applied to public enums", "1:1"]

[[case]]
name = "non_exhaustive_directive_function_rejected"
preview = "non_exhaustive_enums"
source = """
@non_exhaustive
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["@non_exhaustive can only be applied to enums"]

[[case]]
name = "non_exhaustive_directive_arguments_rejected"
preview = "non_exhaustive_enums"
source = """
@non_exhaustive(foo) pub enum E { A }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["@non_exhaustive takes no arguments"]

[[case]]
name = "unknown_directive_typo_of_allow"
description = "The motivating case: a typo'd @allow must not silently disable nothing."
source = """
fn main() -> i32 {
    @alllow(unused_variable)
    let x = 1;
    0
}
"""
compile_fail = true
error_contains = ["unknown directive '@alllow'"]

[[case]]
name = "unknown_directive_on_struct"
source = """
@frozen
struct P { x: i32 }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["unknown directive '@frozen'"]

[[case]]
name = "unknown_directive_on_nested_let"
description = "Directives on let statements nested inside control flow are validated too."
source = """
fn main() -> i32 {
    if true {
        @nope
        let x = 1;
        x
    } else {
        0
    }
}
"""
compile_fail = true
error_contains = ["unknown directive '@nope'"]

[[case]]
name = "known_directive_allow_still_works"
source = """
fn main() -> i32 {
    @allow(unused_variable)
    let unused = 1;
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "copy_directive_with_args_rejected"
description = """
@copy takes no arguments (spec 2.5); bogus args used to be silently accepted
and ignored (rue-rir component review, 2026-07-04). Arity is per-directive:
@allow legitimately takes lint-name args (covered above).
"""
source = """
@copy(garbage, nonsense)
struct S { x: i32 }

fn main() -> i32 {
    let s = S { x: 5 };
    let t = s;
    s.x + t.x
}
"""
compile_fail = true
error_contains = ["@copy takes no arguments"]

[[case]]
name = "allow_unreachable_code_on_let_rejected"
description = """
RUE-1971: the validator accepted @allow(<any known warning>) on a let while
sema honored only unused_variable there, so @allow(unreachable_code) on a let
was accepted and the warning still fired. A warning may only be named at a
site that honors it (spec 2.5:40).
"""
source = """
fn main() -> i32 {
    return 0;
    @allow(unreachable_code)
    let x = 42;
    x
}
"""
compile_fail = true
error_contains = [
    "@allow(unreachable_code) is not honored on let statements",
    "unreachable_code can be allowed on functions, methods, and test declarations",
]

[[case]]
name = "allow_unreachable_code_on_function_still_suppresses"
description = "The same directive on the enclosing function is honored (spec 2.5:21)."
source = """
@allow(unreachable_code)
fn main() -> i32 {
    return 0;
    let x = 42;
    x
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "allow_unused_function_on_let_rejected"
source = """
fn main() -> i32 {
    @allow(unused_function)
    let x = 42;
    x
}
"""
compile_fail = true
error_contains = ["@allow(unused_function) is not honored on let statements"]

[[case]]
name = "allow_on_struct_rejected"
description = "@allow is a body/binding directive; a struct is not one of its sites."
source = """
@allow(unused_variable)
struct P { x: i32 }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "@allow can only be applied to functions, methods, test declarations, and let statements",
    "not structs",
]

[[case]]
name = "non_exhaustive_in_expression_position_rejected"
description = """
RUE-1971: the parser's expression-position rejection is driven by the same
directive table as the validator, so every directive name — not just
allow/copy/repr — reports its placement instead of reaching sema's unknown
intrinsic path.
"""
source = """
fn main() -> i32 {
    let x = @non_exhaustive(1);
    x
}
"""
compile_fail = true
error_contains = ["directive must precede a statement"]

[[case]]
name = "known_directive_copy_still_works"
source = """
@copy
struct P { x: i32 }

fn main() -> i32 {
    let p = P { x: 21 };
    let q = p;
    p.x + q.x
}
"""
exit_code = 42

# --- @repr(c) marker grammar (ADR-0064 Amendment 1, RUE-1063) ---------------
# The `@repr(c)` guarantee marker reuses the parameterized `@name(arg)` directive
# grammar. Placement (structs only) and argument (`c` in v0) validation happen at
# parse time, before the `c_ffi` preview gate in sema.

[[case]]
name = "repr_directive_on_function_rejected"
description = "@repr is a struct marker; on a function it is a parse error naming the site."
source = """
@repr(c)
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["@repr can only be applied to structs"]

[[case]]
name = "repr_unknown_argument_rejected"
description = "Only `c` is accepted in v0; @repr(packed) fails loudly naming the accepted set."
source = """
@repr(packed)
struct P { x: i64 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["unknown @repr argument 'packed'", "accepted arguments are c"]

[[case]]
name = "repr_missing_argument_rejected"
description = "@repr is parameterized: a bare @repr with no argument is rejected."
source = """
@repr
struct P { x: i64 }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["@repr takes exactly one representation argument", "accepted arguments are c"]

[[case]]
name = "known_directive_repr_c_still_works"
description = "A well-formed @repr(c) struct compiles under the c_ffi preview (layout no-op)."
preview = "c_ffi"
source = """
@repr(c)
struct P { x: i32, y: i32 }
fn main() -> i32 {
    let p = P { x: 20, y: 22 };
    p.x + p.y
}
"""
exit_code = 42

[[case]]
name = "retired_handle_directive_is_unknown"
description = """
@handle was retired (RUE-199, vestigial per the formal core). It is now just an
unknown directive; a user method literally named `handle` is unaffected (see the
next case).
"""
source = """
@handle
struct Counter {
    count: i32,

    fn handle(self) -> Counter {
        Counter { count: self.count }
    }
}

fn main() -> i32 {
    let a = Counter { count: 42 };
    let b = a.handle();
    b.count
}
"""
compile_fail = true
error_contains = ["unknown directive '@handle'", "@allow, @copy, @repr, @non_exhaustive, @known_bug, and @known_bug_on"]

[[case]]
name = "ordinary_handle_method_still_works"
description = "A user method named `handle` is an ordinary method, no directive involved."
source = """
struct Counter {
    count: i32,

    fn handle(self) -> Counter {
        Counter { count: self.count }
    }
}

fn main() -> i32 {
    let a = Counter { count: 42 };
    let b = a.handle();
    b.count
}
"""
exit_code = 42

[[case]]
name = "intrinsics_unaffected_by_directive_validation"
description = "@dbg/@size_of are expression-position intrinsics, not directives."
source = """
fn main() -> i32 {
    @dbg(1);
    @size_of(i32)
}
"""
exit_code = 4

[[case]]
name = "duplicate_comptime_modifier_rejected"
description = """
RUE-133 item 8: `comptime comptime T: type` was silently accepted (the second
`comptime` landed in a vestigial ParamMode.Comptime next to the is_comptime
flag; the duality is now collapsed and duplicates are parse errors).
"""
source = """
fn id(comptime comptime T: type, x: T) -> T { x }

fn main() -> i32 { id(i32, 42) }
"""
compile_fail = true
error_contains = ["duplicate parameter modifier 'comptime'"]

[[case]]
name = "repeated_inout_modifier_rejected"
source = """
fn f(inout inout x: i32) { x = x + 1; }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["duplicate parameter modifier 'inout'"]

[[case]]
name = "conflicting_param_modifiers_rejected"
source = """
fn f(comptime inout x: i32) -> i32 { x }

fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["conflicting parameter modifiers 'comptime' and 'inout'", "at most one"]

[[case]]
name = "single_comptime_param_still_works"
source = """
fn id(comptime T: type, x: T) -> T { x }

fn main() -> i32 { id(i32, 42) }
"""
exit_code = 42
