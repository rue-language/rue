[section]
id = "diagnostics.droppable-gate"
name = "Container droppable-gate diagnostics (E0499)"
description = """
The @require_droppable rejection is raised inside the CONSTRUCTOR's body, so
the diagnostic must still speak the user's language (RUE-610): the offending
type prints as its instantiation spelling (`Holder(Token)`, not the internal
`__anon_struct_N`), and a label points at the user's type-constructor
application, not just the constructor's own source. Only `linear` element types
are rejected now (RUE-646): droppable-but-non-linear elements are legal because
the container runs their per-element drop glue, so all cases below use a
`linear` element type.
"""

# E0498 is retired in the current error catalog; this matrix covers its
# surviving deferred-gate behavior under E0499 instead.

[[case]]
name = "e0499_names_ctor_spelling_and_user_site"
description = "A ctor-produced anonymous linear element type prints as Ctor(args) and the rejection labels the user's application site (RUE-610)"
source = """
linear struct Token { v: i32 }
fn Wrap(comptime T: type) -> type { enum { Some(T), None } }
fn Gated(comptime T: type) -> type {
    @require_droppable(T);
    struct { y: T }
}
const W = Wrap(Token);
const G = Gated(W);
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "E0499",
    "Wrap(Token)",
    "required by the type-constructor application here",
]

[[case]]
name = "e0499_value_position_labels_user_site"
description = "The application-site label also appears for a let-bound instantiation inside a function body (RUE-610)"
source = """
linear struct Token { v: i32 }
fn Gated(comptime T: type) -> type {
    @require_droppable(T);
    struct { y: T }
}
fn main() -> i32 {
    let G = Gated(Token);
    let _ = G;
    0
}
"""
compile_fail = true
error_contains = ["E0499", "Token", "required by the type-constructor application here"]

[[case]]
name = "e0499_body_local_nested_enum_uses_outer_ctor_display"
description = "A body-local enum passed into a second constructor keeps the first constructor spelling in the deferred E0499 query."
source = """
linear struct Token { v: i32 }
fn Wrap(comptime T: type) -> type { enum { Some(T), None } }
fn Gated(comptime T: type) -> type {
    @require_droppable(T);
    struct { y: T }
}
fn main() -> i32 {
    let W = Wrap(Token);
    let G = Gated(W);
    let _ = G;
    0
}
"""
compile_fail = true
error_contains = ["E0499", "Wrap(Token)"]

[[case]]
name = "deferred_named_enum_linear_payload_is_rejected"
description = "A declaration-time gate defers an incomplete named enum, then rejects it after payload completion and infectious-linearity finalization."
source = """
linear struct Token { v: i32 }
enum Maybe { Some(Token), None }
fn Gated(comptime T: type) -> type {
    @require_droppable(T);
    struct { y: T }
}
const G = Gated(Maybe);
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0499", "Maybe"]

[[case]]
name = "deferred_named_enum_primitive_payload_compiles"
description = "The same deferred declaration-time query resolves negative after a named enum's primitive payload is complete."
source = """
enum Maybe { Some(i32), None }
fn Gated(comptime T: type) -> type {
    @require_droppable(T);
    struct { y: T }
}
const G = Gated(Maybe);
fn main() -> i32 { 0 }
"""
compile_fail = false
exit_code = 0

[[case]]
name = "zero_linear_array_is_droppable"
description = "A zero-length array holds no linear values, so the droppable gate accepts it under spec 3.8:74."
source = """
linear struct Token { v: i32 }
fn Gated(comptime T: type) -> type {
    @require_droppable(T);
    struct { y: T }
}
const G = Gated([Token; 0]);
fn main() -> i32 { 0 }
"""
compile_fail = false
exit_code = 0

[[case]]
name = "e0499_linear_names_and_labels"
description = "The linear-element rejection (E0499) gets the same application-site label (RUE-610)"
source = """
linear struct Token { v: i32 }
fn Gated(comptime T: type) -> type {
    @require_droppable(T);
    struct { y: T }
}
const G = Gated(Token);
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0499", "Token", "required by the type-constructor application here"]
