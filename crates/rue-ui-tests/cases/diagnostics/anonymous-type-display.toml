[section]
id = "diagnostics.anonymous-type-display"
name = "Anonymous Type Display Names"
description = "Diagnostics call a body-local anonymous struct by its let binding, never by its generated digest name (RUE-2589)."

[[case]]
name = "let_bound_struct_mismatch_names_the_binding"
description = "A struct bound by let reads by the binding's name in a type mismatch."
source = """
fn main() -> i32 {
    let I = struct { v: i64 };
    let J = struct { v: i64 };
    let i: I = J { v: 1 };
    0
}
"""
compile_fail = true
error_contains = ["E0206", "type mismatch: expected I, found J"]

[[case]]
name = "unbound_comptime_block_struct_reads_by_its_shape"
description = "A comptime-block struct no let binds has no name, so it reads by its shape."
source = """
fn take(comptime T: type, x: T) -> i64 { 0 }
fn main() -> i32 {
    take(comptime { struct { v: i64, w: bool } }, 5);
    0
}
"""
compile_fail = true
error_contains = ["E0206", "type mismatch: expected struct { v: i64, w: bool }, found {integer}"]

[[case]]
name = "constructor_body_local_structs_are_qualified_by_the_constructor"
description = "Two structs a constructor's body binds read as `A(i64).B` and `A(i64).C`, not both as `A(i64)`."
source = """
fn Inner(comptime T: type) -> type { struct { x: T } }
fn A(comptime T: type) -> type {
    let B = struct { v: T };
    let C = struct { v: T };
    struct {
        b: Inner(B),
        c: Inner(C),
        fn make(v: T) -> Self {
            Self { b: Inner(B) { x: B { v: v } }, c: Inner(C) { x: C { v: v } } }
        }
        fn first(self) -> Inner(B) { self.c }
    }
}
fn main() -> i32 {
    let X = A(i64);
    let x = X.make(1);
    let b = x.first();
    0
}
"""
compile_fail = true
error_contains = ["E0206", "type mismatch: expected Inner(A(i64).B), found Inner(A(i64).C)"]

[[case]]
name = "recursive_anonymous_struct_help_points_through_self"
description = "E0483 names a let-bound struct by its binding and suggests `ptr const Self`, the spelling its own fields can use."
source = """
fn main() -> i32 {
    let I = struct { v: i64, w: [Self; 1] };
    0
}
"""
compile_fail = true
error_contains = [
    "E0483",
    "recursive type 'I' has infinite size (contains itself by value: I -> I)",
    "(`ptr const Self` / `ptr mut Self`)",
]

[[case]]
name = "method_body_error_names_the_struct_not_its_producer"
description = "An error inside a body-local struct's method names the struct, not the function that declares it."
source = """
fn main() -> i32 {
    let I = struct { v: i64, fn get(self) -> i64 { self.nope } };
    let i = I { v: 1 };
    @intCast(i.get())
}
"""
compile_fail = true
error_contains = ["E0401", "unknown field 'nope' in struct 'I'"]

[[case]]
name = "unsatisfied_bound_on_a_body_local_struct_names_it_and_offers_no_assertion"
description = "E0305 names a body-local struct by its binding; no module-level assertion can name it, so the help says to declare it there."
preview = "interfaces"
source = """
interface Getter { fn get(self) -> i64; }
fn use(comptime T: Getter, x: T) -> i64 { x.get() }
fn main() -> i32 {
    let I = struct { v: i64 };
    @intCast(use(I, I { v: 1 }))
}
"""
compile_fail = true
error_contains = [
    "E0305",
    "type `I` does not conform to interface `Getter`",
    "an anonymous type local to a function body cannot be named by a conformance assertion; declare it at module scope as `struct Name is Getter { .. }`",
]

[[case]]
name = "shadowed_let_bound_structs_are_told_apart_by_their_lines"
description = "A shadowing `let` reuses the name, so two distinct structs that would both read `I` are told apart by where they are declared."
source = """
fn main() -> i32 {
    let I = struct { a: i64 };
    let i = I { a: 1 };
    let I = struct { a: i64 };
    let j: I = i;
    0
}
"""
compile_fail = true
error_contains = [
    "E0206",
    "type mismatch: expected I (local struct at line 4), found I (local struct at line 2)",
]

[[case]]
name = "layered_local_constructor_keeps_only_the_real_error"
description = "A body that applies two constructor layers over its own local and has an unrelated error reports only that error; the layered specialization is suppressed with its failed producer, not an internal error (RUE-2590)."
source = """
fn W(comptime T: type) -> type { struct { v: T } }
fn V(comptime T: type) -> type { struct { u: T } }
fn main() -> i32 {
    let I = struct { a: i64 };
    let T = W(V(I));
    let z: bool = 1;
    0
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:6:5
  |
6 |     let z: bool = 1;
  |     ^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "constructor_wrapping_its_local_over_a_callers_local_keeps_only_the_real_error"
description = "A constructor whose body wraps its own local in another constructor reduces over a caller's local, so a body with an unrelated error reports only that error (RUE-2590, RUE-2608)."
source = """
fn W(comptime T: type) -> type { struct { v: T } }
fn G(comptime T: type) -> type { let L = struct { s: T }; W(L) }
fn main() -> i32 {
    let I = struct { q: i64 };
    let X = G(I);
    let z: bool = 1;
    0
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected bool, found {integer}
 --> test.rue:6:5
  |
6 |     let z: bool = 1;
  |     ^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "constructor_cycle_over_a_function_local_names_the_local"
description = "A constructor application over a function's own `let` type reads by that binding in the E0483 cycle, as `const` and primitive arguments do, not by the producer function (RUE-2612)."
source = """
fn Opt(comptime T: type) -> type { enum { Some(T), None } }
fn L(comptime T: type) -> type { struct { v: T, next: Opt(Self) } }
fn main() -> i32 { let I = struct { s: i64 }; @size_of(L(I)) }
"""
compile_fail = true
expected_error = """
error: [E0483]: recursive type 'L(I)' has infinite size (contains itself by value: L(I) -> Opt(L(I)) -> L(I)); break the cycle with a pointer (`ptr const Self` / `ptr mut Self`)
 --> test.rue:2:34
  |
2 | fn L(comptime T: type) -> type { struct { v: T, next: Opt(Self) } }
  |                                  ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "constructor_cycle_over_a_function_local_bound_by_let"
description = "The `let N = L(I)` spelling of the same cycle names the local the same way (RUE-2612)."
source = """
fn Opt(comptime T: type) -> type { enum { Some(T), None } }
fn L(comptime T: type) -> type { struct { v: T, next: Opt(Self) } }
fn main() -> i32 { let I = struct { s: i64 }; let N = L(I); 0 }
"""
compile_fail = true
expected_error = """
error: [E0483]: recursive type 'L(I)' has infinite size (contains itself by value: L(I) -> Opt(L(I)) -> L(I)); break the cycle with a pointer (`ptr const Self` / `ptr mut Self`)
 --> test.rue:2:34
  |
2 | fn L(comptime T: type) -> type { struct { v: T, next: Opt(Self) } }
  |                                  ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "constructor_mismatch_between_two_function_locals_names_each"
description = "Two applications of one constructor over different locals of one function read `L(I)` and `L(J)` in an E0206 (RUE-2612)."
source = """
fn L(comptime T: type) -> type { struct { v: T } }
fn main() -> i32 {
    let I = struct { s: i64 };
    let J = struct { s: i64 };
    let a: L(I) = L(I) { v: I { s: 1 } };
    let b: L(J) = a;
    0
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected L(J), found L(I)
 --> test.rue:6:5
  |
6 |     let b: L(J) = a;
  |     ^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "constructor_mismatch_between_shadowed_locals_gives_their_lines"
description = "Two applications of one constructor over a shadowed `let` name are told apart by the line each local is declared on (RUE-2612)."
source = """
fn L(comptime T: type) -> type { struct { v: T } }
fn main() -> i32 {
    let I = struct { s: i64 };
    let a = L(I) { v: I { s: 1 } };
    let I = struct { s: i64 };
    let b: L(I) = a;
    0
}
"""
compile_fail = true
expected_error = """
error: [E0206]: type mismatch: expected L(I (local struct at line 5)), found L(I (local struct at line 3))
 --> test.rue:6:5
  |
6 |     let b: L(I) = a;
  |     ^^^^^^^^^^^^^^^^
  |
"""

# A local of a type constructor's body, or of a zero-argument `-> type`
# function, keeps its producer in the durable E0483 spelling (RUE-2612).
[[case]]
name = "constructor_cycle_over_a_constructor_local_names_its_producer"
source = """
fn Opt(comptime T: type) -> type { enum { Some(T), None } }
fn L(comptime T: type) -> type { struct { v: T, next: Opt(Self) } }
fn P(comptime T: type) -> type { let J = struct { s: T }; L(J) }
fn main() -> i32 { @size_of(P(i32)) }
"""
compile_fail = true
expected_error = """
error: [E0483]: recursive type 'L(P(i32).J)' has infinite size (contains itself by value: L(P(i32).J) -> Opt(L(P(i32).J)) -> L(P(i32).J)); break the cycle with a pointer (`ptr const Self` / `ptr mut Self`)
 --> test.rue:2:34
  |
2 | fn L(comptime T: type) -> type { struct { v: T, next: Opt(Self) } }
  |                                  ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  |
"""

[[case]]
name = "constructor_cycle_over_a_zero_argument_producer_local_names_its_producer"
source = """
fn Opt(comptime T: type) -> type { enum { Some(T), None } }
fn L(comptime T: type) -> type { struct { v: T, next: Opt(Self) } }
fn Q() -> type { let K = struct { s: i64 }; L(K) }
fn main() -> i32 { @size_of(Q()) }
"""
compile_fail = true
expected_error = """
error: [E0483]: recursive type 'L(Q.K)' has infinite size (contains itself by value: L(Q.K) -> Opt(L(Q.K)) -> L(Q.K)); break the cycle with a pointer (`ptr const Self` / `ptr mut Self`)
 --> test.rue:2:34
  |
2 | fn L(comptime T: type) -> type { struct { v: T, next: Opt(Self) } }
  |                                  ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  |
"""
