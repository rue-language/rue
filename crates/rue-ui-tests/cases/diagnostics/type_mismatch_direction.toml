[section]
id = "diagnostics.type_mismatch_direction"
name = "Type mismatch direction"
description = "E0206 must report the context's expected type as 'expected' and the actual value's type as 'found' — these were systematically swapped (RUE-133)."

[[case]]
name = "return_type_mismatch_direction"
source = """
fn main() -> i32 { true }
"""
compile_fail = true
error_contains = ["expected i32, found bool"]

[[case]]
name = "let_annotation_mismatch_direction"
source = """
fn main() -> i32 {
    let x: i32 = true;
    0
}
"""
compile_fail = true
error_contains = ["expected i32, found bool"]

[[case]]
name = "call_arg_mismatch_direction"
source = """
fn f(n: i32) -> i32 { n }
fn main() -> i32 { f(true) }
"""
compile_fail = true
error_contains = ["expected i32, found bool"]

# The array-vs-non-array unification path kept the swapped order after the
# general fix landed: `fn main() -> i32 { [1, 2, 3] }` printed
# "expected [?0; 3], found i32" (RUE-133).
[[case]]
name = "array_return_mismatch_direction"
source = """
fn main() -> i32 { [1, 2, 3] }
"""
compile_fail = true
error_contains = ["expected i32, found [{integer}; 3]"]

[[case]]
name = "scalar_for_array_return_mismatch_direction"
source = """
fn f() -> [i32; 3] { true }
fn main() -> i32 { f(); 0 }
"""
compile_fail = true
error_contains = ["expected [i32; 3], found bool"]

# A literal that cannot take the type its context expects is the found side:
# the literal's own type (`{integer}`, or `comptime_float` for a float
# literal) is what was found. The literal's variable is bound by the unifier
# from either side of a constraint, and these used to name the literal as
# expected wherever it was the value (RUE-2566).
[[case]]
name = "float_literal_at_an_integer_local"
source = """
fn main() -> i32 {
    let y: i64 = 1.5;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected i64, found comptime_float", "test.rue:2:5"]

[[case]]
name = "float_literal_at_an_integer_field"
source = """
struct P { w: i64 }
fn main() -> i32 {
    let mut p = P { w: 1 };
    p.w = 1.5;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected i64, found comptime_float", "test.rue:4:11"]

[[case]]
name = "float_literal_at_an_integer_accessor_place"
source = """
struct P {
    w: i64,

    fn wr(inout self) -> inout i64 {
        yield self.w;
    }
}
fn main() -> i32 {
    let mut p = P { w: 1 };
    p.wr() = 1.5;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected i64, found comptime_float", "test.rue:10:14"]

[[case]]
name = "float_literal_element_at_an_integer_array"
source = """
fn main() -> i32 {
    let a: [i32; 2] = [1.5, 2];
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected i32, found comptime_float"]

[[case]]
name = "integer_literal_at_a_bool_local"
source = """
fn main() -> i32 {
    let b: bool = 5;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected bool, found {integer}"]

# The literal's variable once took the array type silently, so the literal
# itself was typed `[i32; 2]` and failed later as an out-of-range literal.
[[case]]
name = "integer_literal_at_an_array_local"
source = """
fn main() -> i32 {
    let x: [i32; 2] = 5;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected [i32; 2], found {integer}"]

# When the literal sets the expectation, as the first arm of an `if`, the
# other side is what was found.
[[case]]
name = "integer_literal_arm_sets_the_expectation"
source = """
fn main() -> i32 {
    let c = true;
    let x = if c { 5 } else { false };
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected integer type, found bool", "test.rue:3:31"]

# A local assignment points at the value, as a field or accessor-place
# assignment does.
[[case]]
name = "local_assignment_mismatch_points_at_the_value"
source = """
fn main() -> i32 {
    let mut w: i32 = 0;
    let x: bool = true;
    w = x;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected i32, found bool", "test.rue:4:9"]

# An array operand of an arithmetic operator is named, not shown as `<error>`
# (RUE-2562).
[[case]]
name = "array_operand_of_arithmetic_is_named"
source = """
fn main() -> i32 {
    let a: [i32; 2] = [1, 2];
    let b = a + [return 5; 2];
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected integer type, found [i32; 2]", "test.rue:3:13"]

[[case]]
name = "array_operand_of_compound_assignment_is_named"
source = """
fn main() -> i32 {
    let mut a: [i32; 2] = [1, 2];
    a += [return 5; 2];
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected integer type, found [i32; 2]"]

# An array left operand is named at the array before the literal operand is
# refused the array type: the operator's numeric check precedes the right
# operand's equality (RUE-2566).
[[case]]
name = "array_operand_beside_a_literal_is_named_at_the_array"
source = """
fn main() -> i32 {
    let a: [i32; 2] = [1, 2];
    let b = a * 2;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected integer type, found [i32; 2]", "test.rue:3:13"]

[[case]]
name = "array_compound_assignment_beside_a_literal_is_named_at_the_array"
source = """
fn main() -> i32 {
    let mut a: [i32; 2] = [1, 2];
    a += 1;
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected integer type, found [i32; 2]", "test.rue:3:5"]

# An annotated array literal checks each element against the annotation's
# element type before joining the elements, as a const initializer does.
[[case]]
name = "array_literal_element_is_checked_against_the_annotation"
source = """
fn main() -> i32 {
    let x: [bool; 2] = [1, true];
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected bool, found {integer}", "test.rue:2:25"]

# A string literal that cannot take the type its context expects is the found
# side, named by its own type `str` (3.7:44), as an integer or float literal
# is; the literal that sets a join's expectation keeps "expected string type"
# (RUE-2570).
[[case]]
name = "string_literal_at_a_bool_local"
source = """
fn main() -> i32 {
    let s: bool = "x";
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected bool, found str", "test.rue:2:5"]

[[case]]
name = "string_literal_at_an_integer_accessor_place"
source = """
struct P {
    w: i64,

    fn wr(inout self) -> inout i64 {
        yield self.w;
    }
}
fn main() -> i32 {
    let mut p = P { w: 1 };
    p.wr() = "x";
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected i64, found str", "test.rue:10:14"]

[[case]]
name = "string_literal_argument_at_a_bool_parameter"
source = """
fn f(b: bool) -> i32 { 0 }
fn main() -> i32 { f("x") }
"""
compile_fail = true
error_contains = ["E0206", "expected bool, found str", "test.rue:2:22"]

[[case]]
name = "string_literal_element_at_a_bool_array"
source = """
fn main() -> i32 {
    let a: [bool; 2] = [true, "x"];
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected bool, found str", "test.rue:2:31"]

[[case]]
name = "string_literal_arm_sets_the_expectation"
source = """
fn main() -> i32 {
    let c = true;
    let a = if c { "x" } else { false };
    0
}
"""
compile_fail = true
error_contains = ["E0206", "expected string type, found bool"]

# The const path names a string-literal element at a scalar slot as the body
# path does, instead of failing to reduce the initializer.
[[case]]
name = "string_literal_element_of_a_const_bool_array"
source = """
const A: [bool; 2] = [true, "x"];
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0206", "expected bool, found str", "test.rue:1:29"]
