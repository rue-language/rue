[section]
id = "diagnostics.call-argument-modes"
name = "Call argument mode diagnostics"
description = "Pins the targeted diagnostic for an explicit borrow/inout mode on an unmarked call parameter (RUE-634)."

[[case]]
name = "unexpected_borrow_argument_has_removal_help"
description = "E0209 names the unexpected source mode and explains that an unmarked parameter is passed without an explicit keyword."
source = """
fn take(x: i32) {}

fn main() {
    let x = 42;
    take(borrow x);
}
"""
compile_fail = true
error_contains = [
    "[E0209]",
    "unexpected `borrow` argument: the corresponding parameter is unmarked",
    "remove the `borrow` keyword; this argument is passed without an explicit mode",
]

[[case]]
name = "named_const_is_not_an_inout_place"
description = "A named constant is rejected during semantic analysis instead of reaching by-reference codegen (RUE-760)."
source = """
const VALUE: i32 = 42;

fn take(inout value: i32) {}

fn main() {
    take(inout VALUE);
}
"""
compile_fail = true
error_contains = [
    "[E0425]",
    "inout argument must be an lvalue",
]

[[case]]
name = "named_const_borrow_is_promoted"
description = "A named constant has no caller-visible storage, so a `borrow` of it is promoted to a static loan rather than rejected as a non-lvalue (RUE-953 supersedes the RUE-760 borrow case; `inout` above is unchanged)."
source = """
const VALUE: i32 = 42;

fn take(borrow value: i32) -> i32 { value }

fn main() -> i32 {
    take(borrow VALUE)
}
"""
exit_code = 42

[[case]]
name = "borrow_self_receiver_still_requires_a_place"
description = "E0427 survives borrow-operand elaboration: the implicit autoref of a `borrow self` receiver is not a `borrow` operand, so a computed receiver still has nothing to loan (RUE-953)."
source = """
struct Pair {
    value: i32,
    fn read(borrow self) -> i32 { self.value }
}

fn make() -> Pair { Pair { value: 1 } }

fn main() -> i32 {
    make().read()
}
"""
compile_fail = true
error_contains = [
    "[E0427]",
    "borrow argument must be a variable, field, or array element",
]
