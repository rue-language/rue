[section]
id = "diagnostics.call-argument-modes"
name = "Call argument mode diagnostics"
description = "Pins the targeted diagnostic for an explicit borrow/inout mode on an unmarked call parameter (RUE-634)."

[[case]]
name = "unexpected_borrow_argument_has_removal_help"
description = "E0209 names the unexpected source mode and explains that an unmarked parameter is passed without an explicit keyword."
source = """
fn take(x: i32) {}

fn main() {
    let x = 42;
    take(borrow x);
}
"""
compile_fail = true
error_contains = [
    "[E0209]",
    "unexpected `borrow` argument: the corresponding parameter is unmarked",
    "remove the `borrow` keyword; this argument is passed without an explicit mode",
]

[[case]]
name = "named_const_is_not_an_inout_place"
description = "A named constant is rejected during semantic analysis instead of reaching by-reference codegen (RUE-760)."
source = """
const VALUE: i32 = 42;

fn take(inout value: i32) {}

fn main() {
    take(inout VALUE);
}
"""
compile_fail = true
error_contains = [
    "[E0425]",
    "inout argument must be an lvalue",
]

[[case]]
name = "named_const_borrow_is_promoted"
description = "A named constant has no caller-visible storage, so a `borrow` of it is promoted to a static loan rather than rejected as a non-lvalue (RUE-953 supersedes the RUE-760 borrow case; `inout` above is unchanged)."
source = """
const VALUE: i32 = 42;

fn take(borrow value: i32) -> i32 { value }

fn main() -> i32 {
    take(borrow VALUE)
}
"""
exit_code = 42

[[case]]
name = "borrow_self_receiver_still_requires_a_place"
description = "E0427 survives borrow-operand elaboration: the implicit autoref of a `borrow self` receiver is not a `borrow` operand, so a computed receiver still has nothing to loan (RUE-953)."
source = """
struct Pair {
    value: i32,
    fn read(borrow self) -> i32 { self.value }
}

fn make() -> Pair { Pair { value: 1 } }

fn main() -> i32 {
    make().read()
}
"""
compile_fail = true
error_contains = [
    "[E0427]",
    "borrow argument must be a variable, field, or array element",
]

[[case]]
name = "inout_argument_requires_a_mutable_binding"
description = "An `inout` argument writes to the caller's place, so an immutable `let` binding is rejected with the same E0203 an assignment to it would give, plus an inout-specific help (RUE-2054, spec 6.1:43)."
source = """
fn bump(inout x: i32) { x = x + 1; }

fn main() -> i32 {
    let v = 1;
    bump(inout v);
    v
}
"""
compile_fail = true
error_contains = [
    "[E0203]",
    "cannot assign to immutable variable 'v'",
    "variable declared as immutable here",
    "an `inout` argument writes to the caller's place; make the binding mutable: `let mut v = ...`",
]

[[case]]
name = "inout_argument_of_a_for_pattern_binding_is_rejected"
description = "A `for` pattern binding is immutable like a `let`, so it is rejected on the same rule (RUE-2054, spec 6.1:43)."
source = """
fn bump(inout x: i32) { x = x + 1; }

fn main() -> i32 {
    let a = [1, 2, 3];
    for x in a {
        bump(inout x);
    }
    0
}
"""
compile_fail = true
error_contains = [
    "[E0203]",
    "cannot assign to immutable variable 'x'",
    "an `inout` argument writes to the caller's place; make the binding mutable: `let mut x = ...`",
]

[[case]]
name = "inout_argument_of_a_by_value_parameter_is_rejected"
description = "A by-value parameter is an immutable binding (spec 6.1:32), so passing it `inout` is the E0203 a `let` binding gets; the help names both repairs (spec 6.1:43, RUE-2079)."
source = """
fn bump(inout x: i32) { x = x + 1; }

fn takes(n: i32) -> i32 {
    bump(inout n);
    n
}

fn main() -> i32 { takes(41) }
"""
compile_fail = true
error_contains = [
    "[E0203]",
    "cannot assign to immutable variable 'n'",
    "copy the parameter into a mutable binding first: `let mut n = n;`, or make the parameter `inout n: i32`",
]

[[case]]
name = "inout_argument_of_a_by_value_receiver_is_rejected"
description = "A plain `self` receiver is a by-value parameter too; the help names `mut self` and `inout self` (spec 6.1:43, RUE-2079)."
source = """
struct C {
    v: i32,
    fn bump_self(self) -> i32 { bump(inout self); self.v }
}
fn bump(inout c: C) { c.v = c.v + 1; }

fn main() -> i32 { C { v: 41 }.bump_self() }
"""
compile_fail = true
error_contains = [
    "[E0203]",
    "cannot assign to immutable variable 'self'",
    "declare the receiver `mut self` to mutate the callee's copy, or `inout self` to write back to the caller",
]
