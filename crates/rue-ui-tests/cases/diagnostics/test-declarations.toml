[section]
id = "diagnostics.test-declarations"
name = "Test declaration diagnostics"
description = """
ADR-0083 (RUE-1618), stabilized by RUE-1955: a test declaration compiles with
no flag, in an ordinary executable build included — plus the duplicate-name
diagnostic and the modifiers the grammar does not accept.
"""

[[case]]
name = "no_preview_gate_for_a_test_item"
description = "Spec 6.7:11 — test declarations are stable, so no E1100 is emitted for one. The request is an ordinary executable build, which is the case that used to be gated: a test item is in its parsed closure."
source = """
fn main() -> i32 { 0 }
test "needs no flag" { }
"""
exit_code = 0
no_warnings = true

[[case]]
name = "duplicate_test_names_name_the_test_and_its_first_declaration"
description = "The duplicate diagnostic quotes the test name and labels the first declaration, so a reader can see both sites."
source = """
test "same name" { }
test "same name" { }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "E0262",
    "duplicate test definition: \"same name\" is already defined in this module",
    "first defined in",
]

[[case]]
name = "pub_is_not_part_of_the_test_production"
description = "`test` takes no visibility modifier; the item dispatch reports the ordinary unexpected-token error and names `test` among the item prefixes it expected."
source = """
pub test "not public" { }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = [
    "E0100",
    "expected '@' or 'pub' or 'unchecked' or 'fn' or 'test' or …",
]

[[case]]
name = "a_bare_test_identifier_is_not_a_test_declaration"
description = "`test` is a contextual keyword: without a following string literal it is an ordinary identifier, so `test { }` at item position is an unknown item prefix."
source = """
test { }
fn main() -> i32 { 0 }
"""
compile_fail = true
error_contains = ["E0100", "'test'"]
