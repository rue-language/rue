[section]
id = "diagnostics.test-declarations"
name = "Test declaration diagnostics"
description = """
ADR-0083 Phase 1 (RUE-1618). The two-sided `test_declarations` preview gate —
E1100 without `--preview test_declarations`, and an ordinary compile with it,
since Phase 1 ships the declaration whole — plus the duplicate-name diagnostic
and the modifiers the grammar does not accept.
"""

[[case]]
name = "gated_without_the_preview_flag"
description = "Spec 8.4:1 — a gated feature errors without its flag, and the help names the flag and the ADR. The request is an ordinary executable build: a test item in the closure gates it too."
source = """
fn main() -> i32 { 0 }
test "needs the flag" { }
"""
compile_fail = true
error_contains = [
    "E1100",
    "a test declaration requires preview feature `test_declarations`",
    "use --preview test_declarations to enable this feature (ADR-0083)",
]

[[case]]
name = "enabled_by_the_preview_flag"
description = "With the flag the declaration compiles: unlike the float gate, Phase 1 ships the whole declaration, so nothing stops at a phase marker."
source = """
fn main() -> i32 { 0 }
test "needs the flag" { }
"""
preview = "test_declarations"
exit_code = 0

[[case]]
name = "duplicate_test_names_name_the_test_and_its_first_declaration"
description = "The duplicate diagnostic quotes the test name and labels the first declaration, so a reader can see both sites."
source = """
test "same name" { }
test "same name" { }
fn main() -> i32 { 0 }
"""
preview = "test_declarations"
compile_fail = true
error_contains = [
    "E0262",
    "duplicate test definition: \"same name\" is already defined in this module",
    "first defined in",
]

[[case]]
name = "pub_is_not_part_of_the_test_production"
description = "`test` takes no visibility modifier; the item dispatch reports the ordinary unexpected-token error and names `test` among the item prefixes it expected."
source = """
pub test "not public" { }
fn main() -> i32 { 0 }
"""
preview = "test_declarations"
compile_fail = true
error_contains = [
    "E0100",
    "expected '@' or 'pub' or 'unchecked' or 'fn' or 'test' or …",
]

[[case]]
name = "a_bare_test_identifier_is_not_a_test_declaration"
description = "`test` is a contextual keyword: without a following string literal it is an ordinary identifier, so `test { }` at item position is an unknown item prefix."
source = """
test { }
fn main() -> i32 { 0 }
"""
preview = "test_declarations"
compile_fail = true
error_contains = ["E0100", "'test'"]
