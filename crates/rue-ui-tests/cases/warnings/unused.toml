[section]
id = "warnings.unused"
name = "Unused Variable and Function Warnings"
description = "Tests for detection of unused variables and functions."

# =============================================================================
# Unused Variables
# =============================================================================

[[case]]
name = "unused_variable_warning"
source = """
fn main() -> i32 {
    let x = 42;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 1

[[case]]
name = "used_variable_no_warning"
source = """
fn main() -> i32 {
    let x = 42;
    x
}
"""
exit_code = 42
no_warnings = true

[[case]]
name = "multiple_unused_variables"
source = """
fn main() -> i32 {
    let a = 1;
    let b = 2;
    let c = 3;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable"]
expected_warning_count = 3

[[case]]
name = "underscore_prefix_suppresses_warning"
source = """
fn main() -> i32 {
    let _unused = 42;
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "mutable_but_unused"
source = """
fn main() -> i32 {
    let mut x = 42;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'x'"]

[[case]]
name = "used_in_expression"
source = """
fn main() -> i32 {
    let x = 10;
    let y = 20;
    x + y
}
"""
exit_code = 30
no_warnings = true

[[case]]
name = "unused_shadowed_variable"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
    };
    x
}
"""
exit_code = 1
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 1

[[case]]
name = "used_shadowed_variable_no_warning"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
        x
    }
}
"""
exit_code = 2
no_warnings = true

[[case]]
name = "both_shadowing_variables_unused"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
    };
    0
}
"""
exit_code = 0
warning_contains = ["unused variable"]
expected_warning_count = 2

[[case]]
name = "deeply_nested_shadowing_all_unused"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
        {
            let x = 3;
            {
                let x = 4;
            };
        };
    };
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 4

[[case]]
name = "deeply_nested_shadowing_innermost_used"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
        {
            let x = 3;
            x
        }
    }
}
"""
exit_code = 3
# When innermost is used as the return value, shadowed outer variables
# are not warned about (consistent with used_shadowed_variable_no_warning)
no_warnings = true

[[case]]
name = "deeply_nested_shadowing_outermost_used"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
        {
            let x = 3;
        };
    };
    x
}
"""
exit_code = 1
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 2

[[case]]
name = "shadowed_variables_include_line_numbers"
description = "When multiple unused variables share the same name, include line numbers for disambiguation"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
    };
    0
}
"""
exit_code = 0
warning_contains = ["unused variable 'x' (line", "line 2)", "line 4)"]
expected_warning_count = 2

# =============================================================================
# Place reads mark the base variable as used (RUE-135)
# =============================================================================

[[case]]
name = "field_read_in_tail_position_no_warning"
description = "A tail-position field read uses the base variable (RUE-135)"
source = """
struct S { a: i32 }

fn main() -> i32 {
    let s = S { a: 5 };
    s.a
}
"""
exit_code = 5
no_warnings = true

[[case]]
name = "method_call_on_field_receiver_no_warning"
description = "A method call on a field receiver uses the base variable (RUE-135)"
source = """
struct H { s: String }

fn main() -> i32 {
    let h = H { s: "hello" };
    let n = h.s.len();
    if n == 5 { 5 } else { 0 }
}
"""
exit_code = 5
no_warnings = true

[[case]]
name = "field_read_as_call_argument_no_warning"
description = "Passing a field read as a call argument uses the base variable (RUE-135)"
source = """
struct S { a: i32 }

fn g(x: i32) -> i32 { x }

fn main() -> i32 {
    let s = S { a: 5 };
    g(s.a)
}
"""
exit_code = 5
no_warnings = true

[[case]]
name = "array_index_read_no_warning"
description = "Indexing an array uses the base variable (RUE-135)"
source = """
fn main() -> i32 {
    let a = [7, 2, 3];
    a[0]
}
"""
exit_code = 7
no_warnings = true

[[case]]
name = "nested_field_read_no_warning"
description = "A nested field read (o.inner.v) uses the outermost base variable (RUE-18)"
source = """
struct Inner { v: i32 }
struct Outer { inner: Inner }

fn main() -> i32 {
    let o = Outer { inner: Inner { v: 5 } };
    o.inner.v
}
"""
exit_code = 5
no_warnings = true

[[case]]
name = "dbg_field_operand_no_warning"
description = "A field read as a @dbg operand uses the base variable (RUE-135)"
source = """
struct S { a: i32 }

fn main() -> i32 {
    let s = S { a: 5 };
    @dbg(s.a);
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "dbg_indexed_array_field_operand_no_warning"
description = "A field-then-index read (s.items[0]) as a @dbg operand uses the base variable (RUE-18)"
source = """
struct S { items: [i32; 3] }

fn main() -> i32 {
    let s = S { items: [1, 2, 3] };
    @dbg(s.items[0]);
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "field_write_counts_as_use"
description = "Writing through a projection (s.a = ...) uses the base variable"
source = """
struct S { a: i32 }

fn main() -> i32 {
    let mut s = S { a: 5 };
    s.a = 7;
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "unused_struct_variable_still_warns"
description = "A struct variable that is never read or projected still warns"
source = """
struct S { a: i32 }

fn main() -> i32 {
    let s = S { a: 5 };
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'s'"]
expected_warning_count = 1

[[case]]
name = "direct_assignment_only_still_warns"
description = "Assigning directly to a variable (not through a projection) does not count as a use"
source = """
fn main() -> i32 {
    let mut x = 5;
    x = 6;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 1

