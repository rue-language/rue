[section]
id = "warnings.unused"
name = "Unused Variable and Function Warnings"
description = "Tests for detection of unused variables and functions."

# =============================================================================
# Unused Variables
# =============================================================================

[[case]]
name = "unused_variable_warning"
source = """
fn main() -> i32 {
    let x = 42;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 1

[[case]]
name = "used_variable_no_warning"
source = """
fn main() -> i32 {
    let x = 42;
    x
}
"""
exit_code = 42
no_warnings = true

[[case]]
name = "multiple_unused_variables"
source = """
fn main() -> i32 {
    let a = 1;
    let b = 2;
    let c = 3;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable"]
expected_warning_count = 3

[[case]]
name = "underscore_prefix_suppresses_warning"
source = """
fn main() -> i32 {
    let _unused = 42;
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "mutable_but_unused"
source = """
fn main() -> i32 {
    let mut x = 42;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'x'"]

[[case]]
name = "used_in_expression"
source = """
fn main() -> i32 {
    let x = 10;
    let y = 20;
    x + y
}
"""
exit_code = 30
no_warnings = true

[[case]]
name = "unused_shadowed_variable"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
    };
    x
}
"""
exit_code = 1
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 1

[[case]]
name = "used_shadowed_variable_no_warning"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
        x
    }
}
"""
exit_code = 2
no_warnings = true

[[case]]
name = "both_shadowing_variables_unused"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
    };
    0
}
"""
exit_code = 0
warning_contains = ["unused variable"]
expected_warning_count = 2

[[case]]
name = "deeply_nested_shadowing_all_unused"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
        {
            let x = 3;
            {
                let x = 4;
            };
        };
    };
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 4

[[case]]
name = "deeply_nested_shadowing_innermost_used"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
        {
            let x = 3;
            x
        }
    }
}
"""
exit_code = 3
# When innermost is used as the return value, shadowed outer variables
# are not warned about (consistent with used_shadowed_variable_no_warning)
no_warnings = true

[[case]]
name = "deeply_nested_shadowing_outermost_used"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
        {
            let x = 3;
        };
    };
    x
}
"""
exit_code = 1
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 2

[[case]]
name = "shadowed_variables_include_line_numbers"
description = "When multiple unused variables share the same name, include line numbers for disambiguation"
source = """
fn main() -> i32 {
    let x = 1;
    {
        let x = 2;
    };
    0
}
"""
exit_code = 0
warning_contains = ["unused variable 'x' (line", "line 2)", "line 4)"]
expected_warning_count = 2

# =============================================================================
# Place reads mark the base variable as used (RUE-135)
# =============================================================================

[[case]]
name = "field_read_in_tail_position_no_warning"
description = "A tail-position field read uses the base variable (RUE-135)"
source = """
struct S { a: i32 }

fn main() -> i32 {
    let s = S { a: 5 };
    s.a
}
"""
exit_code = 5
no_warnings = true

[[case]]
name = "method_call_on_field_receiver_no_warning"
description = "A method call on a field receiver uses the base variable (RUE-135)"
source = """
const std = @import("std");
const StrBuf = std.strbuf.StrBuf;

struct H { s: StrBuf }

fn main() -> i32 {
    let h = H { s: "hello" };
    let n = h.s.len();
    if n == 5 { 5 } else { 0 }
}
"""
exit_code = 5
no_warnings = true
real_std = true

[[case]]
name = "field_read_as_call_argument_no_warning"
description = "Passing a field read as a call argument uses the base variable (RUE-135)"
source = """
struct S { a: i32 }

fn g(x: i32) -> i32 { x }

fn main() -> i32 {
    let s = S { a: 5 };
    g(s.a)
}
"""
exit_code = 5
no_warnings = true

[[case]]
name = "array_index_read_no_warning"
description = "Indexing an array uses the base variable (RUE-135)"
source = """
fn main() -> i32 {
    let a = [7, 2, 3];
    a[0]
}
"""
exit_code = 7
no_warnings = true

[[case]]
name = "nested_field_read_no_warning"
description = "A nested field read (o.inner.v) uses the outermost base variable (RUE-18)"
source = """
struct Inner { v: i32 }
struct Outer { inner: Inner }

fn main() -> i32 {
    let o = Outer { inner: Inner { v: 5 } };
    o.inner.v
}
"""
exit_code = 5
no_warnings = true

[[case]]
name = "dbg_field_operand_no_warning"
description = "A field read as a @dbg operand uses the base variable (RUE-135)"
source = """
struct S { a: i32 }

fn main() -> i32 {
    let s = S { a: 5 };
    @dbg(s.a);
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "dbg_indexed_array_field_operand_no_warning"
description = "A field-then-index read (s.items[0]) as a @dbg operand uses the base variable (RUE-18)"
source = """
struct S { items: [i32; 3] }

fn main() -> i32 {
    let s = S { items: [1, 2, 3] };
    @dbg(s.items[0]);
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "field_write_counts_as_use"
description = "Writing through a projection (s.a = ...) uses the base variable"
source = """
struct S { a: i32 }

fn main() -> i32 {
    let mut s = S { a: 5 };
    s.a = 7;
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "unused_struct_variable_still_warns"
description = "A struct variable that is never read or projected still warns"
source = """
struct S { a: i32 }

fn main() -> i32 {
    let s = S { a: 5 };
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'s'"]
expected_warning_count = 1

[[case]]
name = "direct_assignment_only_still_warns"
description = "Assigning directly to a variable (not through a projection) does not count as a use"
source = """
fn main() -> i32 {
    let mut x = 5;
    x = 6;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'x'"]
expected_warning_count = 1

# =============================================================================
# Unused Functions
# =============================================================================

[[case]]
name = "unused_function_warning"
source = """
fn unused_helper() -> i32 { 42 }

fn main() -> i32 {
    0
}
"""
exit_code = 0
warning_contains = ["unused function", "'unused_helper'"]
expected_warning_count = 1

[[case]]
name = "called_function_no_warning"
source = """
fn helper() -> i32 { 42 }

fn main() -> i32 {
    helper()
}
"""
exit_code = 42
no_warnings = true

[[case]]
name = "helper_referenced_only_from_unreachable_function_is_not_unused"
source = """
fn helper() -> i32 { 42 }
fn dormant() -> i32 { helper() }

fn main() -> i32 { 0 }
"""
exit_code = 0
warning_contains = ["unused function", "'dormant'"]
expected_warning_count = 1

[[case]]
name = "local_callable_alias_marks_function_used"
source = """
fn helper() -> i32 { 42 }
fn dormant() -> i32 {
    let callable = helper;
    callable()
}

fn main() -> i32 { 0 }
"""
exit_code = 0
warning_contains = ["unused function", "'dormant'"]
expected_warning_count = 1

[[case]]
name = "local_name_collision_does_not_mark_function_used"
source = """
fn helper() -> i32 { 42 }
fn _dormant() -> i32 {
    let helper = 7;
    helper
}

fn main() -> i32 { 0 }
"""
exit_code = 0
warning_contains = ["unused function", "'helper'"]
expected_warning_count = 1

[[case]]
name = "field_name_collision_does_not_mark_function_used"
source = """
fn helper() -> i32 { 42 }
struct Holder { helper: i32 }
fn _dormant() -> i32 { Holder { helper: 7 }.helper }

fn main() -> i32 { 0 }
"""
exit_code = 0
warning_contains = ["unused function", "'helper'"]
expected_warning_count = 1

[[case]]
name = "member_call_collision_does_not_mark_free_function_used"
source = """
fn helper() -> i32 { 42 }
struct Holder {
    value: i32,
    fn helper(borrow self) -> i32 { self.value }
}
fn _dormant() -> i32 { Holder { value: 7 }.helper() }

fn main() -> i32 { 0 }
"""
exit_code = 0
warning_contains = ["unused function", "'helper'"]
expected_warning_count = 1

[[case]]
name = "comment_and_string_collision_do_not_mark_function_used"
source = """
fn helper() -> i32 { 42 }
fn _dormant() -> str {
    // helper() is deliberately only comment text.
    "helper"
}

fn main() -> i32 { 0 }
"""
exit_code = 0
warning_contains = ["unused function", "'helper'"]
expected_warning_count = 1

[[case]]
name = "reached_comptime_provider_preserves_body_warnings"
source = """
fn Make() -> type {
    let unused = 1;
    struct { value: i32 }
}

fn main() -> i32 {
    let T = Make();
    let value = T { value: 0 };
    value.value
}
"""
exit_code = 0
warning_contains = ["unused variable", "'unused'"]
expected_warning_count = 1

[[case]]
name = "type_position_use_no_warning_signature"
source = """
fn Pair(comptime T: type) -> type { struct { a: T } }
fn take(p: Pair(i32)) -> i32 { p.a }

fn main() -> i32 {
    let P = Pair(i32);
    take(P { a: 42 })
}
"""
exit_code = 42
no_warnings = true

[[case]]
name = "type_position_use_no_warning_member_types"
source = """
fn Vec(comptime T: type) -> type { struct { x: T } }
enum Holder {
    Full(Vec(i32)),
    Empty,
}

fn main() -> i32 {
    let V = Vec(i32);
    match Holder.Full(V { x: 42 }) {
        Holder.Full(v) => v.x,
        Holder.Empty => 0,
    }
}
"""
exit_code = 42
no_warnings = true

[[case]]
name = "type_position_use_composite_annotation_no_warning"
source = """
fn Wrap(comptime T: type) -> type { struct { a: T } }
fn use_it(arr: [Wrap(i32); 2]) -> i32 { arr[0].a }

fn main() -> i32 {
    0
}
"""
# Wrap is referenced only inside use_it's composite parameter annotation, so
# only the (genuinely unused) use_it may be flagged — Wrap must not be.
exit_code = 0
warning_contains = ["unused function", "'use_it'"]
expected_warning_count = 1

[[case]]
name = "array_length_constructor_reference_no_warning"
source = """
fn Width(comptime T: type) -> i32 { 2 }
const I = i32;
fn use_it(arr: [i32; Width(I)]) -> i32 { arr[0] }

fn main() -> i32 {
    0
}
"""
# Width is referenced only as the value-returning comptime call in an array
# length. The canonical type-call observation marks it referenced; only the
# otherwise unreachable use_it function is unused.
exit_code = 0
warning_contains = ["unused function", "'use_it'"]
expected_warning_count = 1

[[case]]
name = "unused_type_constructor_still_warns"
source = """
fn Unused(comptime T: type) -> type { struct { a: T } }

fn main() -> i32 {
    0
}
"""
exit_code = 0
warning_contains = ["unused function", "'Unused'"]
expected_warning_count = 1

[[case]]
name = "unused_variable_in_generic_body_warns"
description = "A specialized generic body surfaces its warnings like any other body (RUE-574)"
source = """
fn gen(comptime n: i32) -> i32 {
    let unused = 99;
    n
}

fn main() -> i32 {
    gen(42)
}
"""
exit_code = 42
warning_contains = ["unused variable", "'unused'"]
expected_warning_count = 1

[[case]]
name = "generic_body_warning_deduped_across_specializations"
description = "N specializations of one generic body emit each warning once (RUE-555 dedup, extended by RUE-574)"
source = """
fn gen(comptime n: i32) -> i32 {
    let unused = 99;
    n
}

fn main() -> i32 {
    gen(20) + gen(22)
}
"""
exit_code = 42
warning_contains = ["unused variable", "'unused'"]
expected_warning_count = 1

[[case]]
name = "multiple_unused_functions"
source = """
fn helper1() -> i32 { 1 }
fn helper2() -> i32 { 2 }
fn helper3() -> i32 { 3 }

fn main() -> i32 {
    0
}
"""
exit_code = 0
warning_contains = ["unused function"]
expected_warning_count = 3

[[case]]
name = "underscore_prefix_function_no_warning"
source = """
fn _unused_helper() -> i32 { 42 }

fn main() -> i32 {
    0
}
"""
exit_code = 0
no_warnings = true

# =============================================================================
# @allow directive tests
# =============================================================================

[[case]]
name = "allow_unused_variable_suppresses_warning"
source = """
fn main() -> i32 {
    @allow(unused_variable)
    let x = 42;
    0
}
"""
exit_code = 0
no_warnings = true

[[case]]
name = "allow_unused_variable_only_affects_annotated"
source = """
fn main() -> i32 {
    @allow(unused_variable)
    let x = 42;
    let y = 10;
    0
}
"""
exit_code = 0
warning_contains = ["unused variable", "'y'"]
expected_warning_count = 1

[[case]]
name = "allow_unused_variable_multiple_args"
source = """
fn main() -> i32 {
    @allow(unused_variable, unreachable_code)
    let x = 42;
    0
}
"""
exit_code = 0
no_warnings = true

# =============================================================================
# Mixed unused warnings
# =============================================================================

[[case]]
name = "mixed_unused_warnings"
source = """
fn unused_fn() -> i32 { 42 }

fn main() -> i32 {
    let unused_var = 10;
    0
}
"""
exit_code = 0
warning_contains = ["unused function", "unused variable"]
expected_warning_count = 2
