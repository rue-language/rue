[section]
id = "warnings.unreachable"
name = "Unreachable Code Warnings"
description = "Tests for unreachable code detection and warnings."

# =============================================================================
# Unreachable after return
# =============================================================================

[[case]]
name = "unreachable_after_return"
source = """
fn main() -> i32 {
    return 42;
    0
}
"""
exit_code = 42
warning_contains = ["unreachable"]
expected_warning_count = 1

[[case]]
name = "unreachable_statement_after_return"
source = """
fn main() -> i32 {
    return 42;
    let x = 10;
    x
}
"""
exit_code = 42
warning_contains = ["unreachable"]
expected_warning_count = 1

[[case]]
name = "unreachable_after_panic_statement"
source = """
fn main() -> i32 {
    @panic("stop");
    0
}
"""
exit_code = 101
warning_contains = ["unreachable"]
expected_warning_count = 1

[[case]]
name = "no_warning_without_unreachable_code"
source = """
fn main() -> i32 {
    let x = 42;
    x
}
"""
exit_code = 42
no_warnings = true

# =============================================================================
# Unreachable in control flow
# =============================================================================

[[case]]
name = "unreachable_after_return_in_if"
source = """
fn test() -> i32 {
    if true {
        return 1;
        42
    } else {
        2
    }
}
fn main() -> i32 { test() }
"""
exit_code = 1
warning_contains = ["unreachable"]
expected_warning_count = 1

[[case]]
name = "no_warning_when_both_branches_return"
source = """
fn test(x: bool) -> i32 {
    if x {
        return 1;
    } else {
        return 2;
    }
}
fn main() -> i32 { test(true) }
"""
exit_code = 1
no_warnings = true

# =============================================================================
# Unreachable in loops
# =============================================================================

[[case]]
name = "unreachable_after_return_in_loop"
source = """
fn main() -> i32 {
    while true {
        return 42;
        0
    }
    0
}
"""
exit_code = 42
warning_contains = ["unreachable"]

# =============================================================================
# Match with unreachable
# =============================================================================

[[case]]
name = "unreachable_after_return_in_match_arm"
source = """
fn test(x: i32) -> i32 {
    match x {
        1 => {
            return 10;
            20
        },
        _ => 0,
    }
}
fn main() -> i32 { test(1) }
"""
exit_code = 10
warning_contains = ["unreachable"]
expected_warning_count = 1

# =============================================================================
# Unreachable patterns in match expressions
# =============================================================================

[[case]]
name = "duplicate_integer_pattern"
source = """
fn main() -> i32 {
    match 1 {
        1 => 10,
        1 => 20,
        _ => 0,
    }
}
"""
exit_code = 10
warning_contains = ["unreachable pattern", "'1'"]
expected_warning_count = 1

[[case]]
name = "duplicate_boolean_pattern_true"
source = """
fn main() -> i32 {
    match true {
        true => 10,
        true => 20,
        false => 0,
    }
}
"""
exit_code = 10
warning_contains = ["unreachable pattern", "'true'"]
expected_warning_count = 1

[[case]]
name = "duplicate_boolean_pattern_false"
source = """
fn main() -> i32 {
    match false {
        true => 10,
        false => 20,
        false => 30,
    }
}
"""
exit_code = 20
warning_contains = ["unreachable pattern", "'false'"]
expected_warning_count = 1

[[case]]
name = "pattern_after_wildcard"
source = """
fn main() -> i32 {
    match 5 {
        _ => 10,
        1 => 20,
    }
}
"""
exit_code = 10
warning_contains = ["unreachable pattern", "'1'"]
expected_warning_count = 1

[[case]]
name = "multiple_patterns_after_wildcard"
source = """
fn main() -> i32 {
    match 5 {
        _ => 10,
        1 => 20,
        2 => 30,
    }
}
"""
exit_code = 10
warning_contains = ["unreachable pattern"]
expected_warning_count = 2

# =============================================================================
# Unreachable patterns in comptime-specialized matches (RUE-555)
#
# A `match` on a comptime value parameter is pruned to its selected arm during
# specialization, but unreachable-pattern warnings (spec 4.7:20) are a property
# of the pattern set and must still fire — the same warning a structurally
# identical ordinary match produces.
# =============================================================================

[[case]]
name = "comptime_specialized_match_unreachable_pattern"
source = """
fn specialized(comptime n: i32) -> i32 {
    match n {
        _ => 42,
        1 => 0,
    }
}
fn main() -> i32 {
    specialized(1)
}
"""
exit_code = 42
warning_contains = ["unreachable pattern", "'1'"]
expected_warning_count = 1

[[case]]
name = "comptime_and_ordinary_match_both_warn"
source = """
fn specialized(comptime n: i32) -> i32 {
    match n {
        _ => 42,
        1 => 0,
    }
}
fn ordinary(n: i32) -> i32 {
    match n {
        _ => 42,
        1 => 0,
    }
}
fn main() -> i32 {
    specialized(1) + ordinary(0) - 42
}
"""
exit_code = 42
warning_contains = ["unreachable pattern"]
expected_warning_count = 2

# Two specializations of the same generic fn share one source location, so the
# structural warning is reported once, not once per specialization.
[[case]]
name = "comptime_specialized_match_warning_deduplicated"
source = """
fn specialized(comptime n: i32) -> i32 {
    match n {
        _ => 42,
        1 => 0,
    }
}
fn main() -> i32 {
    specialized(1) + specialized(2) - 84
}
"""
exit_code = 0
warning_contains = ["unreachable pattern", "'1'"]
expected_warning_count = 1

# A duplicate integer literal (before any wildcard) in a specialized body is
# unreachable too, exercising the non-wildcard warning path.
[[case]]
name = "comptime_specialized_match_duplicate_literal"
source = """
fn specialized(comptime n: i32) -> i32 {
    match n {
        1 => 10,
        1 => 20,
        _ => 30,
    }
}
fn main() -> i32 {
    specialized(1) - 10
}
"""
exit_code = 0
warning_contains = ["unreachable pattern", "'1'"]
expected_warning_count = 1

[[case]]
name = "duplicate_wildcard"
source = """
fn main() -> i32 {
    match 5 {
        _ => 10,
        _ => 20,
    }
}
"""
exit_code = 10
warning_contains = ["unreachable pattern", "'_'"]
expected_warning_count = 1

[[case]]
name = "multiple_duplicate_integers"
source = """
fn main() -> i32 {
    match 1 {
        1 => 10,
        2 => 20,
        1 => 30,
        2 => 40,
        _ => 0,
    }
}
"""
exit_code = 10
warning_contains = ["unreachable pattern"]
expected_warning_count = 2

[[case]]
name = "no_warning_distinct_patterns"
source = """
fn main() -> i32 {
    match 2 {
        1 => 10,
        2 => 20,
        3 => 30,
        _ => 0,
    }
}
"""
exit_code = 20
no_warnings = true

[[case]]
name = "no_warning_bool_exhaustive"
source = """
fn main() -> i32 {
    match true {
        true => 10,
        false => 20,
    }
}
"""
exit_code = 10
no_warnings = true

# RUE-75: a duplicate enum-variant match arm must warn (it previously slipped
# through silently, unlike duplicate integer/boolean patterns). The first arm
# wins at runtime; the second is unreachable.
[[case]]
name = "duplicate_enum_variant_pattern"
source = """
enum Dir { N, S }
fn main() -> i32 {
    match Dir.N {
        Dir.N => 1,
        Dir.N => 2,
        Dir.S => 3,
    }
}
"""
exit_code = 1
warning_contains = ["unreachable pattern", "'Dir.N'"]
expected_warning_count = 1

# Negative control: distinct variants must NOT warn.
[[case]]
name = "distinct_enum_variant_patterns_no_warning"
source = """
enum Dir { N, S }
fn main() -> i32 {
    match Dir.S {
        Dir.N => 1,
        Dir.S => 3,
    }
}
"""
exit_code = 3
no_warnings = true

# RUE-168: a `_` arm is unreachable when the preceding arms already cover
# every possible value (both bools, or every enum variant). Spec 4.7:17 and
# 4.7:20 mandate the warning; it previously only fired after an earlier `_`.
[[case]]
name = "wildcard_after_full_enum_coverage"
source = """
enum Color { Red, Green }
fn main() -> i32 {
    match Color.Red {
        Color.Red => 1,
        Color.Green => 2,
        _ => 3,
    }
}
"""
exit_code = 1
warning_contains = ["unreachable pattern", "'_'", "already cover every possible value"]
expected_warning_count = 1

[[case]]
name = "wildcard_after_full_internal_non_exhaustive_enum_coverage"
description = "The non-exhaustive contract affects importing modules only; a defining-module wildcard remains unreachable."
preview = "non_exhaustive_enums"
source = """
@non_exhaustive pub enum Color { Red, Green }
fn main() -> i32 {
    match Color.Red {
        Color.Red => 1,
        Color.Green => 2,
        _ => 3,
    }
}
"""
exit_code = 1
warning_contains = ["unreachable pattern", "'_'", "already cover every possible value"]
expected_warning_count = 1

[[case]]
name = "wildcard_after_full_bool_coverage"
source = """
fn main() -> i32 {
    match false {
        true => 1,
        false => 2,
        _ => 3,
    }
}
"""
exit_code = 2
warning_contains = ["unreachable pattern", "'_'", "already cover every possible value"]
expected_warning_count = 1

# Negative control: a `_` arm with enum variants still missing is load-bearing
# and must NOT warn.
[[case]]
name = "wildcard_covering_missing_enum_variant_no_warning"
source = """
enum Color { Red, Green, Blue }
fn main() -> i32 {
    match Color.Blue {
        Color.Red => 1,
        Color.Green => 2,
        _ => 3,
    }
}
"""
exit_code = 3
no_warnings = true

# Negative control: integers are never exhausted by literal arms, so the
# wildcard is always reachable there.
[[case]]
name = "wildcard_after_int_literals_no_warning"
source = """
fn main() -> i32 {
    match 7 {
        1 => 1,
        2 => 2,
        _ => 3,
    }
}
"""
exit_code = 3
no_warnings = true
