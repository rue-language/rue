name: Cache probe

# Validates + measures the BuildBuddy remote cache (RUE-316). Non-blocking:
# never gates a merge. Run manually with `gh workflow run cache-probe.yml`
# (on a repo that has the BUILDBUDDY_API_KEY secret). It builds the same release
# target graph as CI, clears the local buck-out, and rebuilds. The workflow fails
# unless the second build converts locally executed cold actions into cache hits.
#
# RUE-1165: it also runs on a schedule, so cache health is a standing signal
# rather than something a human has to think to ask for. A silently degraded
# cache does not turn any lane red — it just makes every lane slower — so
# without a recurring cold-to-warm probe the regression is invisible until
# someone notices CI got expensive.
#
# The rue-program-warm job is ADR-0070 Phase 1's positive warm-cache control
# (RUE-1405): unlike the probe above, its warm build runs from a RELOCATED
# checkout root, because cross-root cache service is the property the
# rue_program manifest re-anchoring exists to guarantee and the one that lets
# a pull_request run's compile be consumed by the merge_group run.
on:
  schedule:
    # Mondays 05:00 UTC, ahead of the working week and clear of the 06:00
    # release suite so the two do not contend for the same runner pool.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # A cold build of the whole release graph plus a full rebuild is the point
    # of the probe, not an anomaly; give it the same headroom as the scheduled
    # release suite instead of the 6-hour default.
    timeout-minutes: 120
    env:
      # A rerun gets a fresh namespace too, so its first build must be cold.
      CACHE_PROBE_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2

      - name: Guard — secret present
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is not set on this repo — nothing to probe."
            exit 1
          fi

      - name: Provision the private cache config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Cold release build (populates the remote cache)
        run: |
          set +e
          /usr/bin/time -v ./buck2 build --prefer-local //crates/... --target-platforms //platforms:release -c "rue.cache_probe_nonce=$CACHE_PROBE_NONCE" >cold.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Cold build failure (complete log)"
            cat cold.log
            echo "::endgroup::"
            echo "::error::Cold cache-probe build failed with exit $status"
            exit "$status"
          fi
          grep -E '(Cache hits:|Commands:|Network:)' cold.log | tail -3 || tail -10 cold.log

      - name: Clear local buck-out, rebuild release (should hit the remote cache)
        run: |
          ./buck2 clean
          set +e
          /usr/bin/time -v ./buck2 build --prefer-local //crates/... --target-platforms //platforms:release -c "rue.cache_probe_nonce=$CACHE_PROBE_NONCE" >warm.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Warm build failure (complete log)"
            cat warm.log
            echo "::endgroup::"
            echo "::error::Warm cache-probe build failed with exit $status"
            exit "$status"
          fi
          grep -E '(Cache hits:|Commands:|Network:)' warm.log | tail -3 || tail -10 warm.log

          scripts/check-cache-probe cold.log warm.log

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cache-probe-logs
          path: |
            cold.log
            warm.log
          if-no-files-found: warn

      - name: Cache-hit summary
        if: always()
        run: |
          command_summary() {
            if [ -f "$1" ]; then
              grep -oE 'Commands: .*' "$1" | tail -1 || echo "unavailable (build failed before Buck summary)"
            else
              echo "unavailable (step did not run)"
            fi
          }
          {
            echo "### Remote cache probe"
            echo '```'
            echo "COLD: $(command_summary cold.log)"
            echo "WARM: $(command_summary warm.log)"
            echo '```'
            echo "The per-attempt nonce makes COLD unique; the probe verifies that WARM reuses results populated by COLD."
          } >> "$GITHUB_STEP_SUMMARY"

  # ADR-0070's positive warm-cache control (RUE-1405, extended by RUE-1406).
  # Cold-builds the two canary rue_programs and the nine staged CLI programs
  # under a fresh nonce, then from a relocated checkout root re-runs the
  # canaries' four consuming scenarios and rebuilds //:cli-staged-programs,
  # failing unless the scan/derive/compile actions were all served by the
  # remote cache. The nonce keys the Rust toolchain, so the cold half also
  # rebuilds the compiler — that is what makes "cold" provable, and it is why
  # this rides the scheduled probe rather than a per-PR lane.
  rue-program-warm:
    runs-on: ubuntu-latest
    # Raised from 60 with RUE-1406: the cold half now also compiles the nine
    # staged CLI programs, meridian's full 36k-line root among them.
    timeout-minutes: 90
    env:
      RUE_CACHE_PROBE_NONCE: rue-program-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2

      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: ~/.cache/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Guard — secret present
        env:
          KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is not set on this repo — nothing to probe."
            exit 1
          fi

      - name: Provision the private cache config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Check rue_program warm cache across relocated roots
        run: scripts/check-rue-program-warm-cache.sh
