name: Scheduled workflow health

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize the dedup query and issue creation across both entry points.
concurrency:
  group: scheduled-workflow-health
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Escalate persistent scheduled failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: scripts/check-scheduled-workflows.py --repo "$GITHUB_REPOSITORY" --report-linear
