name: Benchmarks

# One benchmark run per commit that lands on trunk. The concurrency group
# coalesces rapid merges: an in-flight run is cancelled when a newer commit
# arrives, so the history always tracks the latest trunk state and every
# data point corresponds to exactly one commit.
#
# Results flow: each platform job runs bench.sh and uploads results.json as
# an artifact; the collect job appends them to per-platform history files on
# the `perf` branch; the daily Website workflow then redeploys the performance
# dashboard with the latest collected data.

on:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of benchmark iterations'
        default: '5'
        type: string

# issues:write is required by the notify job below; without it the
# github-script call fails with "Resource not accessible by integration"
# and trunk benchmark failures are found but never reported (the same
# silent-failure mode the fuzz workflow hit on 2026-07-03/04).
permissions:
  contents: write  # collect job pushes history to the perf branch
  issues: write    # notify job files/updates the benchmark-failure issue

concurrency:
  group: benchmarks
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: x86-64-linux
            name: Linux x86-64
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux
            name: Linux ARM64
          - runner: macos-latest
            platform: aarch64-macos
            name: macOS ARM64

    runs-on: ${{ matrix.runner }}
    name: benchmark (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Cache the dotslash-downloaded buck2 binary (~/.cache/dotslash on
      # Linux, ~/Library/Caches/dotslash on macOS). OSS buck2 has no
      # persistent action cache across daemon restarts, so this is the only
      # cacheable artifact. (RUE-144)
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-${{ matrix.platform }}-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-${{ matrix.platform }}-

      # Performance budgets are enforced here, separately from correctness
      # hang guards in the CLI corpus.
      - name: Run benchmarks and enforce performance thresholds
        run: |
          iterations="${{ github.event.inputs.iterations || '5' }}"
          export RUE_BENCH_RUNNER_IMAGE="${ImageOS:-${{ runner.os }}}:${ImageVersion:-unknown}:${{ runner.arch }}"
          echo "Running benchmarks with $iterations iterations on ${{ matrix.platform }}..."
          ./bench.sh --iterations "$iterations" --output results.json --no-history

      - name: Validate benchmark results
        run: python3 scripts/validate-benchmark.py results.json

      - name: Upload benchmark results as artifact
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ github.sha }}-${{ matrix.platform }}
          path: results.json
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "## Benchmark Results (${{ matrix.name }})"
            echo ""
            echo "**Platform:** ${{ matrix.platform }}"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo '```json'
            cat results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  collect-results:
    name: Collect and push results
    needs: benchmark
    runs-on: ubuntu-latest
    # Collect whatever platforms succeeded, even if one failed.
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repo for scripts
        uses: actions/checkout@v6
        with:
          path: repo
          fetch-depth: 0

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: benchmark-results-${{ github.sha }}-*
          merge-multiple: false

      - name: Checkout perf branch
        uses: actions/checkout@v6
        with:
          ref: perf
          path: perf-branch
          fetch-depth: 1
        continue-on-error: true

      - name: Initialize perf branch if needed
        run: |
          if [ ! -d "perf-branch" ]; then
            mkdir -p perf-branch
            cd perf-branch
            git init
            git checkout -b perf
            mkdir -p benchmarks
            {
              echo "# Performance History"
              echo ""
              echo "This branch stores benchmark history for the Rue compiler."
              echo "See [Performance Dashboard](https://rue-lang.dev/performance/) for visualization."
            } > README.md
          fi

      - name: Append results to history
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            benchmark_reason="manual"
          else
            benchmark_reason="push"
          fi

          found=0
          for artifact_dir in artifacts/benchmark-results-*; do
            [ -d "$artifact_dir" ] || continue

            # Artifact name is benchmark-results-<40-hex-sha>-<platform>;
            # the sha contains no hyphens, so strip the prefix then
            # everything through the next hyphen.
            base=$(basename "$artifact_dir")
            platform="${base#benchmark-results-}"
            platform="${platform#*-}"
            results_file="$artifact_dir/results.json"

            if [ ! -f "$results_file" ]; then
              echo "::warning::No results.json found in $artifact_dir"
              continue
            fi

            echo "Processing results for platform: $platform"
            found=1

            mkdir -p perf-branch/benchmarks
            history_dir="perf-branch/benchmarks/history-$platform"
            legacy_history="perf-branch/benchmarks/history-$platform.json"

            if ! python3 repo/scripts/append-benchmark.py "$results_file" "$history_dir" \
              --legacy-history "$legacy_history" \
              --platform "$platform" \
              --reason "$benchmark_reason" \
              --git-repository repo; then
              echo "::error::Failed to append benchmark results for $platform"
              exit 1
            fi
          done

          if [ "$found" = "0" ]; then
            echo "::warning::No benchmark artifacts to collect (all platforms failed?)"
          fi

      - name: Commit and push to perf branch
        run: |
          cd perf-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add benchmarks/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            short_sha=$(echo "${{ github.sha }}" | cut -c1-9)
            platform_count=$(git diff --staged --name-only | wc -l)
            git commit -m "Benchmark results for $short_sha ($platform_count platforms)"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:perf
          fi

  # Trunk benchmark failures previously only turned the Actions run red;
  # nobody is watching that page, so they sat unnoticed until someone
  # looked at the performance dashboard. Mirror the fuzz workflow: keep one
  # open tracking issue and append later failures to it as comments.
  # Runs cancelled by the concurrency group (rapid trunk merges) are not
  # failures and do not report.
  notify-failure:
    name: Notify on failure
    needs: [benchmark, collect-results]
    runs-on: ubuntu-latest
    if: ${{ failure() }}

    steps:
      - name: Create or comment on the benchmark-failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const results = [
              ['benchmark', '${{ needs.benchmark.result }}'],
              ['collect-results', '${{ needs.collect-results.result }}'],
            ];
            const failed = results.filter(([, r]) => r === 'failure').map(([n]) => n);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = `**Run:** ${runUrl}\n**Commit:** ${context.sha}\n**Failed jobs:** ${failed.join(', ') || '(job-level failure)'}\n`;
            const body = `## Benchmark Workflow Failure

            The trunk benchmark workflow failed.

            ${summary}
            ### Next Steps
            1. Open the run above and check which platform job failed and why.
               Common failure classes:
               - \`Budget violation ...\` (exit 2): a scaling family's growth
                 lower bound exceeded its manifest budget — a real complexity
                 regression until proven otherwise.
               - \`Insufficient scaling evidence ...\` (exit 3): evidence stayed
                 indeterminate even after the runner's noise-driven sample
                 top-up — usually a very noisy runner, worth a rerun before
                 deeper digging.
               - Validation errors from \`validate-benchmark.py\`: the results
                 schema or corpus drifted from the manifest.
            2. Reproduce locally with \`./bench.sh --iterations 5 --output
               results.json --no-history\`.
            3. Fix the regression (or harness bug) on a feature branch and let
               the next trunk run confirm.
            `;

            // One open tracking issue at a time; failures while it is open
            // are appended as comments instead of being silently dropped.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'benchmark-failure'
            });

            if (issues.data.length === 0) {
              const title = `Benchmark workflow failed on trunk (${new Date().toISOString().split('T')[0]})`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['benchmark-failure', 'bug']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another trunk benchmark failure while this issue is open.\n\n${summary}`
              });
            }
