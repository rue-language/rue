name: Fuzz Testing

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual triggering

# Crashes are filed in Linear (RUE-802); GitHub Issues is the fallback used when
# the LINEAR_API_KEY secret is missing. The default GITHUB_TOKEN is read-only,
# and without issues:write that fallback fails with "Resource not accessible by
# integration" — nightly crashes found but never reported (this silently ate
# real crash reports for at least 2026-07-03/04). Keep issues:write even though
# the primary path no longer needs it: it is what makes the fallback real.
permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # A wedged step can otherwise burn a runner to GitHub's 6h job cap.
    # Generous vs the ~40min expected total, tight vs the 6h default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Cache the dotslash-downloaded buck2 binary. The previous cache of
      # buck-out/v2/gen + ~/.cache/buck2 was inert — OSS buck2 has no
      # persistent action cache across daemon restarts, and ~/.cache/buck2
      # is not a path buck2 uses. (RUE-144)
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: ~/.cache/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Create seed corpus
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --init-corpus crates/rue-fuzz/corpus

      # Guard against RUE-515 recurring: `emitter_aarch64` was registered in the
      # fuzzer but never invoked here, so aarch64 codegen got no nightly
      # byte-mutation budget. Fail fast if any target the fuzzer advertises via
      # --list has no `--max-time` step in this file. A target intentionally kept
      # off the nightly budget must be listed in NIGHTLY_EXEMPT with a reason.
      - name: Verify every registered fuzz target is scheduled
        run: |
          NIGHTLY_EXEMPT=""   # none currently exempt
          list_out="$(./buck2 run //crates/rue-fuzz:rue-fuzz -- --list 2>&1 || true)"
          mapfile -t targets < <(printf '%s\n' "$list_out" \
            | awk '/^Available fuzz targets:/{f=1;next} f && /^  [a-z][a-z0-9_]*$/{print $1}')
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::could not enumerate fuzz targets from --list"; exit 1
          fi
          missing=()
          for t in "${targets[@]}"; do
            case " $NIGHTLY_EXEMPT " in *" $t "*) continue ;; esac
            grep -qE -- "--max-time=[0-9]+ ${t} " .github/workflows/fuzz.yml || missing+=("$t")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::registered fuzz target(s) not scheduled in fuzz.yml: ${missing[*]}"
            echo "Add a '--max-time' fuzz step (plus the aggregation and notify entries), or add the target to NIGHTLY_EXEMPT."
            exit 1
          fi
          echo "All ${#targets[@]} registered fuzz targets are scheduled: ${targets[*]}"

      # Each fuzz step is continue-on-error so one crashing target no longer
      # skips every later target (a single sema crash used to reduce the whole
      # night to lexer+parser coverage). The aggregation step at the end turns
      # any step failure back into a red job, so nothing is masked.
      - name: Fuzz lexer (5 minutes)
        id: fuzz-lexer
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 lexer crates/rue-fuzz/corpus

      - name: Fuzz parser (5 minutes)
        id: fuzz-parser
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 parser crates/rue-fuzz/corpus

      - name: Fuzz sema (5 minutes)
        id: fuzz-sema
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 sema crates/rue-fuzz/corpus

      - name: Fuzz compiler (5 minutes)
        id: fuzz-compiler
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 compiler crates/rue-fuzz/corpus

      - name: Fuzz payload schemas (5 minutes)
        id: fuzz-payload-schemas
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 payload_schemas crates/rue-fuzz/corpus

      - name: Fuzz x86-64 emitter (5 minutes)
        id: fuzz-emitter
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 emitter crates/rue-fuzz/corpus

      - name: Fuzz aarch64 emitter (5 minutes)
        id: fuzz-emitter-aarch64
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 emitter_aarch64 crates/rue-fuzz/corpus

      - name: Fuzz x86-64 emitter sequences (5 minutes)
        id: fuzz-emitter-sequence
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 emitter_sequence crates/rue-fuzz/corpus

      - name: Fuzz aarch64 emitter sequences (5 minutes)
        id: fuzz-emitter-sequence-aarch64
        continue-on-error: true
        timeout-minutes: 10
        run: ./buck2 run //crates/rue-fuzz:rue-fuzz -- --mutate --max-time=300 emitter_sequence_aarch64 crates/rue-fuzz/corpus

      # Differential fuzzing: generate valid programs and cross-check the
      # rue-oracle reference interpreter against the compiled native binary
      # (RUE-247). Any exit-code / stdout disagreement is an automatically-found
      # miscompile. A compiler rejection or oracle Unsupported result is a
      # generator-contract failure. Either class exits non-zero and writes a
      # self-contained seed/source repro to crates/rue-fuzz/crashes/.
      - name: Differential fuzz (oracle vs compiled, 500 seeds)
        id: fuzz-differential
        continue-on-error: true
        timeout-minutes: 20
        run: |
          RUE_BINARY="$(scripts/rue-bin)" ./buck2 run //crates/rue-oracle-diff:rue-oracle-diff -- \
            fuzz --seeds 500 --crash-dir crates/rue-fuzz/crashes

      # With continue-on-error above, step failures don't mark the job failed
      # until the aggregation step — so the upload must run unconditionally.
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crashes
          path: crates/rue-fuzz/crashes/
          if-no-files-found: ignore

      - name: Fail if any fuzz step found crashes
        if: >-
          steps.fuzz-lexer.outcome == 'failure' ||
          steps.fuzz-parser.outcome == 'failure' ||
          steps.fuzz-sema.outcome == 'failure' ||
          steps.fuzz-compiler.outcome == 'failure' ||
          steps.fuzz-payload-schemas.outcome == 'failure' ||
          steps.fuzz-emitter.outcome == 'failure' ||
          steps.fuzz-emitter-aarch64.outcome == 'failure' ||
          steps.fuzz-emitter-sequence.outcome == 'failure' ||
          steps.fuzz-emitter-sequence-aarch64.outcome == 'failure' ||
          steps.fuzz-differential.outcome == 'failure'
        run: |
          echo "One or more fuzz targets found crashes (see step outcomes above)."
          exit 1

      # RUE-802: crashes are tracked in Linear (team Rue), ONE ISSUE PER DISTINCT
      # CRASH FINGERPRINT. This replaced an inline `actions/github-script` block
      # that kept a single ever-open GitHub issue labelled `fuzz-crash` and
      # appended every later crash to it as a comment — dedup by label, which
      # made two unrelated miscompiles indistinguishable from one bug recurring.
      #
      # The script prefers Linear and falls back to GitHub Issues (clearly
      # marked as such in the filed issue) when LINEAR_API_KEY is absent, so a
      # missing secret degrades the tracker instead of dropping the night's
      # findings. With neither credential it exits non-zero, turning this step
      # red rather than reporting nothing and passing.
      #
      # Fingerprinting, dedup, payload construction, and backend selection are
      # pinned by //:fuzz-report-tool-tests against a mock transport.
      - name: Report crashes (Linear, GitHub Issues fallback)
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          failed=""
          record() {
            if [ "$2" = "failure" ]; then
              failed="${failed:+$failed,}$1"
            fi
          }
          record lexer '${{ steps.fuzz-lexer.outcome }}'
          record parser '${{ steps.fuzz-parser.outcome }}'
          record sema '${{ steps.fuzz-sema.outcome }}'
          record compiler '${{ steps.fuzz-compiler.outcome }}'
          record payload_schemas '${{ steps.fuzz-payload-schemas.outcome }}'
          record emitter '${{ steps.fuzz-emitter.outcome }}'
          record emitter_aarch64 '${{ steps.fuzz-emitter-aarch64.outcome }}'
          record emitter_sequence '${{ steps.fuzz-emitter-sequence.outcome }}'
          record emitter_sequence_aarch64 '${{ steps.fuzz-emitter-sequence-aarch64.outcome }}'
          record differential '${{ steps.fuzz-differential.outcome }}'
          python3 scripts/fuzz-report-failure.py \
            --crash-dir crates/rue-fuzz/crashes \
            --failed-targets "$failed" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
