name: Nightly Tests

on:
  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC daily
  workflow_dispatch:     # Allow manual trigger

jobs:
  # Extended property tests with high iteration counts
  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dotslash
        uses: facebook/install-dotslash@latest

      - name: Cache Buck2 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotslash/cache
            buck-out/v2/
          key: ${{ runner.os }}-buck2-nightly-${{ hashFiles('**/*.BUCK', '.buckconfig') }}
          restore-keys: |
            ${{ runner.os }}-buck2-nightly-
            ${{ runner.os }}-buck2-

      - name: Run extended tests
        run: |
          echo "Running extended test suite..."
          ./buck2 test //crates/... --config 'test.run_slow_tests=true'

  # Test with beta Rust for early warning of breaking changes
  beta-rust-test:
    name: Beta Rust Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust beta
        uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy, rustfmt

      - name: Install dotslash
        uses: facebook/install-dotslash@latest

      - name: Cache Buck2 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotslash/cache
            buck-out/v2/
          key: ${{ runner.os }}-buck2-beta-${{ hashFiles('**/*.BUCK', '.buckconfig') }}
          restore-keys: |
            ${{ runner.os }}-buck2-beta-
            ${{ runner.os }}-buck2-

      - name: Build with beta
        run: ./buck2 build //crates/rue:rue
        continue-on-error: true

      - name: Test with beta
        run: ./buck2 test //crates/...
        continue-on-error: true

  # Performance benchmarks
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dotslash
        uses: facebook/install-dotslash@latest

      - name: Install hyperfine for benchmarking
        run: |
          wget https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb
          sudo dpkg -i hyperfine_1.18.0_amd64.deb

      - name: Cache Buck2 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotslash/cache
            buck-out/v2/
          key: ${{ runner.os }}-buck2-bench-${{ hashFiles('**/*.BUCK', '.buckconfig') }}
          restore-keys: |
            ${{ runner.os }}-buck2-bench-
            ${{ runner.os }}-buck2-

      - name: Build release binaries
        run: |
          ./buck2 build -c rust.rustc_flags="-Copt-level=3" //crates/rue:rue
          ./buck2 build --show-output //crates/rue:rue > build_output.txt
          RUE_BINARY=$(grep "//crates/rue:rue" build_output.txt | awk '{print $2}')
          echo "RUE_BINARY=$RUE_BINARY" >> $GITHUB_ENV

      - name: Generate benchmark programs
        run: |
          mkdir -p bench-programs
          python3 scripts/generate-large-program.py 500 > bench-programs/large.rue
          python3 scripts/generate-large-program.py 1000 > bench-programs/xlarge.rue

      - name: Run benchmarks
        run: |
          hyperfine \
            --warmup 3 \
            --export-json benchmark-results.json \
            "${{ env.RUE_BINARY }} bench-programs/large.rue" \
            "${{ env.RUE_BINARY }} bench-programs/xlarge.rue"

      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  # Buck2 configuration audit
  buck2-audit:
    name: Buck2 Configuration Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dotslash
        uses: facebook/install-dotslash@latest

      - name: Cache Buck2 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotslash/cache
            buck-out/v2/
          key: ${{ runner.os }}-buck2-audit-${{ hashFiles('**/*.BUCK', '.buckconfig') }}
          restore-keys: |
            ${{ runner.os }}-buck2-audit-
            ${{ runner.os }}-buck2-

      - name: Audit Buck2 configuration
        run: |
          echo "=== Buck2 Configuration Audit ==="
          ./buck2 audit config
          echo ""
          echo "=== Buck2 Cell Configuration ==="
          ./buck2 audit cell
          echo ""
          echo "=== Buck2 Providers ==="
          ./buck2 audit providers //crates/rue:rue

      - name: Check for unused dependencies
        run: |
          echo "=== Checking for unused dependencies ==="
          ./buck2 uquery 'deps(//crates/...)' | sort | uniq > all_deps.txt
          echo "Total dependencies: $(wc -l < all_deps.txt)"

      - name: Verify all clippy targets exist
        run: |
          echo "=== Verifying clippy targets ==="
          for crate in crates/*/; do
            if [[ -f "$crate/BUCK" ]]; then
              crate_name=$(basename "$crate")
              echo "Checking //crates/$crate_name:clippy"
              ./buck2 uquery "//crates/$crate_name:clippy" || echo "WARNING: Missing clippy target for $crate_name"
            fi
          done

  # Success marker for nightly
  nightly-success:
    name: Nightly Success
    runs-on: ubuntu-latest
    needs: [property-tests, beta-rust-test, benchmarks, buck2-audit]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "=== Nightly Test Results ==="
          echo "Property tests: ${{ needs.property-tests.result }}"
          echo "Beta Rust: ${{ needs.beta-rust-test.result }}"
          echo "Benchmarks: ${{ needs.benchmarks.result }}"
          echo "Buck2 audit: ${{ needs.buck2-audit.result }}"
          
          # Don't fail on beta rust issues
          if [[ "${{ needs.property-tests.result }}" != "success" ]] || \
             [[ "${{ needs.benchmarks.result }}" != "success" ]] || \
             [[ "${{ needs.buck2-audit.result }}" != "success" ]]; then
            echo "⚠️ Some nightly tests failed"
            exit 1
          fi
          echo "✅ All critical nightly tests passed!"