name: Pull Request Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quick validation for PRs
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Clippy check
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Build check
      run: cargo check --workspace --all-features

  # Focused property tests for PRs
  pr-property-tests:
    name: Property Tests (PR)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    
    - name: Run property tests (reduced iterations)
      run: |
        # Run with fewer iterations for faster PR feedback
        PROPTEST_CASES=100 cargo test -p rue-parser --test test_parser_properties
        PROPTEST_CASES=50 cargo test -p rue-semantic --test test_type_checker_properties
        PROPTEST_CASES=50 cargo test -p rue-ir --test test_optimizer_properties

  # Check for snapshot changes
  snapshot-check:
    name: Snapshot Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for diff
    
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    
    - name: Run snapshot tests
      run: cargo test --workspace -- snapshot
      continue-on-error: true
    
    - name: Check for uncommitted snapshots
      run: |
        if git diff --exit-code -- '**/*.snap' '**/*.snap.new'; then
          echo "✅ No snapshot changes detected"
        else
          echo "⚠️ Snapshot changes detected!"
          echo "Please review the following snapshot changes:"
          git diff --stat -- '**/*.snap' '**/*.snap.new'
          echo ""
          echo "To update snapshots locally, run:"
          echo "  UPDATE_SNAPSHOTS=1 cargo test"
          exit 1
        fi

  # Test the new spec-linked tests
  pr-spec-tests:
    name: Spec Tests (PR)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    
    - name: Build rue and runner
      run: cargo build --release -p rue -p rue-runner
    
    - name: Run spec tests
      run: |
        ./target/release/rue-runner \
          --test-paths tests/spec \
          --rue-binary ./target/release/rue \
          --report-file pr-spec-report.json \
          --verbose || true
    
    - name: Comment PR with test results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read the test report if it exists
          let comment = '## 🧪 Test Results\n\n';
          
          try {
            const report = JSON.parse(fs.readFileSync('pr-spec-report.json', 'utf8'));
            const summary = report.summary || {};
            
            comment += '### Specification Tests\n';
            comment += `- Total: ${summary.total || 0}\n`;
            comment += `- Passed: ${summary.passed || 0}\n`;
            comment += `- Failed: ${summary.failed || 0}\n`;
            
            if (report.spec_coverage) {
              comment += '\n### Coverage\n';
              comment += `- Coverage: ${report.spec_coverage.coverage_percent || 0}%\n`;
            }
          } catch (e) {
            comment += 'Unable to parse test results.\n';
          }
          
          // Find existing comment or create new one
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('🧪 Test Results')
          );
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: comment,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });
          }

  # Summary job
  pr-summary:
    name: PR Test Summary
    runs-on: ubuntu-latest
    needs: [quick-check, pr-property-tests, snapshot-check, pr-spec-tests]
    if: always()
    steps:
    - name: Summary
      run: |
        echo "## PR Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| Quick Check | ${{ needs.quick-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Property Tests | ${{ needs.pr-property-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Snapshot Check | ${{ needs.snapshot-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Spec Tests | ${{ needs.pr-spec-tests.result }} |" >> $GITHUB_STEP_SUMMARY