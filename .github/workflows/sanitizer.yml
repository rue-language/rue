name: Sanitizer

# Runs compiled Rue programs under Valgrind's memcheck (RUE-49). Rue emits
# static, no-libc, direct-syscall ELF, and valgrind's DBI runs such binaries
# without recompilation, so this needs no special build — just the compiler
# plus `valgrind` from apt.
#
# Scope (see scripts/run-sanitizer.sh for the full rationale): memcheck hooks
# libc malloc/free, but the Rue runtime allocates from mmap'd arenas and never
# calls libc, so to memcheck each program does "0 allocs". The `valgrind`
# job below is therefore a CODEGEN / generated-code memory-safety net (wild
# pointers, stack overflow, bad syscall buffers, uninitialised-value use) that
# the source-level fuzz job cannot provide. It does NOT catch intra-arena heap
# overflows like RUE-34 — those live inside a valid mmap arena, never a libc
# block.
#
# The `asan` job covers exactly that blind spot (RUE-211): it runs
# rue-runtime's real arena allocator under AddressSanitizer with manual
# redzone poisoning, so a write past an allocation's reserved end is caught
# even though it stays inside a live arena. See crates/rue-runtime-asan.
#
# Separate workflow so both jobs run in parallel with the fast `test` job in
# ci.yml rather than serializing behind it.

# No `push: [trunk]` trigger (RUE-1006): trunk only advances through the merge
# queue, whose merge_group run already validated the exact commit that lands —
# a trunk push run would re-test an identical tree. See ci.yml.
on:
  pull_request:
    branches: [trunk]
  merge_group:
    branches: [trunk]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Cache the dotslash-downloaded buck2 binary, matching ci.yml. OSS buck2
      # has no persistent action cache across daemon restarts, so only the
      # dotslash download is worth caching. (RUE-144)
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: ~/.cache/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      # BuildBuddy remote action cache (RUE-316/RUE-1006); see ci.yml's clippy
      # job for the secret-availability contract (absent on fork PRs → cold).
      - name: Provision remote build cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build rue compiler
        run: ./buck2 build //crates/rue:rue

      - name: Run programs under valgrind memcheck
        run: scripts/run-sanitizer.sh

  # AddressSanitizer over rue-runtime's arena allocator (RUE-211, RUE-560).
  # Standalone cargo crate (crates/rue-runtime-asan) driven by nightly rustc —
  # no buck2 — because -Zsanitizer=address needs nightly, an explicit --target,
  # and the compiler-rt asan runtime linked in. detect_leaks=0: retained small
  # arenas intentionally live until process exit, which LeakSanitizer would
  # otherwise flag.
  #
  # The nightly is PINNED (RUE-560): an un-pinned `nightly` floats and a bad
  # daily build can silently break the harness or its sanitizer wiring. Bump
  # NIGHTLY deliberately, verifying the harness (and its negative controls)
  # still pass on the new toolchain.
  asan:
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-04-13
    steps:
      - uses: actions/checkout@v6

      # clippy + rust-src round out the minimal profile: clippy for the lint
      # gate below, rust-src is needed by some nightly asan setups.
      - name: Install pinned nightly Rust
        run: >
          rustup toolchain install "$NIGHTLY" --profile minimal
          --component clippy,rust-src

      # This standalone crate has no buck2 target, so it declares no
      # `<name>-clippy` gate and is invisible to the per-crate lint targets the
      # rue_crate/rue_binary macros emit. Gate it here so it does not rot
      # (RUE-560). Same instrumentation flags as the run, so lints see the
      # sanitizer cfg the harness compiles under.
      - name: Clippy the ASan harness
        env:
          RUSTFLAGS: "-Zsanitizer=address"
        run: >
          cargo "+$NIGHTLY" clippy
          --manifest-path crates/rue-runtime-asan/Cargo.toml
          --target x86_64-unknown-linux-gnu
          -- -D warnings

      # Runs the in-bounds allocator exercises AND spawns the negative-control
      # children, each of which MUST abort under ASan (RUE-560). If the redzone
      # instrumentation ever regresses, a control exits clean and the harness
      # fails the job — the coverage is load-bearing, not decorative.
      - name: Exercise the arena allocator under AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0"
        run: >
          cargo "+$NIGHTLY" run
          --manifest-path crates/rue-runtime-asan/Cargo.toml
          --target x86_64-unknown-linux-gnu
