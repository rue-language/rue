name: Website

on:
  # Deploy (post-merge on trunk) only on real website changes. The spec is
  # published from docs/spec, but re-deploying on every spec commit rolls the
  # dice against the flaky GitHub Pages backend far too often; spec, benchmark,
  # and status-board changes are picked up by the weekly schedule (or a manual
  # run) instead.
  push:
    branches: [trunk]
    paths:
      - 'website/**'
      - 'scripts/generate-charts.py'
      - 'scripts/generate-site-status.py'
      - '.github/workflows/deploy-website.yml'
  # PRs still build (no deploy — that's trunk-only) on spec changes too, so a
  # spec edit that breaks the website build is caught before merge.
  pull_request:
    branches: [trunk]
    paths:
      - 'website/**'
      - 'docs/spec/**'
      - 'scripts/generate-charts.py'
      - 'scripts/generate-site-status.py'
      - '.github/workflows/deploy-website.yml'
  # Weekly refresh so the published spec, benchmark sparkline, and status board
  # don't drift more than ~7 days behind trunk. Switch to '0 6 1 * *' for monthly.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Use a fixed concurrency group for all website deployments to ensure
# they run sequentially and don't cancel each other (especially important
# when triggered by benchmark workflow completion)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Fetch benchmark data from perf branch
        run: |
          # Try to fetch benchmark history from the perf branch
          # This may fail if the perf branch doesn't exist yet (new repos)
          mkdir -p website/static/benchmarks

          if git fetch origin perf --depth=1 2>/dev/null; then
            echo "Fetched perf branch, extracting benchmark history..."

            # Fetch per-platform history files
            for platform in x86-64-linux aarch64-linux aarch64-macos; do
              if git show origin/perf:benchmarks/history-${platform}.json > website/static/benchmarks/history-${platform}.json 2>/dev/null; then
                echo "  Fetched history-${platform}.json"
              else
                echo "  No history for ${platform} yet"
                rm -f website/static/benchmarks/history-${platform}.json
              fi
            done

            # Also fetch legacy history.json for backwards compatibility
            git show origin/perf:benchmarks/history.json > website/static/benchmarks/history.json 2>/dev/null || true
          else
            echo "Perf branch not found, using empty benchmark history"
          fi

      - name: Build website
        run: website/build.sh

      - name: Add CNAME
        if: github.ref == 'refs/heads/trunk'
        run: echo "rue-lang.dev" > website/public/CNAME

      - name: Upload artifact
        if: github.ref == 'refs/heads/trunk'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  deploy:
    if: github.ref == 'refs/heads/trunk' && github.repository == 'rue-language/rue'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
