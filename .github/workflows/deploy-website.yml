name: Website

on:
  # Deploy post-merge on trunk only for website changes. Pull requests also
  # build on specification changes because the spec is copied into the site.
  push:
    branches: [trunk]
    paths:
      - 'website/**'
      - 'docs/spec/**'
      - '.github/workflows/deploy-website.yml'
  # PRs still build (no deploy — that's trunk-only) on spec changes too, so a
  # spec edit that breaks the website build is caught before merge.
  pull_request:
    branches: [trunk]
    paths:
      - 'website/**'
      - 'docs/spec/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Use a fixed concurrency group so website deployments run sequentially.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Build website
        run: website/build.sh

      - name: Add CNAME
        if: github.ref == 'refs/heads/trunk'
        run: echo "rue-lang.dev" > website/public/CNAME

      - name: Upload artifact
        if: github.ref == 'refs/heads/trunk'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  deploy:
    if: github.ref == 'refs/heads/trunk' && github.repository == 'rue-language/rue'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
