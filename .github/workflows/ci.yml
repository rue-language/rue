name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  merge_group:
    branches: [trunk]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Check formatting
        # Uses hermetic rustfmt from Buck2 toolchain
        run: ./fmt.sh check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Cache the dotslash-downloaded buck2 binary (see the `test` job for the
      # rationale on which paths are worth caching).
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Run clippy
        # Builds the [clippy.txt] subtarget for every first-party crate and
        # fails on any clippy error. Workspace lint policy (deny warnings +
        # grandfathered allow-list) lives in toolchains/rust/BUCK.
        run: ./clippy.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        # A workflow file GitHub can't parse fails every run in 0s with no
        # useful error, and nothing in ./test.sh can see it — benchmarks.yml
        # was broken this way for five months (gh-991). actionlint also
        # shellchecks all run: blocks.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 16.2
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Cache the dotslash-downloaded buck2 binary (~/.cache/dotslash on
      # Linux, ~/Library/Caches/dotslash on macOS; actions/cache skips paths
      # that don't exist). The previous cache of buck-out/v2/gen +
      # ~/.cache/buck2 was inert: OSS buck2 has no persistent action cache
      # across daemon restarts, and ~/.cache/buck2 is not a path buck2 uses —
      # multi-GB saved/restored for zero hits. (RUE-144)
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-${{ matrix.name }}-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-${{ matrix.name }}-

      # Uses hermetic Rust toolchain downloaded by Buck2
      # First verify everything builds (catches issues tests might miss)
      - name: Build all targets
        run: ./buck2 build //crates/...

      - name: Run tests
        run: ./test.sh

  # Release-mode build + test (RUE-45). CI otherwise builds/tests the compiler
  # in debug ONLY, so release-only miscompiles never run — a correctness check
  # written as `debug_assert!` (or `#[cfg(debug_assertions)]`) is compiled out
  # in release and silently turns an ICE into wrong codegen (RUE-24 is the
  # precedent). This job exercises the whole suite against a `-Copt-level=3`
  # build of the compiler. linux-x64 only: the aim is to catch opt-level and
  # cfg(debug_assertions) divergence, which is architecture-independent, so a
  # single release target is enough without tripling CI cost.
  test-release:
    runs-on: ubuntu-latest
    name: test (linux-x64, release)
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Reuse the debug job's dotslash cache (the buck2 binary download is
      # build-mode independent) via the shared `dotslash-linux-x64-` prefix.
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-release-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Build all targets (release)
        run: ./buck2 build //crates/... --modifier //constraints:release

      # RUE_BUCK_MODIFIERS threads the release modifier through every buck2
      # invocation in test.sh, including the rue binary the suites compile with.
      - name: Run tests (release)
        run: ./test.sh
        env:
          RUE_BUCK_MODIFIERS: "--modifier //constraints:release"
