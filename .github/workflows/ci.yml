name: CI

# No `push: [trunk]` trigger (RUE-1006): trunk only advances through the merge
# queue, and the merge_group run's checks are attached to the exact commit that
# lands, so a trunk push run would re-validate an identical tree — ~8 duplicate
# (including a macOS slot) per merge, usually cancelled mid-flight by the
# concurrency group after burning runner time. Use workflow_dispatch for a
# manual re-validation of trunk.
on:
  pull_request:
    branches: [trunk]
  merge_group:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      large_program:
        description: Full large program to include in manual Valgrind coverage
        type: choice
        options: [none, caldera, meridian, all]
        default: none

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Cache the dotslash-downloaded buck2 binary (see the `test` job for the
      # rationale on which paths are worth caching).
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Check formatting
        # Every crate emits its own `<name>-fmt-check` test from the
        # rue_crate/rue_binary macros (RUE-1153), so coverage follows the
        # build graph. The target list comes from a query over that graph
        # rather than filesystem discovery: the original `//:fmt-check` took
        # its list from a root-package `glob(["crates/**/*.rs"])`, and a Buck
        # glob does not descend into subpackages, so it checked 1 file of 281
        # and passed for the rest (RUE-1152). An empty list is a broken query,
        # never a clean tree, so it fails rather than reporting success.
        # `root//...` (not just crates/): the cargo-only ASan harness has no
        # BUCK file, so its fmt-check lives in the root package (see //BUCK).
        run: |
          mapfile -t TARGETS < <(./buck2 uquery "kind('sh_test', 'root//...')" | grep -- '-fmt-check$')
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "fmt: no -fmt-check targets found; the query or the macros are broken" >&2
            exit 1
          fi
          echo "Checking formatting across ${#TARGETS[@]} crates..."
          ./buck2 test "${TARGETS[@]}"

      - name: Check production debug assertions
        run: scripts/validate-debug-assert-policy.py

      # The gates themselves must not fail open. `grep -q` behind a pipe under
      # `pipefail` discards the very finding it just made (RUE-1011, RUE-1155).
      - name: Check shell pipefail pipelines
        run: scripts/validate-shell-pipefail-pipelines.py

      # macOS runs `#!/usr/bin/env bash` scripts with Bash 3.2, so a Bash 4
      # builtin is exit 127 on every developer Mac while this Linux-only lane
      # stays green -- which is precisely how `mapfile` in test.sh's narrowing
      # path went unnoticed (RUE-1506). The scan is static, so it finds that
      # from here. It also covers the `run:` steps of jobs that can land on a
      # macOS runner; the `mapfile` this job itself uses above is NOT one of
      # them, and is correct, because this job only ever runs on ubuntu-latest.
      #
      # This is the AUTHORITATIVE run of the construct table. The gate's other
      # half runs `bash -n` over every script, which catches what no table can
      # name: RUE-1511 shipped an unbalanced quote inside a multi-line command
      # substitution, and the table reported that file clean because a syntax
      # error is not a construct. Every bash rejects that, so this runner's 5.x
      # catches it here on every pull request — but `;;&`, `;&`, and `coproc`
      # are a syntax error only on 3.2, so the step says it ran above the
      # baseline and leaves that part to the macos-15 leg of native-platforms,
      # which passes --require-baseline-bash (RUE-1512).
      - name: Check shell Bash 3.2 baseline
        run: scripts/validate-shell-bash-baseline.py

      # The same failure in the other language: the repository floor is a
      # uniform 3.9 — exactly what a stock Mac's /usr/bin/python3 provides —
      # while these runners sit comfortably above it (3.12 here, 3.14 on
      # macos-15). A construct newer than 3.9 therefore stays green in CI and
      # dies on a stock developer machine, which is what `tomllib` (stdlib
      # only from 3.11) did to //:cli-timeout-policy-validation (RUE-1509;
      # RUE-1524 retired the import — the gate now reads a Buck-materialized
      # JSON twin — and with it the 3.11 floor). This runner cannot reproduce
      # a stock host, so the check is static: nothing newer than the floor
      # without a reviewed `# python-baseline-ok` annotation, and AGENTS.md's
      # stated floor matching the gate's.
      #
      # This step is the AUTHORITATIVE run, not a duplicate of the premerge
      # target. A static scan is only as strict as the interpreter performing
      # it: a host below the floor cannot tell syntax above the floor from
      # syntax the floor allows, so it reports such a file as unscanned. This
      # runner's 3.12.3 is above the floor, so nothing is left unjudged here.
      - name: Check Python interpreter baseline
        run: scripts/validate-python-baseline.py

      - name: Validate Buck test-tier ownership
        run: ./buck2 bxl //test_tiers.bxl:validate

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Cache the dotslash-downloaded buck2 binary (see the `test` job for the
      # rationale on which paths are worth caching).
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      # BuildBuddy remote action cache (RUE-316/RUE-1006). GitHub withholds
      # repo secrets from pull_request runs whose head branch lives in a fork —
      # the normal contribution flow here — so the key is only present on
      # merge_group and workflow_dispatch runs. That is where it matters: the
      # merge queue serializes on this workflow. The cold fallback is
      # mandatory; this step must never fail because the secret is absent.
      - name: Provision remote build cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Run clippy
        # Every crate emits its own `<name>-clippy` test from the
        # rue_crate/rue_binary macros (RUE-1153). Running them as tests means
        # Buck must materialize each crate's [clippy.txt] before its gate can
        # read it; the previous top-level script had to request that
        # explicitly with --materializations=all, because a remote cache hit
        # could satisfy the build without writing the file, and the script
        # then scored what it could not read as clean (RUE-1152). Workspace
        # lint policy (deny warnings + grandfathered allow-list) lives in
        # toolchains/rust/BUCK.
        run: |
          mapfile -t TARGETS < <(./buck2 uquery "kind('sh_test', 'root//crates/...')" | grep -- '-clippy$')
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "clippy: no -clippy targets found; the query or the macros are broken" >&2
            exit 1
          fi
          echo "Running clippy across ${#TARGETS[@]} crates..."
          ./buck2 test "${TARGETS[@]}"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        # A workflow file GitHub can't parse fails every run in 0s with no
        # useful error, and nothing in ./test.sh can see it. actionlint also
        # shellchecks all run: blocks. Keep the reviewed release visible next
        # to its immutable OCI index digest; docs/process/ci.md documents the
        # update and verification procedure.
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color -shellcheck=/usr/local/bin/shellcheck

  # RUE-320: merge-group-only proof that the compiler can be built on the
  # BuildBuddy worker. Fork PRs cannot access the key. Disabling action-cache
  # reads forces real remote execution; the strict platform forbids a failed
  # remote action from being retried locally, so a missing worker linker cannot
  # hide behind hybrid fallback.
  remote-execution:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    name: remote execution (linux-x64)
    steps:
      - uses: actions/checkout@v6

      - name: Install dotslash
        uses: facebook/install-dotslash@v2

      # Cache the dotslash-downloaded buck2 binary (see the `test` job for the
      # rationale on which paths are worth caching).
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Require and provision remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY is required for the merge-group remote-execution canary."
            exit 1
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Build compiler remotely
        env:
          RUE_CI_REQUIRE_REMOTE_ACTIONS: 1
        run: >-
          scripts/ci-timed "remote compiler build" --
          ./buck2 build //crates/rue:rue --prefer-remote --no-remote-cache
          -c build.execution_platforms=root//platforms:remote_execution

      # ADR-0070 negative control 2 (RUE-1404): remote execution materializes
      # only declared inputs, so building a rue_program here is the standing
      # proof that its scan/derive/compile chain reads nothing undeclared —
      # the failure stage control 1 deliberately does not exercise. The hello
      # fixture needs both hard manifest mechanisms (an absent importer arm
      # and trusted-std reads), so a pass is meaningful, not vacuous.
      - name: Build rue_program fixture remotely
        env:
          RUE_CI_REQUIRE_REMOTE_ACTIONS: 1
        run: >-
          scripts/ci-timed "remote rue_program build" --
          ./buck2 build //fixtures/rue-program:hello --prefer-remote --no-remote-cache
          -c build.execution_platforms=root//platforms:remote_execution

  rust-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate rust-project.json
        # Rue has no Cargo workspace, so rust-project.json is THE rust-analyzer
        # model. It drifted silently before (referenced a deleted crate, omitted
        # live ones), misdirecting anyone opening the repo in an IDE (RUE-516).
        # Pure-filesystem check, no Buck needed; regenerate with
        # ./gen-rust-project.sh when it complains.
        run: python3 scripts/validate-rust-project.py

  # Linux owns the complete target-independent premerge graph. Heavy corpus
  # targets are deferred only to explicit Linux jobs below; dedicated
  # target-independent canaries remain in this graph. Every required result
  # feeds the stable aggregate gate.
  linux-premerge:
    runs-on: ubuntu-latest
    name: premerge (linux-x64)
    if: ${{ always() }}
    needs: affected-targets
    steps:
      - uses: actions/checkout@v6
        # A depth-1 checkout is enough for this lane: nothing it runs reads git
        # history. Two of its steps do shell out to git — `provision-build-cache`
        # lists worktrees, and `affected-targets build-scope` prunes them in its
        # exit trap — but both ask only about the checkout in front of them, and
        # the pin gate below is decided from file contents. The gate that does
        # count commits is the `performance-staleness` job, which takes its own
        # `fetch-depth: 0` checkout for the purpose (RUE-1258, RUE-1504).

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Cache the dotslash-downloaded buck2 binary (~/.cache/dotslash on
      # Linux, ~/Library/Caches/dotslash on macOS; actions/cache skips paths
      # that don't exist). The previous cache of buck-out/v2/gen +
      # ~/.cache/buck2 was inert: OSS buck2 has no persistent action cache
      # across daemon restarts, and ~/.cache/buck2 is not a path buck2 uses —
      # multi-GB saved/restored for zero hits. (RUE-144)
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      # BuildBuddy remote action cache (RUE-316/RUE-1006/RUE-1019); see the
      # clippy job for the secret-availability contract. Compiler
      # reproducibility now has its own strictly cache-free job, so every
      # ordinary platform lane can consume and upload shared actions.
      - name: Provision remote build cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      # RUE-1130: materialize the determinator's impacted-target closure so the
      # heavy steps below can run exactly it. `narrowed` is the determinator's
      # own flag: it declines to narrow when nothing is impacted or when so much
      # is that the `//...` pattern is the better expression of it, so an empty
      # file here always means "run everything", never "run nothing".
      - name: Impacted target list
        id: narrow
        env:
          RUE_AFFECTED_NARROWED: ${{ needs.affected-targets.outputs.narrowed }}
          RUE_AFFECTED_IMPACTED: ${{ needs.affected-targets.outputs.impacted }}
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/impacted-targets.txt"
          : >"$file"
          if [ "${RUE_AFFECTED_NARROWED:-}" = "true" ]; then
            printf '%s\n' "$RUE_AFFECTED_IMPACTED" | sed '/^$/d' >"$file"
          fi
          count="$(wc -l <"$file" | tr -d ' ')"
          echo "file=$file" >>"$GITHUB_OUTPUT"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "impacted targets for this lane: $count"

      # Uses hermetic Rust toolchain downloaded by Buck2
      # First verify everything builds (catches issues tests might miss).
      # RUE-1130: on a narrowed run this builds the impacted closure instead of
      # every crate. An unimpacted crate cannot have been broken by this diff,
      # and building its test binaries is the cost this narrowing exists to
      # avoid — measured at 286-317s whenever a compiler crate changes.
      #
      # The narrowed list is filtered back to this step's own `//crates/...`
      # scope by `build-scope`. Handing `buck2 build` the determinator's raw
      # closure also built the root-level `cached_corpus_suite` actions, and
      # building one of those RUNS its corpus — so this step re-ran the CLI,
      # spec, and oracle corpora that the platform-corpus lanes already own,
      # serially, and premerge went from ~12m to 32-42m. See build_scope().
      - name: Build all targets
        env:
          NARROW_COUNT: ${{ steps.narrow.outputs.count }}
          NARROW_FILE: ${{ steps.narrow.outputs.file }}
        run: |
          set -euo pipefail
          if [ "$NARROW_COUNT" -le 0 ]; then
            # RUE-1511: the unnarrowed branch is the common case — a compiler
            # change impacts more than NARROW_LIMIT targets and so is never
            # narrowed — so it needs the corpus-action subtraction just as much
            # as the narrowed one. `buck2 build` has no kind or label
            # exclusion, so build-scope expands the pattern and subtracts.
            if scope="$(scripts/affected-targets build-scope)"; then
              mapfile -t targets <<<"$scope"
              scripts/ci-timed "linux-x64 build" -- ./buck2 build "${targets[@]}"
            else
              # Fail open, as below: over-building costs wall time, never coverage.
              echo "crate build scope unavailable; building the full crate pattern" >&2
              scripts/ci-timed "linux-x64 build" -- ./buck2 build //crates/...
            fi
          elif ! scope="$(scripts/affected-targets build-scope "$NARROW_FILE")"; then
            # Fail open: an unreadable list costs wall time, never coverage.
            echo "narrowed build scope unavailable; building the full crate pattern" >&2
            scripts/ci-timed "linux-x64 build" -- ./buck2 build //crates/...
          elif [ -n "$scope" ]; then
            mapfile -t targets <<<"$scope"
            scripts/ci-timed "linux-x64 build (narrowed)" -- ./buck2 build "${targets[@]}"
          else
            # Legitimate: a diff can impact corpus data without impacting any
            # crate. Say so rather than leaving a silent no-op to be inferred.
            echo "no impacted //crates/... targets; this step has nothing to build"
          fi

      # ADR-0069 §2 / RUE-1265. Every other gate compares target lists; this one
      # compares test *contents*, so a target that is a strict superset of
      # another fails here instead of quietly costing a lane 223s (RUE-1262).
      #
      # It runs only when the lane is not narrowed, and that is the whole cost
      # argument: on a full or merge-group run every test binary is already
      # built by the step above, so the gate pays only its `--list` invocations
      # — 0.29s wall for 73 of them. On a narrowed peripheral run it would have
      # to build the unimpacted binaries itself, which is exactly the cost
      # RUE-1130's narrowing exists to avoid, and the property is a fact about
      # the graph rather than about the diff — so the authoritative merge_group
      # run is the right place to prove it.
      - name: Check nothing executes twice
        if: steps.narrow.outputs.count == '0'
        run: scripts/ci-timed "duplication gate" -- scripts/validate-test-duplication.py

      - name: Run complete target-independent premerge suite
        # RUE-1163: the corpora with their own platform-corpus job carry the
        # `rue_ci_dedicated_lane` label in BUCK, and test.sh subtracts that label
        # when CI=true. This step no longer names them: the CI-contract job
        # fails if the labeled set and the platform-corpus matrix disagree.
        #
        # RUE-1260: `buck2 test` prints a per-target tally and a `✗ <target>`
        # line, so a target whose process dies without emitting a result line
        # leaves nothing here to debug from — three merge-group ejections were
        # unattributable for exactly that reason. The event log recorded the
        # child's stdout, stderr, and exit status the whole time, so report it
        # on the failure path and keep the complete record as an artifact.
        env:
          RUE_TEST_TIER: premerge
          RUE_TEST_TARGETS_FILE: ${{ steps.narrow.outputs.file }}
          RUE_PREMERGE_TEST_RESULTS: ${{ runner.temp }}/premerge-test-results.txt
        run: |
          # The default step shell runs with `-e`; the suite's status has to
          # survive long enough to report on it, so exit on it explicitly.
          set +e
          scripts/ci-timed "linux-x64 premerge" -- ./test.sh
          status=$?
          if [ "$status" -ne 0 ]; then
            scripts/ci-test-failure-report || true
            scripts/ci-test-failure-report --all >"$RUE_PREMERGE_TEST_RESULTS" 2>&1 || true
          fi
          exit "$status"

      # RUE-1260's per-target report and RUE-1268's preserved command log answer
      # different questions on a failure — which target died and what it printed,
      # versus the full output of the command that ran it — so both upload, under
      # distinct artifact names.
      - name: Upload premerge test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: premerge-test-results-linux-x64
          path: ${{ runner.temp }}/premerge-test-results.txt
          if-no-files-found: ignore

      # ADR-0072 Decision 3's fairness rule is the constraint most able to
      # silently invalidate the runtime benchmark, and it is the one no output
      # check can catch: a navigation flattened out of the template and into
      # host code emits the same link targets and the same visible text on
      # every page, so determinism, the file set, and the semantic oracle all
      # stay green. The spot goldens are what notices, because they hold the
      # markup of a sidebar rendered over a real section tree with an active
      # branch — and they are hermetic, need no Zola, and take seconds.
      #
      # They also pin the port against production drift, which ADR-0072's
      # Consequences name as a risk and which nothing else checks.
      #
      # This lane, specifically: gazette is the only program in the tree that
      # drives `std.fs`'s directory walk, `create_dir_all`, and file creation
      # in anger, and RUE-1481's `O_DIRECTORY` defect showed that surface
      # differs by architecture on Linux. Building a whole site here is the
      # cheapest Linux exercise of it available.
      - name: Check the gazette template port and its spot goldens
        run: scripts/ci-timed "gazette goldens" -- scripts/gazette-corpus-diff.py golden

      # The cross-tool work-equivalence check (ADR-0072 Decisions 3 and 4,
      # RUE-1485). Builds the live corpus with gazette, the pinned Zola, and the
      # pinned Hugo, and asserts the three emit the same file set, the same page
      # count, and the same normalized page semantics.
      #
      # This is a CORRECTNESS lane, not a measurement one: it runs on a shared
      # CI runner and its timings are discarded, exactly as the ADR's boundary
      # discipline requires of anything not taken on the pinned regime. What it
      # exists to catch is drift in the parity configurations and the template
      # ports — a peer left doing work gazette skips, or a port quietly doing
      # less — which is the failure that would make the published comparison
      # dishonest rather than merely wrong, and which nothing else checks before
      # the numbers are already collected. Two samples per tool, because
      # determinism needs at least two; the peers' default-parallel row is
      # skipped because it answers a measurement question, not this one.
      #
      # AT 2x, NOT 1x (RUE-1493), and the reason is a defect this lane could not
      # have seen. Hugo picks a page's layout from its PATH, so every copy under
      # a scale prefix fell out of the specification layout and rendered with no
      # sidebar — nine tenths of the corpus at 10x, the port's most expensive
      # template skipped — while the emitted file set and the page count stayed
      # exactly right. Only the 10x run found it, and required CI ran 1x alone,
      # where nothing is duplicated and the question is never asked.
      #
      # The fixture is 2x rather than 10x because ADR-0072 Decision 9 makes CI
      # cost a first-class constraint: 2x is the SMALLEST duplicated corpus, and
      # duplication is the whole of what 1x cannot exercise. The comparison
      # covers every original page and one copy of each, so it strictly includes
      # what the 1x run checked and adds the duplicated layout, type, and feed
      # selection on top, for roughly twice the build work rather than ten
      # times. 2x is deliberately not a rung of the published curve and never
      # enters `performance/runtime.toml`; it exists to be checked, not plotted.
      - name: Check cross-tool work equivalence against pinned Zola and Hugo
        run: >-
          scripts/ci-timed "gazette peers" --
          scripts/gazette-corpus-diff.py peers --samples 2 --no-secondary --scale 2

      - name: Run explicit cross-backend compilation and encoding coverage
        # Both the x86-64 and AArch64 encoders are host-independent Rust tests.
        # Keep this named step visible even though the broad suite also reaches
        # the target, so platform responsibility cannot become implicit.
        run: scripts/ci-timed "cross-backend codegen" -- ./buck2 test //crates/rue-codegen:rue-codegen-test

      # RUE-1258's two performance gates deliberately live in different jobs,
      # because they cost two orders of magnitude apart. This one is decidable
      # from the tree alone and is about a second of hashing next to a compiler
      # this lane has already built, so it belongs where the build is. Its
      # sibling reads the published series, costs minutes, and shares nothing
      # with this lane but `rue-bench`; it is the `performance-staleness` job.
      #
      # Neither gate has a bypass. The remedy for either is declaring the next
      # epoch, which is a small manifest change, and a genuine emergency is
      # served by bypassing branch protection rather than by an escape hatch
      # kept here for the purpose — an escape hatch would be a cheaper path
      # than the emergency it exists for.
      - name: Check the performance pins still match the tree
        # Would this change stop runs entering their series? Decidable from this
        # tree alone: every remaining pin is a content hash of a file in it.
        run: |
          set -euo pipefail
          RUE="$(scripts/rue-bin)"
          BENCH="$(./buck2 build //crates/rue-bench:rue-bench --show-simple-output 2>/dev/null | tail -1)"
          "$BENCH" check-pins \
            --manifest performance/manifest.toml \
            --repo-root . \
            --compiler "$RUE"

      # The Actions job-log API serves a truncated tail, so a failing target
      # whose output scrolled past the cap is undiagnosable after the fact
      # (RUE-1268). ci-timed preserves each failed command's complete output;
      # keep it as an artifact.
      - name: Upload failing-suite output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: premerge-linux-x64-failure-logs
          path: ${{ runner.temp }}/rue-ci-failed-logs
          if-no-files-found: ignore

  # RUE-1504. The staleness gate asks a question about the repository, not about
  # the diff: is the published series *already* stalled? It reads nothing the
  # premerge lane builds and nothing this diff touches, so the only thing it
  # shared with that lane was a compiled `rue-bench`. It sits in its own job
  # because `premerge (linux-x64)` is required CI's critical path — the longest
  # job in 89 of 94 sampled runs — and this step added a flat ~156s median to it
  # whatever the diff contained, 46% of the job on a pull request touching no
  # compiler crate.
  #
  # This job is NOT cheaper than the step it replaced, and it is not smaller
  # than the lane it left. It pays the gate's own ~156s plus a deep checkout
  # (~11s), dotslash (~4s), job setup, and a `rue-bench` build that inside
  # premerge was free because `Build all targets` had already done it:
  # ~185-195s with the shared cache, ~250-270s cold on a fork pull request,
  # against ~152s for premerge once the step is gone. So on a cheap pull request
  # this job becomes the run's longest; on a compiler pull request, where
  # premerge runs 9-10 minutes, it finishes far inside it. The change still pays
  # in both regimes, because the two now overlap rather than serialize — the run
  # goes from ~308s to ~190s at the median — but it is a p90 win first, and the
  # floor under the whole run is `compiler reproducibility` at ~181.5s either
  # way. Do not re-derive a saving here by assuming this job is free.
  #
  # Coverage moved slightly up, not sideways. As a premerge step the gate was
  # skipped whenever an earlier step in that job failed, which happened in 1 of
  # 14 sampled runs; standing alone it runs unconditionally. It still has no
  # bypass and still blocks the merge: `ci-success` requires it by name, and
  # `scripts/ci-required-results.py` is the inventory both the aggregate and the
  # CI contract evaluate against.
  #
  # Deliberately ungated by `affected-targets`. A stalled series is a
  # repository-wide condition that no diff causes and no diff can be shown not
  # to be affected by, so there is no impacted-target closure that could
  # correctly deselect this job.
  performance-staleness:
    runs-on: ubuntu-latest
    name: performance staleness (linux-x64)
    steps:
      - uses: actions/checkout@v6
        with:
          # The gate counts trunk commits merged since the newest plotted
          # measurement, so it needs the measured commit in local history. The
          # default depth-1 checkout has none of them, and a gate that cannot
          # see the history fails rather than passing. (RUE-1258)
          fetch-depth: 0

      - name: Install dotslash
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Same dotslash cache as the other Linux lanes; see linux-premerge for
      # why these are the only paths worth caching (RUE-144).
      - name: Cache dotslash artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      # BuildBuddy remote action cache (RUE-316/RUE-1006/RUE-1019); see the
      # clippy job for the secret-availability contract. This lane builds the
      # same `rue-bench` other Linux lanes do, so where the key is present the
      # build is mostly cache hits rather than a second cold compile. Where it
      # is not — a fork pull request — this job compiles the whole thing from
      # scratch, which is the ~250-270s case noted above.
      - name: Provision remote build cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Check the performance series is still advancing
        # Is the series *already* stalled? A repository-wide condition, so this
        # fails every pull request rather than only the one that caused it: a
        # stalled series hides regressions instead of reporting them.
        #
        # Deliberately compile-time only. Do not add --runtime-manifest here:
        # ADR-0072 Decision 9 puts the runtime series outside this gate on
        # purpose. Its remedy can be measured in parser work rather than a small
        # manifest change, so a stalled runtime series is a dashboard staleness
        # flag and a triage item, never a repository-wide block.
        run: |
          set -euo pipefail
          # Build in the open, then read the path. `--show-simple-output` with
          # stderr discarded prints NOTHING when the build fails, so under
          # `set -e` the step would abort having said only its own name — and
          # this is the one build in this job, cold whenever the cache key is
          # absent. Building through ci-timed first puts the compiler error in
          # the log and in the preserved artifact below; the second invocation
          # is then a warm no-op whose only job is to name the binary.
          scripts/ci-timed "rue-bench build" -- ./buck2 build //crates/rue-bench:rue-bench
          BENCH="$(./buck2 build //crates/rue-bench:rue-bench --show-simple-output 2>/dev/null | tail -1)"
          git fetch --no-tags origin trunk
          git fetch --no-tags origin performance-data-v1
          DATA="$(mktemp -d)"
          git --work-tree="$DATA" checkout origin/performance-data-v1 -- .
          git reset --quiet
          DERIVED="$(mktemp)"
          "$BENCH" derive \
            --manifest performance/manifest.toml \
            --data-root "$DATA" \
            --out "$DERIVED"
          scripts/validate-performance-stall.py \
            --data "$DERIVED" \
            --repo . \
            --ref origin/trunk

      # RUE-1268: the job-log API serves a truncated tail, so a build whose
      # output scrolled past the cap is undiagnosable after the fact. This lane
      # builds the compiler cold whenever the cache key is absent, which is
      # exactly when that output matters most.
      - name: Upload failing-suite output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: performance-staleness-failure-logs
          path: ${{ runner.temp }}/rue-ci-failed-logs
          if-no-files-found: ignore

  # Native ARM64 lanes own only behavior that requires their host ABI, linker,
  # runtime, or backend. Target-independent unit/spec coverage remains on
  # Linux, avoiding three copies of the same broad suite.
  native-platforms:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    name: native (${{ matrix.name }})
    if: ${{ always() }}
    needs: affected-targets
    steps:
      - uses: actions/checkout@v6

      # RUE-1512. The `fmt` job already runs this gate, but on Bash 5, which
      # parses `;;&`, `;&`, and `coproc` happily — all three are a syntax error
      # on the 3.2 every Mac and every macos-* runner uses, so a script
      # carrying one dies there and passes there. This runner's /bin/bash IS
      # that 3.2 and is the only one in CI that is, so the parse check is
      # authoritative here. `--require-baseline-bash` refuses to report a pass
      # on anything else: if this image's /bin/bash ever ages into 5.x the step
      # fails instead of silently becoming a duplicate of the Linux run, which
      # is the RUE-1506 lesson — a check that cannot fail where it runs is
      # worse than no check, because it is believed.
      #
      # Deliberately above the lane-selection gate: it needs only the checkout
      # and Python, takes about a second, and a pull request touching shell
      # alone is precisely the one this lane might deselect.
      - name: Parse every bash script with the stock macOS Bash 3.2
        if: runner.os == 'macOS'
        run: scripts/validate-shell-bash-baseline.py --require-baseline-bash

      # RUE-1506's demonstrations — `mapfile` exiting 127, `"${empty[@]}"`
      # unbound under `set -u`, `read` assigning nothing when it fails — plus
      # RUE-1512's `;;&` parse case. All of them skip without a 3.2, so this
      # leg is the only place they prove anything.
      #
      # They used to run below as `./buck2 test //:shell-bash-baseline-tool-
      # tests`, which forced them under the lane-selection gate, because buck2
      # is only installed there. That reproduced the very bug RUE-1506 was
      # about: `lane_targets native-macos-arm64` does not list that target and
      # FORCE_FULL_REGEX does not cover `scripts/validate-*.py`, so a pull
      # request changing ONLY the Bash 3.2 policy and its tests deselects this
      # lane and skips the step — leaving the target to linux-premerge, where
      # bash is 5.x and every one of these skips. Run directly instead: the
      # tests need Python and a /bin/bash, not buck2, so they need no gate.
      # The target keeps its premerge tier and still runs on Linux, where the
      # host-independent cases do the work.
      - name: Demonstrate the Bash 3.2 baseline on the stock macOS Bash
        if: runner.os == 'macOS'
        run: python3 scripts/test-validate-shell-bash-baseline.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # RUE-1130: consult the determinator before any heavy setup. On a
      # selective pull_request run where nothing this lane executes is affected,
      # the heavy steps are skipped and the check still reports success, so no
      # branch-protection change is required. Fail-open: unless the determinator
      # explicitly says full=false and omits this lane, the lane runs.
      - name: Lane selection
        id: sel
        env:
          RUE_AFFECTED_FULL: ${{ needs.affected-targets.outputs.full }}
          RUE_AFFECTED_LANES: ${{ needs.affected-targets.outputs.selected_lanes }}
        run: scripts/ci-corpus-decision "native-${{ matrix.name }}"

      # RUE-1130: materialize the determinator's impacted-target closure so the
      # heavy steps below can run exactly it. `narrowed` is the determinator's
      # own flag: it declines to narrow when nothing is impacted or when so much
      # is that the `//...` pattern is the better expression of it, so an empty
      # file here always means "run everything", never "run nothing".
      - name: Impacted target list
        id: narrow
        env:
          RUE_AFFECTED_NARROWED: ${{ needs.affected-targets.outputs.narrowed }}
          RUE_AFFECTED_IMPACTED: ${{ needs.affected-targets.outputs.impacted }}
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/impacted-targets.txt"
          : >"$file"
          if [ "${RUE_AFFECTED_NARROWED:-}" = "true" ]; then
            printf '%s\n' "$RUE_AFFECTED_IMPACTED" | sed '/^$/d' >"$file"
          fi
          count="$(wc -l <"$file" | tr -d ' ')"
          echo "file=$file" >>"$GITHUB_OUTPUT"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "impacted targets for this lane: $count"

      - name: Select Xcode 16.2
        if: runner.os == 'macOS' && steps.sel.outputs.run == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install dotslash
        if: steps.sel.outputs.run == 'true'
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Cache dotslash artifacts
        if: steps.sel.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-${{ matrix.name }}-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-${{ matrix.name }}-

      - name: Provision remote build cache
        if: steps.sel.outputs.run == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Build native compiler and linker
        if: steps.sel.outputs.run == 'true'
        run: scripts/ci-timed "${{ matrix.name }} native build" -- ./buck2 build //crates/rue:rue

      # RUE-1130: the same eight targets, narrowed to the impacted ones. These
      # are unit tests, never the critical path, but their binaries are the
      # expensive part and an unimpacted one has nothing to prove.
      - name: Run native backend, linker, runtime, ABI, allocator, and target tests
        if: steps.sel.outputs.run == 'true'
        env:
          NARROW_COUNT: ${{ steps.narrow.outputs.count }}
          NARROW_FILE: ${{ steps.narrow.outputs.file }}
          LANE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          targets=(
            //crates/rue-compiler:rue-compiler-test
            //crates/rue-codegen:rue-codegen-test
            //crates/rue-linker:rue-linker-test
            //crates/rue-runtime:rue-runtime-test
            //crates/rue-runtime:runtime-archives-test
            //crates/rue-runtime-abi:rue-runtime-abi-test
            //crates/rue-allocator:rue-allocator-test
            //crates/rue-target:rue-target-test
            # ADR-0070 (RUE-1404): the one place CI evaluates the rue
            # toolchain's non-x64 native_target select branches and runs an
            # internally-linked rue_program on aarch64-linux and
            # aarch64-macos. Narrowed like every other entry: it only runs
            # when the compiler, the rules, or the fixtures are impacted.
            //fixtures/rue-program:hello-runs-test
          )
          if [ "$NARROW_COUNT" -gt 0 ]; then
            # macOS runners execute this with the stock Bash 3.2, which has no
            # `mapfile` (exit 127 killed every narrowed macOS run) and errors
            # on empty-array expansion under `set -u`. Read the intersection
            # into a string, early-exit while `targets` is still non-empty,
            # and only then rebuild the array.
            narrowed="$(scripts/affected-targets intersect "$NARROW_FILE" "${targets[@]}")"
            if [ -z "$narrowed" ]; then
              echo "native units: no impacted unit targets on this diff; the merge-queue run covers them."
              exit 0
            fi
            targets=()
            while IFS= read -r target; do
              targets+=("$target")
            done <<< "$narrowed"
          fi
          scripts/ci-timed "$LANE_NAME native units" -- ./buck2 test "${targets[@]}"

      - name: Run every declaratively platform-scoped spec and CLI case
        if: steps.sel.outputs.run == 'true'
        # The shared manifest selector registers all `only_on` cases for this
        # host, including cases added later, without repeating either complete
        # target-independent corpus.
        run: scripts/ci-timed "${{ matrix.name }} platform corpus" -- scripts/run-native-platform-corpus.sh

      - name: Run native ABI programs
        if: steps.sel.outputs.run == 'true'
        run: scripts/ci-timed "${{ matrix.name }} ABI" -- scripts/rue cli abi

      - name: Run native linker programs
        if: steps.sel.outputs.run == 'true'
        run: scripts/ci-timed "${{ matrix.name }} linker" -- scripts/rue cli cli.linker

      - name: Run native filesystem and platform programs
        if: steps.sel.outputs.run == 'true'
        run: scripts/ci-timed "${{ matrix.name }} platform" -- scripts/rue cli cli.fs_file_io

      # See the premerge lane's rationale (RUE-1268).
      - name: Upload failing-suite output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.name }}-failure-logs
          path: ${{ runner.temp }}/rue-ci-failed-logs
          if-no-files-found: ignore

  # RUE-617/RUE-1019: keep the byte-reproducibility proof independent of the
  # cache-enabled Linux test lane. Both reference and relocated candidate are
  # built locally, cache-free, under identical configuration; the job overlaps
  # ordinary tests instead of delaying them.
  compiler-reproducibility:
    runs-on: ubuntu-latest
    name: compiler reproducibility (linux-x64)
    if: ${{ always() }}
    needs: affected-targets
    steps:
      - uses: actions/checkout@v6

      # RUE-1130: consult the determinator before any heavy setup. On a
      # selective pull_request run where nothing this lane executes is affected,
      # the heavy steps are skipped and the check still reports success, so no
      # branch-protection change is required. Fail-open: unless the determinator
      # explicitly says full=false and omits this lane, the lane runs.
      - name: Lane selection
        id: sel
        env:
          RUE_AFFECTED_FULL: ${{ needs.affected-targets.outputs.full }}
          RUE_AFFECTED_LANES: ${{ needs.affected-targets.outputs.selected_lanes }}
        run: scripts/ci-corpus-decision "compiler-reproducibility"

      - name: Install dotslash
        if: steps.sel.outputs.run == 'true'
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Cache dotslash artifacts
        if: steps.sel.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Verify compiler build reproducibility
        if: steps.sel.outputs.run == 'true'
        id: compiler_repro
        run: scripts/ci-timed "compiler reproducibility" -- ./scripts/check-reproducible-compiler.sh

      - name: Upload compiler reproducibility diagnostics
        if: failure() && steps.compiler_repro.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: compiler-reproducibility-diagnostics
          path: ${{ runner.temp }}/rue-compiler-repro-artifacts
          if-no-files-found: ignore


  # ADR-0070 negative control 3 (RUE-1404): digest sensitivity of the
  # rue_program action chain. Required like every job here — this repository
  # has no unaggregated-job tier (//:ci-gate-validation enforces it), and a
  # hermeticity control nobody gates on decays. The script asserts only what
  # buck2 guarantees (steady-state convergence, fresh-probe retries past the
  # lossy file watcher), and the lane decision skips it when nothing it
  # exercises is affected.
  rue-program-digests:
    runs-on: ubuntu-latest
    name: rue_program digest sensitivity (linux-x64)
    if: ${{ always() }}
    needs: affected-targets
    steps:
      - uses: actions/checkout@v6

      - name: Lane selection
        id: sel
        env:
          RUE_AFFECTED_FULL: ${{ needs.affected-targets.outputs.full }}
          RUE_AFFECTED_LANES: ${{ needs.affected-targets.outputs.selected_lanes }}
        run: scripts/ci-corpus-decision "rue-program-digests"

      - name: Install dotslash
        if: steps.sel.outputs.run == 'true'
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Cache dotslash artifacts
        if: steps.sel.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Provision remote cache
        if: steps.sel.outputs.run == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Check rue_program digest sensitivity
        if: steps.sel.outputs.run == 'true'
        run: scripts/ci-timed "rue_program digests" -- ./scripts/check-rue-program-digests.sh

  # RUE-1119: on pull_request, select only the heavy corpus suites the diff
  # actually affects, using Meta's off-the-shelf Buck Target Determinator (BTD,
  # facebookincubator/buck2-change-detector) instead of a hand-rolled query.
  # merge_group and workflow_dispatch always force the authoritative full run;
  # the decision is fail-open, so any tool/VCS/graph error, or any change to an
  # out-of-graph input (the ./buck2 pin, test.sh, scripts/ci-*, this workflow,
  # .buckconfig/BUCK/.bzl/toolchains), runs the whole corpus. Only the
  # platform-corpus heavy suites below consult this; every other job in the
  # workflow runs unconditionally, so selection can only ever drop the corpus
  # jobs that BTD proved unaffected. The scripts stay fail-open by construction,
  # and scripts/test-affected-targets.sh pins the force-full and gate logic.
  affected-targets:
    runs-on: ubuntu-latest
    name: affected targets (linux-x64)
    outputs:
      full: ${{ steps.decide.outputs.full }}
      selected: ${{ steps.decide.outputs.selected }}
      # RUE-1130. A referenced-but-undeclared job output silently resolves to
      # the empty string, which for a lane gate means "selected nothing" —
      # every gated lane would deselect on a selective run. validate-ci-gate.py
      # now fails closed on that, because the failure only appears on the
      # peripheral PRs the gating exists for, and never on a CI-touching one.
      selected_lanes: ${{ steps.decide.outputs.selected_lanes }}
      # The impacted-target closure, and the determinator's own flag for whether
      # narrowing to it is worthwhile. Consumers key on `narrowed`; an absent or
      # empty `impacted` therefore reads as "run everything", never "run
      # nothing".
      narrowed: ${{ steps.decide.outputs.narrowed }}
      impacted: ${{ steps.decide.outputs.impacted }}
    steps:
      - uses: actions/checkout@v6
        # BTD compares the graph at the merge-base and at the head, so the base
        # commit history must be present.
        with:
          fetch-depth: 0

      - name: Install dotslash
        if: github.event_name == 'pull_request'
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Cache dotslash artifacts
        if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2', 'btd') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Provision remote build cache
        if: github.event_name == 'pull_request'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Decide affected corpus targets
        # Fail-open: the script always exits 0 with a decision (full on any
        # error), so this job never blocks the merge-group full run and a
        # provisioning failure just means "run everything".
        id: decide
        env:
          RUE_AFFECTED_EVENT: ${{ github.event_name }}
          RUE_AFFECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUE_AFFECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/affected-targets decide

  # The target-independent CLI and spec corpora run on Linux. RUE-1116/RUE-1158:
  # the ordinary CLI corpus is split into CLI_TEST_SHARD_COUNT (BUCK)
  # measured-cost shards so its wall time collapses to balanced N-way slices;
  # //:cli-shard-coverage-validation keeps this matrix and the BUCK shard set
  # in lockstep.
  #
  # RUE-1119: each job first consults the affected-targets determinator and,
  # on a pull_request where its corpus is provably unaffected, skips the heavy
  # steps (recording an intentional deselection) instead of running the suite.
  # merge_group always reports full=true, so every corpus runs there.
  platform-corpus:
    if: ${{ always() }}
    needs: affected-targets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cache_name: linux-x64
            target: //:cli-tests-shard-0
            name: cli-shard-0
            check_name: linux-x64-cli-shard-0
          - os: ubuntu-latest
            cache_name: linux-x64
            target: //:cli-tests-shard-1
            name: cli-shard-1
            check_name: linux-x64-cli-shard-1
          - os: ubuntu-latest
            cache_name: linux-x64
            target: //:cli-tests-shard-2
            name: cli-shard-2
            check_name: linux-x64-cli-shard-2
          - os: ubuntu-latest
            cache_name: linux-x64
            target: //:cli-tests-shard-3
            name: cli-shard-3
            check_name: linux-x64-cli-shard-3
          - os: ubuntu-latest
            cache_name: linux-x64
            target: //:spec-tests
            name: spec
            check_name: linux-x64-spec
          # RUE-1117: the RUE-205/RUE-204 codegen differential — every runnable
          # CLI and spec case executed through the reference interpreter and
          # compared against the compiler's own result. It is the check that
          # catches codegen diverging from the language's semantics, so it
          # belongs on the pre-merge critical path rather than in the nightly
          # release sweep, where a divergence surfaces up to a day late,
          # attributed to a schedule rather than to the PR that caused it, and
          # only in release configuration. Both corpora are target-independent,
          # so one linux-x64 lane each is the whole platform requirement.
          - os: ubuntu-latest
            cache_name: linux-x64
            target: //crates/rue-oracle-diff:oracle-diff-test
            name: oracle-diff
            check_name: linux-x64-oracle-diff
          - os: ubuntu-latest
            cache_name: linux-x64
            target: //crates/rue-oracle-diff:oracle-diff-spec-test
            name: oracle-diff-spec
            check_name: linux-x64-oracle-diff-spec
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.check_name }})
    steps:
      - uses: actions/checkout@v6

      # RUE-1119: decide selection before any heavy setup. On a selective PR run
      # where this corpus is unaffected the job records an intentional
      # deselection and skips every step below, so a deselected corpus costs
      # only the runner spin-up. Fail-open: unless the determinator explicitly
      # says full=false and omits this target, the corpus runs.
      - name: Corpus selection
        id: sel
        env:
          RUE_AFFECTED_FULL: ${{ needs.affected-targets.outputs.full }}
          RUE_AFFECTED_TARGETS: ${{ needs.affected-targets.outputs.selected }}
        run: scripts/ci-corpus-decision "${{ matrix.target }}"

      - name: Select Xcode 16.2
        if: runner.os == 'macOS' && steps.sel.outputs.run == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install dotslash
        if: steps.sel.outputs.run == 'true'
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Cache dotslash artifacts
        if: steps.sel.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-${{ matrix.cache_name }}-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-${{ matrix.cache_name }}-

      - name: Provision remote build cache
        if: steps.sel.outputs.run == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Run ${{ matrix.name }} corpus
        if: steps.sel.outputs.run == 'true'
        run: scripts/ci-timed "${{ matrix.check_name }} corpus" -- scripts/ci-heavy-suite "${{ matrix.target }}"

      - name: Upload CLI case timings
        if: always() && startsWith(matrix.name, 'cli-shard-') && steps.sel.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.check_name }}-case-timings
          path: ${{ runner.temp }}/rue-cli-case-timings.jsonl
          if-no-files-found: ignore
          overwrite: true

      # See the premerge lane's rationale (RUE-1268).
      - name: Upload failing-suite output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.check_name }}-failure-logs
          path: ${{ runner.temp }}/rue-ci-failed-logs
          if-no-files-found: ignore

  # Focused release-mode coverage (RUE-1129). Correctness-critical compiler
  # invariants are enforced independently by validate-debug-assert-policy.py;
  # this job proves Buck selects the real optimization flags and runs a bounded
  # end-to-end corpus through the release-built compiler. The scheduled
  # release.yml workflow retains exhaustive release //... coverage without
  # putting every optimized target and ThinLTO link on the required critical
  # path. Debug CI above still covers arm64/macOS.
  release:
    runs-on: ubuntu-latest
    name: release (linux-x64)
    if: ${{ always() }}
    needs: affected-targets
    steps:
      - uses: actions/checkout@v6

      # RUE-1130: consult the determinator before any heavy setup. On a
      # selective pull_request run where nothing this lane executes is affected,
      # the heavy steps are skipped and the check still reports success, so no
      # branch-protection change is required. Fail-open: unless the determinator
      # explicitly says full=false and omits this lane, the lane runs.
      - name: Lane selection
        id: sel
        env:
          RUE_AFFECTED_FULL: ${{ needs.affected-targets.outputs.full }}
          RUE_AFFECTED_LANES: ${{ needs.affected-targets.outputs.selected_lanes }}
        run: scripts/ci-corpus-decision "release"

      - name: Install dotslash
        if: steps.sel.outputs.run == 'true'
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      # Same dotslash cache as the other jobs (buck2 binary only; see the `test`
      # job for why buck-out isn't worth caching).
      - name: Cache dotslash artifacts
        if: steps.sel.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/dotslash
            ~/Library/Caches/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      # BuildBuddy remote action cache (RUE-316/RUE-1006); see the clippy job
      # for the secret-availability contract.
      - name: Provision remote build cache
        if: steps.sel.outputs.run == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      # Direct RUE-277 guard: inspect Buck's analyzed rustc_cfg actions instead
      # of inferring optimization from complete binary bytes. This performs no
      # compilation and also pins the release callers to the target platform.
      - name: Validate release configuration
        if: steps.sel.outputs.run == 'true'
        run: scripts/ci-timed "release configuration" -- scripts/validate-release-configuration.py

      # Builds only the Rue driver and CLI harness under the release platform,
      # then runs the 24 representative differential-opt cases (96 produced
      # programs across -O0/-O1/-O2/-O3) through the release-built compiler.
      - name: Run focused release smoke
        if: steps.sel.outputs.run == 'true'
        run: scripts/ci-timed "release smoke" -- ./buck2 test //:release-smoke --target-platforms //platforms:release

  # Generated-code memory safety under Valgrind. Required PR and merge-group
  # coverage excludes the full generated applications; manual CI dispatch can
  # opt into either application through the workflow input.
  valgrind:
    runs-on: ubuntu-latest
    name: valgrind (linux-x64)
    if: ${{ always() }}
    needs: affected-targets
    steps:
      - uses: actions/checkout@v6

      # RUE-1130: consult the determinator before any heavy setup. On a
      # selective pull_request run where nothing this lane executes is affected,
      # the heavy steps are skipped and the check still reports success, so no
      # branch-protection change is required. Fail-open: unless the determinator
      # explicitly says full=false and omits this lane, the lane runs.
      - name: Lane selection
        id: sel
        env:
          RUE_AFFECTED_FULL: ${{ needs.affected-targets.outputs.full }}
          RUE_AFFECTED_LANES: ${{ needs.affected-targets.outputs.selected_lanes }}
        run: scripts/ci-corpus-decision "valgrind"

      - name: Install dotslash
        if: steps.sel.outputs.run == 'true'
        uses: facebook/install-dotslash@v2  # pinned: the moving `latest` branch broke macOS runners (sha256sum flags) on 2026-06-18

      - name: Cache dotslash artifacts
        if: steps.sel.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/dotslash
          key: dotslash-linux-x64-${{ hashFiles('buck2') }}
          restore-keys: |
            dotslash-linux-x64-

      - name: Provision remote build cache
        if: steps.sel.outputs.run == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY unavailable (fork PR or unset); building without the remote cache."
            exit 0
          fi
          scripts/provision-build-cache install
          scripts/provision-build-cache apply

      - name: Install valgrind
        if: steps.sel.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build Rue compiler
        if: steps.sel.outputs.run == 'true'
        run: ./buck2 build //crates/rue:rue

      - name: Run programs under Valgrind memcheck
        if: steps.sel.outputs.run == 'true'
        env:
          RUE_SANITIZER_LARGE_PROGRAMS: ${{ github.event_name == 'workflow_dispatch' && inputs.large_program || 'none' }}
        run: scripts/run-sanitizer.sh

  # AddressSanitizer over rue-runtime's arena allocator. This standalone Cargo
  # harness requires a pinned nightly and therefore remains an explicit job.
  asan:
    runs-on: ubuntu-latest
    name: asan (linux-x64)
    env:
      NIGHTLY: nightly-2026-04-13
    if: ${{ always() }}
    needs: affected-targets
    steps:
      - uses: actions/checkout@v6

      # RUE-1130: consult the determinator before any heavy setup. On a
      # selective pull_request run where nothing this lane executes is affected,
      # the heavy steps are skipped and the check still reports success, so no
      # branch-protection change is required. Fail-open: unless the determinator
      # explicitly says full=false and omits this lane, the lane runs.
      - name: Lane selection
        id: sel
        env:
          RUE_AFFECTED_FULL: ${{ needs.affected-targets.outputs.full }}
          RUE_AFFECTED_LANES: ${{ needs.affected-targets.outputs.selected_lanes }}
        run: scripts/ci-corpus-decision "asan"

      - name: Install pinned nightly Rust
        if: steps.sel.outputs.run == 'true'
        run: >
          rustup toolchain install "$NIGHTLY" --profile minimal
          --component clippy,rust-src

      - name: Clippy the ASan harness
        if: steps.sel.outputs.run == 'true'
        env:
          RUSTFLAGS: "-Zsanitizer=address"
        run: >
          cargo "+$NIGHTLY" clippy
          --manifest-path crates/rue-runtime-asan/Cargo.toml
          --target x86_64-unknown-linux-gnu
          -- -D warnings

      - name: Exercise the arena allocator under AddressSanitizer
        if: steps.sel.outputs.run == 'true'
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0"
        run: >
          cargo "+$NIGHTLY" run
          --manifest-path crates/rue-runtime-asan/Cargo.toml
          --target x86_64-unknown-linux-gnu

  # Independent structural proof that the aggregate dependency inventory and
  # platform responsibilities still match the reviewed contract. It has no
  # needs, uses always(), and itself feeds the aggregate.
  ci-contract:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: CI contract
    # `actions: read` is for the scheduled-workflow health check below. The
    # block is explicit because declaring one narrows the whole job: checkout
    # needs `contents: read` named alongside it.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate aggregate gate and platform responsibilities
        run: scripts/validate-ci-gate.py .github/workflows/ci.yml

      # RUE-1117: `//:tier-ci-selector-validation` also runs this in the premerge
      # Buck pass. Repeating it here needs no toolchain and keeps the structural
      # answer to "does any job actually run this tier?" next to the rest of the
      # CI contract, independent of whether the Buck lane got that far.
      - name: Validate deliberate CI selection of every test tier
        run: >-
          scripts/validate-tier-ci-selectors.py
          --test-defs test_defs.bzl
          --test-tiers-bxl test_tiers.bxl
          --workflow .github/workflows/ci.yml
          --workflow .github/workflows/release.yml

      # RUE-1507. A `schedule:` workflow has no audience: no pull request waits
      # on it and its result is a row in a tab nobody opens, which is how
      # `correctness-repetitions.yml` failed every scheduled run it ever had for
      # eleven days unnoticed. The check belongs *here*, on the pull-request
      # path, precisely because the thing being diagnosed is that unattended
      # signals are not read — reporting it on another timer would inherit the
      # bug. Exactly one condition fails this step: a workflow that has run at
      # least twice on its schedule and never once succeeded. Staleness, a
      # disabled workflow, and any API trouble warn and pass, because a false
      # positive here blocks every merge in the repository.
      - name: Check scheduled workflows are still succeeding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/check-scheduled-workflows.py --repo "$GITHUB_REPOSITORY"

  # The only stable branch-protection context. Matrix children may be reshaped
  # without changing this displayed name. The evaluator rejects missing,
  # renamed, extra, failed, cancelled, or unexpectedly skipped dependencies.
  ci-success:
    if: ${{ always() }}
    needs:
      - fmt
      - clippy
      - actionlint
      - remote-execution
      - rust-project
      - linux-premerge
      - performance-staleness
      - native-platforms
      - compiler-reproducibility
      - rue-program-digests
      - affected-targets
      - platform-corpus
      - release
      - valgrind
      - asan
      - ci-contract
    runs-on: ubuntu-latest
    name: CI success
    steps:
      - uses: actions/checkout@v6
      - name: Require every expected CI dependency
        env:
          RUE_CI_EVENT: ${{ github.event_name }}
          RUE_CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          scripts/ci-required-results.py
          --event "$RUE_CI_EVENT"
          --needs-json "$RUE_CI_NEEDS"
