name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test with Cargo (standard Rust toolchain)
  cargo-test:
    name: Cargo Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust ${{ matrix.rust }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      if: matrix.rust == 'stable'
      run: cargo fmt --all -- --check
    
    - name: Clippy
      if: matrix.rust == 'stable'
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose
    
    - name: Run specification compliance tests
      if: matrix.rust == 'stable'
      run: |
        cargo run -p rue-runner -- \
          --test-paths tests/spec \
          --rue-binary target/debug/rue
    
    - name: Run comprehensive parser tests
      if: matrix.rust == 'stable'
      run: |
        cargo test -p rue-parser --test test_comprehensive_parser
        cargo test -p rue-parser --test test_aggregate_types

  # Test with Buck2
  buck2-test:
    name: Buck2 Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Buck2
      uses: dtolnay/install-buck2@latest
    
    - name: Install Reindeer
      run: |
        cargo install --git https://github.com/facebookincubator/reindeer reindeer
    
    - name: Cache Buck2 dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          buck-out/
        key: ${{ runner.os }}-buck2-${{ hashFiles('**/Cargo.lock', 'BUCK', '**/*.BUCK') }}
    
    - name: Buck2 build
      run: buck2 build //crates/rue:rue
    
    - name: Buck2 test
      run: buck2 test //crates/...
    
    - name: Buck2 run simple.rue
      run: buck2 run //crates/rue:rue examples/basic/simple.rue

    - name: Buck2 run compiler-example
      run: buck2 run //crates/rue-compiler:basic_usage

  # Integration tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [cargo-test, buck2-test]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    
    - name: Build rue with Cargo
      run: cargo build --release -p rue -p rue-runner
    
    - name: Run basic integration tests
      run: |
        ./target/release/rue examples/basic/simple.rue || echo "Compilation test complete"
        echo "Integration tests will be added as features are implemented"
    
    - name: Run test suite with runner
      run: |
        # Build the test runner first
        cargo build --release -p rue-runner
        
        # Run the spec-linked tests
        ./target/release/rue-runner \
          --test-paths tests/spec tests/simple \
          --rue-binary ./target/release/rue \
          --report-file test-report.json || true
        
        # Show summary if report exists
        if [ -f test-report.json ]; then
          echo "Test Summary:"
          jq '.summary' test-report.json
        fi
        
        # Run validation script for new tests
        if [ -f tests/runner/validate_new_tests.sh ]; then
          chmod +x tests/runner/validate_new_tests.sh
          ./tests/runner/validate_new_tests.sh ./target/release/rue || true
        fi

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run security audit
      run: cargo audit

  # Check for outdated dependencies
  deps:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-outdated
      run: cargo install cargo-outdated
    
    - name: Check for outdated dependencies
      run: cargo outdated --exit-code 1
      continue-on-error: true  # Don't fail the build, just warn