name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  # Fast feedback for PRs - format, lint, and build check
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dotslash
        uses: facebook/install-dotslash@latest

      - name: Cache Buck2 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotslash/cache
            buck-out/v2/
          key: ${{ runner.os }}-buck2-${{ hashFiles('**/*.BUCK', '.buckconfig', 'third-party/**') }}
          restore-keys: |
            ${{ runner.os }}-buck2-

      # Run these checks in parallel for faster feedback
      - name: Format check
        run: ./buck2 test //tools/rustfmt:fmt_check_test

      - name: Clippy check
        run: ./buck2 bxl //tools/bxl:clippy.bxl:all

      - name: Build all targets
        run: ./buck2 build //...

  # All tests - Buck2 handles parallelism internally
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quick-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dotslash
        uses: facebook/install-dotslash@latest

      - name: Install jq for JSON parsing
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Cache Buck2 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotslash/cache
            buck-out/v2/
          key: ${{ runner.os }}-buck2-${{ hashFiles('**/*.BUCK', '.buckconfig', 'third-party/**') }}
          restore-keys: |
            ${{ runner.os }}-buck2-

      - name: Run all tests
        run: ./buck2 test //...

      - name: Run spec tests
        run: |
          # Run the test runner with buck2 run, passing the rue binary path
          ./buck2 run //crates/rue-runner -- \
            --test-paths tests \
            --rue-binary "$(./buck2 targets --show-output //crates/rue:rue | awk '{print $2}')" \
            --spec-file spec/norms.toml
