preparer = "scripts/gazette-corpus-diff.py"
preparer_revision = 5
scale = 10
excluded = [".error-pages-backup", ".error-pages-staging", "errors", "performance.md", "runtime.md"]
root_name = "gazette-site-10x"
description = "the same committed-content corpus at ten copies, by deterministic path-prefixed duplication"

[suite.workloads.oracle]
kind = "semantic_site_pages"
path = "scripts/gazette-corpus-diff.py"

# The pinned reference regime. Epoch 1 implements suite revision 1, epoch 2
# revision 2, epoch 3 revision 3, epoch 4 revision 4, epoch 5 revision 5, and
# epoch 6 revision 6;
# only the last collects. Declaring a new epoch rather than moving an old one
# to the new revision is what keeps every record already in the store valid: a
# stored report names the epoch it ran under, and that epoch must go on
# describing the run it describes.
#
# The `local` rows are numbered in one sequence with these but declared at the
# end of the file, one per target for the revision that collects (RUE-1498).
[[epoch]]
id = 1
platform = "x86_64-linux"
suite_revision = 1
target = "x86-64-linux"
# Release quality, matching ADR-0071's definition of the product. A runtime
# series measuring anything else would not be measuring what Rue ships.
compiler_args = ["-O3"]
optimization = "o3"
# Rue has no concurrency support, so every sample is single-threaded and the
# record says so rather than leaving a future reader to infer it.
thread_policy = "single_threaded"
# GitHub-hosted runners expose no PMU. Counters are gated on a future
# controlled-hardware epoch (ADR-0072 Decision 5) rather than quietly missing.
hardware_counters = "unavailable_on_hosted_runner"
# Superseded by epoch 2, which implements suite revision 2. Kept declared so
# the reports already stored under it stay readable and valid.
collection = false

[epoch.environment]
runner_label = "github-hosted"
runner_image = "ubuntu-24.04"

# Five independent fresh processes. There is no batching factor: this workload
# runs for seconds, so timer resolution is not a threat, and batching would hide
# the per-run dispersion that the calibration this epoch still lacks must
# eventually measure.
[epoch.sampling.wordfreq]
samples = 5

# No `[epoch.calibration]` yet. Calibration is runtime-specific and per-platform
# — dispersion is a property of the workload, never inherited from the compiler
# suites — so until this workload's own repeated samples on this regime have
# been analysed, every regression flag on it is advisory.
#
# No `[epoch.flagging.wordfreq]` either, so no flag is published at all yet. That
# table is the provisional bound a maintainer may declare ahead of calibration:
# it makes movement visible for triage while the posture stays advisory. It is
# deliberately empty because what `k` and `window` should be here is ADR-0072's
# open question 4, and the two obvious answers are both wrong. The compile-time
# k = 3.0 is a pre-calibration placeholder that RUE-1187's sweep roughly doubled
# to k = 6.0 on this same runner regime, and this suite takes five samples per
# observation where the startup probe takes twelve — a noisier median, which
# argues for a wider bound than 6.0 rather than a narrower one. Guessing it here
# would train a reader to ignore the word "flagged", which manifest.toml already
# names as the worse failure. Declare it when someone has grounds to.

# The arm64 Linux reference regime, on the pinned `ubuntu-24.04-arm` image.
#
# It joins on the condition ADR-0072 set for it — the Phase 2 standard-library
# work CI-verified on this hardware — which RUE-1481 and RUE-1482 satisfied. That
# verification was not a formality: the first arm64 run of RUE-1481 failed every
# directory-listing case because `O_DIRECTORY` differs between x86-64 and aarch64
# on Linux while the code dispatched on OS alone.
#
# Per push, like the x86-64 row and for the same reason: `ubuntu-24.04-arm` is
# the same hosted-runner class as `ubuntu-24.04`, this workflow already pays for
# one on every push for the compile-time legs, and an observation at every commit
# cannot be collected retroactively once calibration makes it readable.
[[epoch]]
id = 1
platform = "aarch64-linux"
suite_revision = 1
target = "aarch64-linux"
compiler_args = ["-O3"]
optimization = "o3"
thread_policy = "single_threaded"
hardware_counters = "unavailable_on_hosted_runner"
# Superseded by epoch 2, which implements suite revision 2.
collection = false

# The runner is `ubuntu-24.04-arm`; the image it reports is `ubuntu-24.04`,
# which is how ADR-0067's aarch64-linux epochs already record this regime. The
# architecture is not lost — it rides every record's environment fingerprint,
# and a run built for another target could not satisfy this epoch's `target`.
[epoch.environment]
runner_label = "github-hosted"
runner_image = "ubuntu-24.04"

# Five, matching the x86-64 row: same runner class, same expected dispersion,
# and the two Linux series are easiest to read against each other when their
# sampling policies differ in nothing.
[epoch.sampling.wordfreq]
samples = 5

# No `[epoch.calibration]`. A new platform has none of its own and inherits none
# from the row already collecting, so every flag here is advisory.

# The Apple Silicon reference regime, on the pinned `macos-15` image.
#
# This row is measured, not deferred. The deferral it replaces named the
# `@syscall` carry-flag error-detection gap, which no longer describes the macOS
# Rue supports: RUE-945 taught the AArch64 backend to normalize Darwin's
# carry-set positive errno to the negative convention `@syscall` presents
# everywhere, so `wordfreq`'s open/read loop distinguishes a failure from a small
# successful return here exactly as it does on Linux. The gap does remain open in
# the x86-64 backend, but `x86-64-macos` is not a Rue target at all and is out of
# scope for the project, so it defers nothing.
#
# Collected daily rather than per push (ADR-0072 Decision 9). Hosted macOS
# runners are the most expensive and most concurrency-limited class in the pool,
# and per-push attribution buys precision this platform cannot act on while its
# flags are advisory. The schedule also gives the missing calibration the input
# it needs: a day in which trunk did not move repeats the measurement at the
# same compiler revision.
[[epoch]]
id = 1
platform = "aarch64-macos"
suite_revision = 1
target = "aarch64-macos"
compiler_args = ["-O3"]
optimization = "o3"
thread_policy = "single_threaded"
hardware_counters = "unavailable_on_hosted_runner"
# Superseded by epoch 2, which implements suite revision 2.
collection = false

[epoch.environment]
runner_label = "github-hosted"
runner_image = "macos-15"

# Nine, where the reference Linux regime takes five. This is an arbitrary
# starting point pending calibration, and it is recorded as one rather than
# dressed up: nothing has measured this workload's dispersion on this regime, so
# no sample count here can be justified by data yet. What the number is chosen
# *for* is reaching that data sooner — this row is off the per-push path, so four
# extra fresh processes of a seconds-long workload cost a fraction of the release
# build the job already pays for, and a larger n per observation makes the
# dispersion estimate calibration will be built from converge faster.
#
# It is deliberately not the compiler suites' nine. `performance/manifest.toml`
# gives every platform nine samples of the startup probe, and that is a different
# workload on a different boundary with a batching factor this suite does not
# have; borrowing it would be exactly the inheritance the note below refuses.
# ADR-0067 gives the sampling policy to the epoch so that changing this one is a
# visible event on this platform alone.
[epoch.sampling.wordfreq]
samples = 9

# No `[epoch.calibration]` here either, and not because it was forgotten.
# Calibration is never inherited — not from the compiler suites, and not from a
# runtime row already collecting, however long it has been running — so every
# regression flag on this platform is advisory until its own repeated samples on
# this regime have been analysed.

# A development epoch for local runs on an x86-64 Linux host. Not a collection
# target: its environment policy admits only `local`, so a hosted runner cannot
# append to it, and a laptop cannot append to the reference series.
#
# The first of the `local` rows. A local run builds for its epoch's `target`
# and then executes what it built, so the epoch a maintainer selects with
# `--epoch` is the one whose target their own host can run; the block at the
# end of this file declares one per target for the revision that collects, and
# lists every local epoch (RUE-1498).
[[epoch]]
id = 1
platform = "local"
suite_revision = 1
target = "x86-64-linux"
compiler_args = ["-O3"]
optimization = "o3"
thread_policy = "single_threaded"
hardware_counters = "unavailable_on_hosted_runner"
collection = false

[epoch.environment]
runner_label = "local"
runner_image = "local"

[epoch.sampling.wordfreq]
samples = 2

# ===========================================================================
# EPOCH 2: suite revision 2 (RUE-1485). SUPERSEDED by epoch 3 and kept
# declared, because the records taken under it name it.
#
# One new thing is declared per platform beyond the added workloads: the peer
# policy. Thread policy belongs to the epoch rather than the suite because it
# is a property of how a platform runs the workload, and on a four-vCPU hosted
# runner it is the difference between measuring per-unit work and measuring
# core count. Rue has no concurrency, so the PRIMARY published ratio pins Zola
# to one rayon thread and Hugo to one `GOMAXPROCS`; their default parallel
# configuration is measured too and published as a clearly labelled SECONDARY
# row, so the number a user would actually experience is never hidden.
#
# The canary is Decision 9's: one single-threaded Zola build of the 1x corpus
# rides every gazette observation, taking the workload's own sample count, so
# every observation has a same-run ratio denominator instead of leaning on a
# stale or singleton peer sample. The rest of the peer matrix — Hugo, the scale
# variants, the secondary row — is event-driven, and the event is detected at
# fixture-preparation time in this same job: the recorded fixture identity
# moved, a peer version moved, or the epoch changed.
# ===========================================================================
[[epoch]]
id = 2
platform = "x86_64-linux"
suite_revision = 2
target = "x86-64-linux"
compiler_args = ["-O3"]
optimization = "o3"
thread_policy = "single_threaded"
hardware_counters = "unavailable_on_hosted_runner"
# Superseded by epoch 3, which implements suite revision 3 and pins the
# comparison-configuration identity. Kept declared so the reports already
# stored under it stay readable and valid.
collection = false

[epoch.environment]
runner_label = "github-hosted"
runner_image = "ubuntu-24.04"

[epoch.sampling.wordfreq]
samples = 5

# Five, matching wordfreq: same runner class, same fresh-process boundary, and
# two series on one platform are easiest to read against each other when their
# sampling policies differ in nothing.
[epoch.sampling.gazette]
samples = 5

# Three at 10x. The rung exists for the shape of the curve rather than for a
# tight median, and it is ten times the per-sample work of the 1x row on a job
# that already pays for a release build of the compiler.
[epoch.sampling.gazette_10x]
samples = 3

[epoch.peers.gazette]
tools = ["zola", "hugo"]
primary_thread_policy = "pinned_single_thread"
secondary_thread_policy = "tool_default_parallel"
canary_tool = "zola"
canary_scale = 1

# The 10x rung's peers ride the 10x fixture: the peers build the workload's own
# corpus, so the canary that anchors this rung's ratio is a 10x Zola build. The
# event-driven half — Hugo and the default-parallel secondary row — is the same
# leg as the 1x row's and fires on the same events.
[epoch.peers.gazette_10x]
tools = ["zola", "hugo"]
primary_thread_policy = "pinned_single_thread"
secondary_thread_policy = "tool_default_parallel"
canary_tool = "zola"
canary_scale = 10

# No `[epoch.calibration]` and no `[epoch.flagging]` for either new workload.
# Calibration is a property of a workload on a platform and is never inherited
# — not from the compiler suites, not from wordfreq on this same runner — so
# gazette arrives advisory exactly as wordfreq did, and says so here rather
