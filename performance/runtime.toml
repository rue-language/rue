# Runtime performance of compiled Rue programs (ADR-0072, RUE-1046).
#
# This suite is intentionally separate from `manifest.toml`, `scaling.toml`, and
# `incremental.toml`, all of which measure the *compiler*. Here the compiler is
# a tool: each workload is built at release quality and the measurement is of
# the program it produced, spawn to exit.
#
# It follows ADR-0067's two-layer versioning — a suite revision pins the logical
# workload contract, a platform epoch pins how one platform runs it — with one
# deliberate amendment, ADR-0072 Decision 2. A runtime workload consumes *data*,
# and data is the third input category the compile-time suites do not have: a
# **recorded** input, whose identity is captured with every observation rather
# than failing validation when it changes. `wordfreq`'s fixture is generated
# deterministically from the seed and generator revision pinned below, and is
# recorded all the same, so the digest of the bytes the program actually read
# rides every observation and no generator drift can move a series invisibly.
#
# Two rules are absolute. Fixture preparation and output judgement both happen
# outside the timed window (ADR-0071's boundary discipline), and a run that
# produces wrong output fails regardless of how fast it was.
#
# The v1 platform matrix is every platform Rue targets (ADR-0072 Decisions 5
# and 9; RUE-1488): `x86_64-linux` on `ubuntu-24.04` and `aarch64-linux` on
# `ubuntu-24.04-arm`, both collected on every trunk push, and `aarch64-macos` on
# `macos-15`, collected daily because its runner is the expensive one. No
# platform inherits another's calibration, so a row arrives advisory and says so.
#
# The route out of advisory is `rue-bench calibrate --runtime-reports <dir>`
# (RUE-1497), over this store's records or over the repeated reports the
# `calibrate-runtime` lane of `.github/workflows/performance-calibration.yml`
# produces. It reports each workload's dispersion on each platform and sweeps
# `(k, window)` for the smallest pairing that flags nothing while nothing is
# changing. What it emits is a recommendation to review; declaring an
# `[epoch.calibration]` table below remains a maintainer's edit, because
# ADR-0072's open question 4 is a maintainer's question.
schema_version = 1

[[suite]]
revision = 1
protocol_version = 1
measured_boundary = "spawn_to_exit_v1"

# wordfreq is a permanent member of this suite, not scaffolding for the gazette
# work that motivated ADR-0072. It stays as the string- and map-bound realistic
# workload once gazette lands. `jsonfmt` and `ruelex` may join the same way,
# each with its own declared fixture and oracle.
[[suite.workloads]]
id = "wordfreq"
source = "examples/wordfreq/main.rue"
question = "How fast does a compiled Rue program tokenize and count words in tens of MiB of text?"
program_args = ["{fixture}"]

# 32 MiB is chosen so the run measures word counting and map pressure rather
# than process startup: at roughly eight bytes per token that is about four
# million word occurrences over a vocabulary of 65,536 distinct words.
#
# `bytes`, `seed`, `vocabulary_size`, and `generator_revision` are all pinned,
# and the committed golden output is a function of all four. Changing any of
# them changes the expected output and is therefore a suite-revision event, not
# a tuning knob.
[suite.workloads.fixture]
kind = "seeded_generator"
category = "recorded"
generator = "zipf_ascii_text"
generator_revision = 1
seed = 20260813
bytes = 33554432
vocabulary_size = 65536
file_name = "wordfreq-input.txt"
description = "32 MiB of deterministic ASCII word text with Zipf-distributed word ranks"

# The correctness oracle. Wrong output fails the observation regardless of how
# fast it was, and the comparison happens outside the timed window.
#
# The committed golden was produced by running the compiled program over the
# fixture these pins describe, and independently cross-checked against a
# reference word count of the same bytes. Regenerate it — under a new suite
# revision — only when a pin above deliberately changes the workload. Epoch 1
# targets x86-64 Linux, so on another host pass that host's own local epoch in
# its place; the expected bytes are a function of the fixture pins alone:
#
#     rue-bench runtime --platform local --epoch 1 \
#       --compiler "$(scripts/rue-bin)" --commit "$(git rev-parse HEAD)" \
#       --out /tmp/runtime.json --workdir /tmp/runtime-work
#     /tmp/runtime-work/wordfreq-program /tmp/runtime-work/wordfreq-input.txt \
#       > performance/fixtures/wordfreq/expected-stdout.txt
[suite.workloads.oracle]
kind = "golden_stdout"
path = "performance/fixtures/wordfreq/expected-stdout.txt"

# ===========================================================================
# SUITE REVISION 2 (ADR-0072 Phase 5, RUE-1485) adds gazette.
#
# Adding a workload changes what the suite measures, so it is a suite-revision
# event under ADR-0067's ordinary rules and revision 1's observations are not
# continuous with revision 2's. Revision 1 stays declared: records already in
# the store name it, and a manifest that forgot it could not validate them.
#
# Gazette could not join before this revision because the schema could not
# express its fixture. `FixtureDeclaration` described exactly one shape — a
# single file from a seeded generator — and gazette's input is a tree of ~96
# Markdown files assembled from the live site at a declared scale with two
# pages excluded. The declaration is now tagged, the corpus-tree shape relaxes
# the single-file rule for ITSELF ALONE, and a second oracle kind judges an
# emitted site rather than a line of stdout.
# ===========================================================================
[[suite]]
revision = 2
protocol_version = 1
measured_boundary = "spawn_to_exit_v1"

# Unchanged from revision 1. A permanent member of this suite, and the reason
# the two shapes now sit side by side: whatever the corpus-tree shape needed,
# wordfreq's declaration and its validation are exactly what they were.
[[suite.workloads]]
id = "wordfreq"
source = "examples/wordfreq/main.rue"
question = "How fast does a compiled Rue program tokenize and count words in tens of MiB of text?"
program_args = ["{fixture}"]

[suite.workloads.fixture]
kind = "seeded_generator"
category = "recorded"
generator = "zipf_ascii_text"
generator_revision = 1
seed = 20260813
bytes = 33554432
vocabulary_size = 65536
file_name = "wordfreq-input.txt"
description = "32 MiB of deterministic ASCII word text with Zipf-distributed word ranks"

[suite.workloads.oracle]
kind = "golden_stdout"
path = "performance/fixtures/wordfreq/expected-stdout.txt"

# The anchor workload of ADR-0072: a static site generator written in Rue,
# building the live rue-lang.dev corpus as the real site build assembles it.
[[suite.workloads]]
id = "gazette"
source = "examples/gazette/main.rue"
question = "How fast does a compiled Rue program build the real rue-lang.dev site, against the production tools that build sites for a living?"
program_args = ["build", "{fixture}", "-o", "{output}"]

# The corpus is deliberately NOT frozen (ADR-0072 Decision 2). What is pinned
# here is everything about how the tree is assembled — which preparer, at which
# revision, at which scale, with which pages excluded — and what is recorded
# per observation is the digest of the bytes every tool actually consumed. A
# content change is then a discontinuity in the series rather than an invalid
# run, and it is visible in the data rather than only in a commit log.
#
# `preparer` names the checked-in script rather than duplicating its rules in
# the runner. ADR-0072 calls that script the reference implementation the
# harness mode should adopt rather than reinvent, and a second implementation
# of corpus assembly, routing, exclusion, and validation would be a second
# implementation to disagree — with the peers' fixtures, which it also lays
# out, silently diverging from gazette's.
[suite.workloads.fixture]
kind = "corpus_tree"
category = "recorded"
preparer = "scripts/gazette-corpus-diff.py"
preparer_revision = 1
scale = 1
excluded = ["performance.md", "runtime.md"]
root_name = "gazette-site"
description = "the live rue-lang.dev content plus the copied specification, as website/build.sh assembles it, minus the two pages whose templates read derived benchmark data"

# A site build's answer is not a line of stdout: it is 96 pages, a feed, and a
# redirect stub. The oracle is the checked-in comparison named here, run
# outside the timed window, which judges every emitted page's normalized
# semantics — heading tree, visible text, link targets, shortcode expansion,
# section membership, feed order — against an independent authority, and at
# Phase 5 against the two peer tools building the identical corpus.
#
# A committed byte golden over live corpus output would fail on every content
# change and be re-blessed rather than read, which is the failure a golden
# exists to prevent; the markup-level goldens live on the committed miniature
# site in `performance/fixtures/gazette/` instead, where they stay sensitive.
[suite.workloads.oracle]
kind = "semantic_site_pages"
path = "scripts/gazette-corpus-diff.py"

# The 10x rung of the page-count curve. Same program, same corpus, ten copies
# of it under path prefixes.
#
# The 100x variant is deliberately NOT declared here. It is the scale-variant
# safety valve of ADR-0072 Decision 9 applied in advance: 9,600 pages per
# sample, per push, on every Linux row is a cost nobody has measured yet, and
# the valve exists to move a rung to a schedule rather than to discover the
# bill in a timeout. It remains available from the harness
# (`scripts/gazette-corpus-diff.py peers --scale 100`) and joins the collected
# suite when the 10x rung's cost here is known.
#
# TWO HONESTY NOTES ride every published chart over this axis, and they are
# recorded here because the manifest is what declares the axis exists. It is a
# PAGE-COUNT curve, not a site-size curve: duplication scales per-page work but
# not site shape, so internal links and `get_section` still resolve into the
# original tree and cross-reference resolution stays constant. And the
# specification sidebar COLLAPSES on a duplicated page — a copy's permalink
# prefixes nothing in the original tree, so both arms of the navigation's gate
# go cold — which at 10x is 630 of 700 spec pages rendering one 2,534-byte
# navigation where the 70 originals average 4,446 bytes. The rung therefore
# understates per-page templating work by roughly 57% of mean nav bytes on the
# majority page class, and cannot be read as "what a 1x page costs, times ten".
[[suite.workloads]]
id = "gazette_10x"
source = "examples/gazette/main.rue"
question = "How does a compiled Rue site build scale with page count, at ten copies of the corpus?"
program_args = ["build", "{fixture}", "-o", "{output}"]

[suite.workloads.fixture]
kind = "corpus_tree"
category = "recorded"
preparer = "scripts/gazette-corpus-diff.py"
preparer_revision = 1
scale = 10
excluded = ["performance.md", "runtime.md"]
root_name = "gazette-site-10x"
description = "the same corpus at ten copies, by deterministic path-prefixed duplication"

[suite.workloads.oracle]
kind = "semantic_site_pages"
path = "scripts/gazette-corpus-diff.py"

# ===========================================================================
# SUITE REVISION 3 (RUE-1493) pins preparer revision 2: the identity split.
#
# The workloads are revision 2's, unchanged in what they measure. What changed
# is the preparer, and therefore what an observation RECORDS. ADR-0072
# Decision 2 now asks for two identities rather than one:
#
#   * the WORKLOAD identity — corpus, static assets, assembly rules, and
#     gazette's own template port — which segments Rue's longitudinal series
#     and must not move when a peer port does; and
#   * the COMPARISON-CONFIGURATION identity — that, plus every peer port, the
#     peer preparer's own digest and revision, every peer version, and the
#     epoch — which is what a joined peer row is published against.
#
# Revision 2's single identity did both jobs and did neither correctly: a Hugo
# template edit opened a new segment in gazette's own series, while a Hugo shim
# bump moved no recorded identity at all, so a failed full peer leg left the
# next canary-only run joining a row measured under a version no longer pinned.
#
# The preparer is two files as of this revision, and the second is why the peer
# digest is in the list above: `scripts/gazette_peer_ports.py` holds the peer
# ports, the corpus respelling, the peers' invocations and thread parity, and
# the cross-tool oracle. It is separate precisely so a change to any of them
# moves the comparison identity and not the workload one — the `preparer`
# pinned below is hashed into the WORKLOAD identity, so a peer knob sharing
# that file would segment Rue's series for a change no gazette build reads.
#
# `preparer_revision` is bumped rather than the digest left to move on its own,
# for the reason ADR-0067 gives for every pin: a harness running the older
# preparer would produce records with no comparison identity, and refusing that
# at preparation time is clearer than discovering it as an unappendable record.
#
# REVISION 2 STAYS DECLARED, and so do 1 and the epochs that implement them.
# Records already in the store name their suite revision and their epoch, and a
# manifest that forgot either could not validate them. That is the same reason
# epoch 1 was retired rather than repointed at revision 2.
# ===========================================================================
