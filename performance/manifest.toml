# Compiler-performance suite and platform epochs (ADR-0067).
#
# Two layers. A `[[suite]]` pins the platform-independent logical contract:
# which workloads exist, what program each one is, the phase taxonomy, and the
# runner protocol. A `[[epoch]]` pins everything that varies per platform:
# target and invocation, each workload's own source identity, sampling policy,
# environment policy, and the headline baseline.
#
# Changing what a workload *is* requires a new suite revision, and therefore new
# epochs on every participating platform. Changing only one platform's sampling
# creates a new epoch there alone. Both are deliberate, reviewable events.
#
# What is deliberately NOT pinned here is the product being measured: the Rue
# compiler, `std`, and the first-party toolchain. A std change moves the series
# exactly as a compiler change does, is annotated on the dashboard, and never
# invalidates an observation. Pinning `std` was tried and removed in RUE-1256:
# an `i = i + 1` -> `i += 1` sweep across `std/` rejected every subsequent run
# for ten days while collection, the data branch, and the site build all stayed
# green. `toolchain_hash` remains pinned because it names the *Rust* toolchain
# the compiler is built with — build environment, not product.
#
# STATUS: the `local` epoch below exists so the runner can be exercised during
# development. Its sampling counts are placeholders, not calibrated values, and
# it declares no baseline. The published epochs — with counts, batching factors,
# and the flagging multiplier established by the Phase 4 noise calibration —
# arrive with suite revision 1's declaration in RUE-1188.

[[suite]]
revision = 1
timing_schema_version = 1
protocol_version = 1

[[suite.workloads]]
id = "startup"
source = "performance/workloads/startup/main.rue"
question = "What does a minimal fresh compilation cost end to end?"

# A development epoch for local runs. Not a collection target: its environment
# policy admits only `local`, so a hosted runner cannot append to it.
[[epoch]]
id = 1
platform = "local"
suite_revision = 1
target = "x86_64-unknown-linux-gnu"
args = []
toolchain_hash = "30f50af0ac7111ffb25d5ef1a423642eaeb2e381931a57583e190a84634ee3fe"

[epoch.workload_source_hashes]
startup = "87869467f94e34b8df41900bda44546b610296077c14fab6defda8939fe22be7"

[epoch.environment]
runner_label = "local"
runner_image = "local"

[epoch.sampling.startup]
samples = 3
batch_size = 5

[epoch.flagging]
k = 3.0
window = 10

# Calibration epochs (ADR-0067 Phase 4, RUE-1187).
#
# These exist so the calibration workflow has a sampling policy and an
# environment policy to follow on each hosted platform. They are NOT collection
# targets, and the content pins below are deliberate placeholders.
#
# That is sound because calibration does not compare across revisions: it
# measures the dispersion of one unchanged revision, so comparability — which is
# what the pins protect — is not in question. The runner reports a pin mismatch
# and exits 3, and the workflow tolerates exactly that exit while still treating
# a runner failure as fatal.
#
# The collection epochs are declared below as epoch 2 on each platform. Epoch
# identifiers are never reused, so calibration keeps epoch 1 and the calibration
# workflow keeps working unchanged.

[[epoch]]
id = 1
platform = "x86_64-linux"
suite_revision = 1
target = "x86_64-unknown-linux-gnu"
args = []
toolchain_hash = "calibration-epoch-pins-are-placeholders"

[epoch.workload_source_hashes]
startup = "calibration-epoch-pins-are-placeholders"

[epoch.environment]
runner_label = "github-hosted"
runner_image = "ubuntu-24.04"

# Uncalibrated starting points. The whole purpose of the sweep is to replace
# these with measured values, so treating them as meaningful would be circular.
[epoch.sampling.startup]
samples = 9
batch_size = 5

[epoch.flagging]
k = 3.0
window = 5

[[epoch]]
id = 1
platform = "aarch64-linux"
suite_revision = 1
target = "aarch64-unknown-linux-gnu"
args = []
toolchain_hash = "calibration-epoch-pins-are-placeholders"

[epoch.workload_source_hashes]
startup = "calibration-epoch-pins-are-placeholders"

[epoch.environment]
runner_label = "github-hosted"
runner_image = "ubuntu-24.04"

[epoch.sampling.startup]
samples = 9
batch_size = 5

[epoch.flagging]
k = 3.0
window = 5

[[epoch]]
id = 1
platform = "aarch64-macos"
suite_revision = 1
target = "aarch64-apple-darwin"
args = []
toolchain_hash = "calibration-epoch-pins-are-placeholders"

[epoch.workload_source_hashes]
startup = "calibration-epoch-pins-are-placeholders"

[epoch.environment]
runner_label = "github-hosted"
runner_image = "macos-15"

[epoch.sampling.startup]
samples = 9
batch_size = 5

[epoch.flagging]
k = 3.0
window = 5

# ---------------------------------------------------------------------------
# Collection epochs (ADR-0067 Phase 5, RUE-1188).
#
# These are the real ones. Their pins resolve, so a run that does not match the
# tree it claims to have measured cannot enter a series, and their sampling and
# flagging policies come from the RUE-1187 calibration sweep
# (run 30373471741, 12 repetitions per platform).
#
# Epoch 2, not 1: identifiers are never reused, and epoch 1 on each platform is
# the calibration epoch above.
#
# Measured dispersion of the startup probe, and what it implies:
#
# | platform      | rel. MAD | samples | resulting median uncertainty |
# | ------------- | -------- | ------- | ---------------------------- |
# | aarch64-linux |    0.59% |       3 |                        0.63% |
# | x86_64-linux  |    1.59% |       9 |                        0.98% |
# | aarch64-macos |    6.18% |      99 |                        1.15% |
#
# macOS is roughly ten times noisier than aarch64-linux per observation, but
# sampling absorbs almost all of it: at 99 samples its published median is about
# as certain as Linux's. That costs about five seconds of measured compile time,
# which is why it is included from the start rather than deferred.
#
# Two things here are provisional, and deliberately so.
#
# `aarch64-macos` flagging (k = 5, window = 10) is the only pairing in the sweep
# with no false flags, but it rests on two comparisons — too thin to be called
# settled. It is set wide on purpose: a rule that flags constantly is worse than
# one that is slow to flag, because the first trains people to ignore it.
#
# Every sampling count is calibrated against the startup probe alone, which is
# the whole corpus today. A probe of a few tens of milliseconds makes 99 samples
# free; a workload of several seconds would not. When the corpus grows — caldera
# is expected back — these counts need re-deriving, and that is a new epoch on
# each affected platform.
#
# macOS's true need at the 1% target is about 132 samples. The calibrator clamps
# its recommendation to 99 so one pathological workload cannot make collection
# unaffordable, and reaching that ceiling is itself a finding. The declared 99
# is the calibrated recommendation rather than the uncapped figure; the gap is
# 1.15% achieved uncertainty against the 1.00% target.

[[epoch]]
id = 2
platform = "x86_64-linux"
suite_revision = 1
target = "x86_64-unknown-linux-gnu"
args = []
toolchain_hash = "30f50af0ac7111ffb25d5ef1a423642eaeb2e381931a57583e190a84634ee3fe"

[epoch.workload_source_hashes]
startup = "87869467f94e34b8df41900bda44546b610296077c14fab6defda8939fe22be7"

[epoch.environment]
runner_label = "github-hosted"
runner_image = "ubuntu-24.04"

[epoch.sampling.startup]
samples = 9
batch_size = 3

[epoch.flagging]
k = 2.0
window = 3

# The first complete, valid run at a declared trunk revision, whose
# per-workload medians define ratio 1.0 for this epoch. All three platforms
# measured this same revision validly, so epoch 2 shares a baseline commit.
[epoch.baseline]
commit = "31ff07f6bac131723f60c2a18af5505a8b442320"
run = "4ae3eb4cf1e47277c30ae6c3002b6c84c651e35634424e874e2cca8219b25973"

[[epoch]]
id = 2
platform = "aarch64-linux"
suite_revision = 1
target = "aarch64-unknown-linux-gnu"
args = []
toolchain_hash = "30f50af0ac7111ffb25d5ef1a423642eaeb2e381931a57583e190a84634ee3fe"

[epoch.workload_source_hashes]
startup = "87869467f94e34b8df41900bda44546b610296077c14fab6defda8939fe22be7"

[epoch.environment]
runner_label = "github-hosted"
runner_image = "ubuntu-24.04"

[epoch.sampling.startup]
samples = 3
batch_size = 2

[epoch.flagging]
k = 2.0
window = 3

# The first complete, valid run at this epoch's declared revision (see above).
[epoch.baseline]
commit = "31ff07f6bac131723f60c2a18af5505a8b442320"
run = "b0bbb8dd1bbf4b617da6c9c642218ce8435e1f250fea060e5baf307555e8b9ad"

[[epoch]]
id = 2
platform = "aarch64-macos"
suite_revision = 1
target = "aarch64-apple-darwin"
args = []
toolchain_hash = "30f50af0ac7111ffb25d5ef1a423642eaeb2e381931a57583e190a84634ee3fe"

[epoch.workload_source_hashes]
startup = "87869467f94e34b8df41900bda44546b610296077c14fab6defda8939fe22be7"

[epoch.environment]
runner_label = "github-hosted"
runner_image = "macos-15"

[epoch.sampling.startup]
samples = 99
batch_size = 4

# Provisional: the only false-flag-free pairing in the sweep, on two
# comparisons. Set wide deliberately — a rule that flags constantly trains
# people to ignore it.
[epoch.flagging]
k = 5.0
window = 10

# The first complete, valid run at this epoch's declared revision (see above).
[epoch.baseline]
commit = "31ff07f6bac131723f60c2a18af5505a8b442320"
run = "ff0a3ab928b8e2e601604912404b9ed4b8140a27a2204300d5917143f533574b"
