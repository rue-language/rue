# Compiler-performance suite and platform epochs (ADR-0067).
#
# Two layers. A `[[suite]]` pins the platform-independent logical contract:
# which workloads exist, what program each one is, the phase taxonomy, and the
# runner protocol. A `[[epoch]]` pins everything that varies per platform:
# target and invocation, each workload's own source identity, sampling policy,
# environment policy, and the headline baseline.
#
# Changing what a workload *is* requires a new suite revision, and therefore new
# epochs on every participating platform. Changing only one platform's sampling
# creates a new epoch there alone. Both are deliberate, reviewable events.
#
# What is deliberately NOT pinned here is the product being measured: the Rue
# compiler, `std`, and the first-party toolchain. A std change moves the series
# exactly as a compiler change does, is annotated on the dashboard, and never
# invalidates an observation. `toolchain_hash` remains pinned because it names
# the *Rust* toolchain the compiler is built with — build environment, not
# product. See ADR-0067, "The product boundary".
#
# The `local` epochs below let the runner exercise each suite during development;
# their counts are diagnostic rather than publication policy. Hosted collection
# uses the explicitly marked per-platform epochs near the end of this file.

[[suite]]
revision = 1
timing_schema_version = 1
protocol_version = 1

[[suite.workloads]]
id = "startup"
source = "performance/workloads/startup/main.rue"
question = "What does a minimal fresh compilation cost end to end?"

# Suite revision 2 freezes ADR-0071's release-quality reference workload. The
# startup probe stays byte-identical so its history continues across the epoch
# boundary; Lattice joins as a separate, independently visible series.
[[suite]]
revision = 2
timing_schema_version = 1
protocol_version = 1

[[suite.workloads]]
id = "startup"
source = "performance/workloads/startup/main.rue"
question = "What does a minimal fresh compilation cost end to end?"

[[suite.workloads]]
id = "lattice"
source = "performance/workloads/lattice/main.rue"
question = "How quickly does Rue produce optimized native output for the frozen ADR-0071 reference program?"

# Suite revision 3 makes ADR-0071's complete fresh-process boundary
# machine-checkable. The workload bytes and questions are unchanged from
# revision 2; protocol v2 adds one runner/compiler proof per process.
[[suite]]
revision = 3
timing_schema_version = 1
protocol_version = 2
boundary = "fresh_source_to_native_v1"

[[suite.workloads]]
id = "startup"
source = "performance/workloads/startup/main.rue"
question = "What does a minimal fresh compilation cost end to end?"

[[suite.workloads]]
id = "lattice"
source = "performance/workloads/lattice/main.rue"
question = "How quickly does Rue produce optimized native output for the frozen ADR-0071 reference program?"

# A development epoch for local runs. Not a collection target: its environment
# policy admits only `local`, so a hosted runner cannot append to it.
[[epoch]]
id = 1
platform = "local"
suite_revision = 1
target = "x86_64-unknown-linux-gnu"
args = []
toolchain_hash = "30f50af0ac7111ffb25d5ef1a423642eaeb2e381931a57583e190a84634ee3fe"

[epoch.workload_source_hashes]
startup = "87869467f94e34b8df41900bda44546b610296077c14fab6defda8939fe22be7"

[epoch.environment]
runner_label = "local"
runner_image = "local"

[epoch.sampling.startup]
samples = 3
batch_size = 5

[epoch.flagging]
k = 3.0
window = 10

