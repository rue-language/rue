# Compiler-performance suite and platform epochs (ADR-0067).
#
# Two layers. A `[[suite]]` pins the platform-independent logical contract:
# which workloads exist, what program each one is, the phase taxonomy, and the
# runner protocol. A `[[epoch]]` pins everything that varies per platform:
# target and invocation, each workload's own source identity, sampling policy,
# environment policy, and the headline baseline.
#
# Changing what a workload *is* requires a new suite revision, and therefore new
# epochs on every participating platform. Changing only one platform's sampling
# creates a new epoch there alone. Both are deliberate, reviewable events.
#
# What is deliberately NOT pinned here is the product being measured: the Rue
# compiler, `std`, and the first-party toolchain. A std change moves the series
# exactly as a compiler change does, is annotated on the dashboard, and never
# invalidates an observation. `toolchain_hash` remains pinned because it names
# the *Rust* toolchain the compiler is built with — build environment, not
# product. See ADR-0067, "The product boundary".
#
# The `local` epochs below let the runner exercise each suite during development;
# their counts are diagnostic rather than publication policy. Hosted collection
# uses the explicitly marked per-platform epochs near the end of this file.

[[suite]]
revision = 1
timing_schema_version = 1
protocol_version = 1

[[suite.workloads]]
id = "startup"
source = "performance/workloads/startup/main.rue"
question = "What does a minimal fresh compilation cost end to end?"

# Suite revision 2 freezes ADR-0071's release-quality reference workload. The
# startup probe stays byte-identical so its history continues across the epoch
# boundary; Lattice joins as a separate, independently visible series.
[[suite]]
revision = 2
timing_schema_version = 1
protocol_version = 1

[[suite.workloads]]
id = "startup"
source = "performance/workloads/startup/main.rue"
question = "What does a minimal fresh compilation cost end to end?"

[[suite.workloads]]
id = "lattice"
source = "performance/workloads/lattice/main.rue"
question = "How quickly does Rue produce optimized native output for the frozen ADR-0071 reference program?"

# Suite revision 3 makes ADR-0071's complete fresh-process boundary
# machine-checkable. The workload bytes and questions are unchanged from
# revision 2; protocol v2 adds one runner/compiler proof per process.
[[suite]]
revision = 3
timing_schema_version = 1
protocol_version = 2
boundary = "fresh_source_to_native_v1"

[[suite.workloads]]
id = "startup"
source = "performance/workloads/startup/main.rue"
question = "What does a minimal fresh compilation cost end to end?"

[[suite.workloads]]
id = "lattice"
source = "performance/workloads/lattice/main.rue"
question = "How quickly does Rue produce optimized native output for the frozen ADR-0071 reference program?"

# Suite revision 4 (RUE-1264) adds the scaling probes ADR-0067 §10 calls for.
#
# Every earlier workload is a single size, and a single point moves the same
# way whether a constant factor doubled or an algorithm changed complexity
# class — and those want completely different responses. Each probe varies
# ONE axis, at two sizes a factor of four apart, so the ratio between the
# sizes is the signal: a linear phase roughly quadruples, and a sustained
# drift in that ratio is a complexity-class change, reportable independently
# of any constant-factor movement. The declared `scaling` table rides the
# derived record so that ratio is recoverable from published data rather
# than by parsing workload ids.
#
# The sources are generated by a committed script beside each probe
# (`performance/workloads/scale_*/generate.py`); `--check` refuses drift, so
# the sources cannot be hand-maintained by accident, and nesting depth in
# every generated file is constant regardless of N — an expression chain
# that grew with N would hit the parser's nesting ceiling and turn the probe
# into a limit test (the RUE-1139 failure shape).
#
# The probes join the §6 headline index like any suite workload: equal
# weighting in log space is the accepted cost, and the per-workload small
# multiples remain the full-size signal. `startup` and `lattice` are
# byte-identical to revision 3, so their histories continue across the
# revision boundary.
[[suite]]
revision = 4
timing_schema_version = 1
protocol_version = 2
boundary = "fresh_source_to_native_v1"

[[suite.workloads]]
id = "startup"
source = "performance/workloads/startup/main.rue"
question = "What does a minimal fresh compilation cost end to end?"

[[suite.workloads]]
id = "lattice"
source = "performance/workloads/lattice/main.rue"
question = "How quickly does Rue produce optimized native output for the frozen ADR-0071 reference program?"

# The module-count probe. Bodies are at the floor so semantic analysis, CFG,
# and the backend contribute a constant per module; discovery, parsing, and
# program construction are what grows. Measured at declaration time under
# the pinned invocation (local epoch 4, x86-64 Linux, -O3 -j1):
# `source_discovery_and_parsing` carries 79% of compiler-root time at 256
# modules, and the 64→256 median ratio was already 8.2× for a 4× size step —
# the probe was born with its finding.
[[suite.workloads]]
id = "scale_modules_064"
source = "performance/workloads/scale_modules/n064/main.rue"
question = "What does discovering, parsing, and assembling a 64-module import chain cost?"

[suite.workloads.scaling]
axis = "module_count"
size = 64

[[suite.workloads]]
id = "scale_modules_256"
source = "performance/workloads/scale_modules/n256/main.rue"
question = "Does the cost of discovering, parsing, and assembling an import chain stay linear from 64 to 256 modules?"

[suite.workloads.scaling]
axis = "module_count"
size = 256

# The function-count probe. One module, N functions of identical small
# shape, each rooted through a flat call in main. The per-function pipeline
# — CFG construction, instruction selection, register allocation,
# scheduling — is where a superlinear backend regression shows first.
# Measured at declaration time under the pinned invocation:
# `cfg_and_optimization` + `backend` carry 45% of compiler-root time at
# 1,024 functions, with `semantic_analysis` at 41% — the per-function
# pipeline crosses both, and the 256→1,024 median ratio was 4.4× for a 4×
# step.
[[suite.workloads]]
id = "scale_functions_0256"
source = "performance/workloads/scale_functions/n0256/main.rue"
question = "What does the per-function CFG and backend pipeline cost across 256 identical functions?"

[suite.workloads.scaling]
axis = "function_count"
size = 256

[[suite.workloads]]
id = "scale_functions_1024"
source = "performance/workloads/scale_functions/n1024/main.rue"
question = "Does the per-function CFG and backend pipeline stay linear from 256 to 1,024 functions?"

[suite.workloads.scaling]
axis = "function_count"
size = 1024

# The instantiation probe. N structurally identical POD structs, each
# instantiating the same generic collection through one fixed-shape
# function. Measured at declaration time under the pinned invocation:
# `semantic_analysis` carries 53% of compiler-root time at 128
# instantiations, and the 32→128 median ratio was 4.0× for a 4× step. A
# declared caveat rather than a silent one: specialization pulls the
# instantiated methods through `cfg_and_optimization` too (25%), because
# that pipeline work is part of what a distinct instantiation costs — the
# probe measures the whole per-instantiation price, with semantic analysis
# its largest component.
[[suite.workloads]]
id = "scale_instantiations_032"
source = "performance/workloads/scale_instantiations/n032/main.rue"
question = "What do 32 distinct generic instantiations cost to analyze and specialize?"

[suite.workloads.scaling]
axis = "instantiation_count"
size = 32

[[suite.workloads]]
id = "scale_instantiations_128"
source = "performance/workloads/scale_instantiations/n128/main.rue"
question = "Does per-instantiation analysis and specialization stay linear from 32 to 128 distinct instantiations?"

[suite.workloads.scaling]
axis = "instantiation_count"
size = 128

