# ---------------------------------------------------------------------------
# Suite revision 4 collection epochs (RUE-1264).
#
# Everything about how these platforms run startup and lattice is epoch 5's —
# same toolchain, boundary, environment, sampling, targets, ratchet, and
# flagging rule — so those two series continue under the conditions they were
# collected. The epoch is new only because the suite revision it implements
# is new: revision 4 adds the six scaling-probe workloads, and an epoch names
# exactly one revision.
#
# Probe sampling is provisional pending each platform's own calibration:
# every probe compiles in hundreds of milliseconds to a few seconds, so
# batching is unnecessary, and the counts below trade sampling cost against
# the ~1–6% per-platform dispersion the startup calibration measured. The
# lattice ratchet and ADR-0071 target carry forward unchanged — the regime
# they gate is identical here.
#
# Each platform's [epoch.baseline] is its first complete valid run under this
# epoch, all three from 170c1014 — the commit that declared the epoch, exactly
# as epoch 5's baselines were pinned at their own declaring commit. Pinned by
# RUE-1533 rather than with the declaration, because a baseline cannot be named
# until collection has produced one; the headline index was absent on every
# platform for the fourteen complete runs, spanning thirty trunk commits, that
# each of them collected in between (RUE-1533).
#
# Measured per-run added cost at declaration time (x86-64 Linux, local):
# roughly 28 seconds of compile time across the six probes at the sampling
# below — the smaller half of what lattice's three samples cost this
# platform before RUE-1510's speedups, and within the existing cadence.
