name = "RueCore"
defaultTargets = ["RueCore"]

[[lean_lib]]
name = "RueCore"

[[lean_exe]]
name = "ruecore-corpus"
root = "RueCore.CorpusMain"

[[lean_exe]]
name = "ruecore-explain"
root = "RueCore.ExplainMain"

[[lean_exe]]
name = "ruecore-digest"
root = "RueCore.DigestMain"
supportInterpreter = true

[[lean_exe]]
name = "ruecore-layers"
root = "RueCore.LayersMain"

[[lean_exe]]
name = "ruecore-lint"
root = "RueCore.LintMain"
supportInterpreter = true

# Lean Comparator's challenge (RUE-2460): the Spec statements with `sorry`
# proofs, generated by `lake exe ruecore-digest --challenge`. Not a default
# target and imported by nothing: only Comparator builds it (README, "The
# statement layer").
[[lean_lib]]
name = "Challenge"
srcDir = "comparator"
